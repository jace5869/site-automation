      does: 'Checks a containerized AAP 2.5+ host: OS, containers and units, logs, database, controller and gateway API, receptor,
        certificates.'
      targets: The AAP host (group aap_hosts) over SSH, sudo to the AAP account (Machine credential); the AAP API (AAP credential).
      produces: HTML and JSON reports on the AAP host (aap_health_report_dir); emailed and on the report website when set.
      supports: Run constraint=Changes target hosts (only its report files on the AAP host; nothing restarted); writes the
        report email/website when set
  - name: AAP - template variables audit
    playbook: playbooks/aap_template_audit.yml
    credentials: [aap]
    optional_credentials: []
    ask_limit: false
    ask_variables: false
    ask_inventory: false
    ee: all
    variables_file: aap/extra_vars/aap_template_audit.yml
    area: Linux
    description:
      does: 'Reads every job and workflow template''s Variables and says which settings belong elsewhere: inventory, all.yml,
        enclave file, credential.'
      targets: AAP via its API (AAP credential; Organization Auditor is enough); the AAP side only, no Limit.
      produces: One report, a table per template, emailed (report_email_to) and on the report website (report_web_dest) when
        set; secrets never shown.
      supports: Run constraint=Reads only (no hosts); changes nothing in AAP; writes the report email and the report website
        when set
  - name: Report website - copy
    playbook: playbooks/report_web_copy.yml
    credentials: [machine_windows, aap]
    optional_credentials: []
    ask_limit: true
    ask_variables: false
    ask_inventory: false
    ee: windows
    variables_file: aap/extra_vars/report_web_copy.yml
    area: Reports
    description:
      does: 'Copies report pages kept as job artifacts (report_web_copy: true) onto the report website, for report jobs that
        cannot reach the web server.'
      targets: The web server report_web_host over WinRM (Machine (Windows) credential), or the folder or upload address;
        AAP API to read report jobs.
      produces: The report pages on the report website (report_web_dest); job artifact site_report_copied marks where the
        run got to.
      supports: Run constraint=Changes target hosts (writes report pages into report_web_dest); writes the report website
        only; Check = lists what it would copy
  - name: Outage AAR - Word document
    playbook: playbooks/incident_aar.yml
    credentials: []
    optional_credentials: [act_model_key]
    ask_limit: false
    ask_variables: false
    ask_inventory: false
    ee: all
    variables_file: aap/extra_vars/incident_aar.yml
    area: Linux
    description:
      does: Turns the outage details typed in the survey into an after action report Word document (AAR.docx), with an SOP
        from it when asked.
      targets: The AAP side only (localhost); no hosts and no machine credential; an ACT model key credential only for the
        ACT options.
      produces: AAR.docx (and the SOP when asked), emailed to the survey's addresses and incident_docs_email_to; never on
        the report website.
      supports: Run constraint=Reads only (no hosts); writes only the email; sends the survey text to the ACT model only with
        an ACT option; Check = dry run
  - name: SOP - Word document
    playbook: playbooks/incident_sop.yml
    credentials: []
    optional_credentials: [act_model_key]
    ask_limit: false
    ask_variables: false
    ask_inventory: false
    ee: all
    variables_file: aap/extra_vars/incident_sop.yml
    area: Linux
    description:
      does: Turns the SOP typed in the survey (purpose, steps to troubleshoot, fix and check, escalation) into a Word document.
      targets: The AAP side only (localhost); no hosts and no machine credential; an ACT model key credential only for the
        ACT options.
      produces: The SOP Word document, emailed to the survey's addresses and incident_docs_email_to; never on the report website.
      supports: Run constraint=Reads only (no hosts); writes only the email; sends the survey text to the ACT model only with
        an ACT option; Check = dry run
  - name: AAP - incident document surveys
    playbook: playbooks/incident_docs_survey.yml
    credentials: [aap]
    optional_credentials: []
    ask_limit: false
    ask_variables: false
    ask_inventory: false
    ee: all
    variables_file: aap/extra_vars/incident_docs_survey.yml
    area: Linux
    description:
      does: Writes the survey questions of the 'Outage AAR - Word document' and 'SOP - Word document' templates into AAP;
        run once after making them.
      targets: AAP via its API (AAP credential, Admin on the two templates); the AAP side only, no Limit.
      produces: About twenty survey questions on each of the two templates; the job output lists what was added or left as
        it is.
      supports: 'Run constraint=Reads only (no hosts); writes AAP surveys of the two templates (removes with incident_docs_survey_state:
        absent); Check = dry run'
workflows:
  - name: Auditd tuning, with an approval
    playbooks:
      - playbooks/auditd_tuning.yml
      - playbooks/workflow_gate.yml
      - playbooks/auditd_tuning.yml
    description:
      does: Reads the audit backlog, queue and kernel argument of container hosts; makes the listed changes once a person
        approves.
      targets: Linux container hosts (the Limit), over SSH with sudo (Machine credential).
      produces: The changes to approve, the approval, what was changed and what waits for the next reboot (report email/website).
      supports: Run constraint=Changes the audit config (backed up; auditd restarted) after an approval; never reboots; writes
        email/website.
  - name: Checklists imported into STIG Manager
    playbooks:
      - playbooks/stigman_ckl_import.yml
      - playbooks/workflow_gate.yml
      - playbooks/stigman_update.yml
    description:
      does: Reads checklists (CKL, CKLB) on a share, plans their reviews and new assets, and writes them to STIG Manager once
        a person approves.
      targets: 'The AAP side only: the checklist share and the STIG Manager API. No servers are logged into.'
      produces: Import report (emailed, on the report website), optional STIG scorecard, the approval, and the update's report
        of what was written.
      supports: Run constraint=Writes STIG Manager (reviews, new assets) after an approval; writes email, report website.
        Watcher setup also moves share files.
  - name: ACT - triage finding
    playbooks:
      - playbooks/act_triage_finding.yml
      - playbooks/act_triage_finding.yml
    description:
      does: 'The site portal''s Ask ACT: one fapolicyd or event-log finding from an earlier job explained by ACT (GenAI),
        likely cause and fix.'
      targets: One Linux or Windows host (the Limit); each step skips hosts of the other OS. ACT runs on the AAP side.
      produces: ACT's explanation in the job, its report (emailed, on the report website) and the portal's job page.
      supports: Run constraint=Read-only on hosts; applies no fix; writes email, report website.
  - name: STIG - recheck one host
    playbooks:
      - playbooks/stig_recheck.yml
      - playbooks/win_stig_recheck.yml
    description:
      does: 'The site portal''s Recheck: the rules STIG Manager has Open or Not Reviewed checked again on one host, to see
        what is fixed now.'
      targets: One Linux or Windows host (the Limit); each step passes over hosts of the other kind.
      produces: Recheck report (emailed, on the report website); the recheck checklist kept on the host.
      supports: Run constraint=Read-only (STIG Manager only read); writes a checklist file on the host, email, report website.
  - name: STIG - recheck and update STIG Manager
    playbooks:
      - playbooks/stig_finding_recheck.yml
      - playbooks/win_stig_finding_recheck.yml
      - playbooks/workflow_gate.yml
      - playbooks/workflow_gate.yml
      - playbooks/stigman_update.yml
    description:
      does: 'The site portal''s Update STIG Manager: one STIG rule rechecked on one host; if it passes now, its review is
        written after approval.'
      targets: One Linux or Windows host (the Limit) for the recheck; the STIG Manager API for the update.
      produces: Recheck result on the portal's job page, the approval, and the update's report of the review written.
      supports: Run constraint=Writes STIG Manager (one review) after an approval; the hosts are only read; writes email.
  - name: STIG - fix one rule
    playbooks:
      - playbooks/stig_fix_rule.yml
      - playbooks/workflow_gate.yml
      - playbooks/stig_fix_apply.yml
      - playbooks/stig_finding_recheck.yml
      - playbooks/workflow_gate.yml
      - playbooks/stigman_update.yml
    description:
      does: 'The site portal''s Fix rule: ACT proposes exact commands for one failed STIG rule; once approved they run, then
        a recheck and its review.'
      targets: One Linux host (the Limit); the STIG Manager API for the review. Never CAT I or account, SSH, audit or crypto
        rules.
      produces: ACT's proposal, the approval, the fix job's output, the recheck result and the STIG Manager review.
      supports: Run constraint=Changes the host (the approved commands) after an approval; then writes STIG Manager (its review)
        with no second approval.
  - name: STIG - create the asset in STIG Manager
    playbooks:
      - playbooks/stig_finding_recheck.yml
      - playbooks/workflow_gate.yml
      - playbooks/stigman_update.yml
    description:
      does: 'The site portal''s Create asset: a host missing from STIG Manager scanned in full; its asset and the scan''s
        answers created after approval.'
      targets: One Linux host (the Limit) for the scan; the STIG Manager API for the new asset.
      produces: Scan result and plan, the approval, and the update's report of the asset and reviews made.
      supports: Run constraint=Writes STIG Manager (new asset, its reviews) after an approval; the host is only scanned; writes
        email.
  - name: Disk - clean up (approved)
    playbooks:
      - playbooks/disk_cleanup_plan.yml
      - playbooks/workflow_gate.yml
      - playbooks/disk_cleanup.yml
    description:
      does: 'The site portal''s Clean up on a full filesystem: plans the old files in its tmp folders and deletes them once
        a person approves.'
      targets: One Linux host and one mount (the Limit), from a disk_full finding of an earlier health check.
      produces: The cleanup plan, the approval, what was deleted and the space after, on the portal's job page.
      supports: Run constraint=Changes the target host (old files in the approved tmp folders, rules at run time) after an
        approval; writes report email/website.
  - name: Service - restart
    playbooks:
      - playbooks/service_restart.yml
      - playbooks/service_restart.yml
      - playbooks/workflow_gate.yml
      - playbooks/service_restart.yml
      - playbooks/service_restart.yml
    description:
      does: 'The site portal''s Restart on a service_down finding: shows the service''s status and log, then restarts that
        one service once approved.'
      targets: One Linux or Windows host (the Limit); each step passes over hosts of the other OS.
      produces: Status and last log lines, the approval, and the result (fixed or not) on the portal's job page.
      supports: Run constraint=Changes the target host (restarts one service) after an approval; never one on portal_restart_never.
  - name: fapolicyd - allow this
    playbooks:
      - playbooks/fapolicyd_allow.yml
      - playbooks/workflow_gate.yml
      - playbooks/fapolicyd_allow.yml
    description:
      does: 'The site portal''s Allow this: picks the one fapolicyd change (trust entry or rule) for one denial and makes
        it once a person approves.'
      targets: One Linux host (the Limit), from a fapolicyd_deny finding of an earlier job.
      produces: The one proposed line, the approval, and the result (fixed or not) on the portal's job page.
      supports: Run constraint=Changes the host's fapolicyd trust or rules (a security control) after an approval; never permissive
        mode.
  - name: Service watch - approve or self-heal
    playbooks:
      - playbooks/service_watch.yml
      - playbooks/workflow_gate.yml
      - playbooks/service_fix_approved.yml
    description:
      does: Watches podman containers that should run; when one is down ACT (GenAI) finds why and its fix is applied after
        approval, or at once.
      targets: Linux container hosts (Limit prompted on launch).
      produces: ACT's root cause and proposed fix in the job, the approval, an incident record on the host (log file, syslog).
      supports: Run constraint=Changes hosts (starts or restarts containers) after an approval; with watch_mode self-heal
        at once, no approval.
  - name: Horizon - fix broken desktops (workflow)
    playbooks:
      - playbooks/horizon_desktops_check.yml
      - playbooks/workflow_gate.yml
      - playbooks/horizon_desktops_fix_approved.yml
    description:
      does: Finds Horizon desktops in a broken state and, once a person approves the list, recovers or removes the ones still
        broken.
      targets: The Horizon Connection Server API, from the AAP side. No servers are logged into.
      produces: The broken-desktop list (NEEDS APPROVAL line), the approval, and the fix job's report of each desktop.
      supports: Run constraint=Writes Horizon (recovers or removes desktops) after an approval; never one with a session or
        in a protected pool.
  - name: Horizon - image push (workflow)
    playbooks:
      - playbooks/horizon_image_push_plan.yml
      - playbooks/horizon_image_push_approved.yml
    description:
      does: Checks a golden image push plan (pools, image VM, snapshot, start, log-off policy) and schedules the push once
        a person approves.
      targets: The Horizon Connection Server API, from the AAP side, for the instant-clone pools picked in the survey.
      produces: The push plan (READY FOR APPROVAL line), the approval, and the scheduled push in Horizon.
      supports: Run constraint=Writes Horizon (schedules an image push; users logged off per policy) after an approval; the
        plan step is read-only.
  - name: Horizon - host maintenance (workflow)
    playbooks:
      - playbooks/horizon_host_maintenance_plan.yml
      - playbooks/horizon_host_maintenance_start.yml
      - playbooks/horizon_host_maintenance_end.yml
    description:
      does: 'Before ESXi host work: its free desktops into Horizon maintenance mode and users messaged; a second approval
        brings them back.'
      targets: The Horizon Connection Server API, for the desktops on one ESXi host named in the survey.
      produces: The plan of desktops and sessions, two approvals, a message to users, and each step's job output.
      supports: Run constraint=Writes Horizon (maintenance mode, user messages) after each approval; vCenter is not changed
        by it.
  - name: VM snapshot cleanup (with approval)
    playbooks:
      - playbooks/vm_snapshot_report.yml
      - playbooks/vm_snapshot_cleanup.yml
    description:
      does: Lists every VM snapshot and deletes the ones older than the survey's days once a person approves the report's
        list.
      targets: vCenter, from the AAP side. Never keep-named snapshots, excluded or protected VMs, or the AAP server.
      produces: Snapshot report email, the approval, and the cleanup's email of what it deleted.
      supports: Run constraint=Writes vCenter (deletes old VM snapshots) after an approval; writes email.
  - name: VM - delete picked snapshots (workflow)
    playbooks:
      - playbooks/vm_snapshot_delete_picked.yml
      - playbooks/vm_snapshot_delete_picked.yml
    description:
      does: 'Service desk tool: the snapshots ticked in the survey are planned, then deleted exactly as planned once a person
        approves.'
      targets: vCenter, from the AAP side; only snapshots offered by the pick list and still allowed.
      produces: The plan, the approval, and the delete job's output.
      supports: Run constraint=Writes vCenter (deletes the picked snapshots) after an approval.
  - name: VM - restart picked VMs (workflow)
    playbooks:
      - playbooks/vm_reboot_picked.yml
      - playbooks/vm_reboot_picked.yml
    description:
      does: 'Service desk tool: the VMs ticked in the survey are planned, then restarted (guest restart or hard reset) once
        a person approves.'
      targets: vCenter, from the AAP side; never the AAP server or a protected VM.
      produces: The plan, the approval, and the restart job's output.
      supports: Run constraint=Writes vCenter (restarts or resets the picked VMs) after an approval.
  - name: VM - outage watch (workflow)
    playbooks:
      - playbooks/vm_outage_watch.yml
      - playbooks/servicenow_tickets.yml
    description:
      does: 'Every 5 to 15 minutes: is a host, datastore or VM down or hung in vCenter now; opens, notes and clears ServiceNow
        incidents.'
      targets: vCenter, from the AAP side; the tickets step runs on the controller.
      produces: Quiet when clean; a report email when something is down; ServiceNow incidents and work notes.
      supports: Run constraint=Read-only on vCenter, restarts nothing; writes ServiceNow incidents, email.
  - name: VM - deploy from ServiceNow ticket (workflow)
    playbooks:
      - playbooks/vm_deploy_from_ticket.yml
      - playbooks/vm_deploy_from_ticket.yml
    description:
      does: 'Builds the VMs a ServiceNow ticket asks for: the first run checks and places them, a person approves, the second
        run builds them.'
      targets: vCenter and the ServiceNow ticket, from the AAP side.
      produces: The plan on the ticket and in an email, the approval, the new VMs, and the result (IP included) on the ticket.
      supports: Run constraint=Writes vCenter (new VMs) after an approval; writes ServiceNow ticket notes (before and after),
        email.
  - name: Network config load (workflow)
    playbooks:
      - playbooks/net_config_load.yml
      - playbooks/net_config_load.yml
    description:
      does: 'Loads an approved change onto network devices: a dry run shows what would be sent, a person approves, the real
        run sends it.'
      targets: Network devices (Cisco IOS, PAN-OS firewalls) of the change, over SSH or the API.
      produces: The dry run's report, the approval, the run's report and email, a note on the change request.
      supports: Run constraint=Changes device configs (save or commit) after an approval; writes ServiceNow change, config
        backup, email.
  - name: Mail relay - add an IP
    playbooks:
      - playbooks/mail_relay_plan.yml
      - playbooks/mail_relay_approved.yml
    description:
      does: 'Adds the IP addresses in the survey to the SMTP relay whitelist: the plan is emailed, a person approves, the
        lines are written.'
      targets: 'The mail relay servers (group mail_relays): Postfix main.cf mynetworks.'
      produces: Plan email (waiting for approval), the approval, and a result email.
      supports: Run constraint=Changes relay hosts (main.cf, Postfix reload; backed up first) after an approval; writes email.
  - name: Mail relay - remove an IP
    playbooks:
      - playbooks/mail_relay_plan.yml
      - playbooks/mail_relay_approved.yml
    description:
      does: 'Removes the IP addresses in the survey from the SMTP relay whitelist: the plan is emailed, a person approves,
        they are removed.'
      targets: 'The mail relay servers (group mail_relays): Postfix main.cf mynetworks.'
      produces: Plan email (waiting for approval), the approval, and a result email.
      supports: Run constraint=Changes relay hosts (main.cf, Postfix reload; backed up first) after an approval; writes email.
  - name: Mail relay - remove unused addresses
    playbooks:
      - playbooks/mail_relay_unused.yml
      - playbooks/mail_relay_approved.yml
    description:
      does: Finds whitelist addresses that sent no mail through any relay in six months and removes them once a person approves.
      targets: 'The mail relay servers (group mail_relays): their whitelist and mail logs.'
      produces: Plan email with the unused-address tables, the approval, and a result email.
      supports: Run constraint=Changes relay hosts (removes addresses, Postfix reload) after an approval; subnets never removed;
        writes email.
  - name: Daily health
    playbooks:
      - playbooks/health_check.yml
      - playbooks/servicenow_tickets.yml
    description:
      does: 'Every morning: the daily health checks on Linux hosts, and a ServiceNow incident for each problem (noted again
        when it clears).'
      targets: Linux hosts of the health check's inventory; the tickets step runs on the controller.
      produces: Health report (emailed, on the report website), ServiceNow incidents and work notes.
      supports: Run constraint=Read-only on hosts (a small disk-history file only); writes ServiceNow incidents, email, report
        website.
  - name: Weekly compliance
    playbooks:
      - playbooks/health_check.yml
      - playbooks/servicenow_tickets.yml
      - playbooks/cert_report.yml
      - playbooks/servicenow_tickets.yml
      - playbooks/poam_status.yml
      - playbooks/servicenow_tickets.yml
    description:
      does: 'Weekly: the security health checks, the certificate report and the POA&M status, each followed by its ServiceNow
        tickets.'
      targets: Linux hosts (health, certificates); POA&M list and optional STIG Manager read on the controller.
      produces: Health, certificate and POA&M reports (emailed, on the report website); ServiceNow incidents.
      supports: Run constraint=Read-only on hosts and STIG Manager; writes ServiceNow incidents, email, report website.
  - name: Patch with checks
    playbooks:
      - playbooks/health_check.yml
      - playbooks/patch_hosts.yml
      - playbooks/health_check.yml
      - playbooks/servicenow_tickets.yml
      - playbooks/servicenow_tickets.yml
    description:
      does: 'Monthly patching: a health pre-check, a person approves, the hosts are patched, a post-check, and tickets for
        what is wrong.'
      targets: Linux hosts in the Limit (e.g. patch_hosts); never AAP hosts or no_patch groups.
      produces: Pre and post health reports, the patch report (emailed, on the report website), ServiceNow incidents.
      supports: Run constraint=Changes hosts (installs updates; reboots only if asked; optional vCenter snapshot) after an
        approval; writes ServiceNow, email.
  - name: Patch with a dry run first
    playbooks:
      - playbooks/health_check.yml
      - playbooks/patch_hosts.yml
      - playbooks/patch_hosts.yml
      - playbooks/health_check.yml
      - playbooks/servicenow_tickets.yml
    description:
      does: As Patch with checks, but a dry run lists every package first so the approver sees exactly what will be installed.
      targets: Linux hosts in the Limit; never AAP hosts or no_patch groups.
      produces: Pre-check, DRY RUN patch report, the approval, the patch report, post-check, ServiceNow incidents.
      supports: Run constraint=Changes hosts (installs updates; reboots only if asked; optional vCenter snapshot) after an
        approval; writes ServiceNow, email.
  - name: Fix with approval (ACT)
    playbooks:
      - playbooks/health_check.yml
      - playbooks/servicenow_tickets.yml
      - playbooks/act_fix_approved.yml
      - playbooks/servicenow_tickets.yml
    description:
      does: A health check where ACT (GenAI) proposes a fix for problems; a person approves, and exactly those commands run,
        then the checks again.
      targets: Linux hosts of the health check (Limit as launched); ACT reads on the hosts.
      produces: Health report with ACT's analysis, the approval, the fix job's re-check, ServiceNow incidents.
      supports: Run constraint=Changes hosts (ACT's proposed commands) after an approval; writes ServiceNow incidents, email,
        report website.
  - name: Security posture
    playbooks:
      - playbooks/health_check.yml
      - playbooks/servicenow_tickets.yml
      - playbooks/poam_status.yml
      - playbooks/servicenow_tickets.yml
    description:
      does: Weekly STIG-related checks (SELinux, fapolicyd, auditd, accounts) and the POA&M status, with ServiceNow tickets.
      targets: Linux hosts (health checks); POA&M list and optional STIG Manager read on the controller.
      produces: Health and POA&M reports (emailed, on the report website), ServiceNow incidents.
      supports: Run constraint=Read-only on hosts and STIG Manager; writes ServiceNow incidents, email, report website.
  - name: Certificate watch
    playbooks:
      - playbooks/cert_report.yml
      - playbooks/servicenow_tickets.yml
      - playbooks/cert_renew_csr.yml
    description:
      does: 'Daily: every certificate that expires soon on Linux hosts, an incident for each, and a new key and CSR on its
        ticket.'
      targets: Linux hosts (not cert_skip_hosts or Satellite); the tickets step runs on the controller.
      produces: Certificate report (emailed, on the report website), ServiceNow incidents, CSRs attached to them.
      supports: Run constraint=No approval; writes new key and CSR files on hosts (nothing in use changed), ServiceNow incidents
        and CSRs, email.
  - name: Certificate install, with an approval
    playbooks:
      - playbooks/cert_install_check.yml
      - playbooks/workflow_gate.yml
      - playbooks/cert_install_approved.yml
    description:
      does: 'Daily: finds issued certificates waiting on their ServiceNow requests and installs them on Linux hosts once a
        person approves.'
      targets: Linux hosts with a pending renewal; their ServiceNow requests (read).
      produces: Check output (READY lines), the approval, install results, a work note on each request.
      supports: Run constraint=Changes hosts (cert files, service reload; old files kept, restored on error) after an approval;
        writes ServiceNow notes.
  - name: Windows certificate install, with an approval
    playbooks:
      - playbooks/win_cert_install_check.yml
      - playbooks/workflow_gate.yml
      - playbooks/win_cert_install_approved.yml
    description:
      does: Finds issued certificates waiting on their ServiceNow requests and installs them on Windows servers once a person
        approves.
      targets: Windows servers with a pending renewal (WinRM); their ServiceNow requests (read).
      produces: Check output (READY lines), the approval, install results, a work note on each request.
      supports: Run constraint=Changes servers (cert store, IIS/RDP/WinRM bindings; old cert kept) after an approval; writes
        ServiceNow notes.
  - name: fapolicyd, with an approval
    playbooks:
      - playbooks/fapolicyd.yml
      - playbooks/workflow_gate.yml
      - playbooks/fapolicyd.yml
    description:
      does: 'Daily: what keeps fapolicyd down or what it blocked, and each host''s fix lines; once a person approves, those
        lines are made.'
      targets: Linux hosts in the Limit (the hosts that must run fapolicyd).
      produces: fapolicyd report (emailed, on the report website), the approval, the approved job's output.
      supports: Run constraint=Changes hosts' fapolicyd (start, trust, rules, mode) after an approval; a security control;
        writes email, website.
  - name: STIG Manager updated, with an approval
    playbooks:
      - playbooks/stig_recheck.yml
      - playbooks/workflow_gate.yml
      - playbooks/stigman_update.yml
    description:
      does: Rechecks the rules STIG Manager has Open or Not Reviewed on Linux hosts and writes the changed reviews once a
        person approves.
      targets: Linux hosts (the Limit) for the recheck; the STIG Manager API for the update.
      produces: Recheck report (emailed, on the report website), the approval, the update's report of reviews written.
      supports: Run constraint=Writes STIG Manager (reviews; new assets if set) after an approval; hosts only read (a checklist
        file kept).
  - name: STIG Manager updated, with an approval (Windows)
    playbooks:
      - playbooks/win_stig_recheck.yml
      - playbooks/workflow_gate.yml
      - playbooks/stigman_update.yml
    description:
      does: Rechecks the rules STIG Manager has Open or Not Reviewed on Windows servers and writes the changed reviews once
        a person approves.
      targets: Windows servers (the Limit) for the recheck; the STIG Manager API for the update.
      produces: Recheck report (emailed, on the report website), the approval, the update's report of reviews written.
      supports: Run constraint=Writes STIG Manager (reviews) after an approval; servers only read (a checklist file kept).
  - name: STIG drift
    playbooks:
      - playbooks/stig_drift_report.yml
      - playbooks/servicenow_tickets.yml
    description:
      does: Weekly STIG scan of Linux hosts compared with STIG Manager and earlier scans; an incident per host that drifted.
      targets: Linux hosts of the target group; STIG Manager read; the tickets step on the controller.
      produces: STIG drift report (emailed, on the report website), scan results kept on the host, ServiceNow incidents.
      supports: Run constraint=Read-only (STIG Manager only read); writes scan files on hosts, ServiceNow incidents, email,
        report website.
  - name: Network performance
    playbooks:
      - playbooks/net_perf_report.yml
      - playbooks/servicenow_tickets.yml
    description:
      does: 'Hourly: latency, loss, refused ports, interface drops and OCSP from Linux hosts against their usual; incidents
        for problems.'
      targets: Linux hosts of the target group (measuring from them); the tickets step on the controller.
      produces: Network performance report (emailed, on the report website), ServiceNow incidents.
      supports: Run constraint=Read-only (keeps its own history file on each host); writes ServiceNow incidents, email, report
        website.
  - name: 'Database watch: MariaDB and MySQL'
    playbooks:
      - playbooks/database_health.yml
      - playbooks/servicenow_tickets.yml
    description:
      does: Hourly MariaDB and MySQL health (running, connections, replication, errors) with a ServiceNow incident for each
        problem.
      targets: Database hosts (mariadb_hosts, mysql_hosts, database_hosts groups) and their podman containers.
      produces: Database health report (emailed, on the report website), ServiceNow incidents.
      supports: Run constraint=Read-only (status queries only); writes ServiceNow incidents, email, report website.
  - name: Investigate a host
    playbooks:
      - playbooks/troubleshoot.yml
      - playbooks/health_check.yml
    description:
      does: 'On demand for one host: the troubleshooting commands, ACT''s (GenAI) explanation, then every health check.'
      targets: One Linux host (the Limit).
      produces: Troubleshooting output with ACT's explanation, and a full health report (emailed, on the report website).
      supports: Run constraint=Read-only on the host (ACT explains only); no tickets; writes email, report website.
  - name: STIG Manager deploy with checks
    playbooks:
      - playbooks/stigman_deploy.yml
      - playbooks/stigman_deploy.yml
      - playbooks/service_watch.yml
      - playbooks/health_check.yml
    description:
      does: 'Deploys or updates the STIG Manager stack: a dry run first, a person approves, the real run, then container and
        health checks.'
      targets: 'The STIG Manager servers (group stigman): podman MySQL, STIG Manager and nginx.'
      produces: Dry run diff, the approval, the deploy output, service watch and health reports.
      supports: Run constraint=Changes STIG Manager servers (containers, files, units, TLS) after an approval; Keycloak untouched;
        writes email.
  - name: Disk space and the tmp cleanup, with an approval
    playbooks:
      - playbooks/disk_report.yml
      - playbooks/tmp_cleanup.yml
      - playbooks/disk_report.yml
    description:
      does: Daily disk and thin pool report; once a person approves, old /tmp and /var/tmp files on full filesystems are deleted,
        then a report.
      targets: Linux hosts of the inventory (Limit as launched).
      produces: Disk space report email and web page (before and after), the approval, the cleanup's list of deletions.
      supports: Run constraint=Changes hosts (deletes old tmp files on full filesystems) after an approval; writes email,
        report website.
  - name: STIG Manager availability, with tickets
    playbooks:
      - playbooks/stigman_availability.yml
      - playbooks/servicenow_tickets.yml
    description:
      does: 'Every 5 to 15 minutes: is STIG Manager (API, database, Keycloak) answering; an incident while it is down, a note
        when it is back.'
      targets: STIG Manager's web address and nodes, asked over HTTPS from the AAP side (no login).
      produces: One quiet line when up; ServiceNow incidents and notes; the report email/website when down or back again,
        when set.
      supports: Run constraint=Read-only; writes ServiceNow incidents and notes (resolves only with servicenow_resolve_cleared),
        report email/website.
  - name: Windows daily health
    playbooks:
      - playbooks/win_health_check.yml
      - playbooks/servicenow_tickets.yml
    description:
      does: 'Every morning: the daily health checks on Windows servers, and a ServiceNow incident for each problem.'
      targets: Windows servers over WinRM; the tickets step runs on the controller.
      produces: Health report (emailed, on the report website), an event log entry per finding, ServiceNow incidents.
      supports: Run constraint=Read-only on servers (one Application event log entry per finding); writes ServiceNow incidents,
        email.
  - name: Windows weekly compliance
    playbooks:
      - playbooks/win_health_check.yml
      - playbooks/servicenow_tickets.yml
      - playbooks/win_cert_report.yml
      - playbooks/servicenow_tickets.yml
      - playbooks/win_cert_renew_csr.yml
    description:
      does: Weekly Windows security checks and certificate report with tickets, and a new key and CSR on the ticket of each
        expiring certificate.
      targets: Windows servers over WinRM; the tickets step runs on the controller.
      produces: Health and certificate reports (emailed, on the report website), ServiceNow incidents with CSRs attached.
      supports: Run constraint=No approval; writes pending cert requests on servers (nothing in use changed), event log entries,
        ServiceNow, email.
  - name: Windows patch with a dry run first
    playbooks:
      - playbooks/win_health_check.yml
      - playbooks/win_patch.yml
      - playbooks/win_patch.yml
      - playbooks/win_health_check.yml
      - playbooks/servicenow_tickets.yml
    description:
      does: 'Windows patching: pre-check, a dry run of what Software Center offers, a person approves, install, post-check
        and tickets.'
      targets: Windows servers in the Limit (win_patch_hosts), inside their ConfigMgr maintenance window.
      produces: Pre and post health reports, the dry run list, the approval, patch output, ServiceNow incidents.
      supports: Run constraint=Changes servers (installs ConfigMgr updates; restarts only if asked) after an approval; writes
        ServiceNow, email.
  - name: ACT for Windows rollout
    playbooks:
      - playbooks/win_act_install.yml
      - playbooks/win_act_install.yml
    description:
      does: 'Installs or updates the ACT tool on Windows servers: a dry run says what would change, a person approves, then
        the real run.'
      targets: Windows servers in the Limit (a group at a time), over WinRM.
      produces: Dry run list per server (install, update, current), the approval, the install output.
      supports: Run constraint=Changes servers (ACT files in C:\ProgramData\act, folder rights) after an approval.
  - name: 'Windows: investigate a server'
    playbooks:
      - playbooks/win_troubleshoot.yml
      - playbooks/win_health_check.yml
    description:
      does: 'On demand for one Windows server: the troubleshooting commands for an area, then every health check.'
      targets: One Windows server (the Limit), over WinRM.
      produces: Troubleshooting output and a full health report (emailed, on the report website).
      supports: Run constraint=Read-only (the health check adds one event log entry per finding); no tickets; writes email.
  - name: Everything, every morning
    playbooks:
      - playbooks/health_check.yml
      - playbooks/servicenow_tickets.yml
      - playbooks/win_health_check.yml
      - playbooks/servicenow_tickets.yml
      - playbooks/cert_report.yml
      - playbooks/servicenow_tickets.yml
    description:
      does: 'Every morning in one workflow: Linux and Windows daily health and the certificate report, each with its ServiceNow
        tickets.'
      targets: Linux hosts and Windows servers, each step on its own template's inventory.
      produces: Linux, Windows and certificate reports (emailed, on the report website), ServiceNow incidents.
      supports: Run constraint=Read-only on hosts (history file, event log entries only); writes ServiceNow incidents, email,
        report website.
  - name: 'VMware daily checks: health, alarms, then ACT''s analysis'
    playbooks:
      - playbooks/vm_health_report.yml
      - playbooks/vm_alarm_report.yml
      - playbooks/vm_alarm_act_analysis.yml
    description:
      does: 'Daily vSphere look: cluster and host health, alarms and the day''s events, then ACT''s (GenAI) likely cause and
        fix for each problem.'
      targets: vCenter, from the AAP side. No ESXi host or VM is logged into.
      produces: 'Three emails: the health report, the alarms report and ACT''s analysis.'
      supports: Run constraint=Read-only on vCenter; writes email.
  - name: vCenter and ESXi certificate install, with an approval
    playbooks:
      - playbooks/vmware_cert_install_check.yml
      - playbooks/workflow_gate.yml
      - playbooks/vmware_cert_install_approved.yml
    description:
      does: Finds issued certificates for vCenter and ESXi hosts on their ServiceNow requests and installs them once a person
        approves.
      targets: vCenter and its ESXi hosts, from the AAP side; their ServiceNow requests (read).
      produces: Check output (READY lines), the approval, install results, a work note on each request.
      supports: Run constraint=Writes vCenter/ESXi certs and trusted roots after an approval (vCenter may restart); writes
        ServiceNow notes.
vendored:
  - name: ACT - apply approved (vendored)
    playbook: vendor/act/ansible/playbooks/act_apply_approved.yml
    description:
      does: 'ACT''s own step after an approval: ACT checks each host again and, if still broken, may run only the commands
        a person approved.'
      targets: Hosts of target (default all) within the Limit that the act_triage artifact has commands for, over SSH with
        sudo; ACT model key
      produces: What ACT found and ran per host in the job output and a Markdown report; a Teams card with a webhook; file
        edits left for a person
      supports: Run constraint=Changes target hosts (only the approved commands, only if still needed); writes ACT's script,
        the report, Teams
  - name: ACT - fapolicyd denials (vendored)
    playbook: vendor/act/ansible/playbooks/fapolicyd_denials.yml
    description:
      does: ACT's own fapolicyd denial analysis - the site's job is playbooks/fapolicyd_denials.yml (its report by email and
        on the website).
      targets: Linux hosts of target (default all) within the Limit, over SSH with sudo (Machine credential); ACT model key
      produces: ACT's analysis per host in the job output and a Markdown report on the controller; a Teams card with a webhook,
        if problems
      supports: Run constraint=No fix (ACT runs nothing there); writes ACT's script on hosts with denials, the report, the
        Teams card
  - name: ACT - podman health (vendored)
    playbook: vendor/act/ansible/playbooks/podman_app_health.yml
    description:
      does: 'ACT''s own podman check: finds the containers podman runs (or podman_apps), checks them, and has ACT diagnose
        the broken ones.'
      targets: Linux hosts of target (default all) within the Limit, over SSH with sudo, as podman_user when set (Machine
        credential); ACT model key
      produces: ACT's diagnosis in the job output and a Markdown report on the controller; a Teams card with a webhook, by
        default only for problems
      supports: Run constraint=No fix by default (restarts only with podman_allow_restart); writes ACT's script on hosts it
        diagnoses, the report
  - name: ACT - triage (vendored)
    playbook: vendor/act/ansible/playbooks/act_triage.yml
    description:
      does: 'ACT''s own triage: cheap health checks on every host, ACT called only where one trips, to diagnose it; fixes
        only as allowed.'
      targets: Linux hosts of target (default all) within the Limit, over SSH with sudo (Machine credential); ACT model key
      produces: Findings in the job output, a Markdown report on the controller, the act_triage artifact; Teams card with
        a webhook, if problems
      supports: Run constraint=No fix unless act_triage_allow lists one; writes ACT's script on hosts it diagnoses, the report,
        the Teams card
