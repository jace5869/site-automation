# ==================================================================================================
# Variables for the job template "VM - deploy from ServiceNow ticket"
#   playbook:    playbooks/vm_deploy_from_ticket.yml
#   credentials: VMware vCenter, ServiceNow API, ACT model key (Red Hat Ansible Automation Platform with vm_deploy_services inventories)
#
# HOW TO USE: copy this file into the template's Variables box (YAML selected).
#   - A setting starting with "# " is switched off. To use it, delete the "# " in front of its
#     line (and of the indented lines under it), then change the value. Lines starting with
#     "## " say what the setting below them does.
#   - Switch on only what you change: a value here beats the same setting everywhere else,
#     including playbooks/group_vars/all.yml. The values shown are the defaults.
#   - The settings under "usually in all.yml" apply to every job: set them once there.
#   - Every setting, in full: docs/VARIABLES_REFERENCE.md (the Settings Reference PDF).
# GENERATED by scripts/gen_template_vars.py from roles/*/defaults/main.yml - do not edit here.
# ==================================================================================================
---
# ---- fill these in first (the CAPITALS) ------------------------------------------------------
vm_deploy_templates: [TEMPLATE-NAME]              # REQUIRED: only these templates are ever deployed
vm_deploy_pxe_templates: [TEMPLATE-NAME]          # empty ones (MECM network boot or a kickstart CD); [] for none
vm_deploy_assignment_group: YOUR GROUP NAME       # only tickets assigned to this group
vm_deploy_name_rules:                             # the VM's name picks the cluster; quotes keep the * safe
  - {match: "*AB01*", cluster: "CLUSTER-1", datacenter: "DATACENTER-1", vcenter: "vcenter1.yoursite.mil"}
  - {match: "*CD02*", cluster: "CLUSTER-2", datacenter: "DATACENTER-2", vcenter: "vcenter2.yoursite.mil"}
                                                  # datacenter / vcenter: only when not the template's own
## VM names: 63 characters by default, and Windows is held to 15 on its own - no vm_deploy_name_regex needed
# vm_deploy_genai: true                           # optional, needs the ACT model key credential: requests in plain words
# vm_deploy_template_catalog:                     # optional: templates GenAI may name, in plain words
#   TEMPLATE-NAME: "Windows Server 2022 (installed over the network by MECM)"
# vm_deploy_services:                             # optional: the survey's "Service" choices - each VM built joins its
#   SERVICE-NAME: {inventory: INVENTORY-NAME, group: GROUP-NAME, note: "WORDS FOR THE VM NOTES"}   # AAP inventory
report_email_to: approvers@yoursite.mil           # the approver reads the plan in this email

# ---- vmware_vm -----------------------------------------------------------------------------------
## only needed when the same VM name exists in two datacenters
# vmware_datacenter: ""

## Check vCenter's certificate. false only if the execution environment does not trust your CA yet.
# vmware_validate_certs: true

## Several vCenters (e.g. Enhanced Linked Mode), one report: the reports and the ESXi security
## settings read the credential's vCenter AND these (names, or name:port), with the same account.
## The same vCenter under two names is read once. docs/VMWARE.md, "Several vCenters". e.g.
## [vc01.yoursite.mil, vc02.yoursite.mil]
# vmware_vcenters: []

## ---- Deploy a VM from a ServiceNow ticket (playbooks/vm_deploy_from_ticket.yml) ---- The ticket
## (survey answer): INC..., TASK..., SCTASK..., RITM..., CHG... - or your instance's own prefixes
## (INCN..., CHGN...): the job asks ServiceNow which table a ticket is in. The ticket says what to
## build in 'key: value' lines - in its description, or in a comment / work note (a newer one
## overrides): vm_name: app01 template: rhel9-gold cpu: 4 memory_gb: 16 (cluster, datastore, folder,
## datacenter, vcenter, domain, customization_spec, notes: optional). docs/VM_DEPLOY_GUIDE.md
# vm_deploy_ticket: ""

## leave it empty (the job finds each ticket's table); a table of your own, e.g. u_vm_request: for
## numbers whose prefix the job does not know (CTASK stays change_task)
# vm_deploy_ticket_table: ""

## Your instance's own number prefixes and their tables, e.g. {INCN: incident, CHGN:
## change_request}. Rarely needed: for a prefix it does not know, the job asks ServiceNow's task
## table (and takes INCN as INC, CHGN as CHG when it may not read that table). A table as people say
## it is understood: change / change request -> change_request, change task -> change_task, catalog
## task -> sc_task.
# vm_deploy_ticket_prefixes: {}

## The request may also be on the ticket's parent - e.g. a task (SCTASK, CTASK) whose change holds
## the requirements: the parent's 'key: value' lines (and, with vm_deploy_plain_words, its plain
## words) are read too, under the ticket's own (what the ticket says wins). A parent that cannot be
## read, is closed, or is not ready (vm_deploy_ready_by_table) stops the build. Only a parent in one
## of these tables is read ([] = never read a parent):
# vm_deploy_parent_tables: [change_request]

## The ticket's fields that point to its parent - the first one set is used: a change task's
## change_request, any ticket's parent (or your instance's own field, e.g. u_change):
# vm_deploy_parent_fields: [change_request, parent]

## The parent's fields with the request, in this order (a later one wins), e.g. [description,
## implementation_plan]; comments and work_notes may be listed too (oldest first). GenAI reads them
## as well.
# vm_deploy_parent_text_fields: [description]

## What wins, from the least to the most: the parent (the change), the ticket's short description
## and description, its work notes, its comments (each oldest first) - a 'key: value' line and plain
## words alike: the later one wins, however each is written. So the change task wins over its
## change, and a comment wins over a work note. true = the parent's text wins over the ticket's
## short description and description instead (a change task that repeats the request, maybe
## wrongly); its work notes and comments still win over the parent.
# vm_deploy_parent_wins: false

## Every note and comment this job writes on the ticket goes on these too (closing never does: only
## the ticket itself is closed): parent = the change a task belongs to (when it was read); tasks =
## when the job is launched with a change, its open change tasks assigned to
## vm_deploy_assignment_group (and matching vm_deploy_notes_tasks_query). e.g. [parent, tasks]: the
## change and its task both get them, whichever the job is launched with. A note ServiceNow refuses
## there is a warning, not a failure.
# vm_deploy_notes_also: []

## An extra ServiceNow query for the change's tasks that get the notes, e.g.
## "short_descriptionLIKEto deploy" ("" = the group's)
# vm_deploy_notes_tasks_query: ""

## the change's tasks that get the notes (and are closed), at most - more is a warning
# vm_deploy_notes_tasks_limit: 50

## Launched with a change: also close its tasks found that way (with
## vm_deploy_done_fields_by_table's change_task entry, when every VM is built) - the change itself
## is not closed by this. They get the notes too.
# vm_deploy_close_tasks: false

## Before anything is built, a ticket of these tables - the ticket itself, or the parent it belongs
## to (a change task's change) - must have these fields: one value or a list (any of them), written
## as the ticket's form shows them (upper / lower case ignored). Checked by the dry run, the propose
## step AND right before the build: a change sent back while the approval waited is not built. Your
## instance's labels, e.g. {change_request: {approval: Approved, state: [Implement, Scheduled]}}; {}
## = no check.
# vm_deploy_ready_by_table:
#   change_request: {approval: Approved, state: Implement}

## clusters (and standalone hosts) a ticket may use; also the candidates of automatic placement
# vm_deploy_clusters: []

## datastores (or datastore clusters) a ticket may use; also the candidates of automatic placement
# vm_deploy_datastores: []

## VM folders a ticket may use (paths below the datacenter's VM folder, e.g. Linux/*)
# vm_deploy_folders: []

## the most vCPUs a ticket may ask for
# vm_deploy_max_cpu: 16

## the most memory a ticket may ask for, in GB
# vm_deploy_max_memory_gb: 128

## A ticket may ask for several VMs ("2 VMs named web01 and web02", "vm_name: web01, web02", or
## "Hostnames:" and one name per line): one VM each, the same size - or each its own, from a line of
## its own - built one after the other, the ticket closed when all are built. More names than this:
## refused, nothing built (the limits above are per VM).
# vm_deploy_max_vms: 10

## The VM names allowed (a regular expression); e.g. '^[a-z0-9-]{1,15}$' for Windows-safe names.
# vm_deploy_name_regex: '^[A-Za-z0-9][A-Za-z0-9-]{0,62}$'

## The same for the ticket the job is launched with, by its table - in place of
## vm_deploy_assignment_group for that table; "" = any group. e.g. {change_request: ""}: launched
## with a change, the change may be assigned to any group (it must still be approved:
## vm_deploy_ready_by_table); its tasks that get the notes (vm_deploy_notes_also,
## vm_deploy_close_tasks) are still those of vm_deploy_assignment_group.
# vm_deploy_assignment_group_by_table: {}

## What a ticket does not say: e.g. {cluster: PROD-CL01, datastore: DS-CLUSTER-01, folder:
## Linux/New}. Not set = the template's own cluster, datastore and folder; its CPU and memory.
# vm_deploy_defaults: {}

## Sites: a ticket's 'site: A' line (or its Location field, or with plain words a site's name or its
## words in vm_deploy_plain_sites - each VM by its own line) picks the placement - over
## vm_deploy_defaults and the name rules; a cluster / datastore / folder the ticket names itself
## still wins. A site in another vCenter: its vcenter (in vmware_vcenters, the same account) - and
## the template there under the same name. vm_deploy_sites: SiteA: {cluster: A-PROD-CL01, datastore:
## A-DSC01, folder: Servers/New} SiteB: {cluster: B-PROD-CL01, datastore: B-DSC01, folder:
## Servers/New, vcenter: vc02.yoursite.mil}
# vm_deploy_sites: {}

## with sites set up: a ticket must say its site (false = vm_deploy_defaults); a name rule counts
## too
# vm_deploy_site_required: true

## Give a VM from one of those empty templates the ticket's name and number as VM settings its
## installer can read: guestinfo.hostname and guestinfo.ticket (a kickstart with VMware Tools in the
## installer: vmtoolsd --cmd "info-get guestinfo.hostname"). Needs the vCenter privilege Change
## configuration > Advanced configuration; without it the VM is still built (a note says so). false
## = none.
# vm_deploy_guestinfo: true

## Short names for long template names - for the ticket's 'template:' line and GenAI's catalog
## (whose keys may be these short names): {short name: the template's name in vCenter}, e.g.
## {win2022: "Windows 2022 Standard Template - Site 1", rhel9: "RHEL 9 Server Template"} A ticket
## may also write a template's own name in other case or spacing: it is matched to the spelling in
## vm_deploy_templates.
# vm_deploy_template_aliases: {}

## The customization specification (vCenter > Policies and Profiles) for each template, when the
## ticket, its site and the name rules name none: {template name or pattern: spec}. A Windows
## template that is not network-boot needs one (Sysprep: administrator password, domain or
## workgroup), e.g. {"Windows 2022*": Win2022-Sysprep-Domain}. Linux templates need none (the job's
## own DHCP one).
# vm_deploy_template_specs: {}

## disks a ticket may ask for, disk 1 included (disks_gb: 100, 200 = disk 1 grown to 100 GB, one 200
## GB disk added)
# vm_deploy_max_disks: 5

## the biggest disk a ticket may ask for, in GB
# vm_deploy_max_disk_gb: 2048

## all its disks together, in GB
# vm_deploy_max_total_disk_gb: 4096

## Automatic placement - when the ticket, its site and vm_deploy_defaults name no cluster /
## datastore: the job chooses among a site's 'clusters' / 'datastores' lists (e.g. SiteA: {clusters:
## [A-PROD-*]}), else among vm_deploy_clusters / vm_deploy_datastores; with neither, the template's
## own. a cluster fits when its memory, this VM included and a host down, stays under this %
# vm_deploy_mem_target_pct: 80

## hosts to plan as failed when choosing a cluster
# vm_deploy_failover_hosts: 1

## a datastore fits when it stays under this % with the VM at its full size
# vm_deploy_datastore_max_used_pct: 85

## Datastores by the VM's name: the first rule whose match fits the name (* and ?, any case) gives
## the datastores it goes on - automatic placement chooses among them on its cluster, the least used
## first, over a site's or vm_deploy_defaults' datastore (one the ticket names must be one of them).
## A VM no rule matches never goes on a datastore a rule names: they are kept for those VMs. e.g.
## SQL servers: - {match: ["*SQL*", "*DBSE*", "*DBV*"], datastores: ["*SQL*"]}
# vm_deploy_datastore_rules: []

## true = a VM whose ticket, site, name rule and vm_deploy_defaults name no datastore (and no
## vm_deploy_datastores) goes on the least used shared datastore of its cluster - the location's -
## the VMs of one ticket spread out (each counts the ones before it); false = the template's own
## datastore.
# vm_deploy_datastore_balance: false

## Run again for the same ticket (a job that stopped: failed, cancelled, timed out), pick up where
## it stopped: each VM carries its ticket in its notes from the clone on - one it built is left as
## it is, one it started and did not finish (cloned, not yet powered on) is finished where it is;
## the work notes say which. false = a VM with the name is refused, as any other.
# vm_deploy_resume: true

## the DNS domain Linux customization sets (a ticket's domain: wins)
# vm_deploy_domain: localdomain

## guest customization: host name = vm_name, every adapter on DHCP
# vm_deploy_customize: true

## power the new VM on (false = leave it off, e.g. to check it first)
# vm_deploy_power_on: true

## seconds to wait for vCenter's customization result
# vm_deploy_wait_customization: 900

## seconds to wait for an IPv4 address (DHCP, through VMware Tools)
# vm_deploy_wait_ip: 600

## Fields set on the ticket when the VM is up, e.g. to resolve an incident: {state: "6", close_code:
## "Solution provided", close_notes: "VM deployed"} (your instance's values)
# vm_deploy_done_fields: {}

## The same for one table (the ticket's table: incident, sc_task, change_task ...), in place of
## vm_deploy_done_fields for it - e.g. close the task, never the change it belongs to: {sc_task:
## {state: "3", close_notes: "VM deployed by AAP"}} (3 = Closed Complete; your instance's values)
## Sent on its own, after the result note: when ServiceNow refuses it (a mandatory field, a business
## rule) the note stays, and the job says so on the ticket and in its report (it stays green: the VM
## is built).
# vm_deploy_done_fields_by_table: {}

## Over those fields when every VM is built but something did not finish: no IPv4 address in time,
## no customization result, the guest's host name not applied, no network at power on, guestinfo not
## set - e.g. {change_task: {close_code: successful_issues}} (your instance's values; {} = closed
## the same way). What happened is on the ticket's work notes.
# vm_deploy_done_fields_issues_by_table: {}

## Also for a VM from a network-boot template (vm_deploy_pxe_templates), which is powered on and
## still installing its OS from MECM when the job ends. false = that ticket stays open for whoever
## checks the install.
# vm_deploy_done_fields_pxe: true

## ---- The server's service, picked at launch: words in the VM's notes, an AAP inventory and group
## ---- What the new server is for, picked by whoever launches the deploy: a survey question
## (multiple choice, NOT required - the scheduled pickup starts the workflow without it), e.g. sql
## or dc. Every VM of the ticket gets it. "" = none. Its words go in each VM's notes in vCenter;
## with an inventory in vm_deploy_services, each VM built joins that AAP inventory and group.
# vm_deploy_service: ""

## The name a VM gets in the inventory: write it the way your inventory already names servers, or
## the same server shows up twice in AAP. {name} = the VM's name, e.g. "{name}.yoursite.mil". A
## service's own name: wins (e.g. {inventory: Windows servers, name: "{name}.corp.yoursite.mil"}).
# vm_deploy_inventory_name: "{name}"

## the inventory name in lower case (APP01 -> app01); false = as the ticket writes it
# vm_deploy_inventory_lowercase: true

## a CA file for AAP's own HTTPS certificate ("" = vm_deploy_poll_aap_ca_path, else what the
## execution environment trusts)
# vm_deploy_aap_ca_path: ""

## ---- A request in plain words, without GenAI (off by default) ---- true = also read the ticket's
## own words, by the rules below, so a requester can write "a Red Hat 9 server named ab01web05,
## medium" instead of 'key: value' lines. Never a guess: two different answers in the text are a
## question to the requester (a comment). 'key: value' lines still work and win; with
## vm_deploy_genai also on, GenAI is asked when the words leave the name or template - or a question
## - open.
# vm_deploy_plain_words: false

## The words for each template (any case; "windows 2022" also matches "Windows Server 2022", "server
## 2025" also "a new 2025 VM"). An allowed template's own name and its short names
## (vm_deploy_template_aliases) count too. An OS no template is for (Server 2025, only a 2022
## template) is a question - never another version; to build it from a template whose name says
## another (an empty MECM shell): {"server 2025": <it>}. e.g. {"rhel 9": rhel9-gold, "red hat 9":
## rhel9-gold, "windows 2022": WIN2022-TEMPLATE}
# vm_deploy_plain_templates: {}

## Size words and what they mean, e.g. {small: {cpu: 2, memory_gb: 8}, medium: {cpu: 4, memory_gb:
## 16}, large: {cpu: 8, memory_gb: 32}}. "4 vCPU" and "16 GB RAM" in the ticket are read too, and
## win in the same text.
# vm_deploy_plain_sizes: {}

## The words for each site (vm_deploy_sites), as people write the place - any case, the spaces
## optional ("Site Two" is also "SiteTwo"). A site's own name counts too. A change that lists its
## servers one per line ('new VM / ab01web05 / ... Location: Site Two') puts each VM at the site its
## own line names; the CPU, memory and disks on each line are that VM's too. e.g. {"site two":
## SiteB, "north campus": SiteA}
# vm_deploy_plain_sites: {}

## A dry run (Check) asks GenAI too (true): it shows GenAI's proposal and where the VM would go, and
## writes nothing on the ticket - no proposal note, no questions to the requester. false = Check
## only says GenAI would be asked.
# vm_deploy_genai_in_check: false

## true: a GenAI proposal waits for a person - the workflow's approval (or a second run) - before it
## is built. false: one run reads, checks and builds, when every value is traced to the ticket and
## within the rules (questions or a refusal still stop it).
# vm_deploy_genai_approval: true

## Which step this run is: "" = one job does it all; propose = the workflow's first step (read, ask
## GenAI if needed, check, write where it would go on the ticket - build nothing); build = the step
## after the approval (build what the ticket and its proposal say - never ask GenAI).
# vm_deploy_phase: ""

## seconds the model may take for its answer
# vm_deploy_genai_model_timeout: "{{ site_act_model_timeout | default(600) }}"

## a CA file for AAP's own HTTPS certificate ("" = what the execution environment trusts)
# vm_deploy_poll_aap_ca_path: ""

# ---- servicenow ----------------------------------------------------------------------------------
## check the instance's HTTPS certificate (see servicenow_ca_path)
# servicenow_validate_certs: true

## A CA bundle (PEM) for the instance's TLS certificate, when the execution environment does not
## trust its CA (e.g. a DoD root CA): a path on the controller, such as a file you add to the
## project: servicenow_ca_path: "{{ playbook_dir }}/files/ca/servicenow-ca.pem". Empty = the
## execution environment's normal trust store. Prefer this over servicenow_validate_certs: false.
# servicenow_ca_path: ""

## seconds for one API request
# servicenow_timeout: 30

