# ==================================================================================================
# Variables for the job template "VMware ask - deploy"
#   playbook:    playbooks/vmware_ask_deploy.yml
#   credentials: Machine, VMware vCenter, ACT model key
#
# HOW TO USE: copy this file into the template's Variables box (YAML selected).
#   - A setting starting with "# " is switched off. To use it, delete the "# " in front of its
#     line (and of the indented lines under it), then change the value. Lines starting with
#     "## " say what the setting below them does.
#   - Switch on only what you change: a value here beats the same setting everywhere else,
#     including playbooks/group_vars/all.yml. The values shown are the defaults.
#   - The settings under "usually in all.yml" apply to every job: set them once there.
#   - Every setting, in full: docs/VARIABLES_REFERENCE.md (the Settings Reference PDF).
# GENERATED by scripts/gen_template_vars.py from roles/*/defaults/main.yml - do not edit here.
# ==================================================================================================
---
## The podman network of STIG Manager's nginx container (docs/VMWARE_ASK.md, step 1: sudo podman ps): the page joins
## it and sits behind that nginx at /ask/ - its mTLS (the card) says who asks; the job never changes STIG Manager
vmware_ask_network: stigman
## The site's execution environment image (Python, ansible-core and pyVmomi are in it), from your automation hub
vmware_ask_image: aap.example.mil/site-ee-all:1
## The page's address, as people open it
vmware_ask_public_url: https://stigman.example.mil/ask/

# ---- vmware_ask_stack ----------------------------------------------------------------------------
## system = rootful (/etc/containers/systemd, systemctl) <- production user = rootless
## (~/.config/containers/systemd, systemctl --user) <- tests / rootless hosts
# vmware_ask_scope: system

## the service's files, and nginx-ask.conf (the nginx lines to add)
# vmware_ask_config_dir: /etc/vmware-ask

## the page's path on the reverse proxy (nginx-ask.conf's location)
# vmware_ask_path: /ask/

## the page's title
# vmware_ask_title: Ask VMware

## banner: U, CUI, C, S, TS, SCI, NONE
# vmware_ask_classification: U

## vCenter: the "VMware vCenter" credential's account (read-only is enough) and vCenter, and these
## vCenters with it more vCenters, the same account (as vmware_vcenters)
# vmware_ask_vcenters: "{{ vmware_vcenters | default([]) }}"

## check vCenter's certificate (the CAs: vmware_ask_trust_host_cas)
# vmware_ask_validate_certs: "{{ vmware_validate_certs | default(true) }}"

## only this datacenter; "" = all
# vmware_ask_datacenter: ""

## read vCenter every this many minutes (the answers are as of the last read)
# vmware_ask_refresh_minutes: 10

## seconds one read may take
# vmware_ask_refresh_timeout: 1800

## a VM's last power off, restart and vMotion: from vCenter's events of this many days
# vmware_ask_event_days: "{{ vm_ask_event_days | default(30) }}"

## at most this many of those events per vCenter
# vmware_ask_max_events: "{{ vm_ask_max_events | default(50000) }}"

## GenAI: ACT's settings (site_act_provider, site_act_models, site_act_urls ...:
## roles/site_act/defaults/main.yml) and the key of the "ACT model key" credential. No key: the
## job's own reader answers the simplest questions. false = only the job's own reader
# vmware_ask_genai: true

## GenAI did not run or gave no query: the job's own reader tries it (said)
# vmware_ask_local_fallback: "{{ vm_ask_local_fallback | default(true) }}"

## GenAI's answer held no query: asked once more, told what it answered
# vmware_ask_genai_retry: "{{ vm_ask_genai_retry | default(true) }}"

## seconds GenAI may take to answer
# vmware_ask_model_timeout: "{{ vm_ask_model_timeout | default(120) }}"

## more words for GenAI, e.g. your naming
# vmware_ask_extra_instructions: "{{ vm_ask_extra_instructions | default('') }}"

## rows shown on the page (the CSV has every row)
# vmware_ask_max_rows: "{{ vm_ask_max_rows | default(500) }}"

## keep who asked what this many days (0 = for ever)
# vmware_ask_keep_days: 365

## questions with GenAI at once (the rest wait)
# vmware_ask_parallel: 4

## questions one person may have running at once
# vmware_ask_per_user: 2

## the service trusts what the server trusts (/etc/pki/ca-trust): vCenter, GenAI
# vmware_ask_trust_host_cas: true

## How long to wait after (re)starting for the service to answer
# vmware_ask_ready_retries: 30

## seconds between those tries
# vmware_ask_ready_delay: 4

## ---- Secrets: NEVER set these in a vars file or inventory -----------------------------------
## They come from AAP credentials as environment variables / files on the controller (execution
## environment). the "VMware vCenter" credential
# vmware_ask_vcenter_host: "{{ lookup('ansible.builtin.env', 'VMWARE_HOST') }}"

## its account
# vmware_ask_vcenter_user: "{{ lookup('ansible.builtin.env', 'VMWARE_USER') }}"

## its password: a podman secret on the server
# vmware_ask_vcenter_password: "{{ lookup('ansible.builtin.env', 'VMWARE_PASSWORD') }}"

# ---- vmware_vm -----------------------------------------------------------------------------------
## Check vCenter's certificate. false only if the execution environment does not trust your CA yet.
# vmware_validate_certs: true

## Several vCenters (e.g. Enhanced Linked Mode), one report: the reports and the ESXi security
## settings read the credential's vCenter AND these (names, or name:port), with the same account.
## The same vCenter under two names is read once. docs/VMWARE.md, "Several vCenters". e.g.
## [vc01.yoursite.mil, vc02.yoursite.mil]
# vmware_vcenters: []

## GenAI did not run (no key, not reachable) or its answer held no query: the job's own reader tries
## it (simple questions only; the report says so)
# vm_ask_local_fallback: true

## GenAI's answer held no query (a plan or a step of its own instead, or prose): it is asked once
## more, told what it answered; false = not
# vm_ask_genai_retry: true

## seconds GenAI may take to answer
# vm_ask_model_timeout: 120

## a VM's last power off and vMotion (and a restart inside the guest) come from vCenter's events of
## this many days: older ones are not found (vCenter keeps events for a limited time, often 30 days)
# vm_ask_event_days: 30

## read at most this many of those events per vCenter (the newest)
# vm_ask_max_events: 50000

## more words for GenAI, e.g. your naming: "a name with DBV is a database server; ACAS is the
## scanner's folder"
# vm_ask_extra_instructions: ""

## rows listed in the email and on the page at most (the workbook has every row)
# vm_ask_max_rows: 500

# ---- site_act - usually in all.yml ---------------------------------------------------------------
## ACT at all (1.3.0): false = no job calls ACT - no request, no model endpoint or key needed, no
## error; each report says "ACT is off (site_act_enabled false)" in one line and the job stays green
## (an enclave without a model). Usually in all.yml (docs/ENCLAVES.md).
# site_act_enabled: true

## ---- Which model ACT talks to -----------------------------------------------------------------
## site_act_provider genai GenAI.mil (the default) asksage Ask Sage - RETIRED FOR NOW: do not pick
## it (kept for when it returns) genai-beta the GenAI.mil beta proxy (preview models)
## site_act_models the model to use FOR EACH provider, e.g. {genai: gemini-4-argon-withtools,
## asksage: gpt-5.6-sol-gov} so the model follows whichever provider is picked. A provider not
## listed uses ACT's own default model. site_act_urls the API URL for each provider, e.g. {asksage:
## https://<host>/server/openai/v1/chat/completions}; a provider not listed uses ACT's default URL
## site_act_model one model for this run, whatever the provider (e.g. a survey answer); empty =
## site_act_models site_act_url one URL for this run; empty = site_act_urls site_act_ca a CA bundle
## file ON THE HOSTS for the provider's TLS certificate (internal/DoD CA); empty = the host's system
## trust store The API KEY never goes here: it comes from an AAP credential - "ACT model key" (GenAI
## and Ask Sage keys) or "ACT GenAI beta key". ACT runs ON EACH HOST, so the hosts must be able to
## reach the provider's URL (a proxy or firewall rule may be needed).
# site_act_provider: genai

## the model for each provider (see above): the model follows the provider picked
# site_act_models: {genai: gemini-4-argon-withtools, asksage: gpt-5.6-sol-gov}

## the API URL for each provider; a provider not listed uses ACT's default
# site_act_urls: {}

## one model for this run, whatever the provider (e.g. a survey answer); empty = site_act_models
# site_act_model: ""

## one URL for this run; empty = site_act_urls
# site_act_url: ""

## a CA bundle file ON THE HOSTS for the provider's certificate; empty = the host's trust store
# site_act_ca: ""

## Any other ACT environment settings (advanced; these win over the ones above), e.g. {HTTPS_PROXY:
## "http://proxy.yoursite.mil:8080"}. See the top of vendor/act/act for the list. Every ACT job
## streams the model's answer (ACT_STREAM=1), so a firewall or proxy idle timeout does not cut a
## long answer ("connection reset by peer"); {ACT_STREAM: "0"} here turns that off.
# site_act_env: {}

## Seconds the model may take for ONE answer, retries after a provider hiccup included (ACT's
## GENAI_TIMEOUT; ACT's own default, 90, is too short for a long analysis or a busy provider). Every
## ACT job uses it: the runbooks' use_act, the VMware alarms and capacity analyses, service watch.
# site_act_model_timeout: 600
