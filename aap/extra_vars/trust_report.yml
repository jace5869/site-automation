## Only the certificates this list names are looked for (roles/check_trust/vars/main.yml ships the October 2026
## eMudhra set); add your own in check_trust_extra, change a severity in check_trust_severity
# check_trust_severity: {"AAA Certificate Services": warning}
## Removal is OFF: the report only reads. check_trust_remove: true (below) takes the listed certificates out
## of the stores that hold them - run it as Check first (Job type Check: what would go, nothing changed).
## vCenter and the ESXi hosts: the template "VMware - trust store report" (playbooks/vmware_trust_report.yml)

# ---- check_trust ---------------------------------------------------------------------------------
## More certificates to look for, besides the shipped list: name, sha256 (the certificate's
## fingerprint, with or without colons), spki_sha256 (its public key, optional), kind (root /
## intermediate), severity (critical / warning / notice), why. Get the fingerprints with: openssl
## x509 -in the.pem -noout -fingerprint -sha256 e.g. [{name: "Old Corp Root CA", sha256:
## "AB:CD:...", kind: root, severity: warning, why: "retired January 2026"}] (a date in quotes,
## "2026-01-31", never bare: YAML would make it a date)
# check_trust_extra: []

## the finding for a program below the fixed version (a Go program, Node, NSS): warning or critical
# check_trust_software_severity: warning

## The system: the CA bundles every OpenSSL / Go / Python client reads (the ones that exist are
## read), p11-kit's live view (trust extract: what NSS and GnuTLS clients see, and the blocklist),
## the blocklist folders. the system CA bundles (RHEL, Debian / Ubuntu, Alpine, SUSE); the same file
## under two names is read once
# check_trust_bundles: [/etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem, /etc/pki/ca-trust/extracted/openssl/ca-bundle.trust.crt, /etc/pki/tls/certs/ca-bundle.crt, /etc/pki/tls/cert.pem, /etc/ssl/certs/ca-certificates.crt, /etc/ssl/cert.pem, /etc/ssl/ca-bundle.pem, /var/lib/ca-certificates/ca-bundle.pem]

## p11-kit blocklist folders: a certificate there is distrusted (listed as blocked, no finding)
# check_trust_blocklist_dirs: [/etc/pki/ca-trust/source/blocklist, /usr/share/pki/ca-trust-source/blocklist]

## read p11-kit's live anchors and blocklist too (trust extract), when the trust command is there
# check_trust_p11kit: true

## NSS databases read with certutil (the system's: curl and other NSS clients on older RHEL; root's
## and each user's: Chrome, Evolution)
# check_trust_nss_dirs: [/etc/pki/nssdb, /root/.pki/nssdb, /home/*/.pki/nssdb]

## the ca-certificates package version that dropped the roots, e.g. '2026.2.82' (empty: not compared
## - the bundles themselves tell)
# check_trust_ca_certificates_fixed: ''

## the NSS version that dropped emSign ECC Root CA - G3 (the package nss / libnss3 below it: a
## finding; empty: not compared)
# check_trust_nss_fixed: '3.131.1'

## Java: every cacerts / jssecacerts under these folders (JDKs, and the keystores of running java
## programs), read directly (JKS) or with keytool (PKCS12), with the JDK's version.
# check_trust_java: true

## folders searched for cacerts (seven levels deep)
# check_trust_java_dirs: [/usr/lib/jvm, /usr/java, /etc/pki/java, /etc/pki/ca-trust/extracted/java, /opt, /usr/local, /srv]

## Python: every certifi bundle (certifi/cacert.pem: requests, pip, urllib3 ... carry their own
## roots, not the system's) under these folders - system Python, venvs, applications.
# check_trust_python: true

## folders searched for certifi/cacert.pem (twelve levels deep)
# check_trust_python_dirs: [/usr/lib, /usr/lib64, /usr/local, /opt, /srv, /var/lib, /root, /home]

## Node: its built-in roots (not the system's: Node carries its own, unless started with --use-
## openssl-ca), and its version against the one that dropped the root, per major line.
# check_trust_node: true

## where node binaries are (globs); the one in PATH and running ones are found too
# check_trust_node_paths: [/usr/local/bin/node, /usr/local/node*/bin/node, /opt/*/bin/node, /opt/node*/bin/node, /root/.nvm/versions/node/*/bin/node, /home/*/.nvm/versions/node/*/bin/node]

## Node's fixed version per major line (an older line than the oldest listed: unsupported, no fix)
# check_trust_node_fixed: {"22": "22.23.4", "24": "24.22.1", "26": "26.12.1"}

## Go: a Go program carries its own certificate verification. Go 1.27.3 / 1.26.10 reject any chain
## with one of the compromised keys (CVE-2026-111943) - a program built with an older Go has to be
## rebuilt. The running programs, and the executables under these folders, with the Go version each
## was built with.
# check_trust_go: true

## folders searched for Go programs (four levels deep, executables over 1 MB)
# check_trust_go_dirs: [/usr/local/bin, /usr/local/sbin, /opt, /srv]

## Go's fixed version per line (a program built with an older line: unsupported - rebuild it with a
## fixed Go)
# check_trust_go_fixed: {"1.26": "1.26.10", "1.27": "1.27.3"}

## at most this many programs looked at per host
# check_trust_go_max: 200

## Containers: the CA bundle inside every running podman container (root's and each logged-in
## user's), read with podman exec - a container image carries its own ca-certificates (Red Hat: UBI
## images are affected too).
# check_trust_containers: true

## at most this many containers per host
# check_trust_containers_max: 30

## Certificate files an application carries (its own bundle, a copied root): every *.pem, *.crt,
## *.cer, *.der, cacert*, ca-bundle*, ca-certificates*, and every Java keystore (*.jks, *.keystore,
## *truststore*; *.p12 / *.pfx with keytool and the default password) under these folders, on the
## host's own filesystems - only the files with a hit are listed. /etc, /opt, /srv and the home
## folders by default; add an application's folder. folders searched for certificate files (every
## level)
# check_trust_find_dirs: [/etc, /opt, /srv, /usr/local, /var/lib, /root, /home]

## at most this many files read per host
# check_trust_find_max: 2000

## regular expression on the path: matching files are skipped (container image layers, the copies
## update-ca-trust extracts, Debian's per-CA files - the bundles stand for them; this repository's
## own test certificates on the AAP controller)
# check_trust_find_exclude: '/(proc|sys|dev)/|/\.cache/|/containers/storage/|/docker/overlay2?/|/ca-trust/extracted/|/ca-trust-source/|^/etc/ssl/certs/|/usr/share/ca-certificates/|/node_modules/.*/test/|/tests/trust/fixtures/'

## seconds for each search and each command (keytool, node, podman exec)
# check_trust_timeout: 60

## Removal (the Trust store report only, playbooks/trust_report.yml; the VMware trust store report
## has the same switch): take the listed certificates out of the stores that hold them. OFF by
## default - a read-only report. Check mode shows what would go and changes nothing. The system
## trust is blocklisted (RHEL / SUSE: a PEM in the blocklist folder and update-ca-trust; Debian /
## Ubuntu: the line in /etc/ca-certificates.conf and update-ca-certificates), a Java keystore loses
## the entry, a certifi or application bundle loses the block, a file that is the certificate itself
## is moved to the backup folder. A file a package owns is left alone (update the package). Node, Go
## programs and containers cannot be changed this way (update, rebuild) and stay in the report.
## docs/TRUST_STORES.md remove them (true) - or only report (false)
# check_trust_remove: false

## which kinds of store to change: system (blocklist), java (every keystore), python (certifi), file
## (an application's bundle or certificate file), nssdb (certutil -D)
# check_trust_remove_kinds: [system, java, python, file, nssdb]

## only certificates at these severities go; a notice-level one (AAA Certificate Services) never,
## unless named here
# check_trust_remove_severities: [critical, warning]

## every file changed is copied here first (a folder per run)
# check_trust_remove_backup_dir: /var/backups/site-automation/trust

## the system blocklist folder; empty = the distribution's (/etc/pki/ca-trust/source/blocklist, SUSE
## /etc/pki/trust/blacklist)
# check_trust_remove_blocklist_dir: ''

## the command that rebuilds the system trust after blocklisting; empty = the distribution's
## (update-ca-trust, update-ca-certificates)
# check_trust_remove_update_cmd: ''

## the Java keystores' password (keytool's default)
# check_trust_keystore_password: changeit

# ---- site_email - usually in all.yml -------------------------------------------------------------
## Who gets it: a list, or text with commas / spaces / one per line (a survey answer). Empty = no
## email. Set it on each TEMPLATE (its Variables, or a survey): in all.yml every report job emails.
# report_email_to: []

## copied: a list, or text like report_email_to
# report_email_cc: []

## "Also email the report to": more people for one run, asked when the job is launched - a survey
## question (playbooks/aap_email_question.yml adds it to the report templates). Added to
## report_email_to, never in its place; empty = only report_email_to. A list, or text: addresses
## separated by commas, semicolons, spaces or one per line, or pasted from Outlook (Doe, Jane
## <jane.doe@yoursite.mil>; ...).
# report_email_also: []

## The domains an address in report_email_also may be in (a subdomain too), e.g. [yoursite.mil]; any
## other is listed in the job and gets no email. Empty = any domain (your mail relay may still
## refuse some).
# report_email_also_domains: []

## the sender, e.g. aap-noreply@yoursite.mil
# report_email_from: ""

## your mail relay, e.g. smtp.yoursite.mil
# report_email_smtp_host: ""

## 25 or 587 with starttls, 465 with ssl
# report_email_smtp_port: 25

## starttls = encrypt after connecting (the relay must offer it); ssl = encrypted from the start
## (port 465); none = not encrypted (only for a relay without encryption; then no login is sent).
# report_email_security: starttls

## a CA file that signed the relay's certificate (empty = the CAs the execution environment trusts)
# report_email_ca_path: ""

## put before every subject, e.g. "[AAP] Certificate report: ..."
# report_email_subject_prefix: "[AAP]"

## Send a formatted (HTML) version too, for reports that come with one (all VMware jobs). The email
## always carries a plain-text copy for mail clients that do not show HTML. false = plain text only.
# report_email_html: true

## The look of the HTML version (docs/EMAIL_REPORTS.md, "The look"): standard = a header band in the
## report's colour (green, amber, red, blue) with number boxes under it; command = a dark header
## with your logo and report_email_header_text, the job's last runs as a strip of bars
## (report_history), the numbers in one row; portal = white cards on a pale mint background (like
## the AAP portal pages): a header card with your logo, report_email_header_text and the status,
## number tiles, a card with the last runs, a card per section. Classic desktop Outlook shows the
## portal cards square, without shadows. glass = see-through frosted cards on a soft blue-green
## background: your logo, the status and what it asks ("Action required"), tiles with icons (a
## warning or critical one tinted), the last runs beside This run / Last run, a card per section
## with its table on a near-solid panel; the line under the subject in the inbox, an "Open the full
## report" button with report_web_dest, tiles two by two on a phone. Mail programs that do not draw
## transparency (classic desktop Outlook) show solid white cards, square. The web page adds the
## blur, icons and a plain print.
# report_email_theme: standard

## command, portal, glass: the line with the logo
# report_email_header_text: Site automation report

## Your logo in the header (every look but standard): a PNG, JPEG or GIF in your repository - a path
## from playbooks/ (files/report_logo.png = playbooks/files/report_logo.png) or a full path.
## Attached to each email, so keep it small: about 160 px tall, under 100 KB. Updating with
## scripts/update-from-release: list the file in .site-local, or the update deletes it.
# report_logo_file: ""

## pixels in the email (its width follows); portal: at most 56, glass: at most 80
# report_logo_height: 84

## command, portal, glass: the job's last runs, read from AAP - attach a "Red Hat Ansible Automation
## Platform" credential to the template, whose user can see the template's jobs (Organization
## Auditor on its organization, docs/EMAIL_REPORTS.md); without it the email goes out without the
## strip.
# report_history: true

## bars in the strip, this run included
# report_history_runs: 14

## a CA file for AAP's own HTTPS certificate ("" = what the execution environment trusts)
# report_history_aap_ca_path: ""

## Your own look instead: copy roles/site_email/templates/report.html.j2 (or report_command /
## _portal / _glass) to e.g. playbooks/files/email/report.html.j2, change it, and set
## report_email_html_template: "{{ playbook_dir }}/files/email/report.html.j2" report.html.j2 (the
## default) = the look report_email_theme picks.
# report_email_html_template: report.html.j2

## THE REPORT WEBSITE (docs/WEB_REPORTS.md): every report job also writes its report as a web page -
## off until report_web_dest is set. Works without an email (report_email_to empty). Each run: its
## page, a copy as the template's latest page, the report's data as JSON beside each (for your own
## site), and an index of every report's last run. The job prints the page's address ("Report:
## https://...") and keeps it as the job artifact site_report_url. Where the files go: a folder the
## job can write - a share mounted on the AAP execution nodes and exposed to jobs (Settings > Job
## settings > Paths to expose to isolated jobs), e.g. /mnt/reports - or an https:// address that
## takes uploads (HTTP PUT, WebDAV: nginx, Apache, IIS) - or a Windows file share's folder, written
## over SMB with no mount: '\\fileserver\its\aap\reports' (the folder there already; smbprotocol in
## the execution environment). An upload's or a share's login comes from a "Report website"
## credential (aap/credential_types/report_web.yml).
# report_web_dest: ""

## the address people open that folder at, e.g. https://reports.yoursite.mil ("" = dest when it is
## https://)
# report_web_url: ""

## the page's look: standard, command, portal or glass (as report_email_theme)
# report_web_theme: portal

## The names inside the folder, with {names} filled in: {template} (the AAP template's name, lower
## case with dashes; the play's name outside AAP), {template_id}, {job} (the AAP job; local outside
## AAP), {status} (ok, warning, critical, info), {date} (2026-10-23), {time} (0605), {year},
## {month}, {day} - the time the job wrote it, UTC - and your own from report_web_names. Each must
## end in .html; folders are made as needed. each run's page (the address the job prints)
# report_web_page: "{template}/{date}_{time}_job-{job}.html"

## always the template's newest run ("" = none)
# report_web_latest: "{template}/latest.html"

## every report's last run ("" = none)
# report_web_index: index.html

## your own {names}, e.g. {site: "{{ site_code }}"} for "{site}/{template}/..."
# report_web_names: {}

## the report's data as .json beside each page and index.json beside the index
# report_web_json: true

## A share (report_web_dest \\server\share\folder): how the job logs in, and the connection.
## negotiate (Kerberos - FIPS too: user@YOURDOMAIN.MIL, the server's full name - else NTLM), ntlm,
## or kerberos (a ticket already in the job)
# report_web_smb_auth: negotiate

## true = encrypt (SMB 3) even when the share does not require it; one that requires it is always
# report_web_smb_encrypt: false

## the share's port
# report_web_smb_port: 445

## a CA file for an https:// report_web_dest, or report_web_host's WinRM certificate ("" = what the
## EE trusts)
# report_web_ca_path: ""

## Or on a Windows server (a file server, or the IIS server itself): report_web_host is that server,
## report_web_dest the folder on it (D:\reports, there already). The pages are made on the AAP side
## and written there over WinRM, in one PowerShell script per run (Constrained Language Mode too):
## nothing to mount, no WebDAV. The login: the "Report website" credential's user name and password,
## or - without it - the template's Machine credential; the account needs WinRM (Remote Management
## Users) and Modify on the folder. The connection, as your Windows inventory's: e.g.
## web01.yoursite.mil
# report_web_host: ""

## winrm or psrp
# report_web_host_connection: winrm

## WinRM: 5986 (https), 5985 (http)
# report_web_host_port: 5986

## https, or http (Kerberos and NTLM encrypt each message then)
# report_web_host_scheme: https

## ntlm, kerberos (Kerberos in the EE), credssp or basic
# report_web_host_transport: ntlm

## validate (the CA: report_web_ca_path) or ignore
# report_web_host_cert_validation: validate

## THE COPY JOB instead (docs/WEB_REPORTS.md, "The copy job"): for report templates whose execution
## environment cannot reach the web server (no WinRM or Kerberos in it). true = the report jobs
## write nothing there - each keeps its report in AAP (the job artifact site_report_page) and the
## one job template "Report website - copy" (playbooks/report_web_copy.yml), in an execution
## environment that reaches report_web_host, writes the pages there later, at the same address: the
## email's button and site_report_url point at it (there once the copy job has run). Set it in
## all.yml, with report_web_dest and report_web_url as above; the copy job uses them (and
## report_web_theme, the logo) too.
# report_web_copy: false

## the kept report's greatest size, packed (a bigger one: its longest tables cut, said on the page)
# report_web_copy_max_kb: 256

# ---- site_findings - usually in all.yml ----------------------------------------------------------
## Which severities make the job FAIL. A failed job is what sends an AAP workflow down its "on
## failure" path (open tickets, ask ACT, wait for approval). [] = report only, never fail.
# site_fail_on: [critical, warning]

## A host that cannot be reached (switched off, no network, ssh or WinRM refused, its login refused)
## in the health checks, the certificate report and renewal, database health, the service watch and
## troubleshoot: listed as NOT REACHED and left out, and the job is not failed for it. It still
## counts as checked-for, so the ServiceNow step opens its "no result" ticket. When NO host is
## reached (a wrong or expired machine credential looks like this) the job fails. true = a host not
## reached fails the job, as before. Patching, fixes, deploys and the Windows connection test always
## fail for it.
# site_unreachable_fails: false

## One syslog line per finding (tag below), so your log server / SIEM sees them too.
# site_syslog: true

## the syslog tag those lines carry (to filter on in the SIEM)
# site_syslog_tag: site-health

## Windows: one Application event log entry per finding instead of syslog (source below).
# site_eventlog_source: site-health

## ---- Linux or Windows (set by the playbook; do not set) -----------------------------------------
## Linux playbooks run the roles check_<name>, the Windows ones (win_*.yml) the roles
## win_check_<name>.
# site_os: linux

## check_ (Linux) or win_check_ (Windows): set by the playbook from site_os
# site_check_role_prefix: "{{ 'win_check_' if site_os == 'windows' else 'check_' }}"

## How a host is recognized as Windows: its connection, or its shell (Windows OpenSSH).
# site_windows_connections: [winrm, psrp, ansible.builtin.winrm, ansible.builtin.psrp]

## A notice in the job output when a project settings file (playbooks/group_vars/*.yml) defines a
## setting: it wins over AAP's inventory Variables box. false = no notice.
# site_settings_notice: true
