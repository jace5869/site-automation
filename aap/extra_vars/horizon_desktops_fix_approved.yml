---
# ---- horizon -------------------------------------------------------------------------------------
## ---- Connection ---------------------------------------------------------------------------------
## a CA file for the Connection Server's HTTPS certificate ("" = what the execution environment
## trusts)
# horizon_ca_path: ""

## seconds per request
# horizon_timeout: 60

## records per page when reading pools, desktops and sessions (Horizon's most: 1000)
# horizon_page_size: 500

## the newest API version to try (v9 down to v1): the first that answers is used
# horizon_api_newest: 9

## the API version of the actions (reset, recover, log off, push image...)
# horizon_action_version: v1

## ---- Pools no job changes -----------------------------------------------------------------------
## Desktop pools no job fixes, logs off or pushes an image to: names as Horizon Console shows them,
## * and ? allowed, any case (e.g. [VIP-*, Kiosk]). The reports still show them.
# horizon_protected_pools: []

## ---- Broken desktops (the desktops check -> approval -> the fix job) ----------------------------
## A desktop in one of these states takes no user until it is fixed. Left out on purpose: states
## that pass by themselves (being made, customized, deleted, waiting for the agent at start-up,
## maintenance).
# horizon_broken_states: [AGENT_UNREACHABLE, AGENT_ERR_DISABLED, AGENT_ERR_INVALID_IP, AGENT_ERR_NEED_REBOOT,
#                         AGENT_ERR_PROTOCOL_FAILURE, AGENT_ERR_DOMAIN_FAILURE, AGENT_CONFIG_ERROR, ALREADY_USED, ERROR,
#                         PROVISIONING_ERROR, UNKNOWN]

## report = the check lists them and stays green (a schedule). approval = when there is a desktop to
## fix, the check hands the list on and FAILS on purpose, so the workflow takes its "Run on fail"
## path to the approval step and then the fix job. Set approval on the workflow's check node.
# horizon_desktops_mode: report

## fix at most this many desktops per run: the rest are listed, the next run takes them
# horizon_fix_max: 20

# ---- site_email - usually in all.yml -------------------------------------------------------------
## Who gets it: a list, or text with commas / spaces / one per line (a survey answer). Empty = no
## email. Set it on each TEMPLATE (its Variables, or a survey): in all.yml every report job emails.
# report_email_to: []

## copied: a list, or text like report_email_to
# report_email_cc: []

## the sender, e.g. aap-noreply@yoursite.mil
# report_email_from: ""

## your mail relay, e.g. smtp.yoursite.mil
# report_email_smtp_host: ""

## 25 or 587 with starttls, 465 with ssl
# report_email_smtp_port: 25

## starttls = encrypt after connecting (the relay must offer it); ssl = encrypted from the start
## (port 465); none = not encrypted (only for a relay without encryption; then no login is sent).
# report_email_security: starttls

## a CA file that signed the relay's certificate (empty = the CAs the execution environment trusts)
# report_email_ca_path: ""

## put before every subject, e.g. "[AAP] Certificate report: ..."
# report_email_subject_prefix: "[AAP]"

## Send a formatted (HTML) version too, for reports that come with one (all VMware jobs). The email
## always carries a plain-text copy for mail clients that do not show HTML. false = plain text only.
# report_email_html: true

## The look of the HTML version. Your own: copy roles/site_email/templates/report.html.j2 (e.g. to
## playbooks/files/email/report.html.j2), change it, and set report_email_html_template: "{{
## playbook_dir }}/files/email/report.html.j2"
# report_email_html_template: report.html.j2
