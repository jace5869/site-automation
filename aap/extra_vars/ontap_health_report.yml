# ---- ontap_report --------------------------------------------------------------------------------
## The clusters' management addresses (names or IPs), e.g. [cluster1.yoursite.mil,
## cluster2.yoursite.mil]. The credential's account must exist on each of them.
# ontap_clusters: []

## Check the clusters' HTTPS certificates. ONTAP's own certificate is often self-signed: then put
## its CA in ontap_ca_path (a file in the project, e.g. "{{ playbook_dir }}/files/ca/ontap-ca.pem"),
## or set false.
# ontap_validate_certs: true

## the CA file (PEM) the clusters' certificates are checked with; empty = the execution
## environment's own trust
# ontap_ca_path: ""

## seconds for one request (no answer: asked once more)
# ontap_timeout: 30

## true = connect to older ONTAP whose TLS the execution environment refuses
## (UNSAFE_LEGACY_RENEGOTIATION_DISABLED, KEY_TOO_SMALL, SHA-1)
# ontap_tls_legacy: false

## Thresholds (used %, hours, days, seconds): at or above "warn" = amber, at or above "crit" = red.
# ontap_volume_warn_pct: 85

## volume used % -> red
# ontap_volume_crit_pct: 90

## aggregate used % -> amber
# ontap_aggr_warn_pct: 85

## aggregate used % -> red
# ontap_aggr_crit_pct: 90

## inodes used % of a volume -> amber
# ontap_inode_warn_pct: 85

## inodes used % -> red
# ontap_inode_crit_pct: 90

## last good transfer longer ago than this
# ontap_snapmirror_lag_warn_hours: 24

## last good transfer longer ago than this -> red
# ontap_snapmirror_lag_crit_hours: 48

## snapshots using this much of their reserve (100 = they spill into the volume)
# ontap_snapshot_reserve_warn_pct: 100

## snapshots using this much of their reserve -> red
# ontap_snapshot_reserve_crit_pct: 150

## certificates expiring within this many days
# ontap_cert_warn_days: 60

## certificates expiring within this many days (or expired) -> red
# ontap_cert_crit_days: 14

## a node's clock against the AAP server's
# ontap_time_drift_warn_seconds: 60

## a node's clock this far off -> red
# ontap_time_drift_crit_seconds: 300

## receive errors (CRC and other bad frames) since the node booted
# ontap_port_errors_warn: 1

## receive errors on a port since boot -> red
# ontap_port_errors_crit: 10000

## fewer spare disks than this on a node = amber (0 = red)
# ontap_min_spares: 1

## the error events of the last this-many hours
# ontap_ems_hours: 24

## rows per table (problems first); the job's artifacts have all
# ontap_report_max_rows: 50

## the snapshot space table: the volumes whose snapshots use the most
# ontap_snapshot_top: 25

## The job stays green when it finds problems: the report and email say what. true = mark it FAILED
## when there is a critical finding or a cluster could not be read, for workflows.
# ontap_report_fail: false

# ---- site_email - usually in all.yml -------------------------------------------------------------
## Who gets it: a list, or text with commas / spaces / one per line (a survey answer). Empty = no
## email. Set it on each TEMPLATE (its Variables, or a survey): in all.yml every report job emails.
# report_email_to: []

## copied: a list, or text like report_email_to
# report_email_cc: []

## the sender, e.g. aap-noreply@yoursite.mil
# report_email_from: ""

## your mail relay, e.g. smtp.yoursite.mil
# report_email_smtp_host: ""

## 25 or 587 with starttls, 465 with ssl
# report_email_smtp_port: 25

## starttls = encrypt after connecting (the relay must offer it); ssl = encrypted from the start
## (port 465); none = not encrypted (only for a relay without encryption; then no login is sent).
# report_email_security: starttls

## a CA file that signed the relay's certificate (empty = the CAs the execution environment trusts)
# report_email_ca_path: ""

## put before every subject, e.g. "[AAP] Certificate report: ..."
# report_email_subject_prefix: "[AAP]"

## Send a formatted (HTML) version too, for reports that come with one (all VMware jobs). The email
## always carries a plain-text copy for mail clients that do not show HTML. false = plain text only.
# report_email_html: true

## The look of the HTML version. Your own: copy roles/site_email/templates/report.html.j2 (e.g. to
## playbooks/files/email/report.html.j2), change it, and set report_email_html_template: "{{
## playbook_dir }}/files/email/report.html.j2"
# report_email_html_template: report.html.j2
