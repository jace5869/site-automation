## docs/WINDOWS.md "Schedule a restart". Limit: the servers (required). Job type: Check first = the plan.
## The survey asks: the time (24-hour HH:MM), only if a reboot is pending (yes/no), the reason, a change number.
# win_restart_time: "22:30"
# win_restart_only_if_pending: false
# win_restart_reason: "Monthly patches"
# win_restart_change: ""
## The time zone of the time (default report_time_zone; empty = the job refuses; UTC is allowed)
# win_restart_time_zone: America/New_York
## SolarWinds: the node unmanaged from 5 minutes before to 10 after (auto: with a solarwinds_manage credential; false: never)
# win_restart_solarwinds: auto

# ---- win_restart ---------------------------------------------------------------------------------
## Pending file rename operations (PendingFileRenameOperations) are shown, but count as "a reboot is
## pending" only with true: some software sets them all the time, so with true "only if pending"
## would restart nearly every server.
# win_restart_count_file_renames: false

## A time today closer than this (minutes) is refused - never a restart right away. A time that has
## passed means tomorrow.
# win_restart_min_lead_minutes: 5

## The most servers one run may schedule (the Limit is required: an empty one is refused).
# win_restart_max_hosts: 50

## The warning time before the restart (seconds): shutdown /r /t <this>. Logged-on users see it.
# win_restart_delay_seconds: 60

## The shutdown reason code (shutdown /d): p:0:0 = Other (Planned). p:4:1 = Application: Maintenance
## (Planned).
# win_restart_reason_code: "p:0:0"

## The scheduled task's folder in Task Scheduler.
# win_restart_task_path: "\\site-automation\\"

## The scheduled task's name (one per server). Only this exact folder and name is touched, and only
## a task this job made.
# win_restart_task_name: "site-automation restart"

## The task directory must be a subdirectory of Program Files with a trusted owner and ACL.
# win_restart_dir: '$env:ProgramFiles\site-automation\restart'

## The window: this many minutes before the restart time ...
# win_restart_solarwinds_before_minutes: 5

## ... to this many minutes after it.
# win_restart_solarwinds_minutes: 10

## Seconds to wait for SolarWinds' answer to one call (no retry).
# win_restart_solarwinds_timeout: 20

## All SolarWinds work of one run at most this many seconds (it comes after the restart tasks are
## registered); past it, or with the restart less than a minute away, a server's node is left
## managed (a warning).
# win_restart_solarwinds_budget_seconds: 120

# ---- site_portal_stack ---------------------------------------------------------------------------
## the portal's path on the proxy
# portal_path: /portal/

