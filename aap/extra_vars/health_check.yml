# ==================================================================================================
# Variables for the job template "Health check"
#   playbook:    playbooks/health_check.yml
#   credentials: Machine (ACT model key with use_act)
#
# HOW TO USE: copy this file into the template's Variables box (YAML selected).
#   - A setting starting with "# " is switched off. To use it, delete the "# " in front of its
#     line (and of the indented lines under it), then change the value. Lines starting with
#     "## " say what the setting below them does.
#   - Switch on only what you change: a value here beats the same setting everywhere else,
#     including playbooks/group_vars/all.yml. The values shown are the defaults.
#   - The settings under "usually in all.yml" apply to every job: set them once there.
#   - Every setting, in full: docs/VARIABLES_REFERENCE.md (the Settings Reference PDF).
# GENERATED by scripts/gen_template_vars.py from roles/*/defaults/main.yml - do not edit here.
# ==================================================================================================
---
## The checks to run: daily, weekly, all, or names, e.g. [disk, services]
# health_checks: [daily]
## ACT (GenAI) looks at each host with findings (docs/ADDING_ACT.md)
# use_act: false

# ---- check_accounts ------------------------------------------------------------------------------
## people's accounts start here
# check_accounts_min_uid: 1000

## the STIG wants unused accounts disabled after 35 days
# check_accounts_inactive_days: 35

## Accounts that may stay unused (break-glass, service accounts that never log in interactively)
# check_accounts_ignore_inactive: []

## sudoers entries allowed to use NOPASSWD, e.g. the account AAP connects as: [svc_aap, "%wheel"]
# check_accounts_nopasswd_allowed: []

## Accounts whose password/account expiry matters - above all the account AAP logs in with. e.g.
## [svc_aap]
# check_accounts_expiry_watch: []

## a watched account's password or account expiring within this many days -> warning (3 days or less
## -> critical)
# check_accounts_expiry_warn_days: 14

# ---- check_auditd --------------------------------------------------------------------------------
## fewer loaded rules than this = the STIG rules are missing
# check_auditd_min_rules: 5

## the audit log's filesystem
# check_auditd_log_warn_pct: 75

## % used of that filesystem -> critical (warning from check_auditd_log_warn_pct)
# check_auditd_log_crit_pct: 90

## true = au-remote (audisp-remote) must be active
# check_auditd_remote_required: false

## Accounts whose audit events are expected in bulk and do NOT count toward the volume warning, e.g.
## the account a vulnerability scanner logs in with (a credentialed scan runs thousands of commands
## with sudo). Names or UIDs; a host that does not have the account skips it. The report still says
## how much they made, and they still count for retention and disk space (those are physical). An
## audit rule that stops recording an account ("-a never,..." with auid= or uid=) is reported unless
## the account is on this list. e.g. [scanner-svc]
# check_auditd_exclude_accounts: []

## look at the audit records of the last N hours
# check_auditd_volume_hours: 24

## warning above this many MB of audit records a day (excluded accounts not counted)
# check_auditd_volume_warn_mb_day: 200

## With max_log_file_action ROTATE, auditd keeps num_logs files of max_log_file MB and deletes the
## oldest. Warning when what is left on disk reaches back fewer hours than this. The STIG wants a
## week (168) when the records are NOT sent off the host as they are written (RHEL-08-030660). 0 =
## off.
# check_auditd_retention_warn_hours: 24

## The breakdown (which account, which rule, which program) reads the audit log files of the window
## at low CPU and disk priority, and only when the volume or the retention is over its limit. It
## stops after this many seconds on a host with very large logs (and says so).
# check_auditd_volume_timeout: 120

# ---- check_certs ---------------------------------------------------------------------------------
## a certificate expiring within this many days -> warning (and amber in the certificate report)
# check_certs_warn_days: 30

## within this many days (or expired) -> critical
# check_certs_crit_days: 14

## Certificate files (PEM) to check. Globs work. Every certificate in a file is checked (a chain
## file with an expiring intermediate is a problem too). e.g. [/etc/stigman/*.crt,
## /etc/pki/tls/certs/server.crt]
# check_certs_files: []

## Also look for certificates in the usual places. Files with many certificates are CA bundles
## (hundreds of roots, noisy) and are skipped unless listed in check_certs_files. Text (PEM) and
## binary (DER) certificates are both read; the names in any case (.crt, .CRT, .Pem ...).
# check_certs_discover: true

## the folders searched (two levels deep) for *.crt, *.pem, *.cer, *.der (/etc/stigman/nginx/tls:
## STIG Manager's nginx certificate, three levels down)
# check_certs_discover_dirs: [/etc/pki/tls/certs, /etc/pki/nginx, /etc/nginx, /etc/httpd/conf.d, /etc/stigman, /etc/stigman/nginx/tls]

## more folders searched the same way, added to the ones above (no need to repeat them), e.g.
## [/home, /root, /opt/app/certs]
# check_certs_discover_extra_dirs: []

## regular expression: found files whose path matches are skipped
# check_certs_discover_exclude: 'ca-bundle|ca-certificates|/localhost\.crt$'

## a found file with more certificates than this is a CA bundle: listed as not checked (list it in
## check_certs_files to check each)
# check_certs_discover_max_per_file: 10

## Regular expression on the subject of a package's placeholder certificate: postfix's
## /etc/pki/tls/certs/postfix.pem (O=SomeOrganization), self-signed for a year at install and never
## renewed. A found one is listed as not checked (no finding, no ticket) and none gets a CSR. A real
## certificate put in its place is checked; so is a file listed in check_certs_files.
# check_certs_placeholder_subject: '(^|,)O=SomeOrganization(,|$)'

## TLS endpoints, checked FROM this host, e.g. the site's own web server: check_certs_endpoints: -
## {name: STIG Manager, host: 127.0.0.1, port: 443, servername: stigman.example.mil}
# check_certs_endpoints: []

## Java keystores (Tomcat, the ServiceNow MID Server ...). A JKS keystore lists without a password;
## a PKCS12 one needs it - give the NAME of an environment variable that holds it (set by an AAP
## credential), never the password itself: check_certs_keystores: - {path:
## /opt/servicenow/mid/agent/security/agent_keystore, password_env: KEYSTORE_PASSWORD}
# check_certs_keystores: []

## ---- Finding them by themselves (the certificate report turns both on; the health check does not)
## ---- Listening TCP ports that answer TLS: each probed once, on the address it listens on, with
## `openssl s_client` (check_certs_probe_timeout seconds each, at most
## check_certs_discover_ports_max ports). Not these ports: plain-text services that would only log a
## stray connection.
# check_certs_discover_ports: false

## ports never probed (plain-text services: ssh, smtp, dns, http, ldap, databases ...)
# check_certs_discover_ports_skip: [22, 25, 53, 80, 110, 111, 123, 143, 323, 389, 631, 2049, 3306, 5355, 5432, 6379, 11211, 20048]

## probe at most this many listening ports (the rest are listed as not probed)
# check_certs_discover_ports_max: 25

## seconds for each port probe
# check_certs_probe_timeout: 3

## Java keystores (*.jks, *.keystore, *.p12, *.pfx) in these folders, and the ones running Java
## programs use (-Djavax.net.ssl.keyStore=...). A keystore that needs a password is listed as not
## checked: no password is ever guessed - give it in check_certs_keystores (password_env). The JDK's
## own trust stores (cacerts) are skipped.
# check_certs_discover_keystores: false

## the folders searched for keystores
# check_certs_discover_keystore_dirs: [/etc, /opt, /srv, /usr/share/tomcat, /var/lib/tomcat, /var/lib/pki]

## how many folder levels deep the search goes
# check_certs_discover_keystore_depth: 5

## regular expression: keystore paths skipped (the JDK's trust stores)
# check_certs_discover_keystore_exclude: '/(cacerts|jssecacerts)$|/jre/lib/security/|/lib/security/'

## read at most this many found keystores per host
# check_certs_discover_keystore_max: 40

## The host's trust store: the CA certificates it trusts, put in by update-ca-trust (the DoD roots
## ...). Every file in these folders, whatever its name. The certificate report lists them with
## their dates - never a finding, a ticket or a CSR: a CA renews its own certificate (put its new
## one in the folder and run update-ca-trust), and a certificate there is not this host's own. The
## report turns this on.
# check_certs_discover_trust: false

## the folders read (not the folders below them)
# check_certs_trust_dirs: [/etc/pki/ca-trust/source/anchors]

## Hosts whose certificates are renewed by hand (IdM, AAP ...): in the certificate report and its
## tickets as usual - each ticket says it is renewed by hand - but the renewal makes no CSR for them
## (listed, with why). The same forms as cert_skip_hosts / cert_skip_groups (which leave a host out
## of the report too). e.g. [idm01, 'aap*'], or 'idm01, aap*'
# cert_renew_skip_hosts: []

## e.g. [idm]
# cert_renew_skip_groups: []

# ---- check_containers ----------------------------------------------------------------------------
## Containers that MUST exist and run on these hosts: a container name, or OWNER/NAME for one owner
## (root/web, alice/web). A name alone matches that container of any owner. Also matches a Quadlet
## file name without .container, e.g. [stigman-mysql, stigman-api, alice/web].
# check_containers_required: []

## A container that stopped with an error (exit code not 0) this many hours ago or less is reported
## (containers:crashed). Older crashes are history and are not reported.
# check_containers_recent_hours: 24

## More restarts than this (podman's restart count, or its systemd unit's) = a restart loop.
# check_containers_restart_warn: 3

# ---- podman_discover -----------------------------------------------------------------------------
## false = do not look for containers at all (the containers check then says "skipped", and Service
## watch watches only its watch_containers list).
# podman_discover_enabled: true

## Also look at the containers of users (rootless podman). A user is looked at when a podman process
## (conmon) runs as them, when they have "linger" on (/var/lib/systemd/linger/NAME), or when they
## are in /etc/subuid AND have container storage (~/.local/share/containers/storage). Their
## containers are read AS that user (runuser), and only when /run/user/UID exists - otherwise podman
## would create it (a change), so such a user is listed as "not checked" instead.
# podman_discover_rootless: true

## More users to look at (names), e.g. an application account the rules above miss.
# podman_discover_users: []

## Containers to leave out, as regular expressions that must match the WHOLE container name or
## OWNER/NAME, e.g. ['test-.*'] (every container whose name starts with test-, any owner),
## ['alice/.*'] (all of alice's containers), ['root/web'] (root's web only).
# podman_discover_ignore: []

## Where root's Quadlet files are (*.container, and *.kube: a pod from Kubernetes YAML). A user's
## are always read from ~/.config/containers/systemd, /etc/containers/systemd/users/UID and
## /etc/containers/systemd/users.
# podman_discover_quadlet_dirs: [/etc/containers/systemd, /usr/share/containers/systemd]

## Where root's own systemd units are looked for: a *.service that runs podman (`podman generate
## systemd`, `podman run`, `podman kube play`, `podman pod start`, podman-compose / docker-compose),
## and the podman-kube@ units enabled there (.wants links). A user's: ~/.config/systemd/user.
## Packaged units (/usr/lib/systemd/system) are podman's own tools and are not looked at.
# podman_discover_unit_dirs: [/etc/systemd/system, /usr/local/lib/systemd/system]

## Seconds one podman or systemctl call may take before it is given up (reported as a finding).
# podman_discover_timeout: 60

# ---- check_disk ----------------------------------------------------------------------------------
## % used -> warning
# check_disk_warn_pct: 85

## % used -> critical
# check_disk_crit_pct: 95

## inodes: too many small files fill a disk too
# check_disk_inode_warn_pct: 85

## % of inodes used -> critical (warning from check_disk_inode_warn_pct)
# check_disk_inode_crit_pct: 95

## Different limits for particular mount points, e.g. keep the audit log partition emptier:
## check_disk_overrides: /var/log/audit: {warn: 70, crit: 85}
# check_disk_overrides: {}

## Mount points to skip (regular expressions).
# check_disk_ignore:
#   - '^/(proc|sys|dev|run)(/|$)'
#   - '^/etc/(hosts|hostname|resolv\.conf)$'   # bind-mounted files (containers)
#   - '^/var/lib/containers/storage/'

## filesystem types never checked (df -x)
# check_disk_exclude_types: [tmpfs, devtmpfs, squashfs, overlay, iso9660, efivarfs, nsfs]

## Days-until-full forecast. Each run adds a sample (date, bytes used) per mount to a small file on
## the host; once there is at least a day of history, the growth rate predicts when the filesystem
## fills. Check mode (a dry run) reads the history but does not add to it.
# check_disk_forecast: true

## full within this many days at the current growth -> warning
# check_disk_forecast_warn_days: 14

## full within this many days -> critical
# check_disk_forecast_crit_days: 3

## where the forecast keeps its samples, on the host
# check_disk_history_file: /var/lib/site-health/disk-history.json

## samples older than this are dropped (the forecast uses what is left)
# check_disk_history_keep_days: 30

## seconds for df
# check_disk_timeout: 20

# ---- check_fapolicyd -----------------------------------------------------------------------------
## true = every host in the play must have fapolicyd. false = only check hosts that have it.
# check_fapolicyd_required: false

## permissive = 1 means it only logs, never blocks
# check_fapolicyd_expect_enforcing: true

## Compare the trust database with the files on disk (can take a minute on big hosts; files changed
## outside RPM show up here, e.g. after a manual update).
# check_fapolicyd_check_trustdb: true

## ausearch -ts value
# check_fapolicyd_denials_since: yesterday

## this many denials or more since check_fapolicyd_denials_since -> warning
# check_fapolicyd_denials_warn: 1

# ---- check_logging -------------------------------------------------------------------------------
## the journal must survive a reboot (/var/log/journal)
# check_logging_journal_persistent: true

## The central log server(s) this host forwards to, e.g. check_logging_remote: - {name: SIEM, host:
## siem.example.mil, port: 6514}
# check_logging_remote: []

## seconds to wait for each log server's TCP port
# check_logging_timeout: 5

## rsyslog keeps messages it cannot deliver in /var/lib/rsyslog. A big queue = the log server has
## been unreachable for a while.
# check_logging_queue_warn_mb: 100

## Error-priority journal messages in the last day. Many = something is complaining a lot.
# check_logging_errors_since: "-24h"

## this many error messages or more -> warning
# check_logging_errors_warn: 500

# ---- check_mariadb -------------------------------------------------------------------------------
## Which hosts: members of any of the inventory groups mariadb_hosts, mysql_hosts, database_hosts,
## mariadb or mysql, or any host that names a container below (or turns discovery on). Set this
## true/false to override for a host or group.
# check_mariadb_enabled: >-
#   {{ (group_names | intersect(['mariadb_hosts', 'mysql_hosts', 'database_hosts', 'mariadb', 'mysql']) | length > 0)
#      or (check_mariadb_container | length > 0) or (check_mariadb_containers | length > 0)
#      or (check_mariadb_container_discover | bool) }}

## MariaDB or MySQL in podman containers (e.g. the ServiceNow database). The client inside each
## container is used (podman exec). Name them in one of these ways; all are checked, each as its own
## instance: check_mariadb_container: mariadb one container check_mariadb_containers: [mariadb,
## snow-db] several containers on the same host check_mariadb_container_discover: true find them:
## every container (running or not) whose image matches check_mariadb_container_image_regex With
## none of them, `auto` (the default) decides by itself: a database SERVER installed on the host
## (one of check_mariadb_server_paths) -> the host's own database (its systemd unit); no server on
## the host but podman -> the containers are found as with discovery. So a unit that only starts
## podman containers (and is then inactive) is not mistaken for the database. false = always the
## host's own.
# check_mariadb_container: ""

## several containers on one host, e.g. [mariadb, snow-db] (see above)
# check_mariadb_containers: []

## auto, true or false: find database containers by their image (see above)
# check_mariadb_container_discover: auto

## Where a database server installed on the host lives (any one present = a host install, for
## `auto`).
# check_mariadb_server_paths: [/usr/sbin/mariadbd, /usr/libexec/mariadbd, /usr/sbin/mysqld, /usr/libexec/mysqld,
#                              /usr/bin/mariadbd, /usr/bin/mysqld]

## regular expression: a container whose image matches is a database (discovery)
# check_mariadb_container_image_regex: '(mariadb|mysql|percona)'

## ROOTLESS podman: the containers belong to a user (e.g. AAP's own MariaDB, or an application
## account), and only that user can see them. Name the user and the check runs podman AS that user.
## Empty = root's containers.
# check_mariadb_container_user: ""

## The systemd unit (host installs). Empty = the first of mariadb, mysqld, mysql that exists.
# check_mariadb_service: ""

## How to log in. Without a credential: as root through the local socket - MariaDB's default for a
## host install on RHEL (no password needed when the job runs with sudo). A database in a CONTAINER
## usually gives root a password (the official images do), and MySQL host installs usually do too,
## so there attach the "MariaDB monitor" AAP credential (it serves MySQL as well): it sets
## MARIADB_MONITOR_USER / MARIADB_MONITOR_PASSWORD, and the password reaches the client only through
## the environment (never the command line). The read-only monitoring account needs only (MySQL):
## GRANT PROCESS, REPLICATION CLIENT ON *.* TO 'monitor'@'localhost'; and, for Group Replication:
## GRANT SELECT ON performance_schema.* TO 'monitor'@'localhost'; MariaDB 10.5.9 and later
## (REPLICATION CLIENT no longer covers replication status there): GRANT PROCESS, REPLICA MONITOR ON
## *.* TO 'monitor'@'localhost'; (before 10.5.9: PROCESS, REPLICATION CLIENT) Extra client options,
## e.g. ['--socket=/var/lib/mysql/mysql.sock'] or ['--host=127.0.0.1', '--port=3306']
# check_mariadb_client_args: []

## connections in use, % of max_connections
# check_mariadb_conn_warn_pct: 80

## connections in use, % of max_connections -> critical
# check_mariadb_conn_crit_pct: 95

## queries executing at this moment
# check_mariadb_threads_running_warn: 32

## a query running longer than this is "long"
# check_mariadb_long_query_seconds: 300

## seconds a replica is behind its primary
# check_mariadb_replica_lag_warn: 300

## seconds behind its primary -> critical
# check_mariadb_replica_lag_crit: 1800

## expected Galera / XtraDB Cluster size (0 = do not check the size)
# check_mariadb_galera_size: 0

## expected MySQL Group Replication members (0 = do not check the size)
# check_mariadb_group_size: 0

## restarted less than this ago -> warning
# check_mariadb_restart_warn_minutes: 60

## % of reads served from memory (only judged after 1M reads)
# check_mariadb_bufferpool_hit_warn: 95

## [ERROR] lines in its log this recent
# check_mariadb_error_since_days: 1

## the filesystem holding the data directory
# check_mariadb_disk_warn_pct: 85

## % used of the data directory's filesystem -> critical
# check_mariadb_disk_crit_pct: 95

## ---- PERFORMANCE (all warnings) ----------------------------------------------------------------
## false = only the health checks above. Counters that count since the server started (slow queries,
## temporary tables, joins, lock waits, deadlocks ...) are judged as an average since that start,
## and only once it has run check_mariadb_perf_min_uptime_hours (cold caches right after a start are
## normal). Old transactions, lock waits, purge lag and open files are judged as they are now.
# check_mariadb_performance: true

## judge the averages since the start only after this many hours
# check_mariadb_perf_min_uptime_hours: 2

## queries slower than long_query_time, per hour
# check_mariadb_slow_per_hour_warn: 60

## % of temporary tables that went to disk (judged after 1000 of them)
# check_mariadb_tmp_disk_pct_warn: 25

## joins without a usable index (Select_full_join), per hour
# check_mariadb_full_join_per_hour_warn: 100

## % of table locks (MyISAM / Aria) that had to wait (judged after 10000)
# check_mariadb_table_lock_wait_pct_warn: 1

## average InnoDB row lock wait, ms (judged after 100 waits)
# check_mariadb_row_lock_avg_ms_warn: 500

## InnoDB deadlocks per hour (judged after 10 of them)
# check_mariadb_deadlocks_per_hour_warn: 1

## waits for a free buffer pool page / a full log buffer, per hour (after 10)
# check_mariadb_innodb_waits_per_hour_warn: 1

## failed connection attempts per hour
# check_mariadb_aborted_connects_per_hour_warn: 60

## tables opened per hour while the table cache is full
# check_mariadb_table_open_per_hour_warn: 600

## files open, % of open_files_limit
# check_mariadb_open_files_warn_pct: 85

## a session waiting this long for a lock, right now
# check_mariadb_lock_wait_seconds: 30

## an InnoDB transaction open this long, right now
# check_mariadb_long_trx_seconds: 600

## InnoDB history list length (old row versions not yet purged)
# check_mariadb_history_length_warn: 1000000

