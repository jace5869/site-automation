# ==================================================================================================
# Variables for the job template "VM - alarms ACT analysis"
#   playbook:    playbooks/vm_alarm_act_analysis.yml
#   credentials: VMware vCenter, ACT model key
#
# HOW TO USE: copy this file into the template's Variables box (YAML selected).
#   - A setting starting with "# " is switched off. To use it, delete the "# " in front of its
#     line (and of the indented lines under it), then change the value. Lines starting with
#     "## " say what the setting below them does.
#   - Switch on only what you change: a value here beats the same setting everywhere else,
#     including playbooks/group_vars/all.yml. The values shown are the defaults.
#   - The settings under "usually in all.yml" apply to every job: set them once there.
#   - Every setting, in full: docs/VARIABLES_REFERENCE.md (the Settings Reference PDF).
# GENERATED by scripts/gen_template_vars.py from roles/*/defaults/main.yml - do not edit here.
# ==================================================================================================
---
# ---- vmware_vm -----------------------------------------------------------------------------------
## only needed when the same VM name exists in two datacenters
# vmware_datacenter: ""

## Check vCenter's certificate. false only if the execution environment does not trust your CA yet.
# vmware_validate_certs: true

## Several vCenters (e.g. Enhanced Linked Mode), one report: the reports and the ESXi security
## settings read the credential's vCenter AND these (names, or name:port), with the same account.
## The same vCenter under two names is read once. docs/VMWARE.md, "Several vCenters". e.g.
## [vc01.yoursite.mil, vc02.yoursite.mil]
# vmware_vcenters: []

## true = the job shows failed when a vCenter could not be read (the report lists it in red either
## way)
# vmware_vcenter_fail_unread: false

## Whose triggered alarms and configuration issues: vcenter, datacenter, cluster, host. Add vm,
## datastore or network for theirs too (VM alarms can be many).
# vm_alarm_types: [vcenter, datacenter, cluster, host]

## The events of the last this-many hours: every error and warning, failed logins, host connection
## events and VM shutdowns / power-offs / resets / HA restarts. 0 = alarms and host state only.
# vm_alarm_hours: 24

## read at most this many events (the newest)
# vm_alarm_max_events: 5000

## read at most this many alarm status changes (the newest; 0 = no "Alarms that fired")
# vm_alarm_max_alarm_changes: 2000

## rows per table in the report (the artifacts have them all)
# vm_alarm_max_rows: 200

## This many failed logins of one user from one place, or more, is critical (fewer: a warning).
# vm_alarm_login_critical: 10

## The event types read whatever their category (vCenter's event type names). Add to these lists
## rather than replacing them; [] = none of that kind.
# vm_alarm_login_event_types: [BadUsernameSessionEvent, com.vmware.sso.LoginFailure, esx.audit.account.locked,
#                              esx.audit.account.loginfailures]

## Events about a host losing (or failing to get back) its connection to vCenter: the Host
## connection table.
# vm_alarm_connection_event_types: [HostConnectionLostEvent, HostNotRespondingEvent, HostDisconnectedEvent,
#                                   HostReconnectionFailedEvent, HostShutdownEvent, HostCnxFailedEvent,
#                                   HostCnxFailedAccountFailedEvent, HostCnxFailedNetworkErrorEvent,
#                                   HostCnxFailedNoConnectionEvent, HostCnxFailedTimeoutEvent,
#                                   HostCnxFailedBadUsernameEvent, HostCnxFailedNoAccessEvent]

## Events about a VM stopping, restarting or failing over (guest shutdown, power off, HA restart):
## the VM events table.
# vm_alarm_vm_event_types: [VmGuestShutdownEvent, VmGuestRebootEvent, VmPoweredOffEvent, VmResettingEvent,
#                           VmFailoverFailed, VmDasBeingResetEvent, VmDasBeingResetWithScreenshotEvent,
#                           VmRestartedOnAlternateHostEvent, com.vmware.vc.ha.VmRestartedByHAEvent,
#                           VmFailedToPowerOnEvent, VmDisconnectedEvent]

## ACT analysis (playbooks/vm_alarm_act_analysis.yml). ACT runs on the AAP side (the execution
## environment), never on the ESXi hosts; the model provider, model, URL, proxy and CA are the
## site_act_* settings (roles/site_act/defaults/main.yml), the key an "ACT model key" credential.
## analyze at most this many problems, the most severe first
# vm_alarm_act_max_items: 40

## configuration issues too (false = alarms and events only)
# vm_alarm_act_config_issues: true

## true = email even when there is nothing to analyze
# vm_alarm_act_email_if_none: false

## first check that the AAP node can reach the model's URL
# vm_alarm_act_check_url: true

## Seconds the model may take for its answer (ACT's GENAI_TIMEOUT, 90 by default, is too short for a
## long analysis): site_act_model_timeout (600) unless set here. A GENAI_TIMEOUT in site_act_env
## wins.
# vm_alarm_act_model_timeout: "{{ site_act_model_timeout | default(600) }}"

# ---- site_email - usually in all.yml -------------------------------------------------------------
## Who gets it: a list, or text with commas / spaces / one per line (a survey answer). Empty = no
## email. Set it on each TEMPLATE (its Variables, or a survey): in all.yml every report job emails.
# report_email_to: []

## copied: a list, or text like report_email_to
# report_email_cc: []

## the sender, e.g. aap-noreply@yoursite.mil
# report_email_from: ""

## your mail relay, e.g. smtp.yoursite.mil
# report_email_smtp_host: ""

## 25 or 587 with starttls, 465 with ssl
# report_email_smtp_port: 25

## starttls = encrypt after connecting (the relay must offer it); ssl = encrypted from the start
## (port 465); none = not encrypted (only for a relay without encryption; then no login is sent).
# report_email_security: starttls

## a CA file that signed the relay's certificate (empty = the CAs the execution environment trusts)
# report_email_ca_path: ""

## put before every subject, e.g. "[AAP] Certificate report: ..."
# report_email_subject_prefix: "[AAP]"

## Send a formatted (HTML) version too, for reports that come with one (all VMware jobs). The email
## always carries a plain-text copy for mail clients that do not show HTML. false = plain text only.
# report_email_html: true

## The look of the HTML version (docs/EMAIL_REPORTS.md, "The look"): standard = a header band in the
## report's colour (green, amber, red, blue) with number boxes under it; command = a dark header
## with your logo and report_email_header_text, the job's last runs as a strip of bars
## (report_history), the numbers in one row.
# report_email_theme: standard

## command: the small line above the title
# report_email_header_text: Site automation report

## Your logo in the header (both looks): a PNG, JPEG or GIF in your repository - a path from
## playbooks/ (files/report_logo.png = playbooks/files/report_logo.png) or a full path. Attached to
## each email, so keep it small: about 160 px tall, under 100 KB. Updating with scripts/update-from-
## release: list the file in .site-local, or the update deletes it.
# report_logo_file: ""

## pixels in the email (its width follows)
# report_logo_height: 84

## command: the job's last runs, read from AAP - attach a "Red Hat Ansible Automation Platform"
## credential (a user with at least Read on the template) to the template; without it the email goes
## out without the strip.
# report_history: true

## bars in the strip, this run included
# report_history_runs: 14

## a CA file for AAP's own HTTPS certificate ("" = what the execution environment trusts)
# report_history_aap_ca_path: ""

## Your own look instead: copy roles/site_email/templates/report.html.j2 (or report_command.html.j2)
## to e.g. playbooks/files/email/report.html.j2, change it, and set report_email_html_template: "{{
## playbook_dir }}/files/email/report.html.j2" report.html.j2 (the default) = the look
## report_email_theme picks.
# report_email_html_template: report.html.j2

# ---- site_act - usually in all.yml ---------------------------------------------------------------
## ---- Which model ACT talks to -----------------------------------------------------------------
## site_act_provider genai GenAI.mil (the default) asksage Ask Sage (set site_act_url to your
## organization's instance) genai-beta the GenAI.mil beta proxy (preview models) site_act_models the
## model to use FOR EACH provider, e.g. {genai: gemini-3.8-flash, asksage: gpt-5.6-sol-gov} so the
## model follows whichever provider is picked. A provider not listed uses ACT's own default model.
## site_act_urls the API URL for each provider, e.g. {asksage:
## https://<host>/server/openai/v1/chat/completions}; a provider not listed uses ACT's default URL
## site_act_model one model for this run, whatever the provider (e.g. a survey answer); empty =
## site_act_models site_act_url one URL for this run; empty = site_act_urls site_act_ca a CA bundle
## file ON THE HOSTS for the provider's TLS certificate (internal/DoD CA); empty = the host's system
## trust store The API KEY never goes here: it comes from an AAP credential - "ACT model key" (GenAI
## and Ask Sage keys) or "ACT GenAI beta key". ACT runs ON EACH HOST, so the hosts must be able to
## reach the provider's URL (a proxy or firewall rule may be needed).
# site_act_provider: genai

## the model for each provider (see above): the model follows the provider picked
# site_act_models: {genai: gemini-3.8-flash, asksage: gpt-5.6-sol-gov}

## the API URL for each provider; a provider not listed uses ACT's default
# site_act_urls: {}

## one model for this run, whatever the provider (e.g. a survey answer); empty = site_act_models
# site_act_model: ""

## one URL for this run; empty = site_act_urls
# site_act_url: ""

## a CA bundle file ON THE HOSTS for the provider's certificate; empty = the host's trust store
# site_act_ca: ""

## Any other ACT environment settings (advanced; these win over the ones above), e.g. {HTTPS_PROXY:
## "http://proxy.yoursite.mil:8080"}. See the top of vendor/act/act for the list. Every ACT job
## streams the model's answer (ACT_STREAM=1), so a firewall or proxy idle timeout does not cut a
## long answer ("connection reset by peer"); {ACT_STREAM: "0"} here turns that off.
# site_act_env: {}

## Seconds the model may take for ONE answer, retries after a provider hiccup included (ACT's
## GENAI_TIMEOUT; ACT's own default, 90, is too short for a long analysis or a busy provider). Every
## ACT job uses it: the runbooks' use_act, the VMware alarms and capacity analyses, service watch.
# site_act_model_timeout: 600

## seconds for one whole ACT run (several answers): keep it above site_act_model_timeout
# site_act_timeout: 1200

## anything ACT should know about this site
# site_act_extra_instructions: ""
