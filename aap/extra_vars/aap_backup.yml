## Serialized (Concurrent jobs off). Runs on the single AAP host (group aap_hosts, or target/Limit) as non-root ansible.
## Put aap_backup_path and aap_installer_dir in playbooks/group_vars/all.yml; run Check first to verify preflight.
# target: aap01.corp.example.mil

# ---- aap_backup ----------------------------------------------------------------------------------
## Non-root installation owner account on the AAP host (rootless podman and containerized installer
## owner).
# aap_backup_user: ansible

## Absolute path to the mounted backup destination on the AAP host (e.g. an NFS share). Never auto-
## picked.
# aap_backup_path: /mnt/ansible_backup

## Expected active mount point for aap_backup_path (empty = any real non-root mount; set e.g.
## /mnt/ansible_backup to enforce an exact mount).
# aap_backup_expected_mount: ""

## Expected mount source for aap_backup_path (empty = not checked; e.g.
## 192.0.2.50:/exports/aap_backup).
# aap_backup_expected_source: ""

## Allowed filesystem types for aap_backup_path (empty = any real non-pseudo filesystem, e.g. [nfs,
## nfs4, xfs, ext4]).
# aap_backup_expected_fstypes: []

## Allow aap_backup_path to sit on the root filesystem / (false refuses unmounted shares exposing an
## empty local folder on /).
# aap_backup_allow_root_fs: false

## Conservative first-run backup size estimate in GiB when no prior verified backup (latest.json)
## exists yet.
# aap_backup_estimate_gb: 50

## Safety headroom percentage added on top of the baseline size (last backup size or estimate),
## rounded up.
# aap_backup_margin_pct: 25

## Containerized AAP 2.7 installer directory on the AAP host (under the ansible user's home by
## default).
# aap_installer_dir: "/home/ansible/ansible-automation-platform-containerized-setup"

## Installer inventory filename inside aap_installer_dir, or an absolute path (empty = first
## existing of inventory, inventory-growth).
# aap_installer_inventory: ""

## Containerized installer backup playbook FQCN or path run from aap_installer_dir.
# aap_installer_playbook: "ansible.containerized_installer.backup"

## Path or command name for ansible-playbook on the AAP host used to run the containerized installer
## backup.
# aap_installer_ansible_playbook_bin: "ansible-playbook"

## Extra command-line arguments passed to the containerized installer backup playbook (e.g.
## [--vault-password-file, /home/ansible/.vault_pass]).
# aap_installer_extra_args: []

## Pass --become to the containerized installer backup invocation when the installer inventory
## requires privilege escalation.
# aap_installer_become: false

## Maximum seconds to wait for the containerized installer backup command before timing out with SA-
## AAPBK-07.
# aap_backup_timeout_seconds: 7200

## Explicit metadata file to read the exact AAP build and release from (empty = auto-read from
## installer dir and container labels).
# aap_backup_version_file: ""

## Manual exact AAP build/release string used only when automatic version detection is unavailable
## (empty = auto-detect required).
# aap_backup_version_override: ""

## Record running/pending AAP jobs via the AAP API before backup when an AAP credential is attached
## (read-only).
# aap_backup_pre_check_running_jobs: true

## Mount table file read for mount verification and target discovery (/proc/self/mountinfo on
## Linux).
# aap_backup_mountinfo_path: "/proc/self/mountinfo"

## Podman executable name or path on the AAP host (used for version labels and custom EE image
## exports).
# aap_backup_podman_bin: "podman"

## ---- Retention (1.142.0, off by default) ----------------------------------------------------
## Delete older verified backups after a new backup succeeds and passes SHA-256 verification (off by
## default).
# aap_backup_retention_enabled: false

## Minimum number of newest verified backups always kept when retention is enabled (never deletes
## the newest verified copy).
# aap_backup_retention_keep: 4

## Optional maximum age in days for verified backups when retention is enabled (0 = count-based
## only; aap_backup_retention_keep still protects newest copies).
# aap_backup_retention_keep_days: 0

## Days to keep quarantined failed staging directories when retention is enabled (0 = never delete
## quarantine).
# aap_backup_retention_quarantine_days: 14

## ---- Weekly schedule in AAP (1.142.0, off by default) ---------------------------------------
## Create or update an optional weekly backup schedule on the AAP - backup job template (off by
## default; needs AAP credential when true).
# aap_backup_schedule_enabled: false

## Name of the weekly schedule created on aap_backup_schedule_template when
## aap_backup_schedule_enabled is true.
# aap_backup_schedule_name: "Weekly AAP backup"

## Weekly run time in 24-hour format: "weekly <Mon..Sun> HH:MM" (defaults to Sunday 02:00 Berlin
## time).
# aap_backup_schedule_when: "weekly Sun 02:00"

## IANA time zone for the optional weekly backup schedule (Berlin time by default).
# aap_backup_schedule_timezone: "Europe/Berlin"

## Name of the AAP job template to attach the optional weekly backup schedule to.
# aap_backup_schedule_template: "AAP - backup"

## AAP organization holding aap_backup_schedule_template.
# aap_backup_schedule_organization: "Default"

## CA certificate bundle path for AAP API calls (empty = system trust store).
# aap_backup_ca_path: ""

## Seconds per AAP API request for pre-backup job lookup and optional schedule reconciliation.
# aap_backup_api_timeout: 30

# ---- site_exclude --------------------------------------------------------------------------------
## ---- Leave hosts out of every job (1.67.0; playbooks/site_exclude.yml, README "Leave hosts out of
## every job") Hosts no job runs on or connects to, whatever its template, Limit or target: the
## first play of every playbook that runs on hosts takes them out before the first connection. Each
## report says so in one line at its end ("Left out by site_exclude_hosts: ..."); a host left out is
## never a finding and never "not reached". The VMware and Horizon jobs also leave out the VMs and
## ESXi hosts named here (and keep their own lists). Set them in all.yml. names: whole, or short
## either way (web01 = web01.example.mil); * and ?; any case
# site_exclude_hosts: []
