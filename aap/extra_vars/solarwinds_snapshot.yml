---
## Schedule it every 10 minutes, Concurrent jobs off (docs/REPORT_DATABASE.md, "The SolarWinds snapshot")
## SolarWinds' address, when the credential has none (the network map's netmap_solarwinds_url is used too)
# solarwinds_url: orion.yoursite.mil
## A node custom property that names a person: never kept
# solarwinds_snapshot_skip_properties: [Contact]

# ---- solarwinds_snapshot -------------------------------------------------------------------------
## check SolarWinds' certificate (the credential's SOLARWINDS_VERIFY wins)
# solarwinds_validate_certs: "{{ netmap_validate_certs | default(true) }}"

## the CA file (PEM) SolarWinds' certificate is checked with
# solarwinds_ca_path: "{{ netmap_ca_path | default('') }}"

## seconds for one request (no answer: asked once more)
# solarwinds_timeout: 60

## ---- What a snapshot keeps
## -------------------------------------------------------------------------------------------- The
## node custom properties kept with each node: all (every one SolarWinds has), or a list of names.
## The database then holds what they hold: leave out any that names a person
## (solarwinds_snapshot_skip_properties).
# solarwinds_snapshot_properties: all

## The other tables read besides the nodes, links and interfaces: node (the poll, CPU, memory), ip
## (the nodes' other addresses), iface (the links' interface errors), alert, event, app (SAM),
## component (SAM, not up), volume, vim
# solarwinds_snapshot_parts: [node, ip, iface, alert, event, app, component, volume, vim]

## nodes read at most (more: the first ones, said)
# solarwinds_snapshot_max_nodes: 20000

## rows of any other table at most
# solarwinds_snapshot_max_rows: 50000

## rows a request
# solarwinds_snapshot_page_size: 1000

## the first run's events: this many hours back (later runs: what is new)
# solarwinds_event_hours: 24

## ---- The database -------------------------------------------------------------------------------
## ------------------------ make the tables on the first run (false: made by hand,
## docs/REPORT_DATABASE.md)
# solarwinds_db_create: true

## seconds to connect
# solarwinds_db_timeout: 10

## whole snapshots kept (one hour at one run every 5 minutes)
# solarwinds_db_keep_snapshots: 12

## the snapshots' own rows (their counts) kept this many days; 0 = always
# solarwinds_db_keep_days: 400

## events kept this many days (under 1 GB at 3,000 a day); 0 = always
# solarwinds_db_event_days: 400

## 1.118.7: daily topology kept this many days; 0 = always
# solarwinds_db_link_days: 400

# ---- netmap_report -------------------------------------------------------------------------------
## SolarWinds' address, e.g. orion.yoursite.mil (https:// and the SWIS port 17774 are added; an
## Orion older than 2023.1: https://orion.yoursite.mil:17778). The credential's SolarWinds URL, when
## set, wins.
# netmap_solarwinds_url: ""

## Check SolarWinds' HTTPS certificate. Orion's own is self-signed: put the CA that signed yours in
## netmap_ca_path (a file in the project, e.g. "{{ playbook_dir }}/files/ca/orion-ca.pem"), or set
## false. The credential's own settings win.
# netmap_validate_certs: true

## the CA file (PEM) SolarWinds' certificate is checked with; "" = the execution environment's own
## trust
# netmap_ca_path: ""

## minutes a snapshot may be old for a report (all.yml: every report reads it); 0 = never the
## snapshot
# solarwinds_db_max_age: 20
