## Workflow 40's check: the checklists (CKL, CKLB) on your share matched to STIG Manager - the reviews to write and the new
## assets, handed to the approval; playbooks/stigman_update.yml writes them after it. STIG Manager's address:
## check_stig_stigman_api, as for the reports (usually in all.yml)
# check_stig_stigman_api: https://STIGMAN-SERVER/api
## On workflow 40's check template only (a copy of this one): hand the plan on, NEEDS APPROVAL
# stigman_ckl_import_workflow: true
stigman_ckl_import_src: '\\fileserver.yourdomain.mil\stig\ckl'
stigman_ckl_import_collection: VMware
## As STIG Manager Watcher (0.76.0), on a schedule: a host's asset looked for in these collections too (written to each
## that has the STIG; the collection above is then the staging one, for hosts found nowhere), the reviews of assets that
## are there written at once (all: new assets too - the credential is then the client that writes), and the files done
## with moved to imported/<date>/ (the share's account needs Modify)
# stigman_ckl_import_collections: ['*']
# stigman_ckl_import_auto: existing
# stigman_ckl_import_move: true

# ---- stigman_ckl_import --------------------------------------------------------------------------
## the files taken (any case)
# stigman_ckl_import_patterns: ["*.ckl", "*.cklb"]

## read the sub-folders too (one per host, one per month ...)
# stigman_ckl_import_recurse: true

## the share's account (user@YOURDOMAIN.MIL); empty = the "Windows file share" credential's
# stigman_ckl_import_user: ""

## its password (vault it); empty = the credential's
# stigman_ckl_import_password: ""

## negotiate (Kerberos - FIPS too: user@YOURDOMAIN.MIL, the server's full name - else NTLM), ntlm,
## or kerberos (a ticket already in the job)
# stigman_ckl_import_auth: negotiate

## true = encrypt (SMB 3) even when the share does not require it
# stigman_ckl_import_encrypt: false

## the share's port
# stigman_ckl_import_port: 445

## at most this many files (more: nothing read - name a narrower folder)
# stigman_ckl_import_max_files: 500

## a file larger than this is left out (and said)
# stigman_ckl_import_max_mb: 50

## A host name with no asset in the collection: the asset is planned too - created once approved,
## with every STIG its checklists matched (the update's client needs the Manage grant). false =
## listed, not written: create it yourself.
# stigman_ckl_import_create_assets: true

## A checklist's STIG id -> the installed STIG to write to, instead of matching by rules (fnmatch,
## any case), e.g. {"VMware Aria Operations 8.x Apache Profile":
## "VMW_Aria_Operations_8-x_Apache_STIG"}
# stigman_ckl_import_benchmarks: {}

## the share of a checklist STIG's rules the installed STIG must have (0.8 = 80%)
# stigman_ckl_import_min_match: 0.8

## at most this many installed STIGs read to match one (the likeliest by name first)
# stigman_ckl_import_candidates: 25

## true = no match among those: read every installed STIG (slow with hundreds)
# stigman_ckl_import_search_all: false

## true = write a rule the checklist gives another revision's id of (SV-...r123 vs r456); false =
## listed, held back
# stigman_ckl_import_other_revision: false

## true = write over an Accepted review too; false = listed, left for the reviewers
# stigman_ckl_import_overwrite_accepted: false

## the reviews' status: saved, submitted or accepted
# stigman_ckl_import_status: submitted

## a longer finding detail is cut
# stigman_ckl_import_detail_max: 8000

## at most this many rows in the report's tables
# stigman_ckl_import_list_max: 200

## the folder under stigman_ckl_import_src (never read)
# stigman_ckl_import_move_to: imported

