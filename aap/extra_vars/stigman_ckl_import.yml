# Variables for the job template "STIG Manager - import checklists"
#   playbook:    playbooks/stigman_ckl_import.yml
#   credentials: STIG Manager API (read-only is enough; with stigman_ckl_import_auto the client that writes), Windows file share
#
# HOW TO USE: copy this file into the template's Variables box (YAML selected).
#   - A setting starting with "# " is switched off. To use it, delete the "# " in front of its
