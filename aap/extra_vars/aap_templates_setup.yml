---
## Run it with Check first: it then only reads, and lists every template it would make, fix or label. It never deletes.
## The inventory a template is made with, and your site-automation project in AAP
aap_templates_inventory: Site hosts
# aap_templates_project: site-automation
## Your credential of each kind the catalog (aap/job_templates.yml) names; a template needing a kind not here is skipped
aap_templates_credentials:
  machine: Linux machine
  machine_windows: Windows machine
  aap: AAP reader
  stigman_api: STIG Manager API
## The execution environment of each kind (all, windows, network); a kind left out: the project's
# aap_templates_ee: {all: "All-in-one EE", windows: "Windows EE", network: "Network EE"}
## Only some templates (* and ?, any case)
# aap_templates_only: ["STIG*", "Health check", "Troubleshoot"]
## Bring the templates that differ right (only the fields this job sets)
# aap_templates_overwrite: true
## Make the catalog's name too when your own template runs that playbook (for a workflow that names it)
# aap_templates_create_alias: true
## The site portal's labels, so it finds the templates: portal-actions or all
# aap_templates_label_portal: portal-actions

# ---- aap_templates -------------------------------------------------------------------------------
## the organization the templates are made in
# aap_templates_organization: Default

## the inventory's organization when it is another one ("" = aap_templates_organization); the
## credential's user needs Use on it
# aap_templates_inventory_organization: ""

## the site portal's label (as written, case too)
# aap_templates_portal_label: "{{ portal_label | default('portal') }}"

## the prefix of its group label
# aap_templates_portal_label_area: "{{ portal_label_area | default('portal-area:') }}"

## "" = the repository's aap/job_templates.yml; a path here = your own catalog
# aap_templates_catalog: ""

## a CA file for AAP's own HTTPS certificate
# aap_templates_ca_path: "{{ report_history_aap_ca_path | default('') }}"

## 1.79.11: true = write the catalog's descriptions on the templates and workflows found
## (docs/SETUP_AAP.md, "Describe").
# aap_templates_describe: false

## true = only the descriptions: no template made, checked or labelled
# aap_templates_describe_only: false

## true = write over a hand-written description too
# aap_templates_describe_overwrite: false

## true = list each catalog template / workflow not in AAP (false: counted only)
# aap_templates_describe_list_missing: false

## the Contact line's Owner= ("" with no contact either: no Contact line)
# aap_templates_description_owner: ""

## the Contact line's Developer=
# aap_templates_description_contact: ""

# ---- site_portal_stack ---------------------------------------------------------------------------
## 1.78.0: actions found in AAP, like a catalogue: a job template or workflow the portal's account
## has Execute on AND that carries the AAP label below is added to the portal - no edit here, no
## redeploy; take Execute or the label away and it goes at the next refresh. The form is the
## template's survey; the card's area is a label "portal-area:STIG" (else Other), its title the
## template's name, its line the description. the AAP label that marks a template for the portal (''
## = no discovery)
# portal_label: portal

## a label that starts with this puts the card in an area (the rest of the label is its name)
# portal_label_area: "portal-area:"

# ---- site_email - usually in all.yml -------------------------------------------------------------
## a CA file for AAP's own HTTPS certificate ("" = what the execution environment trusts)
# report_history_aap_ca_path: ""
