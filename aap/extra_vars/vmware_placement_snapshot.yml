## Schedule it every 60 minutes, Concurrent jobs off (docs/VM_OUTAGE_WATCH.md, "The VMs of a past outage")
## The outage review reads it back for the VMs on a lost datastore or host when the outage began.

# ---- vmware_vm -----------------------------------------------------------------------------------
## only needed when the same VM name exists in two datacenters
# vmware_datacenter: ""

## Check vCenter's certificate. false only if the execution environment does not trust your CA yet.
# vmware_validate_certs: true

## Several vCenters (e.g. Enhanced Linked Mode), one report: the reports and the ESXi security
## settings read the credential's vCenter AND these (names, or name:port), with the same account.
## The same vCenter under two names is read once. docs/VMWARE.md, "Several vCenters". e.g.
## [vc01.yoursite.mil, vc02.yoursite.mil]
# vmware_vcenters: []

## ---- VMware - VM placement snapshot (1.116.6; schedule every 60 minutes; docs/VM_OUTAGE_WATCH.md)
## ---- delete placement rows older than this many days (0 = never); a review of an older outage
## says "not read"
# vm_placement_days: 400

## make the tables vm_placement and vm_placement_run on the first run; false = an admin makes them
## (docs/REPORT_DATABASE.md)
# vm_placement_db_create: true

## seconds to wait for the report database's connection
# vm_placement_db_timeout: 10
