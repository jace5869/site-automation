# ==================================================================================================
# Variables for the job template "Site portal - open ticket"
#   playbook:    playbooks/portal_open_ticket.yml
#   credentials: Red Hat Ansible Automation Platform (the ServiceNow API credential only for portal_ticket_mode: live)
#
# HOW TO USE: copy this file into the template's Variables box (YAML selected).
#   - A setting starting with "# " is switched off. To use it, delete the "# " in front of its
#     line (and of the indented lines under it), then change the value. Lines starting with
#     "## " say what the setting below them does.
#   - Switch on only what you change: a value here beats the same setting everywhere else,
#     including playbooks/group_vars/all.yml. The values shown are the defaults.
#   - The settings under "usually in all.yml" apply to every job: set them once there.
#   - Every setting, in full: docs/VARIABLES_REFERENCE.md (the Settings Reference PDF).
# GENERATED by scripts/gen_template_vars.py from roles/*/defaults/main.yml - do not edit here.
# ==================================================================================================
---
## The site portal's "Ticket (dry run)" / "Open ticket": no approval. It runs on the AAP side and connects to no host. Prompt on launch: Variables and Limit.
## portal_ticket_mode: dry_run (the default) builds the incident and sends NOTHING; off = no button; live = opens it (needs the ServiceNow API credential).
# portal_ticket_mode: dry_run

# ---- portal_ticket -------------------------------------------------------------------------------
## The assignment group by finding kind (disk_full, service_down, fapolicyd_deny, stig_rule_fail,
## eventlog ...); a kind not listed gets portal_ticket_group_default; empty =
## servicenow_assignment_group.
# portal_ticket_groups: {}

## the group for a kind not in portal_ticket_groups ("" = servicenow_assignment_group)
# portal_ticket_group_default: ""

# ---- portal_request ------------------------------------------------------------------------------
## Set by each playbook; do not set:
# portal_request_spec: {}

## the value whose host is also the Limit ("" = none)
# portal_request_limit_from: ""

## the action's name, for the job's lines and its artifact
# portal_request_action: ""

## true = check the values even when the portal did not launch the job (no portal_requested_by): a
## playbook that only makes sense with them (ACT - triage finding). false = a job launched by hand
## is not checked (STIG recheck).
# portal_request_always: false

# ---- finding_ref ---------------------------------------------------------------------------------
## the report job's id (the portal sends report_job)
# finding_ref_job: "{{ report_job | default('') }}"

## the finding's id (finding_id)
# finding_ref_id: "{{ finding_id | default('') }}"

## the host the fix runs on (target)
# finding_ref_host: "{{ target | default('') }}"

## the kinds this job fixes (set by each playbook); [] = any
# finding_ref_kinds: []

## The report jobs a finding is taken from, by their playbook's file name (* and ?): a finding of
## any other AAP job is refused (1.67.0 review: a job of any template could carry a planted
## site_findings artifact). The job must also have finished - a check that found something ends
## failed, on purpose; error or canceled never - at most finding_ref_max_age_days ago.
# finding_ref_report_playbooks: [health_check.yml, win_health_check.yml, troubleshoot.yml, win_troubleshoot.yml, disk_report.yml,
#                                "fapolicyd*.yml", stig_drift_report.yml, win_stig_drift_report.yml, stigman_ckl_import.yml,
#                                service_watch.yml]

## more, e.g. [my_report.yml] (a report of your own that keeps site_findings)
# finding_ref_report_playbooks_extra: []

## an older report: refused - run it again and use its new page
# finding_ref_max_age_days: 14

## tests only: "now" as YYYY-MM-DDTHH:MM:SSZ ("" = the clock)
# finding_ref_now: ""

## a CA file for AAP's own HTTPS certificate
# finding_ref_aap_ca_path: "{{ report_history_aap_ca_path | default('') }}"

# ---- servicenow ----------------------------------------------------------------------------------
## Findings at or above this severity get a ticket: critical | warning. A ticket already open stays
## open while its finding is still there, even below this (the certificate renewal opens one for
## every CSR)
# servicenow_min_severity: warning

## the table tickets are opened in (incident)
# servicenow_table: incident

## Values for new incidents. Names work (the API is asked to accept display values), e.g.
## servicenow_assignment_group: Linux Operations
# servicenow_assignment_group: ""

## user name; empty = the API account
# servicenow_caller: ""

## e.g. Software
# servicenow_category: ""

## a new ticket's urgency, per finding severity (your instance's values)
# servicenow_urgency: {critical: "1", warning: "2"}

## a new ticket's impact, per finding severity
# servicenow_impact: {critical: "2", warning: "3"}

## set Configuration item = the host name (must exist in the CMDB)
# servicenow_set_ci: true

## More fields for every new ticket - for an instance that makes fields such as Location,
## Subcategory or Channel mandatory: {column name: value}. Names and choice labels work, e.g.
## servicenow_fields: {location: "Building 100", subcategory: "Operating System", contact_type:
## "Self-service"} A field's column name: right-click its label on the form > Show - '<column
## name>'.
# servicenow_fields: {}

## When a problem that had a ticket is gone, add a work note (and, if you want, resolve it).
# servicenow_note_cleared: true

## true = also resolve the ticket (servicenow_resolved_state, servicenow_close_code)
# servicenow_resolve_cleared: false

## Resolved
# servicenow_resolved_state: "6"

## must be a close code your instance has
# servicenow_close_code: "Solution provided"

## More fields set when a ticket is resolved (servicenow_resolve_cleared, and the test ticket), for
## an instance that makes them mandatory: {column name: value}, e.g. {resolved_by: svc_aap_sn}
# servicenow_resolve_fields: {}

## Add a work note to an open ticket each time its finding is seen again.
# servicenow_note_repeats: true

## Every ticket from these playbooks carries a correlation ID starting with this, so the same
## problem on the same host always updates the same ticket.
# servicenow_correlation_prefix: site-health

## check the instance's HTTPS certificate (see servicenow_ca_path)
# servicenow_validate_certs: true

## A CA bundle (PEM) for the instance's TLS certificate, when the execution environment does not
## trust its CA (e.g. a DoD root CA): a path on the controller, such as a file you add to the
## project: servicenow_ca_path: "{{ playbook_dir }}/files/ca/servicenow-ca.pem". Empty = the
## execution environment's normal trust store. Prefer this over servicenow_validate_certs: false.
# servicenow_ca_path: ""

## seconds for one API request
# servicenow_timeout: 30

## Fail the job when it opened/updated tickets, so the workflow shows red while problems exist.
# servicenow_fail_when_findings: true

# ---- portal_result -------------------------------------------------------------------------------
## true (Fixed), false (Still there), or unknown (Not checked)
# portal_result_fixed: unknown

## what the fix found before, short (e.g. "/var 93% full")
# portal_result_before: ""

## what it found after (e.g. "/var 71% full")
# portal_result_after: ""

## one line for the person who asked
# portal_result_summary: ""

## the finding the fix was for: finding.id (roles/finding_ref) when the play has it, else the
## finding_id it was given
# portal_result_finding_id: "{{ finding.id if finding is defined and finding.id is defined else finding_id | default('') }}"

## the portal's action, when it is known
# portal_result_action: "{{ portal_request.action | default(portal_request_action | default('')) }}"

## true in a job that only reads (ACT triage, a recheck): its result is always Not checked
# portal_result_read_only: false

# ---- site_exclude --------------------------------------------------------------------------------
## ---- Leave hosts out of every job (1.67.0; playbooks/site_exclude.yml, README "Leave hosts out of
## every job") Hosts no job runs on or connects to, whatever its template, Limit or target: the
## first play of every playbook that runs on hosts takes them out before the first connection. Each
## report says so in one line at its end ("Left out by site_exclude_hosts: ..."); a host left out is
## never a finding and never "not reached". The VMware and Horizon jobs also leave out the VMs and
## ESXi hosts named here (and keep their own lists). Set them in all.yml. names: whole, or short
## either way (web01 = web01.example.mil); * and ?; any case
# site_exclude_hosts: []

# ---- site_email - usually in all.yml -------------------------------------------------------------
## a CA file for AAP's own HTTPS certificate ("" = what the execution environment trusts)
# report_history_aap_ca_path: ""
