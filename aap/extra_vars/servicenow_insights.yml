## ACT (GenAI): groups the incidents into issues (a list carried from batch to batch), writes each
## top issue's fix from its close notes (or suggests one, marked, where the notes say too little),
## drafts knowledge articles and writes the summaries. Attach an "ACT model key" credential
## (site_act_provider, site_act_models); this AAP node must reach the model. Without it (or false)
## the issues are the incidents' category / subcategory and the fix is the most common close note.
## Names, phone numbers, email addresses, host names, IP addresses and 10-digit IDs are replaced
## (PERSON-1, HOST-3 ...) before anything reaches the model and put back after. Off by default
## (1.13.0): ACT runs only when asked - true in the template's Variables for a monthly run, or on a
## launch.
# servicenow_insights_act: false

## incident descriptions per question
# servicenow_insights_act_batch: 100

## the most frequent descriptions grouped; the rest go by their category
# servicenow_insights_act_max_descriptions: 2000

## at most this many issues
# servicenow_insights_act_max_issues: 40

## the top issues ACT writes a fix for ...
# servicenow_insights_act_fix_issues: 15

## ... this many per question
# servicenow_insights_act_fix_batch: 3

## close notes per issue it reads
# servicenow_insights_act_notes: 40

## ... and the work notes of those issues' incidents (0.96.0): what was tried while they were open,
## read from sys_journal_field (GET only; the account needs read on it - refused, the page says so
## and the fixes come from the close notes), masked like everything else before ACT reads them. The
## newest ..._max per issue, each cut to ..._chars.
# servicenow_insights_act_work_notes: true

## the newest work notes per issue ACT reads
# servicenow_insights_act_work_notes_max: 20

## each cut to this many characters
# servicenow_insights_act_work_note_chars: 1500

## a knowledge article draft for an issue with this many incidents and a fix that agrees
# servicenow_insights_kb_min: 50

## seconds the model may take for an answer
# servicenow_insights_act_model_timeout: 600

## first check that this AAP node reaches the model's URL
# servicenow_insights_act_check_url: true

## more words to replace before ACT (a project name, a building)
# servicenow_insights_mask_names: []

## words that look like host names but are not (e.g. [win11, rhel9]): sent as they are
# servicenow_insights_mask_keep: []

## THE HISTORY (1.13.0, docs/REPORT_DATABASE.md): true = each run writes its figures to the report
## database (MySQL 8.4, the "Report database" credential) - the window's, and each calendar month in
## it (the month so far marked partial) - and the pages show the months as Trends, for each site,
## unit and team. Figures only: counts, percentages and hours per org node - no caller, description,
## note or person. A month is replaced by the newest run that holds it. The database not reached:
## one warning, the report whole, the job green.
# servicenow_insights_db: false

## true: the database not reached (or no credential) fails the job
# servicenow_insights_db_required: false

## make the tables and views on the first run (false: made by hand, from the doc)
# servicenow_insights_db_create: true

## the months the trend shows
# servicenow_insights_db_months: 12

## seconds to connect
# servicenow_insights_db_timeout: 10

## THE BACKFILL: > 0 = this launch reads that many past calendar months from ServiceNow once, writes
## each month's figures to the report database and stops - no ACT, no pages, no email. Run it once
## after setup (12), as a separate launch. Safe to run twice: each month replaces what was there.
# servicenow_insights_backfill_months: 0

## Is it writing? (1.15.0) true = only check the report database with the job's Report database
## credential, read only (the reader account works): the server, the tables and views, the runs and
## months held, the newest write. No ServiceNow read, no pages, no email. Launch with it as an extra
## variable.
# servicenow_insights_db_check: false

## THE TICKET STORE (1.17.0): with servicenow_insights_db, the report database keeps each ticket's
## numbers, times, flags and group sys_id (never its text, its people, its CI or the names
## ServiceNow shows). Each run then reads in full only the tickets that changed; the rest come from
## the database. The first run reads everything and fills it. The pages are the same either way.
# servicenow_insights_incremental: true

## true: this launch reads every ticket again (launch with it as an extra variable)
# servicenow_insights_full_refresh: false

## THE ACT CACHE (1.17.0): with servicenow_insights_db, each description's issue is kept (the
## description as a hash, the issue by ACT's short name, masked - the one text the database holds).
## Only new descriptions go to ACT; the fixes are asked every run. Another provider, model or prompt
## starts the cache again.
# servicenow_insights_act_cache: true

## true: this launch asks ACT everything again and replaces the cache (only when ACT answered every
## grouping question)
# servicenow_insights_act_cache_clear: false

## THE PAGES (1.14.0): each site's, unit's and team's page is written this many at a time, in one
## task after the All page, when site_report_web writes the website itself (a folder, an SMB share,
## an upload). 0 = the site_email role once per page, as before (report_web_copy and report_web_host
## always do that).
# servicenow_insights_pages_per_call: 40

## The workbook on the email: every incident with its issue and close-note grade, the issues,
## requests, changes, people.
# servicenow_insights_xlsx: true

## The job fails when ServiceNow could not be read at all, or a group named is not there. false = a
## report only.
# servicenow_insights_fail: true

# ---- servicenow ----------------------------------------------------------------------------------
## check the instance's HTTPS certificate (see servicenow_ca_path)
# servicenow_validate_certs: true

## A CA bundle (PEM) for the instance's TLS certificate, when the execution environment does not
## trust its CA (e.g. a DoD root CA): a path on the controller, such as a file you add to the
## project: servicenow_ca_path: "{{ playbook_dir }}/files/ca/servicenow-ca.pem". Empty = the
## execution environment's normal trust store. Prefer this over servicenow_validate_certs: false.
# servicenow_ca_path: ""

## seconds for one API request
# servicenow_timeout: 30

# ---- site_email - usually in all.yml -------------------------------------------------------------
## copied: a list, or text like report_email_to
# report_email_cc: []

## "Also email the report to": more people for one run, asked when the job is launched - a survey
## question (playbooks/aap_email_question.yml adds it to the report templates). Added to
## report_email_to, never in its place; empty = only report_email_to. A list, or text: addresses
## separated by commas, semicolons, spaces or one per line, or pasted from Outlook (Doe, Jane
## <jane.doe@yoursite.mil>; ...).
# report_email_also: []

## The domains an address in report_email_also may be in (a subdomain too), e.g. [yoursite.mil]; any
## other is listed in the job and gets no email. Empty = any domain (your mail relay may still
## refuse some).
# report_email_also_domains: []

## the sender, e.g. aap-noreply@yoursite.mil
# report_email_from: ""

## your mail relay, e.g. smtp.yoursite.mil
# report_email_smtp_host: ""

## 25 or 587 with starttls, 465 with ssl
# report_email_smtp_port: 25

## starttls = encrypt after connecting (the relay must offer it); ssl = encrypted from the start
## (port 465); none = not encrypted (only for a relay without encryption; then no login is sent).
# report_email_security: starttls

## a CA file that signed the relay's certificate (empty = the CAs the execution environment trusts)
# report_email_ca_path: ""

## put before every subject, e.g. "[AAP] Certificate report: ..."
# report_email_subject_prefix: "[AAP]"

## Which enclave this AAP serves: unclassified or classified; empty = found from the job's hosts -
## classified when a target host's name or address (inventory_hostname, ansible_host) ends in one of
## site_enclave_classified_domains, else unclassified. site_enclave, when set, always wins.
# site_enclave: ""

## DNS suffixes of the classified enclave, e.g. [classified.example.mil]; [] = never found
## classified from the hosts.
# site_enclave_classified_domains: []

## The banner at the top and bottom of every report: each email look and the plain text (its first
## and last line), every report website page and the index, the ticket insights pages, print, and
## the first row of each workbook sheet. auto = on in the classified enclave (site_enclave), off in
## the unclassified; true / false = always / never.
# report_banner: auto

## the banner's text, e.g. SECRET, SECRET//NOFORN, UNCLASSIFIED, CUI
# report_banner_text: SECRET

## The banner's colour (#rrggbb); empty = the standard colour of the text: UNCLASSIFIED green, CUI
## purple, CONFIDENTIAL blue, SECRET red, TOP SECRET orange; the text black or white, whichever
## reads 4.5:1 or better.
# report_banner_color: ""

## with the banner on: "(SECRET) " before the email subject (and the prefix)
# report_banner_subject: true

## Send a formatted (HTML) version too, for reports that come with one (all VMware jobs). The email
## always carries a plain-text copy for mail clients that do not show HTML. false = plain text only.
# report_email_html: true

## Attach the report's tables to the email as an Excel workbook (.xlsx): a sheet per table. Some
## reports attach their own whatever this says (VM - inventory report: every VM on one sheet). The
## website gets no workbook.
# report_email_xlsx: false

## The look of the HTML version (docs/EMAIL_REPORTS.md, "The look"): standard = a header band in the
## report's colour (green, amber, red, blue) with number boxes under it; command = a dark header
## with your logo and report_email_header_text, the job's last runs as a strip of bars
## (report_history), the numbers in one row; portal = white cards on a pale mint background (like
## the AAP portal pages): a header card with your logo, report_email_header_text and the status,
## number tiles, a card with the last runs, a card per section. Classic desktop Outlook shows the
## portal cards square, without shadows. glass = see-through frosted cards on a soft blue-green
## background: your logo, the status and what it asks ("Action required"), tiles with icons (a
## warning or critical one tinted), the last runs beside This run / Last run, a card per section
## with its table on a near-solid panel; the line under the subject in the inbox, an "Open the full
## report" button with report_web_dest, tiles two by two on a phone. Mail programs that do not draw
## transparency (classic desktop Outlook) show solid white cards, square. The web page adds the
## blur, icons and a plain print.
# report_email_theme: standard

## command, portal, glass: the line with the logo
# report_email_header_text: Site automation report

## Your logo in the header (every look but standard): a PNG, JPEG or GIF in your repository - a path
## from playbooks/ (files/report_logo.png = playbooks/files/report_logo.png) or a full path.
## Attached to each email, so keep it small: about 160 px tall, under 100 KB. Updating with
## scripts/update-from-release: list the file in .site-local, or the update deletes it.
# report_logo_file: ""

## pixels in the email (its width follows); portal: at most 56, glass: at most 80
# report_logo_height: 84

## command, portal, glass: the job's last runs, read from AAP - attach a "Red Hat Ansible Automation
## Platform" credential to the template, whose user can see the template's jobs (Organization
## Auditor on its organization, docs/EMAIL_REPORTS.md); without it the email goes out without the
## strip.
# report_history: true

## bars in the strip, this run included
# report_history_runs: 14

## a CA file for AAP's own HTTPS certificate ("" = what the execution environment trusts)
# report_history_aap_ca_path: ""

## Your own look instead: copy roles/site_email/templates/report.html.j2 (or report_command /
## _portal / _glass) to e.g. playbooks/files/email/report.html.j2, change it, and set
## report_email_html_template: "{{ playbook_dir }}/files/email/report.html.j2" report.html.j2 (the
## default) = the look report_email_theme picks.
# report_email_html_template: report.html.j2

## The time zone of the times in a report, besides UTC: e.g. America/New_York (a name as
## `timedatectl list-timezones` prints them) shows "2026-10-25 10:03:12 EDT (14:03 UTC)". vCenter,
## ESXi and their log files keep UTC; the vSphere Client shows the browser's time zone. "" = UTC
## only. Used by the VMware health and alarms reports and the ServiceNow weekly and ticket insights
## reports, and (1.49.0) by the report website and every report's own lines: the index page's runs,
## last run and "updated", the strip of past runs and the footer line show that time zone with its
## abbreviation - "2026-11-13 05:37 CET", summer time as it was on that day - also for runs written
## before it was set. What is stored (index.json, a run's JSON, the file names) stays UTC. A name
## the execution environment does not know (or one without the tzdata package): UTC, with a warning
## in the job output. 1.54.0: also the times inside the reports that printed their own UTC (AD,
## lockout, capacity, ONTAP, log analysis, outage watch, snapshots, Horizon and more); a "(UTC)"
## column then says each cell's zone. Times you type stay UTC. docs/WEB_REPORTS.md, "Times in your
## time zone"; docs/VMWARE.md, "Times and clocks"
# report_time_zone: ""

## THE REPORT WEBSITE (docs/WEB_REPORTS.md): every report job also writes its report as a web page -
## off until report_web_dest is set. Works without an email (report_email_to empty). Each run: its
## page, a copy as the template's latest page, the report's data as JSON beside each (for your own
## site), and an index of every report's last run. The job prints the page's address ("Report:
## https://...") and keeps it as the job artifact site_report_url. Where the files go: a folder the
## job can write - a share mounted on the AAP execution nodes and exposed to jobs (Settings > Job
## settings > Paths to expose to isolated jobs), e.g. /mnt/reports - or an https:// address that
## takes uploads (HTTP PUT, WebDAV: nginx, Apache, IIS) - or a Windows file share's folder, written
## over SMB with no mount: '\\fileserver\its\aap\reports' (the folder there already; smbprotocol in
## the execution environment). An upload's or a share's login comes from a "Report website"
## credential (aap/credential_types/report_web.yml).
# report_web_dest: ""

## the address people open that folder at, e.g. https://reports.yoursite.mil ("" = dest when it is
## https://)
# report_web_url: ""

## The website's look (docs/WEB_REPORTS.md, "The look"): atlas = made for a browser, never an email
## - a wide page whose tables use all of it (columns sized by what they hold: numbers right-aligned,
## short values whole, paths broken at / and \), a bar at the top that stays (the sections, Compact
## / Comfortable rows, Light / Auto / Dark - the reader's own setting on Auto -, Print), status
## chips with icons (a check mark for OK), Start here cards with a Copy button, tables that sort and
## filter, rows as cards on a phone; the index page too. brief (0.92.0) = the same page read like a
## morning brief, calm and soft (0.94.0): what it found as a chip, the key figures as one strip,
## Start here as numbered steps, percentages as bars, soft greys in dark, translucent cards; its
## index is the list of reports (one line and the counts as chips), a report's first step under its
## line, the logo larger. Or one of the email looks: standard, command, portal or glass (as
## report_email_theme - the index page is then in the portal look).
# report_web_theme: atlas

## The names inside the folder, with {names} filled in: {template} (the AAP template's name, lower
## case with dashes; the play's name outside AAP), {template_id}, {job} (the AAP job; local outside
## AAP), {status} (ok, warning, critical, info), {date} (2026-10-23), {time} (0605), {year},
## {month}, {day} - the time the job wrote it, UTC - and your own from report_web_names. Each must
## end in .html; folders are made as needed. each run's page (the address the job prints)
# report_web_page: "{template}/{date}_{time}_job-{job}.html"

## always the template's newest run ("" = none)
# report_web_latest: "{template}/latest.html"

## every report's last runs, a tab per area ("" = none)
# report_web_index: index.html

## the runs each report keeps: listed under its line of the index, the pages of older runs deleted
# report_web_history: 5

## false = the older runs' pages stay in the folder (only the index forgets them)
# report_web_delete_old: true

## A line of the index whose latest page is no longer there (its folder deleted by hand) is taken
## off the index by the next report that writes it. false = lines stay until a report writes them
## again. Not with report_web_host (that server's folder is not read from the AAP side): there,
## delete the line from index.json by hand.
# report_web_index_prune: true

## The index page's tabs: a report is on the first tab one of whose names its AAP template's name
## matches (any case, * = anything); else on the tab of its name up to " - " (Backup - nightly:
## Backup); else on Other. A tab with no report is not shown. Set it in all.yml, for every template
## alike: the index is one page.
# report_web_tabs:
#   - {tab: Certificates, match: ["*certificate*", "*trust store*", "PKI *"]}
#   - {tab: VMware, match: ["VM *", "VMs *", "VMware*", "ESXi*", "vCenter*"]}
#   - {tab: Horizon, match: ["Horizon*"]}
#   - {tab: Tenable.sc, match: ["Tenable*"]}
#   - {tab: Windows, match: ["Windows*", "Active Directory*", "AD *", "ACT for Windows*"]}
#   - {tab: Network and storage, match: ["Network*", "NetApp*", "ONTAP*", "Cisco UCS*", "UCS*"]}
#   - {tab: Linux, match: ["Linux*", "Health check*", "Troubleshoot*", "Patch*", "Database*", "Service watch*", "POA&M*", "STIG*", "Evaluate-STIG*",
#                          "Log analysis*", "fapolicyd*", "Apply approved*", "Mail relay*", "ACT - *"]}
#   - {tab: ServiceNow and AAP, match: ["ServiceNow*", "AAP *", "Report website*"]}

## your own {names}, e.g. {site: "{{ site_code }}"} for "{site}/{template}/..."
# report_web_names: {}

## the report's data as .json beside each page and index.json beside the index
# report_web_json: true

## A share (report_web_dest \\server\share\folder): how the job logs in, and the connection.
## negotiate (Kerberos - FIPS too: user@YOURDOMAIN.MIL, the server's full name - else NTLM), ntlm,
## or kerberos (a ticket already in the job)
# report_web_smb_auth: negotiate

## true = encrypt (SMB 3) even when the share does not require it; one that requires it is always
# report_web_smb_encrypt: false

## the share's port
# report_web_smb_port: 445

## a CA file for an https:// report_web_dest, or report_web_host's WinRM certificate ("" = what the
## EE trusts)
# report_web_ca_path: ""

## A share, an upload address or a folder that fails for a reason that passes (Kerberos "Message
## stream modified" while a file server's machine password changes, no KDC reached, a connection
## reset, a session gone, HTTP 503): tried again from a new login. A real error (password, access,
## no such share or folder) is not. Tries again this many times; 0 = none
# report_web_retries: 3

## seconds between two tries
# report_web_retry_delay: 30

## false = still not published after the retries: a warning, the email says so at the top, the job
## goes on; true = the job fails
# report_web_required: false

## Or on a Windows server (a file server, or the IIS server itself): report_web_host is that server,
## report_web_dest the folder on it (D:\reports, there already). The pages are made on the AAP side
## and written there over WinRM, in one PowerShell script per run (Constrained Language Mode too):
## nothing to mount, no WebDAV. The login: the "Report website" credential's user name and password,
## or - without it - the template's Machine credential; the account needs WinRM (Remote Management
## Users) and Modify on the folder. The connection, as your Windows inventory's: e.g.
## web01.yoursite.mil
# report_web_host: ""

## winrm or psrp
# report_web_host_connection: winrm

## WinRM: 5986 (https), 5985 (http)
# report_web_host_port: 5986

## https, or http (Kerberos and NTLM encrypt each message then)
# report_web_host_scheme: https

## ntlm, kerberos (Kerberos in the EE), credssp or basic
# report_web_host_transport: ntlm

## validate (the CA: report_web_ca_path) or ignore
# report_web_host_cert_validation: validate

## THE COPY JOB instead (docs/WEB_REPORTS.md, "The copy job"): for report templates whose execution
## environment cannot reach the web server (no WinRM or Kerberos in it). true = the report jobs
## write nothing there - each keeps its report in AAP (the job artifact site_report_page) and the
## one job template "Report website - copy" (playbooks/report_web_copy.yml), in an execution
## environment that reaches report_web_host, writes the pages there later, at the same address: the
## email's button and site_report_url point at it (there once the copy job has run). Set it in
## all.yml, with report_web_dest and report_web_url as above; the copy job uses them (and
## report_web_theme, the logo) too.
# report_web_copy: false

## the kept report's greatest size, packed (a bigger one: its longest tables cut, said on the page)
# report_web_copy_max_kb: 256

# ---- site_act - usually in all.yml ---------------------------------------------------------------
## ACT at all (1.3.0): false = no job calls ACT - no request, no model endpoint or key needed, no
## error; each report says "ACT is off (site_act_enabled false)" in one line and the job stays green
## (an enclave without a model). Usually in all.yml (docs/ENCLAVES.md).
# site_act_enabled: true

## ---- Which model ACT talks to -----------------------------------------------------------------
## site_act_provider genai GenAI.mil (the default) asksage Ask Sage - RETIRED FOR NOW: do not pick
## it (kept for when it returns) genai-beta the GenAI.mil beta proxy (preview models)
## site_act_models the model to use FOR EACH provider, e.g. {genai: gemini-4-argon-withtools,
## asksage: gpt-5.6-sol-gov} so the model follows whichever provider is picked. A provider not
## listed uses ACT's own default model. site_act_urls the API URL for each provider, e.g. {asksage:
## https://<host>/server/openai/v1/chat/completions}; a provider not listed uses ACT's default URL
## site_act_model one model for this run, whatever the provider (e.g. a survey answer); empty =
## site_act_models site_act_url one URL for this run; empty = site_act_urls site_act_ca a CA bundle
## file ON THE HOSTS for the provider's TLS certificate (internal/DoD CA); empty = the host's system
## trust store The API KEY never goes here: it comes from an AAP credential - "ACT model key" (GenAI
## and Ask Sage keys) or "ACT GenAI beta key". ACT runs ON EACH HOST, so the hosts must be able to
## reach the provider's URL (a proxy or firewall rule may be needed).
# site_act_provider: genai

## the model for each provider (see above): the model follows the provider picked
# site_act_models: {genai: gemini-4-argon-withtools, asksage: gpt-5.6-sol-gov}

## the API URL for each provider; a provider not listed uses ACT's default
# site_act_urls: {}

## one model for this run, whatever the provider (e.g. a survey answer); empty = site_act_models
# site_act_model: ""

## one URL for this run; empty = site_act_urls
# site_act_url: ""

## a CA bundle file ON THE HOSTS for the provider's certificate; empty = the host's trust store
# site_act_ca: ""

## Any other ACT environment settings (advanced; these win over the ones above), e.g. {HTTPS_PROXY:
## "http://proxy.yoursite.mil:8080"}. See the top of vendor/act/act for the list. Every ACT job
## streams the model's answer (ACT_STREAM=1), so a firewall or proxy idle timeout does not cut a
## long answer ("connection reset by peer"); {ACT_STREAM: "0"} here turns that off.
# site_act_env: {}

## Seconds the model may take for ONE answer, retries after a provider hiccup included (ACT's
## GENAI_TIMEOUT; ACT's own default, 90, is too short for a long analysis or a busy provider). Every
## ACT job uses it: the runbooks' use_act, the VMware alarms and capacity analyses, service watch.
# site_act_model_timeout: 600

## seconds for one whole ACT run (several answers): keep it above site_act_model_timeout
# site_act_timeout: 1200

## anything ACT should know about this site
# site_act_extra_instructions: ""

# ---- site_findings - usually in all.yml ----------------------------------------------------------
## ---- Certificate timeline (1.64.0): a section of the certificate reports ------------------------
## Linux, Windows, network devices, vCenter: the next cert_timeline_days on one axis on the report
## website (the atlas and brief looks), the renew list in the email, a Timeline sheet in the
## workbook. The levels are each report's own days. Changes no finding. false = the reports as
## before 1.64.0
# cert_timeline: true
