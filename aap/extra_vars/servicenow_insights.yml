## breached today; the breaches of the last servicenow_breach_days by day. false = no About to
## breach section in the full report (no task_sla read for it)
# servicenow_insights_breach: true

## business hours ahead: the tiles are 1 h, 4 h and this window
# servicenow_breach_window_hours: 8

