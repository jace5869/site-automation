# ==================================================================================================
# Variables for the job template "ServiceNow - ticket insights"
#   playbook:    playbooks/servicenow_insights.yml
#   credentials: ServiceNow API (ACT model key: optional, recommended)
#
# HOW TO USE: copy this file into the template's Variables box (YAML selected).
#   - A setting starting with "# " is switched off. To use it, delete the "# " in front of its
#     line (and of the indented lines under it), then change the value. Lines starting with
#     "## " say what the setting below them does.
#   - Switch on only what you change: a value here beats the same setting everywhere else,
#     including playbooks/group_vars/all.yml. The values shown are the defaults.
#   - The settings under "usually in all.yml" apply to every job: set them once there.
#   - Every setting, in full: docs/VARIABLES_REFERENCE.md (the Settings Reference PDF).
# GENERATED by scripts/gen_template_vars.py from roles/*/defaults/main.yml - do not edit here.
# ==================================================================================================
---
## The window: the last N months up to now (or servicenow_insights_days); every group, a page per team
servicenow_insights_months: 6
# servicenow_insights_groups: [YOUR GROUP NAME]  # empty = every group (the whole site)
# report_email_to: [YOUR LEADS]                  # optional: the page on the report website is the report
## SLA targets in hours by priority (the defaults shown; better in all.yml) - set both tables, the setting is replaced whole
# servicenow_insights_sla_targets:
#   incident: {"1": 8, "2": 16, "3": 144, "4": 240, "5": 480}
#   sc_req_item: {"1": 48, "2": 144, "3": 240, "4": 480, "5": 960}

# ---- servicenow_insights -------------------------------------------------------------------------
## > 0: the last N days instead of the months
# servicenow_insights_days: 0

## the last day (through its end, 2026-10-31), "" = now
# servicenow_insights_until: ""

## read the window before as well: the changes against it (the tiles, rank ▲▼)
# servicenow_insights_compare: true

## Each team's own page (every section of the report for that team) on the report website, and the
## Teams side by side table on the site's page. The teams are the groups named above, else the
## groups with at least servicenow_insights_team_min tickets in the window, the busiest first, at
## most servicenow_insights_teams_max.
# servicenow_insights_team_pages: true

## at most this many teams with their own page
# servicenow_insights_teams_max: 60

## a group with at least this many tickets in the window is a team (no groups named)
# servicenow_insights_team_min: 10

## SITES, DIRECTORATES AND TEAMS (0.97.0): a page for each site and directorate with tickets, under
## All; teams as above. parents (the default): ServiceNow's group tree (sys_user_group, read only) -
## the site is the root group (its name's first " - " part), the directorate the group one below the
## root, the team the group (a team under a team stays a team of that directorate); a group with no
## way up to a root is Unknown. names: the site is the name's first " - " part; the directorate a
## word of servicenow_insights_suffix_directorates the name (or a parent below the root) ends in,
## else a word of the name in servicenow_insights_directorate_tags, else a staff code (J633, A6) in
## the name or the nearest parent's, else a second part in servicenow_insights_directorates, else
## the parent below the root, else Other. docs/SERVICENOW_INSIGHTS.md, "Sites, directorates and
## teams". parents or names
# servicenow_insights_hierarchy_source: parents

## parents: the sites' root groups (exact names); [] = parentless groups with children
# servicenow_insights_site_roots: []

## {"<exact group name>": {site: X, directorate: Y, team: Z}}: wins over either
# servicenow_insights_hierarchy_map: {}

## names: [NOVA] - a group whose name ends in "- NOVA" is in NOVA
# servicenow_insights_suffix_directorates: []

## names: second parts that name a directorate (e.g. [CODEX])
# servicenow_insights_directorates: []

## names: {COMPONENTX: N6} - a whole word in a group's name puts it there
# servicenow_insights_directorate_tags: {}

## names: {J602: J60} - rename or merge directorates
# servicenow_insights_directorate_alias: {}

## read the groups' parents in ServiceNow (sys_user_group); refused: by the names
# servicenow_insights_use_group_parents: true

## true: a group not in the map goes in Unknown (to find and map later)
# servicenow_insights_known_groups_only: false

## no team page for these (names or patterns, e.g. ["* - Legacy*"]); tickets still count
# servicenow_insights_exclude_groups: []

## a group inactive in ServiceNow gets no team page; its tickets still count
# servicenow_insights_inactive_teams: false

## no team page for these group types
# servicenow_insights_skip_group_types: [approver, permission, survey, system, idea, legacy]

## THE SPLIT: with both set, every page has All | LABEL | non-LABEL - its figures for the groups
## whose name, or a parent team's below the root, matches the pattern (* and ?, any case), and for
## the rest. E.g. label NOVA, pattern "*- NOVA". the switch's label (e.g. NOVA); "" = no switch
# servicenow_insights_split_label: ""

## the groups it picks: e.g. "*- NOVA" (* and ?, any case)
# servicenow_insights_split_pattern: ""

## false: the switch on All, the sites and directorates only (fewer files)
# servicenow_insights_split_teams: true

## A catalog item's own target in hours, beating its priority's: {"New account / onboarding": 48,
## "Software install": 120}
# servicenow_insights_sla_items: {}

## Also email a team's own report to these people (the team's page, the same look): {"Ops -
## Windows": [lead@yoursite.mil]}.
# servicenow_insights_team_email_to: {}

## The tables read: incident, sc_req_item (requested items: the most requested services), sc_task
## (catalog tasks: the All-stars count their closures), change_request, problem. Take one out to
## leave its sections out. A table the account cannot read is said in the report.
# servicenow_insights_tables: [incident, sc_req_item, sc_task, change_request, problem]

## at most this many records per table (the rest are said: shorten the window)
# servicenow_insights_max_records: 20000

## The assignment history of incidents passed around: the paths of Passed between groups. From
## sys_audit, else (0.97.0) the out-of-box incident metric "Assignment Group" (metric_instance) -
## both read only; the account needs read on one of them; without either the counts are still there
## and the report says which it could not read. false: not read.
# servicenow_insights_audit: true

## auto (sys_audit, else the metric), audit, metric (sys_audit never asked), none
# servicenow_insights_handoff_source: auto

## The groups' members (sys_user_grmember): each team's leaderboard lists its members, and a ticket
## resolved by someone outside the team counts for the member it was assigned to. The account needs
## read on sys_user_grmember (itil has it on most instances); without it the leaderboard lists
## everyone the team's tickets were assigned to or resolved by, and the report says so. false: not
## read.
# servicenow_insights_members: true

## WHAT THE REPORT SHOWS incident issues listed (the workbook has every one)
# servicenow_insights_top_issues: 10

## catalog items listed
# servicenow_insights_top_requests: 10

## open longer than this: flagged (Over 30 days)
# servicenow_insights_old_days: 30

## an incident reassigned this many times or more is "passed between groups"
# servicenow_insights_handoff_min: 3

## a problem candidate: this many incidents of one issue on one CI ...
# servicenow_insights_problem_min: 3

## ... within this many days
# servicenow_insights_problem_days: 30

## reopened, or came back (a new incident of the same caller and issue), within this many days
# servicenow_insights_repeat_days: 14

## Reopen is "not used" when fewer than this share (%) of the incidents were ever reopened: the
## report then counts the incidents that came back instead (the same person, the same issue, a new
## ticket).
# servicenow_insights_reopen_min_percent: 0.2

## Changes: an incident on the change's CI within this many hours of its end is shown as following
