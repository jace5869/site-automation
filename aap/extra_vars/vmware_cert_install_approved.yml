## Only in the workflow, after the approval: the check job hands it vmware_cert_install_plan. Do not tick
## "Prompt on launch" for Variables on this template.

# ---- vmware_vm -----------------------------------------------------------------------------------
## Check vCenter's certificate. false only if the execution environment does not trust your CA yet.
# vmware_validate_certs: true

## The certificate the PKI put on the catalog request of a vCenter's or a host's CSR, installed
## where its key waits. A host's certificate: vCenter must trust its issuer, or it refuses the host
## after the replacement - the plan adds the CA chain (from the request) to vCenter's trusted roots
## when it is not there. false = do not read or add them (you know vCenter trusts the issuer, or its
## trusted roots cannot be read).
# vmware_cert_install_trust_check: true

## Seconds a host may take, after the install, until vCenter shows its new certificate (reconnected
## if vCenter lost it).
# vmware_cert_install_host_wait: 300

## Seconds vCenter may take to serve its new certificate on its port: before vCenter 8.0 Update 2
## its services restart.
# vmware_cert_install_vcenter_wait: 1800

# ---- servicenow ----------------------------------------------------------------------------------
## check the instance's HTTPS certificate (see servicenow_ca_path)
# servicenow_validate_certs: true

## A CA bundle (PEM) for the instance's TLS certificate, when the execution environment does not
## trust its CA (e.g. a DoD root CA): a path on the controller, such as a file you add to the
## project: servicenow_ca_path: "{{ playbook_dir }}/files/ca/servicenow-ca.pem". Empty = the
## execution environment's normal trust store. Prefer this over servicenow_validate_certs: false.
# servicenow_ca_path: ""

## seconds for one API request
# servicenow_timeout: 30
