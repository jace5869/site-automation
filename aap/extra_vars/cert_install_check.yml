# ---- check_certs ---------------------------------------------------------------------------------
## ---- Leaving hosts out (the certificate report and the renewal; not the health check) ---- Hosts
## whose certificates something else renews - Satellite and its Capsules (satellite-installer, never
## by hand), appliances - are left out of the certificate report and never get a CSR: listed as not
## checked, no ticket. Name them, or put them in a group. Both take a list or one string with commas
## ('sat01*, cap01.example.mil'), so a survey answer works too. host names as in the AAP inventory,
## any case, * and ? wildcards; a short name matches the full one, e.g. [sat01, '*capsule*']
# cert_skip_hosts: []

## AAP inventory groups, e.g. [sat] (the health check still watches the Satellite web UI:
## group_vars/sat.yml)
# cert_skip_groups: [sat]

## ---- Renewal: a new key and CSR for each certificate that expires soon
## (playbooks/cert_renew_csr.yml) ---- The certificates the report flags (within
## check_certs_warn_days - 30 days or less - or expired) get a new key and a CSR with the same
## subject and names (subjectAltName), on the host; the CSR is attached to the certificate's
## ServiceNow incident (a new one if none is open, whatever servicenow_min_severity says). A
## certificate file, one served on a port (read from the port) and one in a keystore (its entry with
## a key) all get one; the ticket says where to install it. Never: CA certificates (a chain), self-
## signed ones (unless cert_renew_self_signed), placeholders (check_certs_placeholder_subject), the
## trust store (check_certs_trust_dirs, /etc/pki/ca-trust/: certificates this host trusts, not its
## own). the new keys (0600) and CSRs, on the host (the folder is made 0700); the key never leaves
## the host
# cert_renew_dir: /etc/pki/tls/renew

## What to do with the issued certificate when something else deploys the file (a copy by hand would
## be overwritten): the start of the file's path -> the next step written on the ticket instead of
## "install it in place of the file". Add your own.
# cert_renew_install_notes:
#   /etc/stigman/: >-
#     STIG Manager: put the issued certificate (with its chain) and the new key in the AAP credential
#     "TLS certificate", then run STIG Manager - deploy (it restarts only nginx). A file copied by hand
#     is overwritten by the next deploy.

## ---- Install: the issued certificate in place of the old one (playbooks/cert_install_check.yml ->
## approval -> playbooks/cert_install_approved.yml) ---- With cert_renew_servicenow: catalog, the
## PKI puts the issued certificate on the request that carries its CSR. The install check finds it
## there (the certificate whose public key is the CSR's), says what installing it would do, and
## waits for the approval; the install job then puts it in place of the old one - the same file
## layout (text or binary, with its chain, with its key), the old key's file replaced by the new
## key, the old owner, mode and SELinux label kept - after copying each file aside
## (cert_renew_dir/backup). It tests the service's configuration, reloads it (a reload only: never a
## restart), and asks the port which certificate it serves. Anything wrong: the copies go back and
## the service is reloaded again. Installed: the renewal's key and CSR move to
## cert_renew_dir/installed. Never automatic, with the steps for a person: a keystore (its program
## needs a restart), a certificate seen only on a port, a service that cannot reload, a path in
## cert_renew_install_notes (something else deploys it). docs/CERT_INSTALL.md The service that uses
## a certificate file is found by itself: the configuration of httpd, nginx, haproxy, postfix,
## dovecot, slapd or cockpit that names the file, and the program on the port that serves it. For a
## file no configuration names - the service to reload: [{path: glob, service: unit}], e.g. [{path:
## '/opt/app/tls/*.crt', service: app}]. A service listed here is tested by no command first.
# cert_install_services: []

## The services whose configuration is searched for the certificate's file - [{dir, service, test}]
## (test: the command that checks the configuration before the reload). Empty = httpd (/etc/httpd,
## apachectl configtest), apache2, nginx (nginx -t), haproxy (haproxy -c), postfix (postfix check),
## dovecot (doveconf -n), slapd, cockpit.
# cert_install_known_services: []

## services (globs) the job never reloads, e.g. ['slapd*']: their certificates are installed by a
## person
# cert_install_never_reload: []

## The old key's file, when it cannot be found - neither in the configuration that names the
## certificate, nor once in the usual folders (several files with the old key: held, to be named
## here): {certificate file: key file}, e.g. {/etc/pki/tls/certs/web01.crt:
## /etc/pki/tls/private/web01.key}
# cert_install_key_files: {}

## where else to look for the old key (empty = /etc/pki/tls/private, /etc/ssl/private, the services'
## folders ...)
# cert_install_key_dirs: []

## the chain must build up to a root (the host's trust store, or the PKI's root sent with it); false
## = install without
# cert_install_trust_check: true

# ---- servicenow ----------------------------------------------------------------------------------
## check the instance's HTTPS certificate (see servicenow_ca_path)
# servicenow_validate_certs: true

## A CA bundle (PEM) for the instance's TLS certificate, when the execution environment does not
## trust its CA (e.g. a DoD root CA): a path on the controller, such as a file you add to the
## project: servicenow_ca_path: "{{ playbook_dir }}/files/ca/servicenow-ca.pem". Empty = the
## execution environment's normal trust store. Prefer this over servicenow_validate_certs: false.
# servicenow_ca_path: ""

## seconds for one API request
# servicenow_timeout: 30

## A request closed in one of these states (a requested item's: 4 Closed Incomplete, 7 Closed
## Skipped - rejected or cancelled) is ordered again on the next run. In any other state - open, in
## progress, Closed Complete (the PKI issued it: install it) - the certificate is not ordered again.
# cert_renew_catalog_reorder_states: ["4", "7"]

## ---- Certificate install: the issued certificate, from its request (cert_install_check.yml,
## win_cert_install_check.yml) ---- The PKI puts the issued certificate on the request (RITM) that
## carries the CSR: attached to the RITM, to one of its attachment questions, or to its REQ - one
## file or several, PEM, DER, PKCS7 (.p7b) or a zip of them - or pasted into a work note or comment.
## The job reads them all and takes the certificate whose public key is the CSR's; the CA
## certificates with it are its chain. Anything else there is listed, never used. the attachments
## read (their extension)
# cert_install_attachment_exts: [cer, crt, pem, der, p7b, p7c, p7, cert, zip, txt]

## a bigger attachment is not read
# cert_install_max_bytes: 1048576

## also look for a certificate pasted into the request's work notes and comments
# cert_install_journal: true

## the issued certificate must be valid at least this many more days (else held for a person)
# cert_install_min_days: 30

## true = install a certificate that lacks names (subjectAltName) the old one had; false = held for
## a person
# cert_install_fewer_names: false

# ---- site_findings - usually in all.yml ----------------------------------------------------------
## A host that cannot be reached (switched off, no network, ssh or WinRM refused, its login refused)
## in the health checks, the certificate report and renewal, database health, the service watch and
## troubleshoot: listed as NOT REACHED and left out, and the job is not failed for it. It still
## counts as checked-for, so the ServiceNow step opens its "no result" ticket. When NO host is
## reached (a wrong or expired machine credential looks like this) the job fails. true = a host not
## reached fails the job, as before. Patching, fixes, deploys and the Windows connection test always
## fail for it.
# site_unreachable_fails: false

