---
## Schedule it (every 15 minutes); run it with Check first: it lists what it would copy. report_web_copy: true,
## report_web_host, report_web_dest and report_web_url belong in all.yml - the report jobs read them too
# report_web_copy_jobs: [907, 908]               # these AAP jobs' pages again (job IDs), whatever was copied before

# ---- site_email - usually in all.yml -------------------------------------------------------------
## The look of the HTML version (docs/EMAIL_REPORTS.md, "The look"): standard = a header band in the
## report's colour (green, amber, red, blue) with number boxes under it; command = a dark header
## with your logo and report_email_header_text, the job's last runs as a strip of bars
## (report_history), the numbers in one row; portal = white cards on a pale mint background (like
## the AAP portal pages): a header card with your logo, report_email_header_text and the status,
## number tiles, a card with the last runs, a card per section. Classic desktop Outlook shows the
## portal cards square, without shadows. glass = see-through frosted cards on a soft blue-green
## background: your logo, the status and what it asks ("Action required"), tiles with icons (a
## warning or critical one tinted), the last runs beside This run / Last run, a card per section
## with its table on a near-solid panel; the line under the subject in the inbox, an "Open the full
## report" button with report_web_dest, tiles two by two on a phone. Mail programs that do not draw
## transparency (classic desktop Outlook) show solid white cards, square. The web page adds the
## blur, icons and a plain print.
# report_email_theme: standard

## command, portal, glass: the line with the logo
# report_email_header_text: Site automation report

## Your logo in the header (every look but standard): a PNG, JPEG or GIF in your repository - a path
## from playbooks/ (files/report_logo.png = playbooks/files/report_logo.png) or a full path.
## Attached to each email, so keep it small: about 160 px tall, under 100 KB. Updating with
## scripts/update-from-release: list the file in .site-local, or the update deletes it.
# report_logo_file: ""

## pixels in the email (its width follows); portal: at most 56, glass: at most 80
# report_logo_height: 84

## command, portal, glass: the job's last runs, read from AAP - attach a "Red Hat Ansible Automation
## Platform" credential to the template, whose user can see the template's jobs (Organization
## Auditor on its organization, docs/EMAIL_REPORTS.md); without it the email goes out without the
## strip.
# report_history: true

## a CA file for AAP's own HTTPS certificate ("" = what the execution environment trusts)
# report_history_aap_ca_path: ""

## Your own look instead: copy roles/site_email/templates/report.html.j2 (or report_command /
## _portal / _glass) to e.g. playbooks/files/email/report.html.j2, change it, and set
## report_email_html_template: "{{ playbook_dir }}/files/email/report.html.j2" report.html.j2 (the
## default) = the look report_email_theme picks.
# report_email_html_template: report.html.j2

## The time zone of the times in a report, besides UTC: e.g. America/New_York (a name as
## `timedatectl list-timezones` prints them) shows "2026-10-25 10:03:12 EDT (14:03 UTC)". vCenter,
## ESXi and their log files keep UTC; the vSphere Client shows the browser's time zone. "" = UTC
## only. Used by the VMware health and alarms reports and the ServiceNow weekly and ticket insights
## reports, and (1.49.0) by the report website and every report's own lines: the index page's runs,
## last run and "updated", the strip of past runs and the footer line show that time zone with its
## abbreviation - "2026-11-13 05:37 CET", summer time as it was on that day - also for runs written
## before it was set. What is stored (index.json, a run's JSON, the file names) stays UTC. A name
## the execution environment does not know (or one without the tzdata package): UTC, with a warning
## in the job output. docs/WEB_REPORTS.md, "Times in your time zone"; docs/VMWARE.md, "Times and
## clocks"
# report_time_zone: ""

## THE REPORT WEBSITE (docs/WEB_REPORTS.md): every report job also writes its report as a web page -
## off until report_web_dest is set. Works without an email (report_email_to empty). Each run: its
## page, a copy as the template's latest page, the report's data as JSON beside each (for your own
## site), and an index of every report's last run. The job prints the page's address ("Report:
## https://...") and keeps it as the job artifact site_report_url. Where the files go: a folder the
## job can write - a share mounted on the AAP execution nodes and exposed to jobs (Settings > Job
## settings > Paths to expose to isolated jobs), e.g. /mnt/reports - or an https:// address that
## takes uploads (HTTP PUT, WebDAV: nginx, Apache, IIS) - or a Windows file share's folder, written
## over SMB with no mount: '\\fileserver\its\aap\reports' (the folder there already; smbprotocol in
## the execution environment). An upload's or a share's login comes from a "Report website"
## credential (aap/credential_types/report_web.yml).
# report_web_dest: ""

## the address people open that folder at, e.g. https://reports.yoursite.mil ("" = dest when it is
## https://)
# report_web_url: ""

## The website's look (docs/WEB_REPORTS.md, "The look"): atlas = made for a browser, never an email
## - a wide page whose tables use all of it (columns sized by what they hold: numbers right-aligned,
## short values whole, paths broken at / and \), a bar at the top that stays (the sections, Compact
## / Comfortable rows, Light / Auto / Dark - the reader's own setting on Auto -, Print), status
## chips with icons (a check mark for OK), Start here cards with a Copy button, tables that sort and
## filter, rows as cards on a phone; the index page too. brief (0.92.0) = the same page read like a
## morning brief, calm and soft (0.94.0): what it found as a chip, the key figures as one strip,
## Start here as numbered steps, percentages as bars, soft greys in dark, translucent cards; its
## index is the list of reports (one line and the counts as chips), a report's first step under its
## line, the logo larger. Or one of the email looks: standard, command, portal or glass (as
## report_email_theme - the index page is then in the portal look).
# report_web_theme: atlas

## every report's last runs, a tab per area ("" = none)
# report_web_index: index.html

## the runs each report keeps: listed under its line of the index, the pages of older runs deleted
# report_web_history: 5

## false = the older runs' pages stay in the folder (only the index forgets them)
# report_web_delete_old: true

## The index page's tabs: a report is on the first tab one of whose names its AAP template's name
## matches (any case, * = anything); else on the tab of its name up to " - " (Backup - nightly:
## Backup); else on Other. A tab with no report is not shown. Set it in all.yml, for every template
## alike: the index is one page.
# report_web_tabs:
#   - {tab: Certificates, match: ["*certificate*", "*trust store*", "PKI *"]}
#   - {tab: VMware, match: ["VM *", "VMs *", "VMware*", "ESXi*", "vCenter*"]}
#   - {tab: Horizon, match: ["Horizon*"]}
#   - {tab: Tenable.sc, match: ["Tenable*"]}
#   - {tab: Windows, match: ["Windows*", "Active Directory*", "AD *", "ACT for Windows*"]}
#   - {tab: Network and storage, match: ["Network*", "NetApp*", "ONTAP*", "Cisco UCS*", "UCS*"]}
#   - {tab: Linux, match: ["Linux*", "Health check*", "Troubleshoot*", "Patch*", "Database*", "Service watch*", "POA&M*", "STIG*", "Evaluate-STIG*",
#                          "Log analysis*", "fapolicyd*", "Apply approved*", "Mail relay*", "ACT - *"]}
#   - {tab: ServiceNow and AAP, match: ["ServiceNow*", "AAP *", "Report website*"]}

## the report's data as .json beside each page and index.json beside the index
# report_web_json: true

## A share (report_web_dest \\server\share\folder): how the job logs in, and the connection.
## negotiate (Kerberos - FIPS too: user@YOURDOMAIN.MIL, the server's full name - else NTLM), ntlm,
## or kerberos (a ticket already in the job)
# report_web_smb_auth: negotiate

## true = encrypt (SMB 3) even when the share does not require it; one that requires it is always
# report_web_smb_encrypt: false

## the share's port
# report_web_smb_port: 445

## a CA file for an https:// report_web_dest, or report_web_host's WinRM certificate ("" = what the
## EE trusts)
# report_web_ca_path: ""

## A share, an upload address or a folder that fails for a reason that passes (Kerberos "Message
## stream modified" while a file server's machine password changes, no KDC reached, a connection
## reset, a session gone, HTTP 503): tried again from a new login. A real error (password, access,
## no such share or folder) is not. Tries again this many times; 0 = none
# report_web_retries: 3

## seconds between two tries
# report_web_retry_delay: 30

## false = still not published after the retries: a warning, the email says so at the top, the job
## goes on; true = the job fails
# report_web_required: false

## Or on a Windows server (a file server, or the IIS server itself): report_web_host is that server,
## report_web_dest the folder on it (D:\reports, there already). The pages are made on the AAP side
## and written there over WinRM, in one PowerShell script per run (Constrained Language Mode too):
## nothing to mount, no WebDAV. The login: the "Report website" credential's user name and password,
## or - without it - the template's Machine credential; the account needs WinRM (Remote Management
## Users) and Modify on the folder. The connection, as your Windows inventory's: e.g.
## web01.yoursite.mil
# report_web_host: ""

## winrm or psrp
# report_web_host_connection: winrm

## WinRM: 5986 (https), 5985 (http)
# report_web_host_port: 5986

## https, or http (Kerberos and NTLM encrypt each message then)
# report_web_host_scheme: https

## ntlm, kerberos (Kerberos in the EE), credssp or basic
# report_web_host_transport: ntlm

## validate (the CA: report_web_ca_path) or ignore
# report_web_host_cert_validation: validate

## THE COPY JOB instead (docs/WEB_REPORTS.md, "The copy job"): for report templates whose execution
## environment cannot reach the web server (no WinRM or Kerberos in it). true = the report jobs
## write nothing there - each keeps its report in AAP (the job artifact site_report_page) and the
## one job template "Report website - copy" (playbooks/report_web_copy.yml), in an execution
## environment that reaches report_web_host, writes the pages there later, at the same address: the
## email's button and site_report_url point at it (there once the copy job has run). Set it in
## all.yml, with report_web_dest and report_web_url as above; the copy job uses them (and
## report_web_theme, the logo) too.
# report_web_copy: false

## its first run (no copy before it): the report jobs of the last 24 hours
# report_web_copy_hours: 24

## pages a run writes at most; the rest are the next run's
# report_web_copy_max_pages: 50

# ---- site_act - usually in all.yml ---------------------------------------------------------------
## ACT at all (1.3.0): false = no job calls ACT - no request, no model endpoint or key needed, no
## error; each report says "ACT is off (site_act_enabled false)" in one line and the job stays green
## (an enclave without a model). Usually in all.yml (docs/ENCLAVES.md).
# site_act_enabled: true
