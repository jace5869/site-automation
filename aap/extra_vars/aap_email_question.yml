## more job templates or workflows, by name or ID
# aap_email_question_templates: []

## templates left out, by name or ID
# aap_email_question_exclude: []

## also the workflows that run them (a job in a workflow is never asked its own survey)
# aap_email_question_workflows: true

## a CA file for AAP's HTTPS certificate ("" = what the execution environment trusts)
# aap_email_question_ca_path: ""

## The question, as whoever launches a template sees it. A text box of several lines (a pasted list
## keeps its line breaks), not required, empty by default.
# aap_email_question_text: Also email the report to

## The help text under the question.
# aap_email_question_description: >-
#   Optional. More people for this run's report, on top of the template's usual recipients: email addresses
#   separated by commas or semicolons, or one per line (pasted from Outlook or Excel works too).

# ---- vmware_vm -----------------------------------------------------------------------------------
## The text to write.
# vm_notes: ""

# ---- site_email - usually in all.yml -------------------------------------------------------------
## Who gets it: a list, or text with commas / spaces / one per line (a survey answer). Empty = no
## email. Set it on each TEMPLATE (its Variables, or a survey): in all.yml every report job emails.
# report_email_to: []

## "Also email the report to": more people for one run, asked when the job is launched - a survey
## question (playbooks/aap_email_question.yml adds it to the report templates). Added to
## report_email_to, never in its place; empty = only report_email_to. A list, or text: addresses
## separated by commas, semicolons, spaces or one per line, or pasted from Outlook (Doe, Jane
## <jane.doe@yoursite.mil>; ...).
# report_email_also: []

## the sender, e.g. aap-noreply@yoursite.mil
# report_email_from: ""

## your mail relay, e.g. smtp.yoursite.mil
# report_email_smtp_host: ""
