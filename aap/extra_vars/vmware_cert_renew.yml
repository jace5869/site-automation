# ==================================================================================================
# Variables for the job template "VMware - certificate renewal"
#   playbook:    playbooks/vmware_cert_renew.yml
#   credentials: VMware vCenter, ServiceNow API
#
# HOW TO USE: copy this file into the template's Variables box (YAML selected).
#   - A setting starting with "# " is switched off. To use it, delete the "# " in front of its
#     line (and of the indented lines under it), then change the value. Lines starting with
#     "## " say what the setting below them does.
#   - Switch on only what you change: a value here beats the same setting everywhere else,
#     including playbooks/group_vars/all.yml. The values shown are the defaults.
#   - The settings under "usually in all.yml" apply to every job: set them once there.
#   - Every setting, in full: docs/VARIABLES_REFERENCE.md (the Settings Reference PDF).
# GENERATED by scripts/gen_template_vars.py from roles/*/defaults/main.yml - do not edit here.
# ==================================================================================================
---
servicenow_assignment_group: YOUR GROUP NAME   # who gets the incidents (exactly as in ServiceNow)

# ---- vmware_vm -----------------------------------------------------------------------------------
## Check vCenter's certificate. false only if the execution environment does not trust your CA yet.
# vmware_validate_certs: true

## Several vCenters (e.g. Enhanced Linked Mode), one report: the reports and the ESXi security
## settings read the credential's vCenter AND these (names, or name:port), with the same account.
## The same vCenter under two names is read once. docs/VMWARE.md, "Several vCenters". e.g.
## [vc01.yoursite.mil, vc02.yoursite.mil]
# vmware_vcenters: []

## true = the job shows failed when a vCenter could not be read (the report lists it in red either
## way)
# vmware_vcenter_fail_unread: false

## A certificate of vCenter (its Machine SSL certificate, the one its web pages show) or of an ESXi
## host that expires within this many days (or has expired) is due: a ServiceNow incident, and a CSR
## made where its key stays - vCenter, or the host - attached to the incident with what to do next.
## To try the job on certificates that are years from expiring, raise it for one run (e.g. 3650:
## every certificate is due) with vmware_cert_only naming one host, and vmware_cert_make_csr: false
## first. Each incident says the number used. Afterwards, a run with the real number notes those
## incidents as cleared (with servicenow_resolve_cleared: true, resolves them).
# vmware_cert_warn_days: 30

## within this many days (or expired) the incident is critical, else warning
# vmware_cert_crit_days: 7

## the ESXi hosts' certificates too; false = vCenter's only
# vmware_cert_esxi: true

## Only these vCenters and hosts: names, any case, * and ? allowed, the short name matches too -
## e.g. one host to try the job on. [] = every vCenter of the job and every host connected to it.
# vmware_cert_only: []

## false = the incidents only, no CSR. A CSR is made once per certificate: the incident is its
## record, and a second CSR would replace the key that waits on vCenter or the host for the issued
## certificate.
# vmware_cert_make_csr: true

## A certificate signed by vCenter's own CA (VMCA - how vCenter gives ESXi hosts their certificates
## unless told otherwise) is renewed in vCenter (its Renew button): its incident says so, and no CSR
## is made. true = a CSR for those too, to replace them with certificates of your PKI.
# vmware_cert_vmca_csr: false

## Issuers taken as VMCA besides VMCA's own root (CN=CA with DC=..., or OU=VMware Engineering): any
## case, * and ? allowed, e.g. ['*O=vc01.yoursite.mil*'].
# vmware_cert_vmca_issuers: []

## vCenter's CSR: its subject and names are the current certificate's. vCenter's API wants an
## organization, organization unit, locality, state and country - one the certificate does not have
## goes empty. Set any of them here (the PKI sets the subject by its own rules anyway), e.g.
## vmware_cert_csr_fields: {organization: U.S. Government, organization_unit: DoD, country: US,
## key_size: 3072} (key_size: vCenter's default is 3072 bits). An ESXi host makes its CSR with its
## own name.
# vmware_cert_csr_fields: {}

## Without the ServiceNow API credential no CSR is made (nothing would record it: the next run would
## make another one). true = make them anyway, and print them in the job output.
# vmware_cert_csr_without_servicenow: false

# ---- servicenow ----------------------------------------------------------------------------------
## Findings at or above this severity get a ticket: critical | warning. A ticket already open stays
## open while its finding is still there, even below this (the certificate renewal opens one for
## every CSR)
# servicenow_min_severity: warning

## the table tickets are opened in (incident)
# servicenow_table: incident

## user name; empty = the API account
# servicenow_caller: ""

## e.g. Software
# servicenow_category: ""

## a new ticket's urgency, per finding severity (your instance's values)
# servicenow_urgency: {critical: "1", warning: "2"}

## a new ticket's impact, per finding severity
# servicenow_impact: {critical: "2", warning: "3"}

## set Configuration item = the host name (must exist in the CMDB)
# servicenow_set_ci: true

## More fields for every new ticket - for an instance that makes fields such as Location,
## Subcategory or Channel mandatory: {column name: value}. Names and choice labels work, e.g.
## servicenow_fields: {location: "Building 100", subcategory: "Operating System", contact_type:
## "Self-service"} A field's column name: right-click its label on the form > Show - '<column
## name>'.
# servicenow_fields: {}

## When a problem that had a ticket is gone, add a work note (and, if you want, resolve it).
# servicenow_note_cleared: true

## true = also resolve the ticket (servicenow_resolved_state, servicenow_close_code)
# servicenow_resolve_cleared: false

## Resolved
# servicenow_resolved_state: "6"

## must be a close code your instance has
# servicenow_close_code: "Solution provided"

## More fields set when a ticket is resolved (servicenow_resolve_cleared, and the test ticket), for
## an instance that makes them mandatory: {column name: value}, e.g. {resolved_by: svc_aap_sn}
# servicenow_resolve_fields: {}

## Add a work note to an open ticket each time its finding is seen again.
# servicenow_note_repeats: true

## Every ticket from these playbooks carries a correlation ID starting with this, so the same
## problem on the same host always updates the same ticket.
# servicenow_correlation_prefix: site-health

## check the instance's HTTPS certificate (see servicenow_ca_path)
# servicenow_validate_certs: true

## A CA bundle (PEM) for the instance's TLS certificate, when the execution environment does not
## trust its CA (e.g. a DoD root CA): a path on the controller, such as a file you add to the
## project: servicenow_ca_path: "{{ playbook_dir }}/files/ca/servicenow-ca.pem". Empty = the
## execution environment's normal trust store. Prefer this over servicenow_validate_certs: false.
# servicenow_ca_path: ""

## seconds for one API request
# servicenow_timeout: 30

## Fail the job when it opened/updated tickets, so the workflow shows red while problems exist.
# servicenow_fail_when_findings: true

## How the CSRs the certificate renewals make (Linux, Windows, VMware, network devices) go to the
## PKI. incident: each one is attached to its certificate's incident, with a work note saying what
## to do next - a person submits it to the PKI. catalog: each one is ordered from your PKI's catalog
## item (cert_renew_catalog_item) - one request per certificate, the CSR in the item's attachment
## question; no incident. Set the item's questions below: the "ServiceNow - catalog test" job lists
## them. docs/CERT_RENEWAL_CATALOG.md
# cert_renew_servicenow: incident

## incident: a CSR on an incident of the certificate made in the last this-many days counts as made
## - also when that incident was resolved or closed since (the PKI may still be signing it):
## vCenter, ESXi and Cisco keep one pending key, and a second CSR would replace it. Older: a new CSR
## (the certificate is due again).
# cert_renew_csr_memory_days: 90

## The catalog item: its name exactly as the catalog shows it (e.g. "DoD PKI Certificate Request"),
## or its sys_id.
# cert_renew_catalog_item: ""

## The item's questions - by their internal names, as the catalog test lists them - and the answers:
## {name: answer}. A reference (Requested For, Location ...): the record's name, or its sys_id. A
## choice: its value or its label. In an answer, {host}, {subject}, {names}, {expires}, {issuer} and
## {where} become the certificate's. e.g. {requested_for: svc_aap_sn, preferred_contact: Email,
## location: "Building 100"}
# cert_renew_catalog_variables: {}

## The attachment question that gets the CSR (its internal name). Empty = the item's only attachment
## question.
# cert_renew_catalog_csr_variable: ""

## A question that gets the certificate's names (subjectAltName), e.g. a "List any additional SANs"
## box. Empty = none.
# cert_renew_catalog_names_variable: ""

## A request closed in one of these states (a requested item's: 4 Closed Incomplete, 7 Closed
## Skipped - rejected or cancelled) is ordered again on the next run. In any other state - open, in
## progress, Closed Complete (the PKI issued it: install it) - the certificate is not ordered again.
# cert_renew_catalog_reorder_states: ["4", "7"]

## Where the CSR is uploaded before the order, for the attachment question (ServiceNow moves it to
## the request).
# cert_renew_catalog_upload_table: ZZ_YYsc_cart_item

# ---- check_certs ---------------------------------------------------------------------------------
## What to do with the issued certificate when something else deploys the file (a copy by hand would
## be overwritten): the start of the file's path -> the next step written on the ticket instead of
## "install it in place of the file". Add your own.
# cert_renew_install_notes:
#   /etc/stigman/: >-
#     STIG Manager: put the issued certificate (with its chain) and the new key in the AAP credential
#     "TLS certificate", then run STIG Manager - deploy (it restarts only nginx). A file copied by hand
#     is overwritten by the next deploy.

## The CSR's attachment on the ticket: <common name>-<8 characters of the CSR's SHA-256>.<ext> (a
## new CSR, a new name). An instance that refuses .csr attachments (its allowed extensions, or
## "Invalid file type: text/plain"): txt names every CSR .txt from the start. Refused, it is tried
## again as .txt (cert_renew_attach_retry_txt); refused again, the CSR goes in the ticket's work
## note and the job fails, to be seen.
# cert_renew_attach_ext: csr

## the attachment's Content-Type (a CSR is Base64 text)
# cert_renew_attach_type: text/plain

## a refused attachment is tried again as <name>.txt (text/plain); false: straight to the work note
# cert_renew_attach_retry_txt: true

# ---- site_email - usually in all.yml -------------------------------------------------------------
## Who gets it: a list, or text with commas / spaces / one per line (a survey answer). Empty = no
## email. Set it on each TEMPLATE (its Variables, or a survey): in all.yml every report job emails.
# report_email_to: []

## copied: a list, or text like report_email_to
# report_email_cc: []

## "Also email the report to": more people for one run, asked when the job is launched - a survey
## question (playbooks/aap_email_question.yml adds it to the report templates). Added to
## report_email_to, never in its place; empty = only report_email_to. A list, or text: addresses
## separated by commas, semicolons, spaces or one per line, or pasted from Outlook (Doe, Jane
## <jane.doe@yoursite.mil>; ...).
# report_email_also: []

## The domains an address in report_email_also may be in (a subdomain too), e.g. [yoursite.mil]; any
## other is listed in the job and gets no email. Empty = any domain (your mail relay may still
## refuse some).
# report_email_also_domains: []

## the sender, e.g. aap-noreply@yoursite.mil
# report_email_from: ""

## your mail relay, e.g. smtp.yoursite.mil
# report_email_smtp_host: ""

## 25 or 587 with starttls, 465 with ssl
# report_email_smtp_port: 25

## starttls = encrypt after connecting (the relay must offer it); ssl = encrypted from the start
## (port 465); none = not encrypted (only for a relay without encryption; then no login is sent).
# report_email_security: starttls

## a CA file that signed the relay's certificate (empty = the CAs the execution environment trusts)
# report_email_ca_path: ""

## put before every subject, e.g. "[AAP] Certificate report: ..."
# report_email_subject_prefix: "[AAP]"

## Send a formatted (HTML) version too, for reports that come with one (all VMware jobs). The email
## always carries a plain-text copy for mail clients that do not show HTML. false = plain text only.
# report_email_html: true

## Attach the report's tables to the email as an Excel workbook (.xlsx): a sheet per table. Some
## reports attach their own whatever this says (VM - inventory report: every VM on one sheet). The
## website gets no workbook.
# report_email_xlsx: false

## The look of the HTML version (docs/EMAIL_REPORTS.md, "The look"): standard = a header band in the
## report's colour (green, amber, red, blue) with number boxes under it; command = a dark header
## with your logo and report_email_header_text, the job's last runs as a strip of bars
## (report_history), the numbers in one row; portal = white cards on a pale mint background (like
## the AAP portal pages): a header card with your logo, report_email_header_text and the status,
## number tiles, a card with the last runs, a card per section. Classic desktop Outlook shows the
## portal cards square, without shadows. glass = see-through frosted cards on a soft blue-green
## background: your logo, the status and what it asks ("Action required"), tiles with icons (a
## warning or critical one tinted), the last runs beside This run / Last run, a card per section
## with its table on a near-solid panel; the line under the subject in the inbox, an "Open the full
## report" button with report_web_dest, tiles two by two on a phone. Mail programs that do not draw
## transparency (classic desktop Outlook) show solid white cards, square. The web page adds the
## blur, icons and a plain print.
# report_email_theme: standard

## command, portal, glass: the line with the logo
# report_email_header_text: Site automation report

## Your logo in the header (every look but standard): a PNG, JPEG or GIF in your repository - a path
## from playbooks/ (files/report_logo.png = playbooks/files/report_logo.png) or a full path.
## Attached to each email, so keep it small: about 160 px tall, under 100 KB. Updating with
## scripts/update-from-release: list the file in .site-local, or the update deletes it.
# report_logo_file: ""

## pixels in the email (its width follows); portal: at most 56, glass: at most 80
# report_logo_height: 84

## command, portal, glass: the job's last runs, read from AAP - attach a "Red Hat Ansible Automation
## Platform" credential to the template, whose user can see the template's jobs (Organization
## Auditor on its organization, docs/EMAIL_REPORTS.md); without it the email goes out without the
## strip.
# report_history: true

## bars in the strip, this run included
# report_history_runs: 14

## a CA file for AAP's own HTTPS certificate ("" = what the execution environment trusts)
# report_history_aap_ca_path: ""

## Your own look instead: copy roles/site_email/templates/report.html.j2 (or report_command /
## _portal / _glass) to e.g. playbooks/files/email/report.html.j2, change it, and set
## report_email_html_template: "{{ playbook_dir }}/files/email/report.html.j2" report.html.j2 (the
## default) = the look report_email_theme picks.
# report_email_html_template: report.html.j2

## THE REPORT WEBSITE (docs/WEB_REPORTS.md): every report job also writes its report as a web page -
## off until report_web_dest is set. Works without an email (report_email_to empty). Each run: its
## page, a copy as the template's latest page, the report's data as JSON beside each (for your own
## site), and an index of every report's last run. The job prints the page's address ("Report:
## https://...") and keeps it as the job artifact site_report_url. Where the files go: a folder the
## job can write - a share mounted on the AAP execution nodes and exposed to jobs (Settings > Job
## settings > Paths to expose to isolated jobs), e.g. /mnt/reports - or an https:// address that
## takes uploads (HTTP PUT, WebDAV: nginx, Apache, IIS) - or a Windows file share's folder, written
## over SMB with no mount: '\\fileserver\its\aap\reports' (the folder there already; smbprotocol in
## the execution environment). An upload's or a share's login comes from a "Report website"
## credential (aap/credential_types/report_web.yml).
# report_web_dest: ""

## the address people open that folder at, e.g. https://reports.yoursite.mil ("" = dest when it is
## https://)
# report_web_url: ""

## the page's look: standard, command, portal or glass (as report_email_theme)
# report_web_theme: portal

## The names inside the folder, with {names} filled in: {template} (the AAP template's name, lower
## case with dashes; the play's name outside AAP), {template_id}, {job} (the AAP job; local outside
## AAP), {status} (ok, warning, critical, info), {date} (2026-10-23), {time} (0605), {year},
## {month}, {day} - the time the job wrote it, UTC - and your own from report_web_names. Each must
## end in .html; folders are made as needed. each run's page (the address the job prints)
# report_web_page: "{template}/{date}_{time}_job-{job}.html"

## always the template's newest run ("" = none)
# report_web_latest: "{template}/latest.html"

## every report's last runs, a tab per area ("" = none)
# report_web_index: index.html

## the runs each report keeps: listed under its line of the index, the pages of older runs deleted
# report_web_history: 5

## false = the older runs' pages stay in the folder (only the index forgets them)
# report_web_delete_old: true

## The index page's tabs: a report is on the first tab one of whose names its AAP template's name
## matches (any case, * = anything); else on the tab of its name up to " - " (Backup - nightly:
## Backup); else on Other. A tab with no report is not shown. Set it in all.yml, for every template
## alike: the index is one page.
# report_web_tabs:
#   - {tab: Certificates, match: ["*certificate*", "*trust store*"]}
#   - {tab: VMware, match: ["VM *", "VMs *", "VMware*", "ESXi*", "vCenter*"]}
#   - {tab: Horizon, match: ["Horizon*"]}
#   - {tab: Tenable.sc, match: ["Tenable*"]}
#   - {tab: Windows, match: ["Windows*", "Active Directory*", "AD *", "ACT for Windows*"]}
#   - {tab: Network and storage, match: ["Network*", "NetApp*", "ONTAP*"]}
#   - {tab: Linux, match: ["Linux*", "Health check*", "Troubleshoot*", "Patch*", "Database*", "Service watch*", "POA&M*", "STIG*",
#                          "Log analysis*", "fapolicyd*", "Apply approved*"]}
#   - {tab: ServiceNow and AAP, match: ["ServiceNow*", "AAP *", "Report website*"]}

## your own {names}, e.g. {site: "{{ site_code }}"} for "{site}/{template}/..."
# report_web_names: {}

## the report's data as .json beside each page and index.json beside the index
# report_web_json: true

## A share (report_web_dest \\server\share\folder): how the job logs in, and the connection.
## negotiate (Kerberos - FIPS too: user@YOURDOMAIN.MIL, the server's full name - else NTLM), ntlm,
## or kerberos (a ticket already in the job)
# report_web_smb_auth: negotiate

## true = encrypt (SMB 3) even when the share does not require it; one that requires it is always
# report_web_smb_encrypt: false

## the share's port
# report_web_smb_port: 445

## a CA file for an https:// report_web_dest, or report_web_host's WinRM certificate ("" = what the
## EE trusts)
# report_web_ca_path: ""

## Or on a Windows server (a file server, or the IIS server itself): report_web_host is that server,
## report_web_dest the folder on it (D:\reports, there already). The pages are made on the AAP side
## and written there over WinRM, in one PowerShell script per run (Constrained Language Mode too):
## nothing to mount, no WebDAV. The login: the "Report website" credential's user name and password,
## or - without it - the template's Machine credential; the account needs WinRM (Remote Management
## Users) and Modify on the folder. The connection, as your Windows inventory's: e.g.
## web01.yoursite.mil
# report_web_host: ""

## winrm or psrp
# report_web_host_connection: winrm

## WinRM: 5986 (https), 5985 (http)
# report_web_host_port: 5986

## https, or http (Kerberos and NTLM encrypt each message then)
# report_web_host_scheme: https

## ntlm, kerberos (Kerberos in the EE), credssp or basic
# report_web_host_transport: ntlm

## validate (the CA: report_web_ca_path) or ignore
# report_web_host_cert_validation: validate

## THE COPY JOB instead (docs/WEB_REPORTS.md, "The copy job"): for report templates whose execution
## environment cannot reach the web server (no WinRM or Kerberos in it). true = the report jobs
## write nothing there - each keeps its report in AAP (the job artifact site_report_page) and the
## one job template "Report website - copy" (playbooks/report_web_copy.yml), in an execution
## environment that reaches report_web_host, writes the pages there later, at the same address: the
## email's button and site_report_url point at it (there once the copy job has run). Set it in
## all.yml, with report_web_dest and report_web_url as above; the copy job uses them (and
## report_web_theme, the logo) too.
# report_web_copy: false

## the kept report's greatest size, packed (a bigger one: its longest tables cut, said on the page)
# report_web_copy_max_kb: 256
