# ---- service_watch -------------------------------------------------------------------------------
## ---- What to watch ----------------------------------------------------------------------- With
## watch_discover on (the default), service watch finds the containers itself: every podman
## container on the host that SHOULD be running - root's (rootful) and each user's (rootless) - as
## the Health check `containers` finds them (roles/podman_discover: a systemd unit that starts it at
## boot - a Quadlet file with an [Install] section, or an enabled unit - or a restart policy of
## always / unless-stopped). The podman_discover_* settings (which users, which containers to leave
## out) apply here too. false = watch only the watch_containers list below.
# watch_discover: true

## Containers to watch in any case, in dependency order (a container's dependencies first). They are
## watched before the discovered ones, and one that is missing is reported as down. name: the
## container name, as `podman ps -a` shows it (or its Quadlet / service name) user: optional: the
## user that owns it (rootless podman). Without it: root's container. url: optional page to check as
## well, e.g. https://127.0.0.1/ unit: optional: the systemd unit that runs the container. Normally
## found by itself (below). e.g. [{name: mysql}, {name: stigman, url: "https://127.0.0.1/"}, {name:
## web, user: alice}]
# watch_containers: []

## HTTP codes that count as "answering"
# watch_url_ok_status: [200, 301, 302, 401, 403]

## ---- How each container is run (found by itself) ------------------------------------------- A
## container that a systemd unit runs (a Quadlet .container file, `podman generate systemd`, or a
## unit you wrote) must be started with systemctl, never with `podman start`: the unit owns it, and
## while the unit is stopped the container usually does not exist at all (Quadlet removes it). For
## each container the role looks for its unit, in this order: `unit:` above; the container's
## PODMAN_SYSTEMD_UNIT label; a Quadlet file in watch_quadlet_dirs that names it (ContainerName=, or
## the default name systemd-<file name>); a unit NAME.service or container-NAME.service that runs
## podman. No unit: it is a plain podman container, started with `podman start NAME`. A user's
## container (rootless) is looked at AS that user, and its unit is a user unit: `runuser -u USER --
## env XDG_RUNTIME_DIR=/run/user/UID systemctl --user start UNIT`.
# watch_find_units: true

## where root's Quadlet files are looked for (to find the unit that runs a container)
# watch_quadlet_dirs: [/etc/containers/systemd, /usr/share/containers/systemd]

## ---- What happens when one is down -------------------------------------------------------
## approval: ACT only diagnoses. Its proposed fix waits for the AAP approval step, then
## service_fix_approved.yml runs exactly the approved command(s) - no model involved. When ACT
## proposes nothing (or cannot run), the standard fix is proposed instead: `systemctl start UNIT`
## for a container a unit runs, `podman start NAME` otherwise - for a user's container the same, run
## as that user: `runuser -u USER -- env XDG_RUNTIME_DIR=/run/user/UID systemctl --user start UNIT`.
## self-heal: ACT may start/restart the watched containers (through their units) by itself, and
## nothing else. Still down after that: the playbook runs the standard fix itself. Any other fix
## goes to a person, as in approval mode.
# watch_mode: approval

## re-checks after a fix (every watch_verify_delay seconds)
# watch_verify_retries: 6

## seconds between those re-checks
# watch_verify_delay: 5

## ---- Where incidents are recorded (on the host) ------------------------------------------ One
## JSON line per event, plus a syslog line (tag service-watch) that your log forwarding (Splunk,
## Elastic, rsyslog relay) picks up. AAP's job history keeps its own copy.
# watch_record_file: /var/log/service-watch/incidents.jsonl

## also send each incident to syslog (tag service-watch)
# watch_record_syslog: true

# ---- podman_discover -----------------------------------------------------------------------------
## false = do not look for containers at all (the containers check then says "skipped", and Service
## watch watches only its watch_containers list).
# podman_discover_enabled: true

## Also look at the containers of users (rootless podman). A user is looked at when a podman process
## (conmon) runs as them, when they have "linger" on (/var/lib/systemd/linger/NAME), or when they
## are in /etc/subuid AND have container storage (~/.local/share/containers/storage). Their
## containers are read AS that user (runuser), and only when /run/user/UID exists - otherwise podman
## would create it (a change), so such a user is listed as "not checked" instead.
# podman_discover_rootless: true

## More users to look at (names), e.g. an application account the rules above miss.
# podman_discover_users: []

## Containers to leave out, as regular expressions that must match the WHOLE container name or
## OWNER/NAME, e.g. ['test-.*'] (every container whose name starts with test-, any owner),
## ['alice/.*'] (all of alice's containers), ['root/web'] (root's web only).
# podman_discover_ignore: []

## Where root's Quadlet files are (*.container). A user's are always read from
## ~/.config/containers/systemd, /etc/containers/systemd/users/UID and
## /etc/containers/systemd/users.
# podman_discover_quadlet_dirs: [/etc/containers/systemd, /usr/share/containers/systemd]

## Seconds one podman or systemctl call may take before it is given up (reported as a finding).
# podman_discover_timeout: 60
