# ==================================================================================================
# Variables for the job template "Patch hosts"
#   playbook:    playbooks/patch_hosts.yml
#   credentials: Machine (and VMware vCenter with patch_snapshot)
#
# HOW TO USE: copy this file into the template's Variables box (YAML selected).
#   - A setting starting with "# " is switched off. To use it, delete the "# " in front of its
#     line (and of the indented lines under it), then change the value. Lines starting with
#     "## " say what the setting below them does.
#   - Switch on only what you change: a value here beats the same setting everywhere else,
#     including playbooks/group_vars/all.yml. The values shown are the defaults.
#   - The settings under "usually in all.yml" apply to every job: set them once there.
#   - Every setting, in full: docs/VARIABLES_REFERENCE.md (the Settings Reference PDF).
# GENERATED by scripts/gen_template_vars.py from roles/*/defaults/main.yml - do not edit here.
# ==================================================================================================
---
## Batches: how many hosts at a time (here or in a survey - in all.yml it does nothing); 1 = one by one
# patch_serial: 10
## A VMware snapshot "patching" of each VM right before it is patched (attach a VMware vCenter credential too)
# patch_snapshot: true

# ---- patch ---------------------------------------------------------------------------------------
## what to update ('*' = everything that has an update)
# patch_packages: ['*']

## true = only updates that fix security advisories
# patch_security_only: false

## never update these here, e.g. ['mariadb*', 'kernel*']
# patch_exclude: []

## Reboot (only with automatic_restarts: true): when_needed (needs-restarting says so) | never |
## always
# patch_reboot: when_needed

## seconds to wait for the host to come back
# patch_reboot_timeout: 1800

## Hosts in these groups are patched but NEVER rebooted by this playbook (reboot them by hand, in a
## maintenance window). Add your own group names; the built-in protection below is on always.
# patch_never_reboot_groups: [aap, aap_hosts, sat, netapp, netapp_console_hosts]

## Hosts in these groups are skipped entirely (Satellite is upgraded with satellite-maintain, not
## dnf).
# patch_never_patch_groups: [no_patch, aap, aap_hosts, sat, netapp, netapp_console_hosts]

## BUILT IN, whatever you set above (roles/patch/vars/main.yml): the AAP hosts (groups aap and
## aap_hosts) are never patched and never rebooted by a job, and neither is the machine the job runs
## from (a local connection). A package script can restart services under the running job. Set the
## two lists above only to ADD groups; you cannot remove AAP from the protection. A host that cannot
## be reached when the job starts (switched off, a firewall, ssh or its login refused): true = it is
## listed as NOT REACHED and left out - not patched, no snapshot - and the other hosts are patched;
## the job is not failed for it, and its last lines list every host not reached. false = it fails,
## and the rollout stops. No host reached at all always fails the job (the machine credential?), and
## a host lost later (it went down halfway, did not come back from its reboot) always fails it and
## stops the rollout.
# patch_skip_unreachable: true

## free space needed in /var before starting
# patch_min_free_mb: 1024

## seconds to wait for services to come back after a reboot
# patch_service_wait: 120

## Services that come and go on their own and are not compared before/after (regular expression)
# patch_ignore_services: '^(user@|user-runtime-dir@|session-|dnf-makecache|packagekit|fwupd|run-|systemd-(hostnamed|timedated|localed|coredump))'

## the snapshot's name (the AAP job, user and date go in its description)
# patch_snapshot_name: patching

## true = VMware Tools freezes the file systems first (slower; fails without Tools)
# patch_snapshot_quiesce: false

## false = a host whose VM is in no vCenter is a physical server: patched without a snapshot, and
## the job says so. When a vCenter could not be read, such a host may be a VM there, and the job
## stops before anything is patched. true = a host without a VM stops the job too (every host must
## be a VM, each patched only after its snapshot).
# patch_snapshot_required: false

## A VM that still has a snapshot named patch_snapshot_name (the last patching's, not deleted yet)
## stops the job before anything is patched, and the job names them. true = delete that old
## snapshot, then take the new one.
# patch_snapshot_replace: false

## ---- Protected VMs ---- A host on the VMware protected lists is not patched: one of its groups is
## in vmware_protected_groups, or its name, short name, vmware_vm_name or VM in vCenter matches
## vmware_protected_vms or vm_snapshot_cleanup_exclude_vms (* and ? allowed, any case) - the VMs the
## snapshot cleanup never touches. Set those lists in all.yml, so this job sees them too. To patch
## them anyway, each one only after its own snapshot (patch_snapshot: true; its VM must be found,
## whatever patch_snapshot_required says): true = all of them, or a list of names (* and ? allowed)
## = only those. AAP never.
# patch_protected_with_snapshot: false

# ---- vmware_vm -----------------------------------------------------------------------------------
## only needed when the same VM name exists in two datacenters
# vmware_datacenter: ""

## Check vCenter's certificate. false only if the execution environment does not trust your CA yet.
# vmware_validate_certs: true

## Several vCenters (e.g. Enhanced Linked Mode), one report: the reports and the ESXi security
## settings read the credential's vCenter AND these (names, or name:port), with the same account.
## The same vCenter under two names is read once. docs/VMWARE.md, "Several vCenters". e.g.
## [vc01.yoursite.mil, vc02.yoursite.mil]
# vmware_vcenters: []

## The AAP server is ALWAYS refused (hosts in the groups aap / aap_hosts, matched by VM name, guest
## host name and IP address), and so are the hosts of these groups and these VM names (* and ?
## allowed: DC*). List the AAP VM's name here when it differs from its host name, and vCenter's own
## VM. The snapshot cleanup never deletes their snapshots either, and Patch hosts does not patch
## them (docs/RUNBOOKS.md).
# vmware_protected_groups: [aap, aap_hosts]

## e.g. [AAP01, VCSA01, DC*] (* and ? allowed)
# vmware_protected_vms: []

## - a snapshot of these VMs: names, * and ? allowed (e.g. [DC*, VCSA01, AAP01]). The VMs in
## vmware_protected_vms and the AAP server are never cleaned up either. Patch hosts does not patch
## these VMs. (docs/RUNBOOKS.md, Patch hosts)
# vm_snapshot_cleanup_exclude_vms: []

## seconds to wait for one deletion (vCenter merges it into the disk)
# vm_snapshot_delete_timeout: 1800

# ---- win_patch -----------------------------------------------------------------------------------
## NO AUTOMATIC RESTARTS unless you say so: this playbook restarts a server only when
## automatic_restarts is true (the job template's Variables, or the survey) and the updates need it.
## With automatic_restarts false (the default) it installs the updates and tells you which servers
## still need a restart; a person restarts them.
# automatic_restarts: false

# ---- site_findings - usually in all.yml ----------------------------------------------------------
## A host that cannot be reached (switched off, no network, ssh or WinRM refused, its login refused)
## in the health checks, the certificate report and renewal, database health, the service watch and
## troubleshoot: listed as NOT REACHED and left out, and the job is not failed for it. It still
## counts as checked-for, so the ServiceNow step opens its "no result" ticket. When NO host is
## reached (a wrong or expired machine credential looks like this) the job fails. true = a host not
## reached fails the job, as before. Patching, fixes, deploys and the Windows connection test always
## fail for it.
# site_unreachable_fails: false

## ---- Linux or Windows (set by the playbook; do not set) -----------------------------------------
## Linux playbooks run the roles check_<name>, the Windows ones (win_*.yml) the roles
## win_check_<name>.
# site_os: linux

## A notice in the job output when a project settings file (playbooks/group_vars/*.yml) defines a
## setting: it wins over AAP's inventory Variables box. false = no notice.
# site_settings_notice: true
