# ==================================================================================================
# Variables for the job template "Windows certificate renewal - CSRs"
#   playbook:    playbooks/win_cert_renew_csr.yml
#   credentials: Machine (Windows), ServiceNow API
#
# HOW TO USE: copy this file into the template's Variables box (YAML selected).
#   - A setting starting with "# " is switched off. To use it, delete the "# " in front of its
#     line (and of the indented lines under it), then change the value. Lines starting with
#     "## " say what the setting below them does.
#   - Switch on only what you change: a value here beats the same setting everywhere else,
#     including playbooks/group_vars/all.yml. The values shown are the defaults.
#   - The settings under "usually in all.yml" apply to every job: set them once there.
#   - Every setting, in full: docs/VARIABLES_REFERENCE.md (the Settings Reference PDF).
# GENERATED by scripts/gen_template_vars.py from roles/*/defaults/main.yml - do not edit here.
# ==================================================================================================
---
servicenow_assignment_group: YOUR GROUP NAME   # who gets a ticket this job opens (a certificate with no ticket yet)

# ---- win_check_certs -----------------------------------------------------------------------------
## a certificate expiring within this many days -> warning (amber in the certificate report)
# win_check_certs_warn_days: 30

## the certificate report colours these blue (an early heads-up; not a finding)
# win_check_certs_notice_days: 60

## within this many days -> critical
# win_check_certs_crit_days: 7

## an expired certificate NOT in use is a finding for this many days after it expired; older ones
## only in the report
# win_check_certs_expired_report_days: 30

## the machine certificate stores read
# win_check_certs_stores: ['Cert:\LocalMachine\My', 'Cert:\LocalMachine\WebHosting', 'Cert:\LocalMachine\Remote Desktop']

## also every other machine store: Trusted Root, Intermediate CAs, Other People, ... (the
## certificate report turns it on); with its private key checked as above, without it only listed
## (trust store)
# win_check_certs_trust: false

## stores never read: the untrusted certificates, the roots Windows Update keeps, pending requests
## (a CSR's key), the MECM client's own
# win_check_certs_trust_skip_stores: ['Disallowed', 'AuthRoot', 'REQUEST', 'SMS']

## false = Remote Desktop's certificates are left out of the report and the renewal (Windows or the
## GPO renews them): the Remote Desktop store, the one RDP uses, those for Remote Desktop only; true
## = checked like the others
# win_check_certs_remote_desktop: false

## wildcards, e.g. ['CN=localhost*']
# win_check_certs_ignore_subjects: []

## TLS services whose certificate a client actually gets, e.g. win_check_certs_endpoints: - {name:
## IIS, host: 127.0.0.1, port: 443, servername: web01.yoursite.mil}
# win_check_certs_endpoints: []

## ---- Renewal: a new key and CSR for each certificate that expires soon
## (playbooks/win_cert_renew_csr.yml) ---- The certificates the Windows certificate report flags
## (within win_check_certs_warn_days, or expired) that are the server's own - not a trust store's -
## get a new key and a CSR with the same subject, names and purposes (certreq -new -machine). The
## CSR goes on the certificate's ServiceNow ticket, as for Linux; the key stays on the server in the
## pending request until certreq -accept -machine installs the issued certificate. Never: CA
## certificates, self-signed ones (unless win_cert_renew_self_signed), a certificate only served on
## a port (win_check_certs_endpoints: its store is not known). cert_renew_skip_hosts /
## cert_renew_skip_groups, cert_renew_attach_ext / _type / _retry_txt apply to Windows too. the CSRs
## and their .inf / .json, on the server (administrators and SYSTEM only); the key is not here: it
## is in the machine key store
# win_cert_renew_dir: 'C:\ProgramData\site-automation\renew'

## RSA key size, at least 2048 (a bigger old key keeps its size; an EC certificate gets a new key on
## the same curve)
# win_cert_renew_key_bits: 2048

## the CSR's signature: sha256, sha384 or sha512
# win_cert_renew_digest: sha256

## at most this many NEW CSRs per server in one run (the rest come the next run)
# win_cert_renew_max: 10

## true = a self-signed certificate gets a CSR too, for the PKI to issue a real one in its place
## (never one only for localhost)
# win_cert_renew_self_signed: false

## regular expression: only certificates whose issuer matches (empty = any CA), e.g. 'O=U\.S\.
## Government'
# win_cert_renew_issuer: ''

## regular expression: certificates whose issuer matches are never renewed here (renewed by their
## own tool)
# win_cert_renew_exclude_issuer: ''

## regular expression on the certificate's place, e.g. 'used by https' (empty = every one)
# win_cert_renew_only: ''

## true = the new key can be exported (to move it to another server); false keeps it on this one
# win_cert_renew_exportable: false

# ---- servicenow ----------------------------------------------------------------------------------
## the table tickets are opened in (incident)
# servicenow_table: incident

## user name; empty = the API account
# servicenow_caller: ""

## e.g. Software
# servicenow_category: ""

## a new ticket's urgency, per finding severity (your instance's values)
# servicenow_urgency: {critical: "1", warning: "2"}

## a new ticket's impact, per finding severity
# servicenow_impact: {critical: "2", warning: "3"}

## set Configuration item = the host name (must exist in the CMDB)
# servicenow_set_ci: true

## More fields for every new ticket - for an instance that makes fields such as Location,
## Subcategory or Channel mandatory: {column name: value}. Names and choice labels work, e.g.
## servicenow_fields: {location: "Building 100", subcategory: "Operating System", contact_type:
## "Self-service"} A field's column name: right-click its label on the form > Show - '<column
## name>'.
# servicenow_fields: {}

## Every ticket from these playbooks carries a correlation ID starting with this, so the same
## problem on the same host always updates the same ticket.
# servicenow_correlation_prefix: site-health

## check the instance's HTTPS certificate (see servicenow_ca_path)
# servicenow_validate_certs: true

## A CA bundle (PEM) for the instance's TLS certificate, when the execution environment does not
## trust its CA (e.g. a DoD root CA): a path on the controller, such as a file you add to the
## project: servicenow_ca_path: "{{ playbook_dir }}/files/ca/servicenow-ca.pem". Empty = the
## execution environment's normal trust store. Prefer this over servicenow_validate_certs: false.
# servicenow_ca_path: ""

## seconds for one API request
# servicenow_timeout: 30

## How the CSRs the certificate renewals make (Linux, Windows, VMware, network devices) go to the
## PKI. incident: each one is attached to its certificate's incident, with a work note saying what
## to do next - a person submits it to the PKI. catalog: each one is ordered from your PKI's catalog
## item (cert_renew_catalog_item) - one request per certificate, the CSR in the item's attachment
## question; no incident. Set the item's questions below: the "ServiceNow - catalog test" job lists
## them. docs/CERT_RENEWAL_CATALOG.md
# cert_renew_servicenow: incident

## The catalog item: its name exactly as the catalog shows it (e.g. "DoD PKI Certificate Request"),
## or its sys_id.
# cert_renew_catalog_item: ""

## The item's questions - by their internal names, as the catalog test lists them - and the answers:
## {name: answer}. A reference (Requested For, Location ...): the record's name, or its sys_id. A
## choice: its value or its label. In an answer, {host}, {subject}, {names}, {expires}, {issuer} and
## {where} become the certificate's. e.g. {requested_for: svc_aap_sn, preferred_contact: Email,
## location: "Building 100"}
# cert_renew_catalog_variables: {}

## The attachment question that gets the CSR (its internal name). Empty = the item's only attachment
## question.
# cert_renew_catalog_csr_variable: ""

## A question that gets the certificate's names (subjectAltName), e.g. a "List any additional SANs"
## box. Empty = none.
# cert_renew_catalog_names_variable: ""

## A request closed in one of these states (a requested item's: 4 Closed Incomplete, 7 Closed
## Skipped - rejected or cancelled) is ordered again on the next run. In any other state - open, in
## progress, Closed Complete (the PKI issued it: install it) - the certificate is not ordered again.
# cert_renew_catalog_reorder_states: ["4", "7"]

## Where the CSR is uploaded before the order, for the attachment question (ServiceNow moves it to
## the request).
# cert_renew_catalog_upload_table: ZZ_YYsc_cart_item

# ---- check_certs ---------------------------------------------------------------------------------
## Hosts whose certificates are renewed by hand (IdM, AAP ...): in the certificate report and its
## tickets as usual - each ticket says it is renewed by hand - but the renewal makes no CSR for them
## (listed, with why). The same forms as cert_skip_hosts / cert_skip_groups (which leave a host out
## of the report too). e.g. [idm01, 'aap*'], or 'idm01, aap*'
# cert_renew_skip_hosts: []

## e.g. [idm]
# cert_renew_skip_groups: []

## What to do with the issued certificate when something else deploys the file (a copy by hand would
## be overwritten): the start of the file's path -> the next step written on the ticket instead of
## "install it in place of the file". Add your own.
# cert_renew_install_notes:
#   /etc/stigman/: >-
#     STIG Manager: put the issued certificate (with its chain) and the new key in the AAP credential
#     "TLS certificate", then run STIG Manager - deploy (it restarts only nginx). A file copied by hand
#     is overwritten by the next deploy.

## The CSR's attachment on the ticket: <common name>-<8 characters of the CSR's SHA-256>.<ext> (a
## new CSR, a new name). An instance that refuses .csr attachments (its allowed extensions, or
## "Invalid file type: text/plain"): txt names every CSR .txt from the start. Refused, it is tried
## again as .txt (cert_renew_attach_retry_txt); refused again, the CSR goes in the ticket's work
## note and the job fails, to be seen.
# cert_renew_attach_ext: csr

## the attachment's Content-Type (a CSR is Base64 text)
# cert_renew_attach_type: text/plain

## a refused attachment is tried again as <name>.txt (text/plain); false: straight to the work note
# cert_renew_attach_retry_txt: true

# ---- site_findings - usually in all.yml ----------------------------------------------------------
## A host that cannot be reached (switched off, no network, ssh or WinRM refused, its login refused)
## in the health checks, the certificate report and renewal, database health, the service watch and
## troubleshoot: listed as NOT REACHED and left out, and the job is not failed for it. It still
## counts as checked-for, so the ServiceNow step opens its "no result" ticket. When NO host is
## reached (a wrong or expired machine credential looks like this) the job fails. true = a host not
## reached fails the job, as before. Patching, fixes, deploys and the Windows connection test always
## fail for it.
# site_unreachable_fails: false

## ---- Linux or Windows (set by the playbook; do not set) -----------------------------------------
## Linux playbooks run the roles check_<name>, the Windows ones (win_*.yml) the roles
## win_check_<name>.
# site_os: linux

## check_ (Linux) or win_check_ (Windows): set by the playbook from site_os
# site_check_role_prefix: "{{ 'win_check_' if site_os == 'windows' else 'check_' }}"

## How a host is recognized as Windows: its connection, or its shell (Windows OpenSSH).
# site_windows_connections: [winrm, psrp, ansible.builtin.winrm, ansible.builtin.psrp]

## A notice in the job output when a project settings file (playbooks/group_vars/*.yml) defines a
## setting: it wins over AAP's inventory Variables box. false = no notice.
# site_settings_notice: true
