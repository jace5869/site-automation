# ---- win_patch -----------------------------------------------------------------------------------
## NO AUTOMATIC RESTARTS unless you say so: this playbook restarts a server only when
## automatic_restarts is true (the job template's Variables, or the survey) and the updates need it.
## With automatic_restarts false (the default) it installs the updates and tells you which servers
## still need a restart; a person restarts them.
# automatic_restarts: false

## How many servers are patched at the same time (1 = one by one: the rollout stops at the first
## server that fails). ONLY in the job template's Variables, a survey or the launch: Ansible picks
## the batch size before it reads all.yml or any group or host variables, so set there it does
## nothing.
# win_patch_serial: 1

## Servers in these groups are patched but NEVER restarted by this playbook (restart them by hand).
## Follows the Linux setting (patch_never_reboot_groups) when you set it, so ONE list covers both;
## the fallback is the Linux role's default (roles/patch/defaults/main.yml; tests/test_protection.py
## checks it).
# win_patch_never_reboot_groups: "{{ patch_never_reboot_groups | default(['aap', 'aap_hosts', 'sat', 'netapp', 'netapp_console_hosts']) }}"

## Servers in these groups are skipped entirely (e.g. servers patched only by hand).
# win_patch_never_patch_groups: "{{ patch_never_patch_groups | default(['no_patch', 'aap', 'aap_hosts', 'sat', 'netapp', 'netapp_console_hosts']) }}"

## ask the client to rescan and re-evaluate before installing
# win_patch_scan_first: true

## let that scan settle
# win_patch_scan_wait_sec: 120

## per round: download + install
# win_patch_timeout_min: 120

## how often to look at the progress
# win_patch_poll_sec: 30

## After a restart, look again: servicing-stack and cumulative updates often reveal more updates.
# win_patch_max_rounds: 2

## shutdown.exe /t
# win_patch_restart_delay_sec: 30

## how long the server may take to come back
# win_patch_restart_timeout_min: 30

## after the port answers again, before trying to log on
# win_patch_restart_settle_sec: 30

## between logon attempts after the restart
# win_patch_reconnect_pause_sec: 20

## After the restart, give delayed-start services this long before calling one missing.
# win_patch_services_grace_min: 5

## Automatic services that come and go on their own (wildcards); not compared before/after.
# win_patch_services_ignore: ['gupdate*', 'edgeupdate*', 'MicrosoftEdgeElevationService', 'GoogleUpdater*',
#                             'MapsBroker', 'RemoteRegistry', 'sppsvc', 'TrustedInstaller', 'BITS', 'wuauserv',
#                             'UsoSvc', 'WaaSMedicSvc', 'DoSvc', 'CDPSvc', 'CDPUserSvc_*', 'OneSyncSvc_*',
#                             'clr_optimization_*', 'ShellHWDetection', 'tiledatamodelsvc', 'WbioSrvc',
#                             'dmwappushservice', 'SysMain', 'TabletInputService', 'msiserver', 'Tssdis']

## Where AAP reaches WinRM, to see the server go down and come back during the restart
# win_patch_winrm_host: "{{ ansible_host | default(inventory_hostname) }}"

## its WinRM port (5986 = HTTPS)
# win_patch_winrm_port: "{{ ansible_port | default(5986) }}"

# ---- patch ---------------------------------------------------------------------------------------
## Hosts in these groups are patched but NEVER rebooted by this playbook (reboot them by hand, in a
## maintenance window). Add your own group names; the built-in protection below is on always.
# patch_never_reboot_groups: [aap, aap_hosts, sat, netapp, netapp_console_hosts]

## Hosts in these groups are skipped entirely (Satellite is upgraded with satellite-maintain, not
## dnf).
# patch_never_patch_groups: [no_patch, aap, aap_hosts, sat, netapp, netapp_console_hosts]

# ---- site_findings - usually in all.yml ----------------------------------------------------------
## ---- Linux or Windows (set by the playbook; do not set) -----------------------------------------
## Linux playbooks run the roles check_<name>, the Windows ones (win_*.yml) the roles
## win_check_<name>.
# site_os: linux

## A notice in the job output when a project settings file (playbooks/group_vars/*.yml) defines a
## setting: it wins over AAP's inventory Variables box. false = no notice.
# site_settings_notice: true
