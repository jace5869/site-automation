## Serialized (Concurrent jobs off). Runs on the AAP host (group aap_hosts, or target/Limit) as non-root ansible.
## Verifies a completed backup manifest and packages backup + inventory + SAME installer + custom EEs + collections + PDF.
# target: aap01.corp.example.mil

# ---- aap_backup ----------------------------------------------------------------------------------
## Non-root installation owner account on the AAP host (rootless podman and containerized installer
## owner).
# aap_backup_user: ansible

## Absolute path to the mounted backup destination on the AAP host (e.g. an NFS share). Never auto-
## picked.
# aap_backup_path: /mnt/ansible_backup

## Expected active mount point for aap_backup_path (empty = any real non-root mount; set e.g.
## /mnt/ansible_backup to enforce an exact mount).
# aap_backup_expected_mount: ""

## Expected mount source for aap_backup_path (empty = not checked; e.g.
## 192.0.2.50:/exports/aap_backup).
# aap_backup_expected_source: ""

## Allowed filesystem types for aap_backup_path (empty = any real non-pseudo filesystem, e.g. [nfs,
## nfs4, xfs, ext4]).
# aap_backup_expected_fstypes: []

## Allow aap_backup_path to sit on the root filesystem / (false refuses unmounted shares exposing an
## empty local folder on /).
# aap_backup_allow_root_fs: false

## Containerized AAP 2.7 installer directory on the AAP host (under the ansible user's home by
## default).
# aap_installer_dir: "/home/ansible/ansible-automation-platform-containerized-setup"

## Installer inventory filename inside aap_installer_dir, or an absolute path (empty = first
## existing of inventory, inventory-growth).
# aap_installer_inventory: ""

## Path or command name for ansible-playbook on the AAP host used to run the containerized installer
## backup.
# aap_installer_ansible_playbook_bin: "ansible-playbook"

## Explicit metadata file to read the exact AAP build and release from (empty = auto-read from
## installer dir and container labels).
# aap_backup_version_file: ""

## Manual exact AAP build/release string used only when automatic version detection is unavailable
## (empty = auto-detect required).
# aap_backup_version_override: ""

## Mount table file read for mount verification and target discovery (/proc/self/mountinfo on
## Linux).
# aap_backup_mountinfo_path: "/proc/self/mountinfo"

## Podman executable name or path on the AAP host (used for version labels and custom EE image
## exports).
# aap_backup_podman_bin: "podman"

## ---- Air-gap bundle (1.142.0, playbooks/aap_backup_bundle.yml) ------------------------------
## Completed backup ID to package into an air-gap bundle (empty = latest verified backup from
## backups/latest.json).
# aap_backup_bundle_id: ""

## Path to the exact-same-build offline AAP 2.7 containerized setup bundle tarball (with bundle/
## images) on the AAP host (empty = search search_dirs or pack offline aap_installer_dir).
# aap_backup_installer_bundle: ""

## Directories searched for the original AAP setup bundle .tar.gz when aap_backup_installer_bundle
## is empty (empty = ansible user's home).
# aap_backup_installer_bundle_search_dirs: []

## Extra files or folders (relative to aap_installer_dir or absolute) to include in
## installer/extras/ inside the bundle (e.g. group_vars, CA certs).
# aap_backup_bundle_extra_files: []

## Explicit custom execution environment image references to export with podman save (always
## exported when listed; missing image stops with SA-AAPBK-14).
# aap_backup_ee_images: []

## Auto-discover custom EE images in local podman storage matching aap_backup_ee_image_patterns.
# aap_backup_ee_auto_discover: true

## Wildcard patterns matched against local podman image names when aap_backup_ee_auto_discover is
## true.
# aap_backup_ee_image_patterns: ["*site-ee*", "*ee-*", "*-ee*"]

## Wildcard patterns excluded from auto-discovered EE images (platform runtime containers; explicit
## aap_backup_ee_images always win).
# aap_backup_ee_exclude_patterns:
#   - "*automation-controller*"
#   - "*automation-gateway*"
#   - "*automation-hub*"
#   - "*automation-eda*"
#   - "*postgresql*"
#   - "*redis*"
#   - "*receptor*"
#   - "*de-minimal*"
#   - "*ee-minimal*"

## Fail with SA-AAPBK-14 if zero custom EE images are found to export (false = warn and continue
## when no custom EEs exist yet).
# aap_backup_ee_require_at_least_one: false

## Directories containing Ansible collection .tar.gz archives or ansible_collections/ trees to carry
## in the air-gap bundle.
# aap_backup_collections_dirs: []

## Auto-discover collections under aap_installer_dir/collections and ~ansible/.ansible/collections
## when present.
# aap_backup_collections_auto_discover: true

## Copy the printable restore runbook PDF (Site-Automation-AAP-Backup-Restore-Guide.pdf) into docs/
## inside the air-gap bundle.
# aap_backup_bundle_include_runbook: true

## Path on the AAP host to an existing restore runbook PDF (empty = staged from the repository's
## guides/ folder when available).
# aap_backup_bundle_runbook_path: ""

## Pack the verified air-gap bundle directory into one .tar archive with a .tar.sha256 sidecar
## checksum file.
# aap_backup_bundle_archive: true

## Keep the unpacked bundle directory alongside the .tar archive after archive verification
## succeeds.
# aap_backup_bundle_keep_dir: false

## Extra free-space margin percentage added on top of estimated bundle size before bundling.
# aap_backup_bundle_overhead_pct: 15

# ---- site_exclude --------------------------------------------------------------------------------
## ---- Leave hosts out of every job (1.67.0; playbooks/site_exclude.yml, README "Leave hosts out of
## every job") Hosts no job runs on or connects to, whatever its template, Limit or target: the
## first play of every playbook that runs on hosts takes them out before the first connection. Each
## report says so in one line at its end ("Left out by site_exclude_hosts: ..."); a host left out is
## never a finding and never "not reached". The VMware and Horizon jobs also leave out the VMs and
## ESXi hosts named here (and keep their own lists). Set them in all.yml. names: whole, or short
## either way (web01 = web01.example.mil); * and ?; any case
# site_exclude_hosts: []
