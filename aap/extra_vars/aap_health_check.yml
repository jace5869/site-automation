# aap_health_db_host_groups_warn: 100

## a table with more dead rows than this (and 20% of its live ones): WARN (autovacuum behind)
# aap_health_db_dead_min: 10000

## ansible_facts per host, average
# aap_health_db_facts_avg_warn_kb: 100

## the database larger: WARN
# aap_health_db_size_warn_gb: 50

## of max_connections
# aap_health_db_conn_warn_pct: 80

## at or above: FAIL
# aap_health_db_conn_fail_pct: 95

## a query running longer: WARN (aap_health_db_long_fail_s: FAIL)
# aap_health_db_long_s: 30

## a query running longer: FAIL
# aap_health_db_long_fail_s: 300

## idle in transaction longer: WARN
# aap_health_db_idle_tx_s: 60

## job event rows (estimate) above: WARN
# aap_health_db_jobevent_warn: 20000000

