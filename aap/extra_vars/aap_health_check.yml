## Read-only. The inventory with your AAP host: it runs on the group aap_hosts, or set target (or a Limit) to its name
# target: aap01.yoursite.mil
# aap_health_focus_inventories: [8]                # these inventories always reported (db and api)
# aap_url: https://aap01.yoursite.mil              # when the gateway refuses https://localhost

# ---- aap_health ----------------------------------------------------------------------------------
## The account the AAP containers run as (rootless podman, systemd --user units).
# aap_health_user: ansible

## The installer's inventory file (DB name and user, certificate paths are read from it). Empty =
## found by name (aap_health_inventory_name) in that account's home, at most
## aap_health_inventory_depth folders down.
# aap_health_inventory_file: ""

## the installer inventory file name looked for
# aap_health_inventory_name: inventory-growth

## how many folders down from the home it is looked for
# aap_health_inventory_depth: 2

## The systemd user units that make up AAP (each runs the container of its name, or the --name in
## the unit).
# aap_health_unit_regex: '^(automation-.*|postgresql.*|redis.*|receptor.*)\.service$'

## seconds any one command may take (podman, psql, ausearch...) before it is given up
# aap_health_cmd_timeout: 60

## the API login (an AAP administrator or auditor); vault it
# aap_username: "{{ lookup('ansible.builtin.env', 'CONTROLLER_USERNAME') or lookup('ansible.builtin.env', 'AAP_USERNAME') }}"

## its password; vault it
# aap_password: "{{ lookup('ansible.builtin.env', 'CONTROLLER_PASSWORD') or lookup('ansible.builtin.env', 'AAP_PASSWORD') }}"

## an API token instead of the username and password (sent as a Bearer token)
# aap_token: "{{ lookup('ansible.builtin.env', 'CONTROLLER_OAUTH_TOKEN') or lookup('ansible.builtin.env', 'AAP_TOKEN') }}"

## Check the gateway's HTTPS certificate. Its own setting, not aap_validate_certs: an AAP credential
## on the template sets that one (its "Verify SSL"), and a certificate never names localhost - with
## aap_url https://localhost it can only fail.
# aap_health_validate_certs: false

## seconds for one API call
# aap_health_api_timeout: 60

## an inventory's hosts/?page_size=100 slower than this (or not 200): FAIL
# aap_health_api_slow_s: 5

## inventory IDs whose hosts page is timed; [] = every inventory (up to aap_health_api_time_max)
# aap_health_api_time_inventories: []

## inventories timed at most
# aap_health_api_time_max: 50

## the smallest requests (ping, me, config) slower than this: WARN
# aap_health_api_light_warn_s: 1.0

## slower than this (or not 200): FAIL
# aap_health_api_light_fail_s: 5.0

## pending or waiting longer: FAIL
# aap_health_stuck_minutes: 15

## running longer: WARN
# aap_health_running_hours: 4

## a cleanup system job (activity stream, job details) not run for longer: WARN
# aap_health_cleanup_max_days: 8

## an instance with less capacity left: WARN
# aap_health_capacity_warn_pct: 10

## an instance not seen for longer: WARN
# aap_health_last_seen_minutes: 10

## OS MemAvailable below: WARN
# aap_health_mem_warn_mb: 2048

## below: FAIL
# aap_health_mem_fail_mb: 1024

## swap used at or above: WARN
# aap_health_swap_warn_pct: 25

## at or above: FAIL
# aap_health_swap_fail_pct: 75

## 5-minute load per CPU
# aap_health_load_warn: 1.0

## at or above: FAIL
# aap_health_load_fail: 2.0

## space and inodes
# aap_health_disk_warn_pct: 80

## at or above: FAIL
# aap_health_disk_fail_pct: 90

## also the podman storage and the postgres data folder, found on the host
# aap_health_disk_paths: [/, /home, /var, /tmp]

## clock offset (chronyc tracking)
# aap_health_time_warn_s: 1.0

## at or above (or not synchronised): FAIL
# aap_health_time_fail_s: 5.0

## SELinux users rootless podman works as
# aap_health_selinux_users_ok: [unconfined_u, staff_u, sysadm_u]

## a dnf transaction this recent, and fapolicyd denials today: WARN
# aap_health_dnf_recent_days: 7

## fapolicyd not running: INFO; true (a site that must run it) = FAIL
# aap_health_fapolicyd_required: false

## the host's name to resolve; empty = hostname -f
# aap_health_fqdn: ""

## Containers one container using more: WARN
# aap_health_container_mem_warn_mb: 4096

## one container using more: FAIL
# aap_health_container_mem_fail_mb: 8192

## a container up for less: WARN (restarted?)
# aap_health_min_uptime_minutes: 10

## restarts (podman or systemd) at or above: WARN
# aap_health_restart_warn: 3

## dangling images or volumes at or above: WARN
# aap_health_dangling_warn: 10

## Logs podman logs --since (2h, 30m, 1d)
# aap_health_log_since: 2h

## gateway proxy lines read at most (the last ones)
# aap_health_log_proxy_max_lines: 50000

## matching lines kept per container at most
# aap_health_log_match_max: 2000

## the proxy's access-log line, if not Envoy's default or JSON: named groups path, code, dur, up
# aap_health_envoy_regex: ""

## a proxied request slower than this (upstream time): listed
# aap_health_slow_ms: 5000

## slowest requests listed
# aap_health_slow_max: 15

## 5xx responses in the window at or above: FAIL (any: WARN)
# aap_health_5xx_fail: 20

## controller-web: name -> regex (case counts; awk-compatible)
# aap_health_log_web_patterns:
#   HARAKIRI: HARAKIRI
#   worker killed: worker [0-9]+ killed|killed.*worker|SIGKILL|signal 9
#   Traceback: Traceback
#   OperationalError: OperationalError
#   timeout: "[Tt]imeout|timed out"

## any of these: FAIL (others: WARN; a worker uWSGI only recycled: INFO)
# aap_health_log_web_fail: [HARAKIRI, worker killed]

## controller-task: name -> regex (all: WARN)
# aap_health_log_task_patterns:
#   dispatcher error: "(ERROR|Exception).*dispatch|dispatch.*(ERROR|Exception)"
#   callback receiver error: "(ERROR|Exception).*callback|callback.*(ERROR|Exception|[Ff]ailed)"
#   Traceback: Traceback

## the gateway, hub and EDA containers: lines logged at level ERROR, Tracebacks
# aap_health_log_other_patterns:
#   Traceback: Traceback
#   ERROR: '\[ERROR\]| ERROR |^ERROR|level=error'

## container names (regex) of the gateway proxy, controller web and task
# aap_health_proxy_match: gateway-proxy

## the controller web container
# aap_health_web_match: controller-web

## the controller task container
# aap_health_task_match: controller-task

## the containers whose Tracebacks and ERRORs are counted
# aap_health_other_log_match: '^automation-(gateway|hub|eda)'

## lines kept after each matching line (an ERROR's message is often on the next lines)
# aap_health_log_context_lines: 5

## the containers' ERRORs grouped by message: this many listed, with counts
# aap_health_log_error_groups: 5

## as root (become; quietly skipped without it): the kernel's OOM kills in the last 2 h
# aap_health_log_oom_journal: true

## an OOM-killed process matching this (regex) makes controller-web FAIL
# aap_health_log_oom_match: uwsgi

