## host variables per inventory: average / largest host
# aap_health_db_vars_avg_warn_kb: 10

## average above: FAIL
# aap_health_db_vars_avg_fail_kb: 50

## the largest host above: WARN
# aap_health_db_vars_max_warn_kb: 100

## above: FAIL
# aap_health_db_vars_max_fail_kb: 500

## job host summaries of one host above (the Hosts list reads each host's recent jobs): WARN
# aap_health_db_host_jobs_warn: 5000

## groups one host is in, above: WARN (an inventory source's keyed groups can put a host in
