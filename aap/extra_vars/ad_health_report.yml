# ---- ad_report -----------------------------------------------------------------------------------
## ---- Mode (1.4.0) -------------------------------------------------------------------------------
## admin: a PowerShell script on every DC over WinRM (an account that may log on to the DCs, Domain
## Admins). reader: no WinRM - read from the AAP side over LDAP, DNS and Kerberos as a plain domain
## user with nothing granted; dcdiag, repadmin, services, SYSVOL, disks and events are not run
## (docs/ACTIVE_DIRECTORY.md, "Without a domain admin"). auto: admin when a DC of the inventory can
## be reached over WinRM with the credential, else reader.
# ad_health_mode: auto

## ---- Reader mode -------------------------------------------------------------------------------
## the AD domain's DNS name ("" = learned: the DCs' names, their ansible_host, their rootDSE, the
## EE's DNS search domain)
# ad_reader_domain: ""

## "" = the job's Machine credential (UPN svc@CORP.EXAMPLE.MIL, CORP\svc, or a DN)
# ad_reader_user: ""

## "" = the Machine credential's (a simple bind over LDAPS, else StartTLS on 389 - never in clear)
# ad_reader_password: ""

## the LDAPS / StartTLS certificate must be trusted and name the DC before the password is sent
# ad_reader_validate_certs: true

## a CA file ("" = what the execution environment trusts: ee/*/ca)
# ad_reader_ca_file: ""

## auto: a TGT from each KDC with kinit (the Windows EE has it), else an AS-REQ; tgt; probe (AS-REQ
## only); off
# ad_reader_kerberos: auto

## DNS servers asked for the SRV and A records ([] = the execution environment's)
# ad_reader_dns_servers: []

## the ports the DCs answer on, and the DNS servers'
# ad_reader_ports: {ldap: 389, ldaps: 636, kerberos: 88, dns: 53}

## a DC reached at another address or port (NAT, a test): {dc01.corp.example.mil: {address:
## 192.0.2.11, ldaps: 636}}
# ad_reader_endpoints: {}

## seconds per connection
# ad_reader_timeout: 5

## a DC's clock against the others' (rootDSE currentTime) -> amber
# ad_reader_clock_warn_seconds: 120

## -> red (Kerberos fails at 5 minutes)
# ad_reader_clock_crit_seconds: 300

## The privileged groups' members of the last run, to say who joined or left since (on top of the
## replication metadata, when the account may read it): this template's previous job's artifact in
## AAP - needs the "Red Hat Ansible Automation Platform" credential on the template - or, with
## ad_reader_history_file set, that file (on the AAP side: see the docs).
# ad_reader_history: true

## e.g. /var/lib/site-health/ad-privileged-groups.json - "" = the AAP job artifact
# ad_reader_history_file: ""

## ---- Changes ------------------------------------------------------------------------------------
## the changes of the last this-many hours (match it to the schedule: a daily job = 24)
# ad_report_hours: 24

## the event log entries of the last this-many hours
# ad_event_hours: 24

## read each DC's Security log for WHO made a change (needs auditing of account and security group
## management)
# ad_security_events: true

## read at most this many entries per event log and DC
# ad_max_events: 2000

## look at most at this many changed objects per kind (created, changed accounts, GPO links)
# ad_changes_max: 500

## Privileged groups watched besides the built-in ones (Domain / Enterprise / Schema Admins,
## Administrators, Account / Server / Print / Backup Operators, Group Policy Creator Owners, Key
## Admins, Cert Publishers): names or SIDs of this domain's groups.
# ad_privileged_groups_extra: [DnsAdmins]

## privileged groups that must have no member, e.g. [Schema Admins] - amber when they have one
# ad_groups_should_be_empty: []

## a member added to / removed from a privileged group: critical, warning, low or info
# ad_privileged_change_severity: warning

## the schema version changed: critical, warning, low or info
# ad_schema_change_severity: warning

## a domain controller added or removed: critical, warning, low or info
# ad_dc_change_severity: info

## ---- What is read on each DC
## --------------------------------------------------------------------- dcdiag tests to skip
## (SystemLog fails on any error in the System log: the Events table covers it)
# ad_dcdiag_skip: [SystemLog]

## also dcdiag's DNS tests that only read (basic, forwarders, delegation, record registration)
# ad_dcdiag_dns: true

## verify outbound and two-way trusts (nltest /sc_verify)
# ad_trust_verify: true

## ---- Thresholds: at or above "warn" = amber, at or above "crit" = red
## ------------------------------ a replication link with no success for this long (inter-site
## schedules: keep above their interval)
# ad_repl_warn_hours: 6

## no success for this long (or a failing link) -> red
# ad_repl_crit_hours: 24

## replication requests waiting in a DC's inbound queue
# ad_repl_queue_warn: 50

## no success for this long -> Low in the replication matrix (one site link schedule missed; 0 = no
## Low)
# ad_repl_low_hours: 4

## ---- Replication matrix (1.63.0): DC x DC on the report website, the late links in the email,
## every link in the workbook ---- false = no replication matrix sections (the Inbound replication
## table stays)
# ad_repl_matrix: true

## more DCs than this: the matrix is site x site, each cell the worst link (12 fit 800 px)
# ad_repl_matrix_max_dcs: 12

## each site's worst replication age over this many days (a line on the website)
# ad_repl_trend_days: 14

## the trend from this template's earlier runs (AAP job history: the "Red Hat Ansible Automation
## Platform" credential)
# ad_repl_history: true

## how many earlier runs to read from AAP (at most 50: a daily job keeps 14 days with 14)
# ad_repl_history_runs: 50

## keep the points in the report database too, when the job template has a "Report database"
## credential; no credential = not used
# ad_repl_db: true

## make the table ad_repl_point on the first run; false = an admin makes it
## (docs/REPORT_DATABASE.md)
# ad_repl_db_create: true

## seconds to wait for the report database's connection
# ad_repl_db_timeout: 10

## delete the database's points older than this many days (0 = never)
# ad_repl_db_keep_days: 400

## a DC's clock against the PDC emulator (the PDC: against its NTP source)
# ad_time_warn_seconds: 5

## clock offset -> red (Kerberos fails at 300)
# ad_time_crit_seconds: 60

## Windows Time last synchronized longer ago than this
# ad_time_sync_warn_hours: 24

## free space of the database, log and SYSVOL volumes, % (at or below)
# ad_disk_warn_pct: 15

## free % -> red
# ad_disk_crit_pct: 5

## the LDAPS / KDC certificate expires within this many days
# ad_cert_warn_days: 30

## expires within this many days -> red
# ad_cert_crit_days: 7

## the last system-state backup of a partition is older than this
# ad_backup_warn_days: 7

## older than this -> red (always red past the tombstone lifetime)
# ad_backup_crit_days: 30

## the krbtgt password is older than this -> amber (the STIG asks for 180)
# ad_krbtgt_max_days: 180

## RID pool left, % (at or below)
# ad_rid_warn_pct: 10

## RID pool left -> red
# ad_rid_crit_pct: 2

## this many client addresses in no AD subnet -> amber (fewer: blue)
# ad_no_client_site_warn: 1

## rows per table (problems first); the job's artifacts have all
# ad_report_max_rows: 50

## The job stays green when it finds problems: the report and email say what. true = mark it FAILED
## when there is a critical finding or a DC could not be read, for workflows.
# ad_report_fail: false

# ---- site_email - usually in all.yml -------------------------------------------------------------
## Who gets it: a list, or text with commas / spaces / one per line (a survey answer). Empty = no
## email. Set it on each TEMPLATE (its Variables, or a survey): in all.yml every report job emails.
# report_email_to: []

## copied: a list, or text like report_email_to
# report_email_cc: []

## "Also email the report to": more people for one run, asked when the job is launched - a survey
## question (playbooks/aap_email_question.yml adds it to the report templates). Added to
## report_email_to, never in its place; empty = only report_email_to. A list, or text: addresses
## separated by commas, semicolons, spaces or one per line, or pasted from Outlook (Doe, Jane
## <jane.doe@yoursite.mil>; ...).
# report_email_also: []

## The domains an address in report_email_also may be in (a subdomain too), e.g. [yoursite.mil]; any
## other is listed in the job and gets no email. Empty = any domain (your mail relay may still
## refuse some).
# report_email_also_domains: []

## the sender, e.g. aap-noreply@yoursite.mil
# report_email_from: ""

## your mail relay, e.g. smtp.yoursite.mil
# report_email_smtp_host: ""

## 25 or 587 with starttls, 465 with ssl
# report_email_smtp_port: 25

## starttls = encrypt after connecting (the relay must offer it); ssl = encrypted from the start
## (port 465); none = not encrypted (only for a relay without encryption; then no login is sent).
# report_email_security: starttls

## a CA file that signed the relay's certificate (empty = the CAs the execution environment trusts)
# report_email_ca_path: ""

## put before every subject, e.g. "[AAP] Certificate report: ..."
# report_email_subject_prefix: "[AAP]"

## Which enclave this AAP serves: unclassified or classified; empty = found from the job's hosts -
