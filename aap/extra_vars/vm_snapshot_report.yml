# ==================================================================================================
# Variables for the job template "VM - snapshot report"
#   playbook:    playbooks/vm_snapshot_report.yml
#   credentials: VMware vCenter
#
# HOW TO USE: copy this file into the template's Variables box (YAML selected).
#   - A setting starting with "# " is switched off. To use it, delete the "# " in front of its
#     line (and of the indented lines under it), then change the value. Lines starting with
#     "## " say what the setting below them does.
#   - Switch on only what you change: a value here beats the same setting everywhere else,
#     including playbooks/group_vars/all.yml. The values shown are the defaults.
#   - The settings under "usually in all.yml" apply to every job: set them once there.
#   - Every setting, in full: docs/VARIABLES_REFERENCE.md (the Settings Reference PDF).
# GENERATED by scripts/gen_template_vars.py from roles/*/defaults/main.yml - do not edit here.
# ==================================================================================================
---
# ---- vmware_vm -----------------------------------------------------------------------------------
## only needed when the same VM name exists in two datacenters
# vmware_datacenter: ""

## Check vCenter's certificate. false only if the execution environment does not trust your CA yet.
# vmware_validate_certs: true

## Several vCenters (e.g. Enhanced Linked Mode), one report: the reports and the ESXi security
## settings read the credential's vCenter AND these (names, or name:port), with the same account.
## The same vCenter under two names is read once. docs/VMWARE.md, "Several vCenters". e.g.
## [vc01.yoursite.mil, vc02.yoursite.mil]
# vmware_vcenters: []

## true = the job shows failed when a vCenter could not be read (the report lists it in red either
## way)
# vmware_vcenter_fail_unread: false

## e.g. [AAP01, VCSA01, DC*] (* and ? allowed)
# vmware_protected_vms: []

## Snapshots at least this many days old: listed apart by the report, deleted by the cleanup.
# vm_snapshot_max_age_days: 5

## Never deleted by the cleanup (the report lists them, with the reason): - a snapshot whose name or
## description matches this
# vm_snapshot_keep_regex: '(?i)keep|do.?not.?delete'

## - a snapshot of these VMs: names, * and ? allowed (e.g. [DC*, VCSA01, AAP01]). The VMs in
## vmware_protected_vms and the AAP server are never cleaned up either.
# vm_snapshot_cleanup_exclude_vms: []

## - a snapshot of a VM in these vCenter datacenters: names, * and ? allowed, any case (e.g.
## [DRSITE])
# vm_snapshot_cleanup_exclude_datacenters: []

## - a snapshot of a VM running in these clusters: names, * and ? allowed, any case (e.g. [SQL*,
## MGMT*]). A VM on a host that is in no cluster is not matched.
# vm_snapshot_cleanup_exclude_clusters: []

## - with words here, a snapshot whose name contains none of them: only a name with one is deleted
## (any case; Patch also matches Patching and Patches - and dispatch). E.g. [Patching, Patches,
## Patch]: only the patching snapshots. [] = any name. Set it in all.yml, so the report lists the
## same.
# vm_snapshot_cleanup_name_words: []

## - a snapshot bigger than this many GB (1024 = 1 TB), or whose size cannot be read: merging a very
## big snapshot can take hours and slow the VM - do those by hand, at a quiet time.
# vm_snapshot_cleanup_max_size_gb: 1024

# ---- site_email - usually in all.yml -------------------------------------------------------------
## Who gets it: a list, or text with commas / spaces / one per line (a survey answer). Empty = no
## email. Set it on each TEMPLATE (its Variables, or a survey): in all.yml every report job emails.
# report_email_to: []

## copied: a list, or text like report_email_to
# report_email_cc: []

## the sender, e.g. aap-noreply@yoursite.mil
# report_email_from: ""

## your mail relay, e.g. smtp.yoursite.mil
# report_email_smtp_host: ""

## 25 or 587 with starttls, 465 with ssl
# report_email_smtp_port: 25

## starttls = encrypt after connecting (the relay must offer it); ssl = encrypted from the start
## (port 465); none = not encrypted (only for a relay without encryption; then no login is sent).
# report_email_security: starttls

## a CA file that signed the relay's certificate (empty = the CAs the execution environment trusts)
# report_email_ca_path: ""

## put before every subject, e.g. "[AAP] Certificate report: ..."
# report_email_subject_prefix: "[AAP]"

## Send a formatted (HTML) version too, for reports that come with one (all VMware jobs). The email
## always carries a plain-text copy for mail clients that do not show HTML. false = plain text only.
# report_email_html: true

## The look of the HTML version (docs/EMAIL_REPORTS.md, "The look"): standard = a header band in the
## report's colour (green, amber, red, blue) with number boxes under it; command = a dark header
## with your logo and report_email_header_text, the job's last runs as a strip of bars
## (report_history), the numbers in one row.
# report_email_theme: standard

## command: the small line above the title
# report_email_header_text: Site automation report

## Your logo in the header (both looks): a PNG, JPEG or GIF in your repository - a path from
## playbooks/ (files/report_logo.png = playbooks/files/report_logo.png) or a full path. Attached to
## each email, so keep it small: about 160 px tall, under 100 KB. Updating with scripts/update-from-
## release: list the file in .site-local, or the update deletes it.
# report_logo_file: ""

## pixels in the email (its width follows)
# report_logo_height: 84

## command: the job's last runs, read from AAP - attach a "Red Hat Ansible Automation Platform"
## credential (a user with at least Read on the template) to the template; without it the email goes
## out without the strip.
# report_history: true

## bars in the strip, this run included
# report_history_runs: 14

## a CA file for AAP's own HTTPS certificate ("" = what the execution environment trusts)
# report_history_aap_ca_path: ""

## Your own look instead: copy roles/site_email/templates/report.html.j2 (or report_command.html.j2)
## to e.g. playbooks/files/email/report.html.j2, change it, and set report_email_html_template: "{{
## playbook_dir }}/files/email/report.html.j2" report.html.j2 (the default) = the look
## report_email_theme picks.
# report_email_html_template: report.html.j2
