# ---- win_check_certs -----------------------------------------------------------------------------
## ---- Renewal: a new key and CSR for each certificate that expires soon
## (playbooks/win_cert_renew_csr.yml) ---- The certificates the Windows certificate report flags
## (within win_check_certs_warn_days, or expired) that are the server's own - not a trust store's -
## get a new key and a CSR with the same subject, names and purposes (certreq -new -machine). The
## CSR goes on the certificate's ServiceNow ticket, as for Linux; the key stays on the server in the
## pending request until certreq -accept -machine installs the issued certificate. Never: CA
## certificates, self-signed ones (unless win_cert_renew_self_signed), a certificate only served on
## a port (win_check_certs_endpoints: its store is not known). cert_renew_skip_hosts /
## cert_renew_skip_groups, cert_renew_attach_ext / _type / _retry_txt apply to Windows too. the CSRs
## and their .inf / .json, on the server (administrators and SYSTEM only); the key is not here: it
## is in the machine key store
# win_cert_renew_dir: 'C:\ProgramData\site-automation\renew'

