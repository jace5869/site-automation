## Read-only; the job stays green. Its limits are disk_report_warn_pct / disk_report_crit_pct (85, 90; in the
## check_disk part below), not check_disk_warn_pct / check_disk_crit_pct (the health check's)

# ---- check_disk ----------------------------------------------------------------------------------
## % used -> warning
# check_disk_warn_pct: 85

## % used -> critical
# check_disk_crit_pct: 95

## inodes: too many small files fill a disk too
# check_disk_inode_warn_pct: 85

## % of inodes used -> critical (warning from check_disk_inode_warn_pct)
# check_disk_inode_crit_pct: 95

## Different limits for particular mount points, e.g. keep the audit log partition emptier:
## check_disk_overrides: /var/log/audit: {warn: 70, crit: 85}
# check_disk_overrides: {}

## Mount points to skip (regular expressions).
# check_disk_ignore:
#   - '^/(proc|sys|dev|run)(/|$)'
#   - '^/etc/(hosts|hostname|resolv\.conf)$'   # bind-mounted files (containers)
#   - '^/var/lib/containers/storage/'

## filesystem types never checked (df -x)
# check_disk_exclude_types: [tmpfs, devtmpfs, squashfs, overlay, iso9660, efivarfs, nsfs]

## Days-until-full forecast. Each run adds a sample (date, bytes used) per mount to a small file on
## the host; once there is at least a day of history, the growth rate predicts when the filesystem
## fills. Check mode (a dry run) reads the history but does not add to it.
# check_disk_forecast: true

## full within this many days at the current growth -> warning
# check_disk_forecast_warn_days: 14

## full within this many days -> critical
# check_disk_forecast_crit_days: 3

## where the forecast keeps its samples, on the host
# check_disk_history_file: /var/lib/site-health/disk-history.json

## samples older than this are dropped (the forecast uses what is left)
# check_disk_history_keep_days: 30

## seconds for df
# check_disk_timeout: 20

## LVM: thin pools (data and metadata) and old-style snapshots, with the limits above
## (check_disk_warn_pct, check_disk_crit_pct); a snapshot that filled up (no longer valid) is
## critical. Volume groups' free space is listed in the disk space report, never a finding (a volume
## group with no free space is normal). Needs root (lvs, vgs).
# check_disk_lvm: true

## The disk space report (playbooks/disk_report.yml) - not the health check: warning and critical at
## (% used, space or inodes; LVM thin pools and snapshots too). The report sets check_disk_warn_pct
## / check_disk_crit_pct from them. % used -> warning, in the disk space report
# disk_report_warn_pct: 85

## % used -> critical, in the disk space report
# disk_report_crit_pct: 90

## true = every filesystem and thin pool in the tables, not only the full ones
# disk_report_all: false

# ---- tmp_cleanup ---------------------------------------------------------------------------------
## TMP CLEANUP: the old files in the tmp folders - measured by the disk space report on a host whose
## filesystem is full, deleted by "Linux - tmp cleanup" after the approval (workflow 42). Old =
## accessed, changed and modified more than days ago (as systemd-tmpfiles ages them; 10 days for
## /tmp and 30 for /var/tmp are its own defaults). Only regular files, only on the folder's own
## filesystem, never under a name in tmp_cleanup_keep; then the folders left empty. Each path's last
## part must be tmp or end in .tmp, -tmp or _tmp (/opt/app/tmp), with no . or .. part: anything else
## stops the job before anything is read.
# tmp_cleanup_dirs:
#   - {path: /tmp, days: 10}
#   - {path: /var/tmp, days: 30}

## Never touched (names, * and ? allowed), wherever they are under a tmp folder: what systemd, X,
## ssh, Kerberos and the databases keep there while they run.
# tmp_cleanup_keep:
#   - 'systemd-private-*'
#   - '.X11-unix'
#   - '.ICE-unix'
#   - '.XIM-unix'
#   - '.font-unix'
#   - '.Test-unix'
#   - 'krb5cc*'
#   - 'ssh-*'
#   - 'tmux-*'
#   - '.s.PGSQL*'
#   - 'mysql.sock*'
#   - 'tmp_clean.sh'

## seconds per folder
# tmp_cleanup_timeout: 600

# ---- site_email - usually in all.yml -------------------------------------------------------------
## Who gets it: a list, or text with commas / spaces / one per line (a survey answer). Empty = no
## email. Set it on each TEMPLATE (its Variables, or a survey): in all.yml every report job emails.
# report_email_to: []

## copied: a list, or text like report_email_to
# report_email_cc: []

## "Also email the report to": more people for one run, asked when the job is launched - a survey
## question (playbooks/aap_email_question.yml adds it to the report templates). Added to
## report_email_to, never in its place; empty = only report_email_to. A list, or text: addresses
## separated by commas, semicolons, spaces or one per line, or pasted from Outlook (Doe, Jane
## <jane.doe@yoursite.mil>; ...).
# report_email_also: []

## The domains an address in report_email_also may be in (a subdomain too), e.g. [yoursite.mil]; any
## other is listed in the job and gets no email. Empty = any domain (your mail relay may still
## refuse some).
# report_email_also_domains: []

## the sender, e.g. aap-noreply@yoursite.mil
# report_email_from: ""

## your mail relay, e.g. smtp.yoursite.mil
# report_email_smtp_host: ""

## 25 or 587 with starttls, 465 with ssl
# report_email_smtp_port: 25

## starttls = encrypt after connecting (the relay must offer it); ssl = encrypted from the start
## (port 465); none = not encrypted (only for a relay without encryption; then no login is sent).
# report_email_security: starttls

## a CA file that signed the relay's certificate (empty = the CAs the execution environment trusts)
# report_email_ca_path: ""

## put before every subject, e.g. "[AAP] Certificate report: ..."
# report_email_subject_prefix: "[AAP]"

## Which enclave this AAP serves: unclassified or classified; empty = found from the job's hosts -
## classified when a target host's name or address (inventory_hostname, ansible_host) ends in one of
## site_enclave_classified_domains, else unclassified. site_enclave, when set, always wins.
# site_enclave: ""

## DNS suffixes of the classified enclave, e.g. [classified.example.mil]; [] = never found
## classified from the hosts.
# site_enclave_classified_domains: []

## The banner at the top and bottom of every report: each email look and the plain text (its first
## and last line), every report website page and the index, the ticket insights pages, print, and
## the first row of each workbook sheet. auto = on in the classified enclave (site_enclave), off in
## the unclassified; true / false = always / never.
# report_banner: auto

## the banner's text, e.g. SECRET, SECRET//NOFORN, UNCLASSIFIED, CUI
# report_banner_text: SECRET

## The banner's colour (#rrggbb); empty = the standard colour of the text: UNCLASSIFIED green, CUI
## purple, CONFIDENTIAL blue, SECRET red, TOP SECRET orange; the text black or white, whichever
## reads 4.5:1 or better.
# report_banner_color: ""

## with the banner on: "(SECRET) " before the email subject (and the prefix)
# report_banner_subject: true

## Send a formatted (HTML) version too, for reports that come with one (all VMware jobs). The email
## always carries a plain-text copy for mail clients that do not show HTML. false = plain text only.
# report_email_html: true

## Attach the report's tables to the email as an Excel workbook (.xlsx): a sheet per table. Some
## reports attach their own whatever this says (VM - inventory report: every VM on one sheet). The
