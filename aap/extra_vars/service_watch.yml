# ---- service_watch -------------------------------------------------------------------------------
## ---- What to watch ----------------------------------------------------------------------- With
## watch_discover on (the default), service watch finds the containers itself: every podman
## container on the host that SHOULD be running - root's (rootful) and each user's (rootless) - as
## the Health check `containers` finds them (roles/podman_discover: a systemd unit that starts it at
## boot - a Quadlet file with an [Install] section, or an enabled unit - or a restart policy of
## always / unless-stopped). The podman_discover_* settings (which users, which containers to leave
## out) apply here too. false = watch only the watch_containers list below.
# watch_discover: true

## Containers to watch in any case, in dependency order (a container's dependencies first). They are
## watched before the discovered ones, and one that is missing is reported as down. name: the
## container name, as `podman ps -a` shows it (or its Quadlet / service name) user: optional: the
## user that owns it (rootless podman). Without it: root's container. url: optional page to check as
## well, e.g. https://127.0.0.1/ unit: optional: the systemd unit that runs the container. Normally
## found by itself (below). e.g. [{name: mysql}, {name: stigman, url: "https://127.0.0.1/"}, {name:
## web, user: alice}]
# watch_containers: []

## HTTP codes that count as "answering"
# watch_url_ok_status: [200, 301, 302, 401, 403]

## ---- How each container is run (found by itself) ------------------------------------------- A
## container that a systemd unit runs (a Quadlet .container file, `podman generate systemd`, or a
## unit you wrote) must be started with systemctl, never with `podman start`: the unit owns it, and
## while the unit is stopped the container usually does not exist at all (Quadlet removes it). For
## each container the role looks for its unit, in this order: `unit:` above; the container's
## PODMAN_SYSTEMD_UNIT label; a Quadlet file in watch_quadlet_dirs that names it (ContainerName=, or
## the default name systemd-<file name>); a unit NAME.service or container-NAME.service that runs
## podman. No unit: it is a plain podman container, started with `podman start NAME`. A user's
## container (rootless) is looked at AS that user, and its unit is a user unit: `runuser -u USER --
## env XDG_RUNTIME_DIR=/run/user/UID systemctl --user start UNIT`.
# watch_find_units: true

## where root's Quadlet files are looked for (to find the unit that runs a container)
# watch_quadlet_dirs: [/etc/containers/systemd, /usr/share/containers/systemd]

## ---- What happens when one is down -------------------------------------------------------
## approval: ACT only diagnoses. Its proposed fix waits for the AAP approval step, then
## service_fix_approved.yml runs exactly the approved command(s) - no model involved. When ACT
## proposes nothing (or cannot run), the standard fix is proposed instead: `systemctl start UNIT`
## for a container a unit runs, `podman start NAME` otherwise - for a user's container the same, run
## as that user: `runuser -u USER -- env XDG_RUNTIME_DIR=/run/user/UID systemctl --user start UNIT`.
## self-heal: ACT may start/restart the watched containers (through their units) by itself, and
## nothing else. Still down after that: the playbook runs the standard fix itself. Any other fix
## goes to a person, as in approval mode.
# watch_mode: approval

## re-checks after a fix (every watch_verify_delay seconds)
# watch_verify_retries: 6

## seconds between those re-checks
# watch_verify_delay: 5

## ---- Where incidents are recorded (on the host) ------------------------------------------ One
## JSON line per event, plus a syslog line (tag service-watch) that your log forwarding (Splunk,
## Elastic, rsyslog relay) picks up. AAP's job history keeps its own copy.
# watch_record_file: /var/log/service-watch/incidents.jsonl

## also send each incident to syslog (tag service-watch)
# watch_record_syslog: true

## ---- ACT settings --------------------------------------------------------------------------
## Which provider and model: site_act_provider / site_act_model / site_act_url / site_act_ca, the
## same settings every runbook uses (roles/site_act/defaults/main.yml). The key comes from the "ACT
## model key" AAP credential, never from here. Extra ACT settings for service watch only:
# watch_act_env: {}

## seconds for one ACT run (the model's time per answer: site_act_model_timeout)
# watch_act_timeout: 1200

## What ACT is told, on top of the act_triage role's standard instructions.
# watch_instructions: |-
#   The watched podman containers on this host, in dependency order (start earlier ones first).
#   Each one belongs to root (rootful podman) or to a user (rootless podman: only that user sees it,
#   and every podman or systemctl command for it runs as that user). Who owns each one, how it is
#   run, and the ONLY right way to start it:
#   {{ _watch_how_text }}
#   A container that a systemd unit runs must never be started with `podman start` or `podman run`:
#   the unit owns it, and while the unit is stopped the container usually does not exist at all
#   (Quadlet removes it), so "no such container" is normal then, not the problem.
#   For each finding, find the root cause with read-only commands. For a container of root:
#   `systemctl status UNIT --no-pager` and `journalctl -u UNIT --since -2h --no-pager` (for a
#   container a unit runs: why the unit stopped or failed),
#   `podman ps -a` (every container and its state),
#   `podman inspect NAME` (State: Status, ExitCode, FinishedAt, OOMKilled, Health),
#   `podman logs --tail 80 NAME` (its last output before it stopped),
#   `journalctl -t podman --since -2h --no-pager` (podman events, e.g. who stopped it and when),
#   and the logs of the containers it depends on if those look unhealthy.
#   {% if _watch_evidence_file | default('') %}For a container of a USER: commands run as another user (runuser -u ..., sudo -u ...)
#   are refused in this job, so do not try them. Their evidence was collected for you (podman
#   inspect State, podman logs, systemctl --user status and the user's journal): read it with
#   `cat {{ _watch_evidence_file }}`. `journalctl _UID=<uid> --since -2h --no-pager` also works.
#   {% endif %}Say whether it crashed, was stopped on purpose, or failed for another reason (configuration,
#   a dependency, a port, disk space). Quote the lines that show it.
#   Starting it again the right way (above) is the fix when it stopped or crashed and nothing else
#   is wrong. If a container it depends on is down, fix that one first. If the cause is something
#   a start cannot fix, say so and give the exact fix for a person to approve.
#   {% if _watch_mode | default(watch_mode) == 'self-heal' %}You may start or restart the watched containers yourself, with exactly the commands
#   above, and change nothing else: propose any other change, do not make it. Verify a container of
#   root with `podman inspect NAME` and expect_contains `"Running": true`; the playbook re-checks
#   every container itself afterwards.{% endif %}

# ---- podman_discover -----------------------------------------------------------------------------
## false = do not look for containers at all (the containers check then says "skipped", and Service
## watch watches only its watch_containers list).
# podman_discover_enabled: true

## Also look at the containers of users (rootless podman). A user is looked at when a podman process
## (conmon) runs as them, when they have "linger" on (/var/lib/systemd/linger/NAME), or when they
## are in /etc/subuid AND have container storage (~/.local/share/containers/storage). Their
## containers are read AS that user (runuser), and only when /run/user/UID exists - otherwise podman
## would create it (a change), so such a user is listed as "not checked" instead.
# podman_discover_rootless: true

## More users to look at (names), e.g. an application account the rules above miss.
# podman_discover_users: []

## Containers to leave out, as regular expressions that must match the WHOLE container name or
## OWNER/NAME, e.g. ['test-.*'] (every container whose name starts with test-, any owner),
## ['alice/.*'] (all of alice's containers), ['root/web'] (root's web only).
# podman_discover_ignore: []

## Where root's Quadlet files are (*.container). A user's are always read from
## ~/.config/containers/systemd, /etc/containers/systemd/users/UID and
## /etc/containers/systemd/users.
# podman_discover_quadlet_dirs: [/etc/containers/systemd, /usr/share/containers/systemd]

## Seconds one podman or systemctl call may take before it is given up (reported as a finding).
# podman_discover_timeout: 60

# ---- site_act - usually in all.yml ---------------------------------------------------------------
## ---- Which model ACT talks to -----------------------------------------------------------------
## site_act_provider genai GenAI.mil (the default) asksage Ask Sage (set site_act_url to your
## organization's instance) genai-beta the GenAI.mil beta proxy (preview models) site_act_models the
## model to use FOR EACH provider, e.g. {genai: gemini-3.8-flash, asksage: gpt-5.6-sol-gov} so the
## model follows whichever provider is picked. A provider not listed uses ACT's own default model.
## site_act_urls the API URL for each provider, e.g. {asksage:
## https://<host>/server/openai/v1/chat/completions}; a provider not listed uses ACT's default URL
## site_act_model one model for this run, whatever the provider (e.g. a survey answer); empty =
## site_act_models site_act_url one URL for this run; empty = site_act_urls site_act_ca a CA bundle
## file ON THE HOSTS for the provider's TLS certificate (internal/DoD CA); empty = the host's system
## trust store The API KEY never goes here: it comes from an AAP credential - "ACT model key" (GenAI
## and Ask Sage keys) or "ACT GenAI beta key". ACT runs ON EACH HOST, so the hosts must be able to
## reach the provider's URL (a proxy or firewall rule may be needed).
# site_act_provider: genai

## the model for each provider (see above): the model follows the provider picked
# site_act_models: {genai: gemini-3.8-flash, asksage: gpt-5.6-sol-gov}

## the API URL for each provider; a provider not listed uses ACT's default
# site_act_urls: {}

## one model for this run, whatever the provider (e.g. a survey answer); empty = site_act_models
# site_act_model: ""

## one URL for this run; empty = site_act_urls
# site_act_url: ""

## a CA bundle file ON THE HOSTS for the provider's certificate; empty = the host's trust store
# site_act_ca: ""

## Any other ACT environment settings (advanced; these win over the ones above), e.g. {HTTPS_PROXY:
## "http://proxy.yoursite.mil:8080"}. See the top of vendor/act/act for the list. Every ACT job
## streams the model's answer (ACT_STREAM=1), so a firewall or proxy idle timeout does not cut a
## long answer ("connection reset by peer"); {ACT_STREAM: "0"} here turns that off.
# site_act_env: {}

## Seconds the model may take for ONE answer, retries after a provider hiccup included (ACT's
## GENAI_TIMEOUT; ACT's own default, 90, is too short for a long analysis or a busy provider). Every
## ACT job uses it: the runbooks' use_act, the VMware alarms and capacity analyses, service watch.
# site_act_model_timeout: 600

## How many hosts may run ACT at the same time in one job (0 = no limit: as many as the job's
## forks). Every host in a job uses the same key, and GenAI.mil's default quota is 60 requests and
## 200,000 tokens a minute per key: a fleet run with many hosts at once gets HTTP 429 (too many
## requests).
# site_act_concurrency: 3
