## type stays the built-in's unless given). An action that is no action is an error; two actions
## that would run one template are an error. The deploy says "points at <name>" and whether AAP has
## it.
# portal_aap_names: {}

## 1.78.0: actions found in AAP, like a catalogue: a job template or workflow the portal's account
## has Execute on AND that carries the AAP label below is added to the portal - no edit here, no
## redeploy; take Execute or the label away and it goes at the next refresh. The form is the
## template's survey; the card's area is a label "portal-area:STIG" (else Other), its title the
## template's name, its line the description. the AAP label that marks a template for the portal (''
## = no discovery)
# portal_label: portal

## 1.92.0: a workflow step with this label too keeps its own card (a useful report alone)
# portal_label_alone: portal-alone

## a label that starts with this puts the card in an area (the rest of the label is its name)
# portal_label_area: "portal-area:"

