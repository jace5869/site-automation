---
## The workflow: this job --Run on fail--> Approval --Run on success--> VMware - certificate install - approved
## (docs/VMWARE.md, "Installing the issued certificates"). It reads only; it fails on purpose when one is ready.
## The request comes from the workflow's survey (vmware_cert_install_ritm: RITM0012345).

# ---- vmware_vm -----------------------------------------------------------------------------------
## Check vCenter's certificate. false only if the execution environment does not trust your CA yet.
# vmware_validate_certs: true

## Several vCenters (e.g. Enhanced Linked Mode), one report: the reports and the ESXi security
## settings read the credential's vCenter AND these (names, or name:port), with the same account.
## The same vCenter under two names is read once. docs/VMWARE.md, "Several vCenters". e.g.
## [vc01.yoursite.mil, vc02.yoursite.mil]
# vmware_vcenters: []

## true = the job shows failed when a vCenter could not be read (the report lists it in red either
## way)
# vmware_vcenter_fail_unread: false

## A certificate of vCenter (its Machine SSL certificate, the one its web pages show) or of an ESXi
## host that expires within this many days (or has expired) is due: a ServiceNow incident, and a CSR
## made where its key stays - vCenter, or the host - attached to the incident with what to do next.
## To try the job on certificates that are years from expiring, raise it for one run (e.g. 3650:
## every certificate is due) with vmware_cert_only naming one host, and vmware_cert_make_csr: false
## first. Each incident says the number used. Afterwards, a run with the real number notes those
## incidents as cleared (with servicenow_resolve_cleared: true, resolves them).
# vmware_cert_warn_days: 30

## within this many days (or expired) the incident is critical, else warning
# vmware_cert_crit_days: 7

## the ESXi hosts' certificates too; false = vCenter's only
# vmware_cert_esxi: true

## Only these vCenters and hosts: names, any case, * and ? allowed, the short name matches too -
## e.g. one host to try the job on. [] = every vCenter of the job and every host connected to it.
# vmware_cert_only: []

## A certificate signed by vCenter's own CA (VMCA - how vCenter gives ESXi hosts their certificates
## unless told otherwise) is renewed in vCenter (its Renew button): its incident says so, and no CSR
## is made. true = a CSR for those too, to replace them with certificates of your PKI.
# vmware_cert_vmca_csr: false

## Issuers taken as VMCA besides VMCA's own root (CN=CA with DC=..., or OU=VMware Engineering): any
## case, * and ? allowed, e.g. ['*O=vc01.yoursite.mil*'].
# vmware_cert_vmca_issuers: []

## The certificate the PKI put on the catalog request of a vCenter's or a host's CSR, installed
## where its key waits. A host's certificate: vCenter must trust its issuer, or it refuses the host
## after the replacement - the plan adds the CA chain (from the request) to vCenter's trusted roots
## when it is not there. false = do not read or add them (you know vCenter trusts the issuer, or its
## trusted roots cannot be read).
# vmware_cert_install_trust_check: true

## The request to install from: its number (RITM0012345) - the check reads that request alone, for
## the vCenter or host its CSR was made for (from the CSR's name), and hands it to the approval. The
## workflow's survey asks it.
# vmware_cert_install_ritm: ""

## true = without a request named, look up the request of every certificate of vCenter and its hosts
## (each by its CSR's name and expiry) - for a schedule on the workflow, once you trust it. false =
## a request must be named.
# vmware_cert_install_search: false

# ---- servicenow ----------------------------------------------------------------------------------
## check the instance's HTTPS certificate (see servicenow_ca_path)
# servicenow_validate_certs: true

## A CA bundle (PEM) for the instance's TLS certificate, when the execution environment does not
## trust its CA (e.g. a DoD root CA): a path on the controller, such as a file you add to the
## project: servicenow_ca_path: "{{ playbook_dir }}/files/ca/servicenow-ca.pem". Empty = the
## execution environment's normal trust store. Prefer this over servicenow_validate_certs: false.
# servicenow_ca_path: ""

## seconds for one API request
# servicenow_timeout: 30

## How the CSRs the certificate renewals make (Linux, Windows, VMware, network devices) go to the
## PKI. incident: each one is attached to its certificate's incident, with a work note saying what
## to do next - a person submits it to the PKI. catalog: each one is ordered from your PKI's catalog
## item (cert_renew_catalog_item) - one request per certificate, the CSR in the item's attachment
## question; no incident. Set the item's questions below: the "ServiceNow - catalog test" job lists
## them. docs/CERT_RENEWAL_CATALOG.md
# cert_renew_servicenow: incident

## A request closed in one of these states (a requested item's: 4 Closed Incomplete, 7 Closed
## Skipped - rejected or cancelled) is ordered again on the next run. In any other state - open, in
## progress, Closed Complete (the PKI issued it: install it) - the certificate is not ordered again.
# cert_renew_catalog_reorder_states: ["4", "7"]

## ---- Certificate install: the issued certificate, from its request (cert_install_check.yml,
## win_cert_install_check.yml) ---- The PKI puts the issued certificate on the request (RITM) that
## carries the CSR: attached to the RITM, to one of its attachment questions, to its REQ or to its
## catalog task (SCTASK) - one file or several, PEM, DER, PKCS7 (.p7b) or a zip of them - or pasted
## into a work note or comment of the RITM or its task. The job reads them all and takes the
## certificate whose public key is the CSR's; the CA certificates with it are its chain. Anything
## else there is listed, never used. the attachments read (their extension)
# cert_install_attachment_exts: [cer, crt, pem, der, p7b, p7c, p7, cert, zip, txt]

## a bigger attachment is not read
# cert_install_max_bytes: 1048576

## also look for a certificate pasted into the request's work notes and comments
# cert_install_journal: true

## the issued certificate must be valid at least this many more days (else held for a person)
# cert_install_min_days: 30

## true = install a certificate that lacks names (subjectAltName) the old one had; false = held for
## a person
# cert_install_fewer_names: false

## Linux and Windows: the request(s) to install from, named (the check templates' survey) -
## "RITM0012345", several with commas, or a list. Empty (the default) = each renewal's own catalog
## request, found by its CSR (cert_renew_servicenow: catalog). Named: only these requests are read,
## however they were opened - by hand, with the renewal's CSR pasted into the PKI's form, or after
## an incident - and the certificate there whose public key is a renewal's CSR (its key waits on the
## host since the renewal) is installed after the approval, as always. A renewal it has no
## certificate for is left waiting, counted in one line. (VMware: vmware_cert_install_ritm.)
# cert_install_ritm: ""

## A CA bundle in YOUR repository that completes the chain when the PKI sends back only the .cer -
## e.g. the DoD PKI's PKCS7 bundle from cyber.mil: files/dod_pki_bundle.p7b (playbooks/files/; the
## .p7b, DER or PEM, a .pem, or the zip as downloaded). Only the CAs that signed the certificate are
## taken from it - its issuing CA and that CA's root, each checked by its signature, none expired; a
## chain on the request comes first. Linux, Windows and VMware installs. Empty = the chain only from
## the request. Keeping it current: the job "PKI - DoD bundle check" (docs/CERT_INSTALL.md).
# cert_install_ca_bundle: ""
