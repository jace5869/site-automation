# ---- win_check_certs -----------------------------------------------------------------------------
## ---- Renewal: a new key and CSR for each certificate that expires soon
## (playbooks/win_cert_renew_csr.yml) ---- The certificates the Windows certificate report flags
## (within win_check_certs_warn_days, or expired) that are the server's own - not a trust store's -
## get a new key and a CSR with the same subject, names and purposes (certreq -new -machine). The
## CSR goes on the certificate's ServiceNow ticket, as for Linux; the key stays on the server in the
## pending request until certreq -accept -machine installs the issued certificate. Never: CA
## certificates, self-signed ones (unless win_cert_renew_self_signed), a certificate only served on
## a port (win_check_certs_endpoints: its store is not known). cert_renew_skip_hosts /
## cert_renew_skip_groups, cert_renew_attach_ext / _type / _retry_txt apply to Windows too. the CSRs
## and their .inf / .json, on the server (administrators and SYSTEM only); the key is not here: it
## is in the machine key store
# win_cert_renew_dir: 'C:\ProgramData\site-automation\renew'

## ---- Install: the issued certificate (playbooks/win_cert_install_check.yml -> approval ->
## playbooks/win_cert_install_approved.yml) ---- The PKI's certificate, from the request carrying
## the CSR (cert_renew_servicenow: catalog), is put together with its pending key by certreq -accept
## -machine (in Personal); its chain's intermediate CAs go into Intermediate Certification
## Authorities (never a root). Then each binding of the old certificate moves to it - the kinds
## listed here - and is read back; with full PowerShell the https ports are asked which certificate
## they serve. Anything wrong: the bindings go back to the old certificate, which stays in the store
## (a restore is a rebinding). The new key gets the old key's extra permissions (a service account),
## and NETWORK SERVICE for Remote Desktop. A person installs it, with the steps - when SQL Server
## uses it (a restart), a Central Certificate Store binding, the WinRM HTTPS listener AAP connects
## through. docs/CERT_INSTALL.md https: HTTP.sys bindings (IIS, WSUS ...); rdp: Remote Desktop;
## winrm: the WinRM HTTPS listener
# win_cert_install_rebind: [https, rdp, winrm]

## seconds an https port has, after the rebinding, to serve the new certificate (full PowerShell
## only)
# win_cert_install_verify_wait: 15

# ---- servicenow ----------------------------------------------------------------------------------
## check the instance's HTTPS certificate (see servicenow_ca_path)
# servicenow_validate_certs: true

## A CA bundle (PEM) for the instance's TLS certificate, when the execution environment does not
## trust its CA (e.g. a DoD root CA): a path on the controller, such as a file you add to the
## project: servicenow_ca_path: "{{ playbook_dir }}/files/ca/servicenow-ca.pem". Empty = the
## execution environment's normal trust store. Prefer this over servicenow_validate_certs: false.
# servicenow_ca_path: ""

## seconds for one API request
# servicenow_timeout: 30

