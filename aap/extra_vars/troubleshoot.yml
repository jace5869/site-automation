#   - {tab: Network and storage, match: ["Network*", "NetApp*", "ONTAP*", "Cisco UCS*", "UCS*", "SolarWinds*"]}
#   - {tab: Linux, match: ["Linux*", "Security*", "Health check*", "Troubleshoot*", "Patch*", "Database*", "Service watch*", "POA&M*", "STIG*", "Evaluate-STIG*",
#                          "Log analysis*", "fapolicyd*", "Apply approved*", "Mail relay*", "ACT - *", "Disk - *", "Service - *"]}
#   - {tab: ServiceNow and AAP, match: ["ServiceNow*", "AAP *", "Report website*", "Site portal*", "Workflow gate*"]}

## your own {names}, e.g. {site: "{{ site_code }}"} for "{site}/{template}/..."
# report_web_names: {}

## the report's data as .json beside each page and index.json beside the index
# report_web_json: true

## 1.79.8: a report's files (its attachments, its workbook) also on the website, as Download links
## (docs/WEB_REPORTS.md). false = none on the website (the email still attaches them)
# report_web_files: true

## each file, and one run's files together; a bigger one: not hosted, the page says why
# report_web_files_max_mb: 20

## the types hosted; any other: not hosted
# report_web_files_types: [.xml, .docx, .xlsx, .csv, .md, .txt, .pdf]

## every report's files together: past it, the oldest runs' go first (never a latest page's)
# report_web_files_total_max_mb: 500

## a run's files are removed after this many days - its page stays, and says so; 0 = never
# report_web_files_keep_days: 30

## 1.79.14: seconds a job waits for the index's lock (two jobs never write it at once); 0 = none
# report_web_index_lock_wait: 120

## A share (report_web_dest \\server\share\folder): how the job logs in, and the connection.
## negotiate (Kerberos - FIPS too: user@YOURDOMAIN.MIL, the server's full name - else NTLM), ntlm,
## or kerberos (a ticket already in the job)
# report_web_smb_auth: negotiate

## true = encrypt (SMB 3) even when the share does not require it; one that requires it is always
# report_web_smb_encrypt: false

## the share's port
# report_web_smb_port: 445

## a CA file for an https:// report_web_dest, or report_web_host's WinRM certificate ("" = what the
## EE trusts)
# report_web_ca_path: ""

## A share, an upload address or a folder that fails for a reason that passes (Kerberos "Message
## stream modified" while a file server's machine password changes, no KDC reached, a connection
## reset, a session gone, HTTP 503): tried again from a new login. A real error (password, access,
## no such share or folder) is not. Tries again this many times; 0 = none
# report_web_retries: 3

## seconds between two tries
# report_web_retry_delay: 30

## false = still not published after the retries: a warning, the email says so at the top, the job
## goes on; true = the job fails
# report_web_required: false

## Or on a Windows server (a file server, or the IIS server itself): report_web_host is that server,
## report_web_dest the folder on it (D:\reports, there already). The pages are made on the AAP side
## and written there over WinRM, in one PowerShell script per run (Constrained Language Mode too):
## nothing to mount, no WebDAV. The login: the "Report website" credential's user name and password,
## or - without it - the template's Machine credential; the account needs WinRM (Remote Management
## Users) and Modify on the folder. The connection, as your Windows inventory's: e.g.
## web01.yoursite.mil
# report_web_host: ""

## winrm or psrp
# report_web_host_connection: winrm

## WinRM: 5986 (https), 5985 (http)
# report_web_host_port: 5986

## https, or http (Kerberos and NTLM encrypt each message then)
# report_web_host_scheme: https

## ntlm, kerberos (Kerberos in the EE), credssp or basic
# report_web_host_transport: ntlm

## validate (the CA: report_web_ca_path) or ignore
# report_web_host_cert_validation: validate

## THE COPY JOB instead (docs/WEB_REPORTS.md, "The copy job"): for report templates whose execution
## environment cannot reach the web server (no WinRM or Kerberos in it). true = the report jobs
## write nothing there - each keeps its report in AAP (the job artifact site_report_page) and the
## one job template "Report website - copy" (playbooks/report_web_copy.yml), in an execution
## environment that reaches report_web_host, writes the pages there later, at the same address: the
## email's button and site_report_url point at it (there once the copy job has run). Set it in
## all.yml, with report_web_dest and report_web_url as above; the copy job uses them (and
## report_web_theme, the logo) too.
# report_web_copy: false

## the kept report's greatest size, packed (a bigger one: its longest tables cut, said on the page)
# report_web_copy_max_kb: 256

# ---- site_act - usually in all.yml ---------------------------------------------------------------
## ACT (GenAI) on top of ANY check playbook. The check roles already did the cheap, certain part:
## they found WHAT is wrong (site_findings) and know which read-only command shows more (each
## finding's `hint`). This role hands that to ACT (the act_triage role) to find out WHY, and to
## propose - or, if you allow it, make - the fix. Turn it on with use_act=true. Pick one level per
## job template: explain The role runs the findings' look commands itself and gives ACT their
## output. ACT runs NOTHING. You get a root cause and a suggested fix in words. Safest start; no
## approval step needed. (ACT evidence mode) diagnose ACT investigates by running read-only commands
## itself and proposes exact fix commands. Every change is refused and waits for a person: the job
## fails with NEEDS APPROVAL, the workflow's approval step asks, and act_fix_approved.yml applies
## exactly what was approved. (ACT loop mode, no --allow) self-heal Like diagnose, but ACT may run
## the fixes that match site_act_allow by itself (e.g. restart chronyd). Anything else still waits
## for approval.
# site_act_level: explain

## ACT at all (1.3.0): false = no job calls ACT - no request, no model endpoint or key needed, no
## error; each report says "ACT is off (site_act_enabled false)" in one line and the job stays green
## (an enclave without a model). Usually in all.yml (docs/ENCLAVES.md).
# site_act_enabled: true

## self-heal only: regular expressions of fix commands ACT may run without a person. Each must match
## the WHOLE command. Keep them narrow, e.g. site_act_allow: ['systemctl restart
## (chronyd|rsyslog|crond)']
# site_act_allow: []

## Hosts where ACT may only diagnose - never fix by itself, whatever site_act_level says: AAP itself
## (a fix could stop the job that is running it) and vendor-managed appliances. The apply step
## (act_fix_approved.yml) skips them too: a person applies the fix there by hand. AAP (groups aap,
## aap_hosts) is ALWAYS in this list (roles/site_act/vars/main.yml); the list adds to it.
# site_act_diagnose_only_groups: [aap, aap_hosts, sat, idm, netapp, netapp_console_hosts]

## ---- Which model ACT talks to -----------------------------------------------------------------
## site_act_provider genai GenAI.mil (the default) asksage Ask Sage - RETIRED FOR NOW: do not pick
## it (kept for when it returns) genai-beta the GenAI.mil beta proxy (preview models)
## site_act_models the model to use FOR EACH provider, e.g. {genai: gemini-4-argon-withtools,
## asksage: gpt-5.6-sol-gov} so the model follows whichever provider is picked. A provider not
## listed uses ACT's own default model. site_act_urls the API URL for each provider, e.g. {asksage:
## https://<host>/server/openai/v1/chat/completions}; a provider not listed uses ACT's default URL
## site_act_model one model for this run, whatever the provider (e.g. a survey answer); empty =
## site_act_models site_act_url one URL for this run; empty = site_act_urls site_act_ca a CA bundle
## file ON THE HOSTS for the provider's TLS certificate (internal/DoD CA); empty = the host's system
## trust store The API KEY never goes here: it comes from an AAP credential - "ACT model key" (GenAI
## and Ask Sage keys) or "ACT GenAI beta key". ACT runs ON EACH HOST, so the hosts must be able to
## reach the provider's URL (a proxy or firewall rule may be needed).
# site_act_provider: genai

## the model for each provider (see above): the model follows the provider picked
# site_act_models: {genai: gemini-4-argon-withtools, asksage: gpt-5.6-sol-gov}

## the API URL for each provider; a provider not listed uses ACT's default
# site_act_urls: {}

## one model for this run, whatever the provider (e.g. a survey answer); empty = site_act_models
# site_act_model: ""

## one URL for this run; empty = site_act_urls
# site_act_url: ""

## a CA bundle file ON THE HOSTS for the provider's certificate; empty = the host's trust store
# site_act_ca: ""

## Any other ACT environment settings (advanced; these win over the ones above), e.g. {HTTPS_PROXY:
## "http://proxy.yoursite.mil:8080"}. See the top of vendor/act/act for the list. Every ACT job
## streams the model's answer (ACT_STREAM=1), so a firewall or proxy idle timeout does not cut a
## long answer ("connection reset by peer"); {ACT_STREAM: "0"} here turns that off.
# site_act_env: {}

## Seconds the model may take for ONE answer, retries after a provider hiccup included (ACT's
## GENAI_TIMEOUT; ACT's own default, 90, is too short for a long analysis or a busy provider). Every
## ACT job uses it: the runbooks' use_act, the VMware alarms and capacity analyses, service watch.
# site_act_model_timeout: 600

## seconds for one whole ACT run (several answers): keep it above site_act_model_timeout
# site_act_timeout: 1200

## How many hosts may run ACT at the same time in one job (0 = no limit: as many as the job's
## forks). The jobs that ask ACT about evidence on the AAP side (log analysis, the VMware alarms,
## the WAR ...) ask this many questions at a time (0 = up to 4 at a time). Every host in a job uses
## the same key, and GenAI.mil's default quota is 60 requests and 200,000 tokens a minute per key: a
## fleet run with many hosts at once gets HTTP 429 (too many requests).
# site_act_concurrency: 3

## 1.136.0: hosts of one job with the same findings, at level explain: ACT reads the first of them,
## the others take its answer (their reports say so). The findings are compared without numbers,
## times, addresses and the host's own names. Diagnose and self-heal are always per host. false =
## ACT reads every host.
# site_act_group: true

## anything ACT should know about this site
# site_act_extra_instructions: ""

## extra evidence (troubleshoot.yml passes what it collected)
# site_act_evidence_text: ""

## Old copies of ACT on the hosts (1.53.0): an `act` someone put there by hand runs instead of the
## one the jobs install (/opt/act/act) when a person types act, with its own saved model. Every job
## that can run ACT on a host looks, ACT on or off, once per host
## (roles/site_act/tasks/old_copies.yml; the job "ACT - find and replace old copies" on its own).
## where an old act may be; missing, or a link into /opt/act, is left alone
# site_act_old_bins: [/usr/local/bin/act]

## link = keep the old one in /opt/act/old (0700), then link it to /opt/act/act; delete = keep it,
## then remove it; report = only say it
# site_act_old_bin: link

## true = a user's saved genai.model (~/.config/act/config.json) set to the job's model
# site_act_fix_user_model: false

## where the old-copies check puts the jobs' ACT for a moment (a private folder, removed after); ""
## = the host's temp folder
# site_act_stage_dir: ""

# ---- site_findings - usually in all.yml ----------------------------------------------------------
## Group website reports by server (1.139.0). Set false for the previous layout.
# report_servers_view: true

## Which severities make the job FAIL. A failed job is what sends an AAP workflow down its "on
## failure" path (open tickets, ask ACT, wait for approval). [] = report only, never fail.
# site_fail_on: [critical, warning]

## A host that cannot be reached (switched off, no network, ssh or WinRM refused, its login refused)
## in the health checks, the certificate report and renewal, database health, the service watch and
## troubleshoot: listed as NOT REACHED and left out, and the job is not failed for it. It still
## counts as checked-for, so the ServiceNow step opens its "no result" ticket. When NO host is
## reached (a wrong or expired machine credential looks like this) the job fails. true = a host not
## reached fails the job, as before. Patching, fixes, deploys and the Windows connection test always
## fail for it.
# site_unreachable_fails: false

## One syslog line per finding (tag below), so your log server / SIEM sees them too.
# site_syslog: true

## the syslog tag those lines carry (to filter on in the SIEM)
# site_syslog_tag: site-health

## Windows: one Application event log entry per finding instead of syslog (source below).
# site_eventlog_source: site-health

## ---- Linux or Windows (set by the playbook; do not set) -----------------------------------------
## Linux playbooks run the roles check_<name>, the Windows ones (win_*.yml) the roles
## win_check_<name>.
# site_os: linux

## check_ (Linux) or win_check_ (Windows): set by the playbook from site_os
# site_check_role_prefix: "{{ 'win_check_' if site_os == 'windows' else 'check_' }}"

## How a host is recognized as Windows: its connection, or its shell (Windows OpenSSH).
# site_windows_connections: [winrm, psrp, ansible.builtin.winrm, ansible.builtin.psrp]

## A notice in the job output when a project settings file (playbooks/group_vars/*.yml) defines a
## setting: it wins over AAP's inventory Variables box. false = no notice.
# site_settings_notice: true

## ---- Patch age (1.61.0): a section of the health reports ----------------------------------------
## When the patching check ran: days since each host's last update, by host group. Late: Linux
