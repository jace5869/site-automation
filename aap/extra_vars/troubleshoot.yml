## win_check_patching_crit_days). Changes no finding. inventory groups, in order: a host goes in the
## first one it is in, else Other; [] = its first group
# patch_age_groups: []

## due soon (Low) = late within this many days
# patch_age_due_days: 7

## the oldest hosts listed
# patch_age_oldest: 10

## "% on time" over 12 weeks from this template's earlier runs (AAP job history; report_history's
## credential)
# patch_age_history: true

## how many earlier runs to read (at most 50)
# patch_age_history_runs: 50

## ---- Teams (1.86.0): the team view of the health reports on the report website ------------------
## Which findings belong to which team: team: [matchers], in order - group:<inventory group>,
## host:<pattern> (* and ?, any case; without a dot the short name too), inventory:<AAP inventory
## name>; a bare word is a group. A host is in every team that matches it, the first its owner
## (counted once in Everyone's numbers); none = report_team_other. The website's page gets a team
## picker, each team's tiles, first steps and last 5 runs, and the other teams' findings folded; the
## email is as it was. {} = no teams, every page as before. Set it in all.yml (AAP's inventory
## Variables), never in the repository - one line a team, e.g. TEAM-A: [group:linux_web,
## 'host:app*'] (docs/WEB_REPORTS.md, "Teams").
# report_teams: {}

## the team of a host no team matches - always shown, with its count
# report_team_other: Unassigned

## ---- Certificate timeline (1.64.0): a section of the certificate reports ------------------------
## Linux, Windows, network devices, vCenter: the next cert_timeline_days on one axis on the report
## website (the atlas and brief looks), the renew list in the email, a Timeline sheet in the
## workbook. The levels are each report's own days. Changes no finding. false = the reports as
## before 1.64.0
# cert_timeline: true

## how far ahead the timeline and its sheet look (14 or more)
# cert_timeline_days: 120

## inventory groups, in order, a row each: a host goes in the first one it is in, else Other; [] =
## its first group
# cert_timeline_groups: []

## 1.67.0 (the site portal, docs/SITE_PORTAL.md "From a finding to a fix"): every report job of the
## checks keeps its findings as the job artifact site_findings - a stable id each
## (<kind>:<host>:<key>) and the numbers a fix needs - so the portal's fix jobs can read a finding
## back by reference. false = not kept (the portal's buttons then cannot work).
# site_findings_artifact: true

## per host and kind, the worst first; how many more there were: site_findings_capped
# site_findings_max_per_kind: 50
