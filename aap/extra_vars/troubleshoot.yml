# report_web_url: ""

## The website's look (docs/WEB_REPORTS.md, "The look"): atlas = made for a browser, never an email
## - a wide page whose tables use all of it (columns sized by what they hold: numbers right-aligned,
## short values whole, paths broken at / and \), a bar at the top that stays (the sections, Compact
## / Comfortable rows, Light / Auto / Dark - the reader's own setting on Auto -, Print), status
## chips with icons (a check mark for OK), Start here cards with a Copy button, tables that sort and
## filter, rows as cards on a phone; the index page too. brief (0.92.0) = the same page read like a
## morning brief, calm and soft (0.94.0): what it found as a chip, the key figures as one strip,
## Start here as numbered steps, percentages as bars, soft greys in dark, translucent cards, the
## logo larger. ops (1.69.0, opt-in) = the same page as an operations console: a header card (the
## verdict in one bold line, the headline number on the right, SHOW for the details), status tiles
## (a dot and a word, a big number, a line), Start here as 3 ranked cards (Open item, View details),
## the sections as cards (short ones side by side, a footer with Explore), deep navy in dark and
## grey-lavender in light, violet bars. The index page (1.72.0) is the same calm board in all three,
## in the look's colours. Or one of the email looks: standard, command, portal or glass (as
## report_email_theme - the index page is then in the portal look).
# report_web_theme: atlas

## The motion of the report website's pages (1.86.0; the atlas, brief and ops looks, the ticket
## insights): numbers count up, cards and tiles come in as they scroll into view, chart lines draw
## in and bars grow, a line chart gets a crosshair, rows a filter brings back fade in, a slim header
## with the title, the status and the first tiles stays on top once the top has scrolled away. auto
## = on unless the viewer's system asks for less motion; always = even then; off = still (the slim
## header and the team picker stay; nothing moves). Print is always still. The network map (1.85.0)
## reads it too.
# report_motion: auto

## The Christmas theme of the report website and the Site portal (1.115.0, docs/WEB_REPORTS.md):
## pixel decor in the header bar of the atlas, brief and ops pages and their index - a string of
## lights that twinkle, a small tree by the site's name, a candy stripe under the active tab, a few
## snowflakes in the side margins (1200 px and wider), Santa's sleigh flying along the lights now
## and then and a small snowman after the page's title (both 16bit only). Tiles, tables, chips and
## status colours never change; print, the PDFs and the emails never get it. none = off (the pages
## as always); christmas = on; auto = on from Dec 1 to Jan 6 (by the day in report_time_zone). Each
## page carries its last day, so a page written in the season stops being festive after Jan 6 by
## itself. Every viewer gets a Festive button in the bar (Festive, Lights, Twinkle, Sleigh, Snow -
## each On or Off, kept in that browser). The system's reduced-motion setting (or report_motion:
## off): no twinkle, no snow, the sleigh parked still at the bar's end. The portal follows it
## (portal_theme_season).
# report_theme_season: none

## 16bit (shaded sprites, the default) or 8bit (flat colours, bigger pixels; no sleigh, no snowman).
# report_theme_season_style: 16bit

## Each part, for everyone: true = on, the viewer may turn it off (their Lights / Twinkle / Sleigh /
## Snow switch); false = off, and that switch is not shown. Twinkle and the sleigh need the lights.
## the string of lights (and the Lights switch)
# report_theme_season_lights: true

## the lights twinkle (and the Twinkle switch)
# report_theme_season_twinkle: true

## snow in the side margins (and the Snow switch)
# report_theme_season_snow: true

## Santa's sleigh along the lights now and then, 16bit (and the Sleigh switch)
# report_theme_season_sleigh: true

## The site portal (1.67.0, docs/SITE_PORTAL.md): its address with /portal, e.g.
## https://stigman.yoursite.mil/portal. Set, the report website's pages get its buttons: "Ask ACT"
## on fapolicyd and event-log findings, "Recheck" on the STIG drift report's hosts and the
## scorecard's fixed-on-host rows, "Import checklists" on the scorecard. Each opens the portal's
## confirm page in a new tab: nothing runs until the person presses Run there. "" = no buttons, the
## pages as before.
# report_portal_url: ""

## 1.118.0: the "Site portal" link on the report website - the index's top bar and "All reports ·
## Site portal" on each page. auto: report_portal_url, else portal_path when the inventory sets it
## (the portal on the same server as the website: /portal/); an address (https://...) or a path
## (/portal/): that; "" = no link. The link only - the buttons stay with report_portal_url.
# report_portal_link: auto

## The names inside the folder, with {names} filled in: {template} (the AAP template's name, lower
## case with dashes; the play's name outside AAP), {template_id}, {job} (the AAP job; local outside
## AAP), {status} (ok, warning, critical, info), {date} (2026-10-23), {time} (0605), {year},
## {month}, {day} - the time the job wrote it, UTC - and your own from report_web_names. Each must
## end in .html; folders are made as needed. each run's page (the address the job prints)
# report_web_page: "{template}/{date}_{time}_job-{job}.html"

## always the template's newest run ("" = none)
# report_web_latest: "{template}/latest.html"

## every report's last runs, a tab per area ("" = none)
# report_web_index: index.html

## the runs each report keeps: listed under its line of the index, the pages of older runs deleted
# report_web_history: 5

## false = the older runs' pages stay in the folder (only the index forgets them)
# report_web_delete_old: true

## A line of the index whose latest page is no longer there (its folder deleted by hand) is taken
## off the index by the next report that writes it. false = lines stay until a report writes them
## again. Not with report_web_host (that server's folder is not read from the AAP side): there,
## delete the line from index.json by hand.
# report_web_index_prune: true

## The index page's tabs: a report is on the first tab one of whose names its AAP template's name
## matches (any case, * = anything); else on the tab of its name up to " - " (Backup - nightly:
## Backup); else on Other. A tab with no report is not shown. Set it in all.yml, for every template
## alike: the index is one page.
# report_web_tabs:
#   - {tab: Certificates, match: ["*certificate*", "*trust store*", "PKI *"]}
#   - {tab: VMware, match: ["VM *", "VMs *", "VMware*", "ESXi*", "vCenter*"]}
#   - {tab: Horizon, match: ["Horizon*"]}
#   - {tab: Tenable.sc, match: ["Tenable*"]}
