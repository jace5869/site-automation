## there.
# evaluate_stig_update_version_regex: (?:^[ \t]*#[ \t#]*Version:[ \t]*|\$EvaluateStigVersion\s*=\s*["'])([0-9]+(?:\.[0-9]+)+)

# ---- check_stig ----------------------------------------------------------------------------------
## ---- Evaluate-STIG (check_stig_scanner: evaluate_stig)
## ------------------------------------------------------------ Evaluate-STIG runs on the host as
## root with --Output CKLB into a folder of its own (deleted after), and the job reads the checklist
## of the host's RHEL STIG (check_stig_stigman_benchmarks: RHEL_9_STIG ...): Not a Finding = pass,
## Open = fail, Not Applicable, Not Reviewed = by hand. Its CKLB is kept in check_stig_dir (STIG
## Manager imports it). It needs PowerShell 7 (pwsh) on the host. The job never installs or updates
## Evaluate-STIG. Evaluate-STIG on the host: its folder, e.g. /opt/Evaluate-STIG - Evaluate-
## STIG_Bash.sh found there or in Src/Evaluate-STIG (its options start with --), else Evaluate-
## STIG.ps1 (run with pwsh) - or the script's own path
# check_stig_evaluate: ""

## PowerShell 7 for Evaluate-STIG.ps1; empty = pwsh found in PATH
# check_stig_pwsh: ""

## true = a rule DISA changed since the scan's STIG (held back otherwise) gets the earlier
## revision's Not a Finding / Not Applicable written to STIG Manager's revision when that review
## counts (check_stig_stigman_statuses) and the scan agrees; the comment says it was carried
## forward. For until Evaluate-STIG has STIG Manager's revision
# check_stig_recheck_carry_forward: false

# ---- site_findings - usually in all.yml ----------------------------------------------------------
## A host that cannot be reached (switched off, no network, ssh or WinRM refused, its login refused)
## in the health checks, the certificate report and renewal, database health, the service watch and
## troubleshoot: listed as NOT REACHED and left out, and the job is not failed for it. It still
## counts as checked-for, so the ServiceNow step opens its "no result" ticket. When NO host is
## reached (a wrong or expired machine credential looks like this) the job fails. true = a host not
## reached fails the job, as before. Patching, fixes, deploys and the Windows connection test always
## fail for it.
# site_unreachable_fails: false

