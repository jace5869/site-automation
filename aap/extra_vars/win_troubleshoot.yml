# ---- win_troubleshoot ----------------------------------------------------------------------------
## WINDOWS TROUBLESHOOT: the PowerShell commands an experienced Windows admin runs first for a kind
## of problem, run for you (read-only), each with a line saying what it shows. The matching health
## checks run too, so you also get plain-words findings. ts_area: overview | disk | performance |
## service | network | login | time | logs | updates | security ts_service: the service name for
## area=service (e.g. W3SVC, Spooler, MSSQLSERVER) ts_target: host:port for area=network (e.g.
## dc01.example.mil:636) ts_hours: how many hours back to read the event logs (default 2)
# ts_area: overview

## the service name, for ts_area service (see above)
# ts_service: ""

## host:port, for ts_area network
# ts_target: ""

## keep the last this-many lines of each command
# ts_output_lines: 60

## how many hours back the event logs are read
# ts_hours: 2

