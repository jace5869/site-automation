## A survey: horizon_user (text, required) and horizon_user_action (look, logoff, disconnect, reset, restart, recover)

# ---- horizon -------------------------------------------------------------------------------------
## ---- Connection ---------------------------------------------------------------------------------
## a CA file for the Connection Server's HTTPS certificate ("" = what the execution environment
## trusts)
# horizon_ca_path: ""

## seconds per request
# horizon_timeout: 60

## records per page when reading pools, desktops and sessions (Horizon's most: 1000)
# horizon_page_size: 500

## the newest API version to try (v9 down to v1): the first that answers is used
# horizon_api_newest: 9

## the API version of the actions (reset, recover, log off, push image...)
# horizon_action_version: v1

## ---- Pools no job changes -----------------------------------------------------------------------
## Desktop pools no job fixes, logs off or pushes an image to: names as Horizon Console shows them,
## * and ? allowed, any case (e.g. [VIP-*, Kiosk]). The reports still show them.
# horizon_protected_pools: []

## log off a locked session too (a disconnected session is usually locked)
# horizon_session_forced_logoff: true

## ---- User help (playbooks/horizon_user_help.yml) ------------------------------------------------
## the user who cannot connect: jdoe, CORP\jdoe, jdoe@corp.example.mil or a SID (a survey question)
# horizon_user: ""

## What to do: look (only show their sessions and desktops), logoff (all their sessions), disconnect
## (their connected sessions), reset or restart (their desktops), recover (their instant-clone
## desktops: made again from the image). Never a desktop another user has a session on, nor one in a
## protected pool.
# horizon_user_action: look
