# ==================================================================================================
# Variables for the job template "STIG Manager - deploy"
#   playbook:    playbooks/stigman_deploy.yml
#   credentials: Machine, STIG Manager database, TLS certificate
#
# HOW TO USE: copy this file into the template's Variables box (YAML selected).
#   - A setting starting with "# " is switched off. To use it, delete the "# " in front of its
#     line (and of the indented lines under it), then change the value. Lines starting with
#     "## " say what the setting below them does.
#   - Switch on only what you change: a value here beats the same setting everywhere else,
#     including playbooks/group_vars/all.yml. The values shown are the defaults.
#   - The settings under "usually in all.yml" apply to every job: set them once there.
#   - Every setting, in full: docs/VARIABLES_REFERENCE.md (the Settings Reference PDF).
# GENERATED by scripts/gen_template_vars.py from roles/*/defaults/main.yml - do not edit here.
# ==================================================================================================
---
# ---- stigman_stack -------------------------------------------------------------------------------
## system = rootful (/etc/containers/systemd, systemctl) <- production user = rootless
## (~/.config/containers/systemd, systemctl --user) <- tests / rootless hosts
# stigman_scope: system

## the container images (pin STIG Manager's version; change it deliberately)
# stigman_images:
#   mysql: docker.io/library/mysql:8.4
#   api: docker.io/nuwcdivnpt/stig-manager:1.6.17     # pin a version; bump deliberately
#   nginx: docker.io/library/nginx:stable

## nginx.conf, TLS files, CA bundle
# stigman_config_dir: /etc/stigman

## host port nginx publishes
# stigman_https_port: 443

## the name nginx answers to (and the TLS certificate is for)
# stigman_server_name: "{{ inventory_hostname }}"

## Existing Keycloak realm (server-side URL used by the API; browser-side URL for the web client)
# stigman_oidc_provider: "https://keycloak.example.mil/realms/stigman"

## the Keycloak realm URL the browser uses (when it differs from the server-side one)
# stigman_client_oidc_provider: "{{ stigman_oidc_provider }}"

## the Keycloak client the web app logs in with
# stigman_client_id: stig-manager

## banner: U, CUI, C, S, TS, SCI, NONE
# stigman_classification: U

## the MySQL database STIG Manager uses
# stigman_db_schema: stigman

## the MySQL account STIG Manager uses (its password: the credential)
# stigman_db_user: stigman

## STIG Manager docs: >= 8G for real deployments
# stigman_mysql_buffer_pool: 1G

## How long to wait after (re)starting: for MySQL to be healthy, then for the API to answer through
## nginx (each)
# stigman_ready_retries: 40

## seconds between those tries
# stigman_ready_delay: 6

## ---- Secrets: NEVER set these in a vars file or inventory -----------------------------------
## They come from AAP credentials (aap/credential_types/*.yml) as environment variables / files on
## the controller (execution environment). See docs/SECRETS.md.
# stigman_mysql_root_password: "{{ lookup('ansible.builtin.env', 'STIGMAN_MYSQL_ROOT_PASSWORD') }}"

## from the credential (STIGMAN_DB_PASSWORD), never set here
# stigman_db_password: "{{ lookup('ansible.builtin.env', 'STIGMAN_DB_PASSWORD') }}"

## nginx's certificate file, from the TLS certificate credential (TLS_CERT_FILE)
# stigman_tls_cert_src: "{{ lookup('ansible.builtin.env', 'TLS_CERT_FILE') }}"

## its private key file, from the credential (TLS_KEY_FILE)
# stigman_tls_key_src: "{{ lookup('ansible.builtin.env', 'TLS_KEY_FILE') }}"

## the CA bundle file, from the credential (TLS_CA_FILE)
# stigman_tls_ca_src: "{{ lookup('ansible.builtin.env', 'TLS_CA_FILE') }}"
