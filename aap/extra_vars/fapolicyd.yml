# ==================================================================================================
# Variables for the job template "fapolicyd"
#   playbook:    playbooks/fapolicyd.yml
#   credentials: Machine (with sudo); ACT model key with fapolicyd_act
#
# HOW TO USE: copy this file into the template's Variables box (YAML selected).
#   - A setting starting with "# " is switched off. To use it, delete the "# " in front of its
#     line (and of the indented lines under it), then change the value. Lines starting with
#     "## " say what the setting below them does.
#   - Switch on only what you change: a value here beats the same setting everywhere else,
#     including playbooks/group_vars/all.yml. The values shown are the defaults.
#   - The settings under "usually in all.yml" apply to every job: set them once there.
#   - Every setting, in full: docs/VARIABLES_REFERENCE.md (the Settings Reference PDF).
# GENERATED by scripts/gen_template_vars.py from roles/*/defaults/main.yml - do not edit here.
# ==================================================================================================
---
## The hosts: target (a group of this inventory) or the Limit
# target: app_servers
## Blocks since (ausearch -ts): recent (10 minutes), today, yesterday, this-week, boot (the workflow's check: yesterday)
# fapolicyd_since: today
## Workflow 36's first template ("fapolicyd - check") only: hand each host's changes to the approval and fail on
## purpose (NEEDS APPROVAL). Not on "fapolicyd - approved".
# fapolicyd_workflow: true
## ACT explains what fapolicyd blocked, in the report (the "ACT model key" credential on the template)
# fapolicyd_act: true
## By hand, without the workflow: the approved changes, each exactly as the report's "Changes to approve" gives it -
## after your security approval. Run in Check first. Empty (the default): read only.
# fapolicyd_approved:
#   - "trust file access: /etc/fapolicyd/trust.d/app root:root 0600 -> root:fapolicyd 0644"
#   - "enable fapolicyd at boot (it is disabled)"
#   - "permissive: 0 -> 1"
#   - "restart fapolicyd (it is inactive)"
#   - "trust file: /opt/app/tool size 51320 sha256 6f0c...e1"
#   - "remove rule: 99-local.rules: allow perm=any all : dir=/usr/lib/"
#   - "permissive: 1 -> 0"

# ---- fapolicyd -----------------------------------------------------------------------------------
## fapolicyd's folder: fapolicyd.conf, fapolicyd.trust, trust.d, rules.d
# fapolicyd_dir: /etc/fapolicyd

## seconds fapolicyd may take to take a change (running, its new rules or trust)
# fapolicyd_wait: 30

# ---- fapolicyd_fix -------------------------------------------------------------------------------
## FAPOLICYD - GETTING IT RUNNING (a part of playbooks/fapolicyd.yml, roles/fapolicyd;
## docs/RUNBOOKS.md "fapolicyd"): why fapolicyd is down, or near its limits, on each host - trust
## files it cannot read, their SELinux labels, db_max_size too small for the trust database, not
## enabled at boot, not running (it starts permissive) - the fix for each as a line to approve; and,
## once approved, those fixes made. roles/fapolicyd sets these three from its own:
## fapolicyd_approved, fapolicyd_dir, fapolicyd_wait set by roles/fapolicyd: the fix lines of
## fapolicyd_approved
# fapolicyd_fix_approved: []

## set by roles/fapolicyd: fapolicyd_dir
# fapolicyd_fix_dir: /etc/fapolicyd

## read to see whether this fapolicyd sizes its database itself (db_max_size = auto)
# fapolicyd_fix_binary: /usr/sbin/fapolicyd

## The trust files' owner, group and modes come from the fapolicyd package (rpm); these only when
## rpm gives none. the trust files' owner, when rpm gives none
# fapolicyd_fix_owner: root

## their group, when rpm gives none
# fapolicyd_fix_group: fapolicyd

## a trust file's mode, when rpm gives none
# fapolicyd_fix_file_mode: "0644"

## the folders' mode, when rpm gives none
# fapolicyd_fix_dir_mode: "0750"

## a trust file larger than this (MB) is listed for a person: every file in it is trusted
# fapolicyd_fix_large_mb: 20

## the proposed db_max_size: the estimate times this (where auto is not possible)
# fapolicyd_fix_headroom: 1.5

## fapolicyd's journal lines read, this boot
# fapolicyd_fix_journal_lines: 400

## roles/fapolicyd sets it from fapolicyd_wait
# fapolicyd_fix_wait: 30

## seconds for each command the job reads with
# fapolicyd_fix_timeout: 120

# ---- fapolicyd_rules -----------------------------------------------------------------------------
## FAPOLICYD - BLOCKS AND RULES (a part of playbooks/fapolicyd.yml, roles/fapolicyd;
## docs/RUNBOOKS.md "fapolicyd"): what fapolicyd blocked on each host - or, permissive, would block
## - and the change that lets each through; the rules files' clean-up; permissive mode on or off.
## Each change is a line to approve; once approved, the job makes it. roles/fapolicyd sets these
## four from its own: fapolicyd_approved, fapolicyd_since, fapolicyd_dir, fapolicyd_wait set by
## roles/fapolicyd: the rules lines of fapolicyd_approved
# fapolicyd_rules_approved: []

## set by roles/fapolicyd: fapolicyd_since
# fapolicyd_rules_since: today

## set by roles/fapolicyd: fapolicyd_dir
# fapolicyd_rules_dir: /etc/fapolicyd

## the rules file (in rules.d) this job writes its allow rules to
# fapolicyd_rules_own_rules: 36-site-approved.rules

## the trust file (in trust.d) this job writes its trust entries to
# fapolicyd_rules_own_trust: site-approved

## rules files (in rules.d) reviewed, never changed (the old containers job's own)
# fapolicyd_rules_never_edit: [35-site-containers.rules]

## A clean-up that blocks more (a rule that opened too much, taken out) is made only while fapolicyd
## is permissive: a program it would break shows as a would-be block, not as an outage. true: made
## while it enforces too.
# fapolicyd_rules_when_enforcing: false

## A container's denial (as the containers job tells them apart): an SELinux label on the program or
## the file, a container program, or a path in container storage.
# fapolicyd_rules_container_labels: '(^|:)(container_[a-z0-9_]*_t|spc_t)(:|$)'

## container programs
# fapolicyd_rules_container_programs: [podman, crun, runc, conmon, buildah, skopeo, catatonit, containerd, containerd-shim-runc-v2, dockerd]

## container storage
# fapolicyd_rules_container_paths: ['^/var/lib/containers/', '/\.local/share/containers/', '^/run/containers/', '^/run/user/[0-9]+/containers/']

## folders users can write: a file blocked there gets no trust entry (a person decides)
# fapolicyd_rules_user_dirs: [/home/, /run/user/, /tmp/, /var/tmp/, /dev/shm/]

## a file larger than this is not hashed: a person adds it
# fapolicyd_rules_hash_max_mb: 512

## at most this many block groups per host in the report
# fapolicyd_rules_max: 200

## roles/fapolicyd sets it from fapolicyd_wait
# fapolicyd_rules_wait: 30

## seconds for each command the job reads with
# fapolicyd_rules_timeout: 120

# ---- site_email - usually in all.yml -------------------------------------------------------------
## Who gets it: a list, or text with commas / spaces / one per line (a survey answer). Empty = no
## email. Set it on each TEMPLATE (its Variables, or a survey): in all.yml every report job emails.
# report_email_to: []

## copied: a list, or text like report_email_to
# report_email_cc: []

## "Also email the report to": more people for one run, asked when the job is launched - a survey
## question (playbooks/aap_email_question.yml adds it to the report templates). Added to
## report_email_to, never in its place; empty = only report_email_to. A list, or text: addresses
## separated by commas, semicolons, spaces or one per line, or pasted from Outlook (Doe, Jane
## <jane.doe@yoursite.mil>; ...).
# report_email_also: []

## The domains an address in report_email_also may be in (a subdomain too), e.g. [yoursite.mil]; any
## other is listed in the job and gets no email. Empty = any domain (your mail relay may still
## refuse some).
# report_email_also_domains: []

## the sender, e.g. aap-noreply@yoursite.mil
# report_email_from: ""

## your mail relay, e.g. smtp.yoursite.mil
# report_email_smtp_host: ""

## 25 or 587 with starttls, 465 with ssl
# report_email_smtp_port: 25

## starttls = encrypt after connecting (the relay must offer it); ssl = encrypted from the start
## (port 465); none = not encrypted (only for a relay without encryption; then no login is sent).
# report_email_security: starttls

## a CA file that signed the relay's certificate (empty = the CAs the execution environment trusts)
# report_email_ca_path: ""

## put before every subject, e.g. "[AAP] Certificate report: ..."
# report_email_subject_prefix: "[AAP]"

## Send a formatted (HTML) version too, for reports that come with one (all VMware jobs). The email
## always carries a plain-text copy for mail clients that do not show HTML. false = plain text only.
# report_email_html: true

## Attach the report's tables to the email as an Excel workbook (.xlsx): a sheet per table. Some
