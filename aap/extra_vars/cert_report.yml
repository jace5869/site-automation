# ==================================================================================================
# Variables for the job template "Certificate report"
#   playbook:    playbooks/cert_report.yml
#   credentials: Machine (Keystore password: optional)
#
# HOW TO USE: copy this file into the template's Variables box (YAML selected).
#   - A setting starting with "# " is switched off. To use it, delete the "# " in front of its
#     line (and of the indented lines under it), then change the value. Lines starting with
#     "## " say what the setting below them does.
#   - Switch on only what you change: a value here beats the same setting everywhere else,
#     including playbooks/group_vars/all.yml. The values shown are the defaults.
#   - The settings under "usually in all.yml" apply to every job: set them once there.
#   - Every setting, in full: docs/VARIABLES_REFERENCE.md (the Settings Reference PDF).
# GENERATED by scripts/gen_template_vars.py from roles/*/defaults/main.yml - do not edit here.
# ==================================================================================================
---
# ---- check_certs ---------------------------------------------------------------------------------
## a certificate expiring within this many days -> warning (and amber in the certificate report)
# check_certs_warn_days: 30

## the certificate report colours these blue (an early heads-up; not a finding)
# check_certs_notice_days: 60

## within this many days (or expired) -> critical
# check_certs_crit_days: 14

## Certificate files (PEM) to check. Globs work. Every certificate in a file is checked (a chain
## file with an expiring intermediate is a problem too). e.g. [/etc/stigman/*.crt,
## /etc/pki/tls/certs/server.crt]
# check_certs_files: []

## Also look for certificates in the usual places. Files with many certificates are CA bundles
## (hundreds of roots, noisy) and are skipped unless listed in check_certs_files.
# check_certs_discover: true

## the folders searched (two levels deep) for *.crt, *.pem, *.cer (/etc/stigman/nginx/tls: STIG
## Manager's nginx certificate, three levels down)
# check_certs_discover_dirs: [/etc/pki/tls/certs, /etc/pki/nginx, /etc/nginx, /etc/httpd/conf.d, /etc/stigman, /etc/stigman/nginx/tls]

## regular expression: found files whose path matches are skipped
# check_certs_discover_exclude: 'ca-bundle|ca-certificates|/localhost\.crt$'

## a found file with more certificates than this is a CA bundle: skipped
# check_certs_discover_max_per_file: 10

## Regular expression on the subject of a package's placeholder certificate: postfix's
## /etc/pki/tls/certs/postfix.pem (O=SomeOrganization), self-signed for a year at install and never
## renewed. A found one is listed as not checked (no finding, no ticket) and none gets a CSR. A real
## certificate put in its place is checked; so is a file listed in check_certs_files.
# check_certs_placeholder_subject: '(^|,)O=SomeOrganization(,|$)'

## TLS endpoints, checked FROM this host, e.g. the site's own web server: check_certs_endpoints: -
## {name: STIG Manager, host: 127.0.0.1, port: 443, servername: stigman.example.mil}
# check_certs_endpoints: []

## Java keystores (Tomcat, the ServiceNow MID Server ...). A JKS keystore lists without a password;
## a PKCS12 one needs it - give the NAME of an environment variable that holds it (set by an AAP
## credential), never the password itself: check_certs_keystores: - {path:
## /opt/servicenow/mid/agent/security/agent_keystore, password_env: KEYSTORE_PASSWORD}
# check_certs_keystores: []

## ---- Finding them by themselves (the certificate report turns both on; the health check does not)
## ---- Listening TCP ports that answer TLS: each probed once, on the address it listens on, with
## `openssl s_client` (check_certs_probe_timeout seconds each, at most
## check_certs_discover_ports_max ports). Not these ports: plain-text services that would only log a
## stray connection.
# check_certs_discover_ports: false

## ports never probed (plain-text services: ssh, smtp, dns, http, ldap, databases ...)
# check_certs_discover_ports_skip: [22, 25, 53, 80, 110, 111, 123, 143, 323, 389, 631, 2049, 3306, 5355, 5432, 6379, 11211, 20048]

## probe at most this many listening ports (the rest are listed as not probed)
# check_certs_discover_ports_max: 25

## seconds for each port probe
# check_certs_probe_timeout: 3

## Java keystores (*.jks, *.keystore, *.p12, *.pfx) in these folders, and the ones running Java
## programs use (-Djavax.net.ssl.keyStore=...). A keystore that needs a password is listed as not
## checked: no password is ever guessed - give it in check_certs_keystores (password_env). The JDK's
## own trust stores (cacerts) are skipped.
# check_certs_discover_keystores: false

## the folders searched for keystores
# check_certs_discover_keystore_dirs: [/etc, /opt, /srv, /usr/share/tomcat, /var/lib/tomcat, /var/lib/pki]

## how many folder levels deep the search goes
# check_certs_discover_keystore_depth: 5

## regular expression: keystore paths skipped (the JDK's trust stores)
# check_certs_discover_keystore_exclude: '/(cacerts|jssecacerts)$|/jre/lib/security/|/lib/security/'

## read at most this many found keystores per host
# check_certs_discover_keystore_max: 40

## ---- Leaving hosts out (the certificate report and the renewal; not the health check) ---- Hosts
## whose certificates something else renews - Satellite and its Capsules (satellite-installer, never
## by hand), appliances - are left out of the certificate report and never get a CSR: listed as not
## checked, no ticket. Name them, or put them in a group. Both take a list or one string with commas
## ('sat01*, cap01.example.mil'), so a survey answer works too. host names as in the AAP inventory,
## any case, * and ? wildcards; a short name matches the full one, e.g. [sat01, '*capsule*']
# cert_skip_hosts: []

## AAP inventory groups, e.g. [sat] (the health check still watches the Satellite web UI:
## group_vars/sat.yml)
# cert_skip_groups: [sat]

# ---- site_email - usually in all.yml -------------------------------------------------------------
## Who gets it: a list, or text with commas / spaces / one per line (a survey answer). Empty = no
## email. Set it on each TEMPLATE (its Variables, or a survey): in all.yml every report job emails.
# report_email_to: []

## copied: a list, or text like report_email_to
# report_email_cc: []

## the sender, e.g. aap-noreply@yoursite.mil
# report_email_from: ""

## your mail relay, e.g. smtp.yoursite.mil
# report_email_smtp_host: ""

## 25 or 587 with starttls, 465 with ssl
# report_email_smtp_port: 25

## starttls = encrypt after connecting (the relay must offer it); ssl = encrypted from the start
## (port 465); none = not encrypted (only for a relay without encryption; then no login is sent).
# report_email_security: starttls

## a CA file that signed the relay's certificate (empty = the CAs the execution environment trusts)
# report_email_ca_path: ""

## put before every subject, e.g. "[AAP] Certificate report: ..."
# report_email_subject_prefix: "[AAP]"

## Send a formatted (HTML) version too, for reports that come with one (all VMware jobs). The email
## always carries a plain-text copy for mail clients that do not show HTML. false = plain text only.
# report_email_html: true

## The look of the HTML version. Your own: copy roles/site_email/templates/report.html.j2 (e.g. to
## playbooks/files/email/report.html.j2), change it, and set report_email_html_template: "{{
## playbook_dir }}/files/email/report.html.j2"
# report_email_html_template: report.html.j2

# ---- site_findings - usually in all.yml ----------------------------------------------------------
## Which severities make the job FAIL. A failed job is what sends an AAP workflow down its "on
## failure" path (open tickets, ask ACT, wait for approval). [] = report only, never fail.
# site_fail_on: [critical, warning]

## A host that cannot be reached (switched off, no network, ssh or WinRM refused, its login refused)
## in the health checks, the certificate report and renewal, database health, the service watch and
## troubleshoot: listed as NOT REACHED and left out, and the job is not failed for it. It still
## counts as checked-for, so the ServiceNow step opens its "no result" ticket. When NO host is
## reached (a wrong or expired machine credential looks like this) the job fails. true = a host not
## reached fails the job, as before. Patching, fixes, deploys and the Windows connection test always
## fail for it.
# site_unreachable_fails: false

## One syslog line per finding (tag below), so your log server / SIEM sees them too.
# site_syslog: true

## the syslog tag those lines carry (to filter on in the SIEM)
# site_syslog_tag: site-health

## Windows: one Application event log entry per finding instead of syslog (source below).
# site_eventlog_source: site-health

## ---- Linux or Windows (set by the playbook; do not set) -----------------------------------------
## Linux playbooks run the roles check_<name>, the Windows ones (win_*.yml) the roles
## win_check_<name>.
# site_os: linux

## check_ (Linux) or win_check_ (Windows): set by the playbook from site_os
# site_check_role_prefix: "{{ 'win_check_' if site_os == 'windows' else 'check_' }}"

## How a host is recognized as Windows: its connection, or its shell (Windows OpenSSH).
# site_windows_connections: [winrm, psrp, ansible.builtin.winrm, ansible.builtin.psrp]

## A notice in the job output when a project settings file (playbooks/group_vars/*.yml) defines a
## setting: it wins over AAP's inventory Variables box. false = no notice.
# site_settings_notice: true
