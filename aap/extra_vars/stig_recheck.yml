## seconds per request
# check_stig_stigman_timeout: 60

## with no collection set: search only these collections ([] = every one the client can read)
# check_stig_stigman_collections: []

## this host's asset name in STIG Manager; empty = the inventory name, then its short name (web01
## for web01.example.mil); the asset's FQDN field matches too
# check_stig_stigman_asset: ""

## the STIG Manager benchmark (STIG) for each RHEL version
# check_stig_stigman_benchmarks: {"8": RHEL_8_STIG, "9": RHEL_9_STIG, "10": RHEL_10_STIG}

## the reviews that count as the checklist (a rejected review does not); [accepted] = only what was
