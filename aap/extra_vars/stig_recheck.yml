## What to check again is read from STIG Manager (the same settings and "STIG Manager API" credential as the STIG
## drift report); the scanner too (check_stig_scanner, check_stig_evaluate ...)
check_stig_stigman_api: https://STIGMAN-SERVER/api
## Each host's collection: set it per group or host in your inventory (empty: every collection the client reads)
# check_stig_stigman_collection: RHEL Servers
## Only what STIG Manager has Open (default: Open and Not Reviewed)
# check_stig_recheck: [open]
## Until Evaluate-STIG has STIG Manager's STIG revision: write the earlier revision's Not a Finding / Not Applicable
## where the old scan agrees (held back otherwise; each review's comment says it was carried forward)
# check_stig_recheck_carry_forward: true
## Workflow 37's check ("STIG recheck - check") only: what to write to STIG Manager in the report, handed to the
## approval and "STIG Manager - update", the job fails on purpose (NEEDS APPROVAL). This job itself never writes.
# check_stig_update_workflow: true
## With it: a host with no asset in STIG Manager gets one in check_stig_stigman_collection, once approved (the
## update's client needs the Manage grant there)
# check_stig_update_create_assets: true

