# ==================================================================================================
# Variables for the job template "STIG recheck"
#   playbook:    playbooks/stig_recheck.yml
#   credentials: Machine, STIG Manager API
#
# HOW TO USE: copy this file into the template's Variables box (YAML selected).
#   - A setting starting with "# " is switched off. To use it, delete the "# " in front of its
#     line (and of the indented lines under it), then change the value. Lines starting with
#     "## " say what the setting below them does.
#   - Switch on only what you change: a value here beats the same setting everywhere else,
#     including playbooks/group_vars/all.yml. The values shown are the defaults.
#   - The settings under "usually in all.yml" apply to every job: set them once there.
#   - Every setting, in full: docs/VARIABLES_REFERENCE.md (the Settings Reference PDF).
# GENERATED by scripts/gen_template_vars.py from roles/*/defaults/main.yml - do not edit here.
# ==================================================================================================
---
## What to check again is read from STIG Manager (the same settings and "STIG Manager API" credential as the STIG
## drift report); the scanner too (check_stig_scanner, check_stig_evaluate ...)
check_stig_stigman_api: https://STIGMAN-SERVER/api
## Each host's collection: set it per group or host in your inventory (empty: every collection the client reads)
# check_stig_stigman_collection: RHEL Servers
## Only what STIG Manager has Open (default: Open and Not Reviewed)
# check_stig_recheck: [open]

# ---- check_stig ----------------------------------------------------------------------------------
## ---- The scan, on the host
## -------------------------------------------------------------------------------------- openscap:
## oscap and the SCAP Security Guide (below); evaluate_stig: Evaluate-STIG, already on the host (the
## settings after these) - closer to checklists Evaluate-STIG filled. Changing it starts the host's
## history again (each scanner checks rules its own way)
# check_stig_scanner: openscap

## true: install openscap-scanner and scap-security-guide when missing (dnf, from the host's own
## repositories); false: a host without them is listed as not scanned
# check_stig_install: false

## the oscap program; empty = found in PATH (/usr/bin/oscap)
# check_stig_oscap: ""

## the profile: stig, stig_gui (a host with a desktop), or a full profile id (xccdf_...)
# check_stig_profile: stig

## where scap-security-guide puts its datastreams (ssg-rhel<major>-ds.xml)
# check_stig_content_dir: /usr/share/xml/scap/ssg/content

## another datastream on the host instead (e.g. a DISA SCAP benchmark, with check_stig_profile its
## profile id); empty = the SCAP Security Guide's for the host's RHEL version
# check_stig_datastream: ""

## a datastream on the AAP side (in your repository, from playbooks/: files/stig/ssg-rhel9-ds.xml)
## copied to the host first - newer content than the host's repositories have; empty = none
# check_stig_datastream_src: ""

## a tailoring file on the host (your site's changes to the profile, made with SCAP Workbench);
## empty = none
# check_stig_tailoring: ""

## or a tailoring file on the AAP side (from playbooks/), copied to the host first; empty = none
# check_stig_tailoring_src: ""

## seconds the scan may take (OpenSCAP: one to five minutes; Evaluate-STIG: more)
# check_stig_timeout: 1800

## ---- Evaluate-STIG (check_stig_scanner: evaluate_stig)
## ------------------------------------------------------------ Evaluate-STIG runs on the host as
## root with --Output CKLB into a folder of its own (deleted after), and the job reads the checklist
## of the host's RHEL STIG (check_stig_stigman_benchmarks: RHEL_9_STIG ...): Not a Finding = pass,
## Open = fail, Not Applicable, Not Reviewed = by hand. Its CKLB is kept in check_stig_dir (STIG
## Manager imports it). It needs PowerShell 7 (pwsh) on the host. The job never installs or updates
## Evaluate-STIG. Evaluate-STIG on the host: its folder, e.g. /opt/Evaluate-STIG - Evaluate-
## STIG_Bash.sh found there or in Src/Evaluate-STIG (its options start with --), else Evaluate-
## STIG.ps1 (run with pwsh) - or the script's own path
# check_stig_evaluate: ""

## --SelectSTIG for each RHEL version, e.g. {"8": RHEL8, "9": RHEL9}: only the RHEL STIG is scanned
## (faster); its short name as your Evaluate-STIG lists it. {} = every STIG that applies to the host
## (the RHEL one is read)
# check_stig_evaluate_select: {}

## more arguments for Evaluate-STIG, e.g. ["--ScanType", "Classified", "--AnswerKey", "SITE"]
## (Evaluate-STIG.ps1: -ScanType ...); --Output and --OutputPath are the job's
# check_stig_evaluate_args: []

## read the newest checklist (.cklb or .ckl) Evaluate-STIG already wrote under this folder on the
## host - its own schedule - instead of running it, e.g. /opt/STIG_Compliance ; empty = run it
# check_stig_evaluate_read: ""

## Evaluate-STIG's --Output: CKLB, or CKL (the older XML checklist) if your version writes CKLB it
## then rejects itself
# check_stig_evaluate_output: CKLB

## a checklist Evaluate-STIG's own schema check rejects (it moves it to its Bad_CKL folder and names
## it - a check of its that failed can do that): true = read it from there anyway, said in the
## report with the checks that failed; false = the host is not scanned
# check_stig_evaluate_rejected: true

## PowerShell 7 for Evaluate-STIG.ps1; empty = pwsh found in PATH
# check_stig_pwsh: ""

## ---- Kept on the host
## ---------------------------------------------------------------------------------------- each
## scan's HTML report, results (gzip) and summary (JSON), and latest-report.html / latest-
## summary.json; root-only. A dry run keeps nothing
# check_stig_dir: /var/lib/site-automation/stig

## how many scans are kept on the host (the oldest are deleted); the last one is what the next scan
