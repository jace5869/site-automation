# Variables for the job template "STIG recheck"
#   playbook:    playbooks/stig_recheck.yml
#   credentials: Machine, STIG Manager API; Windows file share with check_stig_evaluate_answers
#
# HOW TO USE: copy this file into the template's Variables box (YAML selected).
#   - A setting starting with "# " is switched off. To use it, delete the "# " in front of its
