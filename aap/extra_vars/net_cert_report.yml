# ==================================================================================================
# Variables for the job template "Network device certificate report"
#   playbook:    playbooks/net_cert_report.yml
#   credentials: none - no login to the devices (SQL Server (certificate inventory): optional)
#
# HOW TO USE: copy this file into the template's Variables box (YAML selected).
#   - A setting starting with "# " is switched off. To use it, delete the "# " in front of its
#     line (and of the indented lines under it), then change the value. Lines starting with
#     "## " say what the setting below them does.
#   - Switch on only what you change: a value here beats the same setting everywhere else,
#     including playbooks/group_vars/all.yml. The values shown are the defaults.
#   - The settings under "usually in all.yml" apply to every job: set them once there.
#   - Every setting, in full: docs/VARIABLES_REFERENCE.md (the Settings Reference PDF).
# GENERATED by scripts/gen_template_vars.py from roles/*/defaults/main.yml - do not edit here.
# ==================================================================================================
---
# ---- net_certs -----------------------------------------------------------------------------------
## ---- which devices ---- inventory (the hosts of net_cert_group) / subnets (net_cert_subnets) /
## both
# net_cert_targets: inventory

## the inventory group of the devices; a host's own net_cert_ports / net_cert_address /
## net_cert_servername override
# net_cert_group: net_cert_devices

## the ports read (a host's own net_cert_ports wins), e.g. [443, 8443, 636]
# net_cert_ports: [443]

## CIDR ranges to sweep (net_cert_targets: subnets or both), e.g. ['192.0.2.0/24'] - every address,
## each port in net_cert_ports
# net_cert_subnets: []

## never connected to: addresses, CIDR ranges, host name patterns (e.g. ['192.0.2.1', 'ups*'])
# net_cert_exclude: []

## a sweep bigger than this (all subnets together) is refused: a /16 by mistake would take hours
# net_cert_max_addresses: 4096

## a swept address that answers: its DNS name (PTR) in the report, else the address
# net_cert_resolve_names: true

## seconds for each connection, and each handshake
# net_cert_timeout: 5

## connections at the same time
# net_cert_workers: 32

## only these devices (names, wildcards), e.g. ['sw01*'] - to try the renewal on one
# net_cert_only: []

## ---- what is due ---- a certificate expiring within this many days is due: a warning incident
## (amber in the report)
# net_cert_warn_days: 30

## within this many days (or expired): critical
# net_cert_crit_days: 7

## the report colours these blue (a heads-up, no incident)
# net_cert_notice_days: 60

## true = an inventory device whose port gives no certificate gets an incident too (a warning)
# net_cert_unanswered_finding: false

## On: for a due certificate of an inventory host with ansible_network_os cisco.ios.ios (and its
## network_cli credential on the job template), the job makes a key on the device (crypto key
## generate rsa, not exportable), a trustpoint <prefix>-<expiry> (enrollment terminal) and its CSR
## (crypto pki enroll), and attaches the CSR to the incident with the steps to import the issued
## certificate. The device's running configuration gets the trustpoint and the key: write memory is
## up to you (the incident says so). Other vendors: the incident only. true = a CSR made on each
## Cisco IOS / IOS-XE device due (see above); false = the incident only
# net_cert_cisco_csr: false

## the trustpoint and key label: SA-RENEW-20270131 (the old certificate's expiry)
# net_cert_cisco_trustpoint_prefix: SA-RENEW

# ---- cert_inventory ------------------------------------------------------------------------------
## ---- files: <source>-certificates.csv and .json (source: linux, windows, vmware, net), replaced
## each run ---- true = write the files
# cert_inventory_files: false

## where: on the AAP node the job runs on (a path AAP exposes to jobs: docs/CERT_INVENTORY.md), or
## on cert_inventory_host
# cert_inventory_dir: /var/lib/site-automation/cert-inventory

## an inventory host to write them on instead (a file server, or a Linux host with the share
## mounted); its credential must be on the job template
# cert_inventory_host: ''

## true = also a dated copy (<source>-certificates-YYYY-MM-DD.csv) next to them, for trends
# cert_inventory_history: false

## The login comes from the "SQL Server (certificate inventory)" credential
## (aap/credential_types/cert_inventory_sql.yml). The execution environment needs pymssql and
## community.general (the all-in-one EE has both). true = add / update the rows
# cert_inventory_sql: false

## the SQL Server (name or address)
# cert_inventory_sql_server: ''

## its port
# cert_inventory_sql_port: 1433

## the database (SQL Server 2016 or later: the rows go in as JSON, OPENJSON)
# cert_inventory_sql_database: ''

## schema.table
# cert_inventory_sql_table: dbo.cert_inventory

## true = create the table (and its view <table>_current) when it is not there - the account then
## needs CREATE TABLE
# cert_inventory_sql_create: false

# ---- site_email - usually in all.yml -------------------------------------------------------------
## Who gets it: a list, or text with commas / spaces / one per line (a survey answer). Empty = no
## email. Set it on each TEMPLATE (its Variables, or a survey): in all.yml every report job emails.
# report_email_to: []

## copied: a list, or text like report_email_to
# report_email_cc: []

## the sender, e.g. aap-noreply@yoursite.mil
# report_email_from: ""

## your mail relay, e.g. smtp.yoursite.mil
# report_email_smtp_host: ""

## 25 or 587 with starttls, 465 with ssl
# report_email_smtp_port: 25

## starttls = encrypt after connecting (the relay must offer it); ssl = encrypted from the start
## (port 465); none = not encrypted (only for a relay without encryption; then no login is sent).
# report_email_security: starttls

## a CA file that signed the relay's certificate (empty = the CAs the execution environment trusts)
# report_email_ca_path: ""

## put before every subject, e.g. "[AAP] Certificate report: ..."
# report_email_subject_prefix: "[AAP]"

## Send a formatted (HTML) version too, for reports that come with one (all VMware jobs). The email
## always carries a plain-text copy for mail clients that do not show HTML. false = plain text only.
# report_email_html: true

## The look of the HTML version (docs/EMAIL_REPORTS.md, "The look"): standard = a header band in the
## report's colour (green, amber, red, blue) with number boxes under it; command = a dark header
## with your logo and report_email_header_text, the job's last runs as a strip of bars
## (report_history), the numbers in one row; portal = white cards on a pale mint background (like
## the AAP portal pages): a header card with your logo, report_email_header_text and the status,
## number tiles, a card with the last runs, a card per section. Classic desktop Outlook shows the
## portal cards square, without shadows.
# report_email_theme: standard

## command, portal: the line with the logo
# report_email_header_text: Site automation report

## Your logo in the header (both looks): a PNG, JPEG or GIF in your repository - a path from
## playbooks/ (files/report_logo.png = playbooks/files/report_logo.png) or a full path. Attached to
## each email, so keep it small: about 160 px tall, under 100 KB. Updating with scripts/update-from-
## release: list the file in .site-local, or the update deletes it.
# report_logo_file: ""

## pixels in the email (its width follows); portal: at most 56
# report_logo_height: 84

## command, portal: the job's last runs, read from AAP - attach a "Red Hat Ansible Automation
## Platform" credential to the template, whose user can see the template's jobs (Organization
## Auditor on its organization, docs/EMAIL_REPORTS.md); without it the email goes out without the
## strip.
# report_history: true

## bars in the strip, this run included
# report_history_runs: 14

## a CA file for AAP's own HTTPS certificate ("" = what the execution environment trusts)
# report_history_aap_ca_path: ""

## Your own look instead: copy roles/site_email/templates/report.html.j2 (or report_command /
## report_portal) to e.g. playbooks/files/email/report.html.j2, change it, and set
## report_email_html_template: "{{ playbook_dir }}/files/email/report.html.j2" report.html.j2 (the
## default) = the look report_email_theme picks.
# report_email_html_template: report.html.j2

