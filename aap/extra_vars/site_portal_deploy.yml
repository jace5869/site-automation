# ---- netmap_report -------------------------------------------------------------------------------
## SolarWinds' address, e.g. orion.yoursite.mil (https:// and the SWIS port 17774 are added; an
## Orion older than 2023.1: https://orion.yoursite.mil:17778). The credential's SolarWinds URL, when
## set, wins.
# netmap_solarwinds_url: ""

## Check SolarWinds' HTTPS certificate. Orion's own is self-signed: put the CA that signed yours in
## netmap_ca_path (a file in the project, e.g. "{{ playbook_dir }}/files/ca/orion-ca.pem"), or set
## false. The credential's own settings win.
# netmap_validate_certs: true

## seconds for one request (no answer: asked once more)
# netmap_timeout: 60

## ---- Sites: which nodes make a site, and where it is on the map
## ---------------------------------------------------------- 1.95.0: auto = read it (the Discovery
## section says how): the nodes' names, Location's parts, the custom properties, the IPv4 subnets
## and the links - for the site, the building in it and the closet (the distribution switch above).
## Or name it: Location (the text before netmap_site_split, as before 1.95.0) or a node custom
## property (e.g. Site). A node with none: on the site "Not placed".
# netmap_site_by: auto

## Location's parts are split at this ("Site A, building 1" -> Site A); "" = one part
# netmap_site_split: ","

## 1.95.0: the site is this regular expression's first group in the node's caption (else its DNS
## name), e.g. '^([A-Z]{4})' or '^([A-Z]{4}[0-9]{4})'; before netmap_site_by. "" = not used
# netmap_site_pattern: ""

## 1.95.0: each level as you name it, instead of the discovery: [{level: site|building|closet, from:
## pattern|property|location| subnet|part|topology|none, value: ...}] - pattern: a regular
## expression (its first group); property: a custom property's name; location: Location's part (1, 2
## ... -1 the last, all); subnet: 8, 16 or 24; part: the name's part (1, 2 ...); topology: the
## distribution switch above (closet); none: the level is not used. e.g. [{level: building, from:
## location, value: 1}]
# netmap_hierarchy: []

## 1.95.0: a device's role by its name (* and ?), instead of what its name, model and links say,
## e.g. {"*-WC??": wireless}; the roles: core, distribution, access, firewall, router, wireless,
## server, other
# netmap_roles: {}

## read every node custom property's name and values for the discovery (false: only
## netmap_properties)
# netmap_discover: true

## Where a site is, in this order: 1. SolarWinds' Worldwide Map (Orion.WorldMap.Point: its nodes'
## points, their middle); 2. two node custom properties with the latitude and longitude (their names
## here, e.g. Latitude / Longitude); 3. netmap_sites below: the site's name as the map shows it (any
## case), else a pattern with * and ? ("SITA*": every site whose name starts SITA, at one place; the
## most specific pattern wins). A site with none of them shows as a tile.
# netmap_lat_property: ""

## the node custom property holding the site's longitude ("" = not used)
# netmap_lon_property: ""

## e.g. {"Site A": {lat: 39.4, lon: -93.2}, "SITB*": {lat: 34.9, lon: -112.8}} - usually in all.yml
# netmap_sites: {}

## more node custom properties shown in a node's panel and the workbook, e.g. [Region, Building]
# netmap_properties: []

## ---- The map ------------------------------------------------------------------------------------
## -------------------------- the world view's first look: region (1.102.0: the placed sites'
## region, fitted), globe or flat (each viewer's own choice, once made, is kept in their browser)
# netmap_view: region

## 1.102.0: the AD replication layer on the Region view (Layers: WAN traffic, AD replication - both
## on by default): the AD job's last replication, read from AAP (its job artifact ad_repl; the same
## "Red Hat Ansible Automation Platform" credential as "what changed"), matched to the map's sites
## as the AD report matches them (ad_site_map, the DCs' nodes, the code, the name). The portal's
## live map reads it from the report database instead. false: no AD layer
# netmap_ad_layer: true

## a link this busy (in or out, %) is Warning; 0 = never by load (an interface SolarWinds marks
## Warning still is)
# netmap_link_warn_percent: 90

## ---- Reading ------------------------------------------------------------------------------------
## ------------------------- rows a request (the nodes and links are read page by page)
# netmap_page_size: 1000

## nodes read at most (more: the first ones, said in the report)
# netmap_max_nodes: 5000

# ---- aap_portal_setup ----------------------------------------------------------------------------
## 1.75.3: true = also give the portal's account (portal_setup_portal_user) Auditor on
## portal_setup_organization, which it needs to read the report jobs' findings ("pick a host, then a
## finding"). Organization Auditor reads everything in the organization and writes nothing; the
## credential's user needs Admin on the organization to give it. false (the default) = you give it
## in AAP yourself. Never a write role.
# portal_setup_portal_auditor: false

## 1.78.1: put your own job templates and workflows on the portal in one go, by name. Patterns (*
## and ?, any case) of AAP names: each match gets the label portal_label and Execute for
## portal_setup_portal_user. Run with Check first: it says would label / would grant / already done
## / skipped. Nothing is ever removed by this; a pattern that matches nothing is said; one that
## matches more than portal_publish_max stops with the list and changes nothing. The credential
## needs Admin on the templates' organization, as for the rest of this job. Set these in the
## Variables of AAP - set up portal actions, not of Site portal - deploy (the deploy does not apply
## them). e.g. ["Site - health *", "Weekly cleanup"]
# portal_publish_templates: []

## {pattern: area}: also the label portal-area:<area> (e.g. {"Site - health *": "Health"})
# portal_publish_area: {}

## an organization's name: only its templates and workflows are matched (with ["*"]: all of them);
## "" = any
# portal_publish_organization: ""

## the most one pattern may match
# portal_publish_max: 50

## Take templates off the portal again (the label only; the roles stay and nothing is deleted): the
## same shape.
# portal_unpublish_templates: []

# ---- site_exclude --------------------------------------------------------------------------------
## ---- Leave hosts out of every job (1.67.0; playbooks/site_exclude.yml, README "Leave hosts out of
## every job") Hosts no job runs on or connects to, whatever its template, Limit or target: the
## first play of every playbook that runs on hosts takes them out before the first connection. Each
## report says so in one line at its end ("Left out by site_exclude_hosts: ..."); a host left out is
## never a finding and never "not reached". The VMware and Horizon jobs also leave out the VMs and
## ESXi hosts named here (and keep their own lists). Set them in all.yml. names: whole, or short
## either way (web01 = web01.example.mil); * and ?; any case
# site_exclude_hosts: []

# ---- stigman_ckl_import --------------------------------------------------------------------------
## 1.68.1: where the website's names go in STIG Manager. plain: its home page (a tooltip says where
## to look). open: the review itself - a rule's collection review at the rule, a host's asset
## review, a rule's host at the rule. open needs report_portal_url (the site portal behind STIG
## Manager's nginx) and its nginx lines nginx-stigman-links.conf added (docs/CKL_IMPORT.md, "Links
## that open the review"); without them a link opens the home page, as plain.
# stigman_link_style: plain

# ---- win_restart ---------------------------------------------------------------------------------
## The most servers one run may schedule (the Limit is required: an empty one is refused).
# win_restart_max_hosts: 50

# ---- site_email - usually in all.yml -------------------------------------------------------------
## Which enclave this AAP serves: unclassified or classified; empty = found from the job's hosts -
## classified when a target host's name or address (inventory_hostname, ansible_host) ends in one of
## site_enclave_classified_domains, else unclassified. site_enclave, when set, always wins.
# site_enclave: ""

## DNS suffixes of the classified enclave, e.g. [classified.example.mil]; [] = never found
## classified from the hosts.
# site_enclave_classified_domains: []

## The banner at the top and bottom of every report: each email look and the plain text (its first
## and last line), every report website page and the index, the ticket insights pages, print, and
## the first row of each workbook sheet. auto = on in the classified enclave (site_enclave), off in
## the unclassified; true / false = always / never.
# report_banner: auto

## the banner's text, e.g. SECRET, SECRET//NOFORN, UNCLASSIFIED, CUI
# report_banner_text: SECRET

## The banner's colour (#rrggbb); empty = the standard colour of the text: UNCLASSIFIED green, CUI
## purple, CONFIDENTIAL blue, SECRET red, TOP SECRET orange; the text black or white, whichever
## reads 4.5:1 or better.
# report_banner_color: ""

## The time zone of the times in a report, besides UTC: e.g. America/New_York (a name as
## `timedatectl list-timezones` prints them) shows "2026-10-25 10:03:12 EDT (14:03 UTC)". vCenter,
## ESXi and their log files keep UTC; the vSphere Client shows the browser's time zone. "" = UTC
## only. Used by the VMware health and alarms reports and the ServiceNow weekly and ticket insights
## reports, and (1.49.0) by the report website and every report's own lines: the index page's runs,
## last run and "updated", the strip of past runs and the footer line show that time zone with its
## abbreviation - "2026-11-13 05:37 CET", summer time as it was on that day - also for runs written
## before it was set. What is stored (index.json, a run's JSON, the file names) stays UTC. A name
## the execution environment does not know (or one without the tzdata package): UTC, with a warning
## in the job output. 1.54.0: also the times inside the reports that printed their own UTC (AD,
## lockout, capacity, ONTAP, log analysis, outage watch, snapshots, Horizon and more); a "(UTC)"
## column then says each cell's zone. Times you type stay UTC. docs/WEB_REPORTS.md, "Times in your
## time zone"; docs/VMWARE.md, "Times and clocks"
# report_time_zone: ""

## THE REPORT WEBSITE (docs/WEB_REPORTS.md): every report job also writes its report as a web page -
## off until report_web_dest is set. Works without an email (report_email_to empty). Each run: its
## page, a copy as the template's latest page, the report's data as JSON beside each (for your own
## site), and an index of every report's last run. The job prints the page's address ("Report:
## https://...") and keeps it as the job artifact site_report_url. Where the files go: a folder the
## job can write - a share mounted on the AAP execution nodes and exposed to jobs (Settings > Job
## settings > Paths to expose to isolated jobs), e.g. /mnt/reports - or an https:// address that
## takes uploads (HTTP PUT, WebDAV: nginx, Apache, IIS) - or a Windows file share's folder, written
## over SMB with no mount: '\\fileserver\its\aap\reports' (the folder there already; smbprotocol in
## the execution environment). An upload's or a share's login comes from a "Report website"
## credential (aap/credential_types/report_web.yml).
# report_web_dest: ""

## The website's look (docs/WEB_REPORTS.md, "The look"): atlas = made for a browser, never an email
## - a wide page whose tables use all of it (columns sized by what they hold: numbers right-aligned,
## short values whole, paths broken at / and \), a bar at the top that stays (the sections, Compact
## / Comfortable rows, Light / Auto / Dark - the reader's own setting on Auto -, Print), status
## chips with icons (a check mark for OK), Start here cards with a Copy button, tables that sort and
## filter, rows as cards on a phone; the index page too. brief (0.92.0) = the same page read like a
## morning brief, calm and soft (0.94.0): what it found as a chip, the key figures as one strip,
## Start here as numbered steps, percentages as bars, soft greys in dark, translucent cards, the
## logo larger. ops (1.69.0, opt-in) = the same page as an operations console: a header card (the
## verdict in one bold line, the headline number on the right, SHOW for the details), status tiles
## (a dot and a word, a big number, a line), Start here as 3 ranked cards (Open item, View details),
## the sections as cards (short ones side by side, a footer with Explore), deep navy in dark and
## grey-lavender in light, violet bars. The index page (1.72.0) is the same calm board in all three,
## in the look's colours. Or one of the email looks: standard, command, portal or glass (as
## report_email_theme - the index page is then in the portal look).
# report_web_theme: atlas

## The Christmas theme of the report website and the Site portal (1.115.0, docs/WEB_REPORTS.md):
## pixel decor in the header bar of the atlas, brief and ops pages and their index - a string of
## lights that twinkle, a small tree by the site's name, a candy stripe under the active tab, a few
## snowflakes in the side margins (1200 px and wider), Santa's sleigh flying along the lights now
## and then and a small snowman after the page's title (both 16bit only). Tiles, tables, chips and
## status colours never change; print, the PDFs and the emails never get it. none = off (the pages
## as always); christmas = on; auto = on from Dec 1 to Jan 6 (by the day in report_time_zone). Each
## page carries its last day, so a page written in the season stops being festive after Jan 6 by
## itself. Every viewer gets a Festive button in the bar (Festive, Lights, Twinkle, Sleigh, Snow -
## each On or Off, kept in that browser). The system's reduced-motion setting (or report_motion:
## off): no twinkle, no snow, the sleigh parked still at the bar's end. The portal follows it
## (portal_theme_season).
# report_theme_season: none

## 16bit (shaded sprites, the default) or 8bit (flat colours, bigger pixels; no sleigh, no snowman).
# report_theme_season_style: 16bit

## Each part, for everyone: true = on, the viewer may turn it off (their Lights / Twinkle / Sleigh /
## Snow switch); false = off, and that switch is not shown. Twinkle and the sleigh need the lights.
## the string of lights (and the Lights switch)
# report_theme_season_lights: true

## the lights twinkle (and the Twinkle switch)
# report_theme_season_twinkle: true

## snow in the side margins (and the Snow switch)
# report_theme_season_snow: true

## Santa's sleigh along the lights now and then, 16bit (and the Sleigh switch)
# report_theme_season_sleigh: true
