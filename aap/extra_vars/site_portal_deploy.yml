# ==================================================================================================
# Variables for the job template "Site portal - deploy"
#   playbook:    playbooks/site_portal_deploy.yml
#   credentials: Machine, Red Hat Ansible Automation Platform (the portal's own account, with a token)
#
# HOW TO USE: copy this file into the template's Variables box (YAML selected).
#   - A setting starting with "# " is switched off. To use it, delete the "# " in front of its
#     line (and of the indented lines under it), then change the value. Lines starting with
#     "## " say what the setting below them does.
#   - Switch on only what you change: a value here beats the same setting everywhere else,
#     including playbooks/group_vars/all.yml. The values shown are the defaults.
#   - The settings under "usually in all.yml" apply to every job: set them once there.
#   - Every setting, in full: docs/VARIABLES_REFERENCE.md (the Settings Reference PDF).
# GENERATED by scripts/gen_template_vars.py from roles/*/defaults/main.yml - do not edit here.
# ==================================================================================================
---
## The podman network of STIG Manager's nginx container (docs/SITE_PORTAL.md, step 1: sudo podman ps): the portal joins
## it and sits behind that nginx at /portal/ - its mTLS (the card) says who it is; the job never changes STIG Manager
portal_network: stigman
## The site's execution environment image (any image with Python 3), from your automation hub
portal_image: aap.example.mil/site-ee-all:1
## The folder the report jobs write the pages to, on that server (served read-only at /portal/reports/)
portal_reports_dir: /srv/reports
## The AAP inventory an action's host must be in, and who may decide approvals here (the CN of each card)
portal_inventory: Site hosts
portal_approvers: [DOE.JANE.Q.1234567890]
## The address people open
portal_public_url: https://stigman.example.mil/portal/

# ---- site_portal_stack ---------------------------------------------------------------------------
## system = rootful (/etc/containers/systemd, systemctl) <- production user = rootless
## (~/.config/containers/systemd, systemctl --user) <- tests / rootless hosts
# portal_scope: system

## the service's files, and nginx-portal.conf (the nginx lines to add)
# portal_config_dir: /etc/site-portal

## the portal's path on the proxy
# portal_path: /portal/

## the pages' title
# portal_title: Site portal

## banner: U, CUI, C, S, TS, SCI, NONE
# portal_classification: U

## how that folder is mounted: ro,z = read-only, SELinux label shared with other containers (a
## folder another container mounts with :Z, a private label, is relabeled by that container's next
## start - see docs/SITE_PORTAL.md, SELinux)
# portal_reports_mount: ro,z

## ---- who may do what: the CN of each person's card certificate (LAST.FIRST.MI.1234567890)
## ------------------------------- who may run the actions (an action's own who overrides); [] = any
## person with a verified card
# portal_requesters: []

## one person's launches in an hour, at most
# portal_launches_per_hour: 20

## ---- the actions: {} = the role's files/actions.yml; a dict of the same shape here replaces it
## -----------------------
# portal_actions: {}

## ---- AAP: the "Red Hat Ansible Automation Platform" credential (its URL and a token of the
## portal's own account) ------
# portal_aap_url: >-
#   {{ lookup('ansible.builtin.env', 'CONTROLLER_HOST') or lookup('ansible.builtin.env', 'AAP_HOSTNAME')
#      or lookup('ansible.builtin.env', 'TOWER_HOST') }}

## check AAP's certificate (the credential's verify setting; the CAs: portal_trust_host_cas)
# portal_aap_validate_certs: >-
#   {{ (lookup('ansible.builtin.env', 'CONTROLLER_VERIFY_SSL') or lookup('ansible.builtin.env', 'AAP_VALIDATE_CERTS')
#       or 'true') | lower not in ['0', 'false', 'no', 'off'] }}

## AAP's address for the "Open in AAP" links, as people open it ("" = portal_aap_url)
# portal_aap_ui: ""

## seconds an AAP call may take
# portal_aap_timeout: 30

## the service trusts what this server trusts (/etc/pki/ca-trust): AAP's certificate
# portal_trust_host_cas: true

## a job page shows its last this many lines of output (the rest is in AAP)
# portal_job_events: 300

## read AAP's ALLOW_JINJA_IN_EXTRA_VARS and warn when it is "always"
# portal_check_jinja: true

## ---- portal_own_nginx: true - its own nginx with TLS and client certificates, for a server of its
## own -----------------
# portal_own_nginx: false

## pin the tag your site uses (an enclave: its registry's copy)
# portal_nginx_image: docker.io/library/nginx:stable

## its own nginx's name (server_name), and the address's
# portal_server_name: "{{ inventory_hostname }}"

## the port on this server
# portal_port: 443

## the server's certificate (PEM, its chain after it), a path on this server
# portal_cert_file: ""

## its key (PEM, not encrypted), a path on this server
# portal_key_file: ""

## the CAs the cards' certificates are signed by (PEM), a path on this server
# portal_ca_file: ""

## optional: their revocation list (PEM), a path on this server
# portal_crl_file: ""

## how deep a card's chain may be
# portal_verify_depth: 3

## open portal_port in firewalld (own nginx only)
# portal_firewall: true

## How long to wait after (re)starting for the service to answer
# portal_ready_retries: 30

## seconds between those tries
# portal_ready_delay: 4

## ---- Secrets: NEVER set these in a vars file or inventory
## --------------------------------------------------------------- From the AAP credential, as
## environment variables on the controller: the token of the portal's account (a podman secret on
## the server, never in a file, a unit or the logs).
# portal_aap_token: >-
#   {{ lookup('ansible.builtin.env', 'CONTROLLER_OAUTH_TOKEN') or lookup('ansible.builtin.env', 'AAP_TOKEN')
#      or lookup('ansible.builtin.env', 'TOWER_OAUTH_TOKEN') }}

# ---- site_email - usually in all.yml -------------------------------------------------------------
## THE REPORT WEBSITE (docs/WEB_REPORTS.md): every report job also writes its report as a web page -
## off until report_web_dest is set. Works without an email (report_email_to empty). Each run: its
## page, a copy as the template's latest page, the report's data as JSON beside each (for your own
## site), and an index of every report's last run. The job prints the page's address ("Report:
## https://...") and keeps it as the job artifact site_report_url. Where the files go: a folder the
## job can write - a share mounted on the AAP execution nodes and exposed to jobs (Settings > Job
## settings > Paths to expose to isolated jobs), e.g. /mnt/reports - or an https:// address that
## takes uploads (HTTP PUT, WebDAV: nginx, Apache, IIS) - or a Windows file share's folder, written
## over SMB with no mount: '\\fileserver\its\aap\reports' (the folder there already; smbprotocol in
## the execution environment). An upload's or a share's login comes from a "Report website"
## credential (aap/credential_types/report_web.yml).
# report_web_dest: ""
