## ---- 1.85.0: the live Network map (docs/NETWORK_MAP.md, "Live on the portal")
## ----------------------------------------------- The portal's server reads SolarWinds (SWQL
## queries only, the report job's own reader) every netmap_live_seconds while someone has the page
## open - one read every viewer shares - and the page animates what changed. auto: on when the
## deploy job has a "SolarWinds (read-only)" credential; true: on (the deploy stops without one);
## false: off (no page, no menu entry). The map's own settings are the report's (usually in
## all.yml): netmap_site_by, netmap_site_pattern, netmap_hierarchy, netmap_roles, netmap_site_split,
## netmap_sites, netmap_lat_property, netmap_lon_property, netmap_properties, netmap_view,
## netmap_link_warn_percent, netmap_max_nodes. 1.102.0: the AD layer (netmap_ad_layer, ad_site_map,
## ad_repl_*_hours) reads the AD job's replication from the report database (1.101.2's tables, the
## portal's read-only login); without them it is off and says so. 1.95.0: the page shows the last
## map the server kept (on disk, kept through a restart) at once, "as of" its time, and the server
## reads again behind it: the node and link status every netmap_live_seconds (2 queries), the whole
## map every netmap_full_seconds. Nothing is read while nobody has the page open.
# portal_netmap: auto

## the status read: how often (30 at least); after 5 minutes with nobody on the page it is not read
## until someone opens it
# netmap_live_seconds: 60

## 1.95.0: the whole read (the nodes, their sites, the links: about 15 queries) at most this often
## (300 at least)
# netmap_full_seconds: 1800

## SolarWinds' address and certificate check: the credential's, else netmap_solarwinds_url /
## netmap_validate_certs
# portal_solarwinds_url: "{{ lookup('ansible.builtin.env', 'SOLARWINDS_URL') or netmap_solarwinds_url | default('') }}"

## check SolarWinds' certificate (the credential's verify, else netmap_validate_certs)
# portal_solarwinds_validate_certs: >-
#   {{ (lookup('ansible.builtin.env', 'SOLARWINDS_VERIFY') or (netmap_validate_certs | default(true) | string)) | lower not in ['0', 'false', 'no', 'off'] }}

## the CA that signed SolarWinds' certificate, a file ON THE PORTAL SERVER (PEM), added to what the
## service trusts; "" = the server's own CAs (portal_trust_host_cas) only
# portal_solarwinds_ca_file: ""

