# ---- check_mariadb -------------------------------------------------------------------------------
## Which hosts: members of any of the inventory groups mariadb_hosts, mysql_hosts, database_hosts,
## mariadb or mysql, or any host that names a container below (or turns discovery on). Set this
## true/false to override for a host or group.
# check_mariadb_enabled: >-
#   {{ (group_names | intersect(['mariadb_hosts', 'mysql_hosts', 'database_hosts', 'mariadb', 'mysql']) | length > 0)
#      or (check_mariadb_container | length > 0) or (check_mariadb_containers | length > 0)
#      or (check_mariadb_container_discover | bool) }}

## MariaDB or MySQL in podman containers (e.g. the ServiceNow database). The client inside each
## container is used (podman exec). Name them in one of these ways; all are checked, each as its own
## instance: check_mariadb_container: mariadb one container check_mariadb_containers: [mariadb,
## snow-db] several containers on the same host check_mariadb_container_discover: true find them:
## every container (running or not) whose image matches check_mariadb_container_image_regex With
## none of them, `auto` (the default) decides by itself: a database SERVER installed on the host
## (one of check_mariadb_server_paths) -> the host's own database (its systemd unit); no server on
## the host but podman -> the containers are found as with discovery. So a unit that only starts
## podman containers (and is then inactive) is not mistaken for the database. false = always the
## host's own.
# check_mariadb_container: ""

## several containers on one host, e.g. [mariadb, snow-db] (see above)
# check_mariadb_containers: []

## auto, true or false: find database containers by their image (see above)
# check_mariadb_container_discover: auto

## Where a database server installed on the host lives (any one present = a host install, for
## `auto`).
# check_mariadb_server_paths: [/usr/sbin/mariadbd, /usr/libexec/mariadbd, /usr/sbin/mysqld, /usr/libexec/mysqld,
#                              /usr/bin/mariadbd, /usr/bin/mysqld]

## regular expression: a container whose image matches is a database (discovery)
# check_mariadb_container_image_regex: '(mariadb|mysql|percona)'

## ROOTLESS podman: the containers belong to a user (e.g. AAP's own MariaDB, or an application
## account), and only that user can see them. Name the user and the check runs podman AS that user.
## Empty = root's containers.
# check_mariadb_container_user: ""

## The systemd unit (host installs). Empty = the first of mariadb, mysqld, mysql that exists.
# check_mariadb_service: ""

## How to log in. Without a credential: as root through the local socket - MariaDB's default for a
## host install on RHEL (no password needed when the job runs with sudo). A database in a CONTAINER
## usually gives root a password (the official images do), and MySQL host installs usually do too,
## so there attach the "MariaDB monitor" AAP credential (it serves MySQL as well): it sets
## MARIADB_MONITOR_USER / MARIADB_MONITOR_PASSWORD, and the password reaches the client only through
## the environment (never the command line). The read-only monitoring account needs only (MySQL):
## GRANT PROCESS, REPLICATION CLIENT ON *.* TO 'monitor'@'localhost'; and, for Group Replication:
## GRANT SELECT ON performance_schema.* TO 'monitor'@'localhost'; MariaDB 10.5.9 and later
## (REPLICATION CLIENT no longer covers replication status there): GRANT PROCESS, REPLICA MONITOR ON
## *.* TO 'monitor'@'localhost'; (before 10.5.9: PROCESS, REPLICATION CLIENT) Extra client options,
## e.g. ['--socket=/var/lib/mysql/mysql.sock'] or ['--host=127.0.0.1', '--port=3306']
# check_mariadb_client_args: []

## connections in use, % of max_connections
# check_mariadb_conn_warn_pct: 80

## connections in use, % of max_connections -> critical
# check_mariadb_conn_crit_pct: 95

## queries executing at this moment
# check_mariadb_threads_running_warn: 32

## a query running longer than this is "long"
# check_mariadb_long_query_seconds: 300

## seconds a replica is behind its primary
# check_mariadb_replica_lag_warn: 300

## seconds behind its primary -> critical
# check_mariadb_replica_lag_crit: 1800

## expected Galera / XtraDB Cluster size (0 = do not check the size)
# check_mariadb_galera_size: 0

## expected MySQL Group Replication members (0 = do not check the size)
# check_mariadb_group_size: 0

## restarted less than this ago -> warning
# check_mariadb_restart_warn_minutes: 60

## % of reads served from memory (only judged after 1M reads)
# check_mariadb_bufferpool_hit_warn: 95

## [ERROR] lines in its log this recent
# check_mariadb_error_since_days: 1

## the filesystem holding the data directory
# check_mariadb_disk_warn_pct: 85

## % used of the data directory's filesystem -> critical
# check_mariadb_disk_crit_pct: 95

## ---- PERFORMANCE (all warnings) ----------------------------------------------------------------
## false = only the health checks above. Counters that count since the server started (slow queries,
## temporary tables, joins, lock waits, deadlocks ...) are judged as an average since that start,
## and only once it has run check_mariadb_perf_min_uptime_hours (cold caches right after a start are
## normal). Old transactions, lock waits, purge lag and open files are judged as they are now.
# check_mariadb_performance: true

## judge the averages since the start only after this many hours
# check_mariadb_perf_min_uptime_hours: 2

## queries slower than long_query_time, per hour
# check_mariadb_slow_per_hour_warn: 60

## % of temporary tables that went to disk (judged after 1000 of them)
# check_mariadb_tmp_disk_pct_warn: 25

## joins without a usable index (Select_full_join), per hour
# check_mariadb_full_join_per_hour_warn: 100

## % of table locks (MyISAM / Aria) that had to wait (judged after 10000)
# check_mariadb_table_lock_wait_pct_warn: 1

## average InnoDB row lock wait, ms (judged after 100 waits)
# check_mariadb_row_lock_avg_ms_warn: 500

## InnoDB deadlocks per hour (judged after 10 of them)
# check_mariadb_deadlocks_per_hour_warn: 1

## waits for a free buffer pool page / a full log buffer, per hour (after 10)
# check_mariadb_innodb_waits_per_hour_warn: 1

## failed connection attempts per hour
# check_mariadb_aborted_connects_per_hour_warn: 60

## tables opened per hour while the table cache is full
# check_mariadb_table_open_per_hour_warn: 600

## files open, % of open_files_limit
# check_mariadb_open_files_warn_pct: 85

## a session waiting this long for a lock, right now
# check_mariadb_lock_wait_seconds: 30

## an InnoDB transaction open this long, right now
# check_mariadb_long_trx_seconds: 600

## InnoDB history list length (old row versions not yet purged)
# check_mariadb_history_length_warn: 1000000

# ---- site_email - usually in all.yml -------------------------------------------------------------
## Who gets it: a list, or text with commas / spaces / one per line (a survey answer). Empty = no
## email. Set it on each TEMPLATE (its Variables, or a survey): in all.yml every report job emails.
# report_email_to: []

## copied: a list, or text like report_email_to
# report_email_cc: []

## the sender, e.g. aap-noreply@yoursite.mil
# report_email_from: ""

## your mail relay, e.g. smtp.yoursite.mil
# report_email_smtp_host: ""

## 25 or 587 with starttls, 465 with ssl
# report_email_smtp_port: 25

