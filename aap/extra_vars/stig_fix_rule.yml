# ---- check_stig ----------------------------------------------------------------------------------
## ---- STIG Manager (read-only)
## --------------------------------------------------------------------------------- The job logs in
## as a Keycloak client with the client credentials grant - your autostig client, or another one -
## from the "STIG Manager API" credential (STIGMAN_TOKEN_URL, STIGMAN_CLIENT_ID,
## STIGMAN_CLIENT_SECRET), or from the check_stig_stigman_token_url / _client_id / _client_secret
## settings (keep the secret in a vault). The client needs the scope stig-manager:collection:read
## and a grant (Restricted is enough) in the collections to read. STIG Manager's API, e.g.
## https://stigman.example.mil/api ; empty = not compared with STIG Manager (only with the host's
## earlier scans)
# check_stig_stigman_api: ""

## Keycloak's token endpoint (https://keycloak.example.mil/realms/stigman/protocol/openid-
## connect/token); empty = the credential's
# check_stig_stigman_token_url: ""

## the client, e.g. autostig; empty = the credential's
# check_stig_stigman_client_id: ""

## its secret (vault it); empty = the credential's
# check_stig_stigman_client_secret: ""

## scopes to ask for, e.g. "stig-manager:collection:read"; empty = the client's default scopes
# check_stig_stigman_scope: ""

## check the HTTPS certificates of STIG Manager and Keycloak
# check_stig_stigman_validate_certs: true

## a CA bundle on the AAP side to check them with (the DoD roots); empty = the execution
## environment's
# check_stig_stigman_ca_path: ""

## seconds per request
# check_stig_stigman_timeout: 60

