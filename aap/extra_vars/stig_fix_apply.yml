## Workflow 47's step after the approval: runs exactly the approved commands. Prompt on launch for Variables and Limit.

# ---- portal_stig ---------------------------------------------------------------------------------
## Workflow 47: rules ACT never proposes a fix for - a person changes them by hand. Each is a name
## and a regular expression, matched (any case) in the rule's title, check text and fix text. A rule
## whose fix text says to restart the system is refused too, whatever this says.
# portal_stig_fix_never:
#   - name: accounts
#     pattern: '\baccounts?\b|\buser (?:id|name)s?\b|\bpasswords?\b|\bpasswd\b|/etc/shadow|\buseradd\b|\busermod\b'
#   - name: authentication
#     pattern: 'authenticat|\bmulti-?factor\b|\bsmart ?card\b|\bpkinit\b|\bkerberos\b|\bsssd\b'
#   - name: PAM
#     pattern: '\bpam\b|pam_|/etc/pam\.d|\bauthselect\b'
#   - name: sudo
#     pattern: '/etc/sudoers|\bsudoers\b|\bNOPASSWD\b|!authenticate|\btimestamp_timeout\b|\bsudo (?:group|privileges?|rules?|configuration|access)\b|\bwheel group\b'
#   - name: SSH authentication
#     pattern: '\b(?:PermitRootLogin|PasswordAuthentication|PubkeyAuthentication|PermitEmptyPasswords|ChallengeResponseAuthentication|KbdInteractiveAuthentication|GSSAPIAuthentication|KerberosAuthentication|HostbasedAuthentication|UsePAM|AuthorizedKeys\w*)\b'
#   - name: crypto and FIPS
#     pattern: '\bfips\b|crypto|\bciphers?\b|\bMACs\b|\bKexAlgorithms\b|\bopenssl\b|\btls\b|\bssl\b'
#   - name: audit configuration
#     pattern: '\bauditd?\b|audit\.rules|/etc/audit|\bauditctl\b|\baugenrules\b'
#   - name: SELinux mode
#     pattern: 'selinux.{0,40}\b(?:mode|state|enforcing|permissive|disabled)\b|\bsetenforce\b|/etc/selinux/config'
#   - name: firewall default policy
#     pattern: 'firewall.{0,60}\bdefault\b|\bdefault[- ]zone\b|\bdefault (?:policy|deny)\b|--set-default-zone|\btarget=DROP\b'

## Workflow 47: seconds for each approved command on the host.
