# Credential type: "Keystore password"
# Optional, for the certs check on a PKCS12 keystore (JKS keystores list without a password).
# In the inventory, name the variable, never the password:
#   check_certs_keystores: [{path: /path/to/keystore, password_env: KEYSTORE_PASSWORD}]
inputs:
  fields:
    - id: password
      type: string
      label: Keystore password
      secret: true
  required: [password]
injectors:
  env:
    KEYSTORE_PASSWORD: "{{ password }}"
