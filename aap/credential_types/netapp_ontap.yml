# Credential type: "NetApp ONTAP"
# A read-only ONTAP account for the NetApp ONTAP health report (playbooks/ontap_health_report.yml).
# The same account (user name and password) must exist on every cluster in ontap_clusters, with the
# built-in "readonly" role for the http application (docs/NETAPP.md).
inputs:
  fields:
    - id: username
      type: string
      label: ONTAP user name
    - id: password
      type: string
      label: ONTAP password
      secret: true
  required: [username, password]
injectors:
  env:
    ONTAP_USERNAME: "{{ username }}"
    ONTAP_PASSWORD: "{{ password }}"
