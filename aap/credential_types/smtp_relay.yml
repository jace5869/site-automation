# Credential type: "SMTP relay"
# Only when your mail relay needs a login to send. The jobs that email a report (report_email_to,
# roles/site_email) read SMTP_USERNAME / SMTP_PASSWORD from it. A relay that accepts mail from the
# AAP server without a login needs no credential.
inputs:
  fields:
    - id: username
      type: string
      label: SMTP user name
    - id: password
      type: string
      label: SMTP password
      secret: true
  required: [username, password]
injectors:
  env:
    SMTP_USERNAME: "{{ username }}"
    SMTP_PASSWORD: "{{ password }}"
