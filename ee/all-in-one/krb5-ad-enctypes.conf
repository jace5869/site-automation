# Kerberos to Active Directory from a FIPS host (STIG). The EE's Kerberos would follow the host's FIPS
# policy and offer only AES with SHA-2, while Active Directory's keys are AES with SHA-1: "KDC has no
# support for encryption type". This allows both AES kinds - never RC4 or DES.
[libdefaults]
  permitted_enctypes = aes256-sha2 aes128-sha2 aes256-sha1 aes128-sha1
