---
# The site portal - the report website, the actions a report offers (Run, after a confirm page), the live view of a
# job and the approvals - one container on podman, managed by systemd through a Quadlet unit file: site-portal-app.
# Two ways to put it on the network (docs/SITE_PORTAL.md):
#   - behind the reverse proxy you have (STIG Manager's nginx, in its podman container) at /portal/ - the default:
#     that nginx does TLS and the client certificates (mTLS, the CAC) and passes who it verified. The role joins the
#     service to that nginx's podman network and writes the nginx lines to add (portal_config_dir/nginx-portal.conf);
#     it never changes that nginx, its files, its network or any other container. As roles/vmware_ask_stack.
#   - portal_own_nginx: true - a server of its own: the role adds an nginx container (site-portal-nginx) with TLS and
#     the client certificates, on a podman network of its own (site-portal), and opens its port.
# Needs podman >= 4.4 (Quadlet): RHEL 9.2+ / RHEL 8.8+.

# system = rootful (/etc/containers/systemd, systemctl)          <- production
# user   = rootless (~/.config/containers/systemd, systemctl --user) <- tests / rootless hosts
portal_scope: system

# the service's image: any image with Python 3.8 or later (it uses the standard library only). The site's execution
# environment has it already: pull it from your automation hub
portal_image: aap.example.mil/site-ee-all:1
portal_pull_images: false                         # true = a missing image is pulled (a host that reaches a registry); false (the default) = the job stops first, naming it, and nothing is changed

portal_config_dir: /etc/site-portal                 # the service's files, and nginx-portal.conf (the nginx lines to add)
# behind STIG Manager's nginx: the podman network of that nginx container (required then): `sudo podman ps --format
# "{{.Names}} {{.Networks}}"` shows it. It must exist with DNS on (not podman's default "podman"); the role never
# creates or changes it
portal_network: ""
portal_path: /portal/                               # the portal's path on the proxy
# 1.68.1: STIG scorecard links that open the review (stigman_link_style: open; behind STIG Manager's nginx only - the
# link and STIG Manager's page must be one site). The role writes nginx-stigman-links.conf, lines a person adds to that
# nginx (docs/CKL_IMPORT.md, "Links that open the review"): STIG Manager's page with the portal's script added.
portal_stigman_path: /                             # where STIG Manager's page is on that nginx
portal_stigman_upstream: http://stigman-api:54000  # STIG Manager's address in your location / (roles/stigman_stack's); STIG Manager under /stigman/: as in your location /stigman/, with its / at the end (http://stigman-api:54000/)
# the STIG Manager versions the script was tested on - on another it does nothing (a plain link). Add one only after a test
portal_stigman_open_versions: ["1.6.16", "1.6.17", "1.6.18"]
# the portal's address, as people open it (said at the end)
portal_public_url: "https://{{ portal_server_name }}{{ (':' ~ portal_port) if portal_own_nginx | bool and portal_port | int != 443 else '' }}{{ portal_path }}"
# 1.78.3: the running icons and the progress stripe turn; 1.87.0: also the pages' motion - cards and tiles come in, counts go up, a card lifts, the job's ring
# moves, toasts slide in, panels open smoothly. auto: unless the system asks for reduced motion (as now); always: even then (their image may turn animations off
# by policy - use it only if the site agrees); off: never. Print is still in every mode.
portal_motion: auto                              # auto | always | off
# 1.115.0: the Christmas theme on the portal's pages (docs/SITE_PORTAL.md) - none | christmas | auto (Dec 1 to Jan 6, decided on each page). Default: the
# report website's report_theme_season, so both follow one setting; its look and parts are report_theme_season_style, _lights, _twinkle, _snow, _sleigh.
portal_theme_season: "{{ report_theme_season | default('none') }}"
portal_title: Site portal                           # the pages' title
# 1.78.2: the site's logo in the header, instead of the letter badge (40 px tall at most; alt text = portal_title). portal_logo is a PNG, JPEG,
# GIF or WebP file (1 MB at most) ON THE PORTAL SERVER, e.g. "{{ portal_config_dir }}/logo.png"; portal_logo_src is a file on the controller
# (in your own .site-local or group_vars area, never in the repo) that the deploy copies there. "" = the badge.
portal_logo: "{{ (portal_config_dir ~ '/logo' ~ (portal_logo_src | splitext)[1]) if portal_logo_src | length > 0 else '' }}"   # the image on the portal server; with portal_logo_src set: portal_config_dir/logo + its extension; "" = the badge
portal_logo_src: ""                              # the image on the controller, copied to portal_logo by the deploy ("" = nothing copied)
# The banner and the times are the reports' own settings (usually in all.yml), so the portal and the report pages match:
# report_banner (auto: on in the classified enclave), report_banner_text, report_banner_color, site_enclave and
# site_enclave_classified_domains (the portal's server is the host held to them); report_time_zone ("" = UTC).

# the report website: the folder on this host the report jobs write the pages to (report_web_dest's folder, e.g. the
# folder STIG Manager's nginx serves /reports/ from). Read-only for the portal; served at /portal/reports/
portal_reports_dir: /srv/reports
# how that folder is mounted: ro,z = read-only, SELinux label shared with other containers (a folder another container
# mounts with :Z, a private label, is relabeled by that container's next start - see docs/SITE_PORTAL.md, SELinux)
portal_reports_mount: ro,z

# ---- who may do what: the CN of each person's card certificate (LAST.FIRST.MI.1234567890) -------------------------------
portal_readers: []                                  # card CNs allowed to view. With both reader lists empty, any verified card may view.
portal_reader_groups: []                            # AD groups allowed to view (names or DNs). Named and AD requesters and approvers always have reader access.
portal_access_contact: ""                           # contact shown on reader refusal. Empty uses "your portal administrator".
portal_requesters: []                               # card CNs allowed to run actions. Both requester lists empty = any reader. An action's own who overrides.
portal_approvers: []                                # who may approve or deny on /portal/approvals; [] = nobody (AAP's own page still works)
portal_launches_per_hour: 20                        # one person's launches in an hour, at most
portal_vm_deploy_placement_template: "VM - deploy placement change"  # AAP job that checks and records a placement before approval
portal_allow_self_approval: false                   # true = an approver may approve or deny a run they started themselves
# Readers, approvers and requesters from AD groups (each person still needs a verified card). A group's name (its cn or
# sAMAccountName) or its DN; members of nested groups count, a disabled account never. Read over LDAP with the "LDAP Bind
# Account" credential on this job's template (portal_ldap_vars), every portal_ad_groups_seconds, kept. AD not read: only
# explicitly named card CNs count for those roles (with groups set, an empty portal_requesters is nobody - never everyone).
# 1.129.1: DOMAIN\Group works too (the DOMAIN\ part is dropped) - in YAML write it in SINGLE quotes ('CORP\Group'): in double
# quotes a backslash starts an escape (\U, \x ...) and all.yml no longer loads.
portal_approver_groups: []                          # e.g. [AAP-Approvers] or ["CN=AAP-Approvers,OU=Groups,DC=corp,DC=example,DC=mil"]
portal_requester_groups: []                         # the same for who may run the actions (with portal_requesters); [] = none
portal_ad_card_attribute: userPrincipalName         # the AD account attribute a card is matched by (altSecurityIdentities is multi-valued: fine)
portal_ad_card_match: "{edipi}@mil"                 # its value: {edipi} = the 10 digits at the end of the card's CN, {cn} = the CN; * and ? match anything. 1.130.1: exact again - a contractor site sets "{edipi}.ctr@mil"; never a * after {edipi}: it would also match the same person's other accounts (1234567890.adm@mil)
portal_ad_groups_seconds: 300                       # how often the members are read (60 to 3600); 60 s after a failed read
portal_ldap_server: ""                              # a DC (or several, comma-separated); "" = the inventory's DCs (win_dc / domain_controllers), else portal_ldap_domain's from DNS
portal_ldap_domain: "{{ ad_reader_domain | default('') }}"   # the domain's DNS name (its DCs from DNS; the base DN from it)
portal_ldap_base: ""                                # where the groups and users are searched; "" = from portal_ldap_domain, else the DC's defaultNamingContext
portal_ldap_starttls: false                         # true = StartTLS on 389 when LDAPS (636) does not answer - never a bind in clear
portal_ldap_validate_certs: true                    # the DC's certificate checked (the server's trust, as for AAP) before the password is sent
portal_ldap_ports: {ldaps: 636, ldap: 389}          # the ports the DCs answer LDAPS and LDAP (StartTLS) on
portal_ldap_timeout: 5                              # seconds per connection

# ---- the actions: {} = the role's files/actions.yml; a dict of the same shape here replaces it -----------------------
portal_actions: {}
# 1.75.3: your own actions, beside the built-in ones (same shape as actions.yml's actions, checked by the same rules; a name a built-in
# has is an error), and built-in actions to hide (a list of their names). docs/SITE_PORTAL.md, "Adding your own action".
portal_actions_extra: {}
portal_actions_off: []                            # built-in actions to hide: a list of their names (one that is no action is an error)
# 1.78.1: point a built-in action at your own template or workflow name in AAP, so nothing is renamed there: {action: "Your name"} or
# {action: {type: job|workflow, name: "Your name"}} (the type stays the built-in's unless given). An action that is no action is an
# error; two actions that would run one template are an error. The deploy says "points at <name>" and whether AAP has it.
portal_aap_names: {}
# 1.78.1c: card titles without renaming anything in AAP: {"AAP template name": "Portal card title"} (matched by the exact name, any case; a title is
# 1 to 80 characters). A label "portal-title:<text>" on the template does the same; this setting wins. A title that is empty or too long is an error.
portal_titles: {}
portal_label_title: "portal-title:"               # the label that gives a card its title (the rest of the label is the title)
# 1.75.3: "pick a host, then a finding" - an action that takes report_job and finding_id, opened with no values, asks for the host(s) and
# lists what the report jobs found there (their site_findings artifact), so nobody types a job id. The last portal_finding_jobs runs of each
# report playbook that finished within portal_finding_days (at most finding_ref_max_age_days, 14) are read: successful and failed (a report
# that found something ends failed). The portal's AAP account needs Organization Auditor to read them (portal_setup_portal_auditor).
portal_finding_days: 7                            # how many days back the report jobs are read (14 at most)
portal_finding_jobs: 5                            # the last this many runs of each report playbook are read (10 at most)
portal_pick_max_launches: 10                      # one confirm page starts this many jobs at most (one per ticked finding); over it the page says so (1 to 200)
portal_pick_max_hosts: 50                         # 1.78.2: the hosts "pick a host, then a finding" takes at once (groups counted by their hosts; 1 to 500)
portal_action_max_hosts: 50                       # 1.78.2: the hosts one built-in action's Limit may stand for - one job for a group or several hosts (1 to 500)
# 1.78.0: actions found in AAP, like a catalogue: a job template or workflow the portal's account has Execute on AND that carries the AAP
# label below is added to the portal - no edit here, no redeploy; take Execute or the label away and it goes at the next refresh. The form is the
# template's survey; the card's area is a label "portal-area:STIG" (else Other), its title the template's name, its line the description.
portal_label: portal                              # the AAP label that marks a template for the portal ('' = no discovery)
portal_discover_seconds: 60                       # how long what was found is kept (10 to 3600)
portal_label_approval: portal-approval            # a template with this label too is marked "approval" on its card
portal_label_alone: portal-alone                  # 1.92.0: a workflow step with this label too keeps its own card (a useful report alone)
portal_area_rules: []                             # 1.78.4: [{match: "Linux - *", area: Linux}] - the area of a found template with no portal-area: label and no area for its playbook (* and ? only, any case, first match wins)
portal_label_area: "portal-area:"                 # a label that starts with this puts the card in an area (the rest of the label is its name)
portal_label_icon: "portal-icon:"                 # prefix for an optional card icon label, e.g. portal-icon:users (see Card icons in docs/SITE_PORTAL.md)
portal_approval_required: []                      # template names that are marked "approval" without the label
portal_inventories_max: 10                        # 1.78.4: found templates' Limits are checked against their own inventory; at most this many distinct inventories (1 to 50), the rest are skipped with a reason
portal_limit_max: 50                              # a found template's Limit stands for this many hosts at most (groups counted by their hosts; 1 to 500)
# 1.129.0: the picker of a Windows job (a found template whose playbook is playbooks/win_*.yml, or a workflow named "Windows ...")
# lists only the inventory's Windows hosts, and a group there stands for its Windows hosts. A host is Windows when it is in a group
# whose name matches one of groups (globs, any case), or when one of vars matches: the host's own value, else a group's, else the
# inventory's (what AAP's API shows - a dynamic source's host variables count; playbooks/group_vars in the project do not). A
# dotted name reads into a mapping (config.guestId); group priority as Ansible. {} = the filter is off (every host is listed). A
# rule that matches no host lists none and refuses the launch (set it to your Windows group or variable).
portal_windows_hosts_from:
  groups: ["*windows*"]
  vars:
    ansible_connection: [winrm, psrp, ansible.builtin.winrm, ansible.builtin.psrp]
    ansible_shell_type: [powershell, cmd]
# 1.129.0: a playbook's own cap of hosts in one run (its file name): the picker and the launch use it when it is lower than
# portal_limit_max. var: the template's Variables may set it (then that value counts), max: else this. Windows - schedule
# a restart and cancel: win_restart_max_hosts (50).
portal_limit_max_playbooks:
  win_restart_schedule.yml: {var: win_restart_max_hosts, max: "{{ win_restart_max_hosts | default(50) }}"}
  win_restart_cancel.yml: {var: win_restart_max_hosts, max: "{{ win_restart_max_hosts | default(50) }}"}
# the report playbooks whose jobs are read (finding_ref_report_playbooks + _extra: the ones finding_ref takes a finding from)
portal_finding_playbooks: >-
  {{ (finding_ref_report_playbooks | default(['health_check.yml', 'win_health_check.yml', 'troubleshoot.yml', 'win_troubleshoot.yml', 'disk_report.yml',
     'fapolicyd*.yml', 'stig_drift_report.yml', 'win_stig_drift_report.yml', 'stigman_ckl_import.yml', 'service_watch.yml']))
     + (finding_ref_report_playbooks_extra | default([])) }}
# the AAP inventory whose hosts an action's inventory_host values must be (by name; required when an action has one)
portal_inventory: ""

# ---- AAP: the "Red Hat Ansible Automation Platform" credential (its URL and a token of the portal's own account) ------
portal_aap_url: >-
  {{ lookup('ansible.builtin.env', 'CONTROLLER_HOST') or lookup('ansible.builtin.env', 'AAP_HOSTNAME')
     or lookup('ansible.builtin.env', 'TOWER_HOST') }}
# check AAP's certificate (the credential's verify setting; the CAs: portal_trust_host_cas)
portal_aap_validate_certs: >-
  {{ (lookup('ansible.builtin.env', 'CONTROLLER_VERIFY_SSL') or lookup('ansible.builtin.env', 'AAP_VALIDATE_CERTS')
      or 'true') | lower not in ['0', 'false', 'no', 'off'] }}
portal_aap_ui: ""                                   # AAP's address for the "Open in AAP" links, as people open it ("" = portal_aap_url)
portal_aap_timeout: 30                              # seconds an AAP call may take
portal_trust_host_cas: true                         # the service trusts what this server trusts (/etc/pki/ca-trust): AAP's certificate
portal_job_events: 300                              # recent AAP events to show in readable job output
portal_job_output_emoji: true                       # show emoji beside status words in job output (false uses text markers such as [OK])
portal_check_jinja: true                            # read AAP's ALLOW_JINJA_IN_EXTRA_VARS and warn when it is "always"

# ---- portal_own_nginx: true - its own nginx with TLS and client certificates, for a server of its own -----------------
portal_own_nginx: false
portal_nginx_image: docker.io/library/nginx:stable  # pin the tag your site uses (an enclave: its registry's copy)
portal_server_name: "{{ inventory_hostname }}"           # its own nginx's name (server_name), and the address's
portal_port: 443                                    # the port on this server
portal_cert_file: ""                                # the server's certificate (PEM, its chain after it), a path on this server
portal_key_file: ""                                 # its key (PEM, not encrypted), a path on this server
portal_ca_file: ""                                  # the CAs the cards' certificates are signed by (PEM), a path on this server
portal_crl_file: ""                                 # optional: their revocation list (PEM), a path on this server
portal_verify_depth: 3                              # how deep a card's chain may be
portal_firewall: true                               # open portal_port in firewalld (own nginx only)

# How long to wait after (re)starting for the service to answer
portal_ready_retries: 30
portal_ready_delay: 4                               # seconds between those tries

# ---- 1.85.0: the live Network map (docs/NETWORK_MAP.md, "Live on the portal") -----------------------------------------------
# The portal's server reads SolarWinds (SWQL queries only, the report job's own reader) every netmap_live_seconds while
# someone has the page open - one read every viewer shares - and the page animates what changed. auto: on when the deploy
# job has a "SolarWinds (read-only)" credential; true: on (the deploy stops without one); false: off (no page, no menu
# entry). The map's own settings are the report's (usually in all.yml): netmap_site_by, netmap_site_pattern, netmap_hierarchy,
# netmap_roles, netmap_site_split, netmap_sites, netmap_lat_property, netmap_lon_property, netmap_properties, netmap_view,
# netmap_link_warn_percent, netmap_max_nodes. 1.102.0: the AD layer (netmap_ad_layer, ad_site_map, ad_repl_*_hours) reads
# the AD job's replication from the report database (1.101.2's tables, the portal's read-only login); without them it is off
# and says so.
# 1.95.0: the page shows the last map the server kept (on disk, kept through a restart) at once, "as of" its time, and the
# server reads again behind it: the node and link status every netmap_live_seconds (2 queries), the whole map every
# netmap_full_seconds. Nothing is read while nobody has the page open.
portal_netmap: auto
netmap_live_seconds: 60                             # the status read: how often (30 at least); after 5 minutes with nobody on the page it is not read until someone opens it
netmap_full_seconds: 1800                           # 1.95.0: the whole read (the nodes, their sites, the links: about 15 queries) at most this often (300 at least)
# SolarWinds' address and certificate check: the credential's, else netmap_solarwinds_url / netmap_validate_certs
portal_solarwinds_url: "{{ lookup('ansible.builtin.env', 'SOLARWINDS_URL') or netmap_solarwinds_url | default('') }}"
# check SolarWinds' certificate (the credential's verify, else netmap_validate_certs)
portal_solarwinds_validate_certs: >-
  {{ (lookup('ansible.builtin.env', 'SOLARWINDS_VERIFY') or (netmap_validate_certs | default(true) | string)) | lower not in ['0', 'false', 'no', 'off'] }}
# the CA that signed SolarWinds' certificate, a file ON THE PORTAL SERVER (PEM), added to what the service trusts; "" = the
# server's own CAs (portal_trust_host_cas) only
portal_solarwinds_ca_file: ""

# ---- 1.101.2: the live AD page (docs/SITE_PORTAL.md, "Active Directory") -----------------------------------------------------
# /portal/ad: the AD job's runs from the report database - each DC now and since when, its last 48 runs, the replication links
# that need a look, the last 7 days - and the link to the newest run's full report. The AD checks are the AD job's (schedule
# it, e.g. every 30 min); each DC's SolarWinds status is read by the portal's server every portal_ad_seconds with the
# Network map's SolarWinds login (none: not shown).
portal_ad: true
portal_ad_seconds: 600                              # the SolarWinds read: how often (120 at least); nothing is read while nobody has the page open
portal_ad_old_minutes: 90                           # the AD checks older than this are said to be old on the page
portal_ad_template: ""                              # two AD templates (two forests): the ID of the one the page shows; "" = the newest run's
# ---- the NetApp page (docs/SITE_PORTAL.md, "The NetApp page"; docs/NETAPP.md, "The live page") ----
# /portal/netapp: NetApp - refresh volume list's newest run from the report database (ontap_live_db on that job, with its
# "Report database" credential) - each LUN and volume, VMware datastores first, each least free first, with Expand... (NetApp -
# expand a volume, the choice and Check preselected), the aggregates (fullest first), SnapMirror, health, performance. The tab shows once the database has a run.
portal_netapp: true
portal_netapp_old_minutes: 60                       # a run older than this is said to be old on the page (the refresh runs every 15-30 min)
# ---- 1.130.0: the ops-center wall (docs/SITE_PORTAL.md, "The ops-center wall") -------------------------------------------
# /portal/wall: one page for a wall screen - Lights, Cockpit (the default) or Map, saved per viewer - with only the wall
# conditions below lit (routine alarms never). VMware is read live by the portal itself (one kept vCenter session, one property
# read a cycle, read-only calls only); Storage live from ONTAP only (GET only, portal_wall_ontap_clusters, the "NetApp ONTAP"
# credential) - without it Storage is not on the wall; the report database's NetApp refresh only fills the storage path
# card, as information. Freshness: LATE after 3 min, STALE after 10 min.
portal_wall: true
portal_wall_title: "{{ outage_ops_center | default('Ops center', true) }}"   # the tab's and the page's name: what your site calls its operations center
portal_wall_preview: true                           # a thin banner on every wall style (kiosk too): "Preview - a light may show OK when data is missing or late. Check vCenter / NetApp before acting." - set false once the wall is trusted
portal_wall_enclave: "{{ site_enclave | default('', true) }}"              # shown beside the title; one portal serves one enclave
portal_wall_seconds: 60                             # the collector reads vCenter (and ONTAP) every this many seconds (30 to 3600), whether or not anyone looks
portal_wall_auth_retry_minutes: 15                  # kept for the settings check (5 to 1440); 1.130.0: any unclear or refused login answer STOPS every wall login until the next Site portal - deploy
# vCenter: auto = on when this deploy has the "VMware vCenter" credential (the same account the VMware jobs use; read-only calls only).
# The credential's vCenter and these (vmware_vcenters: names, or name:port) are read with that account.
portal_wall_vcenter: auto                           # auto | true | false
portal_wall_vcenters: "{{ vmware_vcenters | default([], true) }}"   # more vCenters read with the same account (names, or name:port)
portal_wall_vcenter_validate_certs: "{{ vmware_validate_certs | default(true) }}"   # vCenter's certificate checked (the CAs: portal_trust_host_cas)
# ONTAP live: auto = on when this deploy has the "NetApp ONTAP" credential and ontap_clusters is set (GET only). Off: the wall's
# storage comes from the NetApp page's run in the report database (as old as that run).
portal_wall_ontap: auto                             # auto | true | false
portal_wall_ontap_clusters: "{{ ontap_clusters | default([], true) }}"   # the clusters read live (management names or addresses)
portal_wall_ontap_validate_certs: "{{ ontap_validate_certs | default(true) }}"   # ONTAP's certificate checked (the CAs: portal_trust_host_cas)
# The thresholds (docs/SITE_PORTAL.md, "Thresholds to confirm with each team"); "What the wall watches" shows the ones in force
portal_wall_datastore_warn: 85                      # a datastore this % used or more: warning (VMware / Storage team)
portal_wall_datastore_crit: 95                      # ... critical
portal_wall_aggr_warn: 85                           # an aggregate this % used or more: warning (Storage team)
portal_wall_aggr_crit: 97                           # ... critical
portal_wall_high_pct: 90                            # a host's or VM's CPU or memory at this % or more ...
portal_wall_high_minutes: 15                        # ... for this many minutes or longer: warning (shorter spikes stay off the wall)
portal_wall_maintenance_expected: []                # hosts whose maintenance mode is expected (names; * and ? match): quiet. Any other host in maintenance: warning
portal_wall_vm_heartbeat: true                      # a powered-on VM whose VMware Tools heartbeat is red: critical (false = off)
portal_wall_site_pattern: "{{ netmap_site_pattern | default('', true) }}"   # the site of a cluster / host / datastore: the regex's first group on its name; default the network map's netmap_site_pattern, "" = a 4-letter, 2-digit prefix (SITA01)
portal_wall_site_places: {}                         # the Map style's dots: {SITA01: DE} (a country code) or {SITA01: [10.4, 51.2]} (longitude, latitude); a site not here: netmap_sites ({lat, lon} by name or pattern, any case); none = the sites as a list
# Feedback (docs/SITE_PORTAL.md, "Wall feedback: how to open it and who sees it"): a Feedback button on the wall (hidden in kiosk),
# kept on the portal server (its data volume), listed at <portal>/wall/feedback for the readers. No email.
portal_wall_feedback: true
portal_wall_feedback_groups: []                     # AD groups that see and may use the button ([] = everyone who can open the wall)
portal_wall_feedback_readers: "{{ portal_approver_groups | default([], true) }}"   # AD groups that may open the list (the approvers' groups by default)
# The AD job's runs come from the report database (the AD job writes them: ad_db). auto: on when this deploy's job template
# has a "Report database" credential - attach it with the read-only account (report_reader: GRANT SELECT, SHOW VIEW,
# docs/REPORT_DATABASE.md); one podman secret on the server (site-portal-reportdb). A login that can write works too and
# is said (a warning). false: the page says the database is off.
portal_report_db: auto
portal_report_db_host: "{{ lookup('ansible.builtin.env', 'REPORT_DB_HOST') | trim }}"   # the server (the credential's)
portal_report_db_port: "{{ lookup('ansible.builtin.env', 'REPORT_DB_PORT') | default('3309', true) | int }}"   # its port (the credential's)
portal_report_db_name: "{{ lookup('ansible.builtin.env', 'REPORT_DB_NAME') | default('site_reports', true) | trim }}"   # the database (the credential's)
portal_report_db_user: "{{ lookup('ansible.builtin.env', 'REPORT_DB_USER') | trim }}"   # the account (the credential's; report_reader is enough)
portal_report_db_password: "{{ lookup('ansible.builtin.env', 'REPORT_DB_PASSWORD') }}"   # the credential's password (secret)
portal_report_db_tls: "{{ lookup('ansible.builtin.env', 'REPORT_DB_TLS') | default('false', true) | bool }}"   # TLS with the certificate checked (the credential's)
portal_report_db_ca_file: "{{ lookup('ansible.builtin.env', 'REPORT_DB_CA_FILE') | trim }}"   # on the controller: its text goes in the secret

# ---- Secrets: NEVER set these in a vars file or inventory ---------------------------------------------------------------
# From the AAP credential, as environment variables on the controller: the token of the portal's account (a podman
# secret on the server, never in a file, a unit or the logs).
portal_aap_token: >-
  {{ lookup('ansible.builtin.env', 'CONTROLLER_OAUTH_TOKEN') or lookup('ansible.builtin.env', 'AAP_TOKEN')
     or lookup('ansible.builtin.env', 'TOWER_OAUTH_TOKEN') }}
# 1.85.0: the "SolarWinds (read-only)" credential's login - one podman secret on the server (site-portal-swis), never in a
# file, a unit or the logs
# 1.120.0: the "LDAP Bind Account" credential's login for the AD groups: where it is in this job - the name of an environment variable
# the credential sets, or of an extra variable. The defaults are microsoft.ad's own pair (MICROSOFT_AD_LDAP_USERNAME / _PASSWORD), which
# the repo's type (aap/credential_types/ldap_bind_account.yml) sets too; a site's own type: its injector's names here (Credential Types >
# the type > Injector configuration). The user as given: a UPN (svc@corp.example.mil), DOMAIN\user or a DN. One podman secret on the
# server (site-portal-ldap), never in a file, a unit or the logs.
portal_ldap_vars: {user: MICROSOFT_AD_LDAP_USERNAME, password: MICROSOFT_AD_LDAP_PASSWORD}
portal_solarwinds_username: "{{ lookup('ansible.builtin.env', 'SOLARWINDS_USERNAME') }}"   # 1.85.0: the "SolarWinds (read-only)" credential's user
portal_solarwinds_password: "{{ lookup('ansible.builtin.env', 'SOLARWINDS_PASSWORD') }}"   # the credential's password (secret)
# 1.130.0: the wall's collector - the site's existing accounts, copied to the portal server as podman secrets (site-portal-vcenter,
# site-portal-ontap) the same way as the LDAP bind account: never in a file, a unit, the page, the API or the logs
portal_wall_vcenter_host: "{{ lookup('ansible.builtin.env', 'VMWARE_HOST') | trim }}"          # the "VMware vCenter" credential's vCenter
portal_wall_vcenter_username: "{{ lookup('ansible.builtin.env', 'VMWARE_USER') | trim }}"      # its account
portal_wall_vcenter_password: "{{ lookup('ansible.builtin.env', 'VMWARE_PASSWORD') }}"         # its password (secret)
portal_wall_ontap_username: "{{ lookup('ansible.builtin.env', 'ONTAP_USERNAME') | trim }}"     # the "NetApp ONTAP" credential's account
portal_wall_ontap_password: "{{ lookup('ansible.builtin.env', 'ONTAP_PASSWORD') }}"           # its password (secret)
