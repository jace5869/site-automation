---
# The job templates and workflows the site portal's actions launch (1.67.0 part C), as the job "AAP - set up portal
# actions" (playbooks/aap_portal_setup.yml) makes or brings them up to date in AAP. It never deletes one; one changed by
# hand since it wrote it is listed and left as it is (portal_setup_overwrite: true writes it again). docs/SITE_PORTAL.md,
# "Setting it up in AAP"; each workflow's steps: docs/WORKFLOWS_AND_SCHEDULES.md.
#
# templates: [{name, playbook, credentials, prompts, extra_vars, inventory, become, description}]
#   credentials  kinds: portal_setup_credentials names the AAP credential of each (machine, machine_windows, aap,
#                act_model_key, stigman_api, stigman_api_writer, windows_share ...); a kind not named there skips the template
#   prompts      {variables: true, limit: true} - Prompt on launch (the portal sends its values and the Limit)
#   inventory    a key of portal_setup_inventories (default: default)
# workflows: [{number, name, description, prompts, extra_vars, nodes}]
#   nodes        in order: {id, template: <a job template's name>} or {id, approval: {name, timeout (seconds), description}},
#                each with success / failure / always: [node ids] (a node in two lists has two parents;
#                all_parents_must_converge: true to wait for both); extra_data: {..} on a template's node (the
#                template prompts for Variables)
# A check -> approval -> apply workflow has the gate between the check and its approval (1.67.0): [check] --failure-->
# [gate: "Workflow gate - has a plan", extra_data {workflow_gate_var: <the check's artifact>}] --success--> [approval].
# A check that failed on an error, with no plan, ends there and never reaches the approval.
# Each developer's workflows in a block of their own, by number.

templates:
  # ---- 40, 44, 45 (1.67.0 parts A and B)
  - name: ACT - triage finding
    playbook: playbooks/act_triage_finding.yml
    credentials: [machine, act_model_key, aap]
    prompts: {variables: true, limit: true}
    description: Workflow 44's Linux step (fapolicyd findings), read only

  - name: Windows ACT - triage finding
    playbook: playbooks/act_triage_finding.yml
    credentials: [machine_windows, act_model_key, aap]
    prompts: {variables: true, limit: true}
    inventory: windows
    extra_vars: {portal_triage_os: windows}
    description: Workflow 44's Windows step (event-log findings), read only

  - name: STIG recheck
    playbook: playbooks/stig_recheck.yml
    credentials: [machine, stigman_api]
    prompts: {variables: true, limit: true}
    become: true

  - name: Windows STIG recheck
    playbook: playbooks/win_stig_recheck.yml
    credentials: [machine_windows, stigman_api]
    prompts: {variables: true, limit: true}
    inventory: windows

  - name: STIG Manager - import checklists - check
    playbook: playbooks/stigman_ckl_import.yml
    credentials: [stigman_api, windows_share]
    prompts: {variables: true}
    extra_vars: {stigman_ckl_import_workflow: true}
    description: Workflow 40's check (it fails on purpose when something waits for the approval)

  - name: Workflow gate - has a plan
    playbook: playbooks/workflow_gate.yml
    credentials: []
    prompts: {variables: true}
    description: "Between a check and its approval: on only when the check handed on a plan (workflow_gate_var)"

  - name: STIG Manager - update
    playbook: playbooks/stigman_update.yml
    credentials: [stigman_api_writer]
    prompts: {variables: true}
    description: Workflows 37 and 40, after the approval

  # ---- 49-51: nuc-dev-3 (Clean up, Restart, Allow this) and the space request and open ticket jobs (1.67.0 part E)
  - name: Disk - plan a clean up
    playbook: playbooks/disk_cleanup_plan.yml
    credentials: [machine, aap]
    prompts: {variables: true, limit: true}
    become: true
    description: Workflow 49's first step, read only - the tmp folders on the finding's mount and what they hold

  - name: Disk - clean up one mount
    playbook: playbooks/disk_cleanup.yml
    credentials: [machine, aap]
    prompts: {variables: true, limit: true}
    become: true
    description: Workflow 49's last step, after the approval - deletes what the plan lists, then reads the mount again

  - name: Service - look (Linux)
    playbook: playbooks/service_restart.yml
    credentials: [machine, aap]
    prompts: {variables: true, limit: true}
    become: true
    extra_vars: {portal_service_phase: look}
    description: Workflow 50's look step for a Linux service, read only

  - name: Service - look (Windows)
    playbook: playbooks/service_restart.yml
    credentials: [machine_windows, aap]
    prompts: {variables: true, limit: true}
    inventory: windows
    extra_vars: {portal_service_phase: look, portal_service_os: windows}
    description: Workflow 50's look step for a Windows service, read only

  - name: Service - restart (Linux)
    playbook: playbooks/service_restart.yml
    credentials: [machine, aap]
    prompts: {variables: true, limit: true}
    become: true
    extra_vars: {portal_service_phase: restart}
    description: Workflow 50's restart of that one Linux service, after the approval

  - name: Service - restart (Windows)
    playbook: playbooks/service_restart.yml
    credentials: [machine_windows, aap]
    prompts: {variables: true, limit: true}
    inventory: windows
    extra_vars: {portal_service_phase: restart, portal_service_os: windows}
    description: Workflow 50's restart of that one Windows service, after the approval

  - name: "fapolicyd - allow this: check"
    playbook: playbooks/fapolicyd_allow.yml
    credentials: [machine, aap]
    prompts: {variables: true, limit: true}
    become: true
    extra_vars: {portal_fapolicyd_phase: check}
    description: Workflow 51's check, read only - the one change for that denial

  - name: "fapolicyd - allow this: approved"
    playbook: playbooks/fapolicyd_allow.yml
    credentials: [machine, aap]
    prompts: {variables: true, limit: true}
    become: true
    extra_vars: {portal_fapolicyd_phase: approved}
    description: Workflow 51's last step, after the approval - makes that one line and reads the blocks again

  - name: Disk - space request
    playbook: playbooks/disk_space_request.yml
    credentials: [machine, aap]
    prompts: {variables: true, limit: true}
    become: true
    description: Writes a request for more space, read only, sends nothing

  - name: Site portal - open ticket
    playbook: playbooks/portal_open_ticket.yml
    credentials: [aap]
    prompts: {variables: true, limit: true}
    description: A ServiceNow incident for one finding - a draft unless portal_ticket_mode is live (then add the ServiceNow API credential by hand)

workflows:
  # ---- 40, 44, 45 (1.67.0 parts A and B)
  - number: 40
    name: Checklists imported into STIG Manager
    description: Checklists written into STIG Manager after a person approves them
    prompts: {variables: true}
    nodes:
      - {id: check, template: "STIG Manager - import checklists - check", failure: [gate]}
      - id: gate
        template: Workflow gate - has a plan
        extra_data: {workflow_gate_var: stigman_update_plan}
        success: [approve]
      - id: approve
        approval:
          name: Write the checklists' reviews (and the new assets) to STIG Manager?
          timeout: 28800
          description: "Open the check's report: Approve writes these reviews to STIG Manager."
        success: [update]
      - {id: update, template: "STIG Manager - update"}

  - number: 44
    name: ACT - triage finding
    description: The site portal's Ask ACT - one finding explained by ACT, read only
    prompts: {variables: true, limit: true}
    nodes:
      - {id: linux, template: "ACT - triage finding", always: [windows]}
      - {id: windows, template: "Windows ACT - triage finding"}

  - number: 45
    name: STIG - recheck one host
    description: The site portal's Recheck - the rules STIG Manager has Open, checked again on one host
    prompts: {variables: true, limit: true}
    nodes:
      - {id: linux, template: "STIG recheck", always: [windows]}
      - {id: windows, template: "Windows STIG recheck"}

  # ---- 46-48: nuc-dev-2 (STIG fixes) - added in their own block, each approval behind the gate as 40
  # ---- 49-51: nuc-dev-3 (Clean up, Restart, Allow this) (1.67.0 part E)
  - number: 49
    name: Disk - clean up (approved)
    description: The old files of the tmp folders on one full filesystem, after a person approves the plan
    prompts: {variables: true, limit: true}
    nodes:
      - {id: plan, template: "Disk - plan a clean up", success: [gate]}
      - id: gate
        template: Workflow gate - has a plan
        extra_data: {workflow_gate_var: disk_cleanup_plan}
        success: [approve]
      - id: approve
        approval:
          name: Approve the clean up?
          timeout: 86400
          description: "Open the plan step's output: Approve deletes the old files it lists, on that one host."
        success: [clean]
      - {id: clean, template: "Disk - clean up one mount"}

  - number: 50
    name: Service - restart
    description: One service that is down, restarted after a person approves it
    prompts: {variables: true, limit: true}
    nodes:
      - {id: look_linux, template: "Service - look (Linux)", success: [look_windows]}
      - {id: look_windows, template: "Service - look (Windows)", success: [gate]}
      - id: gate
        template: Workflow gate - has a plan
        extra_data: {workflow_gate_var: portal_service_plan}
        success: [approve]
      - id: approve
        approval:
          name: Restart this service?
          timeout: 86400
          description: "Open the look step's output (status and log lines): Approve restarts that one service."
        success: [restart_linux]
      - {id: restart_linux, template: "Service - restart (Linux)", success: [restart_windows]}
      - {id: restart_windows, template: "Service - restart (Windows)"}

  - number: 51
    name: fapolicyd - allow this
    description: One fapolicyd denial allowed, after a person approves the one change for it
    prompts: {variables: true, limit: true}
    nodes:
      - {id: check, template: "fapolicyd - allow this: check", success: [gate]}
      - id: gate
        template: Workflow gate - has a plan
        extra_data: {workflow_gate_var: fapolicyd_workflow_plan}
        success: [approve]
      - id: approve
        approval:
          name: Allow this program?
          timeout: 86400
          description: "Open the check's output: Approve makes that one line (a trust entry or a rule) on that host. It changes a security control."
        success: [approved]
      - {id: approved, template: "fapolicyd - allow this: approved"}
