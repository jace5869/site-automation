---
# The site portal's actions (1.67.0): what a person may launch from the portal, and the AAP job or workflow each one
# launches. The portal (roles/site_portal_stack) loads this file when it starts; the setting portal_actions (the same
# shape) replaces it. Each playbook checks the values again (roles/portal_request): keep both in step
# (tests/test_portal.py compares them). docs/SITE_PORTAL.md, "Actions".
#   title       what the confirm page and the job list call it
#   summary     one line of what it does (160 characters at most): the Actions page's card, under its title
#   area        the group of the Actions page it sits in (40 characters at most); left out = "Other"
#   aap         {type: workflow | job, name: the template's exact name in AAP}
#   vars        each extra variable: kind inventory_host (a host of portal_inventory), choice (values), text (max,
#               pattern: the whole value must match). The portal adds portal_requested_by (the person's certificate name).
#   limit_from  the inventory_host variable that is also the job's Limit
#   approval    true when the workflow waits for a person (its approval node decides; the page only says so)
#   who         any, or a list of certificate names; left out = portal_requesters
#   kinds       part C: the finding kinds a report offers this action on (a button on each such finding); the action then
#               takes target, report_job and finding_id, and its playbook reads the finding back (roles/finding_ref)
#   button      the button's short label on the report (title stays the confirm page's)
#   when        only on a finding whose data match: {field: value or [values]}, e.g. {cat: ["CAT II", "CAT III"]}
#   fixes       false for an action that only reads (ACT triage, a recheck): its job page then always says Not checked
#               (left out = true; its playbook's portal_result also refuses Fixed: portal_result_read_only)
actions:
  stig_recheck:
    title: STIG recheck of one host
    summary: Checks one host again against its STIG and shows what changed.
    area: STIG
    aap: {type: workflow, name: "STIG - recheck one host"}          # workflow 45: the Linux and the Windows recheck
    fixes: false
    vars:
      target: {kind: inventory_host, label: Host}
    limit_from: target
    multi_host: true                      # 1.78.2: a group or several hosts = ONE job (its playbook's portal_request_spec says kind: hosts)
    approval: false

  ckl_import:
    title: Import checklists into STIG Manager
    summary: Imports the checklists into STIG Manager, and updates the scorecard.
    area: STIG
    aap: {type: workflow, name: "Checklists imported into STIG Manager"}   # workflow 40
    vars:
      stigman_ckl_import_mode:
        kind: choice
        label: What should this run do?
        values: [import, import and scorecard, scorecard]
        default: import
    approval: true

  act_triage:
    title: Ask ACT about a finding
    summary: ACT reads one finding and drafts what to do next. It runs nothing on the host.
    area: ACT
    aap: {type: workflow, name: "ACT - triage finding"}             # workflow 44
    kinds: [fapolicyd, fapolicyd_deny, eventlog]
    button: Ask ACT
    fixes: false
    vars:
      target: {kind: inventory_host, label: Host}
      report_job: {kind: text, label: AAP job of the report, max: 12, pattern: "[0-9]{1,12}"}
      finding_id: {kind: text, label: Finding, max: 200, pattern: "(fapolicyd|fapolicyd_deny|eventlog):[A-Za-z0-9_.:/@-]{1,180}"}
    limit_from: target
    approval: false

  # ---- 1.67.0 part E: fixes of findings (docs/SITE_PORTAL.md, "Disk, services and fapolicyd") ----------------------
  # Each takes only target, report_job and finding_id: the values to change (the mount, the service, the program and the
  # path) are read back from the report job by roles/finding_ref, never from the link. modes (open_ticket): the button's
  # label by portal_ticket_mode - dry_run (the default), live, off (no button).
  disk_cleanup:
    title: Clean up a full filesystem (old files in the tmp folders)
    summary: Removes old files in the tmp folders of a full filesystem, after an approver agrees.
    area: "Disk & services"
    aap: {type: workflow, name: "Disk - clean up (approved)"}       # workflow 49: plan, approval, clean up, recheck
    kinds: [disk_full]
    when: {os: linux}
    button: Clean up
    vars:
      target: {kind: inventory_host, label: Host}
      report_job: {kind: text, label: AAP job of the report, max: 12, pattern: "[0-9]{1,12}"}
      finding_id: {kind: text, label: Finding, max: 200, pattern: "disk_full:[A-Za-z0-9_.:/@-]{1,180}"}
    limit_from: target
    approval: true

  service_restart:
    title: Restart a service that is down
    summary: Restarts a service that is down, after an approver agrees, and checks it came up.
    area: "Disk & services"
    aap: {type: workflow, name: "Service - restart"}                # workflow 50: look, approval, restart, status
    kinds: [service_down]
    button: Restart
    vars:
      target: {kind: inventory_host, label: Host}
      report_job: {kind: text, label: AAP job of the report, max: 12, pattern: "[0-9]{1,12}"}
      finding_id: {kind: text, label: Finding, max: 200, pattern: "service_down:[A-Za-z0-9_.:/@-]{1,180}"}
    limit_from: target
    approval: true

  fapolicyd_allow:
    title: Let fapolicyd allow this one program
    summary: Lets fapolicyd allow one program that it denied, after an approver agrees.
    area: fapolicyd
    aap: {type: workflow, name: "fapolicyd - allow this"}           # workflow 51: check, approval, approved, re-read
    kinds: [fapolicyd_deny]
    button: Allow this
    vars:
      target: {kind: inventory_host, label: Host}
      report_job: {kind: text, label: AAP job of the report, max: 12, pattern: "[0-9]{1,12}"}
      finding_id: {kind: text, label: Finding, max: 200, pattern: "fapolicyd_deny:[A-Za-z0-9_.:/@-]{1,180}"}
    limit_from: target
    approval: true

  disk_space_request:
    title: Write a request for more space (nothing is sent)
    summary: Writes the request for more space. Nothing is sent.
    area: "Disk & services"
    aap: {type: job, name: "Disk - space request"}
    kinds: [disk_full]
    button: Space request
    vars:
      target: {kind: inventory_host, label: Host}
      report_job: {kind: text, label: AAP job of the report, max: 12, pattern: "[0-9]{1,12}"}
      finding_id: {kind: text, label: Finding, max: 200, pattern: "disk_full:[A-Za-z0-9_.:/@-]{1,180}"}
    limit_from: target
    approval: false
    fixes: false                                                     # it only reads (or opens a ticket): never Fixed or Still there

  open_ticket:
    title: Open a ticket for a finding (a draft unless portal_ticket_mode is live)
    summary: Opens a ticket for one finding. A draft unless portal_ticket_mode is live.
    area: Tickets
    aap: {type: job, name: "Site portal - open ticket"}
    kinds: [any]                                                     # every kind of finding
    button: Ticket (dry run)
    modes: {dry_run: "Ticket (dry run)", live: "Open ticket", "off": null}     # "off" quoted: bare, YAML reads it as false
    vars:
      target: {kind: inventory_host, label: Host}
      report_job: {kind: text, label: AAP job of the report, max: 12, pattern: "[0-9]{1,12}"}
      finding_id: {kind: text, label: Finding, max: 200, pattern: "[A-Za-z0-9_.:/@-]{1,200}"}
    limit_from: target
    approval: false
    fixes: false                                                     # it only reads (or opens a ticket): never Fixed or Still there

  # ---- 1.67.0 part D: the STIG actions (workflows 46-48; roles/portal_stig, docs/SITE_PORTAL.md "STIG actions")
  stig_recheck_update:
    title: Recheck the rule and update STIG Manager
    summary: Checks one rule again and updates the result in STIG Manager, after an approver agrees.
    area: STIG
    aap: {type: workflow, name: "STIG - recheck and update STIG Manager"}   # workflow 46
    kinds: [stig_fixed_open]
    button: Update STIG Manager
    vars:
      target: {kind: inventory_host, label: Host}
      report_job: {kind: text, label: AAP job of the report, max: 12, pattern: "[0-9]{1,12}"}
      finding_id: {kind: text, label: Finding, max: 200, pattern: "(stig_fixed_open):[A-Za-z0-9_.:/@-]{1,180}"}
    limit_from: target
    approval: true

  stig_fix_rule:
    title: Fix one STIG rule (ACT proposes, you approve)
    summary: ACT proposes a fix for one CAT II or III rule on a Linux host. An approver decides.
    area: STIG
    aap: {type: workflow, name: "STIG - fix one rule"}                       # workflow 47
    kinds: [stig_rule_fail]
    button: Fix rule
    when: {cat: ["CAT II", "CAT III"], os: linux}                           # never CAT I; Linux hosts only
    vars:
      target: {kind: inventory_host, label: Host}
      report_job: {kind: text, label: AAP job of the report, max: 12, pattern: "[0-9]{1,12}"}
      finding_id: {kind: text, label: Finding, max: 200, pattern: "(stig_rule_fail):[A-Za-z0-9_.:/@-]{1,180}"}
    limit_from: target
    approval: true

  stigman_create_asset:
    title: Create the host's asset in STIG Manager
    summary: Creates the host's asset in STIG Manager, after an approver agrees.
    area: STIG
    aap: {type: workflow, name: "STIG - create the asset in STIG Manager"}  # workflow 48
    kinds: [stig_no_asset]
    button: Create asset
    when: {os: linux}
    vars:
      target: {kind: inventory_host, label: Host}
      report_job: {kind: text, label: AAP job of the report, max: 12, pattern: "[0-9]{1,12}"}
      finding_id: {kind: text, label: Finding, max: 200, pattern: "(stig_no_asset):[A-Za-z0-9_.:/@-]{1,180}"}
    limit_from: target
    approval: true
