---
# The site portal's actions (1.67.0): what a person may launch from the portal, and the AAP job or workflow each one
# launches. The portal (roles/site_portal_stack) loads this file when it starts; the setting portal_actions (the same
# shape) replaces it. Each playbook checks the values again (roles/portal_request): keep both in step
# (tests/test_portal.py compares them). docs/SITE_PORTAL.md, "Actions".
#   title       what the confirm page and the job list call it
#   aap         {type: workflow | job, name: the template's exact name in AAP}
#   vars        each extra variable: kind inventory_host (a host of portal_inventory), choice (values), text (max,
#               pattern: the whole value must match). The portal adds portal_requested_by (the person's certificate name).
#   limit_from  the inventory_host variable that is also the job's Limit
#   approval    true when the workflow waits for a person (its approval node decides; the page only says so)
#   who         any, or a list of certificate names; left out = portal_requesters
#   kinds       part C: the finding kinds a report offers this action on (a button on each such finding); the action then
#               takes target, report_job and finding_id, and its playbook reads the finding back (roles/finding_ref)
#   button      the button's short label on the report (title stays the confirm page's)
#   when        only on a finding whose data match: {field: value or [values]}, e.g. {cat: ["CAT II", "CAT III"]}
actions:
  stig_recheck:
    title: STIG recheck of one host
    aap: {type: workflow, name: "STIG - recheck one host"}          # workflow 45: the Linux and the Windows recheck
    vars:
      target: {kind: inventory_host, label: Host}
    limit_from: target
    approval: false

  ckl_import:
    title: Import checklists into STIG Manager
    aap: {type: workflow, name: "Checklists imported into STIG Manager"}   # workflow 40
    vars:
      stigman_ckl_import_mode:
        kind: choice
        label: What should this run do?
        values: [import, import and scorecard, scorecard]
        default: import
    approval: true

  act_triage:
    title: Ask ACT about a finding
    aap: {type: workflow, name: "ACT - triage finding"}             # workflow 44
    kinds: [fapolicyd, fapolicyd_deny, eventlog]
    button: Ask ACT
    vars:
      target: {kind: inventory_host, label: Host}
      report_job: {kind: text, label: AAP job of the report, max: 12, pattern: "[0-9]{1,12}"}
      finding_id: {kind: text, label: Finding, max: 200, pattern: "(fapolicyd|fapolicyd_deny|eventlog):[A-Za-z0-9_.:/@-]{1,180}"}
    limit_from: target
    approval: false
