---
# Deploy / reconcile the site portal. Idempotent: a second run changes nothing. The AAP token arrives as an environment
# variable from the AAP credential and is handed to podman as a secret over stdin: never on a command line, never in a
# unit file or the settings file, never printed (no_log), never shown as a diff.
# It makes only what is named site-portal*: behind STIG Manager's nginx, that nginx, its files, its network and every
# other container are only read (the network's DNS address) - the nginx lines to add are written to a file for a
# person to paste. With portal_own_nginx it also makes its own nginx container and network.

- name: Stack | paths for this scope
  ansible.builtin.set_fact:
    _portal_quadlet_dir: >-
      {{ (ansible_user_dir ~ '/.config/containers/systemd') if portal_scope == 'user'
         else '/etc/containers/systemd' }}
    _portal_systemctl: "{{ ['systemctl'] + (['--user'] if portal_scope == 'user' else []) }}"
    _portal_net_name: "{{ 'site-portal' if portal_own_nginx | bool else portal_network }}"

# ---------------------------------------------------------------- preflight
- name: Preflight | AAP's address and the portal account's token are there (from the AAP credential)
  ansible.builtin.assert:
    that:
      - portal_aap_url | trim | length > 0
      - portal_aap_token | trim | length > 0
    fail_msg: >-
      Missing credentials. Attach a "Red Hat Ansible Automation Platform" credential of the portal's own account WITH A
      TOKEN (OAuth token: AAP > Users > the account > Tokens) to the job template. docs/SITE_PORTAL.md, "The AAP account".
    quiet: true                           # 1.68.2: not no_log - the message holds no secret, and no_log hid it

- name: Preflight | the path, and the network or the own nginx's files
  ansible.builtin.assert:
    that:
      - portal_path is match('^/[A-Za-z0-9_-]+/$')
      - portal_own_nginx | bool or (portal_network | length > 0 and portal_network != 'podman')
      - not portal_own_nginx | bool or (portal_cert_file | length > 0 and portal_key_file | length > 0 and portal_ca_file | length > 0)
      - portal_reports_dir is match('^/')
    fail_msg: >-
      Set portal_path to a path like /portal/ and portal_reports_dir to the report folder (a full path). Behind STIG
      Manager's nginx: portal_network = that nginx container's podman network (sudo podman ps --format
      "{{ '{{' }}.Names{{ '}}' }} {{ '{{' }}.Networks{{ '}}' }}"; not podman's default network "podman"). With
      portal_own_nginx: portal_cert_file, portal_key_file and portal_ca_file. docs/SITE_PORTAL.md
    quiet: true

- name: Preflight | podman version
  ansible.builtin.command:
    argv: [podman, version, --format, "{{ '{{' }}.Client.Version{{ '}}' }}"]
  register: _portal_podman
  changed_when: false
  check_mode: false                       # only reads: a dry run needs the answer too

- name: Preflight | podman supports Quadlet (4.4 or newer)
  ansible.builtin.assert:
    that: _portal_podman.stdout is version('4.4', '>=')
    fail_msg: "podman {{ _portal_podman.stdout }} is too old for Quadlet; RHEL 9.2+/8.8+ ship 4.4 or newer."
    quiet: true

# ---------------------------------------------------------------- the images (1.70.3)
# Before anything is written: every image must be on this host. The units never pull (PodmanArgs=--pull=never), so an
# air-gapped host failed minutes later in "Unable to start service". portal_pull_images true pulls what is missing instead.
- name: Registry | log in (only when the registry credential is attached)
  ansible.builtin.command:
    argv: [podman, login, --username, "{{ lookup('ansible.builtin.env', 'REGISTRY_USERNAME') }}",
           --password-stdin, "{{ lookup('ansible.builtin.env', 'REGISTRY_HOST') }}"]
    stdin: "{{ lookup('ansible.builtin.env', 'REGISTRY_PASSWORD') }}"
  changed_when: false
  no_log: true
  when: lookup('ansible.builtin.env', 'REGISTRY_PASSWORD') | length > 0

- name: Images | which are on this host (podman image exists; nothing is pulled)
  ansible.builtin.command:
    argv: [podman, image, exists, "{{ item.image }}"]
  loop: >-
    {{ [{'var': 'portal_image', 'image': portal_image}]
       + ([{'var': 'portal_nginx_image', 'image': portal_nginx_image}] if portal_own_nginx | bool else []) }}
  loop_control:
    label: "{{ item.var }}"
  register: _portal_img
  changed_when: false
  failed_when: false
  check_mode: false                       # only reads

- name: Images | pulled, when portal_pull_images is true (a host that reaches a registry)
  ansible.builtin.command:
    argv: [podman, pull, "{{ item.item.image }}"]
  loop: "{{ _portal_img.results | rejectattr('rc', 'equalto', 0) | list }}"
  loop_control:
    label: "{{ item.item.var }}"
  register: _portal_img_pull
  changed_when: _portal_img_pull.rc == 0            # a failed pull changed nothing
  failed_when: false
  when: portal_pull_images | bool and not ansible_check_mode

- name: Images | every image is on this host, or the job stops here with nothing changed
  ansible.builtin.fail:
    msg: "{{ _portal_img_missing | airgap_images_text(portal_scope, 'portal_pull_images', portal_pull_images | bool) }}"
  vars:
    _portal_img_missing: >-
      {%- if portal_pull_images | bool -%}
      {{ [] if ansible_check_mode else (_portal_img_pull.results | default([]) | airgap_pull_failures) }}
      {%- else -%}
      {{ _portal_img.results | rejectattr('rc', 'equalto', 0) | map(attribute='item') | list }}
      {%- endif -%}
  when: _portal_img_missing | length > 0

- name: Preflight | the report folder
  ansible.builtin.stat:
    path: "{{ portal_reports_dir }}"
  register: _portal_reports

- name: Preflight | the report folder is there
  ansible.builtin.assert:
    that: _portal_reports.stat.isdir | default(false)
    fail_msg: >-
      {{ portal_reports_dir }} (portal_reports_dir) is not a folder on {{ inventory_hostname }}: set it to the folder
      the report jobs write the pages to on this host (report_web_dest's folder). docs/SITE_PORTAL.md
    quiet: true

- name: Preflight | the own nginx's files (portal_own_nginx)
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: "{{ [portal_cert_file, portal_key_file, portal_ca_file] + ([portal_crl_file] if portal_crl_file else []) }}"
  register: _portal_tls_files
  when: portal_own_nginx | bool

- name: Preflight | they are there
  ansible.builtin.assert:
    that: _portal_tls_files.results | rejectattr('stat.exists') | list | length == 0
    fail_msg: >-
      Not on {{ inventory_hostname }}: {{ _portal_tls_files.results | rejectattr('stat.exists') | map(attribute='item') | join(', ') }}
      (portal_cert_file, portal_key_file, portal_ca_file, portal_crl_file are paths on this server).
    quiet: true
  when: portal_own_nginx | bool

# only read: the network is the reverse proxy's (made with it); its DNS address is the resolver in the nginx lines
- name: Preflight | the reverse proxy's network
  ansible.builtin.command:
    argv: [podman, network, inspect, "{{ portal_network }}", --format,
           "{{ '{{' }}.DNSEnabled{{ '}}' }} {{ '{{' }}range .Subnets{{ '}}' }}{{ '{{' }}.Gateway{{ '}}' }} {{ '{{' }}end{{ '}}' }}"]
  register: _portal_net
  changed_when: false
  failed_when: false
  check_mode: false                       # only reads
  when: not portal_own_nginx | bool

- name: Preflight | the network exists, with DNS (its nginx finds the service by name)
  ansible.builtin.assert:
    that:
      - _portal_net.rc == 0
      - (_portal_net.stdout.split() | first | default('')) == 'true'
      - _r | length > 0
    fail_msg: >-
      {{ ('The podman network ' ~ portal_network ~ ' does not exist' ~ (' for this user (portal_scope: user)'
          if portal_scope == 'user' else '') ~ ': ' ~ (_portal_net.stderr | trim)) if _portal_net.rc != 0
         else ('The podman network ' ~ portal_network ~ ' has no DNS, so its nginx cannot find the service by name.') }}
      Set portal_network to the network your reverse proxy's nginx container is on. docs/SITE_PORTAL.md
    quiet: true
  vars:
    _r: "{{ _portal_net.stdout.split()[1:] | select('match', '^[0-9.]+$') | list }}"
  when: not portal_own_nginx | bool

- name: Preflight | the network's DNS address (the resolver in the nginx lines)
  ansible.builtin.set_fact:
    _portal_resolvers: "{{ _portal_net.stdout.split()[1:] | select('match', '^[0-9.]+$') | list }}"
  when: not portal_own_nginx | bool

# ---------------------------------------------------------------- the actions: one loader, the service's own
- name: Actions | the file (or portal_actions)
  ansible.builtin.set_fact:
    _portal_actions_base: >-
      {{ portal_actions if portal_actions | length > 0
         else ((lookup('ansible.builtin.file', role_path ~ '/files/actions.yml') | from_yaml).actions | default({}, true)) }}

- name: Actions | portal_actions_off and portal_actions_extra (1.75.3)
  ansible.builtin.set_fact:
    _portal_merge: "{{ _portal_actions_base | site_portal_actions_merge(portal_actions_extra, portal_actions_off, portal_aap_names) }}"

- name: Actions | the merge is right
  ansible.builtin.assert:
    that: _portal_merge.problems | length == 0
    fail_msg: "The actions are not right - nothing was changed: {{ _portal_merge.problems | join(' | ') }}"
    quiet: true

- name: Actions | portal_titles is right (1.78.1c)
  ansible.builtin.assert:
    that: (portal_titles | site_portal_titles).problems | length == 0
    fail_msg: "portal_titles is not right - nothing was changed: {{ (portal_titles | site_portal_titles).problems | join(' | ') }}"
    quiet: true

# YAML reads an unquoted off as false: portal_motion: off means off
- name: Settings | portal_motion is auto, always or off
  ansible.builtin.set_fact:
    _portal_motion: "{{ 'off' if portal_motion is sameas false else (portal_motion | string | lower) }}"

- name: Settings | portal_motion is auto, always or off (checked)
  ansible.builtin.assert:
    that: _portal_motion in ['auto', 'always', 'off']
    fail_msg: "portal_motion is {{ portal_motion }}; it must be auto, always or off - nothing was changed"
    quiet: true

# 1.85.0: the live Network map - on with a SolarWinds credential (auto), or as portal_netmap says
- name: Settings | the live Network map (portal_netmap)
  ansible.builtin.set_fact:
    _portal_netmap: >-
      {{ (portal_netmap | string | lower in ['true', 'yes', 'on', '1'])
         or (portal_netmap | string | lower == 'auto' and portal_solarwinds_username | length > 0 and portal_solarwinds_password | length > 0) }}

- name: Settings | the live Network map has SolarWinds' address and login
  ansible.builtin.assert:
    that:
      - portal_solarwinds_url | trim | length > 0
      - portal_solarwinds_username | length > 0 and portal_solarwinds_password | length > 0
      - netmap_live_seconds | int >= 30
    fail_msg: >-
      portal_netmap is on: attach a "SolarWinds (read-only)" credential (aap/credential_types/solarwinds.yml) with SolarWinds'
      address to this job template (or set netmap_solarwinds_url), and netmap_live_seconds 30 or more - nothing was changed.
      docs/NETWORK_MAP.md
    quiet: true
  when: _portal_netmap | bool

# 1.95.0: the discovery settings the live map reads - one that cannot work stops the deploy, with the reason
- name: Settings | the live Network map's discovery settings
  ansible.builtin.assert:
    that: _netmap_bad | length == 0
    fail_msg: "{{ _netmap_bad | join('; ') }} - nothing was changed. docs/NETWORK_MAP.md"
    quiet: true
  vars:
    _netmap_bad: >-
      {{ {'site_pattern': netmap_site_pattern | default(''), 'hierarchy': netmap_hierarchy | default([], true),
          'roles': netmap_roles | default({}, true)} | netmap_check_opts }}
  when: _portal_netmap | bool

# 1.78.2: the caps are settings; one outside its range stops the deploy, naming the setting
- name: Settings | {{ item.name }} is in its range
  ansible.builtin.assert:
    that: (lookup('ansible.builtin.vars', item.name) | string) is match('^[0-9]+$') and 1 <= (lookup('ansible.builtin.vars', item.name) | int) <= item.max
    fail_msg: "{{ item.name }} is {{ lookup('ansible.builtin.vars', item.name) }}; it must be a whole number from 1 to {{ item.max }} - nothing was changed"
    quiet: true
  loop:
    - {name: portal_pick_max_hosts, max: 500}
    - {name: portal_action_max_hosts, max: 500}
    - {name: portal_pick_max_launches, max: 200}
    - {name: portal_limit_max, max: 500}
    - {name: portal_inventories_max, max: 50}
  loop_control:
    label: "{{ item.name }}"

# the source is found as report_logo_file is: a full path as it is, else under the playbooks folder (files/x.png is playbooks/files/x.png)
- name: Logo | where the source file is
  ansible.builtin.set_fact:
    _portal_logo_src_path: >-
      {%- set f = portal_logo_src | default('') | string | trim -%}
      {{ '' if not f else (f if f.startswith('/') else playbook_dir ~ '/' ~ (f[10:] if f.startswith('playbooks/') else f)) }}

- name: Logo | the source file is checked before anything is copied (size, first bytes)
  ansible.builtin.assert:
    that: (_portal_logo_src_path | site_portal_logo_check) == ''
    fail_msg: "{{ _portal_logo_src_path | site_portal_logo_check }}"
    quiet: true
  when: _portal_logo_src_path | length > 0

# 1.78.3: portal_logo_src alone is enough (portal_logo then defaults to portal_config_dir/logo.<its extension>); one line says what applies publish settings
- name: Site portal | portal_publish_* is applied by the setup job, not by this deploy
  ansible.builtin.debug:
    msg: >-
      portal_publish_* is applied by the job AAP - set up portal actions (Check first, then Run), not by this deploy:
      this deploy only reads what AAP then shows.
  when: >-
    (portal_publish_templates | default([]) | length > 0 or portal_publish_organization | default('') | length > 0
     or portal_unpublish_templates | default([]) | length > 0 or portal_publish_area | default({}) | length > 0
     or (portal_publish_max | default(50) | int) != 50)

- name: Actions | portal_area_rules is right (1.78.4)
  ansible.builtin.assert:
    that: (portal_area_rules | site_portal_area_rules).problems | length == 0
    fail_msg: "portal_area_rules is not right - nothing was changed: {{ (portal_area_rules | site_portal_area_rules).problems | join(' | ') }}"
    quiet: true

# the area of each playbook in the job-template catalog (aap/job_templates.yml, an 'area' on each entry), when the repository has it
- name: Areas | the job-template catalog
  ansible.builtin.stat:
    path: "{{ role_path }}/../../aap/job_templates.yml"
  register: _portal_catalog_stat
  delegate_to: localhost
  become: false

- name: Areas | the area of each playbook
  ansible.builtin.set_fact:
    _portal_playbook_areas: >-
      {{ dict((lookup('ansible.builtin.file', role_path ~ '/../../aap/job_templates.yml') | from_yaml).job_templates | default([])
              | selectattr('area', 'defined') | selectattr('playbook', 'defined') | map(attribute='playbook') | list
              | zip((lookup('ansible.builtin.file', role_path ~ '/../../aap/job_templates.yml') | from_yaml).job_templates | default([])
                    | selectattr('area', 'defined') | selectattr('playbook', 'defined') | map(attribute='area') | list)) }}
  when: _portal_catalog_stat.stat.exists | default(false)

- name: Actions | the actions the portal serves
  ansible.builtin.set_fact:
    _portal_actions_raw: "{{ _portal_merge.actions }}"

- name: Actions | checked (plugins/filter/site_portal_filters.py - the service loads them with the same rules)
  ansible.builtin.set_fact:
    _portal_check: "{{ _portal_actions_raw | site_portal_actions_check }}"

- name: Actions | every entry is right
  ansible.builtin.assert:
    that: _portal_check.problems | length == 0
    fail_msg: "The actions are not right - nothing was changed: {{ _portal_check.problems | join(' | ') }}"
    quiet: true

- name: Actions | an action that checks a host needs portal_inventory
  ansible.builtin.assert:
    that: portal_inventory | length > 0 or _host_vars | length == 0
    fail_msg: >-
      {{ _host_vars | join(', ') }} check a host against AAP's inventory: set portal_inventory to that inventory's name
    quiet: true
  vars:
    _host_vars: >-
      {{ _portal_check.actions | dict2items | map(attribute='value') | selectattr('vars') | map(attribute='vars')
         | map('dict2items') | flatten | selectattr('value.kind', 'equalto', 'inventory_host') | map(attribute='key') | unique | list }}

- name: Actions | none listed - the portal serves the reports and the approvals only
  ansible.builtin.debug:
    msg: >-
      No action is listed (roles/site_portal_stack/files/actions.yml or portal_actions): the portal serves the report
      website and the approvals; a report's Run link would answer "There is no action ...".
  when: _portal_check.actions | length == 0

# ---------------------------------------------------------------- directories, the service's files
- name: Files | directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: "{{ item.mode }}"
  loop:
    - {path: "{{ _portal_quadlet_dir }}", mode: "0755"}
    - {path: "{{ portal_config_dir }}", mode: "0750"}
    - {path: "{{ portal_config_dir }}/app", mode: "0755"}
    - {path: "{{ portal_config_dir }}/app/static", mode: "0755"}
    - {path: "{{ portal_config_dir }}/trust.d", mode: "0750"}
  loop_control:
    label: "{{ item.path }}"
  register: _portal_dirs

- name: Files | the service, its pages, the actions' rules, AAP's client
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ portal_config_dir }}/app/{{ item.dest }}"
    mode: "0644"
  loop:
    - {src: site_portal.py, dest: site_portal.py}
    - {src: start.sh, dest: start.sh}
    - {src: static/portal.js, dest: static/portal.js}
    - {src: static/portal.css, dest: static/portal.css}
    - {src: static/portal-theme.js, dest: static/portal-theme.js}       # 1.75.2: the colours chosen last time
    - {src: static/stigman-go.js, dest: static/stigman-go.js}           # 1.68.1: a scorecard link's go page
    - {src: static/stigman-open.js, dest: static/stigman-open.js}       # 1.68.1: added to STIG Manager's page by nginx
    - {src: "{{ role_path }}/../../plugins/filter/site_portal_filters.py", dest: site_portal_filters.py}
    - {src: "{{ role_path }}/../../plugins/module_utils/site_aap.py", dest: site_aap.py}
    - {src: "{{ role_path }}/../../plugins/module_utils/site_time.py", dest: site_time.py}
    # 1.85.0: the live Network map - SolarWinds' reader (the report job's) and the map's page files (the report's)
    - {src: "{{ role_path }}/../../plugins/module_utils/site_swis.py", dest: site_swis.py}
    - {src: "{{ role_path }}/../netmap_report/files/web/netmap-map.html", dest: static/netmap-map.html}
    - {src: "{{ role_path }}/../netmap_report/files/web/netmap.css", dest: static/netmap.css}
    - {src: "{{ role_path }}/../netmap_report/files/web/netmap.js", dest: static/netmap.js}
    - {src: "{{ role_path }}/../netmap_report/files/web/netglobe.js", dest: static/netglobe.js}
    # 1.102.0: the Region view and its labels (shared with the AD report's map); the AD layer's matching
    - {src: "{{ role_path }}/../netmap_report/files/web/maplabel.js", dest: static/maplabel.js}
    - {src: "{{ role_path }}/../netmap_report/files/web/netregion.js", dest: static/netregion.js}
    - {src: "{{ role_path }}/../../plugins/module_utils/site_ad_layer.py", dest: site_ad_layer.py}
    - {src: "{{ role_path }}/../netmap_report/files/web/world-land.js", dest: static/world-land.js}
    - {src: "{{ role_path }}/../netmap_report/files/web/netmap-live.js", dest: static/netmap-live.js}
    # 1.101.2: the live AD page - the AD report's SolarWinds reader and its section (the job's own), the page's live part
    - {src: "{{ role_path }}/../../plugins/module_utils/site_swis_db.py", dest: site_swis_db.py}
    - {src: "{{ role_path }}/../../plugins/module_utils/site_ad_swis.py", dest: site_ad_swis.py}
    - {src: "{{ role_path }}/../../plugins/filter/ad_swis_filters.py", dest: ad_swis_filters.py}
    - {src: "{{ role_path }}/../../plugins/module_utils/site_report_db.py", dest: site_report_db.py}
    - {src: "{{ role_path }}/../../plugins/module_utils/site_ad_ident.py", dest: site_ad_ident.py}
    - {src: netmap_history.py, dest: netmap_history.py}
    - {src: static/netmap-history.js, dest: static/netmap-history.js}
    - {src: static/netmap-history.css, dest: static/netmap-history.css}
    - {src: static/ad-page.js, dest: static/ad-page.js}
    - {src: static/ad-page.css, dest: static/ad-page.css}
  loop_control:
    label: "{{ item.dest }}"
  register: _portal_app_files

# ---------------------------------------------------------------- the site's logo (portal_logo, 1.78.2)
- name: Logo | where the image goes on this server
  ansible.builtin.set_fact:
    _portal_logo_dest: >-
      {{ portal_logo if portal_logo | default('') | length > 0 else
         ((portal_config_dir ~ '/logo' ~ (portal_logo_src | splitext)[1]) if portal_logo_src | default('') | length > 0 else '') }}

- name: Logo | the image, from the controller (portal_logo_src) to the portal server (portal_logo)
  ansible.builtin.copy:
    src: "{{ _portal_logo_src_path }}"
    dest: "{{ _portal_logo_dest }}"
    mode: "0644"
  register: _portal_logo_file
  when: _portal_logo_src_path | length > 0

- name: Logo | is the image on this server
  ansible.builtin.stat:
    path: "{{ _portal_logo_dest }}"
  register: _portal_logo_stat
  when: _portal_logo_dest | length > 0

- name: Logo | portal_logo is set and the file is not there - the badge is shown
  ansible.builtin.debug:
    msg: "portal_logo {{ _portal_logo_dest }} is not on this server: the pages show the badge. Put the image there, or set portal_logo_src (a file on the controller) and deploy again."
  when: _portal_logo_dest | length > 0 and not (_portal_logo_stat.stat.exists | default(false)) and not (_portal_logo_file is changed)

- name: Logo | on
  ansible.builtin.set_fact:
    _portal_logo_on: "{{ _portal_logo_dest | length > 0 and ((_portal_logo_stat.stat.exists | default(false)) or (_portal_logo_file is changed)) }}"

# ---------------------------------------------------------------- the CAs the service trusts (AAP's certificate)
- name: Trust | what this server trusts
  ansible.builtin.stat:
    path: /etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem
  register: _portal_host_bundle
  when: portal_trust_host_cas | bool

- name: Trust | the server's CAs
  ansible.builtin.copy:
    src: /etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem
    dest: "{{ portal_config_dir }}/trust.d/10-host.pem"
    remote_src: true
    mode: "0644"
  # a dry run on a new server: trust.d is not there yet (the task above only said it would make it)
  when: >-
    portal_trust_host_cas | bool and _portal_host_bundle.stat.exists | default(false)
    and not (ansible_check_mode and _portal_dirs.results[-1] is changed)

- name: Trust | SolarWinds' CA (portal_solarwinds_ca_file), for the live Network map
  ansible.builtin.copy:
    src: "{{ portal_solarwinds_ca_file }}"
    dest: "{{ portal_config_dir }}/trust.d/20-solarwinds.pem"
    remote_src: true
    mode: "0644"
  when: _portal_netmap | bool and portal_solarwinds_ca_file | length > 0 and not (ansible_check_mode and _portal_dirs.results[-1] is changed)

- name: Trust | no SolarWinds CA any more
  ansible.builtin.file:
    path: "{{ portal_config_dir }}/trust.d/20-solarwinds.pem"
    state: absent
  when: not (_portal_netmap | bool and portal_solarwinds_ca_file | length > 0)

- name: Trust | which CAs
  ansible.builtin.find:
    paths: "{{ portal_config_dir }}/trust.d"
    patterns: "*.pem"
  register: _portal_trust_parts
  check_mode: false                       # only reads

- name: Trust | one bundle for the service (SSL_CERT_FILE)
  ansible.builtin.assemble:
    src: "{{ portal_config_dir }}/trust.d"
    dest: "{{ portal_config_dir }}/trust.pem"
    regexp: '\.pem$'
    mode: "0644"
  register: _portal_trust
  when: _portal_trust_parts.matched | int > 0

- name: Trust | the image's own CAs only
  ansible.builtin.file:
    path: "{{ portal_config_dir }}/trust.pem"
    state: absent
  register: _portal_trust_gone
  when: _portal_trust_parts.matched | int == 0

# ---------------------------------------------------------------- registry login (optional)
# ---------------------------------------------------------------- the token: a podman secret
# A label holds the SHA-256 of the value, so the role knows whether it changed without reading the secret back (as
# roles/vmware_ask_stack). The service reads it at start.
- name: Secret | current state
  ansible.builtin.command:
    argv: [podman, secret, inspect, site-portal-aap-token, --format, "{{ '{{' }}index .Spec.Labels \"site.sha256\"{{ '}}' }}"]
  register: _portal_secret_state
  changed_when: false
  failed_when: false
  check_mode: false                       # only reads the label

- name: Secret | the old value removed first (podman before 4.7)
  ansible.builtin.command:
    argv: [podman, secret, rm, site-portal-aap-token]
  when: >-
    _portal_secret_state.rc == 0 and (_portal_secret_state.stdout | trim) != (portal_aap_token | trim | hash('sha256'))
    and _portal_podman.stdout is version('4.7', '<')
  changed_when: true
  no_log: true

# 1.68.2: --replace only for a secret that is there (podman 4.9.4-rhel refuses it for a new one: "deleting secret : : no
# secret data with ID"). The task is no_log (the value goes over stdin), so AAP would only say "censored": its result is
# kept and the next task stops with podman's own words (stderr - never the value, never the command line)
- name: Secret | create or replace
  ansible.builtin.command:
    argv: >-
      {{ ['podman', 'secret', 'create']
         + (['--replace'] if _portal_podman.stdout is version('4.7', '>=') and _portal_secret_state.rc == 0 else [])
         + ['--label', 'site.sha256=' ~ (portal_aap_token | trim | hash('sha256')), 'site-portal-aap-token', '-'] }}
    stdin: "{{ portal_aap_token | trim }}"
    stdin_add_newline: false
  when: _portal_secret_state.rc != 0 or (_portal_secret_state.stdout | trim) != (portal_aap_token | trim | hash('sha256'))
  changed_when: true                      # runs only when the secret is missing or differs
  failed_when: false                      # said by the next task, with podman's reason
  no_log: true
  register: _portal_secret_set

- name: Secret | podman made it
  ansible.builtin.fail:
    msg: "podman secret create site-portal-aap-token failed (rc {{ _portal_secret_set.rc }}): {{ _portal_secret_set.stderr | default('', true) | trim or 'no reason given' }}"
  when: _portal_secret_set.rc | default(0) != 0

# ---------------------------------------------------------------- 1.85.0: SolarWinds' login, a podman secret too
# {user, password} as JSON in one secret (site-portal-swis -> PORTAL_SWIS_LOGIN), its SHA-256 on a label as the token's
- name: Secret | SolarWinds' login - current state
  ansible.builtin.command:
    argv: [podman, secret, inspect, site-portal-swis, --format, "{{ '{{' }}index .Spec.Labels \"site.sha256\"{{ '}}' }}"]
  register: _portal_swis_state
  changed_when: false
  failed_when: false
  check_mode: false                       # only reads the label

- name: Secret | SolarWinds' login - the value
  ansible.builtin.set_fact:
    _portal_swis_login: "{{ {'user': portal_solarwinds_username, 'password': portal_solarwinds_password} | to_json }}"
  no_log: true
  when: _portal_netmap | default(false) | bool

- name: Secret | SolarWinds' login - the old value removed first (podman before 4.7), or the map turned off
  ansible.builtin.command:
    argv: [podman, secret, rm, site-portal-swis]
  when: >-
    _portal_swis_state.rc == 0 and (not _portal_netmap | default(false) | bool or
    ((_portal_swis_state.stdout | trim) != (_portal_swis_login | hash('sha256')) and _portal_podman.stdout is version('4.7', '<')))
  changed_when: true
  register: _portal_swis_gone
  no_log: true

- name: Secret | SolarWinds' login - create or replace
  ansible.builtin.command:
    argv: >-
      {{ ['podman', 'secret', 'create']
         + (['--replace'] if _portal_podman.stdout is version('4.7', '>=') and _portal_swis_state.rc == 0 else [])
         + ['--label', 'site.sha256=' ~ (_portal_swis_login | hash('sha256')), 'site-portal-swis', '-'] }}
    stdin: "{{ _portal_swis_login }}"
    stdin_add_newline: false
  when: _portal_netmap | default(false) | bool and (_portal_swis_state.rc != 0 or (_portal_swis_state.stdout | trim) != (_portal_swis_login | hash('sha256')))
  changed_when: true
  failed_when: false                      # said by the next task, with podman's reason
  no_log: true
  register: _portal_swis_set

- name: Secret | SolarWinds' login - podman made it
  ansible.builtin.fail:
    msg: "podman secret create site-portal-swis failed (rc {{ _portal_swis_set.rc }}): {{ _portal_swis_set.stderr | default('', true) | trim or 'no reason given' }}"
  when: _portal_swis_set.rc | default(0) != 0

# ---------------------------------------------------------------- 1.101.2: the report database's read-only login, a podman secret
# {host, port, database, user, password, tls, ca_pem} as JSON in one secret (site-portal-reportdb -> PORTAL_REPORT_DB), its
# SHA-256 on a label as the others'. The live AD page reads the AD job's runs with it; the deploy never fails on it.
- name: Report database | on? (portal_report_db; the "Report database" credential on this template)
  ansible.builtin.set_fact:
    _portal_rdb: >-
      {{ (portal_report_db | string | lower in ['true', 'yes', 'on', '1'] or portal_report_db | string | lower == 'auto')
         and portal_report_db_host | length > 0 and portal_report_db_user | length > 0 and portal_report_db_password | length > 0 }}

- name: Report database | the login, looked at from here (read only; its grants, the AD job's runs)
  site_portal_db_check:
    host: "{{ portal_report_db_host }}"
    port: "{{ portal_report_db_port | int }}"
    database: "{{ portal_report_db_name }}"
    user: "{{ portal_report_db_user }}"
    password: "{{ portal_report_db_password }}"
    tls: "{{ portal_report_db_tls | bool }}"
    ca_file: "{{ portal_report_db_ca_file }}"
  register: _portal_rdb_check
  delegate_to: localhost
  become: false
  run_once: true
  check_mode: false                       # only reads
  when: _portal_rdb | bool

- name: Report database | what was found
  ansible.builtin.debug:
    msg: >-
      {{ ('The report database: ' ~ portal_report_db_user ~ ' logs in, ' ~
          (('the AD job has kept ' ~ _portal_rdb_check.ad_runs ~ ' runs') if _portal_rdb_check.ad_runs | int >= 0
           else 'no AD run yet (the AD job makes its tables on its next run)') ~ '.')
         if _portal_rdb_check.ok | default(false) else
         ('The report database could not be read from here: ' ~ _portal_rdb_check.error | default('?')
          ~ ' - the secret is made anyway; the page says so if the portal cannot read it either.') }}
  when: _portal_rdb | bool

- name: Report database | a login that can write (the portal only reads)
  ansible.builtin.debug:
    msg: >-
      WARNING: the Report database credential on this template can write ({{ _portal_rdb_check.privileges | join(', ') }}). The
      portal only reads: attach one with the read-only account report_reader (GRANT SELECT, SHOW VIEW;
      docs/REPORT_DATABASE.md) instead. It works as it is.
  when: _portal_rdb | bool and _portal_rdb_check.writes | default(false) | bool

- name: Report database | not on
  ansible.builtin.debug:
    msg: >-
      The live AD page reads the AD job's runs from the report database: attach the "Report database" credential (the read-only
      account report_reader) to this template and run it again. Until then the page says the database is off.
  when: not _portal_rdb | bool and portal_report_db | string | lower != 'false'

- name: Report database | current state
  ansible.builtin.command:
    argv: [podman, secret, inspect, site-portal-reportdb, --format, "{{ '{{' }}index .Spec.Labels \"site.sha256\"{{ '}}' }}"]
  register: _portal_rdb_state
  changed_when: false
  failed_when: false
  check_mode: false                       # only reads the label

- name: Report database | the value
  ansible.builtin.set_fact:
    _portal_rdb_login: >-
      {{ {'host': portal_report_db_host, 'port': portal_report_db_port | int, 'database': portal_report_db_name,
          'user': portal_report_db_user, 'password': portal_report_db_password, 'tls': portal_report_db_tls | bool,
          'ca_pem': lookup('ansible.builtin.file', portal_report_db_ca_file) if portal_report_db_tls | bool and portal_report_db_ca_file | length > 0 else ''} | to_json }}
  no_log: true
  when: _portal_rdb | bool

- name: Report database | the old value removed first (podman before 4.7), or the database turned off
  ansible.builtin.command:
    argv: [podman, secret, rm, site-portal-reportdb]
  when: >-
    _portal_rdb_state.rc == 0 and (not _portal_rdb | bool or
    ((_portal_rdb_state.stdout | trim) != (_portal_rdb_login | hash('sha256')) and _portal_podman.stdout is version('4.7', '<')))
  changed_when: true
  no_log: true
  register: _portal_rdb_gone

- name: Report database | create or replace
  ansible.builtin.command:
    argv: >-
      {{ ['podman', 'secret', 'create']
         + (['--replace'] if _portal_podman.stdout is version('4.7', '>=') and _portal_rdb_state.rc == 0 else [])
         + ['--label', 'site.sha256=' ~ (_portal_rdb_login | hash('sha256')), 'site-portal-reportdb', '-'] }}
    stdin: "{{ _portal_rdb_login }}"
    stdin_add_newline: false
  when: _portal_rdb | bool and (_portal_rdb_state.rc != 0 or (_portal_rdb_state.stdout | trim) != (_portal_rdb_login | hash('sha256')))
  changed_when: true
  failed_when: false                      # said by the next task, with podman's reason
  no_log: true
  register: _portal_rdb_set

- name: Report database | podman made it
  ansible.builtin.fail:
    msg: "podman secret create site-portal-reportdb failed (rc {{ _portal_rdb_set.rc }}): {{ _portal_rdb_set.stderr | default('', true) | trim or 'no reason given' }}"
  when: _portal_rdb_set.rc | default(0) != 0

# ---------------------------------------------------------------- configuration
# The reports' banner, worked out as roles/site_email does (plugins/module_utils/site_banner.py), the portal's server as
# the host held to site_enclave_classified_domains
- name: Config | the banner (the reports' report_banner, report_banner_text, report_banner_color, site_enclave)
  ansible.builtin.set_fact:
    _portal_banner: >-
      {{ {'banner': report_banner | default('auto'), 'text': report_banner_text | default('SECRET'),
          'color': report_banner_color | default(''), 'subject': false, 'enclave': site_enclave | default(''),
          'domains': site_enclave_classified_domains | default([]),
          'hosts': [inventory_hostname] | report_banner_hosts(hostvars)} | report_banner }}

# The settings and the actions as files (JSON), not in the unit: free text needs no quoting there
- name: Config | the service's settings
  ansible.builtin.copy:
    dest: "{{ portal_config_dir }}/settings.json"
    mode: "0644"
    content: "{{ _settings | to_nice_json }}\n"
  vars:
    _settings:
      PORTAL_PATH: "{{ portal_path }}"
      PORTAL_TITLE: "{{ portal_title }}"
      PORTAL_FINDING_DAYS: "{{ portal_finding_days }}"
      PORTAL_FINDING_JOBS: "{{ portal_finding_jobs }}"
      PORTAL_PICK_MAX_LAUNCHES: "{{ portal_pick_max_launches }}"
      PORTAL_PICK_MAX_HOSTS: "{{ portal_pick_max_hosts }}"
      PORTAL_ACTION_MAX_HOSTS: "{{ portal_action_max_hosts }}"
      PORTAL_FINDING_PLAYBOOKS: "{{ portal_finding_playbooks }}"
      PORTAL_LABEL: "{{ portal_label }}"
      PORTAL_DISCOVER_SECONDS: "{{ portal_discover_seconds }}"
      PORTAL_LABEL_APPROVAL: "{{ portal_label_approval }}"
      PORTAL_LABEL_ALONE: "{{ portal_label_alone }}"
      PORTAL_LABEL_AREA: "{{ portal_label_area }}"
      PORTAL_AREA_RULES: "{{ portal_area_rules | default([]) | to_json }}"
      PORTAL_PLAYBOOK_AREAS: "{{ _portal_playbook_areas | default({}) | to_json }}"
      PORTAL_MOTION: "{{ _portal_motion }}"
      PORTAL_PUBLISH_ORGANIZATION: "{{ portal_publish_organization | default('') }}"
      PORTAL_LABEL_TITLE: "{{ portal_label_title }}"
      PORTAL_TITLES: "{{ (portal_titles | site_portal_titles).titles | to_json }}"
      PORTAL_LOGO: "{{ '/etc/site-portal/logo' if _portal_logo_on | default(false) | bool else '' }}"
      PORTAL_APPROVAL_REQUIRED: "{{ portal_approval_required }}"
      PORTAL_LIMIT_MAX: "{{ portal_limit_max }}"
      PORTAL_INVENTORIES_MAX: "{{ portal_inventories_max }}"
      PORTAL_THEME: "{{ report_web_theme | default('atlas') }}"
      PORTAL_BANNER: "{{ {'on': _portal_banner.on, 'text': _portal_banner.text, 'bg': _portal_banner.bg, 'fg': _portal_banner.fg} }}"
      PORTAL_TIME_ZONE: "{{ report_time_zone | default('') }}"
      PORTAL_SELF_APPROVAL: "{{ '1' if portal_allow_self_approval | bool else '0' }}"
      PORTAL_DATA: /data
      PORTAL_REPORTS: /reports
      PORTAL_ACTIONS: /etc/site-portal/actions.json
      PORTAL_AAP_URL: "{{ portal_aap_url | trim }}"
      PORTAL_AAP_VERIFY: "{{ '1' if portal_aap_validate_certs | bool else '0' }}"
      PORTAL_AAP_UI: "{{ portal_aap_ui | trim }}"
      PORTAL_AAP_TIMEOUT: "{{ portal_aap_timeout | string }}"
      PORTAL_INVENTORY: "{{ portal_inventory }}"
      PORTAL_REQUESTERS: "{{ portal_requesters }}"
      PORTAL_APPROVERS: "{{ portal_approvers }}"
      PORTAL_LAUNCHES_PER_HOUR: "{{ portal_launches_per_hour | string }}"
      PORTAL_JOB_EVENTS: "{{ portal_job_events | string }}"
      PORTAL_STIGMAN_PATH: "{{ portal_stigman_path }}"
      # 1.101.2: the live AD page
      PORTAL_AD: "{{ '1' if portal_ad | bool else '0' }}"
      PORTAL_AD_SECONDS: "{{ portal_ad_seconds | string }}"
      PORTAL_AD_OLD_MINUTES: "{{ portal_ad_old_minutes | string }}"
      PORTAL_AD_TEMPLATE: "{{ portal_ad_template | string }}"
      # 1.85.0: the live Network map (its login: the secret site-portal-swis)
      PORTAL_NETMAP: "{{ '1' if _portal_netmap | bool else '0' }}"
      PORTAL_NETMAP_SECONDS: "{{ netmap_live_seconds | string }}"
      PORTAL_SWIS_URL: "{{ portal_solarwinds_url | trim if _portal_netmap | bool else '' }}"
      PORTAL_SWIS_VERIFY: "{{ '1' if portal_solarwinds_validate_certs | bool else '0' }}"
      PORTAL_SWIS_TIMEOUT: "{{ netmap_timeout | default(60) | string }}"
      PORTAL_NETMAP_OPTS:
        site_by: "{{ netmap_site_by | default('auto') }}"
        site_split: "{{ netmap_site_split | default(',') }}"
        site_pattern: "{{ netmap_site_pattern | default('') }}"
        hierarchy: "{{ netmap_hierarchy | default([], true) }}"
        roles: "{{ netmap_roles | default({}, true) }}"
        discover: "{{ netmap_discover | default(true) | bool }}"
        full_seconds: "{{ netmap_full_seconds | default(1800) | int }}"
        sites: "{{ netmap_sites | default({}, true) }}"
        lat_property: "{{ netmap_lat_property | default('') }}"
        lon_property: "{{ netmap_lon_property | default('') }}"
        properties: "{{ netmap_properties | default([], true) }}"
        view: "{{ netmap_view | default('region') }}"
        warn_util: "{{ netmap_link_warn_percent | default(90) | int }}"
        max_nodes: "{{ netmap_max_nodes | default(5000) | int }}"
        # 1.102.0: the AD layer - the report database's AD replication (1.101.2), matched as the AD report matches
        ad_layer: "{{ netmap_ad_layer | default(true) | bool }}"
        ad_site_map: "{{ ad_site_map | default({}, true) }}"
        ad_scale: {low_hours: "{{ ad_repl_low_hours | default(4) | float }}", warn_hours: "{{ ad_repl_warn_hours | default(6) | float }}",
                   crit_hours: "{{ ad_repl_crit_hours | default(24) | float }}"}
        page: "{{ netmap_page_size | default(1000) | int }}"
  register: _portal_settings_file

- name: Config | the actions (the file, or portal_actions - as written, the service checks them again)
  ansible.builtin.copy:
    dest: "{{ portal_config_dir }}/actions.json"
    mode: "0644"
    content: "{{ {'actions': _portal_actions_raw} | to_nice_json(sort_keys=false) }}\n"   # the file's order: the confirm page's
  register: _portal_actions_file

# ---------------------------------------------------------------- its own nginx (portal_own_nginx)
- name: Own nginx | its folders
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: "{{ item.mode }}"
  loop:
    - {path: "{{ portal_config_dir }}/nginx", mode: "0755"}
    - {path: "{{ portal_config_dir }}/tls", mode: "0750"}
  loop_control:
    label: "{{ item.path }}"
  when: portal_own_nginx | bool

# copies, so the container's SELinux label (:Z) never changes the site's own files
- name: Own nginx | the certificate, its key, the cards' CAs (and their CRL)
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ portal_config_dir }}/tls/{{ item.dest }}"
    remote_src: true
    mode: "{{ item.mode }}"
  loop: >-
    {{ [{'src': portal_cert_file, 'dest': 'server.pem', 'mode': '0644'}, {'src': portal_key_file, 'dest': 'server.key', 'mode': '0640'},
        {'src': portal_ca_file, 'dest': 'ca.pem', 'mode': '0644'}]
       + ([{'src': portal_crl_file, 'dest': 'crl.pem', 'mode': '0644'}] if portal_crl_file else []) }}
  loop_control:
    label: "{{ item.dest }}"
  register: _portal_tls
  when: portal_own_nginx | bool and not (ansible_check_mode and _portal_dirs is changed)

- name: Own nginx | an old CRL removed (portal_crl_file empty now)
  ansible.builtin.file:
    path: "{{ portal_config_dir }}/tls/crl.pem"
    state: absent
  register: _portal_crl_gone
  when: portal_own_nginx | bool and not portal_crl_file

- name: Own nginx | its network's unit
  ansible.builtin.template:
    src: site-portal.network.j2
    dest: "{{ _portal_quadlet_dir }}/site-portal.network"
    mode: "0644"
  register: _portal_net_unit
  when: portal_own_nginx | bool

- name: Own nginx | reload systemd so Quadlet makes the network's service  # noqa: no-handler (needed before the next task)
  ansible.builtin.systemd_service:
    daemon_reload: true
    scope: "{{ portal_scope }}"
  when: portal_own_nginx | bool and _portal_net_unit is changed

- name: Own nginx | is the network there
  ansible.builtin.command:
    argv: [podman, network, exists, site-portal]
  register: _portal_own_net_there
  changed_when: false
  failed_when: false
  check_mode: false                       # only reads
  when: portal_own_nginx | bool

# its unit runs once: when the network was removed by hand, it is still "active" - restarted, it makes it again
- name: Own nginx | the network
  ansible.builtin.systemd_service:
    name: site-portal-network.service
    state: "{{ 'started' if _portal_own_net_there.rc == 0 else 'restarted' }}"
    scope: "{{ portal_scope }}"
  ignore_errors: "{{ ansible_check_mode }}"
  when: portal_own_nginx | bool

- name: Own nginx | its DNS address
  ansible.builtin.command:
    argv: [podman, network, inspect, site-portal, --format,
           "{{ '{{' }}range .Subnets{{ '}}' }}{{ '{{' }}.Gateway{{ '}}' }} {{ '{{' }}end{{ '}}' }}"]
  register: _portal_own_net
  changed_when: false
  failed_when: false
  check_mode: false                       # only reads
  when: portal_own_nginx | bool

- name: Own nginx | the resolver
  ansible.builtin.set_fact:
    _portal_resolvers: "{{ (_portal_own_net.stdout | default('')).split() | select('match', '^[0-9.]+$') | list or ['127.0.0.1'] }}"
  when: portal_own_nginx | bool

- name: Own nginx | its server
  ansible.builtin.template:
    src: nginx-portal-server.conf.j2
    dest: "{{ portal_config_dir }}/nginx/portal.conf"
    mode: "0644"
  vars:
    _portal_has_crl: "{{ portal_crl_file | length > 0 }}"
  register: _portal_nginx_conf
  when: portal_own_nginx | bool

# behind STIG Manager's nginx: for a person to read into that nginx - the role never changes it
- name: Config | the nginx lines to add (nginx-portal.conf)
  ansible.builtin.template:
    src: nginx-portal.conf.j2
    dest: "{{ portal_config_dir }}/nginx-portal.conf"
    mode: "0644"
  when: not portal_own_nginx | bool

# 1.68.1: optional, the same way - STIG Manager's page with the script that opens a scorecard link's review
- name: Config | the nginx lines for scorecard links that open the review (nginx-stigman-links.conf, optional)
  ansible.builtin.template:
    src: nginx-stigman-links.conf.j2
    dest: "{{ portal_config_dir }}/nginx-stigman-links.conf"
    mode: "0644"
  when: not portal_own_nginx | bool

# ---------------------------------------------------------------- units
- name: Units | was each already running
  ansible.builtin.command:
    argv: "{{ _portal_systemctl + ['is-active', item] }}"
  loop: [site-portal-app.service, site-portal-nginx.service]
  register: _portal_pre
  changed_when: false
  failed_when: false
  check_mode: false                       # only reads

- name: Units | an own nginx no longer wanted is stopped
  ansible.builtin.systemd_service:
    name: site-portal-nginx.service
    state: stopped
    scope: "{{ portal_scope }}"
  when: not portal_own_nginx | bool and _portal_pre.results[1].stdout in ['active', 'activating', 'reloading']

- name: Units | Quadlet files
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ _portal_quadlet_dir }}/{{ item }}"
    mode: "0644"
  loop: "{{ ['site-portal-data.volume', 'site-portal-app.container'] + (['site-portal-nginx.container'] if portal_own_nginx | bool else []) }}"
  vars:
    _portal_has_trust: "{{ _portal_trust_parts.matched | int > 0 }}"
    _portal_has_swis: "{{ _portal_netmap | bool }}"
    _portal_has_rdb: "{{ _portal_rdb | bool }}"
  register: _portal_units

- name: Units | an own nginx no longer wanted
  ansible.builtin.file:
    path: "{{ _portal_quadlet_dir }}/{{ item }}"
    state: absent
  loop: [site-portal-nginx.container, site-portal.network]
  register: _portal_units_gone
  when: not portal_own_nginx | bool

- name: Units | reload systemd so Quadlet regenerates the services  # noqa: no-handler (must run before the next task, not at the end)
  ansible.builtin.systemd_service:
    daemon_reload: true
    scope: "{{ portal_scope }}"
  when: _portal_units is changed or _portal_units_gone is changed

- name: Units | started
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: started
    scope: "{{ portal_scope }}"
  loop: "{{ ['site-portal-app.service'] + (['site-portal-nginx.service'] if portal_own_nginx | bool else []) }}"
  # a dry run of a FIRST deployment has no units yet (their files were not written): "would start"
  ignore_errors: "{{ ansible_check_mode }}"

# Restart a service only when it was ALREADY running and its inputs changed (started just above: it has them already)
- name: Units | restart the service (what it runs changed)
  ansible.builtin.systemd_service:
    name: site-portal-app.service
    state: restarted
    scope: "{{ portal_scope }}"
  vars:
    _changed: "{{ _portal_units.results | selectattr('changed') | map(attribute='item') | list }}"
  when: >-
    _portal_pre.results[0].stdout in ['active', 'activating', 'reloading']
    and ('site-portal-app.container' in _changed or _portal_app_files is changed or _portal_settings_file is changed
         or _portal_actions_file is changed or _portal_logo_file is changed or _portal_secret_set is changed or _portal_trust is changed
         or _portal_swis_set is changed or _portal_swis_gone is changed
         or _portal_rdb_set is changed or _portal_rdb_gone is changed
         or _portal_trust_gone is changed)

- name: Units | restart its nginx (its server or certificates changed)
  ansible.builtin.systemd_service:
    name: site-portal-nginx.service
    state: restarted
    scope: "{{ portal_scope }}"
  vars:
    _changed: "{{ _portal_units.results | selectattr('changed') | map(attribute='item') | list }}"
  when: >-
    portal_own_nginx | bool and _portal_pre.results[1].stdout in ['active', 'activating', 'reloading']
    and ('site-portal-nginx.container' in _changed or _portal_nginx_conf is changed or _portal_tls is changed
         or _portal_crl_gone is changed)

- name: Firewall | is the portal's port open (own nginx)
  ansible.builtin.command:
    argv: [firewall-cmd, --permanent, --query-port, "{{ portal_port }}/tcp"]
  register: _portal_fw
  changed_when: false
  failed_when: false
  check_mode: false                       # only reads
  when: portal_own_nginx | bool and portal_firewall | bool and portal_scope == 'system'

# the permanent rule and the running one, each by itself: no firewall-cmd --reload (that would drop podman's own rules)
- name: Firewall | open it
  ansible.builtin.command:
    argv: [firewall-cmd, "{{ item }}", --add-port, "{{ portal_port }}/tcp"]
  loop: [--permanent, --zone=public]
  changed_when: true
  when: portal_own_nginx | bool and portal_firewall | bool and portal_scope == 'system' and _portal_fw.rc | default(0) != 0
    and 'not running' not in (_portal_fw.stderr | default(''))

# ---------------------------------------------------------------- verify
- name: Verify | DRY RUN - nothing was changed or started, so there is nothing to verify
  ansible.builtin.debug:
    msg: >-
      DRY RUN (Check mode): the tasks above marked "changed" are what a real run would change
      (tick Show changes, or --diff, to see the file changes). Nothing was changed or restarted.
  when: ansible_check_mode

# inside the container (it publishes no port): the service answers, and what AAP said
- name: Verify | the service answers
  ansible.builtin.command:
    argv: [podman, exec, site-portal-app, /bin/sh, -c,
           "for p in python3.13 python3.12 python3.11 python3.9 python3; do command -v $p >/dev/null 2>&1 && exec $p -c 'import urllib.request;
           print(urllib.request.urlopen(\"http://127.0.0.1:8080/healthz\", timeout=5).read().decode())'; done; exit 1"]
  register: _portal_ready
  until: _portal_ready.rc == 0
  retries: "{{ portal_ready_retries }}"
  delay: "{{ portal_ready_delay }}"
  changed_when: false
  when: not ansible_check_mode

# in the container too: its network path to AAP and its token - each action's state, and whether AAP templates launch
# values (ALLOW_JINJA_IN_EXTRA_VARS "always"; the default "template" treats them as data)
- name: Verify | AAP from the portal - each action, and ALLOW_JINJA_IN_EXTRA_VARS
  ansible.builtin.command:
    argv: [podman, exec, site-portal-app, /bin/sh, /app/start.sh, --aap-check]
  register: _portal_aap_check
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

- name: Verify | what AAP said
  ansible.builtin.set_fact:
    _portal_aap: >-
      {{ _out if _out is mapping else (_out | from_json) if (_out is string and _out is match('^[{]'))
         else {'aap': 'the check gave no answer: ' ~ (_portal_aap_check.stderr | default('') | trim)[-300:]} }}
  vars:
    _out: "{{ _portal_aap_check.stdout | default('') | trim }}"   # ansible-core 2.16 makes it a dict already
  when: not ansible_check_mode

- name: Verify | WARNING - ALLOW_JINJA_IN_EXTRA_VARS is "always"
  ansible.builtin.debug:
    msg: >-
      WARNING: AAP's ALLOW_JINJA_IN_EXTRA_VARS is "always": every extra var a launch gets is templated. The portal refuses
      template braces in every value, but set it back to "template" (Settings > Job settings), the default, which treats
      launch values as data. docs/SITE_PORTAL.md, "Security".
  when: not ansible_check_mode and _portal_aap.jinja | default('') == 'always'

- name: Verify | ALLOW_JINJA_IN_EXTRA_VARS could not be read
  ansible.builtin.debug:
    msg: >-
      ALLOW_JINJA_IN_EXTRA_VARS could not be read (HTTP {{ _portal_aap.jinja_http | default('-') }}: the portal's account may
      not read AAP's settings, which is right for it). Check it once by hand: Settings > Job settings > "Run Jinja in extra
      variables" must not be Always. docs/SITE_PORTAL.md, "Security".
  when: not ansible_check_mode and _portal_aap.aap | default('') == 'ok' and _portal_aap.jinja_http | default(0) != 200
    and portal_check_jinja | bool

- name: Verify | WARNING - the account cannot read the report jobs ("pick a host, then a finding")
  ansible.builtin.debug:
    msg: >-
      WARNING: an action takes a report job and a finding, so the portal lists the findings of the report jobs for a person to pick
      - but its AAP account is not Auditor of any organization, so it may not see them.
      {{ ('It sees no job of: ' ~ (_portal_aap.pick.unread | join(', ')) ~ '. ') if _portal_aap.pick.unread | default([]) | length > 0 else '' }}
      Give it Organization Auditor (the job AAP - set up portal actions does with portal_setup_portal_auditor: true, or in AAP: the
      organization's Access > Add > the account > Auditor). It never needs a write role. docs/SITE_PORTAL.md, "Pick a host, then a finding".
  when: not ansible_check_mode and _portal_aap.pick | default({}) | length > 0 and _portal_aap.pick.on | default(false)
    and _portal_aap.pick.auditor | default([]) | length == 0 and not _portal_aap.pick.system_auditor | default(false)

- name: Verify | the account can read the report jobs
  ansible.builtin.debug:
    msg: >-
      The account reads the report jobs (Auditor of {{ _portal_aap.pick.auditor | join(', ') if _portal_aap.pick.auditor | length > 0 else 'the system' }}){{
      ('; it sees no job of: ' ~ (_portal_aap.pick.unread | join(', ')) ~ ' (none ran yet, or they are in an organization it is not Auditor of)')
      if _portal_aap.pick.unread | length > 0 else '' }}.
  when: not ansible_check_mode and _portal_aap.pick | default({}) | length > 0 and _portal_aap.pick.on | default(false)
    and (_portal_aap.pick.auditor | default([]) | length > 0 or _portal_aap.pick.system_auditor | default(false))

- name: Verify | the actions found in AAP (label {{ portal_label }})
  ansible.builtin.debug:
    msg: >-
      {{ ['Found in AAP (Execute + the label ' ~ _d.label ~ '): ' ~ (_d.shown | length) ~ ' of ' ~ _d.seen ~ ' templates the account may run.']
         + (['Shown: ' ~ (_d.shown | map(attribute='title') | join('; ')) ~ '.'] if _d.shown | length > 0 else
            ['None shown yet: add the label ' ~ _d.label ~ ' to a template the account may Execute (docs/SITE_PORTAL.md, "Add a job to the portal from AAP").'])
         + (['Skipped (with the reason): ' ~ (_d.skipped | map('join', ' - ') | join('; ')) ~ '.'] if _d.skipped | length > 0 else [])
         + ([(_d.unlabelled | string) ~ ' more may be run by the account but have no label ' ~ _d.label ~ ' (left out on purpose).'] if _d.unlabelled | default(0) > 0 else [])
         + (['Not added twice (the built-in action wins): ' ~ (_d.clashes | map('join', ' = the built-in ') | join('; ')) ~ '.'] if _d.clashes | length > 0 else [])
         + (['AAP could not be asked: ' ~ _d.error] if _d.error else []) }}
  vars:
    _d: "{{ _portal_aap.discover }}"
  when: not ansible_check_mode and _portal_aap.discover | default({}) | length > 0 and _portal_aap.discover.on | default(false)

- name: Verify | the actions that point at your names (portal_aap_names)
  ansible.builtin.debug:
    msg: >-
      {% for k in portal_aap_names.keys() | list | sort -%}
      {{ k }} points at "{{ _portal_check.actions[k].aap.name }}" ({{ _portal_check.actions[k].aap.type }}) - AAP: {{ _portal_aap.actions[k] | default('not asked') }}{{ '; ' if not loop.last else '.' }}{%- endfor %}
  when: not ansible_check_mode and portal_aap_names | length > 0

- name: Verify | the nginx lines to add
  ansible.builtin.slurp:
    src: "{{ portal_config_dir }}/nginx-portal.conf"
  register: _portal_lines
  when: not ansible_check_mode and not portal_own_nginx | bool

- name: Verify | summary
  when: not ansible_check_mode
  ansible.builtin.debug:
    msg: "{{ _head + _tail }}"
  vars:
    _head: >-
      {{ ['The site portal is up ' ~ (('with its own nginx on port ' ~ portal_port) if portal_own_nginx | bool
          else ('on the podman network ' ~ portal_network)) ~ '. AAP: ' ~ ('answered (the account ' ~ _portal_aap.account | default('') ~ ')'
          if _portal_aap.aap | default('') == 'ok' else 'NOT REACHED - ' ~ _portal_aap.aap | default('')) ~ '. Every launch is in journalctl'
          ~ (' --user' if portal_scope == 'user' else '') ~ ' -u site-portal-app and in the data volume (portal-log.jsonl).']
         + (['The logo: ' ~ ('on (' ~ _portal_logo_dest ~ ')' if _logo == 'on' else (_logo | default('not shown', true)))] if _portal_logo_dest | length > 0 else [])
         + (['Actions and their state in AAP: ' ~ (_acts | dict2items | map(attribute='key') | zip(_acts | dict2items
              | map(attribute='value')) | map('join', ' - ') | join('; ')) ~ '.'] if _acts else ['No action is listed.']) }}
    _acts: "{{ _portal_aap.actions | default({}) }}"
    _logo: "{{ (_portal_ready.stdout | default('{}') | from_json).logo | default('') }}"
    _tail: >-
      {{ ['The portal: ' ~ portal_public_url] if portal_own_nginx | bool else
         ['Once, by hand: read the lines of ' ~ portal_config_dir ~ '/nginx-portal.conf (below) into the server block of your'
          ~ ' reverse proxy, above its location /, then sudo podman exec <nginx> nginx -t and sudo podman exec <nginx> nginx -s'
          ~ ' reload. The portal is then ' ~ portal_public_url ~ ' (docs/SITE_PORTAL.md, "Add /portal/ to your nginx").',
          'Optional (1.68.1): ' ~ portal_config_dir ~ '/nginx-stigman-links.conf - scorecard links that open the review'
          ~ ' (stigman_link_style: open; docs/CKL_IMPORT.md, "Links that open the review").',
          (_portal_lines.content | b64decode).splitlines() | reject('match', '^#') | list] }}
