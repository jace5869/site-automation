---
# ---- portal_result (1.67.0 part C, docs/SITE_PORTAL.md "From a finding to a fix") ---------------------------------
# The last step of every fix the site portal launches: what came of it, as the job artifact portal_result - the portal's
# job page shows it at the top (Fixed, Still there, Not checked). Include it on the AAP side once: include_role name:
# portal_result, apply {delegate_to: localhost, run_once: true}, with these set:

portal_result_fixed: unknown                     # true (Fixed), false (Still there), or unknown (Not checked)
portal_result_before: ""                         # what the fix found before, short (e.g. "/var 93% full")
portal_result_after: ""                          # what it found after (e.g. "/var 71% full")
portal_result_summary: ""                        # one line for the person who asked
# the finding the fix was for: finding.id (roles/finding_ref) when the play has it, else the finding_id it was given
portal_result_finding_id: "{{ finding.id if finding is defined and finding.id is defined else finding_id | default('') }}"
portal_result_action: "{{ portal_request.action | default(portal_request_action | default('')) }}"   # the portal's action, when it is known
portal_result_read_only: false                   # true in a job that only reads (ACT triage, a recheck): its result is always Not checked
