---
# AAP BACKUP (1.142.0; playbooks/aap_backup.yml, aap_backup_targets.yml, aap_backup_bundle.yml):
# Phase 1 backup, mount target scan, air-gap carry-over bundle, simple retention and optional weekly Berlin schedule
# for a single-host containerized AAP 2.7 deployment. Runs as the non-root ansible user (with become where needed).
# AAP platform only: MariaDB belongs to ServiceNow, and Site portal deploys separately on the STIG Manager host.
# docs/AAP_BACKUP.md

# Non-root installation owner account on the AAP host (rootless podman and containerized installer owner).
aap_backup_user: ansible

# Absolute path to the mounted backup destination on the AAP host (e.g. an NFS share). Never auto-picked.
aap_backup_path: /mnt/ansible_backup

# Expected active mount point for aap_backup_path (empty = any real non-root mount; set e.g. /mnt/ansible_backup to enforce an exact mount).
aap_backup_expected_mount: ""

# Expected mount source for aap_backup_path (empty = not checked; e.g. 192.0.2.50:/exports/aap_backup).
aap_backup_expected_source: ""

# Allowed filesystem types for aap_backup_path (empty = any real non-pseudo filesystem, e.g. [nfs, nfs4, xfs, ext4]).
aap_backup_expected_fstypes: []

# Allow aap_backup_path to sit on the root filesystem / (false refuses unmounted shares exposing an empty local folder on /).
aap_backup_allow_root_fs: false

# Conservative first-run backup size estimate in GiB when no prior verified backup (latest.json) exists yet.
aap_backup_estimate_gb: 50

# Safety headroom percentage added on top of the baseline size (last backup size or estimate), rounded up.
aap_backup_margin_pct: 25

# Containerized AAP 2.7 installer directory on the AAP host (under the ansible user's home by default).
aap_installer_dir: "/home/ansible/ansible-automation-platform-containerized-setup"

# Installer inventory filename inside aap_installer_dir, or an absolute path (empty = first existing of inventory, inventory-growth).
aap_installer_inventory: ""

# Containerized installer backup playbook FQCN or path run from aap_installer_dir.
aap_installer_playbook: "ansible.containerized_installer.backup"

# Path or command name for ansible-playbook on the AAP host used to run the containerized installer backup.
aap_installer_ansible_playbook_bin: "ansible-playbook"

# Extra command-line arguments passed to the containerized installer backup playbook (e.g. [--vault-password-file, /home/ansible/.vault_pass]; no_log in module).
aap_installer_extra_args: []

# Pass --become to the containerized installer backup invocation when the installer inventory requires privilege escalation.
aap_installer_become: false

# Maximum seconds to wait for the containerized installer backup command before timing out with SA-AAPBK-07.
aap_backup_timeout_seconds: 7200

# Behavior when AAP - backup runs inside an AAP job targeting the same AAP host: 'detach' (via systemd-run --user) or 'refuse' (stop with SA-AAPBK-17 and exact CLI).
aap_backup_self_hosted_mode: "detach"

# Polling interval in seconds while waiting for a detached systemd-run --user installer backup status file.
aap_backup_detach_poll_seconds: 5

# Path or command name for systemd-run on the AAP host used to detach self-hosted in-AAP backups as aap_backup_user.
aap_backup_systemd_run_bin: "systemd-run"

# Path or command name for systemctl on the AAP host used to inspect and restart stopped AAP user services in finally.
aap_backup_systemctl_bin: "systemctl"

# Explicit metadata file to read the exact AAP build and release from (empty = auto-read from installer dir and container labels).
aap_backup_version_file: ""

# Manual exact AAP build/release string used only when automatic version detection is unavailable (empty = auto-detect required).
aap_backup_version_override: ""

# Record running/pending AAP jobs via the AAP API before backup when an AAP credential is attached (read-only).
aap_backup_pre_check_running_jobs: true

# Mount table file read for mount verification and target discovery (/proc/self/mountinfo on Linux).
aap_backup_mountinfo_path: "/proc/self/mountinfo"

# Podman executable name or path on the AAP host (used for version labels and custom EE image exports).
aap_backup_podman_bin: "podman"

# ---- Retention (1.142.0, off by default) ----------------------------------------------------
# Delete older verified backups after a new backup succeeds and passes SHA-256 verification (off by default).
aap_backup_retention_enabled: false

# Minimum number of newest verified backups always kept when retention is enabled (never deletes the newest verified copy).
aap_backup_retention_keep: 4

# Optional maximum age in days for verified backups when retention is enabled (0 = count-based only; aap_backup_retention_keep still protects newest copies).
aap_backup_retention_keep_days: 0

# Days to keep quarantined failed staging directories when retention is enabled (0 = never delete quarantine).
aap_backup_retention_quarantine_days: 14

# ---- Weekly schedule in AAP (1.142.0, off by default) ---------------------------------------
# Create or update an optional weekly backup schedule on the AAP - backup job template (off by default; needs AAP credential when true).
aap_backup_schedule_enabled: false

# Name of the weekly schedule created on aap_backup_schedule_template when aap_backup_schedule_enabled is true.
aap_backup_schedule_name: "Weekly AAP backup"

# Weekly run time in 24-hour format: "weekly <Mon..Sun> HH:MM" (defaults to Sunday 02:00 Berlin time).
aap_backup_schedule_when: "weekly Sun 02:00"

# IANA time zone for the optional weekly backup schedule (Berlin time by default).
aap_backup_schedule_timezone: "Europe/Berlin"

# Name of the AAP job template to attach the optional weekly backup schedule to.
aap_backup_schedule_template: "AAP - backup"

# AAP organization holding aap_backup_schedule_template.
aap_backup_schedule_organization: "Default"

# CA certificate bundle path for AAP API calls (empty = system trust store).
aap_backup_ca_path: ""

# Seconds per AAP API request for pre-backup job lookup and optional schedule reconciliation.
aap_backup_api_timeout: 30

# ---- Air-gap bundle (1.142.0, playbooks/aap_backup_bundle.yml) ------------------------------
# Completed backup ID to package into an air-gap bundle (empty = latest verified backup from backups/latest.json).
aap_backup_bundle_id: ""

# Path to the exact-same-build offline AAP 2.7 containerized setup bundle tarball (with bundle/ images) on the AAP host (empty = search search_dirs or pack offline aap_installer_dir).
aap_backup_installer_bundle: ""

# Directories searched for the original AAP setup bundle .tar.gz when aap_backup_installer_bundle is empty (empty = ansible user's home).
aap_backup_installer_bundle_search_dirs: []

# Extra files or folders (relative to aap_installer_dir or absolute) to include in installer/extras/ inside the bundle (e.g. group_vars, CA certs).
aap_backup_bundle_extra_files: []

# Explicit custom execution environment image references to export with podman save (always exported when listed; missing image stops with SA-AAPBK-14).
aap_backup_ee_images: []

# Auto-discover custom EE images in local podman storage matching aap_backup_ee_image_patterns.
aap_backup_ee_auto_discover: true

# Wildcard patterns matched against local podman image names when aap_backup_ee_auto_discover is true.
aap_backup_ee_image_patterns: ["*site-ee*", "*ee-*", "*-ee*"]

# Wildcard patterns excluded from auto-discovered EE images (platform runtime containers; explicit aap_backup_ee_images always win).
aap_backup_ee_exclude_patterns:
  - "*automation-controller*"
  - "*automation-gateway*"
  - "*automation-hub*"
  - "*automation-eda*"
  - "*postgresql*"
  - "*redis*"
  - "*receptor*"
  - "*de-minimal*"
  - "*ee-minimal*"

# Fail with SA-AAPBK-14 if zero custom EE images are found to export (false = warn and continue when no custom EEs exist yet).
aap_backup_ee_require_at_least_one: false

# Directories containing Ansible collection .tar.gz archives or ansible_collections/ trees to carry in the air-gap bundle.
aap_backup_collections_dirs: []

# Auto-discover collections under aap_installer_dir/collections and ~ansible/.ansible/collections when present.
aap_backup_collections_auto_discover: true

# Copy the printable restore runbook PDF (Site-Automation-AAP-Backup-Restore-Guide.pdf) into docs/ inside the air-gap bundle.
aap_backup_bundle_include_runbook: true

# Path on the AAP host to an existing restore runbook PDF (empty = staged from the repository's guides/ folder when available).
aap_backup_bundle_runbook_path: ""

# Pack the verified air-gap bundle directory into one .tar archive with a .tar.sha256 sidecar checksum file.
aap_backup_bundle_archive: true

# Keep the unpacked bundle directory alongside the .tar archive after archive verification succeeds.
aap_backup_bundle_keep_dir: false

# Extra free-space margin percentage added on top of estimated bundle size before bundling.
aap_backup_bundle_overhead_pct: 15
