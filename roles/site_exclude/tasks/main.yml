---
# Runs once, on the controller (add_host and set_fact never connect): the hosts left out go into the inventory group
# site_excluded, and localhost gets site_exclude_not (":!site_excluded", or "" when none) - each later play's hosts
# line ends with it - and site_excluded (the list, for the reports' line). Under a Limit without localhost too
# (delegate_facts: localhost's facts are set from the play's first host).
- name: Exclude | the hosts left out (site_exclude_hosts, site_exclude_groups)
  ansible.builtin.set_fact:
    _sx_hosts: >-
      {{ groups['all'] | site_exclude_role_match(site_exclude_hosts | default([], true), groups, site_exclude_groups | default([], true)) }}
  run_once: true

- name: Exclude | into the group site_excluded (nothing is connected to)
  ansible.builtin.add_host:
    name: "{{ item }}"
    groups: site_excluded
  loop: "{{ _sx_hosts }}"
  run_once: true
  changed_when: false

- name: Exclude | each later play leaves them out
  ansible.builtin.set_fact:
    # 1.130.0: a target with commas (A,B - the portal's hosts, a template's Variables) takes the exclusion as one more
    # comma term (A,B,!site_excluded); appended with ':' Ansible splits at the commas first and the exclusion would bind to B
    # alone, so A would run although it is left out. Without a comma ':' stays (it binds to the whole of x:&y).
    site_exclude_not: "{{ ((',' if (target | default('') | string) is search(',') else ':') ~ '!site_excluded') if _sx_hosts | length > 0 else '' }}"
    # for a play this repository cannot edit (ACT's own, imported): its target with the hosts left out
    site_exclude_target: >-
      {{ target | default('all') }}{{ ((',' if (target | default('') | string) is search(',') else ':') ~ '!site_excluded')
                                       if _sx_hosts | length > 0 else '' }}
    site_excluded: "{{ _sx_hosts }}"
    site_exclude_applied: true
  delegate_to: localhost
  delegate_facts: true
  run_once: true

- name: Exclude | said once
  ansible.builtin.debug:
    msg: "{{ _sx_hosts | site_exclude_role_line(10) }}"
  run_once: true
  when: _sx_hosts | length > 0
