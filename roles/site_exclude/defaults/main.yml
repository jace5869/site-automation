---
# ---- Leave hosts out of every job (1.67.0; playbooks/site_exclude.yml, README "Leave hosts out of every job")
# Hosts no job runs on or connects to, whatever its template, Limit or target: the first play of every playbook that
# runs on hosts takes them out before the first connection. Each report says so in one line at its end ("Left out by
# site_exclude_hosts: ..."); a host left out is never a finding and never "not reached". The VMware and Horizon jobs
# also leave out the VMs and ESXi hosts named here (and keep their own lists). Set them in all.yml.
site_exclude_hosts: []                 # names: whole, or short either way (web01 = web01.example.mil); * and ?; any case
site_exclude_groups: []                # inventory groups: every host in them (* and ?; never all or ungrouped)
# 1.107.0: true on a workflow's dry-run template (AAP - set up job templates puts it there, beside Job type Check): the
# job then refuses to run as Run (playbooks/workflow_dry_run.yml, imported by the playbooks a workflow previews)
site_dry_run_only: false
