---
# VMware Horizon 8 (playbooks/horizon_*.yml): the Connection Server's REST API, from the AAP side, with the
# "Horizon API" credential (its address, domain, user name and password) - no collection needed. Every job
# asks each API path at the newest version first, down to v1, so it fits any Horizon 8 release. A dry run
# (Check) reads and says what it would do; it changes nothing. docs/HORIZON.md

# ---- Connection ---------------------------------------------------------------------------------
horizon_ca_path: ""                      # a CA file for the Connection Server's HTTPS certificate ("" = what the execution environment trusts)
horizon_timeout: 60                      # seconds per request
horizon_page_size: 500                   # records per page when reading pools, desktops and sessions (Horizon's most: 1000)
horizon_api_newest: 9                    # the newest API version to try (v9 down to v1): the first that answers is used
horizon_action_version: v1               # the API version of the actions (reset, recover, log off, push image...)

# ---- Pools no job changes -----------------------------------------------------------------------
# Desktop pools no job fixes, logs off or pushes an image to: names as Horizon Console shows them, * and ?
# allowed, any case (e.g. [VIP-*, Kiosk]). The reports still show them.
horizon_protected_pools: []

# ---- Health report (playbooks/horizon_health_report.yml) ----------------------------------------
horizon_cert_warn_days: 30               # a Connection Server's, gateway's or vCenter's certificate expires within this many days -> amber
horizon_cert_crit_days: 7                # within this many days (or expired, or not valid) -> red
horizon_license_warn_days: 60            # the license expires within this many days -> amber
horizon_report_max_rows: 50              # rows in the problems table (the job's artifacts have all)
horizon_backup_max_hours: 26             # a Connection Server's last configuration backup older than this -> amber
horizon_datastore_warn_pct: 15           # a datastore with less free than this, % -> amber (instant clones and new replicas need room)
horizon_datastore_crit_pct: 5            # less free than this, % -> red
# The health and capacity reports stay green when they find problems: the report says what. true = mark
# the job FAILED on a critical finding, for workflows and alerts.
horizon_health_fail: false

# ---- Capacity report (playbooks/horizon_capacity_report.yml) ------------------------------------
horizon_capacity_warn_pct: 80            # a pool's desktops in use (connected or disconnected) against its maximum, % -> amber
horizon_capacity_crit_pct: 95            # in use, % -> red (also red: no free desktop left)

# ---- Broken desktops (the desktops check -> approval -> the fix job) ----------------------------
# A desktop in one of these states takes no user until it is fixed. Left out on purpose: states that pass
# by themselves (being made, customized, deleted, waiting for the agent at start-up, maintenance).
horizon_broken_states: [AGENT_UNREACHABLE, AGENT_ERR_DISABLED, AGENT_ERR_INVALID_IP, AGENT_ERR_NEED_REBOOT,
                        AGENT_ERR_PROTOCOL_FAILURE, AGENT_ERR_DOMAIN_FAILURE, AGENT_CONFIG_ERROR, ALREADY_USED, ERROR,
                        PROVISIONING_ERROR, UNKNOWN]
# report = the check lists them and stays green (a schedule). approval = when there is a desktop to fix,
# the check hands the list on and FAILS on purpose, so the workflow takes its "Run on fail" path to the
# approval step and then the fix job. Set approval on the workflow's check node.
horizon_desktops_mode: report
horizon_fix_default_action: recover      # what fixes a broken desktop: recover (instant clones: deleted and made again from the image), reset, restart, remove, rebuild
# By state, when another action fits better (e.g. {AGENT_ERR_NEED_REBOOT: restart, PROVISIONING_ERROR: remove}).
horizon_fix_actions: {AGENT_ERR_NEED_REBOOT: restart}
horizon_fix_max: 20                      # fix at most this many desktops per run: the rest are listed, the next run takes them
horizon_fix_exclude_machines: []         # desktops never fixed automatically: names, * and ? allowed (e.g. [W11-TEST-*])
# A desktop left in a passing state (being made, customized, deleted, maintenance, waiting for its agent) for this
# many hours is stuck: the check lists it. Counted from when it was made (or its last maintenance); a desktop
# whose time Horizon does not give is not counted.
horizon_stuck_hours: 4
# What fixes a stuck desktop, by state (e.g. {CUSTOMIZING: recover, WAITING_FOR_AGENT: recover}). Not named = left
# for a person (the default: a stuck desktop often means vCenter, a datastore or the image).
horizon_fix_stuck_actions: {}
# A desktop Horizon lists but vCenter no longer has (missing in vCenter): remove its record. "" = left for a person.
horizon_fix_ghost_action: remove
# This many broken desktops on one ESXi host at once = the host is the problem: all of them are held back, and the
# check says to look at the host (Broadcom KB 431732). 0 = off.
horizon_fix_host_threshold: 5
# A Connection Server that cannot reach or bind to an AD domain holds back every recover and rebuild (a new clone
# could not join the domain): they wait until AD answers. false = off.
horizon_fix_ad_gate: true
# A desktop whose clone error is one of these kinds is not recovered or rebuilt - the cause is outside the
# desktop, and a new clone would fail the same way: domain (join, trust), network (IP, DHCP), datastore (space).
# The others - timeout, activation, other - are recovered. [] = recover every kind.
horizon_fix_hold_error_kinds: [domain, network, datastore]
# More kinds of clone error, tried before the built-in ones: {kind: a regular expression on Horizon's message},
# e.g. {security_agent: "carbon black|tanium"}. A kind named in horizon_fix_hold_error_kinds is held back.
horizon_clone_error_kinds: {}

# ---- Events report (playbooks/horizon_events_report.yml) ----------------------------------------
horizon_events_hours: 24                 # the events of the last this many hours
horizon_events_failed_warn: 5            # a user with this many failed logons or more in the window -> amber
# The event types of a failed logon (* = anything): bad password, locked or disabled account, not entitled...
horizon_events_failed_types: ["BROKER_USER_AUTHFAILED*", "BROKER_USER_NOT_ENTITLED*", "BROKER_USER_NOT_AUTHORIZED*", "BROKER_USER_LOCKED*"]
horizon_events_error_severities: [ERROR, AUDIT_FAIL]   # the events listed under Errors
horizon_events_admin_modules: [Vlsi]     # the event modules of what administrators changed (Horizon Console and its API)

# ---- Settings report (playbooks/horizon_settings_report.yml) ------------------------------------
# What Horizon's settings should be: {area.setting: value}. area: general, security, pre_logon (Horizon's global
# settings) or connection_server (checked on each Connection Server). value: the value, or {min: N}, {max: N},
# {contains: text}, {one_of: [...]}, {not: value}. Empty = the report lists every setting read, to build it
# from (the names differ a little between Horizon releases: copy them from that list). A starting point:
#   horizon_settings_baseline:
#     general.client_idle_session_timeout_policy: TIMEOUT_AFTER
#     general.client_idle_session_timeout_minutes: {max: 15}
#     general.display_pre_login_message: true
#     general.pre_login_message: {contains: "You are accessing a U.S. Government"}
#     pre_logon.display_pre_login_admin_banner: true
#     connection_server.fips_mode_enabled: true
#     connection_server.smart_card_support: REQUIRED
#     connection_server.logoff_when_remove_smart_card: true
horizon_settings_baseline: {}

# ---- Disconnected sessions (playbooks/horizon_session_cleanup.yml) ------------------------------
horizon_session_max_disconnected_hours: 8   # log off a session disconnected for this many hours or more
horizon_session_cleanup_max: 100         # log off at most this many sessions per run
horizon_session_cleanup_exclude_pools: []   # pools whose sessions are never logged off: names, * and ? allowed
horizon_session_cleanup_exclude_users: []   # users never logged off: login names (jdoe or CORP\jdoe) or SIDs
horizon_session_forced_logoff: true      # log off a locked session too (a disconnected session is usually locked)
horizon_session_cleanup_report_only: false  # true = list them, log off none (a dry run - Check - does the same)

# ---- User help (playbooks/horizon_user_help.yml) ------------------------------------------------
horizon_user: ""                         # the user who cannot connect: jdoe, CORP\jdoe, jdoe@corp.example.mil or a SID (a survey question)
# What to do: look (only show their sessions and desktops), logoff (all their sessions), disconnect (their
# connected sessions), reset or restart (their desktops), recover (their instant-clone desktops: made again
# from the image). Never a desktop another user has a session on, nor one in a protected pool.
horizon_user_action: look

# ---- Image push (the push plan -> approval -> the push job) -------------------------------------
horizon_push_pools: []                   # the instant-clone pools to push to: names (a survey: one per line, or separated by commas)
horizon_push_base_vm: ""                 # the golden image VM, as vCenter names it (or its path)
horizon_push_snapshot: ""                # its snapshot to push: the name, or the path when two have that name (e.g. /2026-10/2026-11)
# When the push starts: "" = as soon as the approved push job runs; or a time - "2026-11-01 22:00" (UTC)
# or with an offset, "2026-11-01T22:00-05:00". A time that has passed by the approval starts in a minute.
horizon_push_start: ""
horizon_push_logoff_policy: WAIT_FOR_LOGOFF   # WAIT_FOR_LOGOFF (each desktop is replaced when its user logs off) or FORCE_LOGOFF (users are logged off)
horizon_push_stop_on_first_error: true   # stop the push at the first desktop that fails

# ---- API test (playbooks/horizon_api_test.yml) --------------------------------------------------
horizon_test_user: ""                    # also look up this user (e.g. jdoe), as the user-help job does
