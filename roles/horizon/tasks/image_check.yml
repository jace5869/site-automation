---
# GOLDEN IMAGE CHECK, the report (playbooks/horizon_image_check.yml, last play; on the AAP side, once): what vCenter
# said (image_check_vcenter.yml) and what Windows said (image_check_guest.yml), each check PASS / WARN / FAIL with its
# fix, and READY or NOT READY (plugins/filter/horizon_image_filters.py). Printed, published as job artifacts
# (horizon_report, horizon_image_check), emailed when report_email_to is set. Green unless horizon_image_check_fail.
- name: Horizon image | the report
  ansible.builtin.set_fact:
    # one dict expression: on ansible-core 2.16 the values of a YAML dict would arrive as strings
    _hzi: >-
      {{ hostvars['localhost']._hzi_vc | default({'ran': false, 'why': 'the vCenter part did not run', 'name': horizon_image_vm})
         | hzi_report(hostvars['localhost']._hzi_guest | default({}),
                      {'snapshot_warn': horizon_image_snapshot_warn | int, 'hw_min': horizon_image_hw_min | int,
                       'fslogix': horizon_image_fslogix | bool, 'guest': horizon_image_guest | bool}) }}

- name: Horizon image | report
  ansible.builtin.include_tasks: report.yml
  vars:
    _hz_doc: "{{ _hzi.report }}"
    _hz_footer: "Read-only: vCenter's API and PowerShell on the golden VM over WinRM. {{ _hzi.verdict }}"

- name: Horizon image | {{ _hzi.verdict }}
  ansible.builtin.debug:
    msg: "{{ _hzi.verdict }}"

- name: Horizon image | the checks as job artifacts (horizon_image_check)
  ansible.builtin.set_stats:
    data:
      horizon_image_check: "{{ {'ready': _hzi.ready, 'verdict': _hzi.verdict, 'fail': _hzi.fail, 'warn': _hzi.warn, 'vm': _hzi.vm, 'checks': _hzi.checks} }}"

- name: Horizon image | no FAIL
  ansible.builtin.assert:
    that: _hzi.fail | int == 0
    fail_msg: "{{ _hzi.verdict }} (the report is above). horizon_image_check_fail: false makes this a report only."
    quiet: true
  when: horizon_image_check_fail | bool
