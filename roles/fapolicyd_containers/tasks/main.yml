---
# Read the denials (read-only, a Check run too); then, when rules are asked for, change the one rules file.

- name: Fapolicyd containers | the denials containers caused, grouped, with the rule for each
  site_fapolicyd_containers:
    since: "{{ fapolicyd_container_since }}"
    rules_file: "{{ fapolicyd_container_rules_file }}"
    scope: "{{ fapolicyd_container_scope }}"
    with_exe: "{{ fapolicyd_container_rule_exe | bool }}"
    storage_rules: "{{ fapolicyd_container_storage_rules | bool }}"
    review: "{{ fapolicyd_container_review | bool }}"
    labels: "{{ fapolicyd_container_labels }}"
    programs: "{{ fapolicyd_container_programs }}"
    paths: "{{ fapolicyd_container_paths }}"
    names: "{{ fapolicyd_container_names | bool }}"
    max_groups: "{{ fapolicyd_container_max | int }}"
    timeout: "{{ fapolicyd_container_timeout | int }}"
  register: _fc
  check_mode: false

- name: Fapolicyd containers | add or take out the approved rules
  ansible.builtin.include_tasks: rules.yml
  when:
    - fapolicyd_container_rules | length > 0 or fapolicyd_container_rules_remove | length > 0
    - _fc.state == 'read'
