---
# FAPOLICYD AND CONTAINERS (playbooks/fapolicyd_containers.yml, docs/RUNBOOKS.md "fapolicyd and containers"):
# what fapolicyd blocked that a container caused, the narrowest allow rule for each, and - once approved - those
# rules added to the hosts. A container's files are not in fapolicyd's trust database (RPM fills it from the host's
# packages), so a program in a container image can be denied.

fapolicyd_container_since: today          # ausearch -ts: recent (10 minutes), today, yesterday, this-week, boot
# The approved rules to add, each exactly as the report's "Rules to approve" gives it (or your own allow rule).
# Written to fapolicyd_container_rules_file on every host of the run, then loaded (fagenrules --load). A rule that is
# not a plain allow rule stops the change on every host. Route each one through your security approval (the ISSO).
fapolicyd_container_rules: []
fapolicyd_container_rules_remove: []      # rules this job added earlier, to take out again
# The file this job owns - and only this one. 35: after the deny rules of 30-patterns (ld.so tricks), before
# 40-bad-elf, 41-shared-obj, 42-trusted-elf and 90-deny-execute that deny a container's untrusted files.
fapolicyd_container_rules_file: /etc/fapolicyd/rules.d/35-site-containers.rules
fapolicyd_container_compiled: /etc/fapolicyd/compiled.rules   # what fagenrules builds: the rules are checked there
fapolicyd_container_rules_owner: root      # the rules file's owner, as the other rules.d files
fapolicyd_container_rules_group: fapolicyd # and its group
# The proposed rules. A file that is on the host at the path the audit log holds (a bind mount): the narrowest rule -
# the file (path) or its folder (dir: one rule for every file there; never a system folder), with the program that
# was denied (exe=..., narrower) or for any program (false).
fapolicyd_container_scope: path           # path (the file) or dir (its folder)
fapolicyd_container_rule_exe: true        # the rule names the program denied (false: any program)
# A file inside an image is not on the host at that path (the audit log holds the container's path), and its host
# path changes at each pull of the image: its rule is container storage's folder, for any program -
# allow perm=any all : dir=/var/lib/containers/storage/overlay/ (storage.conf's graphroot; a user's own rootless storage
# for a user's denial, which the note warns about). false = a path rule as for a host file (it will match nothing).
fapolicyd_container_storage_rules: true
# Review the rules files in place (rules.d/*.rules, fapolicyd's own left out) and list what to tighten in the report:
# a wildcard (fapolicyd has none: the rule matches nothing), a system folder or a user-writable folder opened to any
# program, a rule that allows everything, a repeated rule, a rule for an RPM-owned file (trusted already), a file that
# sorts after the stock deny rules. The job changes none of them: its own file only.
fapolicyd_container_review: true
# What marks a denial as a container's (any one): an SELinux label on the program or the file, a container program,
# a path in container storage, or a process in a podman container's cgroup (while it runs).
# The labels: a regular expression on the program's and the file's SELinux labels.
fapolicyd_container_labels: '(^|:)(container_[a-z0-9_]*_t|spc_t)(:|$)'
# The container programs (their base names): what they run or open is a container's.
fapolicyd_container_programs:
  - podman
  - crun
  - runc
  - conmon
  - buildah
  - skopeo
  - catatonit
  - netavark
  - aardvark-dns
  - pasta
  - slirp4netns
  - fuse-overlayfs
  - containerd
  - containerd-shim-runc-v2
  - dockerd
# Container storage: regular expressions on the program's or the file's path.
fapolicyd_container_paths:
  - '^/var/lib/containers/'
  - '/\.local/share/containers/'
  - '^/run/containers/'
  - '^/run/user/[0-9]+/containers/'
  - '^/var/lib/docker/'
fapolicyd_container_names: true          # the containers' names (podman ps, root's and each logged-in user's)
fapolicyd_container_max: 200             # at most this many groups per host (the most denied first)
fapolicyd_container_timeout: 120         # seconds for ausearch
