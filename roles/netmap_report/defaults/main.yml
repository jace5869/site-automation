---
# Network map (playbooks/netmap_report.yml). Read-only: SWQL queries to SolarWinds Orion's SWIS REST API (port 17774)
# with the account of a "SolarWinds (read-only)" credential - an Orion web console account with no admin and no node
# management rights is enough (docs/NETWORK_MAP.md). The same settings drive the site portal's live Network map page
# (roles/site_portal_stack: portal_netmap and netmap_live_seconds).

# SolarWinds' address, e.g. orion.yoursite.mil (https:// and the SWIS port 17774 are added; an Orion older than 2023.1:
# https://orion.yoursite.mil:17778). The credential's SolarWinds URL, when set, wins.
netmap_solarwinds_url: ""
# Check SolarWinds' HTTPS certificate. Orion's own is self-signed: put the CA that signed yours in netmap_ca_path (a file in
# the project, e.g. "{{ playbook_dir }}/files/ca/orion-ca.pem"), or set false. The credential's own settings win.
netmap_validate_certs: true
netmap_ca_path: ""                       # the CA file (PEM) SolarWinds' certificate is checked with; "" = the execution environment's own trust
netmap_timeout: 60                       # seconds for one request (no answer: asked once more)

# ---- Sites: which nodes make a site, and where it is on the map ----------------------------------------------------------
# 1.95.0: auto = read it (the Discovery section says how): the nodes' names, Location's parts, the custom properties, the
# IPv4 subnets and the links - for the site, the building in it and the closet (the distribution switch above). Or name it:
# Location (the text before netmap_site_split, as before 1.95.0) or a node custom property (e.g. Site). A node with none:
# on the site "Not placed".
netmap_site_by: auto
netmap_site_split: ","                           # Location's parts are split at this ("Site A, building 1" -> Site A); "" = one part
# 1.95.0: the site is this regular expression's first group in the node's caption (else its DNS name), e.g. '^([A-Z]{4})'
# or '^([A-Z]{4}[0-9]{4})'; before netmap_site_by. "" = not used
netmap_site_pattern: ""
# 1.95.0: each level as you name it, instead of the discovery: [{level: site|building|closet, from: pattern|property|location|
# subnet|part|topology|none, value: ...}] - pattern: a regular expression (its first group); property: a custom property's
# name; location: Location's part (1, 2 ... -1 the last, all); subnet: 8, 16 or 24; part: the name's part (1, 2 ...);
# topology: the distribution switch above (closet); none: the level is not used. e.g.
# [{level: building, from: location, value: 1}]
netmap_hierarchy: []
# 1.95.0: a device's role by its name (* and ?), instead of what its name, model and links say, e.g. {"*-WC??": wireless};
# the roles: core, distribution, access, firewall, router, wireless, server, other
netmap_roles: {}
netmap_discover: true                    # read every node custom property's name and values for the discovery (false: only netmap_properties)
# Where a site is, in this order: 1. SolarWinds' Worldwide Map (Orion.WorldMap.Point: its nodes' points, their middle);
# 2. two node custom properties with the latitude and longitude (their names here, e.g. Latitude / Longitude);
# 3. netmap_sites below: the site's name as the map shows it (any case), else a pattern with * and ? ("SITA*": every site
# whose name starts SITA, at one place; the most specific pattern wins). A site with none of them shows as a tile.
netmap_lat_property: ""
netmap_lon_property: ""                         # the node custom property holding the site's longitude ("" = not used)
netmap_sites: {}                         # e.g. {"Site A": {lat: 39.4, lon: -93.2}, "SITB*": {lat: 34.9, lon: -112.8}} - usually in all.yml
netmap_properties: []                    # more node custom properties shown in a node's panel and the workbook, e.g. [Region, Building]

# ---- The map --------------------------------------------------------------------------------------------------------------
netmap_view: region                      # the world view's first look: region (1.102.0: the placed sites' region, fitted), globe or flat (each viewer's own choice, once made, is kept in their browser)
# 1.102.0: the AD replication layer on the Region view (Layers: WAN traffic, AD replication - both on by default): the AD
# job's last replication, read from AAP (its job artifact ad_repl; the same "Red Hat Ansible Automation Platform" credential
# as "what changed"), matched to the map's sites as the AD report matches them (ad_site_map, the DCs' nodes, the code, the
# name). The portal's live map reads it from the report database instead. false: no AD layer
netmap_ad_layer: true
netmap_ad_template: Active Directory health report   # the AD job template's name in AAP (its runs' ad_repl), or its ID when two organizations have that name
netmap_link_warn_percent: 90             # a link this busy (in or out, %) is Warning; 0 = never by load (an interface SolarWinds marks Warning still is)
# report_motion (the map's motion on the report website): a setting of every report page now - roles/site_email/defaults.

# ---- Reading -------------------------------------------------------------------------------------------------------------
netmap_page_size: 1000                   # rows a request (the nodes and links are read page by page)
netmap_max_nodes: 5000                   # nodes read at most (more: the first ones, said in the report)
# 1.96.0: read the report database's SolarWinds snapshot (the job "SolarWinds - snapshot") instead of SolarWinds, when
# the template has a "Report database" credential. A snapshot older than solarwinds_db_max_age minutes, or none: SolarWinds
# itself, and the job output says why. false = always SolarWinds itself.
netmap_from_db: true
# 1.111.0: keep each run's read (the sites, the WAN links, their status and utilization) in the report database, for the portal's Network map history
# (a "Report database" credential: the writer account makes the tables, docs/REPORT_DATABASE.md). false = not kept. Never fails the job.
netmap_db: true
netmap_db_create: true                   # make the tables when they are not there (false: make them by hand once, docs/REPORT_DATABASE.md)
netmap_db_timeout: 10                    # seconds to wait for the database
netmap_db_keep_reads_days: 90            # every read kept this many days, then one row a site and a link a day
netmap_db_keep_days: 400                 # the day rows kept this many days (0 = never deleted)
solarwinds_db_max_age: 20                # minutes a snapshot may be old for a report (all.yml: every report reads it); 0 = never the snapshot
# What changed since the last run: this template's last successful run kept a copy (job artifact netmap_snapshot), read
# back from AAP with the report's "Red Hat Ansible Automation Platform" credential (as report_history). Without it: "not
# compared", the rest as usual.
netmap_compare: true
# The kept copy names each link's interfaces, for "Missing link" (about 140 KB for 1,500 nodes). false = the ids only
# (about 90 KB; a missing link then shows its interfaces' ids) - for a workflow: there each job's artifacts become the
# next step's extra variables, so do not put Network map in a workflow, or set this false.
netmap_snapshot_links: true

# ---- The report ----------------------------------------------------------------------------------------------------------
netmap_max_rows: 500                     # rows in a table of the email and the page at most (the workbook always has all)
netmap_xlsx: true                        # attach the nodes, links, WAN links, sites and changes as an Excel workbook (.xlsx) to the email
netmap_fail: false                       # true = mark the job FAILED when SolarWinds could not be read (the report still goes out), for workflows
netmap_raw: false                        # true = also print what SolarWinds gave for the first nodes and links (to see what a field holds on your Orion)
