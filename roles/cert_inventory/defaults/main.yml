---
# CERTIFICATE INVENTORY: every certificate report (Linux, Windows, VMware, network devices) can also
# write what it found - every certificate, with the same fields from each - for a dashboard (Power BI ...).
# Two ways, each on by itself: files (CSV + JSON) and a SQL Server table. A Check run writes nothing.
# The fields: id, source, host, location, subject, issuer, sans, not_after, days, status, tier (root /
# intermediate / ca-signed / self-signed), trust_store, in_use, public_key, sig_alg, serial, sha1, sha256,
# scanned_at, job (docs/CERT_INVENTORY.md).

# ---- files: <source>-certificates.csv and .json (source: linux, windows, vmware, net), replaced each run ----

cert_inventory_files: false              # true = write the files
cert_inventory_dir: /var/lib/site-automation/cert-inventory   # where: on the AAP node the job runs on (a path AAP exposes to jobs: docs/CERT_INVENTORY.md), or on cert_inventory_host
cert_inventory_host: ''                  # an inventory host to write them on instead (a file server, or a Linux host with the share mounted); its credential must be on the job template
cert_inventory_history: false            # true = also a dated copy (<source>-certificates-YYYY-MM-DD.csv) next to them, for trends

# ---- SQL Server: one table, a row per host, place and certificate (first_seen, last_seen, present) ----

# The login comes from the "SQL Server (certificate inventory)" credential (aap/credential_types/cert_inventory_sql.yml).
# The execution environment needs pymssql and community.general (the all-in-one EE has both).

cert_inventory_sql: false                # true = add / update the rows
cert_inventory_sql_server: ''            # the SQL Server (name or address)
cert_inventory_sql_port: 1433            # its port
cert_inventory_sql_database: ''          # the database (SQL Server 2016 or later: the rows go in as JSON, OPENJSON)
cert_inventory_sql_table: dbo.cert_inventory   # schema.table
cert_inventory_sql_create: false         # true = create the table (and its view <table>_current) when it is not there - the account then needs CREATE TABLE
