---
# LINUX SOFTWARE INVENTORY (playbooks/linux_sw_inventory.yml, docs/LINUX_SW_INVENTORY.md): every installed RPM package
# of the Linux hosts of the Limit - name, epoch, version, release, arch, vendor, install time, source rpm. Hands-off:
# rpm -qa as the login account, nothing written on the hosts. Run it nightly (02:00). Each export is written on its own: one that fails says which, why (an SA-SWI code) and the fix; the others
# are still written.

# The exports: shield (a text file per host), csv, json (one file per run and a latest one)
sw_inventory_outputs: [shield, csv, json]

# The folder the files are written in, on the execution node: a path AAP exposes to jobs, or '' = the job's own folder
# (gone after the job - then set sw_inventory_share)
sw_inventory_dir: ''

# The shield files' folder, under sw_inventory_dir and under the share's folder: <short host name>.txt each
sw_inventory_shield_subdir: shield

# A Windows file share's folder the files are copied to (\\fileserver.yourdomain.mil\share\folder), or a folder mounted
# on the execution nodes; '' = none. The login: the "Windows file share" credential (user@YOURDOMAIN.MIL, Modify on
# the folder). The folder must be there; the job makes the folders inside it.
sw_inventory_share: ''

# A folder under the share's folder for them ('' = the share's folder itself)
sw_inventory_share_subdir: ''

# How the share is logged in to: negotiate (Kerberos first - FIPS), kerberos or ntlm; the report website's setting
sw_inventory_share_auth: "{{ report_web_smb_auth | default('negotiate') }}"

# Encrypt every byte (SMB 3), also on a share that does not require it
sw_inventory_share_encrypt: "{{ report_web_smb_encrypt | default(false) }}"

# Days the dated files (sw-inventory-YYYYMMDD-HHMMSS-job<ID>.csv / .json) are kept, here and on the share. 0 = all
sw_inventory_keep_days: 90

# The email (report_email_to): the report with the CSV, the JSON and a zip of the shield files attached. false = no email from
# this job (the report website page stays)
sw_inventory_email: true

# The CSV, the JSON and the shield zip each at most (MB): one bigger is left off and the email says where it is. The
# workbook always goes (its Packages sheet stops at sw_inventory_xlsx_max_rows)
sw_inventory_email_max_mb: 10

# The workbook's Packages sheet at most this many rows (0 = all); the CSV has them all
sw_inventory_xlsx_max_rows: 20000

# The report's top changed packages
sw_inventory_report_top: 15

# Seconds rpm may take on a host
sw_inventory_read_timeout: 120

# true = the job fails at its end when an export, the share copy, the website or the email failed (after the rest)
sw_inventory_fail_on_output_error: true
