---
# LINUX SOFTWARE INVENTORY, on the controller once (playbooks/linux_sw_inventory.yml - it runs even when no host could
# be reached): library/site_sw_inventory.py parses every host's read (tasks/read.yml), compares it with
# its last list and writes the exports (shield, CSV, JSON) and the share. Then the website and the email, each on its
# own (one that fails never stops the other), and - with sw_inventory_fail_on_output_error - a failed job when an
# export or a delivery failed. The hosts' reads are deleted at the end, whatever happened.
- name: Software inventory | the controller step
  block:
    - name: Software inventory | a folder for the hosts' reads, when none was made
      ansible.builtin.tempfile:
        state: directory
        prefix: sw-inventory-
      register: _sw_work_new
      check_mode: false
      when: _sw_work_path is not defined

    - name: Software inventory | parse, compare with the last run, write the exports ({{ sw_inventory_outputs | join(', ') }})
      site_sw_inventory:
        work_dir: "{{ _sw_work_path | default(_sw_work_new.path) }}"
        hosts: >-
          {%- set out = [] -%}
          {%- for h in _sw_targets | default([]) -%}
          {%-   set hv = hostvars[h] -%}
          {%-   set why = hv.site_host_unreached | default('', true) or hv._sw_fail | default('', true) -%}
          {%-   set _ = out.append({'host': h, 'reason': ('NOT REACHED - ' ~ why) if hv.site_host_unreached | default('', true) else why,
                                    'skipped': hv._sw_fail is not defined and not hv.site_host_unreached | default('', true)}) -%}
          {%- endfor -%}
          {{ out }}
        read_at: "{{ _sw_read_at | default(now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ')) }}"
        job: "{{ (awx_job_id | default(tower_job_id | default(0))) | int }}"
        outputs: "{{ (sw_inventory_outputs | replace(',', ' ')).split() if sw_inventory_outputs is string else sw_inventory_outputs }}"
        dir: "{{ sw_inventory_dir | default('', true) }}"
        shield_subdir: "{{ sw_inventory_shield_subdir }}"
        share: "{{ sw_inventory_share | default('', true) }}"
        share_subdir: "{{ sw_inventory_share_subdir | default('', true) }}"
        share_auth: "{{ sw_inventory_share_auth }}"
        share_encrypt: "{{ sw_inventory_share_encrypt | bool }}"
        keep_days: "{{ sw_inventory_keep_days | int }}"
        xlsx_max_rows: "{{ sw_inventory_xlsx_max_rows | int }}"
        email_max_mb: "{{ sw_inventory_email_max_mb | float }}"
        top: "{{ sw_inventory_report_top | int }}"
      register: _sw

    - name: Software inventory | {{ _sw.report.title }}
      ansible.builtin.debug:
        msg: "{{ (_sw.report | report_text).splitlines() + _sw.lines }}"

    - name: Software inventory | the counts as job artifacts (sw_inventory)
      ansible.builtin.set_stats:
        data:
          sw_inventory:
            read_at: "{{ _sw.read_at }}"
            hosts_read: "{{ _sw.hosts_read }}"
            hosts_not_read: "{{ _sw.not_read }}"
            packages: "{{ _sw.packages }}"
            hosts_changed: "{{ _sw.hosts_changed }}"
            outputs: "{{ _sw.outputs | items2dict(key_name='name', value_name='state') }}"

    # the website and the email on their own: a mail setting missing never keeps the page off the website, and back
    - name: Software inventory | the report website (report_web_dest)
      when: report_web_dest | default('') | length > 0
      block:
        - name: Software inventory | publish it
          ansible.builtin.include_role:
            name: site_email
          vars:
            _report: "{{ _sw.report }}"
            _report_xlsx: "{{ (lookup('ansible.builtin.file', _sw.sheets_file) | from_json) if _sw.sheets_file else [] }}"
            _report_xlsx_optional: true
            _report_xlsx_desc: "Excel workbook - Packages (every host's) and Changed since last run"
            _report_workbook_stem: "sw-inventory-{{ _sw.read_at[:10] }}"
            _report_attachments: "{{ _sw.web_files }}"     # the CSV and the JSON, whatever the email's limit
            _report_web_files_more: [.json]                 # the JSON hosted too (text)
            _report_email_skip: true
      rescue:
        - name: Software inventory | the website failed
          ansible.builtin.set_fact:
            _sw_delivery_failed: "{{ _sw_delivery_failed | default([]) + ['website: ' ~ (ansible_failed_result.msg | default('see above'))] }}"

    - name: Software inventory | the email (report_email_to)
      when:
        - sw_inventory_email | bool
        - report_email_to | default([]) | length > 0 or report_email_also | default([]) | length > 0
      block:
        - name: Software inventory | email it
          ansible.builtin.include_role:
            name: site_email
          vars:
            _report: "{{ _sw.report }}"
            _report_xlsx: "{{ (lookup('ansible.builtin.file', _sw.sheets_file) | from_json) if _sw.sheets_file else [] }}"
            _report_xlsx_optional: true
            _report_xlsx_desc: "Excel workbook - Packages (every host's) and Changed since last run"
            _report_workbook_stem: "sw-inventory-{{ _sw.read_at[:10] }}"
            _report_attachments: "{{ _sw.attachments }}"
            _report_web_skip: true
      rescue:
        - name: Software inventory | the email failed
          ansible.builtin.set_fact:
            _sw_delivery_failed: "{{ _sw_delivery_failed | default([]) + ['email: ' ~ (ansible_failed_result.msg | default('see above'))] }}"

    - name: Software inventory | no email
      ansible.builtin.debug:
        msg: "No email: {{ 'sw_inventory_email is false' if not sw_inventory_email | bool else 'report_email_to is not set (docs/EMAIL_REPORTS.md)' }}."
      when: not sw_inventory_email | bool or (report_email_to | default([]) | length == 0 and report_email_also | default([]) | length == 0)
  always:
    - name: Software inventory | the hosts' reads, deleted
      ansible.builtin.file:
        path: "{{ _sw_work_path | default(_sw_work_new.path | default('')) }}"
        state: absent
      check_mode: false
      when: (_sw_work_path | default(_sw_work_new.path | default(''))) is match('^/.+/sw-inventory-[^/]+$')

- name: Software inventory | every export and delivery done (sw_inventory_fail_on_output_error)
  ansible.builtin.assert:
    that: _sw.failed_outputs | length == 0 and _sw_delivery_failed | default([]) | length == 0
    fail_msg: >-
      Not done: {{ (_sw.failed_outputs + _sw_delivery_failed | default([])) | join('; ') }} - the report and the lines
      above say why and the fix; the rest was written. sw_inventory_fail_on_output_error: false keeps the job green.
    quiet: true
  when: sw_inventory_fail_on_output_error | bool
