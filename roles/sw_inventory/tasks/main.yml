---
# LINUX SOFTWARE INVENTORY, on the controller once (playbooks/linux_sw_inventory.yml - it runs even when no host could
# be reached): library/site_sw_inventory.py parses every host's read (tasks/read.yml), compares it with
# its last list and writes the exports (shield, CSV, JSON) and the share. Then the website and the email, each on its
# own (one that fails never stops the other), and - with sw_inventory_fail_on_output_error - a failed job when an
# export or a delivery failed. The hosts' reads are deleted at the end, whatever happened.
# 1.135.2: sw_inventory_shares read on its own, never shown (no_log: a template error could quote an entry's password).
# Each entry: path (a user@ in it: refused, never handed on), subdir, user, password, auth, encrypt - each kept as it is
# written (empty = the credential's / sw_inventory_share_auth / sw_inventory_share_encrypt); the module checks each.
# A list that cannot be read (an undefined variable in it, or not a list): said as a failed output, the rest still goes.
- name: Software inventory | sw_inventory_shares (more file shares)
  block:                                # no "when": a list that cannot be read is said, never taken for none
    - name: Software inventory | read sw_inventory_shares (never shown)
      ansible.builtin.set_fact:
        _sw_shares_error: "{{ '' if (sw_inventory_shares is sequence and sw_inventory_shares is not string and sw_inventory_shares is not mapping
                                     and sw_inventory_shares is not ansible.builtin.vault_encrypted) or sw_inventory_shares is none
                                 else 'not a list' }}"
        _sw_shares: >-
          {%- set out = [] -%}
          {%- set given = sw_inventory_shares if sw_inventory_shares is sequence and sw_inventory_shares is not string
                                                 and sw_inventory_shares is not mapping
                                                 and sw_inventory_shares is not ansible.builtin.vault_encrypted else [] -%}
          {%- for x in given -%}
          {%-   set e = x if x is mapping else {'path': x} -%}
          {%-   set unres = [] -%}
          {%-   for k in ['path', 'subdir', 'user', 'password', 'auth', 'encrypt'] if k in e and e[k] is not defined -%}
          {%-     set _ = unres.append(k) -%}
          {%-   endfor -%}
          {%-   set pth = ('' if e.path is not defined or e.path is none else e.path | string).strip() -%}
          {%-   set _ = out.append({'path': '' if pth is search('@') else pth, 'refused': pth is search('@'),
                                    'subdir': '' if e.subdir is not defined or e.subdir is none else e.subdir | string,
                                    'user': '' if e.user is not defined or e.user is none else e.user | string,
                                    'password': '' if e.password is not defined or e.password is none else e.password | string,
                                    'auth': '' if e.auth is not defined or e.auth is none else e.auth | string,
                                    'encrypt': '' if e.encrypt is not defined or e.encrypt is none else e.encrypt | string,
                                    'unresolved': unres}) -%}
          {%- endfor -%}
          {{ out }}
      no_log: true
  rescue:
    - name: Software inventory | sw_inventory_shares could not be read
      ansible.builtin.set_fact:
        _sw_shares: []
        _sw_shares_error: could not be read (an undefined variable in it?)

- name: Software inventory | the controller step
  block:
    # 1.135.2: the module's own report and lines come from its result file (no secret in them); a crash before that
    # file is said in fixed words (its own output is hidden: its arguments hold the share passwords)
    - name: Software inventory | the controller step (output hidden - the report follows)
      block:
        - name: Software inventory | parse, compare with the last run, write the exports ({{ sw_inventory_outputs | join(', ') }})
          site_sw_inventory:
            work_dir: "{{ _sw_work_made.path }}"
            hosts: >-
              {%- set out = [] -%}
              {%- for h in _sw_targets | default([]) -%}
              {%-   set hv = hostvars[h] -%}
              {%-   set why = hv.site_host_unreached | default('', true) or hv._sw_fail | default('', true) -%}
              {%-   set _ = out.append({'host': h, 'reason': ('NOT REACHED - ' ~ why) if hv.site_host_unreached | default('', true) else why,
                                        'skipped': hv._sw_fail is not defined and not hv.site_host_unreached | default('', true)}) -%}
              {%- endfor -%}
              {{ out }}
            read_at: "{{ _sw_read_at | default(now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ')) }}"
            job: "{{ (awx_job_id | default(tower_job_id | default(0))) | int }}"
            outputs: "{{ (sw_inventory_outputs | replace(',', ' ')).split() if sw_inventory_outputs is string else sw_inventory_outputs }}"
            dir: "{{ sw_inventory_dir | default('', true) }}"
            shield_subdir: "{{ sw_inventory_shield_subdir }}"
            # a user or password in the address (user@server): never handed on, never shown - refused by its flag
            share: "{{ '' if (sw_inventory_share | default('', true)) is search('@') else sw_inventory_share | default('', true) }}"
            share_refused: "{{ (sw_inventory_share | default('', true)) is search('@') }}"
            share_subdir: "{{ sw_inventory_share_subdir | default('', true) }}"
            share_auth: "{{ sw_inventory_share_auth }}"
            share_encrypt: "{{ sw_inventory_share_encrypt | bool }}"
            # 1.135.2: more destinations (sw_inventory_shares, read above - never shown); no_log on this task: an entry's
            # password never in the job output nor in the execution node's log (ansible-core 2.16 logs the arguments)
            shares: "{{ _sw_shares | default([]) }}"
            shares_error: "{{ _sw_shares_error | default('') }}"
            keep_days: "{{ sw_inventory_keep_days | int }}"
            xlsx_max_rows: "{{ sw_inventory_xlsx_max_rows | int }}"
            email_max_mb: "{{ sw_inventory_email_max_mb | float }}"
            top: "{{ sw_inventory_report_top | int }}"
          register: _sw_run
          no_log: true                      # never shown, never logged: the share passwords are in its arguments

        - name: Software inventory | the result (no password in it)
          site_sw_inventory:
            work_dir: "{{ _sw_work_made.path }}"
            result_from: "{{ _sw_run.result_file }}"
          register: _sw
      rescue:
        - name: Software inventory | the controller step failed
          ansible.builtin.fail:
            msg: >-
              The software inventory's controller step failed before its report ({{ (ansible_failed_result.exception
              | default(ansible_failed_result.module_stderr | default('')) | string | regex_search('[A-Za-z]+(Error|Exception)'))
              | default('no error name', true) }}, rc {{ ansible_failed_result.rc | default('-') }}). Its output is hidden: it
              holds the share logins. Check the execution environment (Python 3, smbprotocol) and sw_inventory_shares, then
              run it again; docs/LINUX_SW_INVENTORY.md, When something fails.

    - name: Software inventory | {{ _sw.report.title }}
      ansible.builtin.debug:
        msg: "{{ (_sw.report | report_text).splitlines() + _sw.lines }}"

    - name: Software inventory | the counts as job artifacts (sw_inventory)
      ansible.builtin.set_stats:
        data:
          sw_inventory:
            read_at: "{{ _sw.read_at }}"
            hosts_read: "{{ _sw.hosts_read }}"
            hosts_not_read: "{{ _sw.not_read }}"
            packages: "{{ _sw.packages }}"
            hosts_changed: "{{ _sw.hosts_changed }}"
            outputs: "{{ _sw.outputs | items2dict(key_name='name', value_name='state') }}"

    # the website and the email on their own: a mail setting missing never keeps the page off the website, and back
    - name: Software inventory | the report website (report_web_dest)
      when: report_web_dest | default('') | length > 0
      block:
        - name: Software inventory | publish it
          ansible.builtin.include_role:
            name: site_email
          vars:
            _report: "{{ _sw.report }}"
            _report_xlsx_file: "{{ _sw.sheets_file }}"     # a file: the packages never in the job events
            _report_xlsx_optional: true
            _report_xlsx_desc: "Excel workbook - Packages (every host's) and Changed since last run"
            _report_workbook_stem: "sw-inventory-{{ _sw.read_at[:10] }}"
            _report_attachments: "{{ _sw.web_files }}"     # the CSV and the JSON, whatever the email's limit
            _report_web_files_more: [.json]                 # the JSON hosted too (text)
            _report_email_skip: true

        # report_web_required: false - a page not written is no failed task, only _web_failed: said and counted here
        - name: Software inventory | the website not written
          ansible.builtin.set_fact:
            _sw_delivery_failed: "{{ _sw_delivery_failed | default([]) + ['website: ' ~ _web_failed] }}"
          when: _web_failed | default('') | length > 0
      rescue:
        - name: Software inventory | the website failed
          ansible.builtin.set_fact:
            _sw_delivery_failed: "{{ _sw_delivery_failed | default([]) + ['website: ' ~ (ansible_failed_result.msg | default('see above'))] }}"

    - name: Software inventory | the email (report_email_to)
      when:
        - sw_inventory_email | bool
        - report_email_to | default([]) | length > 0 or report_email_also | default([]) | length > 0
      block:
        - name: Software inventory | email it
          ansible.builtin.include_role:
            name: site_email
          vars:
            _report: "{{ _sw.report }}"
            _report_xlsx_file: "{{ _sw.sheets_file }}"     # a file: the packages never in the job events
            _report_xlsx_optional: true
            _report_xlsx_desc: "Excel workbook - Packages (every host's) and Changed since last run"
            _report_workbook_stem: "sw-inventory-{{ _sw.read_at[:10] }}"
            _report_attachments: "{{ _sw.attachments }}"
            _report_web_skip: true
      rescue:
        - name: Software inventory | the email failed
          ansible.builtin.set_fact:
            _sw_delivery_failed: "{{ _sw_delivery_failed | default([]) + ['email: ' ~ (ansible_failed_result.msg | default('see above'))] }}"

    - name: Software inventory | no email
      ansible.builtin.debug:
        msg: "No email: {{ 'sw_inventory_email is false' if not sw_inventory_email | bool else 'report_email_to is not set (docs/EMAIL_REPORTS.md)' }}."
      when: not sw_inventory_email | bool or (report_email_to | default([]) | length == 0 and report_email_also | default([]) | length == 0)
  always:
    - name: Software inventory | the hosts' reads, deleted (only the folder this run made)
      ansible.builtin.file:
        path: "{{ _sw_work_made.path }}"
        state: absent
      check_mode: false
      when:
        - _sw_work_made.path | default('') is match('^/.+/sw-inventory-[A-Za-z0-9_]+$')
        - _sw_work_made.path == _sw_work_path | default('')

- name: Software inventory | hosts not reached fail the job (site_unreachable_fails) - after the report
  ansible.builtin.fail:
    msg: >-
      Not reached: {{ _sw.not_read | selectattr('reason', 'match', '^NOT REACHED') | map(attribute='host') | join(', ') }}
      (site_unreachable_fails: true). The report above lists them with why.
  when:
    - site_unreachable_fails | default(false) | bool
    - _sw.not_read | selectattr('reason', 'match', '^NOT REACHED') | list | length > 0

- name: Software inventory | every export and delivery done (sw_inventory_fail_on_output_error)
  ansible.builtin.assert:
    that: _sw.failed_outputs | length == 0 and _sw_delivery_failed | default([]) | length == 0
    fail_msg: >-
      Not done: {{ (_sw.failed_outputs + _sw_delivery_failed | default([])) | join('; ') }} - the report and the lines
      above say why and the fix; the rest was written. sw_inventory_fail_on_output_error: false keeps the job green.
    quiet: true
  when: sw_inventory_fail_on_output_error | bool
