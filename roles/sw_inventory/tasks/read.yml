---
# LINUX SOFTWARE INVENTORY, on each host (playbooks/linux_sw_inventory.yml): hands-off - the login account, no sudo,
# nothing written on the host; in Check nothing runs on the hosts at all. A host that cannot be reached stays in the
# play with a fixed reason (never the connection's own text: it can carry what a proxy or a login helper printed), so the
# controller step after it always runs. The read (files/sw_read.sh: rpm -qa) goes to the host's sh with raw (no Python
# needed, no file staged); its output goes to a folder on the controller, never into a task result (AAP keeps those).
- name: Software inventory | reach the host
  ansible.builtin.raw: echo reached      # no Python, no module
  changed_when: false
  ignore_unreachable: true
  register: _sw_reach                   # Check: skipped (raw runs nothing in Check)

- name: Software inventory | reached? (a fixed reason, never the connection's own text)
  ansible.builtin.set_fact:
    site_host_unreached: >-
      {{ '' if not _sw_reach.unreachable | default(false) else
         'the connection timed out (switched off, a firewall, or the address)' if 'timed out' in _m or 'timeout' in _m else
         'the login was refused (the Machine credential)' if 'permission denied' in _m or 'authentication' in _m
                                                              or 'password' in _m or 'publickey' in _m else
         'its name was not found (DNS, or the address in the inventory)' if 'could not resolve' in _m or 'name or service not known' in _m else
         'the connection was refused (SSH not listening there)' if 'connection refused' in _m else
         'no route to the host (the network)' if 'no route' in _m or 'network is unreachable' in _m else
         'its SSH host key did not match (known_hosts)' if 'host key' in _m else
         'it could not be reached (the job output above has the message of the connection)' }}
  vars:
    _m: "{{ _sw_reach.msg | default('', true) | string | lower }}"

- name: Software inventory | not reached - listed in the report (site_unreachable_fails fails the job after the report)
  ansible.builtin.debug:
    msg: "{{ inventory_hostname }}: NOT REACHED - {{ site_host_unreached }}. Left out of this run; the report lists it."
  when: site_host_unreached | length > 0

- name: Software inventory | read the installed packages (rpm -qa, as the login account - nothing written on the host)
  ansible.builtin.raw: |
    SW_READ_TIMEOUT={{ sw_inventory_read_timeout | int }} sh -s <<'SW_READ_SCRIPT_END'
    {{ lookup('ansible.builtin.file', 'sw_read.sh') }}
    SW_READ_SCRIPT_END
  args:
    executable: /bin/sh                 # through a shell on every connection (podman's exec has none)
  register: _sw_read
  changed_when: false
  failed_when: false
  ignore_unreachable: true              # lost during the read: listed with a fixed reason
  no_log: true                          # the package list is not kept in AAP's job events (the next step keeps it)
  when: site_host_unreached | length == 0 and not ansible_check_mode

- name: Software inventory | the read, to the controller's folder
  ansible.builtin.copy:
    content: "{{ _sw_read.stdout | default('') }}"
    dest: "{{ _sw_work_path }}/{{ inventory_hostname | hash('sha1') }}.read"
    mode: "0600"
  delegate_to: localhost
  become: false
  no_log: true
  register: _sw_stage
  failed_when: false                    # a staging failure: this host listed as not read, with why
  # a read that ended, or one that said why it stopped (@@error: no rpm, rpm failed) - the controller says it
  when: >-
    site_host_unreached | length == 0 and not ansible_check_mode and _sw_read.rc | default(1) == 0
    and ('@@end' in _sw_read.stdout | default('') or '@@error' in _sw_read.stdout | default(''))

- name: Software inventory | why a host was not read (a fixed reason)
  ansible.builtin.set_fact:
    _sw_fail: >-
      {{ '' if site_host_unreached | length > 0 else
         'Check mode: not read (nothing runs on the hosts in Check)' if ansible_check_mode else
         'the connection was lost during the read' if _sw_read.unreachable | default(false) else
         ('the read could not be kept on the controller (the folder of the job: space or access)'
          if _sw_stage is not skipped and _sw_stage.dest | default('') | length == 0 else '') if _sw_ok else
         'no POSIX shell on the host (/bin/sh)' if _sw_read.rc | default(0) == 127 else
         'the read timed out (sw_inventory_read_timeout)' if _sw_read.rc | default(0) == 124 else
         'the read failed (exit ' ~ (_sw_read.rc | default('?')) ~ '; the job output above has more)' }}
  vars:
    _sw_ok: >-
      {{ _sw_read.rc | default(1) == 0 and ('@@end' in _sw_read.stdout | default('') or '@@error' in _sw_read.stdout | default('')) }}
