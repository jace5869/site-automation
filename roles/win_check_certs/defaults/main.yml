---
# WINDOWS CERTIFICATES: every certificate in the machine stores below, and which of them are in
# use (https bindings of IIS / WSUS / ..., the WinRM HTTPS listener AAP connects through, Remote
# Desktop). Expiring soon -> warning / critical. Expired: critical when in use, or when it expired
# less than win_check_certs_expired_report_days ago (older leftovers are only listed in the
# certificate report).

win_check_certs_warn_days: 30            # a certificate expiring within this many days -> warning (amber in the certificate report)
win_check_certs_notice_days: 60                # the certificate report colours these blue (an early heads-up; not a finding)
win_check_certs_crit_days: 7             # within this many days -> critical
win_check_certs_expired_report_days: 30  # an expired certificate NOT in use is a finding for this many days after it expired; older ones only in the report
win_check_certs_stores: ['Cert:\LocalMachine\My', 'Cert:\LocalMachine\WebHosting', 'Cert:\LocalMachine\Remote Desktop']  # the machine certificate stores read
win_check_certs_trust: false             # also every other machine store: Trusted Root, Intermediate CAs, Other People, ... (the certificate report turns it on); with its private key checked as above, without it only listed (trust store)
win_check_certs_trust_skip_stores: ['Disallowed', 'AuthRoot', 'REQUEST', 'SMS']  # stores never read: the untrusted certificates, the roots Windows Update keeps, pending requests (a CSR's key), the MECM client's own
win_check_certs_remote_desktop: false    # false = Remote Desktop's certificates are left out of the report and the renewal (Windows or the GPO renews them): the Remote Desktop store, the one RDP uses, those for Remote Desktop only; true = checked like the others
win_check_certs_ignore_subjects: []     # wildcards, e.g. ['CN=localhost*']
# TLS services whose certificate a client actually gets, e.g.
#   win_check_certs_endpoints:
#     - {name: IIS, host: 127.0.0.1, port: 443, servername: web01.yoursite.mil}
win_check_certs_endpoints: []

# ---- Renewal: a new key and CSR for each certificate that expires soon (playbooks/win_cert_renew_csr.yml) ----
# The certificates the Windows certificate report flags (within win_check_certs_warn_days, or expired) that
# are the server's own - not a trust store's - get a new key and a CSR with the same subject, names and
# purposes (certreq -new -machine). The CSR goes on the certificate's ServiceNow ticket, as for Linux; the
# key stays on the server in the pending request until certreq -accept -machine installs the issued
# certificate. Never: CA certificates, self-signed ones (unless win_cert_renew_self_signed), a certificate
# only served on a port (win_check_certs_endpoints: its store is not known). cert_renew_skip_hosts /
# cert_renew_skip_groups, cert_renew_attach_ext / _type / _retry_txt apply to Windows too.
win_cert_renew_dir: 'C:\ProgramData\site-automation\renew'  # the CSRs and their .inf / .json, on the server (administrators and SYSTEM only); the key is not here: it is in the machine key store
win_cert_renew_key_bits: 2048            # RSA key size, at least 2048 (a bigger old key keeps its size; an EC certificate gets a new key on the same curve)
win_cert_renew_digest: sha256            # the CSR's signature: sha256, sha384 or sha512
win_cert_renew_max: 10                   # at most this many NEW CSRs per server in one run (the rest come the next run)
win_cert_renew_self_signed: false        # true = a self-signed certificate gets a CSR too, for the PKI to issue a real one in its place (never one only for localhost)
win_cert_renew_issuer: ''                # regular expression: only certificates whose issuer matches (empty = any CA), e.g. 'O=U\.S\. Government'
win_cert_renew_exclude_issuer: ''        # regular expression: certificates whose issuer matches are never renewed here (renewed by their own tool)
win_cert_renew_only: ''                  # regular expression on the certificate's place, e.g. 'used by https' (empty = every one)
win_cert_renew_exportable: false         # true = the new key can be exported (to move it to another server); false keeps it on this one

# ---- Install: the issued certificate (playbooks/win_cert_install_check.yml -> approval ->
# playbooks/win_cert_install_approved.yml) ----
# The PKI's certificate, from the request carrying the CSR (cert_renew_servicenow: catalog), is put together with
# its pending key by certreq -accept -machine (in Personal); its chain's intermediate CAs go into Intermediate
# Certification Authorities (never a root). Then each binding of the old certificate moves to it - the kinds
# listed here - and is read back; with full PowerShell the https ports are asked which certificate they serve.
# Anything wrong: the bindings go back to the old certificate, which stays in the store (a restore is a
# rebinding). The new key gets the old key's extra permissions (a service account), and NETWORK SERVICE for Remote
# Desktop. A person installs it, with the steps - when SQL Server uses it (a restart), a Central Certificate Store
# binding, the WinRM HTTPS listener AAP connects through. docs/CERT_INSTALL.md
win_cert_install_rebind: [https, rdp, winrm]   # https: HTTP.sys bindings (IIS, WSUS ...); rdp: Remote Desktop; winrm: the WinRM HTTPS listener
win_cert_install_verify_wait: 15         # seconds an https port has, after the rebinding, to serve the new certificate (full PowerShell only)

# ---- Restore: the bindings back on the old certificate (playbooks/win_cert_restore.yml) ----
win_cert_restore_backup: ''              # a backup's folder name, as the restore's Check lists it
win_cert_restore_only: ''                # or: the newest backup of each certificate whose thumbprint or subject matches (a regular expression)
