---
# FAPOLICYD - BLOCKS AND RULES (a part of playbooks/fapolicyd.yml, roles/fapolicyd; docs/RUNBOOKS.md "fapolicyd"): what
# fapolicyd blocked on each host - or, permissive, would block - and the change that lets each through; the rules files'
# clean-up; permissive mode on or off. Each change is a line to approve; once approved, the job makes it.
# roles/fapolicyd sets these four from its own: fapolicyd_approved, fapolicyd_since, fapolicyd_dir, fapolicyd_wait
fapolicyd_rules_approved: []              # set by roles/fapolicyd: the rules lines of fapolicyd_approved
fapolicyd_rules_since: today              # set by roles/fapolicyd: fapolicyd_since
fapolicyd_rules_dir: /etc/fapolicyd       # set by roles/fapolicyd: fapolicyd_dir
fapolicyd_rules_own_rules: 36-site-approved.rules   # the rules file (in rules.d) this job writes its allow rules to
fapolicyd_rules_own_trust: site-approved  # the trust file (in trust.d) this job writes its trust entries to
fapolicyd_rules_never_edit: [35-site-containers.rules]   # rules files (in rules.d) reviewed, never changed (the old containers job's own)
# A clean-up that blocks more (a rule that opened too much, taken out) is made only while fapolicyd is permissive: a
# program it would break shows as a would-be block, not as an outage. true: made while it enforces too.
fapolicyd_rules_when_enforcing: false
# A container's denial (as the containers job tells them apart): an SELinux label on the program or the file, a
# container program, or a path in container storage.
fapolicyd_rules_container_labels: '(^|:)(container_[a-z0-9_]*_t|spc_t)(:|$)'
fapolicyd_rules_container_programs: [podman, crun, runc, conmon, buildah, skopeo, catatonit, containerd, containerd-shim-runc-v2, dockerd]   # container programs
fapolicyd_rules_container_paths: ['^/var/lib/containers/', '/\.local/share/containers/', '^/run/containers/', '^/run/user/[0-9]+/containers/']   # container storage
fapolicyd_rules_user_dirs: [/home/, /run/user/, /tmp/, /var/tmp/, /dev/shm/]   # folders users can write: a file blocked there gets no trust entry (a person decides)
fapolicyd_rules_hash_max_mb: 512          # a file larger than this is not hashed: a person adds it
fapolicyd_rules_max: 200                  # at most this many block groups per host in the report
fapolicyd_rules_wait: 30                  # roles/fapolicyd sets it from fapolicyd_wait
fapolicyd_rules_timeout: 120              # seconds for each command the job reads with
