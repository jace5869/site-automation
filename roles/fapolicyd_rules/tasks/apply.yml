---
# The approved changes this host has (fapolicyd_rules_job_plan): packages reinstalled (dnf reinstall, the same version:
# a file that no longer matches its package), trust entries (fapolicyd-cli --file add, to the job's own trust file, then
# the package's owner, group and mode on it - a STIG umask leaves it root:root 0600, unreadable to fapolicyd), trust
# entries updated (a trusted file that changed: its size and sha256 now, in the trust file it is in), allow rules (the
# job's own rules file), rules commented out, rules files renamed, permissive. Then the
# rules loaded, the trust reloaded or fapolicyd restarted (permissive changed), checked in the same go on the host with
# the way back sent inline (roles/fapolicyd_fix/files/fapolicyd_fix_reload.sh): running before and not after - or a
# program no longer starts - every file put back. Then compiled.rules checked against the rules files (fagenrules --check).

- name: Fapolicyd rules | the plan (the approved lines this host has now)
  ansible.builtin.set_fact:
    _fr_plan: "{{ _fr | fapolicyd_rules_job_plan(_fr_approved, fapolicyd_rules_when_enforcing | bool) }}"

- name: Fapolicyd rules | a line approved that this job never gives - nothing changed
  ansible.builtin.set_fact:
    _fr_apply: {state: refused, error: "a line approved is not one this job gives: nothing changed on any host",
                bad: "{{ _fr_plan.bad }}", refused: [], applied: [], not_here: "{{ _fr_plan.not_here }}"}
  when: _fr_plan.bad | length > 0

- name: Fapolicyd rules | nothing approved that this host has
  ansible.builtin.set_fact:
    _fr_apply: {state: "{{ 'refused' if _fr_plan.refused else 'unchanged' }}", error: "", bad: [], refused: "{{ _fr_plan.refused }}",
                applied: [], not_here: "{{ _fr_plan.not_here }}"}
  when: _fr_apply is not defined and not _fr_plan.changed

# fixed before the block: its condition is checked again for each of its tasks, and "the result" sets _fr_apply
- name: Fapolicyd rules | anything to change on this host
  ansible.builtin.set_fact:
    _fr_go: "{{ _fr_apply is not defined }}"

- name: Fapolicyd rules | change, then load the rules or restart fapolicyd
  when: _fr_go | bool
  vars:
    _fr_rules_d: "{{ fapolicyd_rules_dir }}/rules.d"
    _fr_conf: "{{ fapolicyd_rules_dir }}/fapolicyd.conf"
    # the way back, a shell function sent inline with the reload and in the rescue - never a file run on the host
    _fr_back: "{{ _fr_plan | fapolicyd_rules_job_rollback(_fr, _fr_tmp.path) }}"
    # 1.79.15: back() and fapolicyd as it was (running: restarted; not: stopped) - raw and the guard send it
    _fr_restore: |
      {{ _fr_back }}
      {{ lookup('ansible.builtin.file', role_path ~ '/../fapolicyd_fix/files/fapolicyd_restore.sh') }}
      restore {{ _fr.active | quote }}
    _fr_rules_changed: "{{ (_fr_plan.add + _fr_plan.rename) | length > 0 or _fr_plan.remove | length > 0 }}"
  block:
    - name: Fapolicyd rules | a folder for the way back
      ansible.builtin.tempfile:
        state: directory
        suffix: .fapolicyd-rules
      register: _fr_tmp
      check_mode: false

    - name: Fapolicyd rules | each file the change touches, as it is now
      ansible.builtin.copy:
        src: "{{ item.0 }}"
        dest: "{{ _fr_tmp.path }}/{{ item.1 }}"
        remote_src: true
        mode: preserve
      loop: "{{ _fr_plan | fapolicyd_rules_job_backups(_fr) }}"
      loop_control:
        label: "{{ item.0 }}"
      check_mode: false

    - name: Fapolicyd rules | packages reinstalled, the same version - each file as its package has it (dnf reinstall)
      ansible.builtin.command:
        argv: "{{ ['dnf', '-y', 'reinstall'] + (_fr_plan.reinstall | map(attribute='package') | unique | list) }}"
      register: _fr_reinstall
      changed_when: true
      when: _fr_plan.reinstall | length > 0 and not ansible_check_mode

    - name: Fapolicyd rules | each file matches its package now (rpm -V)
      ansible.builtin.command:
        argv: [rpm, -V, "{{ item.package }}"]
      loop: "{{ _fr_plan.reinstall }}"
      loop_control:
        label: "{{ item.path }}"
      register: _fr_rpmv
      changed_when: false
      failed_when: >-
        _fr_rpmv.stdout_lines | select('search', ' ' ~ (item.path | regex_escape) ~ '$') | select('match', '^(S|..5)') | list | length > 0
      when: _fr_plan.reinstall | length > 0 and not ansible_check_mode

    - name: Fapolicyd rules | trust entries (fapolicyd-cli --file add, to {{ fapolicyd_rules_own_trust }})
      ansible.builtin.command:
        argv: [fapolicyd-cli, --file, add, "{{ item }}", --trust-file, "{{ fapolicyd_rules_own_trust }}"]
      loop: "{{ _fr_plan.trust }}"
      register: _fr_add
      changed_when: _fr_add.rc == 0
      failed_when: _fr_add.rc != 0 and 'nothing to add' not in (_fr_add.stdout ~ _fr_add.stderr)
      when: not ansible_check_mode

    - name: Fapolicyd rules | the trust file readable to fapolicyd (the package's owner, group and mode)
      ansible.builtin.file:
        path: "{{ _fr.own_trust }}"
        owner: "{{ _fr.trust_ref.owner }}"
        group: "{{ _fr.trust_ref.group }}"
        mode: "{{ _fr.trust_ref.mode }}"
      when: _fr_plan.trust | length > 0 and not ansible_check_mode

    - name: Fapolicyd rules | the trust file as fapolicyd will read it
      ansible.builtin.slurp:
        src: "{{ _fr.own_trust }}"
      register: _fr_trust_now
      when: _fr_plan.trust | length > 0 and not ansible_check_mode

    - name: Fapolicyd rules | each trust entry is the file as approved (its size and sha256)
      ansible.builtin.assert:
        that: _fr_missing | length == 0
        fail_msg: "{{ _fr.own_trust }} does not hold, as approved: {{ _fr_missing | join('; ') }}"
        quiet: true
      vars:
        _fr_missing: "{{ _fr_plan.trust_lines | difference((_fr_trust_now.content | b64decode).splitlines() | map('trim') | list) }}"
      when: _fr_plan.trust | length > 0 and not ansible_check_mode

    - name: Fapolicyd rules | trust entries updated - the file as it is now, as approved (its size and sha256)
      ansible.builtin.lineinfile:
        path: "{{ item.file }}"
        regexp: "^{{ item.path | regex_escape }} "
        line: "{{ item.entry }}"
      loop: "{{ _fr_plan.trust_update }}"
      loop_control:
        label: "{{ item.entry }}"

    - name: Fapolicyd rules | the allow rules approved, in {{ fapolicyd_rules_own_rules }}
      ansible.builtin.copy:
        dest: "{{ _fr.own_rules }}"
        content: "{{ _fr.managed | fapolicyd_rules_job_file(_fr_plan.add) }}"
        owner: "{{ _fr.trust_ref.owner }}"
        group: "{{ _fr.trust_ref.group }}"
        mode: "0644"
      when: _fr_plan.add | length > 0

    - name: Fapolicyd rules | rules commented out, marked
      ansible.builtin.copy:
        dest: "{{ _fr_rules_d }}/{{ item.key }}"
        content: "{{ _fr.rules_files[item.key] | fapolicyd_rules_job_edit(item.value, 'approved ' ~ now(utc=true).strftime('%Y-%m-%d')) }}"
        owner: "{{ _fr.trust_ref.owner }}"
        group: "{{ _fr.trust_ref.group }}"
        mode: "0644"
      loop: "{{ _fr_plan.remove | dict2items }}"
      loop_control:
        label: "{{ item.key }}: {{ item.value | join('; ') }}"

    - name: Fapolicyd rules | rules files renamed (before the stock deny rules)
      ansible.builtin.command:
        argv: [mv, -n, "{{ _fr_rules_d }}/{{ item.0 }}", "{{ _fr_rules_d }}/{{ item.1 }}"]
        creates: "{{ _fr_rules_d }}/{{ item.1 }}"
      loop: "{{ _fr_plan.rename }}"
      when: not ansible_check_mode

    - name: Fapolicyd rules | permissive
      ansible.builtin.lineinfile:
        path: "{{ _fr_conf }}"
        regexp: '^\s*permissive\s*='
        line: "permissive = {{ _fr_plan.permissive_to }}"
      when: _fr_plan.permissive_to | length > 0

    - name: Fapolicyd rules | fapolicyd takes the new fapolicyd.conf (fapolicyd-cli --check-config)
      ansible.builtin.command:
        argv: [fapolicyd-cli, --check-config]
      register: _fr_check
      changed_when: false
      failed_when: _fr_check.rc != 0
      when: _fr_plan.permissive_to | length > 0 and not ansible_check_mode

    - name: Fapolicyd rules | the rules built from the files before the restart (fagenrules)
      ansible.builtin.command:
        argv: [fagenrules]
      changed_when: true
      when: _fr_plan.action == 'restart' and _fr_rules_changed | bool and not ansible_check_mode

    # 1.79.15: before fapolicyd takes the change, the way back armed on the host: when the change keeps Ansible from
    # even logging in again, the host puts everything back by itself after fapolicyd_rules_guard_seconds
    - name: Fapolicyd rules | the way back armed on the host (it puts everything back by itself unless Ansible runs there after)
      ansible.builtin.shell:
        cmd: "{{ _fr_restore | fapolicyd_guard_arm(_fr_tmp.path, [fapolicyd_rules_guard_seconds | int, 30] | max) }}"
        executable: /bin/sh
      register: _fr_guard
      changed_when: true
      when: not ansible_check_mode and _fr_plan.action != 'none'

    - name: Fapolicyd rules | load the rules, reload the trust or restart fapolicyd ({{ _fr_plan.action }}), check it, put back if it broke
      ansible.builtin.shell:
        cmd: |
          {{ _fr_back }}
          set -- {{ _fr_plan.action }} {{ _fr.active | quote }} {{ _fr.python | default('/usr/bin/python3') | quote }} {{ fapolicyd_rules_wait | int }}
          {{ lookup('ansible.builtin.file', role_path ~ '/../fapolicyd_fix/files/fapolicyd_fix_reload.sh') }}
        executable: /bin/sh
      register: _fr_reload
      changed_when: true
      when: not ansible_check_mode and _fr_plan.action != 'none'

    # 1.79.15: fapolicyd up is not enough - Ansible must still be able to run its modules here (a rule on its remote tmp
    # gone, and no job, this one too, runs on the host any more). Right after the load, before any other module - after
    # the reload's own put-back too: a new connection, a module run from its file (no pipelining: what other jobs do);
    # when it fails, every file put back over raw (no module) and fapolicyd as it was, then checked again the same way.
    - name: Fapolicyd rules | Ansible after the change - a new connection
      ansible.builtin.meta: reset_connection

    - name: Fapolicyd rules | Ansible after the change - a module runs here
      ansible.builtin.command: "true"
      vars:
        ansible_pipelining: false
      register: _fr_ansible
      changed_when: false
      ignore_errors: true
      ignore_unreachable: true
      when: not ansible_check_mode

    - name: Fapolicyd rules | Ansible can no longer run here - every file put back (raw), fapolicyd as it was
      ansible.builtin.raw: "{{ _fr_restore }}"
      args:
        executable: /bin/sh
      register: _fr_rawback
      changed_when: true
      failed_when: false
      ignore_unreachable: true
      when: _fr_ansible is failed or _fr_ansible is unreachable

    - name: Fapolicyd rules | Ansible after putting it back - a new connection
      ansible.builtin.meta: reset_connection
      when: _fr_rawback is not skipped

    - name: Fapolicyd rules | Ansible after putting it back - a module runs here again
      ansible.builtin.command: "true"
      vars:
        ansible_pipelining: false
      register: _fr_ansible2
      changed_when: false
      ignore_errors: true
      ignore_unreachable: true
      when: _fr_rawback is not skipped

    - name: Fapolicyd rules | Ansible after the change - what it came to
      ansible.builtin.set_fact:
        _fr_lost: "{{ _fr_rawback is not skipped }}"
        # put back only when raw ran and said so, and Ansible runs there only when a module ran with rc 0
        _fr_keep: >-
          {{ _fr_rawback is not skipped and not (_fr_rawback is not unreachable and _fr_rawback.rc | default(1) == 0
             and _fr_ansible2 is not skipped and _fr_ansible2 is not unreachable and _fr_ansible2.rc | default(1) == 0) }}

    - name: Fapolicyd rules | compiled.rules is what the rules files say (fagenrules --check)
      ansible.builtin.command:
        argv: [fagenrules, --check]
      register: _fr_built
      changed_when: false
      failed_when: "'No change' not in _fr_built.stdout"
      when:
        - not ansible_check_mode and _fr_rules_changed | bool
        - not ((_fr_reload.stdout_lines | default([])) | select('match', '^RESULT rolled-back') | list)
        - not _fr_lost | bool

    - name: Fapolicyd rules | the result
      ansible.builtin.set_fact:
        _fr_apply:
          state: >-
            {{ 'would change' if ansible_check_mode else ('failed' if _fr_keep | bool
               else ('rolled back' if _fr_word == 'rolled-back' or _fr_lost | bool else 'changed')) }}
          active_after: >-
            {{ _fr_state_now if _fr_lost | bool else (_fr.active if _fr_word == 'none' else ('active' if _fr_word == 'active'
               else (_fr_res[-1] if _fr_word == 'rolled-back' else _fr_word | regex_replace('^still-', '')))) }}
          permissive_after: >-
            {{ _fr_plan.permissive_to if (_fr_word in ['none', 'active'] or _fr_word.startswith('still-')) and not _fr_lost | bool else '' }}
          error: >-
            {{ ([('fapolicyd ' ~ _fr_res[2] ~ ' after the change: every file put back, fapolicyd ' ~ _fr_res[-1])
                 if _fr_word == 'rolled-back' else '']
                + [('Ansible could not run a module on the host after the change (' ~ _fr_lost_why ~ '): '
                    ~ (('every file put back, fapolicyd ' ~ _fr_state_now
                        ~ ('. Ansible runs there again' if not _fr_keep | bool
                           else '. STILL no module runs there: look at the rules files by hand (fagenrules --load)'))
                       if _fr_rawback is not unreachable and _fr_rawback.rc | default(1) == 0
                       else ('putting it back failed' ~ (' (no new connection)' if _fr_rawback is unreachable else ', fapolicyd ' ~ _fr_state_now))))
                   if _fr_lost | bool else '']
                + [('the backups stay in ' ~ _fr_tmp.path ~ (' on the host, which puts them back by itself '
                    ~ fapolicyd_rules_guard_seconds ~ ' s after the change' if _fr_guard is not skipped else ''))
                   if _fr_keep | bool else ''])
               | select | join(' - ') }}
          note: >-
            {{ ('fapolicyd is ' ~ _fr.active ~ ': the change takes effect when it starts') if _fr.active != 'active' and not ansible_check_mode else '' }}
          back: "{{ 'putting it back failed: look at the files by hand' if 'BACK failed' in (_fr_reload.stdout_lines | default([])) else '' }}"
          backup: "{{ _fr_tmp.path if _fr_keep | bool else '' }}"
          applied: "{{ _fr_plan.apply }}"
          refused: "{{ _fr_plan.refused }}"
          not_here: "{{ _fr_plan.not_here }}"
          bad: []
          journal: "{{ (_fr_reload.stdout_lines | default([])) | select('match', '^JOURNAL ') | map('regex_replace', '^JOURNAL ', '') | list }}"
      vars:
        _fr_res: "{{ ((_fr_reload.stdout_lines | default([])) | select('match', '^RESULT ') | list + ['RESULT none'])[0].split() }}"
        _fr_word: "{{ _fr_res[1] }}"
        _fr_state_now: >-
          {{ ((_fr_rawback.stdout_lines | default([])) | select('match', '^STATE ') | list + ['STATE unknown'])[-1].split()[-1] }}
        _fr_lost_why: >-
          {{ (('unreachable: ' ~ (_fr_ansible.msg | default(''))) if _fr_ansible is unreachable else
              ((_fr_ansible.module_stderr | default('', true)) or (_fr_ansible.msg | default('', true)) or (_fr_ansible.stderr | default(''))))
             | string | trim | regex_replace('\s*[\r\n]+\s*', ' ') | truncate(240) }}
  rescue:
    # raw (1.79.15): it runs even when what failed was fapolicyd blocking Ansible's module files
    - name: Fapolicyd rules | put back every file, fapolicyd as it was
      ansible.builtin.raw: "{{ _fr_restore }}"
      args:
        executable: /bin/sh
      register: _fr_putback
      changed_when: true
      failed_when: false
      ignore_unreachable: true
      when: not ansible_check_mode and _fr_tmp.path is defined

    - name: Fapolicyd rules | putting it back - what it came to
      ansible.builtin.set_fact:
        _fr_keep: "{{ _fr_putback is not skipped and (_fr_putback is unreachable or _fr_putback.rc | default(1) != 0) }}"

    - name: Fapolicyd rules | the change failed - said in the report, the host fails after it
      ansible.builtin.set_fact:
        _fr_apply:
          state: failed
          active_after: "{{ _fr.active }}"
          error: >-
            {{ (ansible_failed_task.name | default('') | regex_replace('^.*[|] ', '')) ~ ': '
               ~ ((ansible_failed_result.stderr | default('', true)) or (ansible_failed_result.stdout | default('', true))
                  or (ansible_failed_result.msg | default(''))) | trim | regex_replace('\s*[\r\n]+\s*', ' ')
               ~ (' - putting it back failed: the backups stay in ' ~ _fr_tmp.path ~ ' on the host - look at the files by hand'
                  if _fr_keep | bool else (' - every file put back' if _fr_putback is not skipped else '')) }}
          backup: "{{ _fr_tmp.path if _fr_keep | bool else '' }}"
          applied: []
          refused: "{{ _fr_plan.refused }}"
          not_here: "{{ _fr_plan.not_here }}"
          bad: []
  always:
    # raw (1.79.15): both run while modules may still be blocked. Recovery not complete: the guard stays armed and the
    # backups stay (named in the report)
    - name: Fapolicyd rules | the way back disarmed
      ansible.builtin.raw: "{{ _fr_guard | fapolicyd_guard_disarm(_fr_tmp.path) }}"
      args:
        executable: /bin/sh
      changed_when: false
      failed_when: false
      ignore_unreachable: true
      check_mode: false
      when: _fr_guard is defined and _fr_guard is not skipped and not _fr_keep | default(false) | bool

    - name: Fapolicyd rules | remove the way back
      ansible.builtin.raw: |
        case {{ _fr_tmp.path | quote }} in */*.fapolicyd-rules) rm -rf -- {{ _fr_tmp.path | quote }} ;; *) exit 1 ;; esac
      args:
        executable: /bin/sh
      changed_when: false
      failed_when: false
      ignore_unreachable: true
      check_mode: false
      when: _fr_tmp.path is defined and not _fr_keep | default(false) | bool

- name: Fapolicyd rules | the changes
  ansible.builtin.debug:
    msg: >-
      {{ _fr_apply.state }}{{ (': ' ~ _fr_apply.error) if _fr_apply.error | default('') else '' }}
      {{- (' - ' ~ _fr_apply.note) if _fr_apply.note | default('') else '' }}
      {{- (' - made: ' ~ (_fr_apply.applied | map(attribute='line') | join('; '))) if _fr_apply.applied | default([]) else '' }}
      {{- (' - not proposed here: ' ~ (_fr_apply.not_here | join('; '))) if _fr_apply.not_here | default([]) else '' }}
