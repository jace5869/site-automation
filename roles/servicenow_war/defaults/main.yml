---
# WEEKLY ACTIVITY REPORT (playbooks/servicenow_war.yml, docs/SERVICENOW_WAR.md): everything a ServiceNow assignment group
# had on its plate in a week - incidents, catalog tasks, changes, change tasks, problem tasks - what was opened, what was
# completed and when (the date of closure), what is still open and for how long, who had what; the lines to paste into
# the WAR; the same as an Excel workbook; emailed (on the report website only with servicenow_war_web). From the AAP side with the "ServiceNow
# API" credential (the account needs read on the tables: itil). Read-only, in Check too.

# The assignment group(s), exactly as ServiceNow names them: a list, or text - one name, or several on separate lines
# or separated by ; or , (a survey or a schedule's answer; never cut at spaces or dashes). Every task of the week that
# is assigned to one of them now. e.g. [Ops - Example group]. One template serves every team: set it per launch, per
# survey answer or per schedule (docs/SERVICENOW_WAR.md, "Several teams").
servicenow_war_groups: []
# Also the tasks assigned to these people, whatever their group (user names, or full names). Empty = the groups' tasks.
servicenow_war_users: []
# The report website: false (the default) = this report is not published there, whatever report_web_dest says - only
# emailed (and in the job output and artifact); true = published like the other reports.
servicenow_war_web: false
# On the report website (servicenow_war_web: true) each team's runs go in their own folder ({template}/<the group, lower case with dashes>/...): its
# own latest page and its own line on the index, when one template runs for several teams. false: one folder for all.
servicenow_war_web_per_team: true
# The tables read: incident (tickets), sc_task (catalog tasks, SCTASK), change_request (changes), change_task (CTASK),
# problem_task (PTASK); also problem, sc_req_item (RITM), sc_request (REQ), or any task table of your instance. "task" = every
# kind of task in one read (the parent table: everything, whatever its class). A table the account cannot read is said in
# the report, not counted.
servicenow_war_tables: [incident, sc_task, change_request, change_task, problem_task]
servicenow_war_fields_extra: []         # more columns of your own read from every table, e.g. [u_customer, u_site]: on the workbook
# THE WEEK. days = the last servicenow_war_days days up to now (a Friday afternoon run: the week so far); last-week = the
# previous calendar week, from servicenow_war_week_start to the day before it (a Monday morning run: last week, whole);
# this-week = this calendar week so far; dates = from servicenow_war_since to servicenow_war_until. Dates and the calendar
# weeks follow report_time_zone (the email settings; "" = UTC), and the report shows its dates in it.
servicenow_war_period: days
servicenow_war_days: 7                  # period days: how far back
servicenow_war_week_start: monday       # the day a calendar week starts on (last-week, this-week): monday ... sunday
servicenow_war_since: ""                # period dates: the first day (2026-10-20, or 2026-10-20 08:00); given, it wins over the period
servicenow_war_until: ""                # period dates: the last day (through its end), or a date and time; "" = now
# What the report flags: a task open at the end of the week for more than this many days is amber (Older than N days).
servicenow_war_old_days: 30
# Which open tasks are listed (Open at the end of the week, the WAR's in-progress lines, ACT's evidence). worked (the
# default) = the ones new this week or updated in it - the week's work; the rest, the backlog nobody touched (a task
# open 90 days and not looked at), is counted in the tiles (Open at the end, Older than N days) and on the workbook's
# Open at the end sheet, not listed. all = every task open at the week's end, however old, as before 0.44.1.
servicenow_war_open_scope: worked
# Cancelled is not completed. A task closed in the week in one of these states (as ServiceNow shows them, any case) - or
# with a close code holding one of these words - is not counted as completed, not in the WAR lines and not among ACT's
# accomplishments: it is listed in its own section at the bottom, "Cancelled this week" (and on the workbook's Cancelled
# sheet). Your instance's words, if they differ; [] = every closed task counts as completed.
servicenow_war_cancelled_states: [Canceled, Cancelled, Closed Skipped, Closed Incomplete]
servicenow_war_max_rows: 300            # rows per table in the report (the workbook has every row)
servicenow_war_notes_chars: 200         # how much of each close note the Completed table shows (0 = the column stays empty; the workbook has it whole)
servicenow_war_max_records: 5000        # at most this many records read per table (the rest are said)
# The tasks' SLAs (task_sla): those breached, and those still running with servicenow_war_sla_warn_percent of their time or
# more used (close to breaching) - tiles, a section, the WAR lines, the workbook, ACT's evidence. The API account needs read
# on task_sla (the itil role has it); when it cannot read it the report says so and goes on. false: not read.
servicenow_war_sla: true
servicenow_war_sla_warn_percent: 75     # an SLA at this share of its time or more is close to breaching (business time where it has a schedule)
# Attach the Excel workbook to the email: every task with every column on one sheet, then Completed, Opened, Open at the
# end, By person, By type - for sorting, filtering and pivoting (whatever report_email_xlsx says). false = only with report_email_xlsx.
servicenow_war_xlsx: true
# ACT (GenAI) writes the narrative - accomplishments, in progress, what deserves attention - from the week's tables,
# ready to paste, at the bottom after the one-line-per-task version (both stay, to choose from): attach an "ACT model key" credential (site_act_provider, site_act_models). It runs on
# the AAP side: this node must reach the model. People's and groups' names are masked before anything reaches the model.
servicenow_war_act: false
# The voice of ACT's narrative: positive (the default) = confident and forward-looking, the team's achievements and their
# impact first, open work as progress under way, issues as next steps - still only what the evidence says; neutral =
# factual, like an operations log; or your own words, e.g. "upbeat and brief, for the commander's weekly update".
# site_act_extra_instructions is added after it, for anything else ACT should know.
servicenow_war_act_tone: positive
servicenow_war_act_max_items: 150       # at most this many tasks per set go to the model (the biggest weeks)
servicenow_war_act_model_timeout: 600   # seconds the model may take for its answer
servicenow_war_act_check_url: true      # first check that this AAP node reaches the model's URL (a clear message when not)
# The job fails when ServiceNow could not be read at all, or a group named is not there. false = a report only (a table
# the account cannot read is always only said).
servicenow_war_fail: true
