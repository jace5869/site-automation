---
# ACT reads evidence and answers, a few items per question: a long answer about many items is what a gateway or proxy
# cuts off, or what runs past the model's time. One question per batch, each with its own evidence, all asked in one
# call of act_ask.yml (plugins/action/site_act_ask.py): one check of the way to the model, site_act_concurrency questions at
# a time, a failed or unreadable answer asked once more. The answers are merged into one, so the outputs are
# evidence_analysis.yml's. Used by the VMware alarms ACT analysis, the capacity planning, the right-sizing, the log
# analysis and the WAR (site_act_batch and each job's own *_act_batch).
# Input:  _eb_batches ([{items, evidence, task}], built by the job: problems | batch(n)), _eb_check_url (bool: check
#         the way to the model), _eb_retry_unreadable (default true: an answer act_analysis_parse cannot read is asked
#         again; false for a job with its own reader, as the WAR), _eb_kind (1.136.0: the job's kind for the answer cache in
#         the report database - log_analysis, vm_alarm_act ...; undefined: no cache), _ea_names, _ea_model_timeout,
#         _ea_in_check - as for evidence_analysis.yml
# Output: _ea_ran (ACT answered at least one batch), _ea_parsed (act_batches_merge), _ea_reason ('' when every batch
#         was answered, else which were not and why), _ea_raw, _ea_model, _ea_url, _eb_results (per batch), _ea_off,
#         _ea_cache (the cache: on, hits, saved, pruned, created, why), _ea_cache_note ('' or, for the report, how many
#         answers came from the cache and from when)
- name: ACT | no answer yet
  ansible.builtin.set_fact:
    _eb_results: []
    _ea_cache: {}
    _ea_cache_note: ""

# a dry run (Check) asks nothing: one "would analyze N items" for them all; nor does ACT off (site_act_enabled false)
- name: ACT | a dry run (Check), or ACT off - ACT is not asked
  ansible.builtin.include_tasks: evidence_analysis.yml
  vars:
    _ea_items: "{{ _eb_batches | map(attribute='items') | flatten }}"
    _ea_evidence: ""
    _ea_task: ""
    _ea_check_url: false
  when: (ansible_check_mode and not _ea_in_check | default(false) | bool) or not site_act_enabled | bool

- name: ACT | {{ _eb_batches | map(attribute='items') | map('length') | sum }} item(s) in {{ _eb_batches | length }} question(s)
  ansible.builtin.include_tasks: act_ask.yml
  vars:
    _ask_questions: "{{ _eb_batches }}"
    _ask_check_url: "{{ _eb_check_url | default(true) | bool }}"
    _ask_retry_unreadable: "{{ _eb_retry_unreadable | default(true) | bool }}"
    _ask_cache_kind: "{{ _eb_kind | default('') }}"
  when: (not ansible_check_mode or _ea_in_check | default(false) | bool) and site_act_enabled | bool

- name: ACT | each question's answer
  when: (not ansible_check_mode or _ea_in_check | default(false) | bool) and site_act_enabled | bool
  ansible.builtin.set_fact:
    _eb_results: >-
      {%- set out = [] -%}
      {%- for q in _ea_ask.questions -%}
      {%-   set items = _eb_batches[loop.index0]['items'] -%}
      {%-   set _ = out.append({'ids': items | map(attribute='id') | list, 'ran': q.ran | bool,
                                'parsed': q.summary | act_analysis_parse(items), 'reason': q.reason,
                                'raw': q.summary | act_answer_text, 'model': q.model}) -%}
      {%- endfor -%}
      {{ out }}

- name: ACT | the answers, as one
  when: (not ansible_check_mode or _ea_in_check | default(false) | bool) and site_act_enabled | bool
  ansible.builtin.set_fact:
    _ea_ran: "{{ _eb_results | selectattr('ran') | list | length > 0 }}"
    _ea_parsed: "{{ _eb_results | act_batches_merge }}"
    _ea_reason: "{{ _eb_results | act_batches_reason }}"
    _ea_raw: "{{ _eb_results | map(attribute='raw') | select | join('\n\n') }}"
    _ea_model: "{{ (_eb_results | map(attribute='model') | select | list + [''])[0] }}"
    _ea_why_not: "{{ _ea_ask.why_not }}"
    _ea_off: false
    _ea_cache: "{{ _ea_ask.cache | default({}) }}"
    _ea_cache_note: >-
      {%- set kept = _ea_ask.questions | map(attribute='cached', default='') | select | list | sort -%}
      {%- if kept -%}
      {{ kept | length }} of {{ _ea_ask.questions | length }} answer(s) from an earlier run ({{ kept[0] if kept[0] == kept[-1]
         else kept[0] ~ ' to ' ~ kept[-1] }} UTC; site_act_cache).
      {%- endif -%}

- name: ACT | the answer cache (site_act_cache)
  ansible.builtin.debug:
    msg: >-
      {{ ('ACT answer cache: ' ~ _ea_cache.hits ~ ' answer(s) from it, ' ~ _ea_cache.saved ~ ' kept for the next runs, '
          ~ _ea_cache.pruned ~ ' expired deleted' ~ (' (the table made)' if _ea_cache.created else '') ~ '.'
          ~ (' ' ~ _ea_cache.why if _ea_cache.why else '')) if _ea_cache.on | default(false)
         else 'ACT answer cache: ' ~ _ea_cache.why }}
  when:
    - (not ansible_check_mode or _ea_in_check | default(false) | bool) and site_act_enabled | bool
    - _ea_cache.on | default(false) or _ea_cache.why | default('') | length > 0
