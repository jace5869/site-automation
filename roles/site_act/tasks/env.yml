---
# Resolve the provider settings into ACT's environment variables, once per host:
#   _site_act_env_all   what ACT gets (ACT_PROVIDER, <PROVIDER>_MODEL, <PROVIDER>_URL, GENAI_CA ...)
#                       model: site_act_model if set, else site_act_models[provider]; URL the same
#   _site_act_key_ok    whether the job has an API key for that provider (from a credential)
# Used by this role and by playbooks/act_fix_approved.yml.

- name: ACT | the provider is one ACT knows
  ansible.builtin.assert:
    that: site_act_provider in ['genai', 'asksage', 'genai-beta']
    fail_msg: "site_act_provider must be genai, asksage or genai-beta, not {{ site_act_provider }}"
    quiet: true

- name: ACT | settings for {{ site_act_provider }}
  ansible.builtin.set_fact:
    _site_act_env_all: >-
      {%- set names = {'genai': ['GENAI_MODEL', 'GENAI_URL'], 'asksage': ['ASKSAGE_MODEL', 'ASKSAGE_URL'],
                       'genai-beta': ['GENAI_BETA_MODEL', 'GENAI_BETA_URL']}[site_act_provider] -%}
      {%- set model = site_act_model or (site_act_models | default({}))[site_act_provider] | default('') -%}
      {%- set url = site_act_url or (site_act_urls | default({}))[site_act_provider] | default('') -%}
      {%- set e = {'ACT_PROVIDER': site_act_provider} -%}
      {%- if model -%}{%- set _ = e.update({names[0]: model}) -%}{%- endif -%}
      {%- if url -%}{%- set _ = e.update({names[1]: url}) -%}{%- endif -%}
      {%- if site_act_ca -%}{%- set _ = e.update({'GENAI_CA': site_act_ca}) -%}{%- endif -%}
      {#- stream the answer: data keeps flowing while the model writes, so a firewall or proxy idle timeout
          does not cut a long answer ("connection reset by peer"); ACT falls back by itself where a gateway
          cannot stream. site_act_env: {ACT_STREAM: "0"} turns it off. -#}
      {%- set _ = e.update({'ACT_STREAM': '1'}) -%}
      {%- if site_act_model_timeout | default(600) | int > 0 -%}{%- set _ = e.update({'GENAI_TIMEOUT': site_act_model_timeout | default(600) | int | string}) -%}{%- endif -%}
      {{ e | combine(site_act_env) }}
    _site_act_key_ok: >-
      {{ (lookup('ansible.builtin.env', 'GENAI_KEY') | length > 0) if site_act_provider == 'genai'
         else ((lookup('ansible.builtin.env', 'ASKSAGE_API_KEY') ~ lookup('ansible.builtin.env', 'ASKSAGE_KEY')) | length > 0)
              if site_act_provider == 'asksage'
         else (lookup('ansible.builtin.env', 'GENAI_BETA_KEY') | length > 0) }}
    _site_act_key_hint: >-
      {{ {'genai': 'the "ACT model key" credential with its GenAI API key field filled in',
          'asksage': 'the "ACT model key" credential with its AskSage API key field filled in',
          'genai-beta': 'the "ACT GenAI beta key" credential'}[site_act_provider] }}
