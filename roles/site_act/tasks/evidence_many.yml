---
# Many questions that stand alone (one item each), asked in ONE call of act_ask.yml (plugins/action/site_act_ask.py): one
# check of the way to the model, ACT copied once, site_act_concurrency questions at a time. Each answer is mapped back by
# its key. ACT runs NO command (evidence mode). Used by the STIG answer keys: the drafts and the cross-check, a question
# per rule.
# Input:  _em_questions ([{key, items, evidence, task, names}]: names, ACT masks them for that question), _em_check_url
#         (bool), _em_tiers (1.137.0, bool, default false: the job takes model tiers - answer_keys_act_tiers),
#         _em_tier_form (code: a draft, verdict: a cross-check answer - how a worker's answer is judged), _ea_names,
#         _ea_model_timeout, _ea_in_check - as for evidence_analysis.yml
# Output: _em_answers ({key: {ran, raw, reason, model, tier}}: raw is ACT's answer, act_answer_text), _ea_off (site_act_enabled
#         false: nothing asked, each reason says so), _ea_why_not (why ACT was not asked at all, else ''), _ea_url,
#         _em_tiers_note ('' or which model answered how many)
- name: ACT | is off (site_act_enabled false) - not asked
  ansible.builtin.set_fact:
    _ea_off: "{{ not site_act_enabled | bool }}"
    _site_act_off: "{{ not site_act_enabled | bool or _site_act_off | default(false) | bool }}"

- name: ACT | what ACT said - nothing, it is off (site_act_enabled false)
  ansible.builtin.set_fact:
    _em_answers: >-
      {%- set out = {} -%}
      {%- for q in _em_questions | default([]) -%}
      {%-   set _ = out.update({q.key: {'ran': false, 'raw': '', 'reason': 'ACT is off (site_act_enabled false).', 'model': ''}}) -%}
      {%- endfor -%}
      {{ out }}
    _ea_why_not: ACT is off (site_act_enabled false).
    _ea_url: ""
  when: _ea_off | bool

- name: ACT is off (site_act_enabled false)
  ansible.builtin.debug:
    msg: ACT is off (site_act_enabled false) - not asked.
  when: _ea_off | bool

- name: ACT | ask
  ansible.builtin.include_tasks: act_ask.yml
  vars:
    _ask_questions: >-
      {%- set out = [] -%}
      {%- for q in _em_questions | default([]) -%}
      {%-   set _ = out.append({'items': q['items'], 'evidence': q.evidence, 'task': q.task, 'names': q.names | default([])}) -%}
      {%- endfor -%}
      {{ out }}
    _ask_check_url: "{{ _em_check_url | default(true) | bool }}"
    _ask_tiers: "{{ _em_tiers | default(false) | bool }}"
    _ask_tier_form: "{{ _em_tier_form | default('code') }}"
    _ask_tier_synth: false             # each rule stands alone: no verdict over them
  when: not _ea_off | bool and _em_questions | default([]) | length > 0

- name: ACT | what ACT said, question by question
  ansible.builtin.set_fact:
    _em_answers: >-
      {%- set out = {} -%}
      {%- for q in _em_questions | default([]) -%}
      {%-   set a = _ea_ask.questions[loop.index0] -%}
      {#- 1.137.0: tier only with model tiers - without them, each answer as 1.136.0's (Codex r1) -#}
      {%-   set _ = out.update({q.key: {'ran': a.ran | bool, 'raw': a.summary | act_answer_text, 'reason': a.reason,
                                        'model': a.model} | combine({'tier': a.tier} if a.tier is defined else {})}) -%}
      {%- endfor -%}
      {{ out }}
    _ea_why_not: "{{ _ea_ask.why_not }}"
    _em_tiers_note: "{{ (_ea_ask.tiers | default({})).note | default((_ea_ask.tiers | default({})).why | default('')) }}"
  when: not _ea_off | bool and _em_questions | default([]) | length > 0

- name: ACT | which model answered (site_act_worker_model)
  ansible.builtin.debug:
    msg: "{{ _em_tiers_note }}"
  when: not _ea_off | bool and _em_questions | default([]) | length > 0 and _em_tiers_note | length > 0

- name: ACT | nothing to ask
  ansible.builtin.set_fact:
    _em_answers: {}
    _ea_why_not: ""
    _em_tiers_note: ""
  when: not _ea_off | bool and _em_questions | default([]) | length == 0
