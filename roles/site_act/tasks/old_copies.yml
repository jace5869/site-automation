---
# Old copies of ACT on this host (1.53.0), ACT on or off: each path of site_act_old_bins that is not missing and not a
# link into /opt/act is linked to the installed ACT (site_act_old_bin: link, the old one kept in /opt/act/old first),
# deleted (kept first) or only reported. root's and each /home user's saved genai.model is reported when it is not the
# job's (site_act_fix_user_model: true rewrites that one key). Check mode changes nothing and says what it would do.
# The installed ACT itself (/opt/act/act): when it is there and differs from vendor/act/act, the old one is kept in
# /opt/act/old and the jobs' one put in its place (1.70.1). Once per host per run; never on Windows, network devices or the AAP side (a local connection); never fails the job.

- name: ACT | old copies - the setting
  ansible.builtin.assert:
    that: site_act_old_bin in ['link', 'delete', 'report']
    fail_msg: "site_act_old_bin is link, delete or report, not {{ site_act_old_bin }}"
    quiet: true
  run_once: true

- name: ACT | old copies on this host (site_act_old_bins)
  when:
    - not (_site_act_old_done | default(false) | bool)
    # local: the AAP side (the execution environment, or the controller in a test) - it has no ACT of this kind
    - (ansible_connection | default('ssh')) not in ['local', 'winrm', 'psrp', 'network_cli', 'httpapi', 'netconf']
    - (ansible_shell_type | default('sh')) not in ['powershell', 'cmd']
  vars:
    _old_dir: "{{ act_triage_dest_dir | default('/opt/act') }}"
    _old_model: "{{ site_act_model or (site_act_models | default({})).genai | default('') }}"
    # the ACT the jobs carry: its checksum (vendor/CHECKSUMS, checked by tests/check_vendor.sh) and its version
    _old_src_sha: "{{ lookup('ansible.builtin.file', role_path ~ '/../../vendor/CHECKSUMS') | regex_search('(?m)^([0-9a-f]{64}) +vendor/act/act$', '\\1') | first | default('') }}"
    _old_src_version: "{{ lookup('ansible.builtin.file', role_path ~ '/../../vendor/act/VERSION') | trim }}"
  block:
    - name: ACT | old copies - what is there
      site_act_old_copies:
        paths: "{{ site_act_old_bins }}"
        action: "{{ site_act_old_bin }}"
        target: "{{ _old_dir }}/act"
        backup_dir: "{{ _old_dir }}/old"
        job_model: "{{ _old_model }}"
        fix_user_model: "{{ site_act_fix_user_model | bool }}"
        source_sha256: "{{ _old_src_sha }}"
        source_version: "{{ _old_src_version }}"
        apply: false
      become: true
      check_mode: false                   # only looks
      register: _site_act_old_seen
      failed_when: false

    - name: ACT | old copies - is the installed ACT to come first
      ansible.builtin.set_fact:
        _site_act_old_install: >-
          {{ site_act_old_bin == 'link' and not (_site_act_old_seen.target_there | default(true) | bool)
             and _site_act_old_seen.copies | default([]) | selectattr('kind', 'in', ['file', 'link'])
                 | selectattr('why', 'match', '^the installed ACT') | list | length > 0 }}

    # a copy to link, and ACT not installed here yet: the jobs' ACT first (as act_triage installs it), so the link works
    - name: ACT | old copies - the install folder (as act_triage makes it)
      ansible.builtin.file:
        path: "{{ _old_dir }}"
        state: directory
        mode: "0755"
      become: true
      when: _site_act_old_install | bool

    - name: ACT | old copies - the installed ACT, to link to
      ansible.builtin.copy:
        src: "{{ role_path }}/../../vendor/act/act"
        dest: "{{ _old_dir }}/act"
        mode: "0755"
      become: true
      when: _site_act_old_install | bool

    # the installed ACT is older (or another) than the jobs': put the new one beside it first; the module keeps the old one
    - name: ACT | old copies - the jobs' ACT, to replace the installed one
      ansible.builtin.copy:
        src: "{{ role_path }}/../../vendor/act/act"
        dest: "{{ _old_dir }}/.act.new"
        mode: "0755"
      become: true
      when: _site_act_old_seen.updating | default(false) | bool and not ansible_check_mode

    - name: ACT | old copies - {{ site_act_old_bin }}
      site_act_old_copies:
        paths: "{{ site_act_old_bins }}"
        action: "{{ site_act_old_bin }}"
        target: "{{ _old_dir }}/act"
        backup_dir: "{{ _old_dir }}/old"
        job_model: "{{ _old_model }}"
        fix_user_model: "{{ site_act_fix_user_model | bool }}"
        source_sha256: "{{ _old_src_sha }}"
        source_version: "{{ _old_src_version }}"
        installing: "{{ _site_act_old_install | bool }}"
        staged: "{{ (_old_dir ~ '/.act.new') if _site_act_old_seen.updating | default(false) | bool and not ansible_check_mode else omit }}"
      become: true
      register: _site_act_old
      failed_when: false
      when: _site_act_old_seen.updating | default(false) | bool
            or _site_act_old_seen.copies | default([]) | rejectattr('action', 'equalto', 'none') | list | length > 0
            or _site_act_old_seen.users | default([]) | rejectattr('state', 'equalto', 'ok') | list | length > 0

    # failed_when: false above keeps a failure from stopping the job's other work; a module failure is still seen here
    # (a result with a msg and no lines): the report line says "failed: <msg>", and act_old_copies.yml ends failed after its report
    - name: ACT | old copies - for the report (once per host)
      ansible.builtin.set_fact:
        _site_act_old_done: true
        site_act_old_copies:
          lines: >-
            {{ ['failed: ' ~ _old_err] if (_old_err | default('', true) | string | length) > 0
               else (_site_act_old.lines | default(_site_act_old_seen.lines | default([]))) }}
          failed: "{{ (_old_err | default('', true) | string | length) > 0 }}"
          changed: "{{ _site_act_old.changed | default(false) }}"
          check: "{{ ansible_check_mode }}"
      vars:
        _old_err: >-
          {{ (_site_act_old.msg | string)
             if (not (_site_act_old.skipped | default(false)) and _site_act_old.lines is not defined and _site_act_old.msg is defined)
             else (_site_act_old_seen.msg | string)
             if (_site_act_old_seen.lines is not defined and _site_act_old_seen.msg is defined)
             else '' }}

    - name: ACT | old copies - what was found and done
      ansible.builtin.debug:
        msg: "{{ site_act_old_copies.lines }}"
      when: site_act_old_copies.lines | length > 0
