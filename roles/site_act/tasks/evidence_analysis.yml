---
# ACT reads evidence the job collected and answers - it runs NO command (act_triage evidence mode).
# ACT runs here, on the AAP side (the execution environment): only this AAP node must reach the
# model's URL. Used by the VMware alarms ACT analysis and the vSphere capacity planning.
# Input:  _ea_evidence (text), _ea_task (the prompt, asking for the BEGIN_ACT_ANALYSIS JSON),
#         _ea_items (list with id), _ea_names (names ACT masks), _ea_model_timeout (seconds),
#         _ea_check_url (bool), _ea_in_check (bool: ask ACT in a dry run (Check) too - it only reads)
# Output: _ea_ran (bool), _ea_parsed (act_analysis_parse), _ea_reason (why not / what failed),
#         _ea_raw (ACT's answer), _ea_model, _ea_url, _ea_off (site_act_enabled false: nothing asked, _ea_reason says so)
- name: ACT | is off (site_act_enabled false) - not asked
  ansible.builtin.set_fact:
    _ea_off: "{{ not site_act_enabled | bool }}"
    _site_act_off: "{{ not site_act_enabled | bool or _site_act_off | default(false) | bool }}"

- name: ACT | what ACT said - nothing, it is off (site_act_enabled false)
  ansible.builtin.set_fact:
    _ea_ran: false
    _ea_parsed: "{{ '' | act_analysis_parse(_ea_items | default([])) }}"
    _ea_raw: ""
    _ea_model: ""
    _ea_url: ""
    _ea_why_not: ACT is off (site_act_enabled false).
    _ea_reason: ACT is off (site_act_enabled false).
  when: _ea_off | bool

- name: ACT is off (site_act_enabled false)
  ansible.builtin.debug:
    msg: ACT is off (site_act_enabled false) - not asked.
  when: _ea_off | bool

- name: ACT | ask
  ansible.builtin.include_tasks: evidence_ask.yml
  when: not _ea_off | bool
