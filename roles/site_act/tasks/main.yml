---
# Hand this host's findings to ACT. Input: site_findings (from the check roles).
# Output: site_act_result (ACT's status, report and proposed fixes), and - through the
# act_triage role - the `act_triage` workflow artifact the approval/apply step uses.
# site_act_enabled false: nothing is asked (no request, no endpoint, no key needed) - site_act_result says so, the
# report says it in one line (roles/site_email), the job goes on.

- name: ACT | is off (site_act_enabled false) - not asked
  ansible.builtin.set_fact:
    _site_act_off: true
    site_act_result: {level: "{{ site_act_level }}", status: "off", summary: "ACT is off (site_act_enabled false).", applied: [], proposed: []}
  when: not site_act_enabled | bool

- name: ACT is off (site_act_enabled false)
  ansible.builtin.debug:
    msg: ACT is off (site_act_enabled false) - not asked.
  when: not site_act_enabled | bool

- name: ACT | run
  ansible.builtin.include_tasks: run.yml
  when: site_act_enabled | bool
