---
# ACT (GenAI) on top of ANY check playbook. The check roles already did the cheap, certain part:
# they found WHAT is wrong (site_findings) and know which read-only command shows more (each
# finding's `hint`). This role hands that to ACT (the act_triage role) to find out WHY, and to
# propose - or, if you allow it, make - the fix. Turn it on with use_act=true.
#
# Pick one level per job template:
#   explain    The role runs the findings' look commands itself and gives ACT their output.
#              ACT runs NOTHING. You get a root cause and a suggested fix in words.
#              Safest start; no approval step needed.                    (ACT evidence mode)
#   diagnose   ACT investigates by running read-only commands itself and proposes exact fix
#              commands. Every change is refused and waits for a person: the job fails with
#              NEEDS APPROVAL, the workflow's approval step asks, and act_fix_approved.yml
#              applies exactly what was approved.                        (ACT loop mode, no --allow)
#   self-heal  Like diagnose, but ACT may run the fixes that match site_act_allow by itself
#              (e.g. restart chronyd). Anything else still waits for approval.
site_act_level: explain
# The runbooks (Health check, Database health, Troubleshoot): true = ACT looks at what the job found.
# A job variable, per template or launch - not all.yml (every check job would then call the model).
use_act: false

# ACT at all (1.3.0): false = no job calls ACT - no request, no model endpoint or key needed, no error; each report
# says "ACT is off (site_act_enabled false)" in one line and the job stays green (an enclave without a model). Usually
# in all.yml (docs/ENCLAVES.md).
site_act_enabled: true

# self-heal only: regular expressions of fix commands ACT may run without a person. Each must
# match the WHOLE command. Keep them narrow, e.g.
#   site_act_allow: ['systemctl restart (chronyd|rsyslog|crond)']
site_act_allow: []

# Hosts where ACT may only diagnose - never fix by itself, whatever site_act_level says: AAP
# itself (a fix could stop the job that is running it) and vendor-managed appliances. The apply
# step (act_fix_approved.yml) skips them too: a person applies the fix there by hand.
# AAP (groups aap, aap_hosts) is ALWAYS in this list (roles/site_act/vars/main.yml); the list adds to it.
site_act_diagnose_only_groups: [aap, aap_hosts, sat, idm, netapp, netapp_console_hosts]

# ---- Which model ACT talks to -----------------------------------------------------------------
#   site_act_provider  genai       GenAI.mil (the default)
#                      asksage     Ask Sage - RETIRED FOR NOW: do not pick it (kept for when it returns)
#                      genai-beta  the GenAI.mil beta proxy (preview models)
#   site_act_models    the model to use FOR EACH provider, e.g.
#                        {genai: gemini-4-argon-withtools, asksage: gpt-5.6-sol-gov}
#                      so the model follows whichever provider is picked. A provider not listed
#                      uses ACT's own default model.
#   site_act_urls      the API URL for each provider, e.g. {asksage: https://<host>/server/openai/v1/chat/completions};
#                      a provider not listed uses ACT's default URL
#   site_act_model     one model for this run, whatever the provider (e.g. a survey answer);
#                      empty = site_act_models
#   site_act_url       one URL for this run; empty = site_act_urls
#   site_act_ca        a CA bundle file ON THE HOSTS for the provider's TLS certificate (internal/DoD
#                      CA); empty = the host's system trust store
# The API KEY never goes here: it comes from an AAP credential - "ACT model key" (GenAI and Ask
# Sage keys) or "ACT GenAI beta key". ACT runs ON EACH HOST, so the hosts must be able to reach
# the provider's URL (a proxy or firewall rule may be needed).
site_act_provider: genai
site_act_models: {genai: gemini-4-argon-withtools, asksage: gpt-5.6-sol-gov}  # the model for each provider (see above): the model follows the provider picked
site_act_urls: {}                        # the API URL for each provider; a provider not listed uses ACT's default
site_act_model: ""                       # one model for this run, whatever the provider (e.g. a survey answer); empty = site_act_models
site_act_url: ""                         # one URL for this run; empty = site_act_urls
site_act_ca: ""                          # a CA bundle file ON THE HOSTS for the provider's certificate; empty = the host's trust store
# 1.137.0: model tiers (docs/ADDING_ACT.md, "Model tiers"). A cheaper, faster WORKER model does the per-item first pass of
# the jobs that ask ACT about many items on the AAP side (the log analysis, the VMware alarms, capacity and right-sizing
# analyses, the STIG answer keys); the model above (the SMART one) gets what the worker could not settle - an answer it
# could not read, an unsure one (confidence under 50, an "unsure" verdict, a draft without code), an item the job or the
# worker calls critical - once, and writes the report's overall verdict from the worker's short answers (never the raw
# evidence). Each job can turn it off: log_analysis_act_tiers, vm_alarm_act_tiers, vm_capacity_act_tiers,
# vm_rightsize_act_tiers, answer_keys_act_tiers. Empty = no tiers: every question on the model above, as before 1.137.0.
#   site_act_worker_model   one worker model for this run, whatever the provider; empty = site_act_worker_models
#   site_act_worker_models  the worker model for each provider, e.g. {genai: <the cheap model's id>}
site_act_worker_model: ""
site_act_worker_models: {}

# Any other ACT environment settings (advanced; these win over the ones above), e.g.
# {HTTPS_PROXY: "http://proxy.yoursite.mil:8080"}. See the top of vendor/act/act for the list.
# Every ACT job streams the model's answer (ACT_STREAM=1), so a firewall or proxy idle timeout does
# not cut a long answer ("connection reset by peer"); {ACT_STREAM: "0"} here turns that off.
site_act_env: {}
# Seconds the model may take for ONE answer, retries after a provider hiccup included (ACT's
# GENAI_TIMEOUT; ACT's own default, 90, is too short for a long analysis or a busy provider). Every
# ACT job uses it: the runbooks' use_act, the VMware alarms and capacity analyses, service watch.
site_act_model_timeout: 600
site_act_timeout: 1200                    # seconds for one whole ACT run (several answers): keep it above site_act_model_timeout
# How many hosts may run ACT at the same time in one job (0 = no limit: as many as the job's forks). The jobs that ask
# ACT about evidence on the AAP side (log analysis, the VMware alarms, the WAR ...) ask this many questions at a time
# (0 = up to 4 at a time). Every host in a job uses the same key, and GenAI.mil's default quota is 60 requests and 200,000
# tokens a minute per key: a fleet run with many hosts at once gets HTTP 429 (too many requests).
site_act_concurrency: 3
# A question ACT failed, in a job that asks on the AAP side, is asked again this many times. In the jobs that
# ask in batches, an answer the job cannot read is asked again too. 0 = never again. A question that ran out of
# site_act_timeout is not asked again.
site_act_retries: 1
# 1.136.0: hosts of one job with the same findings, at level explain: ACT reads the first of them, the others take its
# answer (their reports say so). The findings are compared without numbers, times, addresses and the host's own names.
# Diagnose and self-heal are always per host. false = ACT reads every host.
site_act_group: true
# 1.136.0: ACT's answer cache in the report database (docs/REPORT_DATABASE.md, "ACT's answer cache"). The jobs that ask
# ACT in batches on the AAP side (the log analysis, the VMware alarms, capacity and right-sizing analyses) keep each
# answer. A question asked again with the same evidence, prompt, provider and model takes the kept answer, and ACT is
# not asked. Only with the "Report database" credential on the template. false = never used.
site_act_cache: true
site_act_cache_ttl_days: 7                # how long an answer is kept, in days. 0 = no cache
site_act_cache_ttl_days_by: {}            # per job kind, over site_act_cache_ttl_days: {log_analysis: 3, vm_capacity: 0}
site_act_cache_clear: false               # true = ask everything again this run, and keep the new answers
site_act_cache_create: true               # make the table act_answer_cache on the first run
site_act_cache_timeout: 10                # seconds to connect to the report database
# The jobs where ACT reads evidence (the VMware alarms analysis and capacity planning, the log analysis) ask it
# about this many items per question: a long answer about many items is what a gateway or proxy cuts off, or what
# runs past site_act_model_timeout. 15 items are 3 questions of 5, in one report. 0 = all in one question.
# Each job's own setting wins: vm_alarm_act_batch, vm_capacity_act_batch, log_analysis_act_batch.
site_act_batch: 5
site_act_extra_instructions: ""           # anything ACT should know about this site
site_act_evidence_text: ""                # extra evidence (troubleshoot.yml passes what it collected)

# Old copies of ACT on the hosts (1.53.0): an `act` someone put there by hand runs instead of the one the jobs install
# (/opt/act/act) when a person types act, with its own saved model. Every job that can run ACT on a host looks, ACT on
# or off, once per host (roles/site_act/tasks/old_copies.yml; the job "ACT - find and replace old copies" on its own).
site_act_old_bins: [/usr/local/bin/act]  # where an old act may be; missing, or a link into /opt/act, is left alone
# link = keep the old one in /opt/act/old (0700), then link it to /opt/act/act; delete = keep it, then remove it;
# report = only say it
site_act_old_bin: link
site_act_fix_user_model: false           # true = a user's saved genai.model (~/.config/act/config.json) set to the job's model
site_act_stage_dir: ""                   # where the old-copies check puts the jobs' ACT for a moment (a private folder, removed after); "" = the host's temp folder
