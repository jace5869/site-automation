---
# The check job (playbooks/service_watch.yml):
#   all containers up -> done, the model is never called
#   one is down       -> record it -> ACT finds the root cause (self-heal mode: may start it,
#                        through its systemd unit when one runs it)
#                     -> re-check independently (self-heal: still down -> the standard fix)
#                     -> still down? FAIL on purpose with the fix to approve, so the AAP workflow
#                        takes its "Run on fail" path to the approval step and then
#                        service_fix_approved.yml, which runs exactly that fix.

- name: Watch | mode
  ansible.builtin.assert:
    that: watch_mode in ['self-heal', 'approval']
    fail_msg: "watch_mode must be self-heal or approval, not {{ watch_mode }}"
    quiet: true

# The mode actually used on THIS host. A separate variable on purpose: watch_mode is usually a
# survey answer (an extra variable), and nothing - not even set_fact - can change an extra
# variable. AAP and the diagnose-only groups never self-heal ('aap', 'aap_hosts' written out: an
# extra variable can override _watch_no_heal, not a literal).
- name: Watch | the mode for this host (never self-heal on AAP or the diagnose-only groups)
  ansible.builtin.set_fact:
    _watch_mode: >-
      {{ 'approval' if (watch_mode == 'self-heal' and group_names | intersect(_watch_no_heal + ['aap', 'aap_hosts']) | length > 0)
         else watch_mode }}

- name: Watch | self-heal is off on this host
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }} is in {{ group_names | intersect(_watch_no_heal + ['aap', 'aap_hosts']) | join(', ') }}
      (diagnose only): self-heal is off here; a fix waits for approval and is applied by hand.
  when: watch_mode != _watch_mode

- name: Watch | check the containers
  ansible.builtin.include_tasks: check.yml

- name: Watch | remember the state before any fix
  ansible.builtin.set_fact:
    service_watch_before: "{{ service_watch }}"

- name: Watch | record the outage
  ansible.builtin.include_tasks: record.yml
  vars:
    _watch_event: down_detected
  when: not service_watch_before.healthy

- name: Watch | ACT provider, model and key (site_act_provider, the same setting as every runbook)
  ansible.builtin.include_role:
    name: site_act
    tasks_from: env.yml
  when: not service_watch_before.healthy

- name: Watch | ACT
  when: not service_watch_before.healthy
  block:
    # ACT cannot read a user's (rootless) containers itself: the playbook does, for it
    - name: Watch | evidence for the down containers of users (ACT reads it with cat)
      ansible.builtin.include_tasks: evidence.yml
      when: service_watch_before.down_users | default([]) | length > 0

    - name: Watch | ACT finds the root cause{{ ' and may start the container' if _watch_mode == 'self-heal' else '; every fix waits for approval' }}
      ansible.builtin.include_role:
        name: act_triage
        apply:
          throttle: "{{ site_act_concurrency | default(3) | int }}"   # hosts running ACT at once (site_act)
      vars:
        act_triage_builtin_checks: false                   # only these containers, not host-wide noise
        act_triage_findings_extra: "{{ service_watch_before.findings }}"
        act_triage_allow: "{{ _watch_fix_patterns if _watch_mode == 'self-heal' else [] }}"
        act_triage_extra_instructions: "{{ watch_instructions }}"
        act_triage_env: "{{ _site_act_env_all | combine(watch_act_env) }}"
        act_triage_timeout: "{{ watch_act_timeout }}"
        act_triage_fail_in_role: false                     # this role decides pass/fail below
        act_triage_write_report: false                     # the incident log is the record
  always:
    - name: Watch | remove the evidence file
      ansible.builtin.file:
        path: "{{ _watch_evidence_file }}"
        state: absent
      when: _watch_evidence_file | default('') | length > 0

- name: Watch | re-check the containers ourselves (the model's word is not enough)
  ansible.builtin.include_tasks: check.yml
  vars:
    _watch_retries: "{{ watch_verify_retries if (act_triage_result.changed | default(false)) else 0 }}"
  when: not service_watch_before.healthy

- name: Watch | self-heal - still down after ACT, so the standard fix
  ansible.builtin.include_tasks: run_fixes.yml
  vars:
    _watch_run_cmds: "{{ service_watch.fixes }}"
  when:
    - _watch_mode == 'self-heal'
    - group_names | intersect(['aap', 'aap_hosts']) | length == 0
    - not service_watch_before.healthy
    - not service_watch.healthy
    - service_watch.fixes | length > 0

- name: Watch | re-check after the standard fix
  ansible.builtin.include_tasks: check.yml
  vars:
    _watch_retries: "{{ watch_verify_retries }}"
  when: _watch_ran is defined and _watch_ran.stdout_lines is defined

# ACT's proposals, made right for each container's OWNER: a `podman start/restart/run` of a
# container that a systemd unit runs becomes `systemctl start/restart UNIT` (for a user's container:
# runuser -u USER -- env XDG_RUNTIME_DIR=/run/user/UID systemctl --user ...), and the standard fix is
# added for every down container no proposal covers (ACT proposed nothing, or could not run: the
# approver is told it is not from ACT). In dependency order. (plugins/filter: watch_fix_commands)
- name: Watch | the fix for a person to approve
  ansible.builtin.set_fact:
    _watch_proposed: "{{ _watch_plan.commands }}"
    _watch_fix_source: >-
      {%- set added = _watch_plan.added | map('extract', service_watch.managers) | map(attribute='label') | list -%}
      {{ ('ACT' ~ ((' + the standard fix for ' ~ (added | join(', ')) ~ ', which ACT did not cover') if added else '')
          ~ (('; left out: ' ~ (_watch_plan.dropped | join(', '))) if _watch_plan.dropped else ''))
         if _watch_proposed_act | length > 0
         else 'the standard fix (ACT proposed nothing)' if added else '' }}
  vars:
    # self-heal already ran a standard fix and it did not work: do not offer it again (a fix
    # self-heal may not run itself, e.g. loginctl enable-linger, is still offered)
    _watch_standard_by: >-
      {%- set out = {} -%}
      {%- for k, cmds in service_watch.fix_by.items() if cmds | difference(_watch_fixes_run | default([])) | length > 0 -%}
      {%-   set _ = out.update({k: cmds}) -%}
      {%- endfor -%}
      {{ out }}
    _watch_proposed_act: >-
      {{ (act_triage_result | default({})).denied | default([]) | selectattr('pre_approvable', 'defined')
         | selectattr('pre_approvable') | map(attribute='command') | list }}
    _watch_plan: >-
      {{ _watch_proposed_act | watch_fix_commands(service_watch.watched, _watch_standard_by, site_containers | default([])) }}
  when: not service_watch_before.healthy

- name: Watch | outcome
  ansible.builtin.set_fact:
    service_watch_outcome: >-
      {{ 'healthy' if service_watch_before.healthy
         else ('self_healed' if ((act_triage_result.changed | default(false)) or (_watch_fixes_run | default([]) | length > 0))
               else 'recovered') if service_watch.healthy
         else 'awaiting_approval' if _watch_proposed | length > 0
         else 'still_down' }}

- name: Watch | hand the fix to the approval step and the apply job (set_stats)
  ansible.builtin.set_stats:
    data:
      service_watch_fix: >-
        {{ {inventory_hostname: {'commands': _watch_proposed, 'source': _watch_fix_source,
                                 'findings': service_watch.findings}} }}
    per_host: false
    aggregate: true
  when: service_watch_outcome == 'awaiting_approval'

- name: Watch | record the outcome
  ansible.builtin.include_tasks: record.yml
  vars:
    _watch_event: "{{ service_watch_outcome }}"
  when: service_watch_outcome != 'healthy'

- name: Watch | ACT's report (root cause, evidence, fix)
  ansible.builtin.debug:
    msg: "{{ (act_triage_result.summary or act_triage_result.stop_reason or 'ACT gave no report').splitlines() }}"
  when: act_triage_result is defined

- name: Watch | summary
  ansible.builtin.debug:
    msg: "{{ _watch_says[service_watch_outcome] }}"
  vars:
    _watch_says:
      healthy: "{{ ('All watched containers are up (' ~ _watch_what ~ '). Nothing to do.') if service_watch.watched else ('Nothing to watch: ' ~ _watch_what ~ '.') }}"
      self_healed: "Was DOWN ({{ service_watch_before.findings | join('; ') }}). Fixed ({{ ((_watch_fixes_run | default([])) and ('standard fix: ' ~ (_watch_fixes_run | join(' ; ')))) or 'by ACT' }}) and the re-check confirms everything is up."
      recovered: "Was DOWN ({{ service_watch_before.findings | join('; ') }}) and came back without a fix."
      awaiting_approval: "DOWN: {{ service_watch.findings | join('; ') }}. Fix to approve ({{ _watch_fix_source | default('') }}): {{ _watch_proposed | default([]) | join(' ; ') }}. Waiting for approval."
      still_down: "Still DOWN: {{ service_watch.findings | join('; ') }}. There is no fix to approve; a person must look at it."

- name: Watch | NEEDS APPROVAL (this failure sends the workflow to the approval step)
  ansible.builtin.fail:
    msg: >-
      NEEDS APPROVAL on {{ inventory_hostname }}: {{ service_watch.findings | join('; ') }}.
      Fix to approve ({{ _watch_fix_source }}): {{ _watch_proposed | join(' ; ') }}
  when: service_watch_outcome == 'awaiting_approval'

- name: Watch | STILL DOWN
  ansible.builtin.fail:
    msg: >-
      STILL DOWN on {{ inventory_hostname }}: {{ service_watch.findings | join('; ') }}, after
      {{ (_watch_all_run | join(' ; ')) or 'no automatic fix' }}. Nothing is waiting for approval:
      a person must look at it (ACT's report is above).
      {{ ('Not coming back by a start: ' ~ (service_watch.no_fix | join(', ')) ~ ' (removed, and no systemd unit runs it).')
         if service_watch.no_fix else '' }}
  when: service_watch_outcome == 'still_down'
  vars:
    _watch_all_run: >-
      {{ ((act_triage_result | default({})).commands | default([]) | selectattr('approval', 'equalto', 'pre_approved')
          | map(attribute='command') | list) + (_watch_fixes_run | default([])) }}
