---
# The approved-fix job (playbooks/service_fix_approved.yml). It runs in the workflow after a
# person approved. AAP passes it the check job's results: `service_watch_fix` (the fix that was
# shown for approval, per host; set_stats in watch.yml) - or, from an older check job, ACT's
# `act_triage` proposals. For each host it runs EXACTLY those commands, in order, stopping at the
# first that fails - no model, no key, no guessing - and then re-checks the containers itself.
# Run as Check (dry run), it shows what it would run and changes nothing.

- name: Apply | the check job's results reached this job
  ansible.builtin.assert:
    that: >-
      (service_watch_fix is defined and service_watch_fix is mapping)
      or (act_triage is defined and act_triage is mapping)
    fail_msg: >-
      Nothing to apply: no results from the check job reached this job. Either it was launched on
      its own (run it only inside the workflow, after the approval step), or the check job failed
      before it got that far (unreachable host): read the check job's output.
    quiet: true
  run_once: true

- name: Apply | what was approved for this host
  ansible.builtin.set_fact:
    # The fix shown in NEEDS APPROVAL (service_watch_fix). ACT's raw proposals (act_triage) are
    # used only when the check job was an older version that did not hand over service_watch_fix.
    _watch_approved: >-
      {{ ((service_watch_fix.get(inventory_hostname) or {}).get('commands', []))
         if service_watch_fix is defined
         else ((act_triage.get(inventory_hostname) or {}).get('proposed_commands', [])) }}
    _watch_in_incident: >-
      {{ inventory_hostname in (service_watch_fix if service_watch_fix is defined else act_triage) }}

- name: Apply | skip hosts that had no incident
  ansible.builtin.meta: end_host
  when: not _watch_in_incident

- name: Apply | is it still down?
  ansible.builtin.include_tasks: check.yml

- name: Apply | remember the state before the fix
  ansible.builtin.set_fact:
    service_watch_before: "{{ service_watch }}"
    service_watch_outcome: >-
      {{ 'recovered_before_fix' if service_watch.healthy
         else 'manual_action_needed' if _watch_approved | length == 0
         else 'fix_approved' }}

# DRY RUN: the job runs as Check (Job type "Check", e.g. on the workflow's node) - show what
# would run and change nothing. A rehearsal of the whole approve-and-fix path: a command the
# apply-time guard would refuse is refused here too (the real run checks it in run_fixes.yml).
- name: Apply | DRY RUN - the apply-time guard
  ansible.builtin.include_role:
    name: site_findings
    tasks_from: apply_guard.yml
  vars:
    _guard_cmds: "{{ _watch_approved }}"
  when: ansible_check_mode and service_watch_outcome == 'fix_approved'

- name: Apply | DRY RUN (Check mode) - what would run, nothing is changed
  ansible.builtin.debug:
    msg: >-
      DRY RUN on {{ inventory_hostname }}:
      {{ ('approved, and would run: ' ~ (_watch_approved | join(' ; '))) if service_watch_outcome == 'fix_approved'
         else 'already up again, would run nothing' if service_watch_outcome == 'recovered_before_fix'
         else 'nothing was approved that could run' }}. Nothing was changed (Check mode).
  when: ansible_check_mode

- name: Apply | stop here in a dry run
  ansible.builtin.meta: end_host
  when: ansible_check_mode

- name: Apply | record
  ansible.builtin.include_tasks: record.yml
  vars:
    _watch_event: "{{ service_watch_outcome }}"

- name: Apply | run exactly the approved fix
  ansible.builtin.include_tasks: run_fixes.yml
  vars:
    _watch_run_cmds: "{{ _watch_approved }}"
  when: service_watch_outcome == 'fix_approved'

- name: Apply | re-check the containers ourselves
  ansible.builtin.include_tasks: check.yml
  vars:
    _watch_retries: "{{ watch_verify_retries }}"
  when: service_watch_outcome == 'fix_approved'

- name: Apply | outcome
  ansible.builtin.set_fact:
    service_watch_outcome: "{{ 'fixed_after_approval' if service_watch.healthy else 'still_down' }}"
  when: service_watch_outcome == 'fix_approved'

- name: Apply | record the outcome
  ansible.builtin.include_tasks: record.yml
  vars:
    _watch_event: "{{ service_watch_outcome }}"
  when: service_watch_outcome in ['fixed_after_approval', 'still_down']

- name: Apply | summary
  ansible.builtin.debug:
    msg: "{{ _watch_says[service_watch_outcome] }}"
  vars:
    _watch_says:
      recovered_before_fix: "Already up again ({{ _watch_what }}); the approved fix was not needed."
      manual_action_needed: "Down, and nothing was proposed that can be run automatically. A person must fix it."
      fixed_after_approval: "Up: ran {{ _watch_fixes_run | default([]) | join(' ; ') }} and the re-check confirms it ({{ _watch_what }})."
      still_down: >-
        Still DOWN after the approved fix: {{ service_watch.findings | join('; ') }}.
        {{ ('A command failed (exit ' ~ _watch_ran.rc ~ '): see its output above.') if (_watch_ran.rc | default(0) | int) != 0 else '' }}

- name: Apply | still down
  ansible.builtin.fail:
    msg: >-
      Still down on {{ inventory_hostname }}: {{ service_watch.findings | join('; ') }}.
      See the output of the approved fix above and {{ watch_record_file }}.
  when: service_watch_outcome in ['still_down', 'manual_action_needed']
