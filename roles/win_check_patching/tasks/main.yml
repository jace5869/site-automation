---
# Runs files/win_patching.ps1 on the server (ansible.builtin.script: no collection needed) with the
# settings from defaults/main.yml, then adds its findings to this host's list.
- name: Windows patching | check
  ansible.builtin.script: win_patching.ps1
  environment:
    SITE_CHECK_CONFIG: >-
      {{ {'warn_days': win_check_patching_warn_days, 'crit_days': win_check_patching_crit_days,
          'reboot_pending': win_check_patching_reboot_pending, 'search_pending': win_check_patching_search_pending} | to_json }}
  register: _win_check_out
  changed_when: false
  failed_when: false
  check_mode: false

- name: Windows patching | findings
  ansible.builtin.include_role:
    name: site_findings
    tasks_from: win_result.yml
  vars:
    _win_check: patching
