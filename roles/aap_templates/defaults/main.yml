---
# ---- AAP - set up job templates (playbooks/aap_templates_setup.yml; docs/SETUP_AAP.md "Create the job templates from the catalog")
# Makes the job templates of aap/job_templates.yml (one per template of docs/JOB_TEMPLATES.md) in AAP, or checks the ones
# there. A missing one is made; one that differs is listed field by field and brought right only with
# aap_templates_overwrite. Never deletes, and never touches a template's schedules, survey or Variables after it is made,
# nor a credential of a type the catalog does not name. Run it with Check first: it then only reads and says what it would
# make or change. The "Red Hat Ansible Automation Platform" credential's user needs Admin on the organization.
# 1.79.19: it can also rename your templates and workflows to the catalog's names, and match their fields (below).
# 1.107.0: it makes every workflow of the catalog too (docs/WORKFLOWS_AND_SCHEDULES.md, "The job makes them"): each node
# and link, its survey when AAP has none - never its schedules.

aap_templates_organization: Default            # the organization the templates are made in
aap_templates_project: site-automation         # your site-automation project in AAP (its name)
aap_templates_inventory: ""                    # the inventory a template is made with (its name) - needed only to make one
aap_templates_inventory_organization: ""     # the inventory's organization when it is another one ("" = aap_templates_organization); the credential's user needs Use on it
aap_templates_inventory_windows: ""           # inventory name for new and existing Windows templates (playbooks/win_*.yml or required machine_windows credential)
aap_templates_inventory_windows_organization: ""  # Windows inventory organization ("" = aap_templates_organization)
aap_templates_portal_user: "{{ portal_setup_portal_user | default('') }}"  # When portal_setup_portal_user is undefined, use this account. Check and Run warn once if it cannot read aap_templates_inventory_windows. Give it Read in AAP.
# the execution environment of each kind the catalog names (all, windows, network); a kind left out: the project's
#   {all: "All-in-one EE", windows: "Windows EE", network: "Network EE"}
aap_templates_ee: {}
# your credential of each kind the catalog names (machine, machine_windows, aap, stigman_api, servicenow, vmware, horizon,
# act_model_key, windows_share, ...); a template that needs a kind not here is skipped, said. A list for several.
# 1.123.1: a credential of another organization is found too (the templates' own is looked in first).
#   {machine: "Linux machine", aap: "AAP reader", stigman_api: "STIG Manager API"}
aap_templates_credentials: {}
# only the templates whose name matches one of these (* and ?, any case); [] = every template of the catalog
#   ["STIG*", "Health check", "Troubleshoot"]
aap_templates_only: []
aap_templates_overwrite: false                 # true = bring a template that differs right (only the fields this job sets)
# true = make the catalog's template even when its playbook already runs under a name of yours ("same playbook, other
# name"), for a workflow of yours that names the catalog's (the site portal's own: AAP - set up portal actions);
# 1.107.0: and the catalog's workflow even when a workflow of yours has its steps under another name ("same steps,
# other name")
aap_templates_create_alias: false
# 1.83.0: the STIG workflows' steps made by another job (the gate, STIG Manager - update): when AAP has none under the
# catalog's name, your template that runs its playbook is used (Check says "uses ..."). Several run it: name the one here
#   {"STIG Manager - update": "STIG update", "Workflow gate - has a plan": "Has a plan"}
aap_templates_step_names: {}
# the site portal's labels (its own label and portal-area:<area>, so the portal finds the templates and groups them):
#   none (the default), portal-actions (the templates the site portal launches) or all (every template made or matched)
aap_templates_label_portal: none
aap_templates_portal_label: "{{ portal_label | default('portal') }}"            # the site portal's label (as written, case too)
aap_templates_portal_label_area: "{{ portal_label_area | default('portal-area:') }}"   # the prefix of its group label
aap_templates_catalog: ""                      # "" = the repository's aap/job_templates.yml; a path here = your own catalog
aap_templates_ca_path: "{{ report_history_aap_ca_path | default('') }}"   # a CA file for AAP's own HTTPS certificate
# 1.79.11: true = write the catalog's descriptions on the templates and workflows found (docs/SETUP_AAP.md, "Describe").
aap_templates_describe: false
aap_templates_describe_only: false             # true = only the descriptions: no template made, checked or labelled
aap_templates_describe_overwrite: false        # true = write over a hand-written description too
aap_templates_describe_list_missing: false     # true = list each catalog template / workflow not in AAP (false: counted only)
aap_templates_description_owner: ""            # the Contact line's Owner= ("" with no contact either: no Contact line)
aap_templates_description_contact: ""          # the Contact line's Developer=
# 1.79.19 (docs/SETUP_AAP.md, "Rename and match your templates"; run Check first): true = your job templates (found by
# playbook) and workflows (by name or steps) get the catalog's names
aap_templates_rename: false
# {"Your name": "New name"}: first, for any template or workflow (one the catalog does not know too)
aap_templates_rename_map: {}
# the fields brought to the catalog's on your templates, without aap_templates_overwrite: any of
#   inventory, credentials (only the missing kinds added - none taken off), prompts, ee, labels (the portal's)
aap_templates_match: []
# false = a catalog template (1.107.0: or workflow) your AAP does not have is not made, only counted (true: made, as
# before 1.79.19)
aap_templates_create_missing: true
# the areas left out of the renames and the match (the catalog's area; Network = also every template of the Network EE)
aap_templates_rename_skip_areas: [Network]
