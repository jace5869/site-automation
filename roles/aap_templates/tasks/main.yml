---
# AAP - set up job templates (library/site_aap_templates.py). Runs on localhost with the "Red Hat Ansible Automation
# Platform" credential's variables. A Check run only reads.
- name: Job templates | verify ownership history
  ansible.builtin.include_role:
    name: aap_setup_history
  vars:
    _setup_ca_path: "{{ aap_templates_ca_path }}"
  when: not aap_templates_describe_only | bool

- name: Job templates | the catalog
  ansible.builtin.set_fact:
    _at_doc: >-
      {{ lookup('ansible.builtin.file', aap_templates_catalog if aap_templates_catalog | length > 0
                else role_path ~ '/../../aap/job_templates.yml') | from_yaml }}

- name: Job templates | catalog and portal-managed objects
  ansible.builtin.set_fact:
    _at_catalog: "{{ _at_doc.job_templates }}"
    _at_workflows: "{{ _at_doc.workflows | default([]) }}"
    _at_portal_spec: >-
      {%- set base = portal_setup_workflows | default({}) or lookup('ansible.builtin.file', role_path ~ '/../site_portal_stack/files/workflows.yml') | from_yaml -%}
      {{ (base | site_portal_spec_merge(portal_setup_templates_extra | default([]), portal_setup_workflows_extra | default([]))).spec }}

# 1.79.19: your templates and workflows renamed to the catalog's names first (aap_templates_rename, aap_templates_rename_map) -
# so the templates below are found by those names (a Check run: read as renamed)
- name: Job templates | renamed to the catalog's names (aap_templates_rename)
  when: not aap_templates_describe_only | bool and (aap_templates_rename | bool or aap_templates_rename_map | length > 0)
  block:
    - name: Job templates | renamed to the catalog's names - read and renamed
      site_aap_rename:
        catalog: "{{ _at_catalog }}"
        workflows: "{{ _at_workflows }}"
        organization: "{{ aap_templates_organization }}"
        project: "{{ aap_templates_project }}"
        rename: "{{ aap_templates_rename | bool }}"
        rename_map: "{{ aap_templates_rename_map }}"
        skip_areas: "{{ aap_templates_rename_skip_areas }}"
        made_elsewhere: "{{ _at_made_elsewhere }}"
        portal_targets: "{{ _at_portal_targets }}"
        only: "{{ aap_templates_only }}"
        ca_path: "{{ aap_templates_ca_path }}"
      register: _atr
      vars:
        # what AAP - set up portal actions makes: its spec (portal_setup_workflows or the repository's) and your extras
        _at_made_elsewhere: >-
          {{ (_at_portal_spec.templates | default([]) + _at_portal_spec.workflows | default([])) | map(attribute='name') | list }}
        # (Codex) every template or workflow a site portal action runs, as the portal merges them, and the setting that names it
        _at_portal_targets: >-
          {%- set base = portal_actions if portal_actions | default({}) | length > 0
                         else (lookup('ansible.builtin.file', role_path ~ '/../site_portal_stack/files/actions.yml') | from_yaml).actions | default({}, true) -%}
          {%- set merged = (base | site_portal_actions_merge(portal_actions_extra | default({}), portal_actions_off | default([]),
                                                              portal_aap_names | default({}))).actions -%}
          {%- set extra = portal_actions_extra | default({}) -%}
          {%- set named = portal_aap_names | default({}) -%}
          {%- set out = [] -%}
          {%- for k, a in merged.items() if a.aap is defined -%}
          {%-   set _ = out.append({'action': k, 'type': a.aap.type | default(''), 'name': a.aap.name | default(''),
                                    'setting': 'portal_aap_names' if k in named else ('portal_actions_extra' if k in extra else 'portal_actions')}) -%}
          {%- endfor -%}
          {{ out }}

    - name: Job templates | renamed to the catalog's names - what was done
      ansible.builtin.debug:
        msg: >-
          {%- set out = [] -%}
          {%- set verb = {'rename': ('WOULD RENAME' if ansible_check_mode else 'renamed'), 'clash': 'NOT RENAMED (name taken)',
                          'twice': 'NOT RENAMED (one of several)', 'skipped': 'not renamed', 'not found': 'not found',
                          'failed': 'FAILED'} -%}
          {#- already right: counted in short only (the user's own names that are the catalog's are most of them) -#}
          {%- for r in _atr.results if r.action != 'right' -%}
          {%-   set _ = out.append(verb[r.action] ~ ' - ' ~ r.kind ~ " '" ~ r.name ~ "'" ~ ((" -> '" ~ r.new ~ "'") if r.new else '')
                                   ~ ((' - ' ~ r.why) if r.why else '')) -%}
          {%- endfor -%}
          {{ out or ['nothing to rename'] }}

    - name: Job templates | renamed to the catalog's names - in short
      ansible.builtin.debug:
        msg: >-
          {%- set n = {} -%}
          {%- for r in _atr.results -%}
          {%-   set k = r.kind ~ ' ' ~ ('already right' if r.action == 'right' else r.action) -%}
          {%-   set _ = n.update({k: n.get(k, 0) + 1}) -%}
          {%- endfor -%}
          {{ [n | dictsort | map('join', ': ') | join(', ') or 'nothing'] + (_atr.twice | default([])) + (_atr.portal | default([])) }}

    - name: Job templates | renamed - a setting, AAP not read, or a rename AAP refused (named above)
      ansible.builtin.fail:
        msg: "{{ _atr.problems }}"
      when: _atr.problems | length > 0

- name: Job templates | made or checked, in AAP
  when: not aap_templates_describe_only | bool
  site_aap_templates:
    catalog: "{{ _at_catalog }}"
    organization: "{{ aap_templates_organization }}"
    project: "{{ aap_templates_project }}"
    inventory: "{{ aap_templates_inventory }}"
    inventory_organization: "{{ aap_templates_inventory_organization }}"
    ee: "{{ aap_templates_ee }}"
    credentials: "{{ aap_templates_credentials }}"
    only: "{{ aap_templates_only }}"
    overwrite: "{{ aap_templates_overwrite | bool }}"
    create_alias: "{{ aap_templates_create_alias | bool }}"
    label_portal: "{{ aap_templates_label_portal }}"
    portal_label: "{{ aap_templates_portal_label }}"
    portal_label_area: "{{ aap_templates_portal_label_area }}"
    variables_dir: "{{ role_path ~ '/../..' }}"
    match: "{{ aap_templates_match }}"
    match_skip_areas: "{{ aap_templates_rename_skip_areas }}"
    create_missing: "{{ aap_templates_create_missing | bool }}"
    renamed: "{{ (_atr.renamed | default({'job': {}})).job if ansible_check_mode else {} }}"
    # 1.83.0: the steps of the catalog's workflows - one another job makes (the gate, STIG Manager - update) is made here
    # when AAP has none, so the workflows below have every step after one run
    needed: "{{ _at_workflows | selectattr('nodes', 'defined') | map(attribute='nodes') | flatten
                | selectattr('template', 'defined') | map(attribute='template') | unique | list }}"
    step_names: "{{ aap_templates_step_names | default({}) }}"
    ca_path: "{{ aap_templates_ca_path }}"
  register: _at

- name: Job templates | what was done
  when: not aap_templates_describe_only | bool
  ansible.builtin.debug:
    msg: >-
      {%- set out = [] -%}
      {%- set verb = {'create': ('WOULD CREATE' if ansible_check_mode else 'created'), 'fix': ('WOULD FIX' if ansible_check_mode else 'fixed'),
                      'right': 'already right', 'differs': 'DIFFERS', 'other name': 'same playbook, other name',
                      'skipped': 'SKIPPED', 'left': 'left to another job', 'failed': 'FAILED', 'uses': 'USES', 'rename': 'RENAME'} -%}
      {#- 1.79.19: not made with aap_templates_create_missing: false - counted in short only -#}
      {%- for r in _at.results if r.action != 'missing' -%}
      {%-   set _ = out.append(verb[r.action] ~ " - '" ~ r.name ~ "'" ~ ((' - ' ~ r.why) if r.why and r.action not in ['create', 'fix'] else '')) -%}
      {%-   if r.also | default('') -%}
      {%-     set _ = out.append('    ' ~ r.also) -%}
      {%-   endif -%}
      {%-   if r.hint | default('') -%}
      {%-     set _ = out.append('    ' ~ r.hint) -%}
      {%-   endif -%}
      {%-   if r.labels | default([]) -%}
      {%-     set _ = out.append('    ' ~ ('would label portal: ' if ansible_check_mode else 'labelled portal: ') ~ (r.labels | join(', '))) -%}
      {%-   endif -%}
      {%-   for f, v in r.diff | dictsort -%}
      {%-     set _ = out.append('    ' ~ f ~ ': ' ~ ('has ' ~ (v[0] | string) ~ ', should be ' if v[0] is not none else '') ~ (v[1] | string)) -%}
      {%-   endfor -%}
      {%- endfor -%}
      {{ out or ([('only catalog templates not in AAP, not made - counted in short (aap_templates_create_missing: false)')]
                 if _at.results else ['nothing in the catalog matches aap_templates_only']) }}

- name: Job templates | in short
  when: not aap_templates_describe_only | bool
  ansible.builtin.debug:
    msg: >-
      {%- set n = {} -%}
      {%- for r in _at.results -%}{%- set _ = n.update({r.action: n.get(r.action, 0) + 1}) -%}{%- endfor -%}
      {%- set nl = _at.results | selectattr('labels', 'defined') | selectattr('labels') | list | length -%}
      {{ (n | dictsort | map('join', ': ') | join(', ') or 'nothing') ~ ((', ' ~ ('would label portal: ' if ansible_check_mode else 'labelled portal: ') ~ nl) if nl else '')
         ~ ((' (missing: not made - aap_templates_create_missing: false)') if n.get('missing', 0) > 0 else '') }}

# 1.83.0: the catalog's workflows that have nodes (STIG - full scan and upload, STIG - drift scan and upload): made with
# every node and link, the portal's label on the workflow (never on its steps), after the templates; the old templates and
# workflows they replace named - never deleted. A Check run only reads.
- name: Job templates | the catalog's workflows (every node and link), and the old ones they replace
  when: not aap_templates_describe_only | bool
  site_aap_template_workflows:
    workflows: "{{ _at_workflows }}"
    templates: "{{ _at_catalog }}"
    organization: "{{ aap_templates_organization }}"
    project: "{{ aap_templates_project }}"           # every step checked here too, whatever aap_templates_only says
    planned: "{{ _at.results | selectattr('action', 'eq', 'create') | map(attribute='name') | list }}"
    fixing: "{{ _at.results | selectattr('action', 'eq', 'fix') | map(attribute='name') | list }}"
    uses: "{{ _at.uses | default({}) }}"            # the site's own update or gate, used for the step
    renamed: "{{ _at.renamed | default([]) }}"
    refused: "{{ _at.refused | default([]) }}"       # steps not fit to wire (another playbook, a Limit prompt)
    overwrite: "{{ aap_templates_overwrite | bool }}"
    labels: "{{ [aap_templates_portal_label, aap_templates_portal_label_area ~ 'STIG'] if aap_templates_portal_label else [] }}"
    alone_label: "{{ portal_label_alone | default('portal-alone', true) }}"
    describe:
      workflow: "{{ dict(_at_workflows | map(attribute='name') | zip(_at_workflows | map(attribute='description', default={}))) }}"
      owner: "{{ aap_templates_description_owner | default('') }}"
      contact: "{{ aap_templates_description_contact | default('') }}"
    only: "{{ aap_templates_only }}"
    known: "{{ _setup_history.fingerprints if _setup_history.fingerprints is not none else omit }}"
    ca_path: "{{ aap_templates_ca_path }}"
  register: _atw

# 1.93.0: what this job wrote, handed on as a job artifact for its next run (never in a description). A Check run hands on nothing.
- name: Job templates | the fingerprints, for the next run (job artifact aap_setup_fingerprints)
  ansible.builtin.set_stats:
    data:
      aap_setup_fingerprints: "{{ _atw.fingerprints }}"
  when: not ansible_check_mode and not aap_templates_describe_only | bool and _atw.fingerprints is defined and _atw.problems | length == 0

- name: Job templates | the workflows - what was done
  when: not aap_templates_describe_only | bool
  ansible.builtin.debug:
    msg: >-
      {%- set out = [] -%}
      {%- set verb = {'create': ('WOULD CREATE' if ansible_check_mode else 'created'), 'update': ('WOULD UPDATE' if ansible_check_mode else 'updated'),
                      'unchanged': 'already right', 'hand-edited': 'CHANGED BY HAND', 'not ours': 'NOT MADE BY THIS JOB',
                      'skipped': 'SKIPPED', 'label': 'label', 'old': 'OLD', 'kept': 'KEEP', 'failed': 'FAILED',
                      'attention': 'TO DO BY HAND'} -%}
      {%- for r in _atw.results -%}
      {%-   set _ = out.append(verb.get(r.action, r.action) ~ ' - ' ~ r.kind ~ " '" ~ r.name ~ "'" ~ ((' - ' ~ r.why) if r.why else '')) -%}
      {%-   for n in r.nodes | default([]) -%}
      {%-     set _ = out.append('    node ' ~ n.id ~ ': ' ~ (("'" ~ n.template ~ "'") if n.template | default('') else ("approval '" ~ n.approval.name ~ "'"))
                               ~ (('; on success -> ' ~ (n.success | join(', '))) if n.success | default([]) else '')
                               ~ (('; on failure -> ' ~ (n.failure | join(', '))) if n.failure | default([]) else '')
                               ~ (('; always -> ' ~ (n.always | join(', '))) if n.always | default([]) else '')
                               ~ (('; its Variables: ' ~ (n.extra_data | dictsort | map('join', ': ') | join(', '))) if n.extra_data | default({}) else '')) -%}
      {%-   endfor -%}
      {%- endfor -%}
      {{ out or ['no catalog workflow matches aap_templates_only'] }}

# 1.79.11: the descriptions (aap_templates_describe) - after the templates are made, so a new one is described in the same
# run; nothing found or read there is ever a failure (a warning); only a write AAP refuses stops the job
- name: Job templates | the descriptions (aap_templates_describe)
  when: aap_templates_describe | bool or aap_templates_describe_only | bool
  block:
    - name: Job templates | the descriptions - written on the templates and workflows found
      site_aap_describe:
        catalog: "{{ _at_catalog }}"
        workflows: "{{ _at_workflows }}"
        organization: "{{ aap_templates_organization }}"
        project: "{{ aap_templates_project }}"
        owner: "{{ aap_templates_description_owner | default('') }}"
        contact: "{{ aap_templates_description_contact | default('') }}"
        overwrite: "{{ aap_templates_describe_overwrite | bool }}"
        only: "{{ aap_templates_only }}"
        vendored: "{{ _at_doc.vendored | default([]) }}"
        renamed: "{{ (_atr.renamed | default({})) if ansible_check_mode else {} }}"
        managed:
          job: "{{ (_at_portal_spec.templates | map(attribute='name') | list + [portal_setup_scorecard_template | default('STIG - weekly scorecard')]) | select | list }}"
          workflow: "{{ _at_portal_spec.workflows | map(attribute='name') | list }}"
        ca_path: "{{ aap_templates_ca_path }}"
      register: _atd

    - name: Job templates | the descriptions - what was done
      ansible.builtin.debug:
        msg: >-
          {%- set out = [] -%}
          {%- set verb = {'describe': ('WOULD DESCRIBE' if ansible_check_mode else 'described'), 'right': 'already right',
                          'kept': 'KEPT (hand-written)', 'left': 'left to its own job', 'not in AAP': 'not in AAP',
                          'no description known': 'no description known',
                          'failed': 'FAILED'} -%}
          {#- 1.79.11d: a catalog template or workflow not in AAP - counted in short, listed only with
              aap_templates_describe_list_missing (the organization or project not found is always said) -#}
          {%- for r in _atd.results if aap_templates_describe_list_missing | bool or not (r.action == 'not in AAP' and r.catalog) -%}
          {%-   set _ = out.append(verb[r.action] ~ ' - ' ~ r.kind ~ " '" ~ r.name ~ "'"
                                   ~ ((" (catalog: '" ~ r.catalog ~ "')") if r.catalog and r.catalog != r.name else '')
                                   ~ ((' - ' ~ r.why) if r.why else '')) -%}
          {%-   if r.action in ['describe', 'kept', 'failed'] -%}
          {%-     set _ = out.append('    was: ' ~ r.was) -%}
          {%-     set _ = out.append('    now: ' ~ r.now) -%}
          {%-   endif -%}
          {%- endfor -%}
          {{ out or ([('only templates or workflows not in AAP - counted in short (aap_templates_describe_list_missing: true lists them)')]
                     if _atd.results else ['nothing matches aap_templates_only']) }}

    - name: Job templates | the descriptions - in short
      ansible.builtin.debug:
        msg: >-
          {%- set n = {} -%}
          {#- the organization or project not found is not a catalog template missing: counted apart (Codex) -#}
          {%- for r in _atd.results -%}
          {%-   set k = r.kind ~ ' ' ~ (('organization/project not found') if r.action == 'not in AAP' and not r.catalog else r.action) -%}
          {%-   set _ = n.update({k: n.get(k, 0) + 1}) -%}
          {%- endfor -%}
          {{ [n | dictsort | map('join', ': ') | join(', ') or 'nothing'] + (_atd.twice | default([]))
             + (['"not in AAP": counted only - aap_templates_describe_list_missing: true lists each']
                if not aap_templates_describe_list_missing | bool and n.get('job not in AAP', 0) + n.get('workflow not in AAP', 0) > 0 else []) }}

    - name: Job templates | the descriptions - WARNING, not read (nothing was written for it)
      ansible.builtin.debug:
        msg: "{{ _atd.notes }}"
      when: _atd.notes | default([]) | length > 0

    - name: Job templates | the descriptions - a write AAP refused
      ansible.builtin.fail:
        msg: "{{ _atd.problems }}"
      when: _atd.problems | length > 0

- name: Job templates | a name not found, AAP not read, or a write that failed - see above
  ansible.builtin.fail:
    msg: "{{ _at.problems + _atw.problems | default([]) }}"
  when: not aap_templates_describe_only | bool and (_at.problems + _atw.problems | default([])) | length > 0
