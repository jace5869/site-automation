---
# CONTAINERS: the podman containers on the host - root's (rootful) and every user's (rootless) -
# found by themselves (roles/podman_discover: which ones exist, which systemd unit runs each one,
# which should be running). Read-only. Which containers and users are looked at, and which are
# left out: the podman_discover_* settings.

# Containers that MUST exist and run on these hosts: a container name, or OWNER/NAME for one
# owner (root/web, alice/web). A name alone matches that container of any owner. Also matches a
# Quadlet file name without .container, e.g. [stigman-mysql, stigman-api, alice/web].
check_containers_required: []

# A container that stopped with an error (exit code not 0) this many hours ago or less is reported
# (containers:crashed). Older crashes are history and are not reported.
check_containers_recent_hours: 24

# More restarts than this (podman's restart count, or its systemd unit's) = a restart loop.
check_containers_restart_warn: 3

# APP PROFILES (1.84.0): a host that runs a known product's containers gets the product's own checks, on top of the container checks
# above, in the same report. netapp_console: NetApp Console Private Mode's agent (podman containers ds_*) - each ds_* container (state,
# health, restarts, uptime, the version from its image tag), the host clock (chronyc tracking), fapolicyd and auditd (run here even in
# the daily set), the agent's data folder (found from the containers' volume mounts) and podman's storage, SELinux, the Console's
# HTTPS answer and certificate, and the errors of its containers' logs. Read-only. A host without such containers is left alone.
# [] = no profile. docs/RUNBOOKS.md ("NetApp Console").
check_containers_profiles: [netapp_console]

# The checks a Console host runs inside this one even when the set (daily) does not include them: the incidents on a Console host were an
# audit flood and a stopped fapolicyd.
check_containers_console_run_checks: [fapolicyd, auditd]

# Which containers are the Console's (a regular expression on the name, from its start).
check_containers_console_pattern: '^ds_'

# The Console's HTTPS address, '' = https://<the host's inventory name>/ . Asked from the host itself. A plain https://HOST[:PORT]/PATH: an address with a
# user name or password, a query string or a fragment is refused (a warning, console:url) and not probed: it would be kept in the report and sent to ACT.
check_containers_console_url: ''

# The containers whose logs are counted for error, recover, corrupt and jwt lines, and for how many hours back; a container with this many
# lines or more is a finding (with its last three lines, names and tokens replaced).
check_containers_console_log_containers: [ds_occmauth, ds_mongo, ds_mysql, ds_krakend]   # a name with a _1 suffix (ds_krakend_1) matches too
# The service ports probed from the host (a TCP connect to the container's address): a container that shows Up with its port refusing is hung.
# Keyed by the name without the _1 suffix.
check_containers_console_ports: {ds_occmauth: 8420, ds_tenancy: 8088}   # container name: port
check_containers_console_cert_volume: ds_certs             # the podman volume with the Console's cert.pem and privkey.pem
check_containers_console_log_hours: 6                  # hours of logs counted
check_containers_console_errors_min: 5                # lines of a container's log that make a finding

# The clock: seconds off before a warning, before a critical (a login fails while it is off); not synchronized is always critical.
check_containers_console_clock_warn: 1                # seconds off: a warning
check_containers_console_clock_crit: 10               # seconds off: critical

# The agent's data folder and podman's storage: percent used. The certificate: days left.
check_containers_console_disk_warn: 85                # percent used: a warning
check_containers_console_disk_crit: 95                # percent used: critical
check_containers_console_cert_warn: 30                # days left: a warning
check_containers_console_cert_crit: 7                 # days left: critical

# auditd's backlog_limit below this is a warning (a busy container host floods the audit queue; the job "Linux - auditd tuning" raises it).
check_containers_console_backlog_min: 8192            # auditd's backlog_limit below this: a warning
