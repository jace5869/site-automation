---
# ServiceNow catalog test (playbooks/servicenow_catalog_test.yml): before the certificate renewals order from
# the PKI's catalog item (cert_renew_servicenow: catalog), prove the item and the settings fit - and print the
# item's questions, by their internal names, to fill cert_renew_catalog_variables with.
#   1 item       the API account finds cert_renew_catalog_item in the catalog, and reads it
#   2 questions  each question: its internal name, label, type, mandatory, the table of a reference, the choices
#   3 settings   cert_renew_catalog_variables against the questions: a question not on the item, a mandatory one
#                left empty, a choice it does not have, a reference name with no (or several) records; the CSR's
#                question; the answers as the order sends them (references as sys_ids)
#   4 order      only with servicenow_catalog_test_order: true - one real order with a test CSR
#                (CN=site-automation-test.invalid), exactly as the renewal makes it: the PKI gets a request (tell
#                them, or cancel it). A run again finds that order and makes no second one (cancel it - Closed
#                Skipped - to order again).
# Steps 1-3 only read, in a dry run too.

- name: Catalog test | connection (from the ServiceNow API credential)
  ansible.builtin.set_fact:
    _sn_url: >-
      {%- set h = lookup('ansible.builtin.env', 'SN_HOST') | trim -%}
      {{ ((h if h.startswith('http') else 'https://' ~ h) | regex_replace('/+$', '')) if h else '' }}
    _sn_user: "{{ lookup('ansible.builtin.env', 'SN_USERNAME') | trim }}"
    _sn_now: "{{ now(utc=true).strftime('%Y-%m-%d %H:%M UTC') }}"

- name: Catalog test | the ServiceNow API credential is attached
  ansible.builtin.assert:
    that: _sn_url | length > 0 and _sn_user | length > 0
    fail_msg: >-
      FAIL: no ServiceNow connection details. Attach the "ServiceNow API" credential to this template (it sets
      SN_HOST, SN_USERNAME and SN_PASSWORD): docs/SERVICENOW_SETUP.md.
    quiet: true

- name: Catalog test | 1-3 read the item and check the settings
  ansible.builtin.include_tasks: catalog_item.yml

- name: Catalog test | 1/4 item - {{ 'PASS' if _cat.id and _cat.questions else 'FAIL' }}
  ansible.builtin.debug:
    msg: >-
      {{ ('PASS 1 item: ' ~ _cat.name ~ ' (sys_id ' ~ _cat.id ~ '), ' ~ _cat.questions | length ~ ' question(s), read as ' ~ _sn_user ~ ' at ' ~ _sn_url)
         if _cat.id and _cat.questions else ('FAIL 1 item: ' ~ (_cat.errors | first | default('the item has no questions'))) }}

# one line each: AAP's job output shortens a long list (it ends in ...) - one task result per question it shows whole
- name: Catalog test | 2/4 questions - name | label | type | mandatory | reference table or choices | default
  ansible.builtin.debug:
    msg: >-
      {{ q.name ~ ' | ' ~ q.label ~ ' | ' ~ q.type_name ~ ' (' ~ q.type ~ ')'
         ~ ' | ' ~ ('MANDATORY' if q.mandatory else 'optional') ~ ' | '
         ~ (('a ' ~ q.reference ~ ' record: its name or sys_id') if q.reference else
            (('choices: ' ~ (q.choices | selectattr('0') | map('join', ' = ') | join(', '))) if q.choices else
             ('the CSR goes here' if q.name == _cat.csr_var else ('nothing to fill in' if not q.answer else 'text'))))
         ~ ((' | default ' ~ q.default) if q.default else '') }}
  loop: "{{ _cat.questions }}"
  loop_control:
    loop_var: q
    label: "{{ q.name }}"

- name: Catalog test | 3/4 settings - {{ 'FAIL' if _cat.errors else ('WARN' if _cat.warnings else 'PASS') }}
  ansible.builtin.debug:
    msg: >-
      {{ (['FAIL 3 settings: what to change (cert_renew_catalog_* in playbooks/group_vars/all.yml):'] + _cat.errors + _cat.warnings)
         if _cat.errors else
         ([('WARN' if _cat.warnings else 'PASS') ~ ' 3 settings: the order would send these answers (references as sys_ids), the CSR in '
           ~ (_cat.csr_var or 'an attachment on the request') ~ (', the names in ' ~ _cat.names_var if _cat.names_var else '') ~ ':']
          + (_cat.answers | dict2items | map(attribute='key') | zip(_cat.answers | dict2items | map(attribute='value')) | map('join', ' = ') | list)
          + _cat.warnings) }}
  when: _cat.id | length > 0 and _cat.questions | length > 0

- name: Catalog test | 4/4 order - a test order with a test CSR (servicenow_catalog_test_order)
  ansible.builtin.include_tasks: cert_order.yml
  vars:
    _csr_items:
      - host: site-automation-test
        inventory_host: site-automation-test
        subject: CN=site-automation-test.invalid, O=TEST - not a real server, cancel this request
        issuer: (test)
        expires: "{{ now(utc=true).strftime('%Y') }}-12-31"
        days: 30
        wheres: [a test of the catalog order - not a real certificate]
        sans: [site-automation-test.invalid]
        status: made
        file_name: "site-automation-TEST-{{ (_cat_test_csr | hash('sha256'))[:8] }}.{{ cert_renew_attach_ext | default('csr', true) }}"
        csr: "{{ _cat_test_csr }}"
        content_type: "{{ cert_renew_attach_type | default('text/plain', true) }}"
        retry_txt: "{{ cert_renew_attach_retry_txt | default(true) | bool }}"
    _cat_test_csr: "{{ lookup('ansible.builtin.file', 'catalog_test.csr') }}"
  when: servicenow_catalog_test_order | bool and not _cat.errors

- name: Catalog test | 4/4 order - SKIP
  ansible.builtin.debug:
    msg: >-
      SKIP 4 order: {{ 'fix step ' ~ ('1' if not _cat.questions else '3') ~ ' first' if _cat.errors else
      'servicenow_catalog_test_order is false - true orders the item once with a test CSR (the PKI gets a real request: tell them, or cancel it)' }}
  when: not (servicenow_catalog_test_order | bool and not _cat.errors)

- name: Catalog test | FAIL when the item or the settings do not fit
  ansible.builtin.fail:
    msg: "{{ _cat.errors | join(' || ') }}"
  when: _cat.errors | length > 0
