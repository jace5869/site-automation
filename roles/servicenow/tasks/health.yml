---
# Is ServiceNow itself healthy? Runs on the controller (localhost), read-only:
#   1. the instance answers the REST API, and how fast
#   2. every MID Server is Up and validated (a down MID Server silently stops discovery,
#      orchestration and integrations that go through it), its heartbeat recent, the versions alike,
#      the expected ones there; its output queue moving (ecc_queue) and its open MID Server Issues
#   3. the MID Server hosts (Windows, read before this by tasks/mid_host.yml: servicenow_mid_result) -
#      the service running, the agent log written, SEVERE lines, JVM restarts, the drive, the URL
#   4. a self-hosted instance: the front-end nodes (read before this by tasks/node_host.yml: servicenow_node_result)
#      and the instance's cluster view (sys_cluster_state), judged in plugins/filter/servicenow_node_filters.py; the
#      database hosts' own findings (roles/check_mariadb and check_disk, run on them before this) added
# Judged in plugins/filter/servicenow_mid_filters.py; one MID Server table in the report.
# The result is published like a host's findings (host name "servicenow"), so the same workflow
# steps (tickets, notifications) work with it.

# servicenow_health_part: all (both), mids (the instance and its MID Servers, as before), nodes (a self-hosted
# instance's nodes, database host and cluster, with the API they need - under the check servicenow_node only, so this job
# and the MID Servers' one never clear each other's tickets)
- name: ServiceNow health | which part (servicenow_health_part {{ servicenow_health_part }})
  ansible.builtin.set_fact:
    _sn_part: "{{ servicenow_health_part | string | lower }}"
    _sn_mid_on: "{{ servicenow_check_mid | bool and (servicenow_health_part | string | lower) != 'nodes' }}"
    _sn_mid_hosts_on: "{{ servicenow_check_mid_hosts | bool and (servicenow_health_part | string | lower) != 'nodes' }}"
    _sn_nodes_on: "{{ servicenow_check_nodes | bool and (servicenow_health_part | string | lower) != 'mids' }}"

- name: ServiceNow health | servicenow_health_part is all, mids or nodes
  ansible.builtin.assert:
    that: _sn_part in ['all', 'mids', 'nodes']
    fail_msg: "servicenow_health_part is {{ servicenow_health_part }}: all, mids or nodes"
    quiet: true

# Before this play's own findings are set: a host of the Limit standing in for localhost may be a database host
- name: ServiceNow health | the front-end nodes and database hosts read before this (the Limit's, when there is one)
  ansible.builtin.set_fact:
    _sn_node_group: "{{ _servicenow_node_hosts }}"
    _sn_node_hosts: "{{ (_servicenow_node_hosts | select('in', _sn_in_limit) | list) if _sn_nodes_on | bool else [] }}"
    _sn_outside: >-
      {{ ((_servicenow_node_hosts + (groups[servicenow_db_group] | default([]) if _sn_db_on | bool else [])) | unique
          | reject('in', _sn_in_limit) | list) if _sn_nodes_on | bool else [] }}
    _sn_db_found: >-
      {%- set f = [] -%}
      {%- for h in (groups[servicenow_db_group] | default([]) | select('in', _sn_in_limit) | list) if _sn_db_on | bool -%}
      {%-   for x in hostvars[h].site_findings | default([]) if hostvars[h].site_checks_run is defined -%}
      {%-     set _ = f.append(x | combine({'id': 'servicenow:db:' ~ h ~ ':' ~ x.id, 'summary': h ~ ': ' ~ x.summary, 'subject': h})) -%}
      {%-   endfor -%}
      {%- endfor -%}
      {{ f }}
    _sn_db_rows: >-
      {%- set rows = [] -%}
      {%- for h in (groups[servicenow_db_group] | default([]) | select('in', _sn_in_limit) | list) if _sn_db_on | bool -%}
      {%-   set hv = hostvars[h] -%}
      {%-   set fs = hv.site_findings | default([]) if hv.site_checks_run is defined else [] -%}
      {%-   set _ = rows.append({'host': h, 'role': 'database' ~ (' and front-end node' if h in groups[servicenow_nodes_group] | default([]) else ''),
                                'reached': hv.site_checks_run is defined, 'problems': fs | length,
                                'first': (fs | map(attribute='summary') | first | default('')) | truncate(120),
                                'checks': hv.site_checks_run | default([]),
                                'failed': hv.site_checks_failed | default([]),
                                'why': hv.servicenow_host_unreached | default(''),
                                'result': dict(hv.servicenow_db_result | default({}), host=h),
                                'worst': 'critical' if fs | selectattr('severity', 'equalto', 'critical') | list | length > 0
                                         else 'warning' if fs | length > 0 else ''}) -%}
      {%- endfor -%}
      {{ rows }}
  vars:
    _sn_in_limit: >-
      {{ query('ansible.builtin.inventory_hostnames', ansible_limit) if ansible_limit | default('', true) | length > 0
         else groups['all'] | default([]) }}
    # the database host only for a self-hosted instance (auto: the inventory has front-end nodes)
    _sn_db_on: >-
      {{ _sn_nodes_on | bool and ((servicenow_check_db | string | lower) in ['true', 'yes', '1', 'on']
         or ((servicenow_check_db | string | lower) == 'auto' and _servicenow_node_hosts | length > 0)) }}

- name: ServiceNow health | connection
  ansible.builtin.set_fact:
    _sn_url: >-
      {%- set h = lookup('ansible.builtin.env', 'SN_HOST') | trim -%}
      {{ ((h if h.startswith('http') else 'https://' ~ h) | regex_replace('/+$', '')) if h else '' }}
    site_findings: []
    site_checks_run: "{{ ['servicenow_node'] if _sn_part == 'nodes' else ['servicenow'] }}"

- name: ServiceNow health | the ServiceNow API credential is attached
  ansible.builtin.assert:
    that: _sn_url | length > 0
    fail_msg: Attach the "ServiceNow API" credential (it sets SN_HOST, SN_USERNAME, SN_PASSWORD).
    quiet: true

- name: ServiceNow health | the instance answers the API
  ansible.builtin.uri:
    url: "{{ _sn_url }}/api/now/table/{{ servicenow_table }}?sysparm_limit=1&sysparm_fields=number"
    method: GET
    url_username: "{{ lookup('ansible.builtin.env', 'SN_USERNAME') }}"
    url_password: "{{ lookup('ansible.builtin.env', 'SN_PASSWORD') }}"
    force_basic_auth: true
    headers: {Accept: application/json}
    validate_certs: "{{ servicenow_validate_certs }}"
    ca_path: "{{ servicenow_ca_path | default(omit, true) }}"
    timeout: "{{ servicenow_timeout }}"
  register: _sn_ping
  failed_when: false
  check_mode: false             # only reads

- name: ServiceNow health | MID Servers
  ansible.builtin.uri:
    url: "{{ _sn_url }}/api/now/table/ecc_agent?sysparm_fields=name,status,validated,host_name,ip_address,version,last_refreshed&sysparm_limit=500"
    method: GET
    url_username: "{{ lookup('ansible.builtin.env', 'SN_USERNAME') }}"
    url_password: "{{ lookup('ansible.builtin.env', 'SN_PASSWORD') }}"
    force_basic_auth: true
    headers: {Accept: application/json}
    validate_certs: "{{ servicenow_validate_certs }}"
    ca_path: "{{ servicenow_ca_path | default(omit, true) }}"
    timeout: "{{ servicenow_timeout }}"
  register: _sn_mid
  failed_when: false
  check_mode: false             # only reads
  when: _sn_mid_on | bool and _sn_ping.status | default(0) == 200

- name: ServiceNow health | the time, for the heartbeats and the queue
  ansible.builtin.set_fact:
    _sn_epoch: "{{ now().timestamp() | int }}"

- name: ServiceNow health | MID Servers' output waiting longer than {{ servicenow_mid_queue_minutes }} min (ecc_queue)
  ansible.builtin.uri:
    url: >-
      {{ _sn_url }}/api/now/stats/ecc_queue?sysparm_count=true&sysparm_group_by=agent&sysparm_query={{
         ('queue=output^state=ready^agentSTARTSWITHmid.server.^sys_created_on<'
          ~ ('%Y-%m-%d %H:%M:%S' | strftime(_sn_epoch | int - (servicenow_mid_queue_minutes | int) * 60, utc=true))) | urlencode }}
    method: GET
    url_username: "{{ lookup('ansible.builtin.env', 'SN_USERNAME') }}"
    url_password: "{{ lookup('ansible.builtin.env', 'SN_PASSWORD') }}"
    force_basic_auth: true
    headers: {Accept: application/json}
    validate_certs: "{{ servicenow_validate_certs }}"
    ca_path: "{{ servicenow_ca_path | default(omit, true) }}"
    timeout: "{{ servicenow_timeout }}"
  register: _sn_queue
  failed_when: false
  check_mode: false             # only reads
  when: _sn_mid_on | bool and servicenow_mid_queue_check | bool and _sn_mid.status | default(0) == 200

- name: ServiceNow health | open MID Server Issues (ecc_agent_issue)
  ansible.builtin.uri:
    url: >-
      {{ _sn_url }}/api/now/table/ecc_agent_issue?sysparm_fields=mid_server,message,state,sys_created_on&sysparm_display_value=true&sysparm_limit=200&sysparm_query={{
         'stateNOT INresolved,closed,ignored' | urlencode }}
    method: GET
    url_username: "{{ lookup('ansible.builtin.env', 'SN_USERNAME') }}"
    url_password: "{{ lookup('ansible.builtin.env', 'SN_PASSWORD') }}"
    force_basic_auth: true
    headers: {Accept: application/json}
    validate_certs: "{{ servicenow_validate_certs }}"
    ca_path: "{{ servicenow_ca_path | default(omit, true) }}"
    timeout: "{{ servicenow_timeout }}"
  register: _sn_issues
  failed_when: false
  check_mode: false             # only reads
  when: _sn_mid_on | bool and servicenow_mid_issues_check | bool and _sn_mid.status | default(0) == 200

- name: ServiceNow health | the cluster's nodes (sys_cluster_state)
  ansible.builtin.uri:
    url: "{{ _sn_url }}/api/now/table/sys_cluster_state?sysparm_fields=system_id,node_id,status,most_recent_message,schedulers&sysparm_limit=200"
    method: GET
    url_username: "{{ lookup('ansible.builtin.env', 'SN_USERNAME') }}"
    url_password: "{{ lookup('ansible.builtin.env', 'SN_PASSWORD') }}"
    force_basic_auth: true
    headers: {Accept: application/json}
    validate_certs: "{{ servicenow_validate_certs }}"
    ca_path: "{{ servicenow_ca_path | default(omit, true) }}"
    timeout: "{{ servicenow_timeout }}"
  register: _sn_cluster
  failed_when: false
  check_mode: false             # only reads
  # auto: when the inventory has front-end nodes (a self-hosted instance); true / false
  when:
    - _sn_ping.status | default(0) == 200
    - _sn_part != 'mids'
    - (servicenow_cluster_check | string | lower) in ['true', 'yes', '1', 'on']
      or ((servicenow_cluster_check | string | lower) == 'auto' and _sn_nodes_on | bool and _sn_node_group | length > 0)

# servicenow_node_stats_pages (1.32.0): nodes AAP does not log in to, each asked at its own listed address from here.
# An entry whose host is a node of the group is read once, over SSH (its name is that node's friendly name).
- name: ServiceNow health | which listed stats pages are read from here (servicenow_node_stats_pages)
  ansible.builtin.set_fact:
    _sn_pages_plan: >-
      {{ (servicenow_node_stats_pages | sn_node_pages_plan(_sn_node_group)) if _sn_nodes_on | bool and servicenow_node_stats | bool
         else {'read': [], 'ssh': [], 'errors': []} }}

- name: ServiceNow health | the listed stats pages (read-only, no SSH to those nodes)
  site_servicenow_node:
    kind: pages
    pages: "{{ _sn_pages_plan.read }}"
    samples: "{{ servicenow_node_stats_samples | int }}"
    interval: "{{ servicenow_node_stats_interval | float }}"
    timeout: "{{ servicenow_node_stats_timeout | int }}"
    stats_auth: "{{ servicenow_node_stats_auth }}"
    validate_certs: "{{ servicenow_node_validate_certs | bool }}"
    fapolicyd: false
    # the ServiceNow API credential's login, for a stats page that asks for one: only over HTTPS, only to the listed host
    stats_user: "{{ lookup('ansible.builtin.env', 'SN_USERNAME') if servicenow_node_stats_auth != 'none' else '' }}"
    stats_password: "{{ lookup('ansible.builtin.env', 'SN_PASSWORD') if servicenow_node_stats_auth != 'none' else '' }}"
  register: _sn_pages
  failed_when: false               # not read: a finding per entry below, never a green run that read nothing
  check_mode: false                # only reads
  when: _sn_pages_plan.read | length > 0

- name: ServiceNow health | the front-end nodes, as they and the cluster see them
  ansible.builtin.set_fact:
    _sn_nodes: >-
      {%- set out = [] -%}
      {%- for h in _sn_node_hosts -%}
      {%-   set _ = out.append(hostvars[h].servicenow_node_result | default({'host': h, 'hostname': '', 'reachable': true, 'units': [],
                                'missing': [], 'disk': [], 'memory': {},
                                'label': hostvars[h].servicenow_node_label | default('', true) | string | trim,
                                'error': 'its host was not read (sudo refused, or the play did not reach it)'})) -%}
      {%- endfor -%}
      {#- the listed pages after them; the module itself not run (no Python here): each entry not read, said why -#}
      {%- set read = _sn_pages.pages | default([]) -%}
      {%- if _sn_pages_plan.read | length > 0 and read | length == 0 -%}
      {%-   set read = [] -%}
      {%-   for e in _sn_pages_plan.read -%}
      {%-     set _ = read.append(e | combine({'port': 0, 'stats': {'up': false, 'status': -1, 'tried': [], 'sem_queued_samples': [],
                                    'why': (_sn_pages.msg | default('the read did not run', true) | string | replace('\n', ' ')) | truncate(160)}})) -%}
      {%-   endfor -%}
      {%- endif -%}
      {{ (out + (read | sn_node_pages)) | sn_node_labels(servicenow_node_labels, _sn_pages_plan) }}
    _sn_cluster_rows: >-
      {{ (_sn_cluster.json.result | default([]) if _sn_cluster.status | default(0) == 200 else [])
         | sn_node_cluster({'now': _sn_epoch | int}) }}
    _sn_node_opts: >-
      {{ {'home': servicenow_node_home, 'stats': servicenow_node_stats | bool, 'log_hours': servicenow_node_log_hours,
          'log_groups': servicenow_node_log_groups | int, 'mem_warn': servicenow_node_mem_warn_pct | float,
          'mem_critical': servicenow_node_mem_critical_pct | float, 'sem_queue_critical': servicenow_node_semaphore_queue_critical | float,
          'sched_queue_warn': servicenow_node_scheduler_queue_warn | float, 'severe_warn': servicenow_node_severe_warn | int,
          'slow_tx_warn': servicenow_node_slow_tx_warn | int, 'sem_wait_ms': servicenow_node_semaphore_wait_ms | int,
          'disk_warn': servicenow_node_disk_warn_pct | float, 'disk_critical': servicenow_node_disk_critical_pct | float,
          'swap_warn': servicenow_node_swap_warn_pct | float, 'stale_minutes': servicenow_cluster_stale_minutes | float,
          'cluster_read': _sn_cluster.status | default(0) == 200,
          'inventory': _sn_node_group + (_sn_pages_plan.read | map(attribute='host') | list), 'group': servicenow_nodes_group,
          'outside': _sn_outside, 'db_paths': servicenow_db_paths | name_list, 'fill_warn': servicenow_db_fill_warn_days | float,
          'fill_critical': servicenow_db_fill_critical_days | float, 'fapolicyd_since': servicenow_fapolicyd_since} }}

# one dict expression: on ansible-core 2.16 the values of a YAML dict would arrive as strings
- name: ServiceNow health | the MID Servers, as the instance and their hosts see them
  ansible.builtin.set_fact:
    _sn_agents: >-
      {{ (_sn_mid.json.result | default([]) if _sn_mid.status | default(0) == 200 else [])
         | sn_mid_agents({'names': servicenow_mid_names | name_list, 'now': _sn_epoch | int}) }}
    _sn_queue_by: "{{ (_sn_queue.json.result | default([])) if _sn_queue.status | default(0) == 200 else [] }}"
    _sn_mid_hosts: >-
      {{ (groups[servicenow_mid_hosts_group] | default([]) | map('extract', hostvars) | selectattr('servicenow_mid_result', 'defined')
          | map(attribute='servicenow_mid_result') | list) if _sn_mid_hosts_on | bool else [] }}
    _sn_mid_opts: >-
      {{ {'names': servicenow_mid_names | name_list, 'expected': servicenow_mid_expected | name_list,
          'stale_minutes': servicenow_mid_stale_minutes | float, 'version_check': servicenow_mid_version_check | bool,
          'queue_minutes': servicenow_mid_queue_minutes | int, 'queue_warn': servicenow_mid_queue_warn | int,
          'queue_critical': servicenow_mid_queue_critical | int, 'instance_url': _sn_url, 'url_check': servicenow_mid_url_check | bool,
          'service_match': servicenow_mid_service_match, 'hours': servicenow_mid_hours,
          'log_stale_minutes': servicenow_mid_log_stale_minutes | float, 'severe_warn': servicenow_mid_severe_warn | int,
          'jvm_warn': servicenow_mid_jvm_restarts_warn | int, 'disk_warn': servicenow_mid_disk_warn_pct | float,
          'disk_critical': servicenow_mid_disk_critical_pct | float} }}

- name: ServiceNow health | findings
  ansible.builtin.set_fact:
    site_findings: >-
      {%- set f = [] -%}
      {%- if _sn_ping.status | default(0) != 200 -%}
      {%-   set _ = f.append({'check': 'servicenow_node' if _sn_part == 'nodes' else 'servicenow', 'id': 'servicenow:api', 'severity': 'critical',
                              'summary': 'the ServiceNow API does not answer (' ~ ((_sn_ping.status | default(0) | string) if _sn_ping.status | default(0) > 0 else 'no connection')
                                         ~ ': ' ~ _sn_ping.msg | default('') | truncate(150) ~ ')',
                              'hint': 'curl -sS -o /dev/null -w "HTTP %{http_code} in %{time_total}s" ' ~ _sn_url ~ '/api/now/table/incident?sysparm_limit=1'}) -%}
      {%- else -%}
      {%-   if (_sn_ping.elapsed | default(0) | float) > servicenow_slow_seconds | float -%}
      {%-     set _ = f.append({'check': 'servicenow_node' if _sn_part == 'nodes' else 'servicenow', 'id': 'servicenow:slow', 'severity': 'warning',
                                'summary': 'the ServiceNow API took ' ~ _sn_ping.elapsed ~ ' s to answer (warning above ' ~ servicenow_slow_seconds ~ ' s)',
                                'hint': 'open ' ~ _sn_url ~ '/stats.do (node, semaphores, memory)'}) -%}
      {%-   endif -%}
      {%-   if _sn_mid_on | bool and _sn_mid.status | default(0) != 200 -%}
      {%-     set _ = f.append({'check': 'servicenow', 'id': 'servicenow:mid-unreadable', 'severity': 'warning',
                                'summary': 'could not read the MID Server list (HTTP ' ~ _sn_mid.status | default('?') ~ '): the API account needs read access to ecc_agent',
                                'hint': ''}) -%}
      {%-   endif -%}
      {%-   if _sn_mid_on | bool and _sn_mid.status | default(0) == 200 -%}
      {%-     set _ = f.extend(_sn_agents | sn_mid_findings(_sn_queue_by | sn_mid_queue,
                                                          (_sn_issues.json.result | default([])) if _sn_issues.status | default(0) == 200 else [],
                                                          _sn_mid_hosts, _sn_mid_opts)) -%}
      {%-   endif -%}
      {%- endif -%}
      {%- if _sn_ping.status | default(0) != 200 or not _sn_mid_on | bool or _sn_mid.status | default(0) != 200 -%}
      {#-   the instance could not say: the hosts are still judged on what they said -#}
      {%-   set _ = f.extend(_sn_mid_hosts | sn_mid_host_findings(_sn_mid_opts)) -%}
      {%- endif -%}
      {#- the self-hosted part: the nodes said it themselves, the cluster when the API answered -#}
      {%- set _ = f.extend(_sn_nodes | sn_node_findings(_sn_cluster_rows, _sn_node_opts)) -%}
      {%- for d in _sn_db_rows if not d.reached -%}
      {%-   set _ = f.append({'check': 'servicenow_node', 'id': 'servicenow:db:' ~ d.host ~ ':not-read', 'severity': 'critical',
                              'summary': 'ServiceNow database host ' ~ d.host ~ ' was not read: ' ~ (d.why or 'not reached, or sudo refused'),
                              'hint': 'ansible ' ~ d.host ~ ' -m ping -b', 'subject': d.host}) -%}
      {%- endfor -%}
      {%- set _ = f.extend(_sn_db_found) -%}
      {%- set _ = f.extend(_sn_db_rows | selectattr('reached') | map(attribute='result') | select | list | sn_db_findings(_sn_node_opts)) -%}
      {#- what each is about, for the report's cards: the node or database host it names, else the instance (not the
          AAP side's host, or the Limit's host standing in for it) -#}
      {%- set out = [] -%}
      {%- for x in f -%}
      {%-   set _ = out.append(x if x.subject | default('') else x | combine({'subject': (_sn_url | urlsplit('hostname')) or 'ServiceNow'})) -%}
      {%- endfor -%}
      {{ out }}
    site_report_sections: >-
      {{ ([_sn_agents | sn_mid_section(_sn_queue_by | sn_mid_queue, _sn_mid_hosts, _sn_mid_opts)]
          if _sn_mid_on | bool and (_sn_agents | length > 0 or _sn_mid_hosts | length > 0) else [])
         + (_sn_nodes | sn_node_sections(_sn_cluster_rows, _sn_db_rows, _sn_node_opts)) }}
    # servicenow_node only when nodes or database hosts were there to read: a run with the Windows inventory clears none of
    # their tickets
    site_checks_run: >-
      {{ (site_checks_run + (['servicenow_node'] if _sn_node_hosts | length > 0 or _sn_pages_plan.read | length > 0 or _sn_db_rows | length > 0
                                or _sn_cluster.status | default(0) == 200 else [])
          + (_sn_db_rows | map(attribute='checks') | flatten)) | unique | list }}
    site_checks_failed: "{{ _sn_db_rows | map(attribute='failed') | flatten | unique | list }}"

- name: ServiceNow health | status
  ansible.builtin.debug:
    msg: >-
      API {{ 'answers in ' ~ _sn_ping.elapsed ~ ' s' if _sn_ping.status | default(0) == 200 else 'DOES NOT ANSWER' }};
      {{ (_sn_agents | sn_mid_status(_sn_queue_by | sn_mid_queue, _sn_mid_hosts)) if _sn_mid_on | bool
         else ('MID Servers: not read here (servicenow_health_part nodes)' if _sn_part == 'nodes' else 'MID Servers: not checked (servicenow_check_mid)') }}
      {{- ('; ' ~ (_sn_nodes | sn_node_status(_sn_cluster_rows, _sn_node_opts))) if _sn_nodes | length > 0 or _sn_outside | length > 0 else '' }}
      {{- ('; ' ~ (_sn_db_rows | map(attribute='result') | list | sn_db_status)) if _sn_db_rows | length > 0 else '' }}

- name: ServiceNow health | what could not be read (the API account's rights, docs/SERVICENOW_SETUP.md)
  ansible.builtin.debug:
    msg: >-
      {{ ([('ecc_queue (stuck output): HTTP ' ~ _sn_queue.status ~ ' - give the account read on ecc_queue (e.g. the mid_server role), or servicenow_mid_queue_check: false')]
          if _sn_queue.status is defined and _sn_queue.status | default(0) != 200 else [])
         + ([('ecc_agent_issue (MID Server Issues): HTTP ' ~ _sn_issues.status ~ ' - an older release has no such table, or the account cannot read it; servicenow_mid_issues_check: false')]
            if _sn_issues.status is defined and _sn_issues.status | default(0) != 200 else [])
         + ([('sys_cluster_state (the cluster nodes): HTTP ' ~ _sn_cluster.status ~ ' - give the account read on sys_cluster_state (admin, or an ACL), or servicenow_cluster_check: false')]
            if _sn_cluster.status is defined and _sn_cluster.status | default(0) != 200 else []) }}
  when: >-
    (_sn_queue.status is defined and _sn_queue.status | default(0) != 200)
    or (_sn_issues.status is defined and _sn_issues.status | default(0) != 200)
    or (_sn_cluster.status is defined and _sn_cluster.status | default(0) != 200)
