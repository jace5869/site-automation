---
# Is ServiceNow itself healthy? Runs on the controller (localhost), read-only:
#   1. the instance answers the REST API, and how fast
#   2. every MID Server is Up and validated (a down MID Server silently stops discovery,
#      orchestration and integrations that go through it), its heartbeat recent, the versions alike,
#      the expected ones there; its output queue moving (ecc_queue) and its open MID Server Issues
#   3. the MID Server hosts (Windows, read before this by tasks/mid_host.yml: servicenow_mid_result) -
#      the service running, the agent log written, SEVERE lines, JVM restarts, the drive, the URL
# Judged in plugins/filter/servicenow_mid_filters.py; one MID Server table in the report.
# The result is published like a host's findings (host name "servicenow"), so the same workflow
# steps (tickets, notifications) work with it.

- name: ServiceNow health | connection
  ansible.builtin.set_fact:
    _sn_url: >-
      {%- set h = lookup('ansible.builtin.env', 'SN_HOST') | trim -%}
      {{ ((h if h.startswith('http') else 'https://' ~ h) | regex_replace('/+$', '')) if h else '' }}
    site_findings: []
    site_checks_run: [servicenow]

- name: ServiceNow health | the ServiceNow API credential is attached
  ansible.builtin.assert:
    that: _sn_url | length > 0
    fail_msg: Attach the "ServiceNow API" credential (it sets SN_HOST, SN_USERNAME, SN_PASSWORD).
    quiet: true

- name: ServiceNow health | the instance answers the API
  ansible.builtin.uri:
    url: "{{ _sn_url }}/api/now/table/{{ servicenow_table }}?sysparm_limit=1&sysparm_fields=number"
    method: GET
    url_username: "{{ lookup('ansible.builtin.env', 'SN_USERNAME') }}"
    url_password: "{{ lookup('ansible.builtin.env', 'SN_PASSWORD') }}"
    force_basic_auth: true
    headers: {Accept: application/json}
    validate_certs: "{{ servicenow_validate_certs }}"
    ca_path: "{{ servicenow_ca_path | default(omit, true) }}"
    timeout: "{{ servicenow_timeout }}"
  register: _sn_ping
  failed_when: false
  check_mode: false             # only reads

- name: ServiceNow health | MID Servers
  ansible.builtin.uri:
    url: "{{ _sn_url }}/api/now/table/ecc_agent?sysparm_fields=name,status,validated,host_name,ip_address,version,last_refreshed&sysparm_limit=500"
    method: GET
    url_username: "{{ lookup('ansible.builtin.env', 'SN_USERNAME') }}"
    url_password: "{{ lookup('ansible.builtin.env', 'SN_PASSWORD') }}"
    force_basic_auth: true
    headers: {Accept: application/json}
    validate_certs: "{{ servicenow_validate_certs }}"
    ca_path: "{{ servicenow_ca_path | default(omit, true) }}"
    timeout: "{{ servicenow_timeout }}"
  register: _sn_mid
  failed_when: false
  check_mode: false             # only reads
  when: servicenow_check_mid | bool and _sn_ping.status | default(0) == 200

- name: ServiceNow health | the time, for the heartbeats and the queue
  ansible.builtin.set_fact:
    _sn_epoch: "{{ now().timestamp() | int }}"

- name: ServiceNow health | MID Servers' output waiting longer than {{ servicenow_mid_queue_minutes }} min (ecc_queue)
  ansible.builtin.uri:
    url: >-
      {{ _sn_url }}/api/now/stats/ecc_queue?sysparm_count=true&sysparm_group_by=agent&sysparm_query={{
         ('queue=output^state=ready^agentSTARTSWITHmid.server.^sys_created_on<'
          ~ ('%Y-%m-%d %H:%M:%S' | strftime(_sn_epoch | int - (servicenow_mid_queue_minutes | int) * 60, utc=true))) | urlencode }}
    method: GET
    url_username: "{{ lookup('ansible.builtin.env', 'SN_USERNAME') }}"
    url_password: "{{ lookup('ansible.builtin.env', 'SN_PASSWORD') }}"
    force_basic_auth: true
    headers: {Accept: application/json}
    validate_certs: "{{ servicenow_validate_certs }}"
    ca_path: "{{ servicenow_ca_path | default(omit, true) }}"
    timeout: "{{ servicenow_timeout }}"
  register: _sn_queue
  failed_when: false
  check_mode: false             # only reads
  when: servicenow_check_mid | bool and servicenow_mid_queue_check | bool and _sn_mid.status | default(0) == 200

- name: ServiceNow health | open MID Server Issues (ecc_agent_issue)
  ansible.builtin.uri:
    url: >-
      {{ _sn_url }}/api/now/table/ecc_agent_issue?sysparm_fields=mid_server,message,state,sys_created_on&sysparm_display_value=true&sysparm_limit=200&sysparm_query={{
         'stateNOT INresolved,closed,ignored' | urlencode }}
    method: GET
    url_username: "{{ lookup('ansible.builtin.env', 'SN_USERNAME') }}"
    url_password: "{{ lookup('ansible.builtin.env', 'SN_PASSWORD') }}"
    force_basic_auth: true
    headers: {Accept: application/json}
    validate_certs: "{{ servicenow_validate_certs }}"
    ca_path: "{{ servicenow_ca_path | default(omit, true) }}"
    timeout: "{{ servicenow_timeout }}"
  register: _sn_issues
  failed_when: false
  check_mode: false             # only reads
  when: servicenow_check_mid | bool and servicenow_mid_issues_check | bool and _sn_mid.status | default(0) == 200

# one dict expression: on ansible-core 2.16 the values of a YAML dict would arrive as strings
- name: ServiceNow health | the MID Servers, as the instance and their hosts see them
  ansible.builtin.set_fact:
    _sn_agents: >-
      {{ (_sn_mid.json.result | default([]) if _sn_mid.status | default(0) == 200 else [])
         | sn_mid_agents({'names': servicenow_mid_names | name_list, 'now': _sn_epoch | int}) }}
    _sn_queue_by: "{{ (_sn_queue.json.result | default([])) if _sn_queue.status | default(0) == 200 else [] }}"
    _sn_mid_hosts: >-
      {{ (groups[servicenow_mid_hosts_group] | default([]) | map('extract', hostvars) | selectattr('servicenow_mid_result', 'defined')
          | map(attribute='servicenow_mid_result') | list) if servicenow_check_mid_hosts | bool else [] }}
    _sn_mid_opts: >-
      {{ {'names': servicenow_mid_names | name_list, 'expected': servicenow_mid_expected | name_list,
          'stale_minutes': servicenow_mid_stale_minutes | float, 'version_check': servicenow_mid_version_check | bool,
          'queue_minutes': servicenow_mid_queue_minutes | int, 'queue_warn': servicenow_mid_queue_warn | int,
          'queue_critical': servicenow_mid_queue_critical | int, 'instance_url': _sn_url, 'url_check': servicenow_mid_url_check | bool,
          'service_match': servicenow_mid_service_match, 'hours': servicenow_mid_hours,
          'log_stale_minutes': servicenow_mid_log_stale_minutes | float, 'severe_warn': servicenow_mid_severe_warn | int,
          'jvm_warn': servicenow_mid_jvm_restarts_warn | int, 'disk_warn': servicenow_mid_disk_warn_pct | float,
          'disk_critical': servicenow_mid_disk_critical_pct | float} }}

- name: ServiceNow health | findings
  ansible.builtin.set_fact:
    site_findings: >-
      {%- set f = [] -%}
      {%- if _sn_ping.status | default(0) != 200 -%}
      {%-   set _ = f.append({'check': 'servicenow', 'id': 'servicenow:api', 'severity': 'critical',
                              'summary': 'the ServiceNow API does not answer (' ~ ((_sn_ping.status | default(0) | string) if _sn_ping.status | default(0) > 0 else 'no connection')
                                         ~ ': ' ~ _sn_ping.msg | default('') | truncate(150) ~ ')',
                              'hint': 'curl -sS -o /dev/null -w "HTTP %{http_code} in %{time_total}s" ' ~ _sn_url ~ '/api/now/table/incident?sysparm_limit=1'}) -%}
      {%- else -%}
      {%-   if (_sn_ping.elapsed | default(0) | float) > servicenow_slow_seconds | float -%}
      {%-     set _ = f.append({'check': 'servicenow', 'id': 'servicenow:slow', 'severity': 'warning',
                                'summary': 'the ServiceNow API took ' ~ _sn_ping.elapsed ~ ' s to answer (warning above ' ~ servicenow_slow_seconds ~ ' s)',
                                'hint': 'open ' ~ _sn_url ~ '/stats.do (node, semaphores, memory)'}) -%}
      {%-   endif -%}
      {%-   if servicenow_check_mid | bool and _sn_mid.status | default(0) != 200 -%}
      {%-     set _ = f.append({'check': 'servicenow', 'id': 'servicenow:mid-unreadable', 'severity': 'warning',
                                'summary': 'could not read the MID Server list (HTTP ' ~ _sn_mid.status | default('?') ~ '): the API account needs read access to ecc_agent',
                                'hint': ''}) -%}
      {%-   endif -%}
      {%-   if servicenow_check_mid | bool and _sn_mid.status | default(0) == 200 -%}
      {%-     set _ = f.extend(_sn_agents | sn_mid_findings(_sn_queue_by | sn_mid_queue,
                                                          (_sn_issues.json.result | default([])) if _sn_issues.status | default(0) == 200 else [],
                                                          _sn_mid_hosts, _sn_mid_opts)) -%}
      {%-   endif -%}
      {%- endif -%}
      {%- if _sn_ping.status | default(0) != 200 or not servicenow_check_mid | bool or _sn_mid.status | default(0) != 200 -%}
      {#-   the instance could not say: the hosts are still judged on what they said -#}
      {%-   set _ = f.extend(_sn_mid_hosts | sn_mid_host_findings(_sn_mid_opts)) -%}
      {%- endif -%}
      {{ f }}
    site_report_sections: >-
      {{ [_sn_agents | sn_mid_section(_sn_queue_by | sn_mid_queue, _sn_mid_hosts, _sn_mid_opts)]
         if servicenow_check_mid | bool and (_sn_agents | length > 0 or _sn_mid_hosts | length > 0) else [] }}

- name: ServiceNow health | status
  ansible.builtin.debug:
    msg: >-
      API {{ 'answers in ' ~ _sn_ping.elapsed ~ ' s' if _sn_ping.status | default(0) == 200 else 'DOES NOT ANSWER' }};
      {{ (_sn_agents | sn_mid_status(_sn_queue_by | sn_mid_queue, _sn_mid_hosts)) if servicenow_check_mid | bool else 'MID Servers: not checked (servicenow_check_mid)' }}

- name: ServiceNow health | what could not be read (the API account's rights, docs/SERVICENOW_SETUP.md)
  ansible.builtin.debug:
    msg: >-
      {{ ([('ecc_queue (stuck output): HTTP ' ~ _sn_queue.status ~ ' - give the account read on ecc_queue (e.g. the mid_server role), or servicenow_mid_queue_check: false')]
          if _sn_queue.status is defined and _sn_queue.status | default(0) != 200 else [])
         + ([('ecc_agent_issue (MID Server Issues): HTTP ' ~ _sn_issues.status ~ ' - an older release has no such table, or the account cannot read it; servicenow_mid_issues_check: false')]
            if _sn_issues.status is defined and _sn_issues.status | default(0) != 200 else []) }}
  when: >-
    (_sn_queue.status is defined and _sn_queue.status | default(0) != 200)
    or (_sn_issues.status is defined and _sn_issues.status | default(0) != 200)
