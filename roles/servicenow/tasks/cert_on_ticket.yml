---
# VMWARE AND NETWORK DEVICE CERTIFICATE RENEWAL, before a CSR is made (roles/vmware_vm/tasks/cert_renew.yml,
# roles/net_certs/tasks/renew_start.yml): each due certificate's tickets, and whether its CSR is on one already -
# attached (a file whose name starts with the certificate's), or in a work note (the attachment was refused).
# vCenter, an ESXi host and a Cisco device keep one pending key: a second CSR replaces the key of the first, the
# one the PKI may be signing. So a CSR is made once, and its ticket is the record of it - also once that ticket is
# resolved or closed: every ticket of the certificate made in the last cert_renew_csr_memory_days counts, newest
# first. Reads only - in a dry run too.
# Input: _csr_check_in [{id (the finding's), host, check, prefix (of the CSR's file name), csr: true when it would get a CSR}].
# Output: cert_csr_tickets {id: its open ticket's number}, cert_csr_on_ticket {id: 'INC0010001 (attached: x.csr)'}.

- name: Certificate renewal | connection (from the ServiceNow API credential)
  ansible.builtin.set_fact:
    _sn_url: >-
      {%- set h = lookup('ansible.builtin.env', 'SN_HOST') | trim -%}
      {{ ((h if h.startswith('http') else 'https://' ~ h) | regex_replace('/+$', '')) if h else '' }}
    _sn_user: "{{ lookup('ansible.builtin.env', 'SN_USERNAME') }}"

- name: Certificate renewal | each certificate's tickets of the last cert_renew_csr_memory_days, newest first, with their work notes
  ansible.builtin.uri:
    url: >-
      {{ _sn_url }}/api/now/table/{{ servicenow_table }}?sysparm_limit=10&sysparm_display_value=true&sysparm_exclude_reference_link=true&sysparm_fields=sys_id,number,correlation_id,active,work_notes&sysparm_query={{
      ('correlation_id=' ~ (item.id | site_correlation_id(item.host, item.check, servicenow_correlation_prefix))
       ~ '^sys_created_on>=javascript:gs.daysAgoStart(' ~ (cert_renew_csr_memory_days | int) ~ ')^ORDERBYDESCsys_created_on') | urlencode }}
    method: GET
    url_username: "{{ _sn_user }}"
    url_password: "{{ lookup('ansible.builtin.env', 'SN_PASSWORD') }}"
    force_basic_auth: true
    headers: {Accept: application/json}
    validate_certs: "{{ servicenow_validate_certs }}"
    ca_path: "{{ servicenow_ca_path | default(omit, true) }}"
    timeout: "{{ servicenow_timeout }}"
  loop: "{{ _csr_check_in }}"
  loop_control:
    label: "{{ item.id }}"
  register: _cot_found
  check_mode: false             # only reads
  when: _sn_url | length > 0

- name: Certificate renewal | the CSR attached to one of them?
  ansible.builtin.uri:
    url: >-
      {{ _sn_url }}/api/now/attachment?sysparm_limit=20&sysparm_fields=file_name,table_sys_id&sysparm_query={{
      ('table_sys_idIN' ~ r.json.result | map(attribute='sys_id') | join(',') ~ '^file_nameSTARTSWITH' ~ r.item.prefix) | urlencode }}
    method: GET
    url_username: "{{ _sn_user }}"
    url_password: "{{ lookup('ansible.builtin.env', 'SN_PASSWORD') }}"
    force_basic_auth: true
    headers: {Accept: application/json}
    validate_certs: "{{ servicenow_validate_certs }}"
    ca_path: "{{ servicenow_ca_path | default(omit, true) }}"
    timeout: "{{ servicenow_timeout }}"
  loop: "{{ _cot_found.results | default([]) | selectattr('json.result', 'defined') | selectattr('json.result') | selectattr('item.csr') | list }}"
  loop_control:
    loop_var: r
    label: "{{ r.json.result[0].number }}: {{ r.item.prefix }}*"
  register: _cot_att
  check_mode: false             # only reads
  when: _sn_url | length > 0

- name: Certificate renewal | the tickets, and the CSRs already on them
  ansible.builtin.set_fact:
    # the open one (the newest, when there are several): where a new CSR goes
    cert_csr_tickets: >-
      {%- set out = {} -%}
      {%- for r in _cot_found.results | default([]) -%}
      {%-   set open = (r.json.result | default([])) | selectattr('active', 'in', ['true', true]) | list -%}
      {%-   if open -%}{%- set _ = out.update({r.item.id: open[0].number}) -%}{%- endif -%}
      {%- endfor -%}
      {{ out }}
    # the newest ticket with the CSR on it, open or not: the CSR is made
    cert_csr_on_ticket: >-
      {%- set out = {} -%}
      {%- for a in _cot_att.results | default([]) if a.json is defined -%}
      {%-   set on = (a.json.result | default([])) | map(attribute='table_sys_id') | list -%}
      {%-   for t in a.r.json.result if a.r.item.id not in out -%}
      {%-     set closed = '' if t.active | default('true') | string == 'true' else ', resolved since' -%}
      {%-     if t.sys_id in on -%}
      {%-       set f = (a.json.result | selectattr('table_sys_id', 'equalto', t.sys_id) | first).file_name -%}
      {%-       set _ = out.update({a.r.item.id: t.number ~ closed ~ ' (attached: ' ~ f ~ ')'}) -%}
      {%-     elif 'BEGIN CERTIFICATE REQUEST' in t.work_notes | default('') or 'certificate signing request (CSR) is attached' in t.work_notes | default('') -%}
      {%-       set _ = out.update({a.r.item.id: t.number ~ closed ~ ' (in a work note)'}) -%}
      {%-     endif -%}
      {%-   endfor -%}
      {%- endfor -%}
      {{ out }}
