---
# SERVICENOW - open, update (and optionally resolve) incidents from check findings, and check
# that ServiceNow itself (the instance and its MID Servers) is healthy. Uses the REST Table API
# with ansible.builtin.uri: no extra collection to install.
#
# Connection: the "ServiceNow API" AAP credential sets SN_HOST (https://<instance>), SN_USERNAME
# and SN_PASSWORD in the job's environment. Without it, nothing is sent: the job prints what it
# WOULD have opened (a safe way to try it out).

# Findings at or above this severity get a ticket: critical | warning. A ticket already open stays open
# while its finding is still there, even below this (the certificate renewal opens one for every CSR)
servicenow_min_severity: warning

servicenow_table: incident               # the table tickets are opened in (incident)
# Values for new incidents. Names work (the API is asked to accept display values), e.g.
# servicenow_assignment_group: Linux Operations
servicenow_assignment_group: ""
servicenow_caller: ""                    # user name; empty = the API account
servicenow_category: ""                  # e.g. Software
servicenow_urgency: {critical: "1", warning: "2"}  # a new ticket's urgency, per finding severity (your instance's values)
servicenow_impact: {critical: "2", warning: "3"}  # a new ticket's impact, per finding severity
servicenow_set_ci: true                  # set Configuration item = the host name (must exist in the CMDB)
# More fields for every new ticket - for an instance that makes fields such as Location, Subcategory
# or Channel mandatory: {column name: value}. Names and choice labels work, e.g.
#   servicenow_fields: {location: "Building 100", subcategory: "Operating System", contact_type: "Self-service"}
# A field's column name: right-click its label on the form > Show - '<column name>'.
servicenow_fields: {}

# When a problem that had a ticket is gone, add a work note (and, if you want, resolve it).
servicenow_note_cleared: true
servicenow_resolve_cleared: false        # true = also resolve the ticket (servicenow_resolved_state, servicenow_close_code)
servicenow_resolved_state: "6"           # Resolved
servicenow_close_code: "Solution provided"   # must be a close code your instance has
# More fields set when a ticket is resolved (servicenow_resolve_cleared, and the test ticket), for an
# instance that makes them mandatory: {column name: value}, e.g. {resolved_by: svc_aap_sn}
servicenow_resolve_fields: {}
# Add a work note to an open ticket each time its finding is seen again.
servicenow_note_repeats: true

# Every ticket from these playbooks carries a correlation ID starting with this, so the same
# problem on the same host always updates the same ticket.
servicenow_correlation_prefix: site-health

servicenow_validate_certs: true          # check the instance's HTTPS certificate (see servicenow_ca_path)
# A CA bundle (PEM) for the instance's TLS certificate, when the execution environment does not
# trust its CA (e.g. a DoD root CA): a path on the controller, such as a file you add to the
# project: servicenow_ca_path: "{{ playbook_dir }}/files/ca/servicenow-ca.pem". Empty = the
# execution environment's normal trust store. Prefer this over servicenow_validate_certs: false.
servicenow_ca_path: ""
servicenow_timeout: 30                   # seconds for one API request
# Fail the job when it opened/updated tickets, so the workflow shows red while problems exist.
servicenow_fail_when_findings: true

# servicenow_health.yml: also check the MID Servers (needs read access to the ecc_agent table)
servicenow_check_mid: true
servicenow_slow_seconds: 5               # the API answering slower than this -> warning

# ---- servicenow_availability.yml: is the instance there (every 5 to 15 minutes; roles/api_availability) ----
# Asked each run: the REST API (a read of servicenow_table with the "ServiceNow API" credential) and - with this - the
# login page (/login.do, no login: the instance's UI, or the single sign-on page it sends to). false = the API only.
servicenow_availability_ui: true

# ---- servicenow_health.yml: the MID Servers --------------------------------------------------
# What the instance says about each MID Server (ecc_agent): Up and validated, its heartbeat
# (last_refreshed) no older than servicenow_mid_stale_minutes, the same version on every MID Server,
# the ones you expect all there; its output queue (ecc_queue: work the instance handed it that it has
# not picked up) and its open MID Server Issues (ecc_agent_issue). A table the API account cannot read
# is said in the job's output, not counted as a problem.
servicenow_mid_names: []                 # only these MID Servers (names, * and ?); empty = every one
servicenow_mid_expected: []              # these must exist (names): one missing -> critical
servicenow_mid_stale_minutes: 15         # Up, but its heartbeat older than this -> critical (it reports every few minutes)
servicenow_mid_version_check: true       # MID Servers on different versions -> warning (one stuck in an upgrade)
servicenow_mid_queue_check: true         # read ecc_queue (the account needs read on it, e.g. the mid_server role)
servicenow_mid_queue_minutes: 10         # output waiting longer than this for its MID Server counts as stuck
servicenow_mid_queue_warn: 1             # this many stuck messages -> warning
servicenow_mid_queue_critical: 50        # ... this many -> critical
servicenow_mid_issues_check: true        # read the open MID Server Issues (ecc_agent_issue)
# The MID Server HOSTS (Windows, over WinRM), in the same job and report: the hosts of this group of the
# job's inventory - the Windows inventory, with its Machine (Windows) credential next to the ServiceNow
# API one. No such group (or false below): the instance's view only. Read-only. On each host: every MID
# Server service (servicenow_mid_service_match), running and set to start by itself; its agent folder
# (from the service), config.xml's name and instance URL (pointing at this instance?); the agent log
# written in the last servicenow_mid_log_stale_minutes, its SEVERE lines; the JVM restarts the wrapper
# log shows; the free space of the agent's drive.
servicenow_check_mid_hosts: true      # false = the instance's view only (no MID Server host is read)
servicenow_mid_hosts_group: servicenow_mid_hosts   # the inventory group of the MID Server hosts
servicenow_mid_service_match: "snc_mid*"          # service names (* and ?); the display name "ServiceNow MID Server*" matches too
servicenow_mid_hours: 24                          # how far back the logs are read for SEVERE lines and JVM restarts
servicenow_mid_log_stale_minutes: 30              # the agent log not written for this long while the service runs -> critical (hung)
servicenow_mid_severe_warn: 20                    # this many SEVERE lines in servicenow_mid_hours -> warning
servicenow_mid_jvm_restarts_warn: 1               # this many JVM restarts (crash, hang, out of memory) -> warning
servicenow_mid_disk_warn_pct: 10                  # free space of the agent's drive under this % -> warning
servicenow_mid_disk_critical_pct: 5               # ... under this % -> critical
servicenow_mid_url_check: true                    # config.xml's instance URL not this instance (a clone, a moved MID) -> critical

# ---- servicenow_health.yml: a self-hosted instance ----------------------------------------------
# The front-end (application) nodes, RHEL, over SSH with sudo (the Linux Machine credential): the hosts of this group.
# Read-only, on each: every node unit (snc_<env>.service) running and starting at boot; its stats page read on the
# node itself (http://127.0.0.1:<port>/xmlstats.do, else /stats.do) - JVM memory, semaphores in use and queued (read
# servicenow_node_stats_samples times, servicenow_node_stats_interval s apart: queued in every read = sustained),
# the scheduler's workers and queue, active transactions, uptime; its localhost log (SEVERE, OutOfMemory, semaphore
# errors in the last servicenow_node_log_hours, grouped by message); the install folder's disk and /'s, memory and
# swap. The instance's cluster view (sys_cluster_state) beside it. The database host: the hosts of
# servicenow_db_group - its disk and MariaDB (roles/check_mariadb, the "MariaDB monitor" credential). No such
# groups: as before. docs/SERVICENOW_SETUP.md, "Self-hosted instance".
# Which part this job reads (AAP gives a template one inventory and one Machine credential): all = both (an inventory with
# the MID Server hosts and the nodes); mids = the instance and its MID Servers (the Windows inventory); nodes = the nodes,
# the database host and the cluster, with the API (the Linux inventory) - under the check servicenow_node only, so the two
# templates never clear each other's tickets.
servicenow_health_part: all
servicenow_check_nodes: true                       # false = neither the nodes nor the database host is read
servicenow_nodes_group: servicenow_nodes           # the inventory group of the front-end nodes
# The front-end nodes this job reads (worked out by the role, not a setting): the hosts of servicenow_nodes_group; with that group
# missing or empty in the inventory (and servicenow_health_part nodes or all), the Limit's hosts - not localhost, not a
# MID Server or database host. The same rule is written out in playbooks/servicenow_health.yml's node play.
_servicenow_node_hosts: >-
  {{ groups[servicenow_nodes_group] | default([])
     if groups[servicenow_nodes_group] | default([]) | length > 0 or (servicenow_health_part | string | lower) == 'mids'
     else ((query('ansible.builtin.inventory_hostnames', ansible_limit) | reject('equalto', 'localhost')
            | reject('in', groups[servicenow_mid_hosts_group] | default([]))
            | reject('in', groups[servicenow_db_group] | default([])) | list)
           if ansible_limit | default('', true) | length > 0 else []) }}
servicenow_db_group: servicenow_db_hosts           # the inventory group of the database host(s) (a child of mariadb_hosts)
servicenow_check_db: auto                          # read the database host(s): auto = when the inventory has front-end nodes
                                                   # (an inventory with servicenow_db_hosts for its Health check only: not read here); true; false
servicenow_db_checks: [mariadb]                    # the checks on the database host (roles/check_<name>; e.g. add services)
servicenow_db_paths: [/database]                   # the database's folders: their filesystems reported, the data dir expected under one
servicenow_db_datadir: ""                          # the data dir on the host ("" = @@datadir as the server says; a container's: its path here)
servicenow_db_top_schemas: 5                       # the largest schemas listed
servicenow_db_top_tables: 10                       # the largest tables listed
# The database's size is kept on the database host, for its growth (change since the last run, per day, and when the
# disk fills): the one thing this job writes - a small JSON file, not in Check mode. false = no history, no growth.
servicenow_db_history: true
servicenow_db_history_file: /var/lib/site-health/servicenow-db-history.json  # on the database host, written by the job
servicenow_db_history_keep_days: 60                # sizes older than this many days are dropped from the history
servicenow_db_fill_warn_days: 30                   # at the database's growth, its filesystem full in fewer days -> warning
servicenow_db_fill_critical_days: 7                # ... -> critical
# The node units looked for: those installed are judged (a box runs one of them), those not installed are no finding;
# none of them on a host of the group -> critical. [] = every snc_*.service on the host. * and ? work.
servicenow_node_units: [snc_prod, snc_test, snc_dev]
servicenow_node_home: /glide                       # the install folder (nodes, logs, glide.properties)
servicenow_node_port: 0                            # the stats page's port: 0 = glide.servlet.port in the node's glide.properties,
                                                   # else from the unit; a number, or per unit {snc_prod: 16000, snc_test: 16001}
servicenow_node_stats: true                        # read each node's stats page
# Where: tried in turn until one answers with the numbers - https://<the node's own name>:<port>, http:// on it (its
# inventory name, then its FQDN), then 127.0.0.1 (http, https), then 127.0.0.1 with a name as the Host header (the
# node's, then the instance's); each /xmlstats.do then /stats.do. The instance's address (glide.servlet.uri) is never
# asked: a load balancer hands it to any node. The report says which address answered, per node.
# Or force one: "https://{fqdn}:{port}/stats.do" ({fqdn}: the node's full name, {host}: its inventory name, {port}).
servicenow_node_stats_url: ""
# A stats page that asks for a login (401 / 403, a redirect, a login page - or, with auto, the instance's normal web
# page in place of the numbers): auto = asked again with the ServiceNow API
# credential's login (basic auth) - sent only over HTTPS to the node's own name (its inventory name or FQDN), or to
# 127.0.0.1, never shown; basic = with it from the start; none = never. A redirect is never followed: the try fails
# and says where it pointed.
# form (1.32.0; never chosen by auto) = nodes behind single sign-on that answer stats.do only in a logged-in session:
# the check logs in through the instance's local login page on the node's own address (side_door.do, login.do), reads
# the stats page in that session and logs out (logout.do). Its own credential, "ServiceNow node stats login"
# (SN_STATS_USERNAME / SN_STATS_PASSWORD) - a dedicated local account that may only read stats.do, never the API
# account. One login per node address (node and port) per run - units on one port share the session; refused on the
# first node: not tried on the others. The login goes over HTTPS to the node's own name, or to 127.0.0.1 on the node,
# also over plain HTTP. The session's cookies stay in memory. docs/SERVICENOW_SETUP.md, "The node stats login".
servicenow_node_stats_auth: auto
# A friendly name per node, shown beside its host in the report ("Node 1 (node01.corp.example.mil)"): the host variable
# servicenow_node_label on the node ("Node 1"), or here by host: {node01.corp.example.mil: Node 1, node03: Node 3}
# (the inventory name, or its short name). The host variable wins.
servicenow_node_labels: {}
# Nodes AAP does not log in to (off by default): each node's own stats page, read from the AAP side - no SSH to them.
#   servicenow_node_stats_pages:
#     - {name: "Node 1", url: "https://node01.corp.example.mil:16000/stats.do"}
# The same numbers, samples and thresholds as a node read over SSH; a redirect is never followed; the login goes only
# over HTTPS and only to the listed host. The url is plain - https://host:port/page: one that carries a login, a "#",
# a backslash or a blank is refused. Such a node's unit, log, disk and fapolicyd are not read: its rows say
# "stats page only". An entry whose host is a node of servicenow_nodes_group is read once, over SSH (its name becomes
# that node's friendly name). An entry that does not answer is a finding that names it and what was tried.
servicenow_node_stats_pages: []
# Check the stats page's HTTPS certificate and name, with the node's own trust store. A node whose certificate is
# self-signed or from a CA the node does not trust is not read over HTTPS: add that CA to the node's trust store, or
# set this false (the page is still read over plain HTTP on 127.0.0.1).
servicenow_node_validate_certs: true
servicenow_node_stats_samples: 3                   # reads of the stats page ...
servicenow_node_stats_interval: 5                  # ... this many seconds apart
servicenow_node_stats_timeout: 10                  # seconds per read
servicenow_node_mem_warn_pct: 85                   # JVM memory used of its max -> warning
servicenow_node_mem_critical_pct: 95               # ... -> critical
servicenow_node_semaphore_queue_critical: 10       # transactions queued for a semaphore in every read: warning; this many -> critical
servicenow_node_scheduler_queue_warn: 50           # scheduled jobs waiting for a worker -> warning above this
servicenow_node_semaphore_wait_ms: 1000            # a slow transaction that waited this long for its semaphore is a semaphore problem
servicenow_node_slow_tx_warn: 200                  # slow transactions ("waited excessive time to run") in the log's hours -> warning
servicenow_node_log_hours: 24                      # how far back the node's localhost log is read
servicenow_node_log_glob: "localhost_log*"         # the log files in the node's logs folder
servicenow_node_log_groups: 10                     # the most frequent log messages listed
servicenow_node_severe_warn: 100                   # this many SEVERE lines in servicenow_node_log_hours -> warning
servicenow_node_disk_warn_pct: 85                  # the install folder's or /'s filesystem used -> warning
servicenow_node_disk_critical_pct: 95              # ... -> critical
servicenow_node_swap_warn_pct: 50                  # swap used -> warning
# fapolicyd on the nodes and the database host: active? (inactive: said, info - no finding), its denials since
# servicenow_fapolicyd_since by program and path (warning; a denial of the node's java or install folder, or of the
# database server or its data, critical)
servicenow_fapolicyd: true
servicenow_fapolicyd_since: today                  # ausearch -ts
servicenow_node_fapolicyd_critical: [java, "{{ servicenow_node_home }}"]   # programs (names) or folders
servicenow_db_fapolicyd_critical: [mariadbd, mysqld, "{{ servicenow_db_paths | first | default('/database') }}"]  # + the data dir
servicenow_cluster_check: auto                     # sys_cluster_state: auto = when the inventory has front-end nodes; true; false
servicenow_cluster_stale_minutes: 10               # a node online but its last heartbeat older than this -> critical

# servicenow_test_ticket.yml: resolve the test incident at the end (false = leave it open to look at)
servicenow_test_resolve: true

# ---- Certificate renewal: how each CSR goes to the PKI ----

# How the CSRs the certificate renewals make (Linux, Windows, VMware, network devices) go to the PKI.
# incident: each one is attached to its certificate's incident, with a work note saying what to do next - a
# person submits it to the PKI. catalog: each one is ordered from your PKI's catalog item
# (cert_renew_catalog_item) - one request per certificate, the CSR in the item's attachment question; no
# incident. Set the item's questions below: the "ServiceNow - catalog test" job lists them.
# docs/CERT_RENEWAL_CATALOG.md
cert_renew_servicenow: incident
# incident: a CSR on an incident of the certificate made in the last this-many days counts as made - also when that
# incident was resolved or closed since (the PKI may still be signing it): vCenter, ESXi and Cisco keep one pending
# key, and a second CSR would replace it. Older: a new CSR (the certificate is due again).
cert_renew_csr_memory_days: 90
# The catalog item: its name exactly as the catalog shows it (e.g. "DoD PKI Certificate Request"), or its sys_id.
cert_renew_catalog_item: ""
# The item's questions - by their internal names, as the catalog test lists them - and the answers:
# {name: answer}. A reference (Requested For, Location ...): the record's name, or its sys_id. A choice: its
# value or its label. In an answer, {host}, {subject}, {names}, {expires}, {issuer} and {where} become the
# certificate's. e.g. {requested_for: svc_aap_sn, preferred_contact: Email, location: "Building 100"}
cert_renew_catalog_variables: {}
# The attachment question that gets the CSR (its internal name). Empty = the item's only attachment question.
cert_renew_catalog_csr_variable: ""
# A question that gets the certificate's names (subjectAltName), e.g. a "List any additional SANs" box.
# Empty = none.
cert_renew_catalog_names_variable: ""
# A request closed in one of these states (a requested item's: 4 Closed Incomplete, 7 Closed Skipped -
# rejected or cancelled) is ordered again on the next run. In any other state - open, in progress, Closed
# Complete (the PKI issued it: install it) - the certificate is not ordered again.
cert_renew_catalog_reorder_states: ["4", "7"]
# Where the CSR is uploaded before the order, for the attachment question (ServiceNow moves it to the request).
cert_renew_catalog_upload_table: ZZ_YYsc_cart_item
# servicenow_catalog_test.yml: true = also order the item once, with a test CSR - the PKI gets a real request
# (tell them first, or cancel it). false = only read the item and check the settings.
servicenow_catalog_test_order: false

# ---- Certificate install: the issued certificate, from its request (cert_install_check.yml, win_cert_install_check.yml) ----
# The PKI puts the issued certificate on the request (RITM) that carries the CSR: attached to the RITM, to one of
# its attachment questions, to its REQ or to its catalog task (SCTASK) - one file or several, PEM, DER, PKCS7 (.p7b)
# or a zip of them - or pasted into a work note or comment of the RITM or its task. The job reads them all and takes the certificate whose public key is the CSR's;
# the CA certificates with it are its chain. Anything else there is listed, never used.
cert_install_attachment_exts: [cer, crt, pem, der, p7b, p7c, p7, cert, zip, txt]   # the attachments read (their extension)
cert_install_max_bytes: 1048576          # a bigger attachment is not read
cert_install_journal: true               # also look for a certificate pasted into the request's work notes and comments
cert_install_min_days: 30                # the issued certificate must be valid at least this many more days (else held for a person)
cert_install_fewer_names: false          # true = install a certificate that lacks names (subjectAltName) the old one had; false = held for a person
# Linux and Windows: the request(s) to install from, named (the check templates' survey) - "RITM0012345", several with
# commas, or a list. Empty (the default) = each renewal's own catalog request, found by its CSR (cert_renew_servicenow:
# catalog). Named: only these requests are read, however they were opened - by hand, with the renewal's CSR pasted
# into the PKI's form, or after an incident - and the certificate there whose public key is a renewal's CSR (its key
# waits on the host since the renewal) is installed after the approval, as always. A renewal it has no certificate
# for is left waiting, counted in one line. (VMware: vmware_cert_install_ritm.)
cert_install_ritm: ""
# A CA bundle in YOUR repository that completes the chain when the PKI sends back only the .cer - e.g. the DoD PKI's
# PKCS7 bundle from cyber.mil: files/dod_pki_bundle.p7b (playbooks/files/; the .p7b, DER or PEM, a .pem, or the zip as
# downloaded). Only the CAs that signed the certificate are taken from it - its issuing CA and that CA's root, each
# checked by its signature, none expired; a chain on the request comes first. Linux, Windows and VMware installs.
# Empty = the chain only from the request. Keeping it current: the job "PKI - DoD bundle check" (docs/CERT_INSTALL.md).
cert_install_ca_bundle: ""
