---
# SERVICENOW - open, update (and optionally resolve) incidents from check findings, and check
# that ServiceNow itself (the instance and its MID Servers) is healthy. Uses the REST Table API
# with ansible.builtin.uri: no extra collection to install.
#
# Connection: the "ServiceNow API" AAP credential sets SN_HOST (https://<instance>), SN_USERNAME
# and SN_PASSWORD in the job's environment. Without it, nothing is sent: the job prints what it
# WOULD have opened (a safe way to try it out).

# Findings at or above this severity get a ticket: critical | warning. A ticket already open stays open
# while its finding is still there, even below this (the certificate renewal opens one for every CSR)
servicenow_min_severity: warning

servicenow_table: incident               # the table tickets are opened in (incident)
# Values for new incidents. Names work (the API is asked to accept display values), e.g.
# servicenow_assignment_group: Linux Operations
servicenow_assignment_group: ""
servicenow_caller: ""                    # user name; empty = the API account
servicenow_category: ""                  # e.g. Software
servicenow_urgency: {critical: "1", warning: "2"}  # a new ticket's urgency, per finding severity (your instance's values)
servicenow_impact: {critical: "2", warning: "3"}  # a new ticket's impact, per finding severity
servicenow_set_ci: true                  # set Configuration item = the host name (must exist in the CMDB)
# More fields for every new ticket - for an instance that makes fields such as Location, Subcategory
# or Channel mandatory: {column name: value}. Names and choice labels work, e.g.
#   servicenow_fields: {location: "Building 100", subcategory: "Operating System", contact_type: "Self-service"}
# A field's column name: right-click its label on the form > Show - '<column name>'.
servicenow_fields: {}

# When a problem that had a ticket is gone, add a work note (and, if you want, resolve it).
servicenow_note_cleared: true
servicenow_resolve_cleared: false        # true = also resolve the ticket (servicenow_resolved_state, servicenow_close_code)
servicenow_resolved_state: "6"           # Resolved
servicenow_close_code: "Solution provided"   # must be a close code your instance has
# More fields set when a ticket is resolved (servicenow_resolve_cleared, and the test ticket), for an
# instance that makes them mandatory: {column name: value}, e.g. {resolved_by: svc_aap_sn}
servicenow_resolve_fields: {}
# Add a work note to an open ticket each time its finding is seen again.
servicenow_note_repeats: true

# Every ticket from these playbooks carries a correlation ID starting with this, so the same
# problem on the same host always updates the same ticket.
servicenow_correlation_prefix: site-health

servicenow_validate_certs: true          # check the instance's HTTPS certificate (see servicenow_ca_path)
# A CA bundle (PEM) for the instance's TLS certificate, when the execution environment does not
# trust its CA (e.g. a DoD root CA): a path on the controller, such as a file you add to the
# project: servicenow_ca_path: "{{ playbook_dir }}/files/ca/servicenow-ca.pem". Empty = the
# execution environment's normal trust store. Prefer this over servicenow_validate_certs: false.
servicenow_ca_path: ""
servicenow_timeout: 30                   # seconds for one API request
# Fail the job when it opened/updated tickets, so the workflow shows red while problems exist.
servicenow_fail_when_findings: true

# servicenow_health.yml: also check the MID Servers (needs read access to the ecc_agent table)
servicenow_check_mid: true
servicenow_slow_seconds: 5               # the API answering slower than this -> warning

# ---- servicenow_health.yml: the MID Servers --------------------------------------------------
# What the instance says about each MID Server (ecc_agent): Up and validated, its heartbeat
# (last_refreshed) no older than servicenow_mid_stale_minutes, the same version on every MID Server,
# the ones you expect all there; its output queue (ecc_queue: work the instance handed it that it has
# not picked up) and its open MID Server Issues (ecc_agent_issue). A table the API account cannot read
# is said in the job's output, not counted as a problem.
servicenow_mid_names: []                 # only these MID Servers (names, * and ?); empty = every one
servicenow_mid_expected: []              # these must exist (names): one missing -> critical
servicenow_mid_stale_minutes: 15         # Up, but its heartbeat older than this -> critical (it reports every few minutes)
servicenow_mid_version_check: true       # MID Servers on different versions -> warning (one stuck in an upgrade)
servicenow_mid_queue_check: true         # read ecc_queue (the account needs read on it, e.g. the mid_server role)
servicenow_mid_queue_minutes: 10         # output waiting longer than this for its MID Server counts as stuck
servicenow_mid_queue_warn: 1             # this many stuck messages -> warning
servicenow_mid_queue_critical: 50        # ... this many -> critical
servicenow_mid_issues_check: true        # read the open MID Server Issues (ecc_agent_issue)
# The MID Server HOSTS (Windows, over WinRM), in the same job and report: the hosts of this group of the
# job's inventory - the Windows inventory, with its Machine (Windows) credential next to the ServiceNow
# API one. No such group (or false below): the instance's view only. Read-only. On each host: every MID
# Server service (servicenow_mid_service_match), running and set to start by itself; its agent folder
# (from the service), config.xml's name and instance URL (pointing at this instance?); the agent log
# written in the last servicenow_mid_log_stale_minutes, its SEVERE lines; the JVM restarts the wrapper
# log shows; the free space of the agent's drive.
servicenow_check_mid_hosts: true      # false = the instance's view only (no MID Server host is read)
servicenow_mid_hosts_group: servicenow_mid_hosts   # the inventory group of the MID Server hosts
servicenow_mid_service_match: "snc_mid*"          # service names (* and ?); the display name "ServiceNow MID Server*" matches too
servicenow_mid_hours: 24                          # how far back the logs are read for SEVERE lines and JVM restarts
servicenow_mid_log_stale_minutes: 30              # the agent log not written for this long while the service runs -> critical (hung)
servicenow_mid_severe_warn: 20                    # this many SEVERE lines in servicenow_mid_hours -> warning
servicenow_mid_jvm_restarts_warn: 1               # this many JVM restarts (crash, hang, out of memory) -> warning
servicenow_mid_disk_warn_pct: 10                  # free space of the agent's drive under this % -> warning
servicenow_mid_disk_critical_pct: 5               # ... under this % -> critical
servicenow_mid_url_check: true                    # config.xml's instance URL not this instance (a clone, a moved MID) -> critical

# servicenow_test_ticket.yml: resolve the test incident at the end (false = leave it open to look at)
servicenow_test_resolve: true

# ---- Certificate renewal: how each CSR goes to the PKI ----

# How the CSRs the certificate renewals make (Linux, Windows, VMware, network devices) go to the PKI.
# incident: each one is attached to its certificate's incident, with a work note saying what to do next - a
# person submits it to the PKI. catalog: each one is ordered from your PKI's catalog item
# (cert_renew_catalog_item) - one request per certificate, the CSR in the item's attachment question; no
# incident. Set the item's questions below: the "ServiceNow - catalog test" job lists them.
# docs/CERT_RENEWAL_CATALOG.md
cert_renew_servicenow: incident
# incident: a CSR on an incident of the certificate made in the last this-many days counts as made - also when that
# incident was resolved or closed since (the PKI may still be signing it): vCenter, ESXi and Cisco keep one pending
# key, and a second CSR would replace it. Older: a new CSR (the certificate is due again).
cert_renew_csr_memory_days: 90
# The catalog item: its name exactly as the catalog shows it (e.g. "DoD PKI Certificate Request"), or its sys_id.
cert_renew_catalog_item: ""
# The item's questions - by their internal names, as the catalog test lists them - and the answers:
# {name: answer}. A reference (Requested For, Location ...): the record's name, or its sys_id. A choice: its
# value or its label. In an answer, {host}, {subject}, {names}, {expires}, {issuer} and {where} become the
# certificate's. e.g. {requested_for: svc_aap_sn, preferred_contact: Email, location: "Building 100"}
cert_renew_catalog_variables: {}
# The attachment question that gets the CSR (its internal name). Empty = the item's only attachment question.
cert_renew_catalog_csr_variable: ""
# A question that gets the certificate's names (subjectAltName), e.g. a "List any additional SANs" box.
# Empty = none.
cert_renew_catalog_names_variable: ""
# A request closed in one of these states (a requested item's: 4 Closed Incomplete, 7 Closed Skipped -
# rejected or cancelled) is ordered again on the next run. In any other state - open, in progress, Closed
# Complete (the PKI issued it: install it) - the certificate is not ordered again.
cert_renew_catalog_reorder_states: ["4", "7"]
# Where the CSR is uploaded before the order, for the attachment question (ServiceNow moves it to the request).
cert_renew_catalog_upload_table: ZZ_YYsc_cart_item
# servicenow_catalog_test.yml: true = also order the item once, with a test CSR - the PKI gets a real request
# (tell them first, or cancel it). false = only read the item and check the settings.
servicenow_catalog_test_order: false

# ---- Certificate install: the issued certificate, from its request (cert_install_check.yml, win_cert_install_check.yml) ----
# The PKI puts the issued certificate on the request (RITM) that carries the CSR: attached to the RITM, to one of
# its attachment questions, to its REQ or to its catalog task (SCTASK) - one file or several, PEM, DER, PKCS7 (.p7b)
# or a zip of them - or pasted into a work note or comment of the RITM or its task. The job reads them all and takes the certificate whose public key is the CSR's;
# the CA certificates with it are its chain. Anything else there is listed, never used.
cert_install_attachment_exts: [cer, crt, pem, der, p7b, p7c, p7, cert, zip, txt]   # the attachments read (their extension)
cert_install_max_bytes: 1048576          # a bigger attachment is not read
cert_install_journal: true               # also look for a certificate pasted into the request's work notes and comments
cert_install_min_days: 30                # the issued certificate must be valid at least this many more days (else held for a person)
cert_install_fewer_names: false          # true = install a certificate that lacks names (subjectAltName) the old one had; false = held for a person
