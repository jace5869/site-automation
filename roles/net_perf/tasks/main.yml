---
# NETWORK PERFORMANCE, one host (playbooks/net_perf_report.yml): the OCSP requests are made once on the AAP side, each
# host measures (library/site_net_perf.py) and keeps its own history, the measurements are judged on the AAP side
# (plugins/filter/net_perf_filters.py) -> net_perf_result and this host's findings (netperf:*).

- name: Network performance | the OCSP requests (made once, on the AAP side)
  ansible.builtin.set_fact:
    _np_ocsp: >-
      {#- net_perf_ocsp, else site_ocsp_certs; a url or issuer left out is read from the certificate (plugins/filter/ocsp_filters.py) -#}
      {%- set out = [] -%}
      {%- for x in (net_perf_ocsp or site_ocsp_certs | map('ocsp_cert_entry') | list) -%}
      {%-   set c = (lookup('ansible.builtin.file', x.cert, errors='ignore') | default('', true)) if x.cert | default('') else '' -%}
      {%-   set i = (lookup('ansible.builtin.file', x.issuer, errors='ignore') | default('', true)) if x.issuer | default('') else '' -%}
      {%-   set miss = ([x.cert] if x.cert | default('') and not c else []) + ([x.issuer] if x.issuer | default('') and not i else []) -%}
      {%-   set t = {'name': x.name | default(''), 'url': x.url | default(''), 'cert': c, 'issuer': i,
                     'why': ('not found in the project: ' ~ miss | join(', ') ~ ' - put it in playbooks/ (e.g. playbooks/files/ocsp/), '
                             ~ 'commit it (git add -f when .gitignore leaves it out), push and sync the project') if miss else ''}
                    | ocsp_target(net_perf_timeout | int * 3) -%}
      {%-   set _ = out.append({'name': t.name or t.url or x.cert | default(''), 'url': t.url, 'why': t.why, 'serial': t.serial | default(''),
                                'mode': 'request' if t.cert and t.issuer else 'probe',
                                'request': ('' | ocsp_request_b64) if not t.cert else (t.cert | ocsp_request_b64(t.issuer)) if t.issuer and not t.why else ''}) -%}
      {%- endfor -%}
      {{ out }}
  run_once: true

- name: Network performance | measure from this host (ping, TCP, OCSP, interfaces) and keep the run
  site_net_perf:
    targets: "{{ net_perf_targets + net_perf_targets_extra }}"
    ping_count: "{{ net_perf_ping_count | int }}"
    ping_interval: "{{ net_perf_ping_interval | float }}"
    tcp_tries: "{{ net_perf_tcp_tries | int }}"
    timeout: "{{ net_perf_timeout | int }}"
    ocsp: "{{ _np_ocsp }}"
    nics: "{{ net_perf_nics | bool }}"
    nic_exclude: "{{ net_perf_nic_exclude }}"
    sysfs: "{{ net_perf_sysfs }}"
    dir: "{{ net_perf_dir }}"
    keep: "{{ net_perf_keep | int }}"
    save: "{{ not ansible_check_mode }}"   # a dry run measures and keeps nothing
  register: _np_raw
  check_mode: false                       # only measures

# one dict expression: on ansible-core 2.16 the values of a YAML dict would arrive as strings
- name: Network performance | judged (thresholds, the host's usual, the OCSP answers)
  ansible.builtin.set_fact:
    net_perf_result: >-
      {{ _np_raw | net_perf_result(inventory_hostname,
           {'rtt_warn_ms': net_perf_rtt_warn_ms, 'rtt_crit_ms': net_perf_rtt_crit_ms, 'loss_warn_pct': net_perf_loss_warn_pct,
            'loss_crit_pct': net_perf_loss_crit_pct, 'slower_factor': net_perf_slower_factor, 'slower_min_ms': net_perf_slower_min_ms,
            'drops_warn_per_hour': net_perf_drops_warn_per_hour, 'errors_warn_per_hour': net_perf_errors_warn_per_hour,
            'ocsp_warn_ms': net_perf_ocsp_warn_ms, 'ocsp_severity': net_perf_ocsp_severity, 'now': _np_now | default('')},
           net_perf_targets + net_perf_targets_extra) }}

- name: Network performance | add them to this host's findings
  ansible.builtin.set_fact:
    site_findings: "{{ site_findings | default([]) + net_perf_result.findings }}"
