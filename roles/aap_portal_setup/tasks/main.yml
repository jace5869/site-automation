---
# The site portal's job templates and workflows, in AAP (library/site_aap_portal_setup.py). Runs on localhost with the
# "Red Hat Ansible Automation Platform" credential's variables. A Check run only reads.
- name: Portal setup | what to set up (workflows.yml, actions.yml)
  ansible.builtin.set_fact:
    _ps_spec_base: >-
      {{ portal_setup_workflows if portal_setup_workflows | length > 0
         else lookup('ansible.builtin.file', role_path ~ '/../site_portal_stack/files/workflows.yml') | from_yaml }}
    _ps_actions_base: >-
      {{ portal_actions if portal_actions | default({}) | length > 0
         else (lookup('ansible.builtin.file', role_path ~ '/../site_portal_stack/files/actions.yml') | from_yaml).actions | default({}, true) }}

- name: Portal setup | your own actions, templates and workflows (1.75.3)
  ansible.builtin.set_fact:
    _ps_amerge: "{{ _ps_actions_base | site_portal_actions_merge(portal_actions_extra | default({}), portal_actions_off | default([]), portal_aap_names | default({})) }}"
    _ps_smerge: "{{ _ps_spec_base | site_portal_spec_merge(portal_setup_templates_extra, portal_setup_workflows_extra) }}"

- name: Portal setup | the merges are right
  ansible.builtin.assert:
    that: (_ps_amerge.problems + _ps_smerge.problems) | length == 0
    fail_msg: "Nothing was changed: {{ (_ps_amerge.problems + _ps_smerge.problems) | join(' | ') }}"
    quiet: true

- name: Portal setup | what to set up, merged
  ansible.builtin.set_fact:
    _ps_spec: "{{ _ps_smerge.spec }}"
    _ps_actions: "{{ _ps_amerge.actions }}"

- name: Portal setup | the project is named
  ansible.builtin.assert:
    that: portal_setup_project | length > 0 and portal_setup_inventories.default | default('') | length > 0
    fail_msg: >-
      Set portal_setup_project (your site-automation project in AAP) and portal_setup_inventories.default (the inventory
      the templates run on - portal_inventory by default). docs/SITE_PORTAL.md, "Setting it up in AAP".
    quiet: true

- name: Portal setup | the fingerprints the last run handed on (this template's job artifact aap_setup_fingerprints, from AAP)
  ansible.builtin.include_role:
    name: site_email
    tasks_from: history_artifacts.yml
  vars:
    _hist_artifacts: [aap_setup_fingerprints]
    _hist_runs: 10

# 1.93.0: the newest successful run that handed a map on (a Check run does not). None: a first run, or its history purged -
# a description is then compared with the text this job would write.
- name: Portal setup | the newest of them
  ansible.builtin.set_fact:
    _ps_known: >-
      {{ (_site_hist_runs | default([]) | selectattr('status', 'equalto', 'successful') | selectattr('artifacts', 'defined')
          | selectattr('artifacts.aap_setup_fingerprints', 'defined') | list | last | default({'artifacts': {}})).artifacts.aap_setup_fingerprints
         | default(none) }}

- name: Portal setup | the templates and workflows, in AAP
  site_aap_portal_setup:
    spec: "{{ _ps_spec }}"
    actions: "{{ _ps_actions }}"
    organization: "{{ portal_setup_organization }}"
    project: "{{ portal_setup_project }}"
    execution_environment: "{{ portal_setup_execution_environment }}"
    inventories: "{{ portal_setup_inventories | dict2items | selectattr('value') | items2dict }}"
    credentials: "{{ portal_setup_credentials }}"
    portal_user: "{{ portal_setup_portal_user }}"
    portal_auditor: "{{ portal_setup_portal_auditor | bool }}"
    overwrite: "{{ portal_setup_overwrite | bool }}"
    schedules: "{{ portal_setup_schedules }}"
    scorecard:
      name: "{{ portal_setup_scorecard_template }}"
      schedule: "{{ portal_setup_scorecard_schedule }}"
      schedule_name: "{{ portal_setup_scorecard_schedule_name }}"
      time_zone: "{{ report_time_zone | default('') }}"
      split: "{{ portal_setup_split_scorecard | bool }}"
    publish: "{{ portal_publish_templates }}"
    publish_area: "{{ portal_publish_area }}"
    unpublish: "{{ portal_unpublish_templates }}"
    publish_label: "{{ portal_label | default('portal', true) }}"
    area_label: "{{ portal_label_area | default('portal-area:', true) }}"
    publish_max: "{{ portal_publish_max | int }}"
    publish_organization: "{{ portal_publish_organization | default('') | string }}"
    # 1.79.11: the catalog's five lines on its templates and workflows (aap/job_templates.yml, by name); the Contact line
    # from aap_templates_description_owner / _contact
    known: "{{ _ps_known }}"
    describe: >-
      {%- set c = lookup('ansible.builtin.file', role_path ~ '/../../aap/job_templates.yml') | from_yaml -%}
      {{ {'job': c.job_templates | selectattr('description', 'defined') | items2dict(key_name='name', value_name='description'),
          'workflow': c.workflows | default([]) | items2dict(key_name='name', value_name='description'),
          'owner': aap_templates_description_owner | default('') | string,
          'contact': aap_templates_description_contact | default('') | string} if portal_setup_describe | default(true) | bool else {} }}
    ca_path: "{{ portal_setup_aap_ca_path }}"
  register: _ps

# 1.93.0: what this job wrote, handed on as a job artifact for its next run (never in a description). A Check run hands on nothing.
- name: Portal setup | the fingerprints, for the next run (job artifact aap_setup_fingerprints)
  ansible.builtin.set_stats:
    data:
      aap_setup_fingerprints: "{{ _ps.fingerprints | default({}) }}"
  when: not ansible_check_mode

- name: Portal setup | what was done
  ansible.builtin.debug:
    msg: >-
      {%- set out = [] -%}
      {%- for r in _ps.results -%}
      {%-   set own = r.kind in ['label', 'publish grant', 'publish', 'unpublish'] -%}
      {%-   set verb = {'create': ('would label' if r.kind == 'label' else 'would grant' if r.kind == 'publish grant' else 'would be made') if ansible_check_mode
                                  else ('labelled' if r.kind == 'label' else 'granted' if r.kind == 'publish grant' else 'made'),
                        'remove': 'would remove the label' if ansible_check_mode else 'label removed',
                        'update': 'would be changed' if ansible_check_mode else 'changed',
                        'unchanged': ('already done' if own else 'as it should be') if not r.why or own else 'left', 'hand-edited': 'CHANGED BY HAND - left as it is', 'not ours': 'NOT MADE BY THIS JOB - left as it is',
                        'info': 'applies', 'skipped': 'skipped', 'failed': 'FAILED'}.get(r.action, r.action) -%}
      {%-   set _ = out.append(r.kind ~ " '" ~ r.name ~ "': " ~ verb ~ ((' - ' ~ r.why) if r.why else '')) -%}
      {%-   for f, v in r.diff | dictsort -%}
      {%-     set _ = out.append('    ' ~ f ~ ': ' ~ (v[0] | string | truncate(80)) ~ ' -> ' ~ (v[1] | string | truncate(80))) -%}
      {%-   endfor -%}
      {%- endfor -%}
      {{ out or ['nothing in workflows.yml'] }}

- name: Portal setup | AAP could not be read, or a name matches nothing - nothing more was changed
  ansible.builtin.fail:
    msg: "{{ _ps.problems }}"
  when: _ps.problems | length > 0

- name: Portal setup | something was left as it is or could not be set up
  ansible.builtin.debug:
    msg: >-
      {{ _ps.results | selectattr('action', 'in', ['hand-edited', 'not ours', 'skipped', 'failed']) | map(attribute='name') | list }}:
      see what was done, above. portal_setup_overwrite: true writes over what was changed by hand.
  when: _ps.results | selectattr('action', 'in', ['hand-edited', 'not ours', 'skipped', 'failed']) | list | length > 0
