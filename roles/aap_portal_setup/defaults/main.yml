---
# ---- AAP - set up portal actions (1.67.0 part C; playbooks/aap_portal_setup.yml, docs/SITE_PORTAL.md "Setting it up in AAP")
# Makes or brings up to date, through AAP's API, the job templates and workflows the site portal's actions launch -
# roles/site_portal_stack/files/workflows.yml - and gives the portal's account Execute on them (Approve on a workflow with
# an approval node). Never deletes. A template or workflow changed by hand since this job wrote it, or one of that name it
# did not make, is listed and left as it is. Run it with Check first: it then only reads and says, field by field, what
# it would change. The "Red Hat Ansible Automation Platform" credential's user needs Admin on the organization (or the
# roles to make job templates and workflows in it, and to give roles on them).

portal_setup_organization: Default              # the organization the templates and workflows are made in
portal_setup_project: ""                         # the project the job templates run from: your site-automation project (required)
portal_setup_execution_environment: ""           # the job templates' execution environment ("" = the project's default)
# the inventories by key: default (required) and, for the Windows templates, windows ("" or left out = default)
portal_setup_inventories:
  default: "{{ portal_inventory | default('') }}"
# the AAP credential of each kind workflows.yml names: machine, machine_windows, aap, act_model_key, stigman_api,
# stigman_api_writer, windows_share ... A template with a kind not named here is skipped, said.
portal_setup_credentials: {}
portal_setup_portal_user: ""                     # the portal's AAP account (its user name): Execute and Approve on these; "" = no roles given
portal_setup_overwrite: false                    # true = also bring up to date what was made or changed by hand (never deletes)
# 1.79.11: the templates and workflows get the catalog's five-line descriptions (aap/job_templates.yml; Contact from
# aap_templates_description_owner / _contact) - false = workflows.yml's one line, as before
portal_setup_describe: true
# schedules on templates or workflows of workflows.yml, e.g. the checklist import every 15 minutes:
#   [{name: "Checklists every 15 minutes", target: "Checklists imported into STIG Manager", every_minutes: 15}]
portal_setup_schedules: []
# 1.68.1 the STIG scorecard, so it is not set up by hand: a job template of its own (workflow 40's check template copied -
# project, inventory, execution environment, credentials and Variables - with stigman_ckl_import_mode: scorecard) and a
# weekly schedule. Each is made once; one that is there is left as it is. "" = none.
portal_setup_scorecard_template: "STIG - weekly scorecard"
portal_setup_scorecard_schedule: "weekly Mon 06:00"      # 'weekly Mon 06:00' or 'daily 06:00', in report_time_zone ("" = UTC); "" = no schedule
portal_setup_scorecard_schedule_name: "Weekly - STIG scorecard"   # the schedule's name on that template
# true: workflow 40's check template gets stigman_ckl_import_mode: import (it only imports; the scorecard has its own template)
# when its mode is not set or is "import and scorecard"; any other value there stays as it is, said
portal_setup_split_scorecard: true
# 1.75.3: your own templates and workflows, added to workflows.yml's lists (same shape; a name or a workflow number that is already there is
# an error): the AAP side of an action of your own (portal_actions_extra). docs/SITE_PORTAL.md, "Adding your own action".
portal_setup_templates_extra: []                  # your own job templates, added to workflows.yml's (the same shape; a name already there is an error)
portal_setup_workflows_extra: []                  # your own workflows, added to workflows.yml's (the same shape; a name or a number already there is an error)
# 1.75.3: true = also give the portal's account (portal_setup_portal_user) Auditor on portal_setup_organization, which it needs to read the
# report jobs' findings ("pick a host, then a finding"). Organization Auditor reads everything in the organization and writes nothing; the
# credential's user needs Admin on the organization to give it. false (the default) = you give it in AAP yourself. Never a write role.
portal_setup_portal_auditor: false
portal_setup_workflows: {}                       # {} = roles/site_portal_stack/files/workflows.yml; the same shape here replaces it
portal_setup_aap_ca_path: "{{ report_history_aap_ca_path | default('') }}"   # a CA file for AAP's own HTTPS certificate
# 1.78.1: put your own job templates and workflows on the portal in one go, by name. Patterns (* and ?, any case) of AAP names: each match gets
# the label portal_label and Execute for portal_setup_portal_user. Run with Check first: it says would label / would grant / already done /
# skipped. Nothing is ever removed by this; a pattern that matches nothing is said; one that matches more than portal_publish_max stops with
# the list and changes nothing. The credential needs Admin on the templates' organization, as for the rest of this job.
# Set these in the Variables of AAP - set up portal actions, not of Site portal - deploy (the deploy does not apply them).
portal_publish_templates: []                      # e.g. ["Site - health *", "Weekly cleanup"]
portal_publish_area: {}                           # {pattern: area}: also the label portal-area:<area> (e.g. {"Site - health *": "Health"})
portal_publish_organization: ""                   # an organization's name: only its templates and workflows are matched (with ["*"]: all of them); "" = any
portal_publish_max: 50                            # the most one pattern may match
# Take templates off the portal again (the label only; the roles stay and nothing is deleted): the same shape.
portal_unpublish_templates: []
