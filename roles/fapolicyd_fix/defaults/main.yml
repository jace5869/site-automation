---
# FAPOLICYD - GETTING IT RUNNING (a part of playbooks/fapolicyd.yml, roles/fapolicyd; docs/RUNBOOKS.md "fapolicyd"):
# why fapolicyd is down, or near its limits, on each host - trust files it cannot read, their SELinux labels,
# db_max_size too small for the trust database, not enabled at boot, not running (it starts permissive) - the fix for
# each as a line to approve; and, once approved, those fixes made.
# roles/fapolicyd sets these three from its own: fapolicyd_approved, fapolicyd_dir, fapolicyd_wait
fapolicyd_fix_approved: []                # set by roles/fapolicyd: the fix lines of fapolicyd_approved
fapolicyd_fix_dir: /etc/fapolicyd         # set by roles/fapolicyd: fapolicyd_dir
fapolicyd_fix_binary: /usr/sbin/fapolicyd # read to see whether this fapolicyd sizes its database itself (db_max_size = auto)
# The trust files' owner, group and modes come from the fapolicyd package (rpm); these only when rpm gives none.
fapolicyd_fix_owner: root                 # the trust files' owner, when rpm gives none
fapolicyd_fix_group: fapolicyd            # their group, when rpm gives none
fapolicyd_fix_file_mode: "0644"           # a trust file's mode, when rpm gives none
fapolicyd_fix_dir_mode: "0750"            # the folders' mode, when rpm gives none
fapolicyd_fix_large_mb: 20                # a trust file larger than this (MB) is listed for a person: every file in it is trusted
fapolicyd_fix_headroom: 1.5               # the proposed db_max_size: the estimate times this (where auto is not possible)
fapolicyd_fix_journal_lines: 400          # fapolicyd's journal lines read, this boot
fapolicyd_fix_wait: 30                    # roles/fapolicyd sets it from fapolicyd_wait
fapolicyd_fix_timeout: 120                # seconds for each command the job reads with
