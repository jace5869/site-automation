---
# ---- ACT - triage finding (1.67.0, workflow 44) -----------------------------------------------------------------
# One finding of an earlier health or fapolicyd job (the site portal's "Ask ACT"): read back from that job's
# site_findings artifact (roles/finding_ref), more evidence read on the host (read only), ACT's answer in evidence mode
# (ACT runs no command), a report
# and the job artifact act_triage_finding. Never applies a fix. docs/SITE_PORTAL.md, "AAP workflows".

# Which findings this template looks at: linux (fapolicyd findings, the Linux machine credential) or windows (event-log
# findings, the Windows machine credential). Set it on the template's Variables; workflow 44 runs both templates and
# each passes over the other's findings without connecting.
portal_triage_os: linux
# Run the finding's own look command (the hint its check wrote: read only) on the host too. false = the fixed reads only.
portal_triage_hint: true
portal_triage_command_timeout: 120         # seconds for each read on the host
portal_triage_max_chars: 6000              # characters of each command's output given to ACT
portal_triage_report_chars: 1500           # characters of each command's output shown in the report
portal_triage_act_model_timeout: "{{ site_act_model_timeout | default(180) }}"   # seconds for ACT's answer
