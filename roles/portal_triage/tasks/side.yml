---
# On the AAP side, once: ACT reads the finding and what was read on the host (evidence mode: ACT runs no command and
# changes nothing), then the report (printed, emailed with report_email_to, published with report_web_dest) and the
# job artifact act_triage_finding. A fix ACT proposes is never applied here: that is a separate, approved job.
- name: Triage | ACT reads the finding and the evidence - evidence mode, ACT runs no command
  ansible.builtin.include_role:
    name: site_act
    tasks_from: evidence_analysis.yml
    public: true
  vars:
    _ea_items: [{id: F1}]
    _ea_evidence: >-
      {{ portal_finding | portal_triage_evidence(portal_triage_outputs | default([]),
           {'host': inventory_hostname, 'job': portal_finding_job.id, 'max_chars': portal_triage_max_chars | int}) }}
    _ea_task: >-
      {{ portal_finding | portal_triage_task({'host': inventory_hostname, 'extra': site_act_extra_instructions | default('')}) }}
    _ea_names: ["{{ inventory_hostname }}"]
    _ea_model_timeout: "{{ portal_triage_act_model_timeout }}"

- name: Triage | the report
  ansible.builtin.set_fact:
    _pt_doc: >-
      {{ portal_finding | portal_triage_report(_ea_parsed, {
           'host': inventory_hostname, 'job': portal_finding_job, 'requested_by': portal_request.requested_by,
           'ran': _ea_ran | bool, 'reason': _ea_reason, 'raw': _ea_raw, 'provider': site_act_provider | default(''),
           'model': _ea_model, 'outputs': portal_triage_outputs | default([]), 'max_out': portal_triage_report_chars | int}) }}

- name: Triage | {{ _pt_doc.title }}
  ansible.builtin.debug:
    msg: "{{ (_pt_doc | report_text).splitlines() }}"

- name: Triage | ACT's answer as the job artifact act_triage_finding
  ansible.builtin.set_stats:
    data:
      act_triage_finding:
        host: "{{ inventory_hostname }}"
        finding: "{{ portal_finding }}"
        report_job: "{{ portal_finding_job }}"
        requested_by: "{{ portal_request.requested_by }}"
        act: >-
          {{ {'ran': _ea_ran | bool, 'reason': '' if _ea_ran | bool else _ea_reason, 'model': _ea_model,
              'overall': _ea_parsed.overall | default(''), 'answer': (_ea_parsed.by_id | default({})).F1 | default({})} }}
        evidence: "{{ portal_triage_outputs | default([]) }}"
    per_host: false

- name: Triage | email it, publish it (report_email_to, report_web_dest)
  ansible.builtin.include_role:
    name: site_email
  vars:
    _report: "{{ _pt_doc }}"
  when: report_email_to | default([]) | length > 0 or report_email_also | default([]) | length > 0 or report_web_dest | default('') | length > 0

- name: Triage | ACT answered
  ansible.builtin.assert:
    that: _ea_ran | bool
    fail_msg: "ACT did not answer: {{ _ea_reason }} The finding and what was read are in the report and the job artifact."
    quiet: true
  when: not ansible_check_mode and not _ea_off | default(false) | bool
