---
# Deploy / reconcile the STIG Manager stack. Idempotent: a second run changes nothing.
# Secrets arrive as environment variables / files from AAP credentials (docs/SECRETS.md) and
# are handed to podman as secrets over stdin: never on a command line, never in a unit file,
# never printed (no_log), never shown as a diff.

- name: Stack | paths for this scope
  ansible.builtin.set_fact:
    _stigman_quadlet_dir: >-
      {{ (ansible_user_dir ~ '/.config/containers/systemd') if stigman_scope == 'user'
         else '/etc/containers/systemd' }}

# ---------------------------------------------------------------- preflight
- name: Preflight | secrets are present (from the AAP credentials)
  ansible.builtin.assert:
    that:
      - stigman_mysql_root_password | length >= 12
      - stigman_db_password | length >= 12
      - stigman_tls_cert_src | length > 0
      - stigman_tls_key_src | length > 0
    fail_msg: >-
      Missing secrets. Attach the "STIG Manager database" and "TLS certificate" credentials to the
      job template (passwords must be at least 12 characters). See docs/SECRETS.md.
    quiet: true
  no_log: true

- name: Preflight | the TLS files exist on the controller
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: "{{ [stigman_tls_cert_src, stigman_tls_key_src] + ([stigman_tls_ca_src] if stigman_tls_ca_src else []) }}"
  loop_control:
    label: "{{ item | basename }}"
  delegate_to: localhost
  become: false
  register: _stigman_tls_stat

- name: Preflight | certificate and key are readable files
  ansible.builtin.assert:
    that: (_stigman_tls_stat.results[:2] | selectattr('stat.exists') | selectattr('stat.size', 'gt', 0) | list | length) == 2
    fail_msg: The TLS certificate/key files injected by the credential are missing or empty.
    quiet: true

- name: Preflight | podman version
  ansible.builtin.command:
    argv: [podman, version, --format, "{{ '{{' }}.Client.Version{{ '}}' }}"]
  register: _stigman_podman
  changed_when: false
  check_mode: false                       # only reads: a dry run needs the answer too

- name: Preflight | podman supports Quadlet (4.4 or newer)
  ansible.builtin.assert:
    that: _stigman_podman.stdout is version('4.4', '>=')
    fail_msg: "podman {{ _stigman_podman.stdout }} is too old for Quadlet; RHEL 9.2+/8.8+ ship 4.4 or newer."
    quiet: true

# ---------------------------------------------------------------- the images (1.70.3)
# Before anything is written: every image must be on this host. The units never pull (PodmanArgs=--pull=never), so an
# air-gapped host failed minutes later in "Unable to start service". stigman_pull_images true pulls what is missing instead.
- name: Registry | log in (only when the registry credential is attached)
  ansible.builtin.command:
    argv: [podman, login, --username, "{{ lookup('ansible.builtin.env', 'REGISTRY_USERNAME') }}",
           --password-stdin, "{{ lookup('ansible.builtin.env', 'REGISTRY_HOST') }}"]
    stdin: "{{ lookup('ansible.builtin.env', 'REGISTRY_PASSWORD') }}"
  changed_when: false
  no_log: true
  when: lookup('ansible.builtin.env', 'REGISTRY_PASSWORD') | length > 0

- name: Images | which are on this host (podman image exists; nothing is pulled)
  ansible.builtin.command:
    argv: [podman, image, exists, "{{ item.image }}"]
  loop:
    - {var: stigman_images.mysql, image: "{{ stigman_images.mysql }}"}
    - {var: stigman_images.api, image: "{{ stigman_images.api }}"}
    - {var: stigman_images.nginx, image: "{{ stigman_images.nginx }}"}
  loop_control:
    label: "{{ item.var }}"
  register: _stigman_img
  changed_when: false
  failed_when: false
  check_mode: false                       # only reads

- name: Images | pulled, when stigman_pull_images is true (a host that reaches a registry)
  ansible.builtin.command:
    argv: [podman, pull, "{{ item.item.image }}"]
  loop: "{{ _stigman_img.results | rejectattr('rc', 'equalto', 0) | list }}"
  loop_control:
    label: "{{ item.item.var }}"
  register: _stigman_img_pull
  changed_when: _stigman_img_pull.rc == 0            # a failed pull changed nothing
  failed_when: false
  when: stigman_pull_images | bool and not ansible_check_mode

- name: Images | every image is on this host, or the job stops here with nothing changed
  ansible.builtin.fail:
    msg: "{{ _stigman_img_missing | airgap_images_text(stigman_scope, 'stigman_pull_images', stigman_pull_images | bool) }}"
  vars:
    _stigman_img_missing: >-
      {%- if stigman_pull_images | bool -%}
      {{ [] if ansible_check_mode else (_stigman_img_pull.results | default([]) | airgap_pull_failures) }}
      {%- else -%}
      {{ _stigman_img.results | rejectattr('rc', 'equalto', 0) | map(attribute='item') | list }}
      {%- endif -%}
  when: _stigman_img_missing | length > 0

# ---------------------------------------------------------------- directories
- name: Files | directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: "{{ item.mode }}"
  loop:
    - {path: "{{ _stigman_quadlet_dir }}", mode: "0755"}
    - {path: "{{ stigman_config_dir }}", mode: "0750"}
    - {path: "{{ stigman_config_dir }}/nginx", mode: "0750"}
    - {path: "{{ stigman_config_dir }}/nginx/tls", mode: "0750"}
    - {path: "{{ stigman_config_dir }}/api", mode: "0750"}
  loop_control:
    label: "{{ item.path }}"

# ---------------------------------------------------------------- TLS
- name: TLS | certificate (server certificate + intermediates)
  ansible.builtin.copy:
    src: "{{ stigman_tls_cert_src }}"
    dest: "{{ stigman_config_dir }}/nginx/tls/fullchain.pem"
    mode: "0644"
  register: _stigman_cert

- name: TLS | private key
  ansible.builtin.copy:
    src: "{{ stigman_tls_key_src }}"
    dest: "{{ stigman_config_dir }}/nginx/tls/key.pem"
    mode: "0600"
  diff: false
  no_log: true
  register: _stigman_key

- name: TLS | is there a CA chain?
  ansible.builtin.set_fact:
    _stigman_has_ca: >-
      {{ (_stigman_tls_stat.results | length > 2) and (_stigman_tls_stat.results[2].stat.size | default(0)) > 0 }}

- name: TLS | CA bundle for the API (to trust Keycloak's certificate)
  ansible.builtin.copy:
    src: "{{ stigman_tls_ca_src }}"
    dest: "{{ stigman_config_dir }}/api/ca.pem"
    mode: "0644"
  when: _stigman_has_ca | bool
  register: _stigman_ca

# ---------------------------------------------------------------- registry login (optional)
# ---------------------------------------------------------------- podman secrets
# A label holds the SHA-256 of each value so the role knows whether it changed without reading
# the secret back. The hash is plain (unsalted) SHA-256: anyone who can read the label can also
# read the secret itself (both need root on the host), so a salt would add nothing - but it also
# means a WEAK password could be guessed from the label. Use long random values (the AAP
# credential help says so). Changing the hash scheme would make every deployed database look
# 'changed', so it stays as it is.
- name: Secrets | current state
  ansible.builtin.command:
    argv: [podman, secret, inspect, "{{ item }}", --format, "{{ '{{' }}index .Spec.Labels \"site.sha256\"{{ '}}' }}"]
  loop: [stigman-mysql-root, stigman-db-password]
  register: _stigman_secret_state
  changed_when: false
  failed_when: false
  check_mode: false                       # only reads the label
  no_log: true                            # the label is the deployed value's hash: not in the job output (also at -v)

- name: Secrets | desired state
  ansible.builtin.set_fact:
    _stigman_secrets:
      - name: stigman-mysql-root
        sha: "{{ stigman_mysql_root_password | hash('sha256') }}"
        have: "{{ (_stigman_secret_state.results[0].stdout | trim) if _stigman_secret_state.results[0].rc == 0 else '' }}"
        there: "{{ _stigman_secret_state.results[0].rc == 0 }}"
      - name: stigman-db-password
        sha: "{{ stigman_db_password | hash('sha256') }}"
        have: "{{ (_stigman_secret_state.results[1].stdout | trim) if _stigman_secret_state.results[1].rc == 0 else '' }}"
        there: "{{ _stigman_secret_state.results[1].rc == 0 }}"
  no_log: true

# The names only: the refusal below prints these, never a hash (a failed loop would print its whole item)
- name: Secrets | the deployed ones whose value in AAP differs
  ansible.builtin.set_fact:
    _stigman_secrets_differ: >-
      {%- set out = [] -%}
      {%- for s in _stigman_secrets if s.have | length > 0 and s.have != s.sha -%}
      {%-   set _ = out.append(s.name) -%}
      {%- endfor -%}
      {{ out }}
  no_log: true

- name: Secrets | refuse to silently change a deployed database password
  ansible.builtin.fail:
    msg: >-
      The {{ _stigman_secrets_differ | join(' and ') }} value in AAP differs from the one already deployed.
      Changing it here would only change the secret, not the password inside MySQL, and STIG Manager would
      lose its database. Rotate it with a password-rotation run (ALTER USER, then update the secret), or
      re-run with stigman_replace_secrets=true if the database is being re-created.
  when:
    - _stigman_secrets_differ | length > 0
    - not (stigman_replace_secrets | default(false) | bool)

# podman secret create --replace needs podman 4.7 (RHEL 9.2 / 8.8 ship 4.4): before it a secret there is removed first
- name: Secrets | the old value removed first (podman before 4.7, when replacing is allowed)
  ansible.builtin.command:
    argv: [podman, secret, rm, "{{ item.name }}"]
  loop: "{{ _stigman_secrets }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.have != item.sha and item.there | bool and _stigman_podman.stdout is version('4.7', '<')
  changed_when: true

# 1.68.2: --replace only for a secret that is there (podman 4.9.4-rhel refuses it for a new one: "deleting secret : : no
# secret data with ID"). The task is no_log (the value goes over stdin), so AAP would only say "censored": its result is
# kept and the next task stops with podman's own words (stderr - never the value, never the command line)
- name: Secrets | create (first deployment) or replace (when explicitly allowed)
  ansible.builtin.command:
    argv: >-
      {{ ['podman', 'secret', 'create'] + (['--replace'] if _stigman_podman.stdout is version('4.7', '>=') and item.there | bool else [])
         + ['--label', 'site.sha256=' ~ item.sha, item.name, '-'] }}
    stdin: "{{ stigman_mysql_root_password if item.name == 'stigman-mysql-root' else stigman_db_password }}"
    stdin_add_newline: false
  loop: "{{ _stigman_secrets }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.have != item.sha
  changed_when: true                      # runs only when the secret is missing or differs
  failed_when: false                      # said by the next task, with podman's reason
  no_log: true
  register: _stigman_secret_set

- name: Secrets | podman made them
  ansible.builtin.fail:
    msg: >-
      {{ _stigman_secret_set.results | selectattr('rc', 'defined') | rejectattr('rc', 'equalto', 0)
         | map(attribute='item') | map(attribute='name') | zip(_stigman_secret_set.results | selectattr('rc', 'defined')
         | rejectattr('rc', 'equalto', 0) | map(attribute='stderr')) | map('join', ' - podman secret create failed: ') | list }}
  when: _stigman_secret_set.results | default([]) | selectattr('rc', 'defined') | rejectattr('rc', 'equalto', 0) | list | length > 0

# ---------------------------------------------------------------- configuration + units
- name: Config | nginx
  ansible.builtin.template:
    src: nginx-stigman.conf.j2
    dest: "{{ stigman_config_dir }}/nginx/stigman.conf"
    mode: "0644"
  register: _stigman_nginx_conf

- name: Units | Quadlet files
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ _stigman_quadlet_dir }}/{{ item.dest }}"
    mode: "0644"
  loop:
    - {src: stigman.network.j2, dest: stigman.network}
    - {src: stigman-mysql-data.volume.j2, dest: stigman-mysql-data.volume}
    - {src: stigman-mysql.container.j2, dest: stigman-mysql.container}
    - {src: stigman-api.container.j2, dest: stigman-api.container}
    - {src: stigman-nginx.container.j2, dest: stigman-nginx.container}
  loop_control:
    label: "{{ item.dest }}"
  register: _stigman_units

- name: Units | reload systemd so Quadlet regenerates the services  # noqa: no-handler (must run before the next task, not at the end)
  ansible.builtin.systemd_service:
    daemon_reload: true
    scope: "{{ stigman_scope }}"
  when: _stigman_units is changed

- name: Units | which services were already running
  ansible.builtin.command:
    argv: "{{ ['systemctl'] + (['--user'] if stigman_scope == 'user' else []) + ['is-active', item] }}"
  loop: [stigman-mysql.service, stigman-api.service, stigman-nginx.service]
  register: _stigman_pre
  changed_when: false
  failed_when: false
  check_mode: false                       # only reads

- name: Units | started (dependencies first)
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: started
    scope: "{{ stigman_scope }}"
  loop: [stigman-mysql.service, stigman-api.service, stigman-nginx.service]
  # a dry run of a FIRST deployment has no units yet (their files were not written): "would start"
  ignore_errors: "{{ ansible_check_mode }}"

# Restart only services that were ALREADY running and whose inputs changed. A service started
# for the first time just above is never restarted: restarting MySQL during its first-time
# initialisation can leave a half-built database.
- name: Units | what changed
  vars:
    # running already - or starting (a unit restarting after a failure is "activating"): it must pick up the change
    _stigman_up: [active, activating, reloading]
  ansible.builtin.set_fact:
    _stigman_restart:
      mysql: >-
        {{ _stigman_pre.results[0].stdout in _stigman_up
           and (_stigman_units.results | selectattr('changed') | map(attribute='item.dest')
                | select('in', ['stigman-mysql.container']) | list | length > 0) }}
      api: >-
        {{ _stigman_pre.results[1].stdout in _stigman_up
           and ((_stigman_units.results | selectattr('changed') | map(attribute='item.dest')
                 | select('in', ['stigman-api.container']) | list | length > 0)
                or _stigman_secret_set is changed or _stigman_ca is changed) }}
      nginx: >-
        {{ _stigman_pre.results[2].stdout in _stigman_up
           and ((_stigman_units.results | selectattr('changed') | map(attribute='item.dest')
                 | select('in', ['stigman-nginx.container']) | list | length > 0)
                or _stigman_nginx_conf is changed or _stigman_cert is changed or _stigman_key is changed) }}

- name: Units | restart what changed (dependencies first)
  ansible.builtin.systemd_service:
    name: "stigman-{{ item }}.service"
    state: restarted
    scope: "{{ stigman_scope }}"
  loop: [mysql, api, nginx]
  when: _stigman_restart[item] | bool

# ---------------------------------------------------------------- verify
- name: Verify | DRY RUN - nothing was changed or started, so there is nothing to verify
  ansible.builtin.debug:
    msg: >-
      DRY RUN (Check mode): the tasks above marked "changed" are what a real run would change
      (tick Show changes, or --diff, to see the file changes). Nothing was changed or restarted.
  when: ansible_check_mode

- name: Verify | MySQL is healthy
  ansible.builtin.command:
    argv: [podman, healthcheck, run, stigman-mysql]
  register: _stigman_mysql_health
  until: _stigman_mysql_health.rc == 0
  retries: "{{ stigman_ready_retries }}"
  delay: "{{ stigman_ready_delay }}"
  changed_when: false
  when: not ansible_check_mode

- name: Verify | STIG Manager answers through nginx (TLS)
  ansible.builtin.uri:
    url: "https://127.0.0.1:{{ stigman_https_port }}/api/op/configuration"
    validate_certs: false
    return_content: true
  register: _stigman_ready
  until: _stigman_ready.status == 200
  retries: "{{ stigman_ready_retries }}"
  delay: "{{ stigman_ready_delay }}"
  when: not ansible_check_mode

- name: Verify | summary
  when: not ansible_check_mode
  ansible.builtin.debug:
    msg: >-
      STIG Manager {{ (_stigman_ready.json | default({})).version | default('?') }} is up on
      https://{{ stigman_server_name }}:{{ stigman_https_port }}/ (classification
      {{ (_stigman_ready.json | default({})).classification | default(stigman_classification) }}).
