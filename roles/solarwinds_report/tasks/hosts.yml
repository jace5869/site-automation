---
# SOLARWINDS IN A REPORT (1.97.0, docs/SOLARWINDS_REPORTS.md): the hosts _swr_hosts ([{host, fqdn, ip}]) as SolarWinds
# sees them, read once for the job from the AAP side. _swr_mode: health (with Log Analyzer's syslog), troubleshoot (the
# switch port and the events) or vcenter (the alarms reports). Read only: the report database's SolarWinds snapshot, and
# for the syslog one capped query to SolarWinds, at the address of the "SolarWinds (read-only)" credential (SOLARWINDS_URL,
# its certificate settings too, as the AD report). Never fails the job: what could not be read is one line of the report.
# The result: _swr_read ({skipped: true} when solarwinds_report is false, or auto without a Report database credential).
- name: SolarWinds | which credentials the job has
  ansible.builtin.set_fact:
    _swr_db: "{{ lookup('ansible.builtin.env', 'REPORT_DB_HOST') | trim }}"
    _swr_on: >-
      {{ (solarwinds_report | string | lower) not in ['false', 'no', 'off', '0']
         and ((solarwinds_report | string | lower) != 'auto' or lookup('ansible.builtin.env', 'REPORT_DB_HOST') | trim | length > 0) }}
  delegate_to: localhost
  run_once: true

- name: SolarWinds | the hosts as SolarWinds sees them (read only)
  site_host_swis:
    hosts: "{{ _swr_hosts }}"
    mode: "{{ _swr_mode | default('health') }}"
    max_age: "{{ solarwinds_db_max_age | default(20) | int }}"
    event_hours: "{{ solarwinds_report_event_hours | int }}"
    # auto: as true - without the SolarWinds credential the column says so (the one thing to attach)
    syslog: "{{ (_swr_mode | default('health')) == 'health' and (solarwinds_report_syslog | string | lower) not in ['false', 'no', 'off', '0'] }}"
    syslog_hours: "{{ solarwinds_report_syslog_hours | int }}"
    syslog_levels: "{{ solarwinds_report_syslog_levels }}"
    syslog_max_rows: "{{ solarwinds_report_syslog_max_rows | int }}"
    timeout: "{{ solarwinds_report_timeout | int }}"
    host: "{{ _swr_db }}"
    port: "{{ lookup('ansible.builtin.env', 'REPORT_DB_PORT') | default('3309', true) | int }}"
    database: "{{ lookup('ansible.builtin.env', 'REPORT_DB_NAME') | default('site_reports', true) | trim }}"
    user: "{{ lookup('ansible.builtin.env', 'REPORT_DB_USER') | trim }}"
    password: "{{ lookup('ansible.builtin.env', 'REPORT_DB_PASSWORD') }}"
    tls: "{{ lookup('ansible.builtin.env', 'REPORT_DB_TLS') | default('false', true) | bool }}"
    ca_file: "{{ lookup('ansible.builtin.env', 'REPORT_DB_CA_FILE') | trim }}"
  register: _swr_got
  failed_when: false                     # never the job's result: a module that fails is the report's one line
  delegate_to: localhost
  run_once: true
  become: false
  check_mode: false                      # it only reads
  vars:
    ansible_connection: local
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  when: _swr_on | bool

- name: SolarWinds | what was read
  ansible.builtin.set_fact:
    _swr_read: >-
      {{ {'skipped': true} if not _swr_on | bool else
         (_swr_got if _swr_got.hosts is defined else
          {'ok': false, 'hosts': [], 'why': ['the SolarWinds reader stopped with an error (the job output has it)']}) }}
  delegate_to: localhost
  run_once: true

- name: SolarWinds | in short
  ansible.builtin.debug:
    msg: >-
      {{ 'SolarWinds not read: ' ~ (_swr_read.why | default(['?']) | first) if not _swr_read.ok | default(false) else
         'SolarWinds: the snapshot of ' ~ _swr_read.read_at ~ ' UTC (' ~ _swr_read.age_min ~ ' min old), '
         ~ (_swr_read.hosts | selectattr('node') | list | length) ~ ' of ' ~ (_swr_read.hosts | length) ~ ' hosts known to it'
         ~ ((', syslog not read: ' ~ _swr_read.syslog.why) if _swr_read.syslog and not _swr_read.syslog.ok else '') }}
  run_once: true
  when: not _swr_read.skipped | default(false)
