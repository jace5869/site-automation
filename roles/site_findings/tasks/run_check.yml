---
# Run one check role on this host: roles/check_<name> on Linux, roles/win_check_<name> on Windows.
# If the check itself breaks (a tool is missing, an unexpected error), that becomes a finding and
# the other checks still run.
# Input: _site_check (the check name, e.g. disk); _site_check_tasks: another tasks file of the role (the STIG recheck:
# recheck), default its main.
- name: "Check {{ _site_check }}"
  block:
    - name: "Check {{ _site_check }} | run"
      ansible.builtin.include_role:
        name: "{{ site_check_role_prefix }}{{ _site_check }}"
        tasks_from: "{{ _site_check_tasks | default('main') }}"

    - name: "Check {{ _site_check }} | done"
      ansible.builtin.set_fact:
        site_checks_run: "{{ (site_checks_run + [_site_check]) | unique }}"
  rescue:
    - name: "Check {{ _site_check }} | the check itself could not run (reported as a finding)"
      ansible.builtin.set_fact:
        site_findings: >-
          {{ site_findings + [{
               'check': _site_check,
               'id': _site_check ~ ':check-error',
               'severity': 'warning',
               'summary': 'the ' ~ _site_check ~ ' check could not run: '
                          ~ (ansible_failed_result.msg | default('unknown error') | string | truncate(300)),
               'hint': ''}] }}
        site_checks_run: "{{ (site_checks_run + [_site_check]) | unique }}"
        # it did not finish: what it found before is not known to have cleared (servicenow tickets.yml)
        site_checks_failed: "{{ (site_checks_failed | default([]) + [_site_check]) | unique }}"
