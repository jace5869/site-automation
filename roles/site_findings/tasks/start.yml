---
# Start of a check run on this host: no findings yet.
- name: Findings | start with an empty list
  ansible.builtin.set_fact:
    site_findings: []
    site_checks_run: []
    site_checks_failed: []

# Once per run: which hosts were targeted. The ServiceNow step compares this with the hosts that
# reported, so a host that never reported (unreachable, sudo failed) is not mistaken for healthy.
# Hosts of the other OS (skipped by os_guard.yml), and hosts a playbook leaves out on purpose
# (site_host_skipped: the certificate report's cert_skip_groups) are not counted: they get no ticket.
- name: Findings | remember the targeted hosts for later workflow steps
  ansible.builtin.set_stats:
    data:
      site_health_targets: >-
        {{ site_health_targets_override | default(ansible_play_hosts_all | reject('in', _site_other_os) | reject('in', _site_left_out) | list) }}
    per_host: false
    aggregate: false
  run_once: true
  vars:
    _site_other_os: >-
      {%- set out = [] -%}
      {%- for h in ansible_play_hosts_all -%}
      {%-   set win = (hostvars[h].ansible_connection | default('ssh')) in site_windows_connections
                      or (hostvars[h].ansible_shell_type | default('sh')) in ['powershell', 'cmd'] -%}
      {%-   if win != (site_os == 'windows') -%}{%- set _ = out.append(h) -%}{%- endif -%}
      {%- endfor -%}
      {{ out }}
    _site_left_out: >-
      {%- set out = [] -%}
      {%- for h in ansible_play_hosts_all if hostvars[h].site_host_skipped | default(false) | bool -%}{%- set _ = out.append(h) -%}{%- endfor -%}
      {{ out }}

- name: Findings | notice about settings files that override AAP's Variables box
  ansible.builtin.include_tasks: settings_notice.yml
