---
# End of a check run on this host:
#   1. print the result in plain words
#   2. one syslog line per finding
#   3. publish the result (set_stats) so later workflow steps (tickets, ACT) can use it
#   4. a fleet summary, once, at the top of the job's end
#   5. email it, once (report_email_to; roles/site_email; extra sections: site_report_sections)
#   6. FAIL the host if it has findings (site_fail_on), or if ACT proposed a fix that waits for
#      approval - this is what an AAP workflow reacts to
# Steps 3 to 5 come before the failure on purpose: a failed host still publishes and emails its result.

# 1.84.0: a playbook that read a NetApp Console host but did not make its findings (health_check.yml does, after its checks)
- name: Report | NetApp Console - its findings, if not made yet
  ansible.builtin.include_role:
    name: check_containers
    tasks_from: console_findings.yml
  when: site_console is defined and not site_console_done | default(false) | bool

- name: Report | result for this host
  ansible.builtin.debug:
    msg: >-
      {%- set out = [] -%}
      {%- if site_findings | length == 0 -%}
      {%-   set _ = out.append((site_report_no_findings | default('HEALTHY')) ~ '. Checks run: ' ~ (site_checks_run | join(', ') or 'none')) -%}
      {%- else -%}
      {%-   set _ = out.append((site_findings | length) ~ ' finding(s). Checks run: ' ~ (site_checks_run | join(', '))) -%}
      {%-   for f in site_findings | sort(attribute='severity') -%}
      {%-     set _ = out.append('[' ~ (f.severity | upper) ~ '] ' ~ f.check ~ ': ' ~ f.summary) -%}
      {%-     if f.note | default('') -%}{%- set _ = out.append('      ' ~ f.note) -%}{%- endif -%}
      {%-     if f.fix | default('') -%}{%- set _ = out.append('      what to do: ' ~ f.fix) -%}{%- endif -%}
      {#-     a hint of several lines (commands one per line): each on its own line, under look: -#}
      {%-     for line in (f.hint | default('') | string).splitlines() if line | trim -%}
      {%-       set _ = out.append(('      look: ' if loop.first else '            ') ~ line) -%}
      {%-     endfor -%}
      {%-   endfor -%}
      {%- endif -%}
      {{ out }}

- name: Report | syslog, one line per finding (tag {{ site_syslog_tag }})
  ansible.builtin.command:
    argv:
      - logger
      - --tag
      - "{{ site_syslog_tag }}"
      - --priority
      - "daemon.{{ 'crit' if item.severity == 'critical' else 'warning' }}"
      - "{{ item.severity | upper }} {{ item.id }}: {{ item.summary }} (AAP job {{ awx_job_id | default('-') }})"
  loop: "{{ site_findings }}"
  loop_control:
    label: "{{ item.id }}"
  changed_when: false
  when: site_syslog | bool and site_os != 'windows'

- name: Report | Windows Application event log, one entry per finding (source {{ site_eventlog_source }})
  ansible.builtin.script: win_eventlog.ps1
  environment:
    SITE_CHECK_CONFIG: >-
      {{ {'source': site_eventlog_source, 'job': awx_job_id | default('-') | string,
          'findings': site_findings} | to_json }}
  register: _site_eventlog
  changed_when: false
  failed_when: false
  when: site_syslog | bool and site_os == 'windows' and site_findings | length > 0

# 1.86.0: the host's teams (report_teams; docs/WEB_REPORTS.md "Teams"): every team whose matchers match it, in the
# setting's order (the first is its owner), else report_team_other - worked out here, where its groups are known
- name: Report | this host's teams (report_teams)
  ansible.builtin.set_fact:
    _sf_my_teams: >-
      {{ inventory_hostname | site_teams(group_names, awx_inventory_name | default(tower_inventory_name | default('')),
                                         report_teams, report_team_other) }}
  when: report_teams | default({}) | length > 0

- name: Report | publish the result for later workflow steps (set_stats)
  ansible.builtin.set_stats:
    data:
      site_health: >-
        {{ {site_report_name | default(inventory_hostname): {
              'status': 'healthy' if site_findings | length == 0 else 'findings',
              'checks': site_checks_run,
              'checks_failed': site_checks_failed | default([]),
              'findings': site_findings,
              'act': site_act_result | default({}),
              'time': now(utc=true).strftime('%Y-%m-%dT%H:%M:%SZ'),
              'job': awx_job_id | default('') | string} | combine({'teams': _sf_my_teams} if _sf_my_teams is defined else {})} }}
    per_host: false
    aggregate: true

# 1.67.0 part C: the findings with stable ids (<kind>:<host>:<key>) and the numbers a fix needs, for the site portal's
# buttons - its fix jobs read them back from this job by reference (roles/finding_ref). A STIG drift job's rules too.
- name: Report | the findings for the site portal (the job artifact site_findings)
  ansible.builtin.set_fact:
    _sf_art: >-
      {{ site_findings | findings_artifact(site_report_name | default(inventory_hostname), site_os | default('linux'),
                                           site_findings_max_per_kind | int, check_stig_result | default(check_stig_results | default(none)),
                                           check_stig_severity | default(none)) }}
  when: site_findings_artifact | bool

- name: Report | publish them (set_stats site_findings, site_findings_capped)
  ansible.builtin.set_stats:
    data:
      site_findings: >-
        {{ {site_report_name | default(inventory_hostname): (_sf_art.entries | map('combine', {'teams': _sf_my_teams}) | list)
                                                             if _sf_my_teams is defined else _sf_art.entries} }}
      site_findings_capped: "{{ {site_report_name | default(inventory_hostname): _sf_art.capped} if _sf_art.capped else {} }}"
    per_host: false
    aggregate: true
  when: site_findings_artifact | bool

# 1.138.0: per-host findings map and missing-host reasons ({host: reason}, from site_host_unreached / site_host_skipped)
- name: Report | per-host findings and missing-host reasons (1.138.0)
  ansible.builtin.set_fact:
    _sf_by_host: >-
      {{ dict(ansible_play_hosts | zip(ansible_play_hosts | map('extract', hostvars) | map(attribute='site_findings', default=[]))) }}
    _sf_missing: >-
      {%- set out = {} -%}
      {%- for h in ansible_play_hosts_all | difference(ansible_play_hosts) | sort -%}
      {%-   set hv = hostvars[h] | default({}) -%}
      {%-   set un = hv.site_host_unreached | default('') | string | trim -%}
      {%-   set sk = hv.site_host_skipped | default(false) -%}
      {%-   set reason = un if un else ((sk | trim) if (sk is string and sk | trim) else ('skipped' if sk | bool else '')) -%}
      {%-   set _ = out.update({h: reason}) -%}
      {%- endfor -%}
      {{ out }}
  run_once: true

# 1.138.0: per-host counts computed once in server_view_filters (replaces inline debug counting)
- name: Report | fleet summary
  ansible.builtin.debug:
    msg: "{{ _sf_by_host | fleet_summary_lines(_sf_missing) }}"
  run_once: true

- name: Report | patch age, when the patching check ran (a section of the report; 1.61.0)
  ansible.builtin.include_tasks: patch_age.yml
  when: >-
    'patching' in (ansible_play_hosts | map('extract', hostvars) | map(attribute='site_checks_run', default=[]) | flatten)

- name: Report | NetApp Console, when a host runs its containers (three sections of the report; 1.84.0)
  ansible.builtin.include_tasks: console_section.yml
  when: ansible_play_hosts | map('extract', hostvars) | selectattr('site_console', 'defined') | list | length > 0

- name: Report | SolarWinds, in the health checks and troubleshoot (sections of the report; 1.97.0)
  ansible.builtin.include_tasks: solarwinds.yml
  when: _swr_mode | default('') | length > 0
  vars:
    # the hosts it reads: the play's less the other OS's and the ones left out on purpose (as start.yml counts them)
    _swr_targets: >-
      {%- set out = [] -%}
      {%- for h in ansible_play_hosts_all -%}
      {%-   set win = (hostvars[h].ansible_connection | default('ssh')) in site_windows_connections
                      or (hostvars[h].ansible_shell_type | default('sh')) in ['powershell', 'cmd'] -%}
      {%-   if win == (site_os == 'windows') and not hostvars[h].site_host_skipped | default(false) | bool -%}{%- set _ = out.append(h) -%}{%- endif -%}
      {%- endfor -%}
      {{ out }}

- name: Report | the certificate timeline, in a certificate report (a section of the report; 1.64.0)
  ansible.builtin.include_tasks: cert_timeline.yml
  when: site_cert_timeline is defined and cert_timeline | bool

# 1.86.0: the teams of the job's hosts, for the website's team view (report_teams; the email stays as it is) - and what
# the job says about the setting: a part it cannot read, a team that matches no host, a group the inventory does not have
- name: Report | the teams (report_teams)
  ansible.builtin.set_fact:
    _sf_teams:
      map: >-
        {{ dict(ansible_play_hosts_all | zip(ansible_play_hosts_all | map('extract', hostvars) | map(attribute='group_names', default=[])))
           | report_team_map(awx_inventory_name | default(tower_inventory_name | default('')), report_teams, report_team_other) }}
      names: "{{ report_teams | report_team_names(report_team_other) }}"
      other: "{{ report_team_other }}"
      setting: "{{ report_teams }}"
    _sf_team_notes: >-
      {{ report_teams | report_teams_notes(dict(ansible_play_hosts_all | zip(ansible_play_hosts_all | map('extract', hostvars)
                                                                             | map(attribute='group_names', default=[]))),
                                           groups.keys() | list, awx_inventory_name | default(tower_inventory_name | default('')),
                                           report_team_other) }}
  run_once: true
  when: report_teams | default({}) | length > 0

- name: Report | report_teams - what to look at
  ansible.builtin.debug:
    msg: "{{ _sf_team_notes }}"
  run_once: true
  when: _sf_team_notes | default([]) | length > 0

# the site portal's actions, for the buttons (portal_actions, else roles/site_portal_stack/files/actions.yml)
- name: Report | the site portal's actions (report_portal_url)
  ansible.builtin.set_fact:
    _sf_actions: >-
      {{ portal_actions if portal_actions | default({}) | length > 0
         else (lookup('ansible.builtin.file', role_path ~ '/../site_portal_stack/files/actions.yml') | from_yaml).actions | default({}, true) | portal_action_modes(portal_ticket_mode | default('dry_run')) }}
  run_once: true
  when: report_portal_url | default('') | length > 0

- name: Report | email the report, publish it (report_email_to, report_web_dest) - once for the job, from the AAP side, before any host fails
  ansible.builtin.include_role:
    name: site_email
    apply:
      delegate_to: localhost
      run_once: true
      become: false
  vars:
    # the email leaves from the controller (the execution environment), whatever the hosts are
    ansible_connection: local
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    _report: >-
      {{ _sf_by_host
         | findings_report(site_report_title | default(ansible_play_name),
                           _sf_missing,
                           ansible_play_hosts | map('extract', hostvars) | map(attribute='site_checks_run', default=[]) | flatten | unique | list,
                           _swr_view.sections | default([]) + _cert_timeline.sections | default([]) + site_report_sections | default([])
                           + _patch_age.sections | default([]) + _console.sections | default([])) }}
    # 1.138.0: server-first inputs (website only, gated by report_servers_view)
    _sf_servers: >-
      {%- if report_servers_view | default(false) | bool -%}
      {%-   set health = {} -%}
      {%-   set capped = {} -%}
      {%-   set stig_res = [] -%}
      {%-   set certs = [] -%}
      {%-   set fap_e = {} -%}
      {%-   set ts = now(utc=true).strftime('%Y-%m-%dT%H:%M:%SZ') -%}
      {%-   for h in ansible_play_hosts | sort -%}
      {%-     set hv = hostvars[h] | default({}) -%}
      {%-     set fs = hv.site_findings | default([]) -%}
      {%-     set ip = (hv.ansible_default_ipv4 | default({})).address | default(hv.ansible_host | default('')) | string -%}
      {%-     set _ = health.update({h: {'status': 'healthy' if fs | length == 0 else 'findings',
                                         'checks': hv.site_checks_run | default([]),
                                         'checks_failed': hv.site_checks_failed | default([]),
                                         'time': ts, 'ip': ip}}) -%}
      {%-     set cap = (hv._sf_art | default({})).capped | default({}) -%}
      {%-     if cap -%}{%- set _ = capped.update({h: cap}) -%}{%- endif -%}
      {%-     if hv.check_stig_results is defined -%}
      {%-       for c in hv.check_stig_results -%}{%- set _ = stig_res.append(c) -%}{%- endfor -%}
      {%-     elif hv.check_stig_result is defined -%}
      {%-       set _ = stig_res.append(hv.check_stig_result) -%}
      {%-     endif -%}
      {%-     if hv.check_certs_inventory is defined -%}
      {%-       for c in hv.check_certs_inventory -%}{%- set _ = certs.append(c) -%}{%- endfor -%}
      {%-     endif -%}
      {%-     set fe = ((hv._sf_art | default({})).entries | default([])) | selectattr('kind', 'equalto', 'fapolicyd_deny') | list -%}
      {%-     if fe -%}{%- set _ = fap_e.update({h: fe}) -%}{%- endif -%}
      {%-   endfor -%}
      {%-   set out = {'enabled': true, 'health': health, 'capped': capped, 'zone': report_time_zone | default(''),
                       'max_per_kind': site_findings_max_per_kind | default(50) | int} -%}
      {%-   if stig_res -%}
      {%-     set _ = out.update({'stig_results': stig_res, 'stig_texts': _stig_texts | default({}),
                                  'severity_map': check_stig_severity | default({}),
                                  'disagree_severity': check_stig_disagree_severity | default('low'),
                                  'portal_url': report_portal_url | default('')}) -%}
      {%-   endif -%}
      {%-   if site_cert_timeline is defined or certs -%}
      {%-     set ctl = site_cert_timeline | default({}) -%}
      {%-     set _ = out.update({'certs': certs,
                                  'warn_days': ctl.warn | default(check_certs_warn_days | default(win_check_certs_warn_days | default(30))) | int,
                                  'crit_days': ctl.crit | default(check_certs_crit_days | default(win_check_certs_crit_days | default(7))) | int,
                                  'notice_days': ctl.notice | default(check_certs_notice_days | default(win_check_certs_notice_days | default(60))) | int}) -%}
      {%-   endif -%}
      {%-   if fap_e -%}{%- set _ = out.update({'fapolicyd_entries': fap_e}) -%}{%- endif -%}
      {%-   if _smh_server_hosts is defined -%}{%- set _ = out.update({'known_hosts': _smh_server_hosts, 'group_by_finding_host': true}) -%}{%- endif -%}
      {{ out }}
      {%- else -%}
      {{ none }}
      {%- endif -%}
    # the website's copy (atlas, brief): patch age's squares too, the certificate timeline, a job's own web sections (1.73.0:
    # the STIG rules' rows that open to their check and fix text), and (1.67.0, report_portal_url)
    # the site portal's "Ask ACT" links; the workbook (report_email_xlsx): every host's patch age, the by-group sheet with
    # its trend line (1.62.0), the Timeline sheet; 1.86.0 (report_teams): the team view; 1.138.0 (report_servers_view): server list
    _report_web: >-
      {{ (_sf_by_host
          | findings_report(site_report_title | default(ansible_play_name),
                            _sf_missing,
                            ansible_play_hosts | map('extract', hostvars) | map(attribute='site_checks_run', default=[]) | flatten | unique | list,
                            _swr_view.web_sections | default([])
                            + _cert_timeline.web_sections | default(_cert_timeline.sections | default([]))
                            + site_report_web_sections | default(site_report_sections | default([]))
                            + _patch_age.web_sections | default(_patch_age.sections | default([]))
                            + _console.sections | default([])
                            + ([_sf_more] if _sf_more else []),
                            {'url': report_portal_url | default(''), 'job': awx_job_id | default(tower_job_id | default('')) | string,
                             'actions': _sf_actions | default({}),
                             'os': dict(ansible_play_hosts | zip(ansible_play_hosts | map('extract', hostvars) | map(attribute='site_os', default='linux')))},
                            _sf_teams | default(none),
                            _sf_servers))
         if _patch_age.web_sections is defined or _cert_timeline.web_sections is defined or report_portal_url | default('') | length > 0
            or site_report_web_sections is defined or _console.sections is defined or _sf_teams is defined
            or _swr_view.web_sections | default([]) | length > 0 or report_servers_view | default(false) | bool
         else {} }}
    # findings of their own kinds that are no row of the findings table (a STIG rule, a fapolicyd denial): their buttons in
    # one section of their own (plugins/filter/finding_filters.py)
    _sf_more: >-
      {{ dict(ansible_play_hosts | zip(ansible_play_hosts | map('extract', hostvars) | map(attribute='_sf_art', default={})
                                       | map(attribute='entries', default=[])))
         | findings_actions_section(_sf_actions | default({}), report_portal_url | default(''),
                                    awx_job_id | default(tower_job_id | default('')) | string, 'What you can do from here', 200,
                                    ['stig_rule_fail', 'stig_fixed_open', 'stig_no_asset'] if report_servers_view | default(false) | bool
                                    else ['stig_rule_fail', 'stig_fixed_open', 'stig_no_asset', 'fapolicyd_deny'])
         if report_portal_url | default('') | length > 0 else none }}
    # 1.77.1: a job's own sheets too (site_report_sheets: the STIG reports' Answer files - every row, where the email has a line)
    _report_xlsx: >-
      {{ (_report | report_xlsx_sheets([_patch_age.group_sheet] if _patch_age.group_sheet is defined else []))
                                        + ([_patch_age.sheet] if _patch_age.sheet is defined else [])
                                        + ([_cert_timeline.sheet] if _cert_timeline.sheet is defined else [])
                                        + (site_report_sheets | default([]))
                                        + (_swr_view.sheets | default([]))
         if (_patch_age.sheet is defined or _cert_timeline.sheet is defined or site_report_sheets | default([]) | length > 0
             or _swr_view.sheets | default([]) | length > 0)
            and report_email_xlsx | default(false) | bool else [] }}
  run_once: true
  when: report_email_to | default([]) | length > 0 or report_email_also | default([]) | length > 0 or report_web_dest | default('') | length > 0

- name: Report | no email
  ansible.builtin.debug:
    msg: "No email: report_email_to is not set (docs/EMAIL_REPORTS.md)."
  run_once: true
  when: report_email_to | default([]) | length == 0 and report_email_also | default([]) | length == 0

- name: Report | FAIL this host because it has findings (an AAP workflow's "on failure" path starts here)
  ansible.builtin.fail:
    msg: >-
      {{ 'NEEDS APPROVAL - ' if _site_proposed else '' }}{{ inventory_hostname }}:
      {{ site_findings | length }} finding(s): {{ site_findings | map(attribute='summary') | join('; ') }}
      {{ ('. ACT proposes: ' ~ (_site_proposed | join(' ; '))) if _site_proposed else '' }}
  vars:
    _site_proposed: "{{ (site_act_result | default({})).proposed | default([]) }}"
    # a check that could not run is a blind spot, so it fails the host even when site_fail_on is
    # just [critical] - unless site_fail_on is empty (troubleshooting runs never fail).
    _site_failing: >-
      {{ site_findings | selectattr('severity', 'in', site_fail_on) | list
         + ((site_findings | selectattr('id', 'search', ':check-error$') | rejectattr('severity', 'in', site_fail_on) | list)
            if site_fail_on | length > 0 else []) }}
  when: _site_failing | length > 0 or _site_proposed | length > 0
