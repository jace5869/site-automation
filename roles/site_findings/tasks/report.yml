---
# End of a check run on this host:
#   1. print the result in plain words
#   2. one syslog line per finding
#   3. publish the result (set_stats) so later workflow steps (tickets, ACT) can use it
#   4. a fleet summary, once, at the top of the job's end
#   5. email it, once (report_email_to; roles/site_email; extra sections: site_report_sections)
#   6. FAIL the host if it has findings (site_fail_on), or if ACT proposed a fix that waits for
#      approval - this is what an AAP workflow reacts to
# Steps 3 to 5 come before the failure on purpose: a failed host still publishes and emails its result.

- name: Report | result for this host
  ansible.builtin.debug:
    msg: >-
      {%- set out = [] -%}
      {%- if site_findings | length == 0 -%}
      {%-   set _ = out.append('HEALTHY. Checks run: ' ~ (site_checks_run | join(', ') or 'none')) -%}
      {%- else -%}
      {%-   set _ = out.append((site_findings | length) ~ ' finding(s). Checks run: ' ~ (site_checks_run | join(', '))) -%}
      {%-   for f in site_findings | sort(attribute='severity') -%}
      {%-     set _ = out.append('[' ~ (f.severity | upper) ~ '] ' ~ f.check ~ ': ' ~ f.summary) -%}
      {%-     if f.hint -%}{%- set _ = out.append('      look: ' ~ f.hint) -%}{%- endif -%}
      {%-   endfor -%}
      {%- endif -%}
      {{ out }}

- name: Report | syslog, one line per finding (tag {{ site_syslog_tag }})
  ansible.builtin.command:
    argv:
      - logger
      - --tag
      - "{{ site_syslog_tag }}"
      - --priority
      - "daemon.{{ 'crit' if item.severity == 'critical' else 'warning' }}"
      - "{{ item.severity | upper }} {{ item.id }}: {{ item.summary }} (AAP job {{ awx_job_id | default('-') }})"
  loop: "{{ site_findings }}"
  loop_control:
    label: "{{ item.id }}"
  changed_when: false
  when: site_syslog | bool and site_os != 'windows'

- name: Report | Windows Application event log, one entry per finding (source {{ site_eventlog_source }})
  ansible.builtin.script: win_eventlog.ps1
  environment:
    SITE_CHECK_CONFIG: >-
      {{ {'source': site_eventlog_source, 'job': awx_job_id | default('-') | string,
          'findings': site_findings} | to_json }}
  register: _site_eventlog
  changed_when: false
  failed_when: false
  when: site_syslog | bool and site_os == 'windows' and site_findings | length > 0

- name: Report | publish the result for later workflow steps (set_stats)
  ansible.builtin.set_stats:
    data:
      site_health: >-
        {{ {site_report_name | default(inventory_hostname): {
              'status': 'healthy' if site_findings | length == 0 else 'findings',
              'checks': site_checks_run,
              'findings': site_findings,
              'act': site_act_result | default({}),
              'time': now(utc=true).strftime('%Y-%m-%dT%H:%M:%SZ'),
              'job': awx_job_id | default('') | string}} }}
    per_host: false
    aggregate: true

- name: Report | fleet summary
  ansible.builtin.debug:
    msg: >-
      {%- set out = [] -%}
      {%- set hosts = ansible_play_hosts | sort -%}
      {%- set bad = [] -%}
      {%- for h in hosts if hostvars[h].site_findings | default([]) | length > 0 -%}{%- set _ = bad.append(h) -%}{%- endfor -%}
      {%- set _ = out.append((hosts | length - bad | length) ~ ' healthy, ' ~ (bad | length) ~ ' with findings'
                             ~ ((', ' ~ (ansible_play_hosts_all | difference(ansible_play_hosts) | length) ~ ' did not report (unreachable or failed early)')
                                if ansible_play_hosts_all | difference(ansible_play_hosts) else '')) -%}
      {%- for h in bad -%}
      {%-   set fs = hostvars[h].site_findings -%}
      {%-   set _ = out.append(h ~ ': ' ~ (fs | selectattr('severity', 'equalto', 'critical') | list | length) ~ ' critical, '
                               ~ (fs | selectattr('severity', 'equalto', 'warning') | list | length) ~ ' warning ('
                               ~ (fs | map(attribute='check') | unique | join(', ')) ~ ')') -%}
      {%- endfor -%}
      {%- for h in ansible_play_hosts_all | difference(ansible_play_hosts) | sort -%}
      {%-   set _ = out.append(h ~ ': NO REPORT (unreachable, or the job failed on it before the checks ran)') -%}
      {%- endfor -%}
      {{ out }}
  run_once: true

- name: Report | email the report (report_email_to) - once for the job, from the AAP side, before any host fails
  ansible.builtin.include_role:
    name: site_email
    apply:
      delegate_to: localhost
      run_once: true
      become: false
  vars:
    # the email leaves from the controller (the execution environment), whatever the hosts are
    ansible_connection: local
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    _report: >-
      {{ dict(ansible_play_hosts | zip(ansible_play_hosts | map('extract', hostvars) | map(attribute='site_findings', default=[])))
         | findings_report(site_report_title | default(ansible_play_name),
                           ansible_play_hosts_all | difference(ansible_play_hosts),
                           ansible_play_hosts | map('extract', hostvars) | map(attribute='site_checks_run', default=[]) | flatten | unique | list,
                           site_report_sections | default([])) }}
  run_once: true
  when: report_email_to | default([]) | length > 0

- name: Report | no email
  ansible.builtin.debug:
    msg: "No email: report_email_to is not set (docs/EMAIL_REPORTS.md)."
  run_once: true
  when: report_email_to | default([]) | length == 0

- name: Report | FAIL this host because it has findings (an AAP workflow's "on failure" path starts here)
  ansible.builtin.fail:
    msg: >-
      {{ 'NEEDS APPROVAL - ' if _site_proposed else '' }}{{ inventory_hostname }}:
      {{ site_findings | length }} finding(s): {{ site_findings | map(attribute='summary') | join('; ') }}
      {{ ('. ACT proposes: ' ~ (_site_proposed | join(' ; '))) if _site_proposed else '' }}
  vars:
    _site_proposed: "{{ (site_act_result | default({})).proposed | default([]) }}"
    # a check that could not run is a blind spot, so it fails the host even when site_fail_on is
    # just [critical] - unless site_fail_on is empty (troubleshooting runs never fail).
    _site_failing: >-
      {{ site_findings | selectattr('severity', 'in', site_fail_on) | list
         + ((site_findings | selectattr('id', 'search', ':check-error$') | rejectattr('severity', 'in', site_fail_on) | list)
            if site_fail_on | length > 0 else []) }}
  when: _site_failing | length > 0 or _site_proposed | length > 0
