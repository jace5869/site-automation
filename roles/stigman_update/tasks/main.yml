---
# Workflow 37's last step: the reviews the approval allowed (stigman_update_plan, from the STIG recheck's check through
# the approval step), written to STIG Manager - each read again first and written only if unchanged since the check,
# then read back (library/site_stigman_update.py); a review with attachments is left as it is
# (stigman_update_skip_attachments). A new asset of the plan (0.72.0) is created first, if still not there, and its
# reviews written to it; one made by an earlier run of the same plan is used (its reviews read again first), one made by
# anyone else since the check fails the job (1.24.0). A Check run reads and writes nothing. The report says what became
# of each; a review not written (rejected, an error, its asset not created) fails the job. 1.26.0: the checklist import's
# moves and STIG assignments are done first, each checked again; one not done (held for a person, changed since) leaves its
# reviews unwritten and fails the job.
- name: STIG Manager update | the plan from the workflow's check (stigman_update_plan)
  ansible.builtin.assert:
    that: stigman_update_plan is defined and stigman_update_plan is sequence and stigman_update_plan is not string
    fail_msg: >-
      No plan: this job writes only the reviews the STIG recheck's or the checklist import's check listed and an approval
      allowed - run it as the step after the approval in workflow 37 (docs/STIG_DRIFT.md, "Updating STIG Manager, with an
      approval") or 40 (docs/CKL_IMPORT.md). Nothing written.
    quiet: true

- name: STIG Manager update | write them
  ansible.builtin.include_tasks: write.yml

- name: STIG Manager update | the report
  ansible.builtin.include_role:
    name: site_email
  vars:
    _report: "{{ _su['items'] | default([]) | stig_update_report(ansible_check_mode, _su.error | default(''), stigman_update_plan | length,
                     'import' if stigman_update_plan | selectattr('kind', 'defined') | selectattr('kind', 'eq', 'import') | list else '') }}"

- name: STIG Manager update | not every review was written
  ansible.builtin.fail:
    msg: >-
      {{ _su.error if _su.error | default('') else
         (_su_bad | length | string) ~ ' review(s) not written: ' ~ (_su_bad | map(attribute='line') | zip(_su_bad | map(attribute='why'))
                                                                      | map('join', ': ') | join('; ')) }}
  vars:
    _su_bad: "{{ _su['items'] | default([]) | selectattr('state', 'in', ['rejected', 'error', 'bad', 'not as written', 'no grant',
                                                                       'there since the check', 'asset not created', 'held',
                                                                       'asset not moved', 'STIG not assigned']) | list }}"
  when: (_su.error | default('') | length > 0) or _su_bad | length > 0
