---
# Workflow 37's last step: the reviews the approval allowed (stigman_update_plan, from the STIG recheck's check through
# the approval step), written to STIG Manager - each read again first and written only if unchanged since the check,
# then read back (library/site_stigman_update.py); a review with attachments is left as it is
# (stigman_update_skip_attachments). A new asset of the plan (0.72.0) is created first, if still not there, and its
# reviews written to it. A Check run reads and writes nothing. The report says what became of
# each; a review not written (rejected, an error) fails the job.
- name: STIG Manager update | the plan from the workflow's check (stigman_update_plan)
  ansible.builtin.assert:
    that: stigman_update_plan is defined and stigman_update_plan is sequence and stigman_update_plan is not string
    fail_msg: >-
      No plan: this job writes only the reviews the STIG recheck's or the checklist import's check listed and an approval
      allowed - run it as the step after the approval in workflow 37 (docs/STIG_DRIFT.md, "Updating STIG Manager, with an
      approval") or 40 (docs/CKL_IMPORT.md). Nothing written.
    quiet: true

- name: STIG Manager update | where and as whom
  ansible.builtin.set_fact:
    _su_login:
      api: "{{ stigman_update_api }}"
      token_url: "{{ stigman_update_token_url or lookup('ansible.builtin.env', 'STIGMAN_TOKEN_URL') }}"
      client_id: "{{ stigman_update_client_id or lookup('ansible.builtin.env', 'STIGMAN_CLIENT_ID') }}"

- name: STIG Manager update | STIG Manager and its credential are set
  ansible.builtin.assert:
    that:
      - _su_login.api | length > 0
      - _su_login.token_url | length > 0
      - _su_login.client_id | length > 0
    fail_msg: >-
      Set check_stig_stigman_api (all.yml, as for the STIG drift report) and attach the "STIG Manager API" credential of
      the client that may write reviews. Nothing written.
    quiet: true

- name: STIG Manager update | create the approved new assets, write the approved reviews - each only if unchanged since the check read it
  site_stigman_update:
    api: "{{ _su_login.api }}"
    token_url: "{{ _su_login.token_url }}"
    client_id: "{{ _su_login.client_id }}"
    client_secret: "{{ stigman_update_client_secret or lookup('ansible.builtin.env', 'STIGMAN_CLIENT_SECRET') }}"
    scope: "{{ stigman_update_scope }}"
    plan: "{{ stigman_update_plan }}"
    validate_certs: "{{ stigman_update_validate_certs | bool }}"
    ca_path: "{{ stigman_update_ca_path }}"
    timeout: "{{ stigman_update_timeout | int }}"
    skip_attachments: "{{ stigman_update_skip_attachments | bool }}"
  register: _su
  when: stigman_update_plan | length > 0

- name: STIG Manager update | each review
  ansible.builtin.debug:
    msg: >-
      {{ [_su.error] if _su.error | default('') else
         (_su['items'] | default([]) | stig_update_item_lines) or ['nothing to write: the plan is empty'] }}

- name: STIG Manager update | the report
  ansible.builtin.include_role:
    name: site_email
  vars:
    _report: "{{ _su['items'] | default([]) | stig_update_report(ansible_check_mode, _su.error | default(''), stigman_update_plan | length,
                     'import' if stigman_update_plan | selectattr('kind', 'defined') | selectattr('kind', 'eq', 'import') | list else '') }}"

- name: STIG Manager update | not every review was written
  ansible.builtin.fail:
    msg: >-
      {{ _su.error if _su.error | default('') else
         (_su_bad | length | string) ~ ' review(s) not written: ' ~ (_su_bad | map(attribute='line') | zip(_su_bad | map(attribute='why'))
                                                                      | map('join', ': ') | join('; ')) }}
  vars:
    _su_bad: "{{ _su['items'] | default([]) | selectattr('state', 'in', ['rejected', 'error', 'bad', 'not as written']) | list }}"
  when: _su.error | default('') or _su_bad | length > 0
