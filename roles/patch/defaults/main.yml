---
# PATCH: install updates with dnf, reboot if the updates need it, and prove the host came back:
# every service that was running before must be running after. One host at a time by default;
# the rollout stops at the first host that fails.

patch_packages: ['*']                    # what to update ('*' = everything that has an update)
patch_security_only: false               # true = only updates that fix security advisories
patch_exclude: []                        # never update these here, e.g. ['mariadb*', 'kernel*']
# How many hosts are patched at the same time (1 = one by one: the rollout stops at the first host that
# fails). ONLY in the job template's Variables, a survey or the launch: Ansible picks the batch size before
# it reads all.yml or any group or host variables, so set there it does nothing.
patch_serial: 1

# NO AUTOMATIC RESTARTS unless you say so: this playbook reboots a host only when
# automatic_restarts is true (set it in the job template's Variables, or answer the survey), and
# then only as patch_reboot says. With automatic_restarts false (the default) it installs the
# updates and tells you which hosts still need a reboot; a person reboots them.
automatic_restarts: false
# Reboot (only with automatic_restarts: true): when_needed (needs-restarting says so) | never | always
patch_reboot: when_needed
patch_reboot_timeout: 1800               # seconds to wait for the host to come back
# Hosts in these groups are patched but NEVER rebooted by this playbook (reboot them by hand,
# in a maintenance window). Add your own group names; the built-in protection below is on always.
patch_never_reboot_groups: [aap, aap_hosts, sat, netapp, netapp_console_hosts]
# Hosts in these groups are skipped entirely (Satellite is upgraded with satellite-maintain, not dnf).
patch_never_patch_groups: [no_patch, aap, aap_hosts, sat, netapp, netapp_console_hosts]
# BUILT IN, whatever you set above (roles/patch/vars/main.yml): the AAP hosts (groups aap and
# aap_hosts) are never patched and never rebooted by a job, and neither is the machine the job
# runs from (a local connection). A package script can restart services under the running job.
# Set the two lists above only to ADD groups; you cannot remove AAP from the protection.
# A host that cannot be reached when the job starts (switched off, a firewall, ssh or its login refused): true = it is
# listed as NOT REACHED and left out - not patched, no snapshot - and the other hosts are patched; the job is not
# failed for it, and its last lines list every host not reached. false = it fails, and the rollout stops. No host
# reached at all always fails the job (the machine credential?), and a host lost later (it went down halfway, did
# not come back from its reboot) always fails it and stops the rollout.
patch_skip_unreachable: true
# RHEL 8 and later are patched with dnf, RHEL 7 and its clones with yum. A host with neither (not a RHEL-like Linux):
# true = it is listed as NO DNF OR YUM and left out - not patched, no snapshot - and the job is not failed for it; its
# last lines list every such host. false = it fails at the update.
patch_skip_unsupported: true
# A host that answers but where the job cannot become root (sudo refused, its password wrong or missing), or with less
# than patch_min_free_mb free in /var: true = it is listed as NOT READY and left out - nothing changed on it, nothing
# cleaned up - and the job is not failed for it; its last lines list every such host. false = it fails, and the rollout
# stops.
patch_skip_not_ready: true
patch_min_free_mb: 1024                  # free space needed in /var before starting
patch_service_wait: 120                  # seconds to wait for services to come back after a reboot
# Services that come and go on their own and are not compared before/after (regular expression). dbus-: = the helpers
# D-Bus starts on demand and that end on their own (dbus-:1.1-org.fedoraproject.SetroubleshootPrivileged@83.service)
patch_ignore_services: '^(user@|user-runtime-dir@|session-|dnf-makecache|packagekit|fwupd|run-|dbus-:|setroubleshootd|systemd-(hostnamed|timedated|localed|coredump))'
# Which services must run again after the update: enabled = the ones that start at boot (systemctl is-enabled: enabled,
# generated - an init script on RHEL 7); a service started on demand (static, indirect, transient: D-Bus, a socket,
# another unit) that ended on its own is listed, never failed. all = every service that was running (before 0.89.0).
patch_compare_services: enabled

# ---- A VMware snapshot of each VM right before it is patched ----

# true = just before a host is patched (in its batch: patch_serial), vCenter takes a snapshot of its VM, without
# memory, named patch_snapshot_name. Attach a "VMware vCenter" credential to the template as well as the Machine
# one. Every host's VM is found once, before any host is patched: the host variable vmware_vm_name (the VM's name in
# vCenter) when set; else a VM named like the host (web01.yoursite.mil or web01); else the VM whose guest host name
# (VMware Tools) is the host's; else the VM with its ansible_host address. A host whose VM is in no vCenter is a
# physical server: patched without a snapshot, and the job says so (patch_snapshot_required). A host that matches two
# VMs stops the job before anything is patched. A snapshot that fails: that host is not patched, and
# the rollout stops. Delete the snapshots once the patching is proven: "VM - snapshot cleanup"
# (vm_snapshot_cleanup_name_words: [patching]). docs/RUNBOOKS.md, "Snapshot before patching".
patch_snapshot: false
patch_snapshot_name: patching            # the snapshot's name (the AAP job, user and date go in its description)
patch_snapshot_quiesce: false            # true = VMware Tools freezes the file systems first (slower; fails without Tools)
# false = a host whose VM is in no vCenter is a physical server: patched without a snapshot, and the job says so. When a
# vCenter could not be read, such a host may be a VM there, and the job stops before anything is patched.
# true = a host without a VM stops the job too (every host must be a VM, each patched only after its snapshot).
patch_snapshot_required: false
# A VM that still has a snapshot named patch_snapshot_name (the last patching's, not deleted yet) stops the job before
# anything is patched, and the job names them. true = delete that old snapshot, then take the new one.
patch_snapshot_replace: false
# ---- Protected VMs ----
# A host on the VMware protected lists is not patched: one of its groups is in vmware_protected_groups, or its name, short
# name, vmware_vm_name or VM in vCenter matches vmware_protected_vms or vm_snapshot_cleanup_exclude_vms (* and ? allowed,
# any case) - the VMs the snapshot cleanup never touches. Set those lists in all.yml, so this job sees them too.
# To patch them anyway, each one only after its own snapshot (patch_snapshot: true; its VM must be found, whatever
# patch_snapshot_required says): true = all of them, or a list of names (* and ? allowed) = only those. AAP never.
patch_protected_with_snapshot: false
