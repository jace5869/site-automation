---
# SNAPSHOT BEFORE PATCHING (patch_snapshot), step 1 - once, before any host is patched, on the AAP side
# (playbooks/patch_hosts.yml includes it run_once, delegated to localhost): each host to patch and its VM in vCenter,
# and the snapshots named patch_snapshot_name those VMs still have. The job stops here - nothing patched yet - when a
# host's VM is not found and a vCenter was not read (or patch_snapshot_required), a host matches two VMs, or an old snapshot is still there
# (patch_snapshot_replace false). A snapshot of that name younger than patch_snapshot_reuse_hours is a run of a moment
# ago (the job run again): kept and reused - no second one, nothing stopped. Output: _patch_snap on localhost, read by vmware_vm patch_snapshot.yml in each batch.
# 1.74.0: with patch_continue_on_failure (true, the default) only that host is left out - COULD NOT PATCH in the report -
# and the others go on; false = the job stops, as before.
# 1.70.5: also without patch_snapshot, when the VMware protected lists name VMs (patch_protected_vm_lookup): each host's
# VM is found so a host whose inventory name is not its VM name is still protected - then a host whose VM is not known
# for sure (two VMs, conflicting evidence, a vCenter not read) stops the job only when that could hide a protected VM.
# A vmware_vm_name that names no VM always stops it; patch_physical: true (a host variable) says a host is no VM.
- name: Patch | the hosts to patch (the protected ones are never patched, so get no snapshot either)
  ansible.builtin.set_fact:
    _patch_snap_mode: "{{ patch_snapshot | bool }}"
    _patch_snap_physical: >-
      {{ ansible_play_hosts | select('in', ansible_play_hosts | map('extract', hostvars) | selectattr('patch_physical', 'defined')
         | selectattr('patch_physical') | map(attribute='inventory_hostname') | list) | list }}
    _patch_snap_hosts: >-
      {%- set prot = (patch_never_patch_groups + _patch_always_no_patch + ['no_patch', 'aap', 'aap_hosts']) | unique -%}
      {%- set out = [] -%}
      {%- for h in ansible_play_hosts if hostvars[h].group_names | intersect(prot) | length == 0 and not hostvars[h].patch_physical | default(false) | bool -%}
      {%-   set _ = out.append(h) -%}
      {%- endfor -%}
      {{ out }}

- name: Patch | each host's VM in vCenter
  ansible.builtin.include_role:
    name: vmware_vm
    tasks_from: patch_vms.yml

# A host on the VMware protected lists that patch_protected_with_snapshot does not name is not patched: it stops
# nothing here (no VM, two VMs, an old snapshot), and it gets no snapshot.
- name: Patch | the protected VMs that are not patched
  ansible.builtin.set_fact:
    _patch_snap: >-
      {%- set skip = {} -%}
      {%- for h in _patch_snap_hosts -%}
      {%-   set p = h | patch_protected(hostvars, _patch_snap.vms[h].name if h in _patch_snap.vms else '',
                                        vmware_protected_groups | default([]), vmware_protected_vms | default([]),
                                        vm_snapshot_cleanup_exclude_vms | default([]), patch_protected_with_snapshot) -%}
      {%-   if p.reason and not p.allowed -%}{%- set _ = skip.update({h: p.reason}) -%}{%- endif -%}
      {%- endfor -%}
      {%- set keep = {} -%}
      {%- for k in ['missing', 'twice', 'conflict', 'old'] -%}
      {%-   set _ = keep.update({k: _patch_snap[k] | dict2items | rejectattr('key', 'in', skip) | items2dict}) -%}
      {%- endfor -%}
      {{ _patch_snap | combine(keep, {'protected': skip, 'physical': _patch_snap_physical}) }}

# the job run again within patch_snapshot_reuse_hours (0 = never): its newest "patching" is this patching's, kept
- name: Patch | a snapshot from a run of a moment ago, reused (patch_snapshot_reuse_hours)
  ansible.builtin.set_fact:
    _patch_snap: >-
      {%- set reuse = {} -%}
      {%- set old = {} -%}
      {%- for h, snaps in (_patch_snap.old if _patch_snap_mode | bool else {}).items() -%}
      {%-   set newest = snaps | sort(attribute='age_days_exact') | first -%}
      {%-   if patch_snapshot_reuse_hours | float > 0 and newest.age_days_exact | float * 24 <= patch_snapshot_reuse_hours | float -%}
      {%-     set _ = reuse.update({h: newest}) -%}
      {%-   else -%}
      {%-     set _ = old.update({h: snaps}) -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ _patch_snap | combine({'old': old, 'reuse': reuse}) }}

- name: Patch | the snapshot before patching, for each host
  ansible.builtin.debug:
    msg: >-
      {%- set out = [] -%}
      {%- for h in _patch_snap_physical -%}
      {%-   set _ = out.append(h ~ ': PHYSICAL (patch_physical: true) - not looked up, patched without a snapshot') -%}
      {%- endfor -%}
      {%- for h in _patch_snap_hosts -%}
      {%-   if h in _patch_snap.protected -%}
      {%-     set _ = out.append(h ~ ': PROTECTED - not patched (' ~ _patch_snap.protected[h] ~ ')') -%}
      {%-   elif h in _patch_snap.vms -%}
      {%-     set v = _patch_snap.vms[h] -%}
      {%-     set _ = out.append(h ~ ': VM ' ~ v.name ~ ' (by ' ~ v.how ~ (', ' ~ v.vcenter | vc_short if _patch_snap.multi else '') ~ ')'
                               ~ (' - its old snapshot "' ~ patch_snapshot_name ~ '" is deleted first' if h in _patch_snap.old and patch_snapshot_replace | bool else '')
                               ~ (' - reusing the snapshot "' ~ patch_snapshot_name ~ '" from ' ~ _patch_snap.reuse[h].created | replace('T', ' ') | replace('Z', ' UTC')
                                  ~ ' (' ~ (_patch_snap.reuse[h].age_days_exact | float * 24) | round(1) ~ ' h ago; patch_snapshot_reuse_hours '
                                  ~ patch_snapshot_reuse_hours ~ ')' if h in _patch_snap.reuse else '')) -%}
      {%-   elif h in _patch_snap.twice -%}
      {%-     set _ = out.append(h ~ ': TWO VMs or more - ' ~ _patch_snap.twice[h] | join(', ')) -%}
      {%-   elif h in _patch_snap.conflict -%}
      {%-     set _ = out.append(h ~ ': WHICH VM IS NOT SURE - ' ~ _patch_snap.conflict[h]) -%}
      {%-   else -%}
      {%-     set _ = out.append(h ~ ': NO VM - ' ~ _patch_snap.missing[h] ~ ('' if patch_snapshot_required | bool or _patch_snap.unread or hostvars[h].vmware_vm_name | default('') | string | trim
                                 else (' (a physical server: patched without a snapshot)' if _patch_snap_mode | bool else ' (a physical server)'))) -%}
      {%-   endif -%}
      {%- endfor -%}
      {%- if _patch_snap.unread -%}
      {%-   set _ = out.append('vCenter(s) NOT read - a VM there is not found: ' ~ _patch_snap.unread | join('; ')) -%}
      {%- endif -%}
      {{ out or ['No host to patch.'] }}

# Each problem: {host ('' = the job's own note), reason (the report's word), text}. 1.74.0: with
# patch_continue_on_failure (true, the default) such a host is COULD NOT PATCH (patch_could_not on it) and left out, the
# others go on; false - the job stops here as before, nothing patched.
- name: Patch | which hosts' VMs are not sure, and the old snapshots in the way
  ansible.builtin.set_fact:
    _patch_snap_why: >-
      {%- set out = [] -%}
      {%- for h, names in _patch_snap.twice.items() if h in _patch_unsure -%}
      {%-   set _ = out.append({'host': h, 'reason': 'TWO VMs', 'text': h ~ ' matches more than one VM (' ~ names | join(', ') ~ '): set vmware_vm_name for it (a host variable: the name of its VM in vCenter).'}) -%}
      {%- endfor -%}
      {%- for h, why in _patch_snap.conflict.items() if h in _patch_unsure -%}
      {%-   set _ = out.append({'host': h, 'reason': 'WHICH VM IS NOT SURE', 'text': h ~ ': which VM it is, is not sure - ' ~ why ~ '.'}) -%}
      {%- endfor -%}
      {#- a vmware_vm_name that names no VM: a mistake, never a physical server (1.70.5) -#}
      {%- for h, why in _patch_snap.missing.items() if hostvars[h].vmware_vm_name | default('') | string | trim -%}
      {%-   set _ = out.append({'host': h, 'reason': 'VM NOT FOUND', 'text': h ~ ': vmware_vm_name is ' ~ hostvars[h].vmware_vm_name ~ ', and ' ~ why
                                 ~ ' in vCenter: correct vmware_vm_name, or set patch_physical: true for a server that is no VM.'}) -%}
      {%- endfor -%}
      {%- set missing = {} -%}
      {%- for h, why in _patch_snap.missing.items() if not hostvars[h].vmware_vm_name | default('') | string | trim -%}
      {%-   set _ = missing.update({h: why}) -%}
      {%- endfor -%}
      {%- if ((patch_snapshot_required | bool and _patch_snap_mode | bool) or _patch_snap.unread) and missing -%}
      {%-   for h, why in missing.items() -%}{%- set _ = out.append({'host': h, 'reason': 'VM NOT FOUND', 'text': h ~ ': ' ~ why ~ '.'}) -%}{%- endfor -%}
      {%-   if _patch_snap.unread -%}{%- set _ = out.append({'host': '', 'reason': '', 'text': 'Not read: ' ~ _patch_snap.unread | join('; ') ~ '.'}) -%}{%- endif -%}
      {%-   if _patch_snap.unread -%}
      {%-     set _ = out.append({'host': '', 'reason': '', 'text': 'A vCenter was not read, so these may be VMs there: fix that vCenter or its credential (vmware_vcenters),'
                                   ~ ' or leave them out of this run (Limit). A server that is no VM: patch_physical: true.'}) -%}
      {%-   else -%}
      {%-     set _ = out.append({'host': '', 'reason': '', 'text': 'No vCenter has them (physical servers?): patch_snapshot_required is true. Leave them out of this run (Limit),'
                                   ~ ' set patch_physical: true for each (a host variable), or patch_snapshot_required: false to patch them without a snapshot.'}) -%}
      {%-   endif -%}
      {%- endif -%}
      {%- if not patch_snapshot_replace | bool and _patch_snap_mode | bool -%}
      {%-   for h, snaps in _patch_snap.old.items() -%}
      {%-     for s in snaps -%}
      {%-       set _ = out.append({'host': h, 'reason': 'OLD SNAPSHOT IN THE WAY', 'text': _patch_snap.vms[h].name ~ ' (' ~ h ~ ') still has the snapshot "' ~ s.name ~ '" from '
                                 ~ s.created | default('?') | replace('T', ' ') | replace('Z', ' UTC') ~ ' (' ~ s.age_days | default('?')
                                 ~ ' days): delete it once that patching is proven (VM - snapshot delete, or VM - snapshot cleanup),'
                                 ~ ' or run with patch_snapshot_replace: true to replace it.'}) -%}
      {%-     endfor -%}
      {%-   endfor -%}
      {%- endif -%}
      {{ out }}
  vars:
    # without patch_snapshot (the VM-name protection only): a host whose VM is not sure stops only when one of its
    # candidate VMs is on the protected lists
    _patch_prot_pats: "{{ (vmware_protected_vms | default([]) | name_list) + (vm_snapshot_cleanup_exclude_vms | default([]) | name_list) }}"
    _patch_unsure: >-
      {%- set out = [] -%}
      {%- for h in (_patch_snap.twice.keys() | list) + (_patch_snap.conflict.keys() | list) -%}
      {%-   if _patch_snap_mode | bool or (_patch_snap.candidates[h] | default([]) | map('name_matches', _patch_prot_pats) | select | list) -%}
      {%-     set _ = out.append(h) -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ out }}

- name: Patch | every host has its VM, and no old snapshot "{{ patch_snapshot_name }}" is in the way
  ansible.builtin.assert:
    that: _patch_snap_why | length == 0
    fail_msg: >-
      Nothing was patched: {{ _patch_snap_why | map(attribute='text') | join(' ') }}
    quiet: true
  when: not patch_continue_on_failure | bool

# 1.74.0: each such host COULD NOT PATCH, on the host's own facts (set here on the AAP side - nothing touches it)
- name: Patch | the hosts whose VM is not sure - COULD NOT PATCH, the others go on (patch_continue_on_failure)
  ansible.builtin.set_fact:
    patch_could_not:
      reason: "{{ (_patch_snap_why | selectattr('host', 'equalto', item) | first).reason }}"
      detail: >-
        {{ (_patch_snap_why | selectattr('host', 'equalto', item) | map(attribute='text') | list
            + _patch_snap_why | selectattr('host', 'equalto', '') | map(attribute='text') | list) | join(' ') }}
  delegate_to: "{{ item }}"
  delegate_facts: true
  loop: "{{ _patch_snap_why | map(attribute='host') | select | unique | list }}"
  when: patch_continue_on_failure | bool

- name: Patch | keep it for the batches
  ansible.builtin.set_fact:
    _patch_snap: "{{ _patch_snap }}"
  delegate_to: localhost
  delegate_facts: true
