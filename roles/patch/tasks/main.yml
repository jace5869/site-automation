---
# PATCH one host: guards -> the VMware snapshot of its VM (patch_snapshot) -> remember running services ->
# dnf update -> reboot if needed and allowed -> the same services must be running again. Check mode (a dry run)
# shows what would be updated and changes nothing.

- name: Patch | which groups are protected (yours, plus AAP - built in)
  ansible.builtin.set_fact:
    _patch_no_patch: "{{ (patch_never_patch_groups + _site_always_protected) | unique }}"
    _patch_no_reboot: "{{ (patch_never_reboot_groups + _site_always_protected) | unique }}"

# ['aap', 'aap_hosts'] is written out below as well, on purpose: an extra variable (-e) can override
# any variable, even these internal lists, but not a literal - no setting and no list name can remove AAP.
- name: Patch | say why a protected host is skipped
  ansible.builtin.debug:
    msg: "{{ inventory_hostname }} is in {{ group_names | intersect(_patch_no_patch + ['aap', 'aap_hosts']) | join(', ') }}: never patched by automation. Patch it by hand in a maintenance window."
  when: group_names | intersect(_patch_no_patch + ['aap', 'aap_hosts']) | length > 0

- name: Patch | skip hosts in the never-patch groups (patch_never_patch_groups, and AAP always)
  ansible.builtin.meta: end_host
  when: group_names | intersect(_patch_no_patch + ['aap', 'aap_hosts']) | length > 0

# The VMware protected lists (vmware_protected_groups, vmware_protected_vms, vm_snapshot_cleanup_exclude_vms): such a
# host is patched only with patch_protected_with_snapshot naming it and its own snapshot taken first (patch_snapshot).
- name: Patch | is it on the VMware protected lists
  ansible.builtin.set_fact:
    _patch_prot: >-
      {{ inventory_hostname | patch_protected(hostvars,
           (hostvars['localhost']._patch_snap.vms[inventory_hostname].name | default(''))
             if hostvars['localhost']._patch_snap is defined else '',
           vmware_protected_groups | default([]), vmware_protected_vms | default([]),
           vm_snapshot_cleanup_exclude_vms | default([]), patch_protected_with_snapshot)
         if inventory_hostname not in (hostvars['localhost']._patch_snap.protected | default({})) else
         {'reason': hostvars['localhost']._patch_snap.protected[inventory_hostname], 'allowed': false} }}
    _patch_prot_vm: >-
      {{ patch_snapshot | bool and hostvars['localhost']._patch_snap is defined
         and inventory_hostname in hostvars['localhost']._patch_snap.vms }}

- name: Patch | say why a protected VM is skipped
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }} is protected ({{ _patch_prot.reason }}): not patched.
      {{ ('patch_protected_with_snapshot does not name it.' if patch_snapshot | bool else
          'To patch it after a snapshot of its VM: patch_snapshot: true and patch_protected_with_snapshot (true, or a list naming it).')
         if not _patch_prot.allowed else
         ('Its VM was not found in vCenter, and a protected host is patched only after its own snapshot.' if patch_snapshot | bool else
          'To patch it after a snapshot of its VM: patch_snapshot: true (patch_protected_with_snapshot names it already).') }}
  when: _patch_prot.reason | length > 0 and not (_patch_prot.allowed and _patch_prot_vm)

- name: Patch | skip a protected VM (no patch_protected_with_snapshot for it, or no snapshot)
  ansible.builtin.meta: end_host
  when: _patch_prot.reason | length > 0 and not (_patch_prot.allowed and _patch_prot_vm)

- name: Patch | a protected VM, patched after its snapshot (patch_protected_with_snapshot)
  ansible.builtin.debug:
    msg: "{{ inventory_hostname }} is protected ({{ _patch_prot.reason }}): patched after a snapshot of its VM, as patch_protected_with_snapshot says."
  when: _patch_prot.reason | length > 0

- name: Patch | never patch the machine AAP is running this job from
  ansible.builtin.assert:
    that:
      - ansible_connection | default('ssh') != 'local'
      - inventory_hostname not in ['localhost', '127.0.0.1', '::1']
    fail_msg: "Refusing to patch {{ inventory_hostname }}: it is the machine running this job (local connection)."
    quiet: true

- name: Patch | free space in /var
  ansible.builtin.command: df -P -m /var
  register: _patch_df
  changed_when: false
  check_mode: false

- name: Patch | enough room for the update
  ansible.builtin.assert:
    that: (_patch_df.stdout_lines[-1].split()[3] | int) >= patch_min_free_mb | int
    fail_msg: >-
      Only {{ _patch_df.stdout_lines[-1].split()[3] }} MB free in /var (need {{ patch_min_free_mb }} MB):
      not patching. Free space first (see the health check's disk findings).
    quiet: true

- name: Patch | VMware snapshot "{{ patch_snapshot_name }}" of its VM, right before the update (patch_snapshot)
  ansible.builtin.include_role:
    name: vmware_vm
    tasks_from: patch_snapshot.yml
    apply:
      delegate_to: localhost
      become: false
  vars:
    ansible_connection: local
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  when: patch_snapshot | bool

- name: Patch | services running before the update
  ansible.builtin.shell: >-
    set -o pipefail;
    systemctl list-units --type=service --state=running --no-legend --plain --no-pager
    | awk '{print $1}' | { grep -vE {{ patch_ignore_services | quote }} || true; } | sort
  register: _patch_before
  changed_when: false
  check_mode: false

- name: Patch | install the updates{{ ' (security only)' if patch_security_only | bool else '' }}
  ansible.builtin.dnf:
    name: "{{ patch_packages }}"
    state: latest
    update_only: true
    security: "{{ patch_security_only | bool }}"
    exclude: "{{ patch_exclude }}"
  register: _patch_dnf

- name: "Patch | what was updated{{ ' (dry run - what WOULD be updated)' if ansible_check_mode else '' }}"
  ansible.builtin.debug:
    msg: >-
      {{ (('DRY RUN (Check mode), nothing was installed - would make ' if ansible_check_mode else '')
          ~ (_patch_dnf.results | default([])) | length ~ ' change(s): ' ~ (_patch_dnf.results | default([]) | join('; ') | truncate(3000)))
         if _patch_dnf.changed else 'nothing to update' }}

- name: Patch | does the host need a reboot now?
  ansible.builtin.command: needs-restarting -r
  register: _patch_needs
  changed_when: false
  failed_when: false
  check_mode: false

# needs-restarting -r: 0 = no reboot needed, 1 = needed. Anything else (not installed: dnf-utils / yum-utils, or
# it failed) does not tell - after updates that counts as needed, never as "no reboot".
- name: Patch | needs-restarting could not tell
  ansible.builtin.debug:
    msg: >-
      needs-restarting -r did not answer (rc {{ _patch_needs.rc | default('?') }}: {{ (_patch_needs.stderr | default('')
      or _patch_needs.msg | default('')) | truncate(200) }}) - install dnf-utils (RHEL 8/9: dnf-plugins-core; RHEL 7:
      yum-utils). {{ 'Updates were installed, so a reboot counts as needed.' if _patch_dnf.changed else 'Nothing was updated.' }}
  when: _patch_needs.rc | default(-1) not in [0, 1]

- name: Patch | decide
  ansible.builtin.set_fact:
    _patch_reboot_needed: >-
      {{ _patch_needs.rc | default(-1) == 1 or patch_reboot == 'always'
         or (_patch_needs.rc | default(-1) not in [0, 1] and _patch_dnf.changed | default(false)) }}
    _patch_reboot_allowed: >-
      {{ automatic_restarts | bool and patch_reboot != 'never'
         and group_names | intersect(_patch_no_reboot) | length == 0 }}

- name: Patch | reboot
  ansible.builtin.reboot:
    msg: "Rebooting after updates (Ansible Automation Platform job {{ awx_job_id | default('-') }})"
    reboot_timeout: "{{ patch_reboot_timeout | int }}"
  when: _patch_reboot_needed | bool and _patch_reboot_allowed | bool and group_names | intersect(['aap', 'aap_hosts']) | length == 0

- name: Patch | a reboot is needed but not allowed here
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }} needs a reboot to finish the updates, but this playbook does not reboot it
      ({{ 'automatic restarts are off: automatic_restarts is false' if not automatic_restarts | bool
          else 'patch_reboot=never' if patch_reboot == 'never'
          else 'it is in ' ~ (group_names | intersect(_patch_no_reboot) | join(', ')) }}).
      Reboot it by hand in a maintenance window{{ ', or run again with automatic_restarts: true' if not automatic_restarts | bool else '' }}.
  when: _patch_reboot_needed | bool and not (_patch_reboot_allowed | bool)

- name: Patch | the services that were running are running again
  ansible.builtin.shell: >-
    set -o pipefail;
    systemctl list-units --type=service --state=running --no-legend --plain --no-pager
    | awk '{print $1}' | sort
  register: _patch_after
  changed_when: false
  check_mode: false
  until: _patch_before.stdout_lines | difference(_patch_after.stdout_lines) | length == 0
  retries: "{{ (patch_service_wait | int / 10) | int }}"
  delay: 10
  failed_when: false

- name: Patch | result
  ansible.builtin.debug:
    msg:
      updated: "{{ ('would update (dry run - nothing was installed)' if ansible_check_mode else true) if _patch_dnf.changed else false }}"
      rebooted: "{{ _patch_reboot_needed | bool and _patch_reboot_allowed | bool and not ansible_check_mode }}"
      reboot_still_needed: "{{ _patch_reboot_needed | bool and not (_patch_reboot_allowed | bool) }}"
      services_not_back: "{{ _patch_before.stdout_lines | difference(_patch_after.stdout_lines) }}"
      snapshot: "{{ _patch_snapshot | default('none (patch_snapshot is false)') }}"

- name: Patch | FAIL - services that ran before the update are not running now
  ansible.builtin.fail:
    msg: >-
      After patching {{ inventory_hostname }}, these services are not running:
      {{ _patch_before.stdout_lines | difference(_patch_after.stdout_lines) | join(', ') }}.
      Look with: systemctl status <service>; journalctl -u <service> -b
  when: _patch_before.stdout_lines | difference(_patch_after.stdout_lines) | length > 0
