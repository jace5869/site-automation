---
# MAIL RELAY WHITELIST, with an approval: add IP addresses or subnets to the list of clients the mail relay
# lets relay - with a comment saying who or what they are for - or remove them. The plan job
# (playbooks/mail_relay_plan.yml) checks the request, reads the list on every relay server and emails what would
# change - "waiting for approval"; it changes nothing. After a person approves in AAP, the approved job
# (playbooks/mail_relay_approved.yml) writes exactly that (the file backed up first), checks the mail configuration
# and that Postfix reads the list as written, reloads Postfix and emails the result; a failed check puts the file
# back. The format job (playbooks/mail_relay_format.yml) puts each relay's list one address or subnet per line -
# subnets first, then the single addresses, in number order - each single address with a comment line above it:
# its name in DNS (looked up on the relay) and the folder the VM that has it is in, in vCenter ("# web01.example.mil
# Payroll [AAP]"); the list keeps exactly its addresses, a copy of main.cf is
# kept first. The unused job (playbooks/mail_relay_unused.yml) reads each relay's mail logs and plans the removal of the
# addresses that sent no mail in mail_relay_unused_days - the same approval and apply step as a removal. docs/MAIL_RELAY.md

# ---- The request (a survey on the workflow) -----------------------------------------------------
mail_relay_action: ""                    # add or remove: set in each workflow's Variables (one workflow per action)
# one address (198.51.100.3), a subnet (198.51.100.0/24), or several separated by commas: "198.51.100.3, 198.51.100.4"
mail_relay_ip: ""
# add: required - the name and/or service the addresses are for, e.g. "Payroll app (svc-payroll)". Written above
# the mynetworks line, one line per address: "# 198.51.100.3       Payroll app (svc-payroll)  [added 2026-10-22 by jdoe]"
mail_relay_comment: ""
mail_relay_requested_by: ""              # who asked (e.g. sent by Orchestrator); "" = the AAP user who launched it

# ---- The relay servers and their list -----------------------------------------------------------
mail_relay_group: mail_relays            # the inventory group of the mail relay servers: every one is changed
# main_cf: the list is the mynetworks line of Postfix's main.cf ("mynetworks = 127.0.0.0/8, 192.0.2.10"); an
# address is added at the end of the line (", 198.51.100.3"). file: a list file with one address per line
# (mynetworks = /etc/postfix/mynetworks, or a Postfix access map), its comment on the line above it.
mail_relay_style: main_cf
mail_relay_file: /etc/postfix/main.cf    # the file with the list on each relay (a relay's own host_vars may differ)
mail_relay_parameter: mynetworks         # main_cf: the parameter that holds the list
mail_relay_postconf: postconf            # main_cf: after a change, read the list back as Postfix does ("" = do not)
mail_relay_entry_suffix: ""              # file: after the address on its line: " OK" for a Postfix access map
mail_relay_postmap: false                # file: true = run postmap on the file after a change (a hash: or lmdb: map)
mail_relay_check_command: postfix check  # run after a change; when it fails the file is put back ("" = no check)
mail_relay_reload_service: postfix       # reloaded after a change ("" = no reload)
mail_relay_become: true                  # change the file as root (sudo)

# ---- What a request may ask for -----------------------------------------------------------------
mail_relay_allow_subnets: true           # a subnet (198.51.100.0/24) too; false = single addresses only
mail_relay_min_prefix: 24                # the widest subnet accepted (/24 = 256 addresses); 0.0.0.0/0 and the like never
mail_relay_max_ips: 20                   # the most addresses in one request
mail_relay_comment_min: 3                # the comment's least characters
mail_relay_comment_max: 200              # the comment's most characters

# ---- The format job (playbooks/mail_relay_format.yml) -----------------------------------------
mail_relay_format_dns: true              # look up each single address's name on the relay (getent hosts: DNS, /etc/hosts)
mail_relay_format_dns_timeout: 5         # seconds for one lookup
mail_relay_format_vmware: true           # find the VM that has the address (needs the "VMware vCenter" credential)
mail_relay_format_blank_lines: true      # a blank line between the single addresses (Postfix skips it)
mail_relay_format_refresh: false         # true = look up again the addresses this job named before (others kept)
mail_relay_format_reload: false          # true = reload Postfix after (the list is the same: no need)
mail_relay_format_check_email: true      # a dry run (Check) emails its report too, marked DRY RUN (false = only printed)

# ---- The unused addresses (playbooks/mail_relay_unused.yml: workflow "Mail relay - remove unused addresses") ------
mail_relay_unused_days: 183              # an address that sent no mail through any relay in this many days is unused (183: six months)
mail_relay_unused_logs: ["/var/log/maillog*"]  # Postfix's log files on each relay (patterns; rotated and .gz copies too; a folder - /var/log/maillog_archive: every file in it and its folders)
mail_relay_unused_journal: auto          # auto = read the journal when no log file is there; true = as well; false = never
mail_relay_unused_keep: []               # addresses or subnets never proposed, e.g. [198.51.100.7, 203.0.113.0/28] (127.0.0.0/8 never is)
mail_relay_unused_max: 50                # the most addresses one plan removes (the next run takes the rest)
# The logs must go back mail_relay_unused_days on every relay (RHEL keeps about 5 weeks of /var/log/maillog): else
# nothing is proposed. true = propose anyway, from what the logs cover (the email says how far back they go).
mail_relay_unused_accept_short_logs: false

# ---- The approval email -------------------------------------------------------------------------
# Both emails (waiting for approval, and the result) go to report_email_to (set it on the workflow). A link for
# the approvers in the first one: your AAP's Workflow Approvals page, copied from the browser ("" = no link).
mail_relay_approve_url: ""
# The report website (report_web_dest): the plan, the result and the format's report are emailed only; true = also
# published there, as the other reports (a website that cannot be written then fails the job before the approval).
mail_relay_web: false
