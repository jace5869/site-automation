---
# TICKET INSIGHTS (playbooks/servicenow_insights.yml, docs/SERVICENOW_INSIGHTS.md): months of ServiceNow tickets in one
# report for management - the most common incident issues and their fix, the most requested services, keeping up (opened,
# resolved, the backlog and its age), P1/P2s, problem candidates, tickets passed between groups, changes that failed and
# what followed, close notes that say nothing, the All-stars of each team, knowledge article drafts. A web page for the
# whole site and one per team (report_web_dest), an email (report_email_to) with the workbook. ACT (GenAI) groups the
# incidents into issues and writes the fixes; names, phone numbers, email addresses, host names and IP addresses are
# replaced before anything reaches the model and put back after. From the AAP side with the "ServiceNow API" credential
# (the account needs read on the tables: itil). Read-only, in Check too.

# THE WINDOW. The last servicenow_insights_months months up to now (servicenow_insights_until), compared with the same
# length before it. servicenow_insights_days > 0 wins over the months (e.g. 30, 60). Dates and weeks follow
# report_time_zone (the email settings; "" = UTC).
servicenow_insights_months: 6
servicenow_insights_days: 0             # > 0: the last N days instead of the months
servicenow_insights_until: ""           # the last day (through its end, 2026-10-31), "" = now
servicenow_insights_compare: true       # read the window before as well: the changes against it (the tiles, rank ▲▼)

# The assignment groups reported on, exactly as ServiceNow names them: empty = every group (the whole site). A list, or
# text with one name per line or separated by ; or ,.
servicenow_insights_groups: []
# Each team's own page (every section of the report for that team) on the report website, and the Teams side by side
# table on the site's page. The teams are the groups named above, else the groups with at least
# servicenow_insights_team_min tickets in the window, the busiest first, at most servicenow_insights_teams_max.
servicenow_insights_team_pages: true
servicenow_insights_teams_max: 60       # at most this many teams with their own page
servicenow_insights_team_min: 10        # a group with at least this many tickets in the window is a team (no groups named)
# SITES, DIRECTORATES AND TEAMS (0.97.0): a page for each site and directorate with tickets, under All; teams as above.
# parents (the default): ServiceNow's group tree (sys_user_group, read only) - the site is the root group (its name's
# first " - " part), the directorate the group one below the root, the team the group (a team under a team stays a team
# of that directorate); a group with no way up to a root is Unknown. names: the site is the name's first " - " part; the
# directorate a word of servicenow_insights_suffix_directorates the name (or a parent below the root) ends in, else a word of the name in
# servicenow_insights_directorate_tags, else a staff code (J633, A6) in the name or the nearest parent's, else a second
# part in servicenow_insights_directorates, else the parent below the root, else Other. docs/SERVICENOW_INSIGHTS.md,
# "Sites, directorates and teams".
# map (1.8.0): your management's own org tree, any depth - every group placed ONLY by servicenow_insights_hierarchy_map,
# {"<exact group name>": ["Site", "Level1", "Level2", ...]} (a list, as names may hold "/" and "&"; or "Site > Level1 > ...");
# the group is the team under its levels. A page and rollup at every level; groups with tickets not in the map go to
# servicenow_insights_unmapped_bucket, listed in "How this was made" with their tickets, to add; tickets with no group to
# Unassigned. Keep the map in your all.yml - it names your organization. docs/SERVICENOW_INSIGHTS.md, "The org map".
servicenow_insights_hierarchy_source: parents   # parents, names or map
servicenow_insights_site_roots: []              # parents: the sites' root groups (exact names); [] = parentless groups with children
servicenow_insights_hierarchy_map: {}           # map: {"<exact group name>": [Site, Level1, ...]}; parents / names: {"<group>": {site: X, directorate: Y, team: Z}}, wins over either
servicenow_insights_unmapped_bucket: Unknown    # map: where the groups with tickets that are not in the map go (last)
servicenow_insights_custom_view: true           # map: the All page's Custom view (tick units and groups: their figures)
servicenow_insights_custom_view_max_rows: 30000  # its tickets carried in the page at most, about 55 bytes each. More: no Custom view
# PERIODS ON EVERY PAGE (1.39.0): the period bar at the top of the All page and of each unit's and team's page, with or
# without the map. A period chosen shows the At a glance tiles and the opened and resolved chart for it; the page's own
# tickets are carried in it (servicenow_insights_custom_view_max_rows each page). false = the window only.
servicenow_insights_page_periods: true
# map: the Custom view's own quick choices, besides the split's two ("<label>", "non-<label>"). Either
# {name: {levels: [SPLIT]}} (the groups whose map path has every level listed) or {name: {pattern: "*- Desk*"}}.
servicenow_insights_custom_view_presets: {}
# The periods of the Custom view (1.10.0) and of every page's bar (1.39.0), calendar ones, each against the one before. all = the window; this_month = the
# report end's month so far; 1m to 12m = the last N whole calendar months; 1w to 8w = the last N whole weeks (1.16.0). A
# period the page's tickets can not cover with the one before it is left out, said under the buttons. A from / to too.
servicenow_insights_periods: [all, this_month, 1m, 2m, 3m, 6m, 9m, 12m, 1w, 2w, 4w]
servicenow_insights_week_start: mon    # the day a week starts on, for the weeks (mon ... sun)
servicenow_insights_suffix_directorates: []     # names: [NOVA] - a group whose name ends in "- NOVA" is in NOVA
servicenow_insights_directorates: []            # names: second parts that name a directorate (e.g. [CODEX])
servicenow_insights_directorate_tags: {}        # names: {COMPONENTX: N6} - a whole word in a group's name puts it there
servicenow_insights_directorate_alias: {}       # names: {J602: J60} - rename or merge directorates
servicenow_insights_use_group_parents: true     # read the groups' parents in ServiceNow (sys_user_group); refused: by the names
servicenow_insights_known_groups_only: false    # true: a group not in the map goes in Unknown (to find and map later)
servicenow_insights_exclude_groups: []          # no team page for these (names or patterns, e.g. ["* - Legacy*"]); tickets still count
servicenow_insights_inactive_teams: false       # a group inactive in ServiceNow gets no team page; its tickets still count
servicenow_insights_skip_group_types: [approver, permission, survey, system, idea, legacy]   # no team page for these group types
# THE SPLIT: with both set, every page has All | LABEL | non-LABEL - its figures for the groups whose name, or a parent
# team's below the root, matches the pattern (* and ?, any case), and for the rest. E.g. label NOVA, pattern "*- NOVA".
servicenow_insights_split_label: ""     # the switch's label (e.g. NOVA); "" = no switch
servicenow_insights_split_pattern: ""   # the groups it picks: e.g. "*- NOVA" (* and ?, any case)
servicenow_insights_split_by: both      # map: pattern (the name), level (the label is one of the group's map levels) or both
servicenow_insights_split_teams: true           # false: the switch on All, the sites and directorates only (fewer files)
# YOUR SLAs (1.7.0; docs/SERVICENOW_INSIGHTS.md, "Your SLAs, priorities and categories"). Where met or missed comes from:
#   auto      ServiceNow's own SLAs (task_sla) when the account reads them (itil does), else the targets below
#   task_sla  ServiceNow's SLAs: each SLA definition a Response or a Resolution by its name (the two lists below); a ticket
#             with no SLA attached is "No SLA" - counted, left out of the percentages. On-hold time is ServiceNow's pause.
#   targets   the targets below (servicenow_insights_business_hours when set)
#   made_sla  ServiceNow's Made SLA flag (before 1.7.0 without targets)
servicenow_insights_sla_source: auto
servicenow_insights_sla_response_match: [response]               # an SLA definition whose name has one of these is a Response
servicenow_insights_sla_resolution_match: [resolution, resolve]  # ... one of these a Resolution; any other: Other, shown by name
# Business hours for the targets: {} = calendar hours. E.g. {days: [mon, tue, wed, thu, fri], start: "07:30", end: "16:30",
# holidays: ["2026-12-25"]} - in report_time_zone; an end before the start is a shift past midnight.
servicenow_insights_business_hours: {}
# SLA TARGETS, in hours from when a ticket was opened to when it was resolved (incidents) or closed (requested items) - business
# hours when set: a ticket met its SLA when it was done within its target. By table, then by priority ("1" to "5", or "P1";
# "*" = every other priority). A number is the resolution; {response: 0.5, resolution: 9} adds a response target (opened to
# first assigned to a person: the metric Assigned to); none = no SLA for that priority. Only tickets done in the window count.
# These are common ITIL starting points - put your management's numbers here (in all.yml, or the template's Variables). A
# table left out (or {} for all of them) uses ServiceNow's own Made SLA flag instead.
servicenow_insights_sla_targets:
  incident: {"1": 8, "2": 16, "3": 144, "4": 240, "5": 480}     # P1 8 h, P2 16 h, P3 6 days, P4 10 days, P5 20 days
  sc_req_item: {"1": 48, "2": 144, "3": 240, "4": 480, "5": 960}  # P1 2 days, P2 6 days, P3 10 days, P4 20 days, P5 40 days
# A catalog item's own target in hours, beating its priority's: {"New account / onboarding": 48, "Software install": 120}
servicenow_insights_sla_items: {}
# Also email a team's own report to these people (the team's page, the same look): {"Ops - Windows": [lead@yoursite.mil]}.
# It wins over servicenow_insights_email_leads for a team named in both.
servicenow_insights_team_email_to: {}
# TEAM LEADS (1.15.0): each group's manager in ServiceNow (sys_user_group.manager, read with the groups). Show it on the
# team's page and email as "Group manager: NAME", and in the Manager column of the workbook's Teams sheet only
# (1.18.0) - nothing when the group has no manager.
servicenow_insights_show_lead: true
# Email these teams' pages to their manager: group names or patterns (fnmatch, any case, as servicenow_insights_split_pattern),
# or "all". [] = nobody. A manager inactive or without an email address gets nothing: a line in the job output says so.
# The managers' email addresses are read only when this names a team (1.18.0).
servicenow_insights_email_leads: []
# TICKET LINKS (1.18.0): each ticket number on the pages opens the ticket in ServiceNow (a new tab). false = the numbers
# alone.
servicenow_insights_ticket_links: true
# The address people open ServiceNow at, when it is not the API's (e.g. https://servicenow.example.mil). '' = the
# ServiceNow API credential's instance.
servicenow_insights_ticket_base: ""
# A ticket number's table comes from the records read (1.30.0): an instance's own prefixes link too. This names a prefix
# no record read carries, as PREFIX: table (e.g. XINC: incident). {} = the records and the usual prefixes only.
servicenow_insights_ticket_prefixes: {}

# The tables read: incident, sc_req_item (requested items: the most requested services), sc_task (catalog tasks: the
# All-stars count their closures), change_request, change_task (1.2.0: the changes' tasks - each team's, and which team a
# change waited on last), problem. Take one out to leave its sections out. A table the account cannot read is said in the
# report ("Not read"), the rest still read.
servicenow_insights_tables: [incident, sc_req_item, sc_task, change_request, change_task, problem]

# PRIORITIES AND CATEGORIES (1.7.0). The priorities' names on the report, by number:
servicenow_insights_priority_names: {"1": Critical, "2": High, "3": Moderate, "4": Low, "5": Exempt}
# The priority matrix, impact -> urgency -> priority (the standard 3 x 3): an incident whose priority is not the one its
# impact and urgency give was set by hand - counted, per group. [] = not checked.
servicenow_insights_priority_matrix:
  "1": {"1": "1", "2": "2", "3": "3"}
  "2": {"1": "2", "2": "3", "3": "4"}
  "3": {"1": "3", "2": "4", "3": "5"}
# Your official list of incident categories, e.g. [Email, Network Connectivity, Workstations, Other]: the report counts the
# incidents in a category not on it (and names those categories). [] = no list: every category as it is.
servicenow_insights_categories: []

# THE LIFE CYCLE AND THE FLOW (1.9.0)
# The core hours, for After hours (incidents opened outside them): {} = servicenow_insights_business_hours, else Mon-Fri
# 07:30-16:30; the same form, e.g. {days: [mon, tue, wed, thu, fri], start: "07:30", end: "16:30"}.
servicenow_insights_core_hours: {}
servicenow_insights_short_desc_chars: 15      # Ticket quality: a short description under this many characters
servicenow_insights_hold_many: 2              # On hold: incidents put on hold more than this many times are counted
servicenow_insights_repeat_ci_days: 7         # Hot spots: another incident on the same CI within this many days is a repeat
# Workload: the median time to resolve per person, only when true (open and resolved per person are always shown).
servicenow_insights_person_metrics: false

# WHAT TO ACT ON FIRST (1.7.0)
# SLA at risk now: an open incident whose running SLA (task_sla) has used this much of its time (business time where
# ServiceNow keeps it), or is breached and still open - listed worst first.
servicenow_insights_sla_risk_pct: 75
# The 3-hop rule: an incident transferred more than this many times after its first assignment (reassignment_count over
# hop_limit + 1) is listed while open, and counted per group.
servicenow_insights_hop_limit: 3
# On hold: Awaiting Caller longer than this many business days (servicenow_insights_business_hours' days, else Mon-Fri) is
# listed - the process resolves it with No Resolution Provided by then. On hold since: this metric_instance definition (the
# incidents' state durations), else when their SLA was paused (task_sla); "" = the metric not read.
servicenow_insights_awaiting_caller_days: 6
servicenow_insights_state_metric: Incident State Duration   # the incidents' state durations (metric_instance); "" = not read
# The resolution codes counted per group, and the one each of whose tickets is listed for leadership's review.
servicenow_insights_scrutiny_codes: [Duplicate, Known Error, No Resolution Provided]
servicenow_insights_review_code: No Resolution Provided   # each incident resolved with it is listed for review
# Resolved tickets close by themselves after this many days: a resolved incident older than that and not closed is listed.
servicenow_insights_close_after_days: 7
# How incidents ended: a close code (as shown, any case) -> its outcome; any other code is Fixed. Unable to resolve = these
# outcomes, of those resolved.
servicenow_insights_outcome_map:
  Workaround: Workaround
  Workaround provided: Workaround
  Duplicate: Duplicate
  Known Error: Known Error
  No Resolution Provided: No Resolution Provided
servicenow_insights_unable_outcomes: [Known Error, No Resolution Provided]   # the outcomes counted as unable to resolve
# The service desk's assignment groups (exact names), for its own first-contact resolution; [] = the site's only.
servicenow_insights_service_desk_groups: []
# The incident surveys (asmt_metric_result, read only, best-effort): each survey and question on its own scale, never one
# average across scales (1.16.0). false = not read.
servicenow_insights_survey: true
servicenow_insights_survey_metrics: []      # the questions read, by name; [] = every one answered with a number. Named: always a rating
servicenow_insights_survey_types: []        # the surveys read, by name (asmt_metric_type); [] = every survey (1.16.0)
servicenow_insights_survey_headline: ""     # the survey or question for the tile, the email and the history; "" = the active survey with the most answers
# Good / Fair / Low by the share of the scale, (average - min) / (max - min): on 1 to 4, Good from 3.4, Fair from 2.8.
servicenow_insights_survey_grades: {good: 0.8, fair: 0.6}
servicenow_insights_survey_min_answers: 5   # fewer answers: the average without a grade
# Records per table at most, the newest kept; more: said on every page (1.16.0). Measured: 20000 needs about 0.4 GB in
# the EE; 100000 about 1.5 GB and 4 minutes more.
servicenow_insights_max_records: 20000
# The assignment history of incidents passed around: the paths of Passed between groups. From sys_audit, else (0.97.0)
# the out-of-box incident metric "Assignment Group" (metric_instance) - both read only; the account needs read on one of
# them; without either the counts are still there and the report says which it could not read. false: not read.
servicenow_insights_audit: true
servicenow_insights_handoff_source: auto        # auto (sys_audit, else the metric), audit, metric (sys_audit never asked), none
# The groups' members (sys_user_grmember): each team's leaderboard lists its members, and a ticket resolved by someone
# outside the team counts for the member it was assigned to. The account needs read on sys_user_grmember (itil has it
# on most instances); without it the leaderboard lists everyone the team's tickets were assigned to or resolved by, and
# the report says so. false: not read.
servicenow_insights_members: true

# WHAT THE REPORT SHOWS
servicenow_insights_top_issues: 10      # incident issues listed (the workbook has every one)
servicenow_insights_top_requests: 10    # catalog items listed
servicenow_insights_old_days: 30        # open longer than this: flagged (Over 30 days)
servicenow_insights_handoff_min: 3      # an incident reassigned this many times or more is "passed between groups"
servicenow_insights_problem_min: 3      # a problem candidate: this many incidents of one issue on one CI ...
servicenow_insights_problem_days: 30    # ... within this many days
servicenow_insights_repeat_days: 14     # reopened, or came back (a new incident of the same caller and issue), within this many days
# Reopen is "not used" when fewer than this share (%) of the incidents were ever reopened: the report then counts the
# incidents that came back instead (the same person, the same issue, a new ticket).
servicenow_insights_reopen_min_percent: 0.2
# Changes: an incident on the change's CI within this many hours of its end is shown as following it ("Same CI"; a
# Caused by link is always shown). A failed change: its close code is one of these (any case).
servicenow_insights_change_follow_hours: 72
servicenow_insights_change_failed_codes: [unsuccessful]      # a change closed with one of these codes failed
servicenow_insights_change_backout_words: [back out, backed out, backout, rolled back, rollback, roll back]   # in its close code or notes: backed out
# CLOSE NOTES. Bare: shorter than servicenow_insights_bare_chars, or only one of servicenow_insights_bare_phrases (any case,
# the punctuation ignored). Thin: longer, but no action word. Good: says what was done.
servicenow_insights_bare_chars: 20
# The close notes that say nothing, whole (any case, the punctuation ignored).
servicenow_insights_bare_phrases: [fixed, done, resolved, closed, complete, completed, resolved per user, closed per user, user confirmed,
                                   per user, see work notes, see notes, n/a, na, ok, works, working, no issue, issue resolved, issue fixed,
                                   rebooted, restarted, duplicate, no response, no longer needed, cancel, cancelled, test]
# ALL-STARS (each team): a ticket with a bare close note counts this much (0.5 = half); awards need this many resolved.
servicenow_insights_bare_weight: 0.5
servicenow_insights_star_min: 25        # awards need this many tickets resolved

# ACT (GenAI): groups the incidents into issues (a list carried from batch to batch), writes each top issue's fix from
# its close notes (or suggests one, marked, where the notes say too little), drafts knowledge articles and writes the
# summaries. Attach an "ACT model key" credential (site_act_provider, site_act_models); this AAP node must reach the
# model. Without it (or false) the issues are the incidents' category / subcategory and the fix is the most common close
# note. Names, phone numbers, email addresses, host names, IP addresses and 10-digit IDs are replaced (PERSON-1, HOST-3
# ...) before anything reaches the model and put back after. Off by default (1.13.0): ACT runs only when asked - true in
# the template's Variables for a monthly run, or on a launch.
servicenow_insights_act: false
servicenow_insights_act_batch: 100              # incident descriptions per question
servicenow_insights_act_max_descriptions: 2000  # the most frequent descriptions grouped; the rest go by their category
servicenow_insights_act_max_issues: 40          # at most this many issues
servicenow_insights_act_fix_issues: 15          # the top issues ACT writes a fix for ...
servicenow_insights_act_fix_batch: 3            # ... this many per question
servicenow_insights_act_notes: 40               # close notes per issue it reads
# ... and the work notes of those issues' incidents (0.96.0): what was tried while they were open, read from
# sys_journal_field (GET only; the account needs read on it - refused, the page says so and the fixes come from the close
# notes), masked like everything else before ACT reads them. The newest ..._max per issue, each cut to ..._chars.
servicenow_insights_act_work_notes: true
servicenow_insights_act_work_notes_max: 20    # the newest work notes per issue ACT reads
servicenow_insights_act_work_note_chars: 1500  # each cut to this many characters
servicenow_insights_kb_min: 50                  # a knowledge article draft for an issue with this many incidents and a fix that agrees
servicenow_insights_act_model_timeout: 600      # seconds the model may take for an answer
servicenow_insights_act_check_url: true         # first check that this AAP node reaches the model's URL
servicenow_insights_mask_names: []              # more words to replace before ACT (a project name, a building)
servicenow_insights_mask_keep: []               # words that look like host names but are not (e.g. [win11, rhel9]): sent as they are

# THE HISTORY (1.13.0, docs/REPORT_DATABASE.md): true = each run writes its figures to the report database (MySQL 8.4,
# the "Report database" credential) - the window's, and each calendar month in it (the month so far marked partial) -
# and the pages show the months as Trends, for each site, unit and team. Figures only: counts, percentages and hours per
# org node - no caller, description, note or person. A month is replaced by the newest run that holds it. The database
# not reached: one warning, the report whole, the job green.
servicenow_insights_db: false
servicenow_insights_db_required: false      # true: the database not reached (or no credential) fails the job
servicenow_insights_db_create: true         # make the tables and views on the first run (false: made by hand, from the doc)
servicenow_insights_db_months: 12           # the months the trend shows
servicenow_insights_db_timeout: 10          # seconds to connect
# THE BACKFILL: > 0 = this launch reads that many past calendar months from ServiceNow once, writes each month's figures
# to the report database and stops - no ACT, no pages, no email. Run it once after setup (12), as a separate launch.
# Safe to run twice: each month replaces what was there.
servicenow_insights_backfill_months: 0
# Is it writing? (1.15.0) true = only check the report database with the job's Report database credential, read only (the
# reader account works): the server, the tables and views, the runs and months held, the newest write. No ServiceNow read,
# no pages, no email. Launch with it as an extra variable.
servicenow_insights_db_check: false
# THE TICKET STORE (1.17.0): with servicenow_insights_db, the report database keeps each ticket's numbers, times, flags
# and group sys_id (never its text, its people, its CI or the names ServiceNow shows). Each run then reads in full only
# the tickets that changed; the rest come from the database. The first run reads everything and fills it. The pages are
# the same either way.
servicenow_insights_incremental: true
servicenow_insights_full_refresh: false     # true: this launch reads every ticket again (launch with it as an extra variable)
# THE ACT CACHE (1.17.0): with servicenow_insights_db, each description's issue is kept (the description as a hash, the
# issue by ACT's short name, masked - the one text the database holds). Only new descriptions go to ACT; the fixes are
# asked every run. Another provider, model or prompt starts the cache again.
servicenow_insights_act_cache: true
servicenow_insights_act_cache_clear: false  # true: this launch asks ACT everything again and replaces the cache (only when ACT answered every grouping question)

# THE PAGES (1.14.0): each site's, unit's and team's page is written this many at a time, in one task after the All page,
# when site_report_web writes the website itself (a folder, an SMB share, an upload). 0 = the site_email role once per
# page, as before (report_web_copy and report_web_host always do that).
servicenow_insights_pages_per_call: 40

# The workbook on the email: every incident with its issue and close-note grade, the issues, requests, changes, people.
servicenow_insights_xlsx: true
# The job fails when ServiceNow could not be read at all, or a group named is not there. false = a report only.
servicenow_insights_fail: true
