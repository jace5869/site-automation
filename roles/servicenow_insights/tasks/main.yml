---
# TICKET INSIGHTS (playbooks/servicenow_insights.yml): months of tickets read from ServiceNow (site_servicenow_insights),
# ACT's answers asked in batches with the names replaced first (act_classify.yml, act_fix.yml), the model of the report
# (servicenow_insights_filters), a web page for the site and one per team (servicenow_insights_page), the email with the
# workbook, the job artifact servicenow_insights.

- name: Insights | connection
  ansible.builtin.set_fact:
    _sni_url: >-
      {%- set h = lookup('ansible.builtin.env', 'SN_HOST') | trim -%}
      {{ ((h if h.startswith('http') else 'https://' ~ h) | regex_replace('/+$', '')) if h else '' }}
    _sni_groups: "{{ servicenow_insights_groups | servicenow_insights_name_list }}"
    _sni_tables: >-
      {{ (servicenow_insights_tables | replace(',', ' ')).split() if servicenow_insights_tables is string else servicenow_insights_tables }}

- name: Insights | time - started
  ansible.builtin.set_fact:
    _sni_t: "{{ _sni_t | default({}) | combine({'start': now().timestamp()}) }}"

# IS IT WRITING? (1.15.0): servicenow_insights_db_check: true - only the report database checked, read only (db_check.yml);
# no ServiceNow credential needed, the play ends there.
- name: Insights | check the report database, nothing else (servicenow_insights_db_check)
  ansible.builtin.include_tasks: db_check.yml
  when: servicenow_insights_db_check | bool

- name: Insights | the ServiceNow API credential is attached
  ansible.builtin.assert:
    that: _sni_url | length > 0
    fail_msg: Attach the "ServiceNow API" credential (it sets SN_HOST, SN_USERNAME, SN_PASSWORD).
    quiet: true

- name: Insights | the settings the report uses
  ansible.builtin.set_fact:
    _sni_opts:
      groups: "{{ _sni_groups }}"
      hierarchy_source: "{{ servicenow_insights_hierarchy_source | string | trim | lower }}"
      site_roots: "{{ servicenow_insights_site_roots | servicenow_insights_name_list }}"
      split_label: "{{ servicenow_insights_split_label | default('', true) | string | trim }}"
      split_pattern: "{{ servicenow_insights_split_pattern | default('', true) | string | trim }}"
      directorates: "{{ servicenow_insights_directorates | servicenow_insights_name_list }}"
      suffix_directorates: "{{ servicenow_insights_suffix_directorates | servicenow_insights_name_list }}"
      hierarchy_map: "{{ servicenow_insights_hierarchy_map | default({}, true) }}"
      unmapped_bucket: "{{ servicenow_insights_unmapped_bucket | default('Unknown', true) | string | trim }}"
      custom_view: "{{ servicenow_insights_custom_view | bool }}"
      custom_view_max_rows: "{{ servicenow_insights_custom_view_max_rows | int }}"
      custom_view_presets: "{{ servicenow_insights_custom_view_presets | default({}, true) }}"
      periods: "{{ servicenow_insights_periods | default(['all', 'this_month', '1m', '2m', '3m', '6m', '9m', '12m', '1w', '2w', '4w'], true) }}"
      week_start: "{{ servicenow_insights_week_start | default('mon', true) | string | trim | lower }}"
      split_by: "{{ servicenow_insights_split_by | default('both', true) | string | trim | lower }}"
      directorate_alias: "{{ servicenow_insights_directorate_alias | default({}, true) }}"
      directorate_tags: "{{ servicenow_insights_directorate_tags | default({}, true) }}"
      use_group_parents: "{{ servicenow_insights_use_group_parents | bool }}"
      known_groups_only: "{{ servicenow_insights_known_groups_only | bool }}"
      exclude_groups: "{{ servicenow_insights_exclude_groups | servicenow_insights_name_list }}"
      inactive_teams: "{{ servicenow_insights_inactive_teams | bool }}"
      show_lead: "{{ servicenow_insights_show_lead | bool }}"
      # the ticket numbers on the pages link into ServiceNow (1.18.0): at the address people use, else the API's instance
      ticket_links: "{{ servicenow_insights_ticket_links | bool }}"
      ticket_base: "{{ servicenow_insights_ticket_base | default('', true) | string | trim }}"
      survey_metrics: "{{ servicenow_insights_survey_metrics | servicenow_insights_name_list }}"
      survey_headline: "{{ servicenow_insights_survey_headline | default('', true) | string | trim }}"
      survey_grades: "{{ servicenow_insights_survey_grades | default({'good': 0.8, 'fair': 0.6}, true) }}"
      survey_min_answers: "{{ servicenow_insights_survey_min_answers | default(5) | int }}"
      skip_group_types: "{{ servicenow_insights_skip_group_types | servicenow_insights_name_list }}"
      # the website's look: brief draws the page in its palette, with the verdict at the top (0.92.0)
      look: "{{ report_web_theme | default('atlas') | string | trim | lower }}"
      team_min: "{{ servicenow_insights_team_min | int }}"
      teams_max: "{{ servicenow_insights_teams_max | int if servicenow_insights_team_pages | bool else 0 }}"
      top_issues: "{{ servicenow_insights_top_issues | int }}"
      top_requests: "{{ servicenow_insights_top_requests | int }}"
      old_days: "{{ servicenow_insights_old_days | int }}"
      handoff_min: "{{ servicenow_insights_handoff_min | int }}"
      problem_min: "{{ servicenow_insights_problem_min | int }}"
      problem_days: "{{ servicenow_insights_problem_days | int }}"
      repeat_days: "{{ servicenow_insights_repeat_days | int }}"
      reopen_min_percent: "{{ servicenow_insights_reopen_min_percent | float }}"
      change_follow_hours: "{{ servicenow_insights_change_follow_hours | int }}"
      change_failed_codes: "{{ servicenow_insights_change_failed_codes | servicenow_insights_name_list }}"
      change_backout_words: "{{ servicenow_insights_change_backout_words | servicenow_insights_name_list }}"
      bare_chars: "{{ servicenow_insights_bare_chars | int }}"
      bare_phrases: "{{ servicenow_insights_bare_phrases | servicenow_insights_name_list }}"
      bare_weight: "{{ servicenow_insights_bare_weight | float }}"
      star_min: "{{ servicenow_insights_star_min | int }}"
      sla_targets: "{{ servicenow_insights_sla_targets | default({}, true) }}"
      sla_items: "{{ servicenow_insights_sla_items | default({}, true) }}"
      sla_response_match: "{{ servicenow_insights_sla_response_match | servicenow_insights_name_list }}"
      sla_resolution_match: "{{ servicenow_insights_sla_resolution_match | servicenow_insights_name_list }}"
      business_hours: "{{ servicenow_insights_business_hours | default({}, true) }}"
      priority_names: "{{ servicenow_insights_priority_names | default({}, true) }}"
      priority_matrix: "{{ servicenow_insights_priority_matrix | default([], true) }}"
      categories: "{{ servicenow_insights_categories | servicenow_insights_name_list }}"
      hop_limit: "{{ servicenow_insights_hop_limit | int }}"
      awaiting_caller_days: "{{ servicenow_insights_awaiting_caller_days | float }}"
      state_metric: "{{ servicenow_insights_state_metric | default('', true) | string | trim }}"
      scrutiny_codes: "{{ servicenow_insights_scrutiny_codes | servicenow_insights_name_list }}"
      review_code: "{{ servicenow_insights_review_code | default('', true) | string | trim }}"
      close_after_days: "{{ servicenow_insights_close_after_days | float }}"
      sla_risk_pct: "{{ servicenow_insights_sla_risk_pct | float }}"
      outcome_map: "{{ servicenow_insights_outcome_map | default({}, true) }}"
      unable_outcomes: "{{ servicenow_insights_unable_outcomes | servicenow_insights_name_list }}"
      service_desk_groups: "{{ servicenow_insights_service_desk_groups | servicenow_insights_name_list }}"
      core_hours: "{{ servicenow_insights_core_hours | default({}, true) }}"
      short_desc_chars: "{{ servicenow_insights_short_desc_chars | int }}"
      hold_many: "{{ servicenow_insights_hold_many | int }}"
      repeat_ci_days: "{{ servicenow_insights_repeat_ci_days | float }}"
      person_metrics: "{{ servicenow_insights_person_metrics | bool }}"
      act: "{{ servicenow_insights_act | bool }}"
      act_max_descriptions: "{{ servicenow_insights_act_max_descriptions | int }}"
      act_max_issues: "{{ servicenow_insights_act_max_issues | int }}"
      act_fix_issues: "{{ servicenow_insights_act_fix_issues | int }}"
      act_fix_batch: "{{ servicenow_insights_act_fix_batch | int }}"
      act_notes: "{{ servicenow_insights_act_notes | int }}"
      act_work_notes_max: "{{ servicenow_insights_act_work_notes_max | int }}"
      act_work_note_chars: "{{ servicenow_insights_act_work_note_chars | int }}"
      kb_min: "{{ servicenow_insights_kb_min | int }}"
      mask_names: "{{ servicenow_insights_mask_names | servicenow_insights_name_list }}"
      mask_keep: "{{ servicenow_insights_mask_keep | servicenow_insights_name_list }}"
      extra: "{{ site_act_extra_instructions | default('') }}"
      provider: "{{ site_act_provider | default('') }}"
    _sni_state: "{{ {} | servicenow_insights_state }}"
    _sni_act_stop: ""

# THE BACKFILL (1.13.0): servicenow_insights_backfill_months > 0 - past calendar months read once and written to the report
# database, nothing else (backfill.yml); the play ends there.
- name: Insights | the backfill - {{ servicenow_insights_backfill_months }} past calendar months into the report database
  ansible.builtin.include_tasks: backfill.yml
  when: servicenow_insights_backfill_months | int > 0

# 1.17.0: with the report database, each run reads in full only the tickets that changed (docs/REPORT_DATABASE.md, The
# ticket store); the first run, servicenow_insights_full_refresh or a database not reached: everything, as before.
# 1.17.0b: the folder the read and the database pass the tickets through is removed however the run ends (always).
- name: Insights | read the tickets - the ticket store, ServiceNow
  block:
    - name: Insights | the tickets the report database holds (servicenow_insights_incremental)
      ansible.builtin.include_tasks: store.yml
      vars:
        _sni_store_step: load
      when: servicenow_insights_db | bool and servicenow_insights_incremental | bool

    - name: Insights | read the window ({{ servicenow_insights_days ~ " days" if servicenow_insights_days | float > 0 else servicenow_insights_months ~ " months" }}) of {{ _sni_tables | join(", ") }} from ServiceNow
      site_servicenow_insights:
        url: "{{ _sni_url }}"
        username: "{{ lookup('ansible.builtin.env', 'SN_USERNAME') }}"
        password: "{{ lookup('ansible.builtin.env', 'SN_PASSWORD') }}"
        validate_certs: "{{ servicenow_validate_certs | default(true) | bool }}"
        ca_path: "{{ servicenow_ca_path | default(omit, true) }}"
        timeout: "{{ servicenow_timeout | default(30) | int }}"
        groups: "{{ _sni_groups }}"
        tables: "{{ _sni_tables }}"
        months: "{{ servicenow_insights_months | int }}"
        days: "{{ servicenow_insights_days | float }}"
        until: "{{ servicenow_insights_until | default('', true) | string }}"
        compare: "{{ servicenow_insights_compare | bool }}"
        time_zone: "{{ report_time_zone | default('', true) | string }}"
        max_records: "{{ servicenow_insights_max_records | int }}"
        audit: "{{ servicenow_insights_audit | bool }}"
        handoff_min: "{{ servicenow_insights_handoff_min | int }}"
        handoff_source: "{{ servicenow_insights_handoff_source | default('auto') | string | trim | lower }}"
        members: "{{ servicenow_insights_members | default(true) | bool }}"
        group_parents: "{{ servicenow_insights_use_group_parents | default(true) | bool }}"
        now: "{{ servicenow_insights_now | default(omit, true) }}"
        sla_source: "{{ servicenow_insights_sla_source | default('auto') | string | trim | lower }}"
        first_assigned: true                # only with the targets: the response's end (the metric Assigned to)
        state_metric: "{{ servicenow_insights_state_metric | default('', true) | string | trim }}"
        survey: "{{ servicenow_insights_survey | default(true) | bool }}"
        survey_metrics: "{{ servicenow_insights_survey_metrics | servicenow_insights_name_list }}"
        survey_types: "{{ servicenow_insights_survey_types | default([], true) | servicenow_insights_name_list }}"
        # the team leads (1.15.0): each group's manager, in the groups' read - for the page's line or the leads' emails
        managers: "{{ servicenow_insights_show_lead | bool or servicenow_insights_email_leads | default([], true) | length > 0 }}"
        manager_email: "{{ servicenow_insights_email_leads | default([], true) | length > 0 }}"   # 1.18.0: only for the leads' emails
        # the ticket store (1.17.0): the database's rows in, this run's out - files in a folder of the job's own
        store_in: "{{ (_sni_store | default({})).in | default('') }}"
        store_out: "{{ (_sni_store | default({})).out | default('') }}"
        full_refresh: "{{ servicenow_insights_full_refresh | bool }}"
      register: _sni
      check_mode: false             # only reads (the tickets go to the database after it, store.yml)

    - name: Insights | the tickets read this run into the report database (servicenow_insights_incremental)
      ansible.builtin.include_tasks: store.yml
      vars:
        _sni_store_step: save
      when: (_sni_store | default({})).dir | default('') | length > 0
  always:
    - name: Insights | the folder the tickets passed through, removed (a run stopped after the store's load too)
      ansible.builtin.file:
        path: "{{ _sni_store_dir.path }}"
        state: absent
      check_mode: false
      when: (_sni_store_dir | default({})).path | default('') | length > 0

- name: Insights | time - ServiceNow read
  ansible.builtin.set_fact:
    _sni_t: "{{ _sni_t | default({}) | combine({'read': now().timestamp()}) }}"

- name: Insights | what is replaced before ACT reads anything (names, phone numbers, email and IP addresses, host names, IDs)
  ansible.builtin.set_fact:
    _sni_mask: "{{ _sni | servicenow_insights_mask(_sni_opts) if _sni.ok | default(false) | bool else {'pairs': [], 'counts': {}} }}"

- name: Insights | ACT groups the incidents into issues, writes the fixes - evidence mode, ACT runs no command
  when: servicenow_insights_act | bool and _sni.ok | default(false) | bool and not ansible_check_mode
  block:
    - name: Insights | the issues ACT gave before (the ACT cache, servicenow_insights_act_cache)
      ansible.builtin.include_tasks: act_cache.yml
      vars:
        _sni_act_step: load
      when: servicenow_insights_db | bool and servicenow_insights_act_cache | bool

    - name: Insights | the incidents' descriptions, in batches of {{ servicenow_insights_act_batch }} (those the cache places left out)
      ansible.builtin.set_fact:
        _sni_desc_batches: >-
          {{ _sni | servicenow_insights_descriptions(_sni_mask, _sni_opts, _sni_state) | servicenow_insights_batches(servicenow_insights_act_batch | int) }}

    - name: Insights | ACT groups each batch, the issues carried from one batch to the next
      ansible.builtin.include_tasks: act_classify.yml
      loop: "{{ _sni_desc_batches }}"
      loop_control:
        loop_var: _sni_batch
        index_var: _sni_batch_index
        label: "{{ _sni_batch[0].id }}-{{ _sni_batch[-1].id }}"

    - name: Insights | each description's issue kept for the next runs (the ACT cache)
      ansible.builtin.include_tasks: act_cache.yml
      vars:
        _sni_act_step: save
      when: servicenow_insights_db | bool and servicenow_insights_act_cache | bool

    - name: Insights | the top issues ACT writes a fix for, {{ servicenow_insights_act_fix_batch }} per question
      ansible.builtin.set_fact:
        _sni_fix_batches: "{{ _sni | servicenow_insights_fix_batches(_sni_state, _sni_mask, _sni_opts) if _sni_act_stop | length == 0 else [] }}"

    - name: Insights | the work notes of the top issues' incidents (sys_journal_field, read-only), for ACT's fixes
      when: servicenow_insights_act_work_notes | bool and _sni_fix_batches | length > 0
      block:
        - name: Insights | read the work notes of {{ _sni_fix_batches | default([]) | servicenow_insights_fix_ids | length }} incidents
          site_servicenow_insights:
            url: "{{ _sni_url }}"
            username: "{{ lookup('ansible.builtin.env', 'SN_USERNAME') }}"
            password: "{{ lookup('ansible.builtin.env', 'SN_PASSWORD') }}"
            validate_certs: "{{ servicenow_validate_certs | default(true) | bool }}"
            ca_path: "{{ servicenow_ca_path | default(omit, true) }}"
            timeout: "{{ servicenow_timeout | default(30) | int }}"
            work_notes_for: "{{ _sni_fix_batches | servicenow_insights_fix_ids }}"
            work_notes_max: "{{ servicenow_insights_act_work_notes_max | int }}"
            work_note_chars: "{{ servicenow_insights_act_work_note_chars | int }}"
          register: _sni_wn
          check_mode: false     # only reads
          failed_when: false    # not read (403 ...): said on the page, the fixes from the close notes

        # a mask of its own: the words of what only the work notes hold must not change how descriptions group into issues
        - name: Insights | the work notes masked (their addresses, phone numbers, IDs and host names too) and added to each issue
          ansible.builtin.set_fact:
            _sni_mask_wn: "{{ _sni_mask | servicenow_insights_mask_more(_sni_wn, _sni_opts) }}"
            _sni_state: >-
              {{ _sni_state | servicenow_insights_work_notes_state(_sni_wn, _sni_fix_batches | servicenow_insights_fix_ids | length) }}

        - name: Insights | each issue's work notes, the newest {{ servicenow_insights_act_work_notes_max }}
          ansible.builtin.set_fact:
            _sni_fix_batches: "{{ _sni_fix_batches | servicenow_insights_fix_work_notes(_sni_wn, _sni_mask_wn, _sni_opts) }}"

    - name: Insights | ACT writes each top issue's fix from its close notes and work notes (and a knowledge article draft where they agree)
      ansible.builtin.include_tasks: act_fix.yml
      loop: "{{ _sni_fix_batches }}"
      loop_control:
        loop_var: _sni_batch
        index_var: _sni_batch_index
        label: "{{ _sni_batch.issues | map(attribute='name') | join(', ') }}"

- name: Insights | time - ACT's issues and fixes done
  ansible.builtin.set_fact:
    _sni_t: "{{ _sni_t | default({}) | combine({'act_a': now().timestamp()}) }}"

- name: Insights | the report, worked out (the site and each team)
  ansible.builtin.set_fact:
    _sni_model: >-
      {{ _sni | servicenow_insights_model(_sni_state, _sni_mask, _sni_opts | combine({'act_reason':
           ('a dry run (Check): ACT was not asked' if ansible_check_mode else _sni_act_stop)})) }}
  when: _sni.ok | default(false) | bool

# 1.15.0: each team's own email - to its manager (servicenow_insights_email_leads) or to servicenow_insights_team_email_to
- name: Insights | who gets each team's own email (servicenow_insights_email_leads, servicenow_insights_team_email_to)
  ansible.builtin.set_fact:
    _sni_leads: >-
      {{ _sni_model | default({}) | servicenow_insights_lead_mail(servicenow_insights_email_leads | default([], true),
                                                                  servicenow_insights_team_email_to | default({}, true)) }}

- name: Insights | the team leads not emailed
  ansible.builtin.debug:
    msg: "{{ _sni_leads.lines }}"
  when: _sni_leads.lines | length > 0

- name: Insights | time - the report worked out
  ansible.builtin.set_fact:
    _sni_t: "{{ _sni_t | default({}) | combine({'model': now().timestamp()}) }}"

- name: Insights | ACT writes what the period says, for the site and each team
  when: >-
    servicenow_insights_act | bool and _sni.ok | default(false) | bool and not ansible_check_mode
    and _sni_act_stop | length == 0 and _sni_state.answered | default(0) | int > 0
  block:
    - name: Insights | ACT reads each scope's numbers - evidence mode, ACT runs no command
      ansible.builtin.include_role:
        name: site_act
        tasks_from: evidence_analysis.yml
      vars:
        _ea_items: [{id: summaries}]
        _ea_evidence: "{{ _sni_model | servicenow_insights_summary_evidence(_sni_mask) }}"
        _ea_task: "{{ _sni_model | servicenow_insights_summary_task(_sni_opts) }}"
        _ea_check_url: false
        _ea_names: []
        _ea_model_timeout: "{{ servicenow_insights_act_model_timeout }}"

    - name: Insights | ACT's summaries in the report
      ansible.builtin.set_fact:
        _sni_model: >-
          {{ _sni_model | servicenow_insights_summary_merge(_ea_raw | default(''), _sni_mask, _ea_ran | default(false) | bool,
                                                            _ea_reason | default(''), _ea_model | default('')) }}

- name: Insights | time - ACT's summaries done
  ansible.builtin.set_fact:
    _sni_t: "{{ _sni_t | default({}) | combine({'act_b': now().timestamp()}) }}"

- name: Insights | ACT's words with the replaced names put back
  ansible.builtin.set_fact:
    _sni_model: "{{ _sni_model | servicenow_insights_finish(_sni_mask_wn | default(_sni_mask)) }}"
    _sni_doc: "{{ _sni_model | servicenow_insights_doc('all', _sni_opts) }}"
  when: _sni.ok | default(false) | bool

- name: Insights | time - the report finished
  ansible.builtin.set_fact:
    _sni_t: "{{ _sni_t | default({}) | combine({'finish': now().timestamp()}) }}"

- name: Insights | the last months from the report database, for the trend (servicenow_insights_db)
  ansible.builtin.include_tasks: db.yml
  when: servicenow_insights_db | bool and _sni.ok | default(false) | bool

# 1.15.0: written before the pages, so each page can say it was (How this was made); a month replaces an older run's
- name: Insights | this run's figures into the report database (servicenow_insights_db)
  ansible.builtin.include_tasks: db_write.yml
  when: servicenow_insights_db | bool and _sni.ok | default(false) | bool

- name: Insights | is it writing? - the report database, read back after the write
  ansible.builtin.set_fact:
    _sni_db_say: >-
      {{ {'on': servicenow_insights_db | bool, 'host': (_sni_db | default({})).host | default(''), 'port': (_sni_db | default({})).port | default(''),
          'database': (_sni_db | default({})).database | default(''), 'check': ansible_check_mode,
          'read': _sni_hist | default({}), 'write': _sni_db_w | default({}),
          'source': (_sni_db_runs | default({'runs': [{'run': {}}]})).runs[0].run.source | default(''),
          'not_read': '' if _sni.ok | default(false) | bool else 'ServiceNow was not read'} | servicenow_insights_db_status }}

- name: Insights | time - the report database read and written
  ansible.builtin.set_fact:
    _sni_t: "{{ _sni_t | default({}) | combine({'db': now().timestamp()}) }}"

- name: Insights | {{ _sni_doc.title | default('nothing read') }}
  ansible.builtin.debug:
    msg: "{{ (_sni_doc | report_text).splitlines() if _sni_doc is defined else _sni.error | default('ServiceNow was not read') }}"

- name: Insights | the numbers as job artifacts (servicenow_insights)
  ansible.builtin.set_stats:
    data:
      servicenow_insights: "{{ _sni_model | servicenow_insights_artifact }}"
  when: _sni.ok | default(false) | bool

# Each site's, directorate's and team's page is one file, written over each run ({template}/{site}/latest.html,
# {template}/{site}/{dir}/latest.html, {template}/{site}/{dir}/{team}/latest.html - 0.97.0), linked from the others and
# kept off the website's index: the index has one line, the All page. The lines an older run put there are taken off it
# (_web_index_drop).
- name: Insights | the website's file names - the All page, each site's, directorate's and team's ({template}/{site}/{dir}/{team}/...)
  ansible.builtin.set_fact:
    _sni_web: >-
      {%- set t = now(utc=true) -%}
      {%- set page = report_web_page | default('{template}/{date}_{time}_job-{job}.html') -%}
      {%- set latest = report_web_latest | default('{template}/latest.html') -%}
      {%- set names = (report_web_names | default({})) | combine({'date': t.strftime('%Y-%m-%d'), 'time': t.strftime('%H%M')}) -%}
      {%- set base = {'template': awx_job_template_name | default(tower_job_template_name | default(ansible_play_name | default('report'))),
                      'template_id': awx_job_template_id | default(tower_job_template_id | default('local')),
                      'job': awx_job_id | default(tower_job_id | default('local')), 'status': 'info',
                      'year': t.strftime('%Y'), 'month': t.strftime('%m'), 'day': t.strftime('%d')} -%}
      {%- set level = {'site': '{template}/{site}', 'dir': '{template}/{site}/{dir}', 'team': '{template}/{site}/{dir}/{team}'} -%}
      {%- set out = {'names': names, 'page': page, 'latest': latest,
                     'all': {'page': page, 'latest': latest, 'index': ''}
                            | report_web_files(base | combine(names) | combine({'team': 'all', 'site': 'all', 'dir': 'all'}))} -%}
      {%- set pages = {} -%}
      {%- for p in _sni_model.pages | default([]) -%}
      {%-   set where = {'site': p.path[0], 'dir': p.path[1] | default(''), 'team': p.path[2] | default('')} -%}
      {#-   the page's folder: its path, any depth (the org map, 1.8.0) - for a site, directorate or team the same as level[p.level] -#}
      {%-   set files = {'page': (latest or page) | replace('{template}', '{template}/' ~ (p.path | join('/'))), 'latest': '', 'index': ''}
                        | report_web_files(base | combine(names) | combine(where)) -%}
      {%-   set _ = pages.update({p.key: files | combine({'level': p.level, 'names': where})}) -%}
      {%- endfor -%}
      {#- the split (0.97.0): every page again for the groups that match and for the rest, beside it (latest-LABEL.html,
          latest-non-LABEL.html) - the switch on each page links them -#}
      {%- set sp = _sni_model.split | default({}) -%}
      {%- set variants = {} -%}
      {%- if sp.label | default('') | length > 0 -%}
      {%-   set sfx = {'in': '-' ~ (sp.label | servicenow_insights_slug), 'out': '-non-' ~ (sp.label | servicenow_insights_slug)} -%}
      {%-   for v in ['in', 'out'] -%}
      {%-     set vp = {'all': {'page': (out.all.latest or out.all.page) | regex_replace('\.html$', sfx[v] ~ '.html'), 'level': 'all',
                                'names': {'site': 'all', 'dir': 'all', 'team': 'all'}}} -%}
      {%-     for k, f in pages.items() if f.level != 'team' or servicenow_insights_split_teams | bool -%}
      {%-       set _ = vp.update({k: f | combine({'page': f.page | regex_replace('\.html$', sfx[v] ~ '.html')})}) -%}
      {%-     endfor -%}
      {%-     set _ = variants.update({v: vp}) -%}
      {%-   endfor -%}
      {%- endif -%}
      {%- set jobs = [] -%}
      {%- for k in pages -%}{%- set _ = jobs.append({'key': k, 'v': ''}) -%}{%- endfor -%}
      {%- for v in variants -%}{%- for k in variants[v] -%}{%- set _ = jobs.append({'key': k, 'v': v}) -%}{%- endfor -%}{%- endfor -%}
      {%- set files = pages.values() | map(attribute='page') | list -%}
      {%- for v in variants -%}{%- set _ = files.extend(variants[v].values() | map(attribute='page') | list) -%}{%- endfor -%}
      {{ out | combine({'pages': pages, 'teams': pages, 'variants': variants, 'jobs': jobs, 'files': files,
                        'on': (report_web_dest | default('', true) | string | trim | length > 0) and _sni.ok | default(false) | bool}) }}

# THE PAGES IN ONE GO (1.14.0): with the website written by site_report_web itself (a folder, an SMB share, an upload),
# each site's, unit's and team's page is made here and written servicenow_insights_pages_per_call at a time, after the
# All page - not the site_email role once per page (a second or more each). Copy mode (report_web_copy) and
# report_web_host (WinRM) keep the role per page; so does servicenow_insights_pages_per_call: 0.
- name: Insights | the pages in one go, or the role per page
  ansible.builtin.set_fact:
    _sni_fast: >-
      {{ _sni_web.on | bool and not report_web_copy | default(false) | bool and report_web_host | default('', true) | string | trim | length == 0
         and servicenow_insights_pages_per_call | int > 0 and not ansible_check_mode }}

- name: Insights | each site's, directorate's and team's page on the report website (and a team's email to its lead)
  ansible.builtin.include_role:
    name: site_email
  vars:
    _sni_team: "{{ _sni_job.key }}"
    _sni_file: "{{ _sni_web.variants[_sni_job.v][_sni_job.key] if _sni_job.v else _sni_web.pages[_sni_job.key] }}"
    _report: "{{ _sni_model | servicenow_insights_variant(_sni_job.v) | servicenow_insights_doc(_sni_team, _sni_opts) }}"
    _report_html: "{{ _sni_model | servicenow_insights_page(_sni_team, _sni_page_opts) }}"
    _report_xlsx: []
    _report_email_skip: "{{ _sni_job.v | length > 0 or (_sni_leads.to[_sni_team] | default([])) | length == 0 }}"
    # the lead's address wins over report_email_to, even one in the template's Variables (an extra variable)
    _report_email_to_override: "{{ [] if _sni_job.v else _sni_leads.to[_sni_team] | default([]) }}"
    report_web_names: "{{ _sni_web.names | combine(_sni_file.names) }}"
    report_web_page: "{{ _sni_file.page }}"
    report_web_latest: ""
    report_web_index: ""
    _sni_page_opts: >-
      {{ _sni_opts | combine({'links': _sni_web | servicenow_insights_links(_sni_file.page, _sni_job.v), 'variant': _sni_job.v,
                              'variant_links': _sni_web | servicenow_insights_variant_links(_sni_team, _sni_file.page),
                              'generated': now(fmt='%Y-%m-%d %H:%M %Z') | trim, 'job': awx_job_id | default(tower_job_id | default('local')),
                              'footer': 'AAP job ' ~ awx_job_id | default(tower_job_id | default('(command line)')) ~ ' - ServiceNow ' ~ _sni_url,
                              'header_text': report_email_header_text | default('Site automation report'),
                              'not_read': _sni_model | servicenow_insights_not_read, 'timing': (_sni_t | servicenow_insights_timing).rows,
                              'db': _sni_db_say if servicenow_insights_db | bool else {},
                              'store_line': (_sni_store_say | default({})).page | default('')}) }}
  # the pages in one go (_sni_fast, 1.14.0): the pages below, then the team leads' emails
  loop: "{{ [] if _sni_fast | bool else (_sni_web.jobs if _sni_web.on | bool or _sni_leads.to | length > 0 else []) }}"
  loop_control:
    loop_var: _sni_job
    label: "{{ _sni_job.key }}{{ (' (' ~ _sni_job.v ~ ')') if _sni_job.v else '' }}"

- name: Insights | the site's page on the report website (report_web_dest), the email with the workbook (report_email_to)
  ansible.builtin.include_role:
    name: site_email
  vars:
    _report: "{{ _sni_doc }}"
    _report_html: "{{ _sni_model | servicenow_insights_page('all', _sni_page_opts) }}"
    _report_xlsx: "{{ _sni_model | servicenow_insights_xlsx(_sni, _sni_state, _sni_mask, _sni_opts) if servicenow_insights_xlsx | bool else [] }}"
    _report_xlsx_name: "{{ awx_job_template_name | default(tower_job_template_name | default('ticket-insights')) }}"
    report_web_names: "{{ _sni_web.names | combine({'team': 'all', 'site': 'all', 'dir': 'all'}) }}"
    _web_sub_pages: "{{ _sni_web.files }}"        # the other pages: those an older run wrote and this one did not are deleted
    _web_index_drop: >-
      {{ [(_sni_web.all.latest | dirname) ~ '/*/' ~ (_sni_web.all.latest | basename)]
         if _sni_web.all.latest and '/' in _sni_web.all.latest else [] }}
    _sni_page_opts: >-
      {{ _sni_opts | combine({'links': _sni_web | servicenow_insights_links(_sni_web.all.page),
                              'variant_links': _sni_web | servicenow_insights_variant_links('all', _sni_web.all.page),
                              'generated': now(fmt='%Y-%m-%d %H:%M %Z') | trim, 'job': awx_job_id | default(tower_job_id | default('local')),
                              'footer': 'AAP job ' ~ awx_job_id | default(tower_job_id | default('(command line)')) ~ ' - ServiceNow ' ~ _sni_url,
                              'header_text': report_email_header_text | default('Site automation report'),
                              'not_read': _sni_model | servicenow_insights_not_read, 'timing': (_sni_t | servicenow_insights_timing).rows,
                              'db': _sni_db_say if servicenow_insights_db | bool else {},
                              'store_line': (_sni_store_say | default({})).page | default('')}) }}
  when: >-
    _sni.ok | default(false) | bool and (report_email_to | default([]) | length > 0 or report_email_also | default([]) | length > 0
    or _sni_web.on | bool)

- name: Insights | the other pages - each site's, unit's and team's - {{ servicenow_insights_pages_per_call }} per call (site_email, pages.yml)
  ansible.builtin.include_role:
    name: site_email
    tasks_from: pages.yml
  vars:
    _pages_chunks: "{{ _sni_web.jobs | servicenow_insights_chunks(servicenow_insights_pages_per_call) }}"
    _pages_model: "{{ _sni_model }}"
    _pages_web: "{{ _sni_web }}"
    _pages_doc_opts: "{{ _sni_opts }}"
    _pages_opts: >-
      {{ _sni_opts | combine({'generated': now(fmt='%Y-%m-%d %H:%M %Z') | trim, 'job': awx_job_id | default(tower_job_id | default('local')),
                              'footer': 'AAP job ' ~ awx_job_id | default(tower_job_id | default('(command line)')) ~ ' - ServiceNow ' ~ _sni_url,
                              'header_text': report_email_header_text | default('Site automation report'),
                              'not_read': _sni_model | servicenow_insights_not_read, 'timing': (_sni_t | servicenow_insights_timing).rows,
                              'db': _sni_db_say if servicenow_insights_db | bool else {},
                              'store_line': (_sni_store_say | default({})).page | default('')}) }}
  when: _sni_fast | bool and _sni.ok | default(false) | bool

- name: Insights | each team lead's email (servicenow_insights_email_leads, servicenow_insights_team_email_to), linking the team's page written above
  ansible.builtin.include_role:
    name: site_email
  vars:
    _sni_team: "{{ _sni_job.key }}"
    _report: "{{ _sni_model | servicenow_insights_doc(_sni_team, _sni_opts) }}"
    _report_xlsx: []
    _report_web_skip: true
    _report_email_to_override: "{{ _sni_leads.to[_sni_team] | default([]) }}"
    # the page's address as the one-page-at-a-time run gives it: report_web_url (or an https report_web_dest) and the file
    _report_web_url: >-
      {%- set base = (report_web_url | default('') | trim) or (report_web_dest | trim if report_web_dest | trim is match('(?i)https?://') else '') -%}
      {{ (base.rstrip('/') ~ '/' ~ (_sni_web.pages[_sni_team].page | urlencode)) if base and _pages_ok | bool else '' }}
    _pages_ok: >-
      {{ _pages_out is defined and _pages_out.results | default([]) | rejectattr('skipped', 'defined')
         | selectattr('published', 'equalto', false) | list | length == 0 }}
  loop: "{{ _sni_web.jobs | selectattr('v', 'equalto', '') | selectattr('key', 'in', _sni_leads.to.keys() | list) | list if _sni_fast | bool else [] }}"
  loop_control:
    loop_var: _sni_job
    label: "{{ _sni_job.key }}"

- name: Insights | time - the pages and the email done
  ansible.builtin.set_fact:
    _sni_t: "{{ _sni_t | default({}) | combine({'pages': now().timestamp()}) }}"

- name: Insights | time - done
  ansible.builtin.set_fact:
    _sni_t: "{{ _sni_t | default({}) | combine({'end': now().timestamp()}) }}"

- name: Insights | the time this run took
  ansible.builtin.debug:
    msg: "{{ (_sni_t | servicenow_insights_timing).line }}"

- name: Insights | is it writing? - the report database
  ansible.builtin.debug:
    msg: "{{ _sni_db_say.line }}"

- name: Insights | the tickets - from ServiceNow, from the report database (servicenow_insights_incremental)
  ansible.builtin.debug:
    msg: "{{ _sni_store_say.line }}"
  when: (_sni_store_say | default({})).line | default('') | length > 0

- name: Insights | the ACT cache - not cleared when ACT did not answer every grouping question (1.17.0b)
  ansible.builtin.debug:
    msg: "{{ _sni_act_cache_say | trim }}"
  when: _sni_act_cache_say | default('') | length > 0

- name: Insights | WARNING - records cut by servicenow_insights_max_records (the pages and the email say so at the top)
  ansible.builtin.debug:
    msg: "{{ ['WARNING - records cut, some figures are incomplete:'] + _sni_model.cut }}"
  when: _sni_model.cut | default([]) | length > 0

- name: Insights | the window before was cut (servicenow_insights_max_records) - no compare this run
  ansible.builtin.debug:
    msg: "{{ _sni_model.compare_cut }}"
  when: _sni_model.compare_cut | default('') | length > 0

- name: Insights | ServiceNow read, every group there (servicenow_insights_fail)
  ansible.builtin.assert:
    that:
      - _sni.ok | default(false) | bool
      - _sni.groups | default([]) | selectattr('found', 'equalto', false) | list | length == 0
    fail_msg: >-
      {{ _sni.error | default('') or ('assignment group(s) not in ServiceNow: '
          ~ (_sni.groups | default([]) | selectattr('found', 'equalto', false) | map(attribute='name') | join(', '))
          ~ ' - the exact name, as the group list shows it') }}
      - servicenow_insights_fail: false makes this a report only.
    quiet: true
  when: servicenow_insights_fail | bool
