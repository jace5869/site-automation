---
# THE HISTORY (1.13.0, docs/REPORT_DATABASE.md), before the pages: this run's figures worked out - the window's own, and
# each calendar month of it (the month so far partial) - and the last months read back for the page's trend. db_write.yml
# writes them next, before the pages (1.15.0). The database not reached: one warning, the report whole, the job green
# (servicenow_insights_db_required: false).
- name: Insights | the report database's login
  ansible.builtin.include_tasks: db_login.yml
  when: _sni_db is not defined          # the ticket store logged in already (1.17.0)

- name: Insights | this run's figures - the window, and each calendar month in it
  ansible.builtin.set_fact:
    _sni_db_runs: "{{ _sni | servicenow_insights_db_runs(_sni_model, _sni_opts, _sni_mask) }}"
  when: _sni_db.host | length > 0

- name: Insights | read the last {{ servicenow_insights_db_months }} months back from {{ _sni_db.host }}:{{ _sni_db.port }}/{{ _sni_db.database }}
  site_insights_db:
    mode: read
    host: "{{ _sni_db.host }}"
    port: "{{ _sni_db.port | int }}"
    database: "{{ _sni_db.database }}"
    user: "{{ _sni_db.user }}"
    password: "{{ lookup('ansible.builtin.env', 'REPORT_DB_PASSWORD') }}"
    tls: "{{ _sni_db.tls | bool }}"
    ca_file: "{{ _sni_db.ca_file }}"
    connect_timeout: "{{ servicenow_insights_db_timeout | int }}"
    create: "{{ servicenow_insights_db_create | bool and not ansible_check_mode }}"
    source: "{{ _sni_db_runs.runs[0].run.source }}"
    period: month
    month: "{{ _sni_db_runs.runs | map(attribute='run') | map(attribute='month') | max }}"
    months: "{{ servicenow_insights_db_months | int }}"
    # response_skipped (1.67.0): the months Response met leaves out servicenow_insights_response_skip_groups' response SLAs
    metrics: [sla_met_pct, response_met_pct, fcr_pct, incidents, backlog, median_resolve_h, reopen_pct, response_skipped]
    required: "{{ servicenow_insights_db_required | bool }}"
  register: _sni_hist
  check_mode: false           # only reads (in Check, nothing is made)
  when: _sni_db.host | length > 0

# 1.68.2: the month just ended, when nothing holds it complete. A run writes only the months wholly inside its window and
# the month so far, so a short window (servicenow_insights_days 7 or 30, servicenow_insights_months 1) never completed
# it: its point stayed at the last run's few days. Read once the backfill's way (that calendar month, nothing to compare,
# no ticket store) and written with this run's months; the next runs find it complete and read nothing more.
- name: Insights | the month just ended, not held complete
  ansible.builtin.set_fact:
    _sni_complete: "{{ (_sni_db_runs | servicenow_insights_month_to_complete(_sni_hist, _sni)) if servicenow_insights_until | default('', true) | string | length == 0 else '' }}"
  when: _sni_db.host | length > 0

- name: Insights | read {{ _sni_complete }} from ServiceNow once, to complete it in the report database
  site_servicenow_insights:
    url: "{{ _sni_url }}"
    username: "{{ lookup('ansible.builtin.env', 'SN_USERNAME') }}"
    password: "{{ lookup('ansible.builtin.env', 'SN_PASSWORD') }}"
    validate_certs: "{{ servicenow_validate_certs | default(true) | bool }}"
    ca_path: "{{ servicenow_ca_path | default(omit, true) }}"
    timeout: "{{ servicenow_timeout | default(30) | int }}"
    groups: "{{ _sni_groups }}"
    tables: "{{ _sni_tables }}"
    months: 1
    days: 0
    until: month_start
    compare: false
    time_zone: "{{ report_time_zone | default('', true) | string }}"
    max_records: "{{ servicenow_insights_max_records | int }}"
    audit: "{{ servicenow_insights_audit | bool }}"
    handoff_min: "{{ servicenow_insights_handoff_min | int }}"
    handoff_source: "{{ servicenow_insights_handoff_source | default('auto') | string | trim | lower }}"
    members: "{{ servicenow_insights_members | default(true) | bool }}"
    opened_by: false             # the month's figures only (1.70.4)
    group_parents: "{{ servicenow_insights_use_group_parents | default(true) | bool }}"
    now: "{{ servicenow_insights_now | default(omit, true) }}"
    sla_source: "{{ servicenow_insights_sla_source | default('auto') | string | trim | lower }}"
    first_assigned: true
    state_metric: "{{ servicenow_insights_state_metric | default('', true) | string | trim }}"
    survey: "{{ servicenow_insights_survey | default(true) | bool }}"
    survey_metrics: "{{ servicenow_insights_survey_metrics | servicenow_insights_name_list }}"
    survey_types: "{{ servicenow_insights_survey_types | default([], true) | servicenow_insights_name_list }}"
  register: _sni_cm
  check_mode: false             # only reads
  when: _sni_db.host | length > 0 and _sni_complete | default('') | length > 0 and not ansible_check_mode

- name: Insights | {{ _sni_complete }} worked out and added to this run's months
  ansible.builtin.set_fact:
    _sni_db_runs: "{{ _sni_cm | servicenow_insights_complete_month(_sni_complete, _sni_opts, _sni_db_runs) }}"
  when: _sni_cm.ok | default(false) | bool

- name: Insights | WARNING - {{ _sni_complete }} not completed this run
  ansible.builtin.debug:
    msg: "{{ _sni_complete }} was not read from ServiceNow ({{ _sni_cm.error | default('no answer') }}). The trend shows it as not complete; the next run tries again."
  when: _sni_cm.ok is defined and not _sni_cm.ok | bool

- name: Insights | the trend on the pages ({{ (_sni_hist.months_kept | default(0)) ~ ' months kept' if _sni_hist.ok | default(false) else 'the database not read' }})
  ansible.builtin.set_fact:
    _sni_model: >-
      {{ _sni_model | servicenow_insights_trend(_sni_hist, _sni_opts | combine({'trend_months': servicenow_insights_db_months}), _sni_db_runs) }}
  when: _sni_db.host | length > 0
