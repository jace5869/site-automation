---
# THE ACT CACHE (1.17.0, servicenow_insights_act_cache, docs/REPORT_DATABASE.md): each description's issue kept in the
# report database - its key as a hash, the issues by ACT's short name (masked) - so only new descriptions go to ACT. The
# fixes are asked every run (no text of ACT's is kept). servicenow_insights_act_cache_clear: everything asked again, the
# cache replaced - only when ACT answered every grouping question (1.17.0b), else it is kept as it was and the job says so.
# _sni_act_step: load or save.
- name: Insights | the ACT cache - what the report database holds
  when: _sni_act_step == 'load'
  block:
    - name: Insights | the report database's login
      ansible.builtin.include_tasks: db_login.yml
      when: _sni_db is not defined

    # 1.17.0b: site_act's defaults are not loaded here (include_role loads them later, for ACT's own run): read them, so
    # the key has the model the run really uses - set in the inventory or the job, else site_act's default
    - name: Insights | site_act's defaults - the provider and the model ACT uses when the job sets none
      ansible.builtin.include_vars:
        file: "{{ role_path }}/../site_act/defaults/main.yml"
        name: _sni_act_defaults

    - name: Insights | what the ACT cache is for - the provider, the model, the prompt
      ansible.builtin.set_fact:
        _sni_act_key: >-
          {%- set d = _sni_act_defaults -%}
          {%- set prov = site_act_provider | default(d.site_act_provider, true) | string | trim -%}
          {%- set model = site_act_model | default(d.site_act_model | default(''), true) -%}
          {%- set models = site_act_models | default(d.site_act_models | default({})) -%}
          {{ _sni_opts | servicenow_insights_act_cache_key(prov, model or models[prov] | default('')) }}
        _sni_act_source: "{{ {'url': _sni_url} | servicenow_insights_db_source(_sni_opts) }}"

    - name: Insights | the issues ACT gave before (insights_act_issue, insights_act_class)
      site_insights_db:
        mode: act_load
        host: "{{ _sni_db.host }}"
        port: "{{ _sni_db.port | int }}"
        database: "{{ _sni_db.database }}"
        user: "{{ _sni_db.user }}"
        password: "{{ lookup('ansible.builtin.env', 'REPORT_DB_PASSWORD') }}"
        tls: "{{ _sni_db.tls | bool }}"
        ca_file: "{{ _sni_db.ca_file }}"
        connect_timeout: "{{ servicenow_insights_db_timeout | int }}"
        create: "{{ servicenow_insights_db_create | bool and not ansible_check_mode }}"
        source: "{{ _sni_act_source }}"
        cache_key: "{{ _sni_act_key }}"
        clear: "{{ servicenow_insights_act_cache_clear | bool }}"
        required: false
        warn: false             # not reached: the figures' read warns, once (db.yml); ACT is asked everything
        warn_tables: "{{ not ansible_check_mode }}"     # the tables missing: one warning (Check makes nothing)
      register: _sni_act_cache
      check_mode: false         # only reads
      when:
        - _sni_db.host | length > 0
        - not _sni_store_tables_missing | default(false) | bool   # the store's load said so already: the cache is off

    # a fact, not the registered answer: the save step's pass skips the read above, and a skipped task's register replaces it
    - name: Insights | the descriptions the cache places, its issues first
      ansible.builtin.set_fact:
        _sni_state: "{{ _sni_state | servicenow_insights_act_cached(_sni, _sni_mask, _sni_act_cache.act, _sni_opts) }}"
        _sni_act_on: true
      when: _sni_act_cache.ok | default(false) | bool

- name: Insights | the ACT cache - this run's issues kept
  when: _sni_act_step == 'save'
  block:
    # 1.17.0b: a clear replaces the cache only when every grouping question was answered - a run ACT failed in keeps it
    - name: Insights | did ACT answer every grouping question?
      ansible.builtin.set_fact:
        _sni_act_all: "{{ _sni_act_stop | length == 0 and _sni_state.answered | default(0) | int >= _sni_desc_batches | default([]) | length }}"

    - name: Insights | the ACT cache not cleared - ACT did not answer every grouping question
      ansible.builtin.set_fact:
        _sni_act_cache_say: >-
          ACT cache: not cleared - ACT answered {{ _sni_state.answered | default(0) }} of {{ _sni_desc_batches | default([]) | length }}
          grouping questions, so the cache is kept as it was. Launch with servicenow_insights_act_cache_clear: true again.
      when:
        - _sni_act_on | default(false) | bool
        - servicenow_insights_act_cache_clear | bool
        - not _sni_act_all | bool
        - not ansible_check_mode

    - name: Insights | each description's issue into the report database (the keys as hashes, the issues' names masked)
      site_insights_db:
        mode: act_save
        host: "{{ _sni_db.host }}"
        port: "{{ _sni_db.port | int }}"
        database: "{{ _sni_db.database }}"
        user: "{{ _sni_db.user }}"
        password: "{{ lookup('ansible.builtin.env', 'REPORT_DB_PASSWORD') }}"
        tls: "{{ _sni_db.tls | bool }}"
        ca_file: "{{ _sni_db.ca_file }}"
        connect_timeout: "{{ servicenow_insights_db_timeout | int }}"
        create: "{{ servicenow_insights_db_create | bool }}"
        source: "{{ _sni_act_source }}"
        cache_key: "{{ _sni_act_key }}"
        clear: "{{ servicenow_insights_act_cache_clear | bool }}"
        rows: "{{ _sni_state | servicenow_insights_act_cache_rows(_sni_mask) }}"
        required: false
      register: _sni_act_saved
      when:
        - _sni_act_on | default(false) | bool
        - _sni_state.answered | default(0) | int > 0 or servicenow_insights_act_cache_clear | bool
        - _sni_act_all | bool or not servicenow_insights_act_cache_clear | bool
        - not ansible_check_mode
