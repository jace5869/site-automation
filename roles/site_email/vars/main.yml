---
# The looks with the strip of past runs, each its own template (report_<look>.html.j2); the others use report.html.j2
# (atlas, brief and ops: the report website only - report_web_theme)
_strip_looks: [command, portal, glass, atlas, brief, ops]
# the logo's greatest height in a look's header card (report_logo_height still applies when it is lower)
_logo_caps: {portal: 56, glass: 80, atlas: 56, brief: 64, ops: 48}
# the tallest bar of the strip of past runs, in pixels (36 in the others)
_bar_tops: {portal: 44, glass: 54}
# The copy job (tasks/copy.yml): report_web_host reached as its own host when this job's inventory has it (that host's
# connection settings), else as site-report-web (web_host.yml, with report_web_host_*). Here, not facts: a task run on
# that server reads them as that host, which does not see the AAP side's facts.
_copy_inv: "{{ report_web_host | default('') | string | trim in hostvars }}"
_copy_host: "{{ report_web_host | trim if _copy_inv | bool else 'site-report-web' }}"
_copy_conn: >-
  {{ (hostvars[report_web_host | trim].ansible_connection | default('winrm')) if _copy_inv | bool else report_web_host_connection }}
# A dry run (Check mode) leaves the report as it is - nothing written, nothing attached - unless the job asks for its
# report all the same (_report_check_live: true, with the include's check_mode false: Patch hosts' dry run, 1.74.0)
# 1.118.0: the site portal's link on the report website (report_portal_link): auto = report_portal_url, else portal_path when
# the inventory sets it (the portal on the website's server); an address or a path; "" = none
_web_portal_link: >-
  {%- set v = report_portal_link | default('auto') | string | trim -%}
  {{ ((report_portal_url | default('', true) | string | trim) or (portal_path | default('', true) | string | trim)) if v | lower == 'auto' else v }}
# 1.118.0: how AAP started this run (AWX's awx_meta_vars): scheduled - by a schedule, or as a step of a workflow a schedule
# started (awx_parent_job_schedule_id, awx_workflow_job_launch_type); else awx_job_launch_type
_web_launch: >-
  {%- set t = awx_job_launch_type | default(tower_job_launch_type | default('', true), true) | string -%}
  {%- set ids = [] -%}
  {%- for x in [awx_schedule_id | default(''), tower_schedule_id | default(''), awx_parent_job_schedule_id | default(''),
                tower_parent_job_schedule_id | default('')] if x is not boolean and (x | string) == (x | int | string) and x | int > 0 -%}
  {%- set _ = ids.append(x) -%}
  {%- endfor -%}
  {{ 'scheduled' if t == 'scheduled' or ids
     or awx_workflow_job_launch_type | default(tower_workflow_job_launch_type | default('', true), true) == 'scheduled' else t }}
_email_dry: "{{ ansible_check_mode and not _report_check_live | default(false) | bool }}"
