---
# EMAIL A REPORT through your mail relay (SMTP). Off until report_email_to has an address. Used by
# every report job: health checks, certificate reports, database health, POA&M, ServiceNow health,
# troubleshooting, the VMware jobs (docs/EMAIL_REPORTS.md). The relay settings belong in
# playbooks/group_vars/all.yml. If the relay needs a login, attach an "SMTP relay" credential
# (aap/credential_types/smtp_relay.yml) - never put a password in these settings.

# Who gets it: a list, or text with commas / spaces / one per line (a survey answer). Empty = no
# email. Set it on each TEMPLATE (its Variables, or a survey): in all.yml every report job emails.
report_email_to: []
report_email_cc: []                      # copied: a list, or text like report_email_to
# "Also email the report to": more people for one run, asked when the job is launched - a survey question
# (playbooks/aap_email_question.yml adds it to the report templates). Added to report_email_to, never in its
# place; empty = only report_email_to. A list, or text: addresses separated by commas, semicolons, spaces or
# one per line, or pasted from Outlook (Doe, Jane <jane.doe@yoursite.mil>; ...).
report_email_also: []
# The domains an address in report_email_also may be in (a subdomain too), e.g. [yoursite.mil]; any other
# is listed in the job and gets no email. Empty = any domain (your mail relay may still refuse some).
report_email_also_domains: []
report_email_from: ""                    # the sender, e.g. aap-noreply@yoursite.mil
report_email_smtp_host: ""               # your mail relay, e.g. smtp.yoursite.mil
report_email_smtp_port: 25               # 25 or 587 with starttls, 465 with ssl
# starttls = encrypt after connecting (the relay must offer it); ssl = encrypted from the start (port
# 465); none = not encrypted (only for a relay without encryption; then no login is sent).
report_email_security: starttls
report_email_ca_path: ""                 # a CA file that signed the relay's certificate (empty = the CAs the execution environment trusts)
report_email_subject_prefix: "[AAP]"     # put before every subject, e.g. "[AAP] Certificate report: ..."
# Send a formatted (HTML) version too, for reports that come with one (all VMware jobs). The email
# always carries a plain-text copy for mail clients that do not show HTML. false = plain text only.
report_email_html: true
# The look of the HTML version (docs/EMAIL_REPORTS.md, "The look"): standard = a header band in the
# report's colour (green, amber, red, blue) with number boxes under it; command = a dark header with your
# logo and report_email_header_text, the job's last runs as a strip of bars (report_history), the numbers
# in one row; portal = white cards on a pale mint background (like the AAP portal pages): a header card with
# your logo, report_email_header_text and the status, number tiles, a card with the last runs, a card per
# section. Classic desktop Outlook shows the portal cards square, without shadows. glass = see-through
# frosted cards on a soft blue-green background: your logo, the status and what it asks ("Action required"),
# tiles with icons (a warning or critical one tinted), the last runs beside This run / Last run, a card per
# section with its table on a near-solid panel; the line under the subject in the inbox, an "Open the full
# report" button with report_web_dest, tiles two by two on a phone. Mail programs that do not draw
# transparency (classic desktop Outlook) show solid white cards, square. The web page adds the blur, icons
# and a plain print.
report_email_theme: standard
report_email_header_text: Site automation report   # command, portal, glass: the line with the logo
# Your logo in the header (every look but standard): a PNG, JPEG or GIF in your repository - a path from playbooks/
# (files/report_logo.png = playbooks/files/report_logo.png) or a full path. Attached to each email, so keep
# it small: about 160 px tall, under 100 KB. Updating with scripts/update-from-release: list the file in
# .site-local, or the update deletes it.
report_logo_file: ""
report_logo_height: 84                   # pixels in the email (its width follows); portal: at most 56, glass: at most 80
# command, portal, glass: the job's last runs, read from AAP - attach a "Red Hat Ansible Automation Platform"
# credential to the template, whose user can see the template's jobs (Organization Auditor on its
# organization, docs/EMAIL_REPORTS.md); without it the email goes out without the strip.
report_history: true
report_history_runs: 14                  # bars in the strip, this run included
report_history_aap_ca_path: ""           # a CA file for AAP's own HTTPS certificate ("" = what the execution environment trusts)
# Your own look instead: copy roles/site_email/templates/report.html.j2 (or report_command / _portal / _glass) to e.g.
# playbooks/files/email/report.html.j2, change it, and set
#   report_email_html_template: "{{ playbook_dir }}/files/email/report.html.j2"
# report.html.j2 (the default) = the look report_email_theme picks.
report_email_html_template: report.html.j2

# THE REPORT WEBSITE (docs/WEB_REPORTS.md): every report job also writes its report as a web page - off until
# report_web_dest is set. Works without an email (report_email_to empty). Each run: its page, a copy as the
# template's latest page, the report's data as JSON beside each (for your own site), and an index of every
# report's last run. The job prints the page's address ("Report: https://...") and keeps it as the job artifact
# site_report_url.
# Where the files go: a folder the job can write - a share mounted on the AAP execution nodes and exposed to jobs
# (Settings > Job settings > Paths to expose to isolated jobs), e.g. /mnt/reports - or an https:// address that
# takes uploads (HTTP PUT, WebDAV: nginx, Apache, IIS). An upload's login comes from a "Report website" credential
# (aap/credential_types/report_web.yml).
report_web_dest: ""
report_web_url: ""                       # the address people open that folder at, e.g. https://reports.yoursite.mil ("" = dest when it is https://)
report_web_theme: portal                 # the page's look: standard, command, portal or glass (as report_email_theme)
# The names inside the folder, with {names} filled in: {template} (the AAP template's name, lower case with dashes;
# the play's name outside AAP), {template_id}, {job} (the AAP job; local outside AAP), {status} (ok, warning,
# critical, info), {date} (2026-10-23), {time} (0605), {year}, {month}, {day} - the time the job wrote it, UTC -
# and your own from report_web_names. Each must end in .html; folders are made as needed.
report_web_page: "{template}/{date}_{time}_job-{job}.html"   # each run's page (the address the job prints)
report_web_latest: "{template}/latest.html"                  # always the template's newest run ("" = none)
report_web_index: index.html                                 # every report's last run ("" = none)
report_web_names: {}                     # your own {names}, e.g. {site: "{{ site_code }}"} for "{site}/{template}/..."
report_web_json: true                    # the report's data as .json beside each page and index.json beside the index
report_web_ca_path: ""                   # a CA file for an https:// report_web_dest, or report_web_host's WinRM certificate ("" = what the EE trusts)
# Or on a Windows server (a file server, or the IIS server itself): report_web_host is that server, report_web_dest
# the folder on it (D:\reports, there already). The pages are made on the AAP side and written there over WinRM, in
# one PowerShell script per run (Constrained Language Mode too): nothing to mount, no WebDAV. The login: the
# "Report website" credential's user name and password, or - without it - the template's Machine credential; the
# account needs WinRM (Remote Management Users) and Modify on the folder. The connection, as your Windows inventory's:
report_web_host: ""                      # e.g. web01.yoursite.mil
report_web_host_connection: winrm        # winrm or psrp
report_web_host_port: 5986                # WinRM: 5986 (https), 5985 (http)
report_web_host_scheme: https            # https, or http (Kerberos and NTLM encrypt each message then)
report_web_host_transport: ntlm          # ntlm, kerberos (Kerberos in the EE), credssp or basic
report_web_host_cert_validation: validate   # validate (the CA: report_web_ca_path) or ignore
