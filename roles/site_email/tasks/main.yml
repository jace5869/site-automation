---
# Email one report - from any playbook: include this role with _report set (or the plain-text pair).
# Nothing happens when report_email_to is empty. In a dry run (Check) nothing is sent.
#
# Input, either a formatted report (HTML email with a plain-text copy; docs/EMAIL_REPORTS.md):
#   _report:
#     title: "VMware secure boot report: 3 VM(s) to fix"      # also the subject (after the prefix)
#     subtitle: "141 VMs in vcsa01"                            # optional
#     status: warning                                          # ok | warning | critical | info: the header colour
#     summary: [{label: VMs, value: 141}, {label: Secure boot OFF, value: 3, status: warning}]
#     sections:
#       - {title: BIOS firmware, text: "Fix: ...", status: warning, columns: [VM, Folder], rows: [[web01, /DC1/vm]]}
#       - {title: Notes, lines: [one line, another line]}
#       # optional colours of a table, one entry per row: row_status tints the row, cell_status
#       # (one status per cell, '' = none) fills that cell - e.g. the Severity column
#       - {title: Alarms, columns: [Severity, Host], rows: [[CRITICAL, esx01]], row_status: [critical], cell_status: [[critical, '']]}
#     footer: "vCenter vcsa01"                                 # optional; the AAP job line is added
# or plain text: _report_subject and _report_body.
- name: Email | who gets the report
  ansible.builtin.set_fact:
    _email_to: >-
      {{ ((report_email_to | replace(',', ' ') | replace(';', ' ')).split() if report_email_to is string
          else report_email_to) | map('string') | map('trim') | select | unique | list }}
    _email_cc: >-
      {{ ((report_email_cc | replace(',', ' ') | replace(';', ' ')).split() if report_email_cc is string
          else report_email_cc) | map('string') | map('trim') | select | unique | list }}

- name: Email | the mail settings are complete
  ansible.builtin.assert:
    that:
      - report_email_smtp_host | trim | length > 0
      - report_email_from | trim | length > 0
      - report_email_security in ['starttls', 'ssl', 'none']
    fail_msg: >-
      To email the report, set report_email_smtp_host (your mail relay) and report_email_from (the
      sender address){{ '' if report_email_security in ['starttls', 'ssl', 'none'] else ', and report_email_security to starttls, ssl or none' }}.
      docs/VMWARE.md, "Email the report".
    quiet: true
  when: _email_to | length > 0

- name: Email | the report as text (and HTML)
  ansible.builtin.set_fact:
    _email_footer: >-
      AAP job {{ awx_job_id | default(tower_job_id | default('(command line)')) }}{{ (' (' ~ awx_job_template_name ~ ')') if awx_job_template_name is defined else '' }},
      started by {{ awx_user_name | default(tower_user_name | default(lookup('ansible.builtin.env', 'USER') or 'unknown')) }},
      {{ now(fmt='%Y-%m-%d %H:%M %Z') | trim }}.
    _email_subject: "{{ (report_email_subject_prefix ~ ' ' if report_email_subject_prefix else '') ~ (_report.title if _report is defined else _report_subject) }}"
  when: _email_to | length > 0

- name: Email | send the report to {{ _email_to | join(', ') }}
  site_mail:
    host: "{{ report_email_smtp_host | trim }}"
    port: "{{ report_email_smtp_port | int }}"
    security: "{{ report_email_security }}"
    sender: "{{ report_email_from | trim }}"
    to: "{{ _email_to }}"
    cc: "{{ _email_cc }}"
    subject: "{{ _email_subject }}"
    body: "{{ _report | report_text(_email_footer) if _report is defined else _report_body ~ '\n\n--\n' ~ _email_footer }}"
    html: "{{ lookup('ansible.builtin.template', report_email_html_template) if _report is defined and report_email_html | bool else omit }}"
    ca_path: "{{ report_email_ca_path | default(omit, true) }}"
  when: _email_to | length > 0
  register: _email_sent

- name: Email | result
  ansible.builtin.debug:
    msg: "{{ _email_sent.msg }}"
  when: _email_to | length > 0
