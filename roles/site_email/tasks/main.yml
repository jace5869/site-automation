---
# Email one report - from any playbook: include this role with _report set (or the plain-text pair).
# Nothing happens when report_email_to and report_email_also are empty. In a dry run (Check) nothing is sent.
#
# Input, either a formatted report (HTML email with a plain-text copy; docs/EMAIL_REPORTS.md):
#   _report:
#     title: "VMware secure boot report: 3 VM(s) to fix"      # also the subject (after the prefix)
#     subtitle: "141 VMs in vcsa01"                            # optional
#     status: warning                                          # ok | warning | critical | info: the header colour
#     summary: [{label: VMs, value: 141}, {label: Secure boot OFF, value: 3, status: warning}]
#     sections:
#       - {title: BIOS firmware, text: "Fix: ...", status: warning, columns: [VM, Folder], rows: [[web01, /DC1/vm]]}
#       - {title: Notes, lines: [one line, another line]}
#       # optional colours of a table, one entry per row: row_status tints the row, cell_status
#       # (one status per cell, '' = none) fills that cell - e.g. the Severity column
#       - {title: Alarms, columns: [Severity, Host], rows: [[CRITICAL, esx01]], row_status: [critical], cell_status: [[critical, '']]}
#     footer: "vCenter vcsa01"                                 # optional; the AAP job line is added
# or plain text: _report_subject and _report_body.
# The look: report_email_theme (standard | command | portal), report_logo_file. The strip of past runs (command, portal)
# reads this template's earlier jobs from AAP (site_report_history); each run keeps its report's status and
# first plain-number summary value as the job artifact site_report_run, the height of its bar.
- name: Email | who gets the report
  ansible.builtin.set_fact:
    # report_email_to, and report_email_also: the "Also email the report to" box asked at launch (this run only)
    _email_to: "{{ report_email_to | email_recipients(report_email_also | default([]), report_email_also_domains) }}"
    _email_cc: >-
      {{ ((report_email_cc | replace(',', ' ') | replace(';', ' ')).split() if report_email_cc is string
          else report_email_cc) | map('string') | map('trim') | select | unique | list }}
    _email_also_refused: "{{ report_email_also | default([]) | email_also_refused(report_email_also_domains) }}"

- name: Email | not sent to these, from "Also email the report to" (report_email_also)
  ansible.builtin.debug:
    msg: "{{ _email_also_refused }}"
  when: _email_also_refused | length > 0

- name: Email | the mail settings are complete
  ansible.builtin.assert:
    that:
      - report_email_smtp_host | trim | length > 0
      - report_email_from | trim | length > 0
      - report_email_security in ['starttls', 'ssl', 'none']
    fail_msg: >-
      To email the report, set report_email_smtp_host (your mail relay) and report_email_from (the
      sender address){{ '' if report_email_security in ['starttls', 'ssl', 'none'] else ', and report_email_security to starttls, ssl or none' }}.
      docs/VMWARE.md, "Email the report".
    quiet: true
  when: _email_to | length > 0

- name: Email | the look (report_email_theme), the logo (report_logo_file)
  ansible.builtin.set_fact:
    _email_html: "{{ _report is defined and report_email_html | bool }}"
    _email_theme: "{{ report_email_theme | default('standard') | string | trim | lower }}"
    _email_logo_file: >-
      {%- set f = report_logo_file | default('') | string | trim -%}
      {{ '' if not f else (f if f.startswith('/') else playbook_dir ~ '/' ~ (f[10:] if f.startswith('playbooks/') else f)) }}
  when: _email_to | length > 0

- name: Email | report_email_theme is standard, command or portal
  ansible.builtin.assert:
    that: _email_theme in ['standard', 'command', 'portal']
    fail_msg: "report_email_theme must be standard, command or portal, not '{{ report_email_theme }}' (docs/EMAIL_REPORTS.md, \"The look\")."
    quiet: true
  when: _email_to | length > 0 and _email_html | bool

- name: Email | the logo's size
  ansible.builtin.set_fact:
    # portal: the logo sits in the header card, at most 56 px tall
    _email_logo_size: "{{ _email_logo_file | image_size([report_logo_height | int, 56] | min if _email_theme == 'portal' else report_logo_height | int) }}"
  when: _email_to | length > 0 and _email_html | bool and _email_logo_file | length > 0

- name: Email | no logo
  ansible.builtin.debug:
    msg: "No logo in the email: {{ _email_logo_file }} is not there, or not a PNG, JPEG or GIF (report_logo_file)."
  when: _email_to | length > 0 and _email_html | bool and _email_logo_file | length > 0 and _email_logo_size[0] == 0

- name: Email | this job's last runs, from AAP (report_history)
  site_report_history:
    job_id: "{{ awx_job_id | default(tower_job_id) | int }}"
    template_id: "{{ awx_job_template_id | default(tower_job_template_id) | int }}"
    runs: "{{ report_history_runs | int - 1 }}"
    ca_path: "{{ report_history_aap_ca_path }}"
  register: _email_hist
  check_mode: false                      # read only
  when: >-
    _email_to | length > 0 and _email_html | bool and _email_theme in ['command', 'portal'] and report_history | bool
    and report_history_runs | int > 1 and (awx_job_id | default(tower_job_id | default(''))) | string | length > 0
    and (awx_job_template_id | default(tower_job_template_id | default(''))) | string | length > 0

- name: Email | no strip of past runs
  ansible.builtin.debug:
    msg: "No strip of past runs in the email: {{ _email_hist.why }} (report_history)."
  when: _email_hist.why | default('') | length > 0

- name: Email | the strip of past runs
  ansible.builtin.set_fact:
    _email_runs: >-
      {{ _email_hist.runs | report_runs(_report, report_history_runs | int, 44 if _email_theme == 'portal' else 36)
         if _email_hist.ok | default(false) else [] }}
    _email_logo_cid: "{{ 'site-report-logo' if _email_logo_file | length > 0 and (_email_logo_size | default([0]))[0] > 0 else '' }}"
    _email_template: >-
      {{ report_email_html_template if report_email_html_template != 'report.html.j2' else
         ('report_' ~ _email_theme ~ '.html.j2' if _email_theme in ['command', 'portal'] else 'report.html.j2') }}
  when: _email_to | length > 0 and _email_html | bool

- name: Email | this report, for the next runs' strip (job artifact site_report_run)
  ansible.builtin.set_stats:
    data:
      site_report_run: "{{ _report | report_headline }}"
  when: _report is defined

- name: Email | the report as text (and HTML)
  ansible.builtin.set_fact:
    _email_footer: >-
      AAP job {{ awx_job_id | default(tower_job_id | default('(command line)')) }}{{ (' (' ~ awx_job_template_name ~ ')') if awx_job_template_name is defined else '' }},
      started by {{ awx_user_name | default(tower_user_name | default(lookup('ansible.builtin.env', 'USER') or 'unknown')) }},
      {{ now(fmt='%Y-%m-%d %H:%M %Z') | trim }}.
    _email_subject: "{{ (report_email_subject_prefix ~ ' ' if report_email_subject_prefix else '') ~ (_report.title if _report is defined else _report_subject) }}"
  when: _email_to | length > 0

- name: Email | send the report to {{ _email_to | join(', ') }}
  site_mail:
    host: "{{ report_email_smtp_host | trim }}"
    port: "{{ report_email_smtp_port | int }}"
    security: "{{ report_email_security }}"
    sender: "{{ report_email_from | trim }}"
    to: "{{ _email_to }}"
    cc: "{{ _email_cc }}"
    subject: "{{ _email_subject }}"
    body: "{{ _report | report_text(_email_footer, _email_runs | default([])) if _report is defined else _report_body ~ '\n\n--\n' ~ _email_footer }}"
    html: "{{ lookup('ansible.builtin.template', _email_template) if _email_html | bool else omit }}"
    images: "{{ [{'cid': _email_logo_cid, 'path': _email_logo_file}] if _email_html | bool and _email_logo_cid else [] }}"
    ca_path: "{{ report_email_ca_path | default(omit, true) }}"
  when: _email_to | length > 0
  register: _email_sent

- name: Email | result
  ansible.builtin.debug:
    msg: "{{ _email_sent.msg }}"
  when: _email_to | length > 0
