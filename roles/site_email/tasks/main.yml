---
# Email one report and/or publish it on the report website - from any playbook: include this role with _report
# set (or the plain-text pair). Nothing happens when report_email_to, report_email_also and report_web_dest are
# all empty. In a dry run (Check) nothing is sent or written.
#
# Input, either a formatted report (HTML email with a plain-text copy; docs/EMAIL_REPORTS.md):
#   _report:
#     title: "VMware secure boot report: 3 VM(s) to fix"      # also the subject (after the prefix)
#     subtitle: "141 VMs in vcsa01"                            # optional
#     status: warning                                          # ok | warning | critical | info: the header colour
#     summary: [{label: VMs, value: 141}, {label: Secure boot OFF, value: 3, status: warning}]
#     sections:
#       - {title: BIOS firmware, text: "Fix: ...", status: warning, columns: [VM, Folder], rows: [[web01, /DC1/vm]]}
#       - {title: Notes, lines: [one line, another line]}
#       # optional colours of a table, one entry per row: row_status tints the row, cell_status
#       # (one status per cell, '' = none) fills that cell - e.g. the Severity column
#       - {title: Alarms, columns: [Severity, Host], rows: [[CRITICAL, esx01]], row_status: [critical], cell_status: [[critical, '']]}
#     footer: "vCenter vcsa01"                                 # optional; the AAP job line is added
# or plain text: _report_subject and _report_body.
# The look: report_email_theme (standard | command | portal), report_logo_file. The strip of past runs (command, portal)
# reads this template's earlier jobs from AAP (site_report_history); each run keeps its report's status and
# first plain-number summary value as the job artifact site_report_run, the height of its bar.
# The website (report_web_dest; docs/WEB_REPORTS.md): the page in report_web_theme's look, named by report_web_page,
# a copy as report_web_latest, the data as JSON beside each, and report_web_index; the page's address is printed
# ("Report: https://...") and kept as the job artifact site_report_url. _report_email_skip: true = only the website.
- name: Email | who gets the report
  ansible.builtin.set_fact:
    # report_email_to, and report_email_also: the "Also email the report to" box asked at launch (this run only)
    _email_to: >-
      {{ report_email_to | email_recipients(report_email_also | default([]), report_email_also_domains)
         if not _report_email_skip | default(false) | bool else [] }}
    _email_cc: >-
      {{ ((report_email_cc | replace(',', ' ') | replace(';', ' ')).split() if report_email_cc is string
          else report_email_cc) | map('string') | map('trim') | select | unique | list }}
    _email_also_refused: >-
      {{ report_email_also | default([]) | email_also_refused(report_email_also_domains)
         if not _report_email_skip | default(false) | bool else [] }}

- name: Email | not sent to these, from "Also email the report to" (report_email_also)
  ansible.builtin.debug:
    msg: "{{ _email_also_refused }}"
  when: _email_also_refused | length > 0

- name: Email | the report website (report_web_dest)
  ansible.builtin.set_fact:
    _web_on: "{{ report_web_dest | default('') | string | trim | length > 0 }}"
    _web_win: "{{ report_web_dest | default('') | string | trim | length > 0 and report_web_host | default('') | string | trim | length > 0 }}"
    _web_theme: "{{ report_web_theme | default('portal') | string | trim | lower }}"
    _web_report: >-
      {{ _report if _report is defined else
         {'title': _report_subject | default('Report'), 'status': 'info',
          'sections': [{'title': 'Report', 'lines': (_report_body | default('')).splitlines()}]} }}
    _email_any: "{{ _email_to | length > 0 or report_web_dest | default('') | string | trim | length > 0 }}"

- name: Email | the mail settings are complete
  ansible.builtin.assert:
    that:
      - report_email_smtp_host | trim | length > 0
      - report_email_from | trim | length > 0
      - report_email_security in ['starttls', 'ssl', 'none']
    fail_msg: >-
      To email the report, set report_email_smtp_host (your mail relay) and report_email_from (the
      sender address){{ '' if report_email_security in ['starttls', 'ssl', 'none'] else ', and report_email_security to starttls, ssl or none' }}.
      docs/VMWARE.md, "Email the report".
    quiet: true
  when: _email_to | length > 0

- name: Email | the look (report_email_theme), the logo (report_logo_file)
  ansible.builtin.set_fact:
    _email_html: "{{ _report is defined and report_email_html | bool }}"
    _email_theme: "{{ report_email_theme | default('standard') | string | trim | lower }}"
    _email_logo_file: >-
      {%- set f = report_logo_file | default('') | string | trim -%}
      {{ '' if not f else (f if f.startswith('/') else playbook_dir ~ '/' ~ (f[10:] if f.startswith('playbooks/') else f)) }}
  when: _email_any | bool

- name: Email | report_email_theme is standard, command or portal
  ansible.builtin.assert:
    that: _email_theme in ['standard', 'command', 'portal']
    fail_msg: "report_email_theme must be standard, command or portal, not '{{ report_email_theme }}' (docs/EMAIL_REPORTS.md, \"The look\")."
    quiet: true
  when: _email_to | length > 0 and _email_html | bool

- name: Email | report_web_theme is standard, command or portal
  ansible.builtin.assert:
    that: _web_theme in ['standard', 'command', 'portal']
    fail_msg: "report_web_theme must be standard, command or portal, not '{{ report_web_theme }}' (docs/WEB_REPORTS.md)."
    quiet: true
  when: _web_on | bool

- name: Email | the logo's size
  ansible.builtin.set_fact:
    # portal: the logo sits in the header card, at most 56 px tall
    _email_logo_size: "{{ _email_logo_file | image_size([report_logo_height | int, 56] | min if _email_theme == 'portal' else report_logo_height | int) }}"
    _web_logo_size: "{{ _email_logo_file | image_size([report_logo_height | int, 56] | min if _web_theme == 'portal' else report_logo_height | int) }}"
  when: _email_any | bool and _email_logo_file | length > 0

- name: Email | no logo
  ansible.builtin.debug:
    msg: "No logo in the report: {{ _email_logo_file }} is not there, or not a PNG, JPEG or GIF (report_logo_file)."
  when: _email_any | bool and _email_logo_file | length > 0 and _email_logo_size[0] == 0

- name: Email | this job's last runs, from AAP (report_history)
  site_report_history:
    job_id: "{{ awx_job_id | default(tower_job_id) | int }}"
    template_id: "{{ awx_job_template_id | default(tower_job_template_id) | int }}"
    runs: "{{ report_history_runs | int - 1 }}"
    ca_path: "{{ report_history_aap_ca_path }}"
  register: _email_hist
  check_mode: false                      # read only
  when: >-
    ((_email_to | length > 0 and _email_html | bool and _email_theme in ['command', 'portal'])
     or (_web_on | bool and _web_theme in ['command', 'portal'])) and report_history | bool
    and report_history_runs | int > 1 and (awx_job_id | default(tower_job_id | default(''))) | string | length > 0
    and (awx_job_template_id | default(tower_job_template_id | default(''))) | string | length > 0

- name: Email | no strip of past runs
  ansible.builtin.debug:
    msg: "No strip of past runs in the report: {{ _email_hist.why }} (report_history)."
  when: _email_hist.why | default('') | length > 0

- name: Email | the strip of past runs
  ansible.builtin.set_fact:
    _email_runs: >-
      {{ _email_hist.runs | report_runs(_report | default(_web_report), report_history_runs | int, 44 if _email_theme == 'portal' else 36)
         if _email_hist.ok | default(false) else [] }}
    _web_runs: >-
      {{ _email_hist.runs | report_runs(_web_report, report_history_runs | int, 44 if _web_theme == 'portal' else 36)
         if _email_hist.ok | default(false) else [] }}
    _email_logo_cid: "{{ 'site-report-logo' if _email_logo_file | length > 0 and (_email_logo_size | default([0]))[0] > 0 else '' }}"
    _email_template: >-
      {{ report_email_html_template if report_email_html_template != 'report.html.j2' else
         ('report_' ~ _email_theme ~ '.html.j2' if _email_theme in ['command', 'portal'] else 'report.html.j2') }}
  when: _email_any | bool

- name: Email | this report, for the next runs' strip (job artifact site_report_run)
  ansible.builtin.set_stats:
    data:
      site_report_run: "{{ _report | report_headline }}"
  when: _report is defined

- name: Email | the report as text (and HTML)
  ansible.builtin.set_fact:
    _email_footer: >-
      AAP job {{ awx_job_id | default(tower_job_id | default('(command line)')) }}{{ (' (' ~ awx_job_template_name ~ ')') if awx_job_template_name is defined else '' }},
      started by {{ awx_user_name | default(tower_user_name | default(lookup('ansible.builtin.env', 'USER') or 'unknown')) }},
      {{ now(fmt='%Y-%m-%d %H:%M %Z') | trim }}.
    _email_subject: "{{ (report_email_subject_prefix ~ ' ' if report_email_subject_prefix else '') ~ (_report.title if _report is defined else _report_subject) }}"
  when: _email_any | bool

- name: Email | the report website's file names (report_web_page, report_web_latest, report_web_index)
  ansible.builtin.set_fact:
    _web_files: >-
      {%- set t = now(utc=true) -%}
      {{ {'page': report_web_page, 'latest': report_web_latest, 'index': report_web_index} | report_web_files(
           {'template': awx_job_template_name | default(tower_job_template_name | default(ansible_play_name | default('report'))),
            'template_id': awx_job_template_id | default(tower_job_template_id | default('local')),
            'job': awx_job_id | default(tower_job_id | default('local')),
            'status': _web_report.status | default('info'),
            'date': t.strftime('%Y-%m-%d'), 'time': t.strftime('%H%M'),
            'year': t.strftime('%Y'), 'month': t.strftime('%m'), 'day': t.strftime('%d')} | combine(report_web_names | default({}))) }}
    _web_when: "{{ now(utc=true, fmt='%Y-%m-%d %H:%M UTC') }}"
  when: _web_on | bool

- name: Email | report_web_dest is a folder on report_web_host
  ansible.builtin.assert:
    that: report_web_dest | trim is match('^[A-Za-z]:[/\\\\]') or report_web_host_connection == 'local'
    fail_msg: >-
      With report_web_host, report_web_dest is the folder on that server, e.g. D:\reports - not '{{ report_web_dest }}'
      (a share's \\server\share path does not work over WinRM: it would be a second hop).
    quiet: true
  when: _web_win | bool

- name: Email | report_web_host, for the copy (the login - the Report website credential, else the Machine credential)
  ansible.builtin.add_host:
    name: site-report-web
    ansible_host: "{{ report_web_host | trim }}"
    ansible_port: "{{ report_web_host_port | int }}"
    ansible_winrm_scheme: "{{ report_web_host_scheme }}"
    ansible_winrm_transport: "{{ report_web_host_transport }}"
    ansible_winrm_server_cert_validation: "{{ report_web_host_cert_validation }}"
    ansible_winrm_ca_trust_path: "{{ report_web_ca_path | default('', true) or omit }}"
    ansible_psrp_protocol: "{{ report_web_host_scheme }}"
    ansible_psrp_auth: "{{ report_web_host_transport }}"
    ansible_psrp_cert_validation: "{{ report_web_host_cert_validation }}"
    ansible_psrp_ca_path: "{{ report_web_ca_path | default('', true) or omit }}"
    ansible_user: "{{ lookup('ansible.builtin.env', 'REPORT_WEB_USERNAME') or omit }}"
    ansible_password: "{{ lookup('ansible.builtin.env', 'REPORT_WEB_PASSWORD') or omit }}"
    ansible_become: false
  changed_when: false
  no_log: true
  when: _web_win | bool and not ansible_check_mode

- name: Email | report_web_host - its folder, and the index there
  ansible.builtin.include_tasks: web_windows.yml
  vars:
    ansible_connection: "{{ report_web_host_connection }}"
    _web_ps: site_report_web_read.ps1
    _web_ps_what: the folder {{ report_web_dest | trim }}, and the index there
    _web_ps_config:
      dest: "{{ report_web_dest | trim }}"
      index: "{{ (_web_files.index[:-5] ~ '.json').split('/') if _web_files.index else [] }}"
  when: _web_win | bool and not ansible_check_mode

- name: Email | report_web_host's answer
  ansible.builtin.set_fact:
    _web_win_read: "{{ ((_web_ps_out.stdout_lines | default([]) | select('match', '^###SITE-JSON### ') | list | last | default('###SITE-JSON### {}'))[16:] | from_json).read | default({}) }}"
  when: _web_win | bool and not ansible_check_mode

- name: Email | report_web_host answered, and report_web_dest is there
  ansible.builtin.assert:
    that: _web_win_read.ok | default(false)
    fail_msg: "The report website: {{ _web_win_read.error | default('', true) or (_web_ps_out | site_web_win_error(_web_win_where)) }}"
    quiet: true
  vars:
    _web_win_where: "{{ report_web_host | trim }} ({{ report_web_host_connection }}, port {{ report_web_host_port }})"
  when: _web_win | bool and not ansible_check_mode

- name: Email | publish the report on the report website ({{ report_web_dest | default('') }})
  site_report_web:
    dest: "{{ report_web_dest | trim }}"
    url: "{{ report_web_url | default('') | trim }}"
    files: "{{ _web_files }}"
    html: >-
      {{ lookup('ansible.builtin.template', 'report_' ~ _web_theme ~ '.html.j2' if _web_theme in ['command', 'portal'] else 'report.html.j2') }}
    images: "{{ [{'cid': 'site-report-logo', 'path': _email_logo_file}] if _web_logo_cid | bool else [] }}"
    logo_size: "{{ _web_logo_size if _web_logo_cid | bool else [] }}"
    header_text: "{{ report_email_header_text | default('Site automation report') }}"
    json: "{{ report_web_json | bool }}"
    data:
      report: "{{ _web_report }}"
      job: "{{ awx_job_id | default(tower_job_id | default('local')) }}"
      template: "{{ awx_job_template_name | default(tower_job_template_name | default(ansible_play_name | default(''))) }}"
      template_id: "{{ awx_job_template_id | default(tower_job_template_id | default('')) }}"
      when: "{{ _web_when }}"
      runs: "{{ _web_runs | default([]) }}"
    entry:
      key: "{{ _web_files.latest or _web_files.page.split('/')[0] }}"
      name: "{{ awx_job_template_name | default(tower_job_template_name | default(ansible_play_name | default('Report'))) }}"
      title: "{{ _web_report.title | default('') }}"
      status: "{{ _web_report.status | default('info') }}"
      when: "{{ _web_when }}"
      job: "{{ awx_job_id | default(tower_job_id | default('local')) }}"
    ca_path: "{{ report_web_ca_path | default('') }}"
    windows_host: "{{ report_web_host | default('') | trim if _web_win | bool else '' }}"
    index_text: "{{ _web_win_read.index | default('', true) if _web_win | bool and not ansible_check_mode else '' }}"
  vars:
    # the web copy: its own look's logo size and strip (report_web_theme), the logo put inside the page
    _web_logo_cid: "{{ _email_logo_file | length > 0 and (_web_logo_size | default([0]))[0] > 0 }}"
    _report: "{{ _web_report }}"
    _page_logo_cid: "{{ 'site-report-logo' if _web_logo_cid | bool else '' }}"
    _page_logo_size: "{{ _web_logo_size | default([0, 0]) }}"
    _page_runs: "{{ _web_runs | default([]) }}"
  register: _web_out
  when: _web_on | bool

- name: Email | report_web_host - this run's pages written there
  when: _web_win | bool and not ansible_check_mode
  block:
    - name: Email | report_web_host - this run's pages
      ansible.builtin.include_tasks: web_windows.yml
      vars:
        ansible_connection: "{{ report_web_host_connection }}"
        _web_ps: "{{ _web_out.script }}"
        _web_ps_what: this run's pages, in {{ report_web_dest | trim }}
        _web_ps_config: {}
        _web_ps_changed: true

    - name: Email | report_web_host's answer, on the pages
      ansible.builtin.set_fact:
        _web_win_write: "{{ ((_web_ps_out.stdout_lines | default([]) | select('match', '^###SITE-JSON### ') | list | last | default('###SITE-JSON### {}'))[16:] | from_json).write | default({}) }}"
  always:
    - name: Email | report_web_host - the script made for it, deleted here
      ansible.builtin.file:
        path: "{{ _web_out.script }}"
        state: absent

- name: Email | report_web_host wrote the pages
  ansible.builtin.assert:
    that: _web_win_write.ok | default(false)
    fail_msg: >-
      The report website: {{ _web_win_write.error | default('', true) or (_web_ps_out | site_web_win_error(_web_win_where)) }}
      {{- (' (written before it stopped: ' ~ _web_win_write.written | join(', ') ~ ')') if _web_win_write.written | default([]) else '' }}
    quiet: true
  vars:
    _web_win_where: "{{ report_web_host | trim }} ({{ report_web_host_connection }}, port {{ report_web_host_port }})"
  when: _web_win | bool and not ansible_check_mode

- name: Email | the report's address
  ansible.builtin.debug:
    msg: >-
      {{ 'Report: ' ~ _web_out.url if _web_out.url and not ansible_check_mode
         else ('Published: ' ~ _web_out.place) if _web_win | bool and not ansible_check_mode else _web_out.msg }}
  when: _web_on | bool

- name: Email | the report's address, for the next step (job artifact site_report_url)
  ansible.builtin.set_stats:
    data:
      site_report_url: "{{ _web_out.url }}"
  when: _web_on | bool and _web_out.url | default('') | length > 0 and not ansible_check_mode

- name: Email | the email links its web copy
  ansible.builtin.set_fact:
    _email_web_url: "{{ _web_out.url if _web_on | bool and not ansible_check_mode else '' }}"
  when: _email_to | length > 0

- name: Email | send the report to {{ _email_to | join(', ') }}
  site_mail:
    host: "{{ report_email_smtp_host | trim }}"
    port: "{{ report_email_smtp_port | int }}"
    security: "{{ report_email_security }}"
    sender: "{{ report_email_from | trim }}"
    to: "{{ _email_to }}"
    cc: "{{ _email_cc }}"
    subject: "{{ _email_subject }}"
    body: "{{ _report | report_text(_email_footer ~ _email_web_line, _email_runs | default([])) if _report is defined else _report_body ~ '\n\n--\n' ~ _email_footer ~ _email_web_line }}"
    html: "{{ lookup('ansible.builtin.template', _email_template) if _email_html | bool else omit }}"
    images: "{{ [{'cid': _email_logo_cid, 'path': _email_logo_file}] if _email_html | bool and _email_logo_cid else [] }}"
    ca_path: "{{ report_email_ca_path | default(omit, true) }}"
  when: _email_to | length > 0
  vars:
    _email_web_line: "{{ ('\nIn a browser: ' ~ _email_web_url) if _email_web_url | default('') else '' }}"
  register: _email_sent

- name: Email | result
  ansible.builtin.debug:
    msg: "{{ _email_sent.msg }}"
  when: _email_to | length > 0
