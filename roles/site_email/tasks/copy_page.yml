---
# One report job's page, for the copy job (tasks/copy.yml): made in report_web_theme's look from what that job kept
# (_copy_item.packed - its report, its strip of past runs, its file names and address, its footer) and written on the
# report website: over WinRM on report_web_host (the index carried on from the page before, _copy_index), or into the
# folder, or uploaded. The page says the report job (its number, template, footer), not this one. A page that fails is
# a warning naming the job and why, kept in _copy_failed (copy.yml keeps those jobs for the next run, which tries them
# again first) - the other pages are still written, and where the run got to still moves on.
- name: Copy | job {{ _copy_item.job }} ({{ _copy_item.template }})
  block:
    - name: Copy | job {{ _copy_item.job }} ({{ _copy_item.template }}) - its page
      site_report_web:
        dest: "{{ report_web_dest | trim }}"
        url: "{{ report_web_url | default('') | trim }}"
        page_url: "{{ _copy_doc.url | default('') }}"
        files: "{{ _copy_doc.files }}"
        html: >-
          {{ lookup('ansible.builtin.template', 'report_' ~ _web_theme ~ '.html.j2' if _web_theme in _strip_looks else 'report.html.j2')
             | report_page_extend(_copy_doc.page_extra | default({}) | report_page_piece(role_path ~ '/../..')) }}
        images: "{{ [{'cid': 'site-report-logo', 'path': _email_logo_file}] if _web_logo_cid | bool else [] }}"
        logo_size: "{{ _web_logo_size if _web_logo_cid | bool else [] }}"
        header_text: "{{ report_email_header_text | default('Site automation report') }}"
        portal_link: "{{ _web_portal_link }}"
        theme: "{{ _web_theme }}"
        # 1.115.0: the Christmas theme (docs/WEB_REPORTS.md) - none, christmas or auto; the look, the parts the viewer may turn off
        season: "{{ 'none' if report_theme_season | default('none') is sameas false else report_theme_season | default('none') | string | trim | lower }}"
        season_style: "{{ report_theme_season_style | default('16bit') | string | trim | lower }}"
        season_lights: "{{ report_theme_season_lights | default(true) | bool }}"
        season_twinkle: "{{ report_theme_season_twinkle | default(true) | bool }}"
        season_snow: "{{ report_theme_season_snow | default(true) | bool }}"
        time_zone: "{{ report_time_zone | default('', true) | string | trim }}"      # the copy job's own
        json: "{{ report_web_json | bool }}"
        # the report template's own (kept with its report), else the copy job's
        history: "{{ _copy_doc.history | default(report_web_history) | int }}"
        delete_old: "{{ _copy_doc.delete_old | default(report_web_delete_old) | bool }}"
        tabs: "{{ report_web_tabs }}"
        data: "{{ _copy_doc.data }}"
        entry: "{{ _copy_doc.entry }}"
        ca_path: "{{ report_web_ca_path | default('') }}"
        smb_auth: "{{ report_web_smb_auth | default('negotiate') }}"
        smb_encrypt: "{{ report_web_smb_encrypt | default(false) | bool }}"
        smb_port: "{{ report_web_smb_port | default(445) | int }}"
        retries: "{{ report_web_retries | default(3) | int }}"          # the copy job's own failure stays a failure (required)
        retry_delay: "{{ report_web_retry_delay | default(30) | int }}"
        windows_host: "{{ report_web_host | trim if _web_win | bool else '' }}"
        index_text: "{{ _copy_index | default('') if _web_win | bool else '' }}"
        # 1.79.8: the files the report job kept with its report (those too big to keep: named on the page)
        kept_files: "{{ _copy_doc.downloads | default([]) if report_web_files | default(true) | bool else [] }}"   # content only
        index_gone: "{{ _copy_gone | default([]) if _web_win | bool else [] }}"
        lock_wait: "{{ report_web_index_lock_wait | default(120) | int }}"
        index_sha: "{{ _copy_sha | default('') if _web_win | bool else '' }}"
        index_pending: "{{ _copy_pending | default([]) if _web_win | bool else [] }}"
        downloads_refused: "{{ _copy_doc.downloads_refused | default([]) }}"
        files_max_mb: "{{ report_web_files_max_mb | default(20) | int }}"
        files_types: "{{ report_web_files_types | default(['.xml', '.docx', '.xlsx', '.csv', '.md', '.txt', '.pdf']) + _copy_doc.data.files_more | default([]) }}"
        files_total_max_mb: "{{ report_web_files_total_max_mb | default(500) | int }}"
        files_keep_days: "{{ report_web_files_keep_days | default(30) | int }}"
      vars:
        _copy_doc: "{{ _copy_item.packed | report_page_unpack }}"
        _web_logo_cid: "{{ _email_logo_file | length > 0 and (_web_logo_size | default([0]))[0] > 0 }}"
        # the report job's own report, strip, number, template and footer line (the page is that job's)
        _report: "{{ _copy_doc.data.report }}"
        _page_runs: "{{ _copy_doc.data.runs | default([]) }}"
        _page_job: "{{ _copy_doc.data.job }}"
        _page_template: "{{ _copy_doc.data.template | default('') }}"
        _email_footer: "{{ _copy_doc.footer | default('') }}"
        _page_logo_cid: "{{ 'site-report-logo' if _web_logo_cid | bool else '' }}"
        _page_logo_size: "{{ _web_logo_size | default([0, 0]) }}"
      register: _copy_out

    - name: Copy | job {{ _copy_item.job }} - its page written on report_web_host
      when: _web_win | bool
      block:
        - name: Copy | job {{ _copy_item.job }} - its page there
          ansible.builtin.include_tasks: web_windows.yml
          vars:
            ansible_connection: "{{ _copy_conn }}"
            _web_ps_host: "{{ _copy_host }}"
            _web_ps_pwsh: "{{ _copy_conn == 'local' }}"
            _web_ps: "{{ _copy_out.script }}"
            _web_ps_what: job {{ _copy_item.job }}'s page, in {{ report_web_dest | trim }}
            _web_ps_config: {}
            _web_ps_changed: true

        - name: Copy | report_web_host's answer, on the page
          ansible.builtin.set_fact:
            _web_win_write: "{{ ((_web_ps_out.stdout_lines | default([]) | select('match', '^###SITE-JSON### ') | list | last | default('###SITE-JSON### {}'))[16:] | from_json).write | default({}) }}"
      always:
        - name: Copy | the script made for it, deleted here
          ansible.builtin.file:
            path: "{{ _copy_out.script }}"
            state: absent
          when: _copy_out.script | default('') | length > 0

    - name: Copy | job {{ _copy_item.job }} - report_web_host wrote its page
      ansible.builtin.assert:
        that: _web_win_write.ok | default(false)
        fail_msg: >-
          The report website, job {{ _copy_item.job }}: {{ _web_win_write.error | default('', true) or (_web_ps_out | site_web_win_error(_copy_where, _copy_inv | bool)) }}
          {{- (' (written before it stopped: ' ~ _web_win_write.written | join(', ') ~ ')') if _web_win_write.written | default([]) else '' }}
        quiet: true
      when: _web_win | bool

    - name: Copy | job {{ _copy_item.job }} - not written (open there all that time - the next run writes it), or older runs' pages not deleted (Modify on the folder)
      ansible.builtin.debug:
        msg: "{{ _web_win_write.busy | default([]) + _web_win_write.left | default([]) }}"
      when: _web_win | bool and (_web_win_write.busy | default([]) + _web_win_write.left | default([])) | length > 0

    # 1.79.14: the index changed there meanwhile and this page went to index.pending-*: the next page reads it again
    - name: Copy | job {{ _copy_item.job }} - the index read again there (another job wrote it meanwhile)
      when: _web_win | bool and _web_win_write.pending | default([]) | length > 0
      block:
        - name: Copy | job {{ _copy_item.job }} - the index there, again
          ansible.builtin.include_tasks: web_windows.yml
          vars:
            ansible_connection: "{{ _copy_conn }}"
            _web_ps_host: "{{ _copy_host }}"
            _web_ps_pwsh: "{{ _copy_conn == 'local' }}"
            _web_ps: site_report_web_read.ps1
            _web_ps_what: the index in {{ report_web_dest | trim }}, again
            _web_ps_config:
              dest: "{{ report_web_dest | trim }}"
              index: "{{ (report_web_index[:-5] ~ '.json').split('/') if report_web_index else [] }}"

        - name: Copy | job {{ _copy_item.job }} - its answer
          ansible.builtin.set_fact:
            _copy_reread: "{{ ((_web_ps_out.stdout_lines | default([]) | select('match', '^###SITE-JSON### ') | list | last | default('###SITE-JSON### {}'))[16:] | from_json).read | default({}) }}"

    - name: Copy | job {{ _copy_item.job }} - done
      ansible.builtin.set_fact:
        # the index as this page wrote it - or, when it went to a pending file, as read there again just now
        _copy_index: "{{ _copy_reread.index | default('', true) if _copy_reread is defined and _copy_reread else _copy_out.index_text | default('') }}"
        _copy_sha: "{{ _copy_reread.sha | default('') if _copy_reread is defined and _copy_reread else _copy_out.index_sha | default('') }}"
        _copy_pending: "{{ _copy_reread.pending | default([]) if _copy_reread is defined and _copy_reread else [] }}"
        _copy_gone: "{{ _copy_gone | default([]) | difference([(_copy_item.packed | report_page_unpack).files.page]) if _web_win | bool else [] }}"
        _copy_written: >-
          {{ _copy_written | default([]) + ['job ' ~ _copy_item.job ~ " '" ~ _copy_item.template ~ "': "
             ~ (_copy_out.url or _copy_out.place)
             ~ ('' if _copy_out.newest | default(true) else ' (an older run than the one there: its latest page and index line left as they are)')] }}
    - name: Copy | job {{ _copy_item.job }} - its read again used
      ansible.builtin.set_fact:
        _copy_reread: {}

  rescue:
    - name: Copy | job {{ _copy_item.job }} - not copied, tried again by the next run
      ansible.builtin.set_fact:
        _copy_failed: >-
          {{ _copy_failed | default([]) + [{'job': _copy_item.job, 'template': _copy_item.template, 'page': _copy_item.url or _copy_item.page,
                                            'why': ansible_failed_result.msg | default('failed') | string | regex_replace('\s*[\r\n]+\s*', ' ') | truncate(300)}] }}

    - name: Copy | job {{ _copy_item.job }} - WARNING, its page was not copied
      ansible.builtin.debug:
        msg: >-
          WARNING - job {{ _copy_item.job }} '{{ _copy_item.template }}': its page {{ _copy_item.url or _copy_item.page }} was not
          copied: {{ _copy_failed[-1].why }}. The other pages go on; {{ 'the next run tries this job again'
          if _copy.until | length > 0 else 'launch the copy job again with report_web_copy_jobs to try it again' }}.
