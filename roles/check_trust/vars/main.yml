# The certificates the trust check looks for (roles/check_trust: the check "trust", playbooks/trust_report.yml).
# Each: name, kind (intermediate / root), issuer, serial, sha256 (the certificate), spki_sha256 (its public key:
# another certificate with the same key is a hit too), severity (critical / warning / notice - notice is listed
# in the report, no finding; check_trust_severity changes any), why, since. Add your own in check_trust_extra.
#
# October 2026: eight eMudhra (emSign) intermediate CAs whose private keys were weak enough to compute from the
# certificates - six for TLS, two for code signing - each issued twice (by eMudhra's own root, and cross-signed
# by Sectigo's AAA Certificate Services), all revoked. Go CVE-2026-111943; Red Hat RHSB-2026-012; Mozilla bug
# 2083449. Browsers block them; everything with its own trust store needs its update (docs/TRUST_STORES.md).
