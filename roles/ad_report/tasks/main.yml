---
# On the AAP side (playbooks/ad_health_report.yml, last play: localhost, or the Limit's first host standing in for it):
# the report, in plugins/filter/ad_filters.py - in admin mode from what every DC and each domain's reading DC answered
# over WinRM (collect.yml), in reader mode from what reader.yml reads here over LDAP, DNS and Kerberos. Printed,
# emailed (report_email_to) and published as job artifacts (ad_health). Green unless ad_report_fail.
- name: AD | ad_health_mode is auto, admin or reader
  ansible.builtin.assert:
    that: (ad_health_mode | string | lower) in ['auto', 'admin', 'reader']
    fail_msg: "ad_health_mode is '{{ ad_health_mode }}': auto, admin or reader (docs/ACTIVE_DIRECTORY.md)."
    quiet: true

- name: AD | the answers of the domain controllers
  ansible.builtin.set_fact:
    _ad_dcs: "{{ groups['all'] | map('extract', hostvars) | selectattr('ad_dc_result', 'defined') | map(attribute='ad_dc_result') | list }}"
    _ad_domains: "{{ groups['all'] | map('extract', hostvars) | selectattr('ad_domain_result', 'defined') | map(attribute='ad_domain_result') | list }}"

- name: AD | admin or reader mode
  ansible.builtin.set_fact:
    _ad_mode: "{{ _ad_dcs | ad_mode(ad_health_mode) }}"

- name: "AD | {{ _ad_mode.mode }} mode - {{ _ad_mode.why }}"
  ansible.builtin.debug:
    msg: >-
      {{ "Admin mode: each DC was read over WinRM." if _ad_mode.mode == "admin" else
         "Reader mode: Active Directory is read from here over LDAP, DNS and Kerberos as the job's account - dcdiag, repadmin, "
         ~ "services, SYSVOL, disks and events are not run (they need admin on the DCs)." }}

- name: AD | some domain controller answered
  ansible.builtin.assert:
    that: _ad_dcs | length > 0
    fail_msg: >-
      No domain controller was read: the job ran on no Windows host of the target ({{ target | default('win_dc') }}).
      Put the DCs in the group win_dc of the Windows inventory, or set target.
    quiet: true
  when: _ad_mode.mode == 'admin'

- name: AD | reader mode - read Active Directory from here
  ansible.builtin.include_tasks: reader.yml
  when: _ad_mode.mode == 'reader'

- name: AD | the report (reader mode)
  ansible.builtin.set_fact:
    _ad: >-
      {{ _ad_reader | ad_reader_report({
           'hours': ad_report_hours | float, 'mode_why': _ad_mode.why,
           'repl_warn_hours': ad_repl_warn_hours | float, 'repl_crit_hours': ad_repl_crit_hours | float,
           'clock_warn_seconds': ad_reader_clock_warn_seconds | float, 'clock_crit_seconds': ad_reader_clock_crit_seconds | float,
           'cert_warn_days': ad_cert_warn_days | float, 'cert_crit_days': ad_cert_crit_days | float,
           'krbtgt_max_days': ad_krbtgt_max_days | float, 'rid_warn_pct': ad_rid_warn_pct | float, 'rid_crit_pct': ad_rid_crit_pct | float,
           'groups_should_be_empty': ad_groups_should_be_empty, 'privileged_change_severity': ad_privileged_change_severity,
           'changes_max': ad_changes_max | int, 'max_rows': ad_report_max_rows | int, 'now': ad_report_now | default(''),
           'time_zone': report_time_zone | default('', true) | string}) }}
  when: _ad_mode.mode == 'reader'

# one dict expression: on ansible-core 2.16 the values of a YAML dict would arrive as strings
- name: AD | the report
  ansible.builtin.set_fact:
    _ad: >-
      {{ _ad_dcs | ad_report(_ad_domains, {
           'hours': ad_report_hours | float, 'event_hours': ad_event_hours | float,
           'repl_warn_hours': ad_repl_warn_hours | float, 'repl_crit_hours': ad_repl_crit_hours | float,
           'repl_queue_warn': ad_repl_queue_warn | int,
           'time_warn_seconds': ad_time_warn_seconds | float, 'time_crit_seconds': ad_time_crit_seconds | float,
           'time_sync_warn_hours': ad_time_sync_warn_hours | float,
           'disk_warn_pct': ad_disk_warn_pct | float, 'disk_crit_pct': ad_disk_crit_pct | float,
           'cert_warn_days': ad_cert_warn_days | float, 'cert_crit_days': ad_cert_crit_days | float,
           'backup_warn_days': ad_backup_warn_days | float, 'backup_crit_days': ad_backup_crit_days | float,
           'krbtgt_max_days': ad_krbtgt_max_days | float, 'rid_warn_pct': ad_rid_warn_pct | float, 'rid_crit_pct': ad_rid_crit_pct | float,
           'no_client_site_warn': ad_no_client_site_warn | int, 'groups_should_be_empty': ad_groups_should_be_empty,
           'privileged_change_severity': ad_privileged_change_severity, 'schema_change_severity': ad_schema_change_severity,
           'dc_change_severity': ad_dc_change_severity, 'dcdiag_skip': ad_dcdiag_skip, 'changes_max': ad_changes_max | int,
           'max_rows': ad_report_max_rows | int, 'now': ad_report_now | default(''), 'mode_line': 'admin mode (WinRM on each DC)',
           'time_zone': report_time_zone | default('', true) | string}) }}
  when: _ad_mode.mode == 'admin'

- name: AD | the replication matrix (1.63.0)
  ansible.builtin.include_tasks: repl.yml
  when: ad_repl_matrix | bool and _ad.repl is defined

# the email: the late links before Inbound replication; the website (atlas, brief): the matrix, the late links and the
# trend there; the workbook (report_email_xlsx): the report's tables and every link
- name: AD | the report to print and email
  ansible.builtin.set_fact:
    _ad_doc: "{{ _ad.report | ad_repl_insert(_ad_repl.sections | default([])) }}"
    _ad_web: "{{ _ad.report | ad_repl_insert(_ad_repl.web_sections) if _ad_repl.web_sections is defined else {} }}"
    _ad_xlsx: >-
      {{ (_ad.report | ad_repl_insert(_ad_repl.sections) | report_xlsx_sheets) + _ad_repl.sheets
         if _ad_repl.sheets is defined and report_email_xlsx | default(false) | bool else [] }}

- name: AD | report
  ansible.builtin.include_tasks: report.yml

- name: AD | the findings as job artifacts (ad_health)
  ansible.builtin.set_stats:
    data:
      ad_health: >-
        {{ {'dcs': _ad.dcs, 'domains': _ad.domains, 'critical': _ad.critical, 'warning': _ad.warning, 'problems': _ad.problems} }}

- name: AD | no critical finding, every DC read
  ansible.builtin.assert:
    that:
      - _ad.critical | int == 0
      - _ad.dcs | rejectattr('read') | list | length == 0
    fail_msg: >-
      {{ _ad.critical }} critical finding(s), {{ _ad.dcs | rejectattr('read') | list | length }} DC(s) not read
      (the report is above). ad_report_fail: false makes this a report only.
    quiet: true
  when: ad_report_fail | bool
