---
# Print the report, publish it as artifacts and email it (report_email_to). Input: _ad_doc (a report
# in the layout roles/site_email/tasks/main.yml describes).
- name: AD | the report as job artifacts (ad_report)
  ansible.builtin.set_stats:
    data:
      ad_report:
        subject: "{{ _ad_doc.title }}"
        lines: "{{ (_ad_doc | report_text).splitlines() }}"

- name: AD | {{ _ad_doc.title }}
  ansible.builtin.debug:
    msg: "{{ (_ad_doc | report_text).splitlines() }}"

- name: AD | the DCs' group, for the classification banner (the report runs on the AAP side, the DCs say the enclave)
  ansible.builtin.set_fact:
    _ad_dc_pattern: "{{ target | default('win_dc' if 'win_dc' in groups else 'domain_controllers') }}"

- name: AD | email it, publish it (report_email_to, report_web_dest)
  ansible.builtin.include_role:
    name: site_email
  vars:
    # site_email finds the enclave from the play's hosts, the Limit's and target's: the play is on the AAP side, so the
    # DCs come in as target (as when the report ran on them, before 1.4.0)
    target: "{{ _ad_dc_pattern }}"
    _report: >-
      {{ _ad_doc | combine({'footer': 'Read-only: LDAP reads, dcdiag, repadmin, w32tm and the event logs on each domain controller.'
                            if _ad_mode.mode | default('admin') == 'admin' else
                            'Read-only, reader mode: LDAP, DNS and Kerberos from the AAP side as a plain domain user.'}) }}
  when: report_email_to | default([]) | length > 0 or report_email_also | default([]) | length > 0 or report_web_dest | default('') | length > 0

- name: AD | no email
  ansible.builtin.debug:
    msg: "No email: report_email_to is not set (docs/EMAIL_REPORTS.md)."
  when: report_email_to | default([]) | length == 0 and report_email_also | default([]) | length == 0
