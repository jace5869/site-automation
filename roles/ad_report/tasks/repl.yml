---
# THE REPLICATION MATRIX (1.63.0): sections of the AD health report, in admin and reader mode. Read only: it uses what the
# report read (_ad.repl). The trend: this template's earlier runs' ad_repl artifact (AAP job history), and the report
# database when the template has a "Report database" credential (site_ad_repl_db - the only thing this writes). Never
# fails the job. plugins/filter/ad_repl_filters.py
- name: AD | replication - earlier runs (AAP job history)
  ansible.builtin.include_role:
    name: site_email
    tasks_from: history_artifacts.yml
  vars:
    _hist_artifacts: [ad_repl]
    _hist_runs: "{{ ad_repl_history_runs }}"
  when: ad_repl_history | bool

- name: AD | replication - the report database
  ansible.builtin.set_fact:
    _ad_repl_db_host: "{{ lookup('ansible.builtin.env', 'REPORT_DB_HOST') | trim if ad_repl_db | bool else '' }}"
    _ad_repl_point: "{{ _ad.repl | ad_repl_view([], {'low_hours': ad_repl_low_hours | float, 'warn_hours': ad_repl_warn_hours | float, 'crit_hours': ad_repl_crit_hours | float}) }}"

- name: AD | replication - the report database's earlier points, and this run's kept (ad_repl_db)
  site_ad_repl_db:
    host: "{{ _ad_repl_db_host }}"
    port: "{{ lookup('ansible.builtin.env', 'REPORT_DB_PORT') | default('3309', true) | int }}"
    database: "{{ lookup('ansible.builtin.env', 'REPORT_DB_NAME') | default('site_reports', true) | trim }}"
    user: "{{ lookup('ansible.builtin.env', 'REPORT_DB_USER') | trim }}"
    password: "{{ lookup('ansible.builtin.env', 'REPORT_DB_PASSWORD') }}"
    tls: "{{ lookup('ansible.builtin.env', 'REPORT_DB_TLS') | default('false', true) | bool }}"
    ca_file: "{{ lookup('ansible.builtin.env', 'REPORT_DB_CA_FILE') | trim }}"
    connect_timeout: "{{ ad_repl_db_timeout | int }}"
    create: "{{ ad_repl_db_create | bool }}"
    read_at: "{{ _ad.repl.now }}"
    job: "{{ (awx_job_id | default(tower_job_id | default(0))) | int }}"
    sites: "{{ _ad_repl_point.artifact.sites | default({}) }}"
    status: "{{ _ad_repl_point.artifact.status | default({}) }}"
    days: "{{ ad_repl_trend_days | float }}"
    keep_days: "{{ ad_repl_db_keep_days | int }}"
  register: _ad_repl_db
  when: _ad_repl_db_host | length > 0 and _ad_repl_point.artifact is defined

# one dict expression: on ansible-core 2.16 the values of a YAML dict would arrive as strings
- name: AD | replication - the matrix, the late links, the trend
  ansible.builtin.set_fact:
    _ad_repl: >-
      {{ _ad.repl | ad_repl_view(_site_hist_runs | default([]) + _ad_repl_db.runs | default([]), {
           'low_hours': ad_repl_low_hours | float, 'warn_hours': ad_repl_warn_hours | float, 'crit_hours': ad_repl_crit_hours | float,
           'max_dcs': ad_repl_matrix_max_dcs | int, 'trend_days': ad_repl_trend_days | int, 'max_rows': ad_report_max_rows | int,
           'time_zone': report_time_zone | default('', true) | string,
           'history_why': '' if (_site_hist_runs | default([]) | length > 0 or _ad_repl_db.runs | default([]) | length > 0)
                          else ('ad_repl_history is false' if not ad_repl_history | bool
                                else (_site_hist_why | default('', true) or 'no earlier run yet: the line starts with the next runs'))}) }}

- name: AD | replication - for the next runs (job artifact ad_repl)
  ansible.builtin.set_stats:
    data:
      ad_repl: "{{ _ad_repl.artifact }}"
    per_host: false
    aggregate: false
  when: _ad_repl.artifact is defined

- name: AD | replication
  ansible.builtin.debug:
    msg: "{{ _ad_repl.lines | default(['No replication link was read.']) }}"
