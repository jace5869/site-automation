---
# ---- The site portal, AAP side (1.67.0) ----------------------------------------------------------
# A job the site portal launched (it adds portal_requested_by, the person's certificate name) checks again what the
# portal checked: each value of portal_request_spec - a host is in this job's inventory (and is the Limit when the
# action takes the Limit from it: portal_request_limit_from), a choice is one of its values, a text is no longer than
# its max and in its form (pattern). No value may hold a template.

# Set by each playbook; do not set:
portal_request_spec: {}
portal_request_limit_from: ""
portal_request_action: ""                  # the action's name, for the job's lines and its artifact
# true = check the values even when the portal did not launch the job (no portal_requested_by): a playbook that only
# makes sense with them (ACT - triage finding). false = a job launched by hand is not checked (STIG recheck).
portal_request_always: false
portal_request_aap_ca_path: "{{ report_history_aap_ca_path | default('') }}"   # a CA file for AAP's own HTTPS certificate
