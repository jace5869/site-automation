---
# TAKE A SNAPSHOT of each VM - without memory (the disks only; the VM keeps running and is not
# paused to save its memory). The description records the AAP job and user.
- name: VMware | find the VMs
  ansible.builtin.include_tasks: prepare.yml

- name: VMware | the snapshot name
  ansible.builtin.set_fact:
    _vm_snap_name: "{{ vm_snapshot_name | trim or 'aap-' ~ now(fmt='%Y%m%d-%H%M') }}"
    _vm_snap_desc: >-
      {{ (vm_snapshot_description | trim ~ ' ') if vm_snapshot_description | trim else '' }}[AAP job
      {{ awx_job_id | default(tower_job_id | default('local')) }}, {{ awx_user_name | default(tower_user_name | default(lookup('ansible.builtin.env', 'USER') or 'unknown')) }},
      {{ now(fmt='%Y-%m-%d %H:%M') }}]

# vm_snapshot takes no second snapshot of a name a VM already has: it rewrites the old one's description (and
# says "changed"). Read first: a VM that has one named so keeps it as it is, and the report says so. Only the
# credential's vCenter is read - the one the VMs were found in: a VM ID (moid) means another VM in any other vCenter.
- name: VMware | the snapshots the VMs have now
  site_vmware_snapshots:
    datacenter: "{{ vmware_datacenter | default(omit, true) }}"
    vcenters: []
    validate_certs: "{{ vmware_validate_certs | bool }}"
    taken_by: false
  register: _vm_snap_have
  check_mode: false

- name: VMware | the vCenter answered
  ansible.builtin.assert:
    that: _vm_snap_have.vcenters | selectattr('error') | list | length == 0
    fail_msg: "No snapshot taken: {{ _vm_snap_have.vcenters | selectattr('error') | map(attribute='error') | join('; ') }}"
    quiet: true

- name: VMware | the VMs that already have a snapshot named {{ _vm_snap_name }}
  ansible.builtin.set_fact:
    _vm_snap_had: >-
      {{ _vm_snap_have.snapshots | selectattr('name', 'equalto', _vm_snap_name) | map(attribute='moid') | unique | list }}

- name: VMware | snapshot {{ _vm_snap_name }} (no memory)
  vmware.vmware.vm_snapshot:
    moid: "{{ item.moid }}"
    datacenter: "{{ item.datacenter }}"
    validate_certs: "{{ vmware_validate_certs | bool }}"
    state: present
    snapshot_name: "{{ _vm_snap_name }}"
    description: "{{ _vm_snap_desc }}"
    memory_dump: false
    quiesce: "{{ vm_snapshot_quiesce | bool }}"
  loop: "{{ _vm_found }}"
  loop_control:
    label: "{{ item.name }}"
  register: _vm_snap
  when: item.moid not in _vm_snap_had

- name: VMware | done
  ansible.builtin.include_tasks: report.yml
  vars:
    _vm_report_subject: "VM snapshot {{ _vm_snap_name }}: {{ _vm_found | map(attribute='name') | join(', ') | truncate(70) }}"
    _vm_report_lines:
      - >-
        {{ 'Would take' if ansible_check_mode else 'Took' }} snapshot "{{ _vm_snap_name }}" (no memory) of:
        {{ _vm_snap.results | selectattr('changed') | map(attribute='item.name') | join(', ') or 'none' }}.
        {{ ('Already had a snapshot with that name - kept as it is: ' ~ _vm_snap.results | rejectattr('changed') | map(attribute='item.name') | join(', '))
           if _vm_snap.results | rejectattr('changed') | list else '' }}
      - "Description: {{ _vm_snap_desc }}"
