---
# THE CLUSTER HEAT GRID (1.65.0): sections of the VMware health report. Read only: it uses what the health report read
# (_vm_hl_read). The lines and "since last week": this template's earlier runs' vm_heat artifact (AAP job history), and
# the report database when the template has a "Report database" credential (site_vm_heat_db - the only thing this
# writes). Never fails the job. plugins/filter/vmware_heat_filters.py
- name: VMware | heat grid - earlier runs (AAP job history)
  ansible.builtin.include_role:
    name: site_email
    tasks_from: history_artifacts.yml
  vars:
    _hist_artifacts: [vm_heat]
    _hist_runs: "{{ vm_heat_history_runs }}"
  when: vm_heat_history | bool

- name: VMware | heat grid - this run's points
  ansible.builtin.set_fact:
    _vm_heat_db_host: "{{ lookup('ansible.builtin.env', 'REPORT_DB_HOST') | trim if vm_heat_db | bool else '' }}"
    _vm_heat_point: "{{ _vm_hl_read | vm_heat_view([], _vm_hl_opts) }}"

- name: VMware | heat grid - the report database's earlier points, and this run's kept (vm_heat_db)
  site_vm_heat_db:
    host: "{{ _vm_heat_db_host }}"
    port: "{{ lookup('ansible.builtin.env', 'REPORT_DB_PORT') | default('3309', true) | int }}"
    database: "{{ lookup('ansible.builtin.env', 'REPORT_DB_NAME') | default('site_reports', true) | trim }}"
    user: "{{ lookup('ansible.builtin.env', 'REPORT_DB_USER') | trim }}"
    password: "{{ lookup('ansible.builtin.env', 'REPORT_DB_PASSWORD') }}"
    tls: "{{ lookup('ansible.builtin.env', 'REPORT_DB_TLS') | default('false', true) | bool }}"
    ca_file: "{{ lookup('ansible.builtin.env', 'REPORT_DB_CA_FILE') | trim }}"
    connect_timeout: "{{ vm_heat_db_timeout | int }}"
    create: "{{ vm_heat_db_create | bool }}"
    read_at: "{{ _vm_hl_read.read_at }}"
    job: "{{ (awx_job_id | default(tower_job_id | default(0))) | int }}"
    clusters: "{{ _vm_heat_point.artifact.clusters | default({}) }}"
    hosts: "{{ _vm_heat_point.artifact.hosts | default({}) }}"
    days: "{{ vm_heat_days | float }}"
    keep_days: "{{ vm_heat_db_keep_days | int }}"
  register: _vm_heat_db
  when: _vm_heat_db_host | length > 0 and _vm_heat_point.artifact is defined

# one dict expression: on ansible-core 2.16 the values of a YAML dict would arrive as strings
- name: VMware | heat grid - the grid, the hosts not OK, the numbers
  ansible.builtin.set_fact:
    _vm_heat: >-
      {{ _vm_hl_read | vm_heat_view(_site_hist_runs | default([]) + _vm_heat_db.runs | default([]),
           _vm_hl_opts | combine({'days': vm_heat_days | int, 'change_pts': vm_heat_change_pts | float,
             'history_why': '' if (_site_hist_runs | default([]) | length > 0 or _vm_heat_db.runs | default([]) | length > 0)
                            else ('vm_heat_history is false' if not vm_heat_history | bool
                                  else (_site_hist_why | default('', true) or 'no earlier run yet: the lines start with the next runs'))})) }}

- name: VMware | heat grid - for the next runs (job artifact vm_heat)
  ansible.builtin.set_stats:
    data:
      vm_heat: "{{ _vm_heat.artifact }}"
    per_host: false
    aggregate: false
  when: _vm_heat.artifact is defined

- name: VMware | heat grid
  ansible.builtin.debug:
    msg: "{{ _vm_heat.lines | default(['No host was read.']) }}"
