---
# PICK UP VM REQUEST TICKETS (playbooks/vm_deploy_poll.yml, an AAP schedule - e.g. every 15 minutes):
# ask ServiceNow for NEW VM requests (active, assigned to vm_deploy_assignment_group, marked by
# vm_deploy_poll_prefix / vm_deploy_poll_query), and start the deploy workflow (vm_deploy_poll_workflow)
# once per ticket - at most vm_deploy_poll_max per run, oldest first. Per ticket: "[AAP] Picked up ..."
# on it first (and read back: a ticket whose note this account cannot see would be picked up again on
# every run - the job stops), then the workflow, then its job number and link on the ticket. A ticket
# with any note of AAP's on it is never picked up again. NOTHING IS BUILT HERE: the workflow reads,
# checks, waits for the approval and builds. Check, or vm_deploy_poll_dry_run: list only - no note, no
# workflow. Green when it ran (also with nothing new); red when ServiceNow or AAP did not answer, or a
# workflow could not be started. Printed, emailed when it started something (report_email_to),
# artifacts (vm_deploy_poll).
- name: VMware | the settings, and the ServiceNow and AAP connections
  ansible.builtin.set_fact:
    _vp_sn_url: >-
      {%- set h = lookup('ansible.builtin.env', 'SN_HOST') | trim -%}
      {{ ((h if h.startswith('http') else 'https://' ~ h) | regex_replace('/+$', '')) if h else '' }}
    _vp_sn_user: "{{ lookup('ansible.builtin.env', 'SN_USERNAME') }}"
    _vp_job: "{{ ('AAP job ' ~ awx_job_id) if awx_job_id is defined else 'AAP' }}"
    _vp_dry: "{{ ansible_check_mode or vm_deploy_poll_dry_run | bool }}"
    _vp_tables: >-
      {{ ((vm_deploy_poll_tables.split(',') if ',' in vm_deploy_poll_tables else vm_deploy_poll_tables.split())
          if vm_deploy_poll_tables is string else vm_deploy_poll_tables) | map('trim') | select | map('vm_deploy_table_name') | list }}
    _vp_q: >-
      {{ {'assignment_group': vm_deploy_assignment_group, 'prefix': vm_deploy_poll_prefix, 'query': vm_deploy_poll_query,
          'states': vm_deploy_poll_states} | vm_deploy_poll_query }}
    # the "Red Hat Ansible Automation Platform" credential: its variables' NAMES (never their values) -
    # CONTROLLER_* (AAP 2.4 and later), AAP_* (2.5 and later), TOWER_* (older)
    _vp_aap_vars: >-
      {%- set out = {} -%}
      {%- for k, names in {'host': ['CONTROLLER_HOST', 'AAP_HOSTNAME', 'TOWER_HOST'],
                           'token': ['CONTROLLER_OAUTH_TOKEN', 'AAP_TOKEN', 'TOWER_OAUTH_TOKEN'],
                           'user': ['CONTROLLER_USERNAME', 'AAP_USERNAME', 'TOWER_USERNAME'],
                           'password': ['CONTROLLER_PASSWORD', 'AAP_PASSWORD', 'TOWER_PASSWORD'],
                           'verify': ['CONTROLLER_VERIFY_SSL', 'AAP_VALIDATE_CERTS', 'TOWER_VERIFY_SSL']}.items() -%}
      {%-   set found = [] -%}
      {%-   for n in names if lookup('ansible.builtin.env', n) | trim | length > 0 -%}{%- set _ = found.append(n) -%}{%- endfor -%}
      {%-   set _ = out.update({k: found[0] | default('')}) -%}
      {%- endfor -%}
      {{ out }}

- name: VMware | the off switch (vm_deploy_poll_enabled)
  ansible.builtin.debug:
    msg: "Picking up VM request tickets is off (vm_deploy_poll_enabled: false): nothing was read or started."
  when: not vm_deploy_poll_enabled | bool

- name: VMware | off - end here
  ansible.builtin.meta: end_play
  when: not vm_deploy_poll_enabled | bool

- name: VMware | where AAP is, and how to log in to it
  ansible.builtin.set_fact:
    _vp_aap_host: >-
      {%- set h = lookup('ansible.builtin.env', _vp_aap_vars.host) | trim if _vp_aap_vars.host else '' -%}
      {{ ((h if h.startswith('http') else 'https://' ~ h) | regex_replace('/+$', '')) if h else '' }}
    _vp_aap_login: "{{ 'token' if _vp_aap_vars.token else ('password' if _vp_aap_vars.user and _vp_aap_vars.password else '') }}"
    _vp_aap_verify: "{{ (lookup('ansible.builtin.env', _vp_aap_vars.verify) if _vp_aap_vars.verify else 'true') | bool }}"

- name: VMware | a ServiceNow credential, an AAP credential, and settings that mark a VM request
  ansible.builtin.assert:
    that:
      - _vp_sn_url | length > 0 and _vp_sn_user | length > 0
      - _vp_q.problems | length == 0
      - _vp_tables | length > 0
      - _vp_dry | bool or (_vp_aap_host | length > 0 and _vp_aap_login | length > 0)
    fail_msg: >-
      {{ 'No ServiceNow connection: attach the "ServiceNow API" credential to this job template (it gives SN_HOST, SN_USERNAME, SN_PASSWORD).'
         if not _vp_sn_url or not _vp_sn_user else
         ('Nothing was picked up: ' ~ _vp_q.problems | join('; ')) if _vp_q.problems else
         'vm_deploy_poll_tables is empty: the ServiceNow tables to look in, e.g. [incident].' if not _vp_tables else
         ('No AAP connection to start the workflow with: attach a credential of type "Red Hat Ansible Automation Platform" to this job '
          ~ 'template (its AAP URL, and the user name and password - or a token - of an AAP user that may start the workflow "'
          ~ vm_deploy_poll_workflow ~ '"). Nothing was picked up. vm_deploy_poll_dry_run: true lists the tickets without it.') }}
    quiet: true

# ---- AAP: the workflow to start (the AAP 2.5+ API path first, then the older one) ------------------
- name: VMware | find the workflow in AAP ({{ _vp_aap_api }})
  ansible.builtin.uri:
    url: "{{ _vp_aap_host }}/{{ _vp_aap_api }}workflow_job_templates/?name={{ vm_deploy_poll_workflow | urlencode }}"
    method: GET
    headers: >-
      {{ {'Accept': 'application/json'} | combine({'Authorization': 'Bearer ' ~ lookup('ansible.builtin.env', _vp_aap_vars.token)}
                                                  if _vp_aap_login == 'token' else {}) }}
    url_username: "{{ lookup('ansible.builtin.env', _vp_aap_vars.user) if _vp_aap_login == 'password' else omit }}"
    url_password: "{{ lookup('ansible.builtin.env', _vp_aap_vars.password) if _vp_aap_login == 'password' else omit }}"
    force_basic_auth: "{{ _vp_aap_login == 'password' }}"
    validate_certs: "{{ _vp_aap_verify }}"
    ca_path: "{{ vm_deploy_poll_aap_ca_path | default(omit, true) }}"
    timeout: 30
    status_code: [200, 401, 403, 404]
  vars:
    _vp_aap_api: api/controller/v2/
  register: _vp_wf_find1
  when: _vp_aap_host | length > 0 and _vp_aap_login | length > 0
  failed_when: false
  check_mode: false
  no_log: true                           # the request carries the token or password

- name: VMware | find the workflow in AAP ({{ _vp_aap_api }}, before AAP 2.5)
  ansible.builtin.uri:
    url: "{{ _vp_aap_host }}/{{ _vp_aap_api }}workflow_job_templates/?name={{ vm_deploy_poll_workflow | urlencode }}"
    method: GET
    headers: >-
      {{ {'Accept': 'application/json'} | combine({'Authorization': 'Bearer ' ~ lookup('ansible.builtin.env', _vp_aap_vars.token)}
                                                  if _vp_aap_login == 'token' else {}) }}
    url_username: "{{ lookup('ansible.builtin.env', _vp_aap_vars.user) if _vp_aap_login == 'password' else omit }}"
    url_password: "{{ lookup('ansible.builtin.env', _vp_aap_vars.password) if _vp_aap_login == 'password' else omit }}"
    force_basic_auth: "{{ _vp_aap_login == 'password' }}"
    validate_certs: "{{ _vp_aap_verify }}"
    ca_path: "{{ vm_deploy_poll_aap_ca_path | default(omit, true) }}"
    timeout: 30
    status_code: [200, 401, 403, 404]
  vars:
    _vp_aap_api: api/v2/
  register: _vp_wf_find2
  when: _vp_wf_find1.status | default(0) == 404
  failed_when: false
  check_mode: false
  no_log: true

- name: VMware | the workflow AAP found
  ansible.builtin.set_fact:
    _vp_wf: >-
      {%- set rs = [_vp_wf_find1, _vp_wf_find2] | selectattr('status', 'defined') | list -%}
      {%- set r = rs[-1] if rs else {} -%}
      {%- set found = (r.json.results | default([])) if r.status | default(0) == 200 else [] -%}
      {{ {'api': ('api/controller/v2/' if rs | length == 1 else 'api/v2/') if rs else '', 'status': r.status | default(0), 'id': found[0].id | default(0) if found else 0,
          'error': '' if found else
                   ('not checked: no AAP credential (a dry run does without it)' if not rs else
                    ('AAP did not answer at ' ~ _vp_aap_host ~ ': ' ~ (r.msg | default('') | truncate(160)) ~ ' (the address, a firewall, or its certificate'
                     ~ ' - vm_deploy_poll_aap_ca_path)') if r.status | default(-1) <= 0 else
                    ('AAP refused the login (HTTP ' ~ r.status ~ "): the credential's user name and password, or its token, are wrong or expired")
                    if r.status in [401, 403] else
                    ('AAP has no API at ' ~ _vp_aap_host ~ "/api/controller/v2/ or /api/v2/ (HTTP 404): the credential's URL must be AAP's own address")
                    if r.status == 404 else
                    ('no workflow named "' ~ vm_deploy_poll_workflow ~ '" that the AAP user may see: check vm_deploy_poll_workflow, and give the user'
                     ~ ' the Execute role on that workflow'))} }}

- name: VMware | can the workflow take the ticket number? (its survey, or Prompt on launch for Variables)
  ansible.builtin.uri:
    url: "{{ _vp_aap_host }}/{{ _vp_wf.api }}workflow_job_templates/{{ _vp_wf.id }}/launch/"
    method: GET
    headers: >-
      {{ {'Accept': 'application/json'} | combine({'Authorization': 'Bearer ' ~ lookup('ansible.builtin.env', _vp_aap_vars.token)}
                                                  if _vp_aap_login == 'token' else {}) }}
    url_username: "{{ lookup('ansible.builtin.env', _vp_aap_vars.user) if _vp_aap_login == 'password' else omit }}"
    url_password: "{{ lookup('ansible.builtin.env', _vp_aap_vars.password) if _vp_aap_login == 'password' else omit }}"
    force_basic_auth: "{{ _vp_aap_login == 'password' }}"
    validate_certs: "{{ _vp_aap_verify }}"
    ca_path: "{{ vm_deploy_poll_aap_ca_path | default(omit, true) }}"
    timeout: 30
    status_code: [200, 401, 403, 404]
  register: _vp_wf_launch
  when: _vp_wf.id | int > 0
  failed_when: false
  check_mode: false
  no_log: true

- name: VMware | the workflow can be started with a ticket number
  ansible.builtin.set_fact:
    _vp_wf: >-
      {%- set l = _vp_wf_launch.json | default({}) if _vp_wf_launch.status | default(0) == 200 else {} -%}
      {{ _vp_wf | combine({'error': _vp_wf.error or
          ('AAP did not say whether the workflow may be started (HTTP ' ~ _vp_wf_launch.status | default('?')
           ~ '): the AAP user needs the Execute role on "' ~ vm_deploy_poll_workflow ~ '"') if not l else
          ('the workflow "' ~ vm_deploy_poll_workflow ~ '" takes no ticket number: give it the survey question vm_deploy_ticket (or tick'
           ~ ' Prompt on launch next to its Variables)') if not l.survey_enabled | default(false) and not l.ask_variables_on_launch | default(false) else
          ('the workflow also needs ' ~ (l.variables_needed_to_start | reject('equalto', 'vm_deploy_ticket') | join(', '))
           ~ ' to start: its survey may only ask for vm_deploy_ticket')
          if l.variables_needed_to_start | default([]) | reject('equalto', 'vm_deploy_ticket') | list | length > 0 else ''}) }}
  when: _vp_wf.id | int > 0

- name: VMware | AAP can start the workflow (nothing is picked up otherwise)
  ansible.builtin.assert:
    that: not _vp_wf.error
    fail_msg: "Nothing was picked up: {{ _vp_wf.error }}. docs/VMWARE.md, \"Pick up tickets automatically\""
    quiet: true
  when: not _vp_dry | bool

# ---- ServiceNow: the new VM requests ------------------------------------------------------------
# display values: journal fields (to see AAP's own notes) and the state as people see them; the group
# as its name (exclude_reference_link). Oldest first; the newest beyond vm_deploy_poll_scan wait.
- name: VMware | new VM requests in ServiceNow ({{ item }})
  ansible.builtin.uri:
    url: >-
      {{ _vp_sn_url }}/api/now/table/{{ item }}?sysparm_display_value=true&sysparm_exclude_reference_link=true&sysparm_limit={{
      vm_deploy_poll_scan | int }}&sysparm_fields={{ 'sys_id,number,state,active,assignment_group,short_description,sys_created_on,comments,work_notes'
      }}&sysparm_query={{ _vp_q.query | urlencode }}
    method: GET
    url_username: "{{ _vp_sn_user }}"
    url_password: "{{ lookup('ansible.builtin.env', 'SN_PASSWORD') }}"
    force_basic_auth: true
    headers: {Accept: application/json}
    validate_certs: "{{ servicenow_validate_certs | default(true) }}"
    ca_path: "{{ servicenow_ca_path | default(omit, true) }}"
    timeout: "{{ servicenow_timeout | default(30) }}"
    status_code: [200, 400, 401, 403, 404]
  register: _vp_get
  loop: "{{ _vp_tables }}"
  failed_when: false
  check_mode: false

- name: VMware | ServiceNow answered
  ansible.builtin.assert:
    that: _vp_get.results | rejectattr('status', 'equalto', 200) | list | length == 0
    fail_msg: >-
      {%- set r = _vp_get.results | rejectattr('status', 'equalto', 200) | first -%}
      Nothing was picked up: ServiceNow {{ ('did not answer: ' ~ r.msg | default('') | truncate(160)) if r.status | default(-1) <= 0 else
      ('refused the read of the ' ~ r.item ~ ' table (HTTP ' ~ r.status ~ '): ' ~ (r.json.error.message | default(''))
       ~ ' ' ~ (r.json.error.detail | default('')) ~ ('. The account needs the itil role.' if r.status in [401, 403] else
       '. Check vm_deploy_poll_tables and vm_deploy_poll_query.')) }}
    quiet: true

- name: VMware | which tickets to pick up
  ansible.builtin.set_fact:
    _vp: >-
      {{ (_vp_get.results | map(attribute='json') | map(attribute='result') | flatten(1))
         | vm_deploy_poll_pick({'assignment_group': vm_deploy_assignment_group, 'prefix': vm_deploy_poll_prefix, 'max': vm_deploy_poll_max | int}) }}
    _vp_full: "{{ _vp_get.results | map(attribute='json') | map(attribute='result') | map('length') | select('ge', vm_deploy_poll_scan | int) | list | length > 0 }}"
    _vp_done: []
    _vp_blind: false

- name: VMware | pick up each ticket - "Picked up" on it, read back, start the workflow, its job on the ticket
  ansible.builtin.include_tasks: deploy_poll_one.yml
  loop: "{{ _vp.pick }}"
  loop_control:
    loop_var: _vp_t
    label: "{{ _vp_t.number }}"
  when: not _vp_dry | bool

- name: VMware | pickup report
  ansible.builtin.include_tasks: report.yml
  vars:
    _vp_ok: "{{ _vp_done | selectattr('ok') | list }}"
    _vp_bad: "{{ _vp_done | rejectattr('ok') | list }}"
    _vm_report_subject: >-
      {{ 'VM request pickup: '
         ~ (('DRY RUN - would start the workflow for ' ~ _vp.pick | length ~ ' ticket(s)') if _vp_dry | bool and _vp.pick else
            'DRY RUN - nothing new' if _vp_dry | bool else
            ('STOPPED - this account cannot see the work notes it writes') if _vp_blind | bool else
            (_vp_bad | length ~ ' ticket(s) could not be started' ~ ((', ' ~ _vp_ok | length ~ ' started') if _vp_ok else '')) if _vp_bad else
            ('started the workflow for ' ~ _vp_ok | map(attribute='number') | join(', ')) if _vp_ok else 'nothing new') }}
    _vm_report_lines: >-
      {%- set out = [_vm_report_subject | trim] -%}
      {%- for t in (_vp.pick if _vp_dry | bool else []) -%}{%- set _ = out.append('WOULD START: ' ~ t.number ~ ' - ' ~ t.short_description) -%}{%- endfor -%}
      {%- for t in _vp_ok -%}{%- set _ = out.append('STARTED: ' ~ t.text) -%}{%- endfor -%}
      {%- for t in _vp_bad -%}{%- set _ = out.append('NOT STARTED: ' ~ t.text) -%}{%- endfor -%}
      {%- for t in _vp.skipped -%}{%- set _ = out.append('skipped ' ~ t.number ~ ': ' ~ t.why) -%}{%- endfor -%}
      {%- if _vp_dry | bool -%}
      {%-   set _ = out.append('AAP: ' ~ (('workflow "' ~ vm_deploy_poll_workflow ~ '" (id ' ~ _vp_wf.id ~ ') can be started') if not _vp_wf.error else _vp_wf.error)) -%}
      {%- endif -%}
      {%- if _vp_full | bool -%}
      {%-   set _ = out.append('WARNING: ' ~ vm_deploy_poll_scan ~ ' or more tickets matched in a table; only the oldest ' ~ vm_deploy_poll_scan
                               ~ ' were read. Tickets AAP already has stay among them while they are New: set vm_deploy_poll_claim_fields'
                               ~ ' (e.g. {state: "2"}), or resolve them') -%}
      {%- endif -%}
      {%- set _ = out.append('Query: ' ~ _vp_q.query) -%}
      {{ out }}
    _vm_report_no_email: "{{ _vp_dry | bool or (not _vp_done and not _vp_blind | bool) }}"
    _vm_report_no_email_why: "{{ 'a dry run.' if _vp_dry | bool else 'nothing new to pick up.' }}"
    _vm_report_doc: >-
      {%- set sections = [] -%}
      {%- if _vp_done -%}
      {%-   set _ = sections.append({'title': 'Picked up', 'status': 'critical' if _vp_bad else 'ok', 'columns': ['Ticket', 'Short description', 'Workflow'],
                                     'rows': _vp_done | map(attribute='row') | list}) -%}
      {%- endif -%}
      {%- if _vp_dry | bool and _vp.pick -%}
      {%-   set _ = sections.append({'title': 'Would be picked up (dry run)', 'columns': ['Ticket', 'Short description'],
                                     'rows': _vp.pick | map(attribute='number') | zip(_vp.pick | map(attribute='short_description')) | map('list') | list}) -%}
      {%- endif -%}
      {%- if _vp_blind | bool -%}
      {%-   set _ = sections.append({'title': 'Stopped', 'status': 'critical', 'lines': [
              'The "Picked up" note was written but the API does not show it back: the next run would pick the same ticket up again.',
              'Give the ServiceNow account read access to work notes (the itil role), or set vm_deploy_poll_claim_fields (e.g. {state: "2"}).',
              'Until then: vm_deploy_poll_enabled: false.']}) -%}
      {%- endif -%}
      {%- if _vp.skipped -%}
      {%-   set _ = sections.append({'title': 'Not picked up', 'columns': ['Ticket', 'Why'], 'rows': _vp.skipped | map(attribute='number') | zip(_vp.skipped | map(attribute='why')) | map('list') | list}) -%}
      {%- endif -%}
      {{ {'title': _vm_report_subject | trim, 'status': 'critical' if _vp_bad or _vp_blind | bool else ('ok' if _vp_ok else 'info'),
          'subtitle': 'ServiceNow ' ~ _vp_sn_url ~ ' - ' ~ _vp_job, 'footer': 'Query: ' ~ _vp_q.query,
          'sections': sections or [{'title': 'Result', 'lines': ['No new VM request tickets.']}]} }}

- name: VMware | the pickup as job artifacts (vm_deploy_poll)
  ansible.builtin.set_stats:
    data:
      vm_deploy_poll: >-
        {{ {'picked': _vp.pick, 'skipped': _vp.skipped, 'started': _vp_done | map(attribute='artifact') | list,
            'dry_run': _vp_dry | bool, 'stopped': _vp_blind | bool, 'query': _vp_q.query} }}

- name: VMware | every ticket picked up was started
  ansible.builtin.assert:
    that:
      - not _vp_blind | bool
      - _vp_done | rejectattr('ok') | list | length == 0
    fail_msg: >-
      {{ 'Stopped: the ServiceNow account cannot see the "Picked up" note it wrote - the next run would pick the ticket up again. '
         ~ 'Set vm_deploy_poll_enabled: false until it can (the report says how).' if _vp_blind | bool else
         'Not started: ' ~ (_vp_done | rejectattr('ok') | map(attribute='text') | join('; ')) ~ ' (each ticket says so too).' }}
    quiet: true
