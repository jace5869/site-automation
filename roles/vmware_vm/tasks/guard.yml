---
# Restart, shut down and VLAN change never touch the AAP server: the job would cut off the system
# running it, and AAP must never be restarted from AAP. The literal groups aap / aap_hosts are in
# the conditions themselves, so no setting or extra variable can remove them.
# The protected VMs: protected.yml (one list for every job; survey text is names separated by commas or line
# breaks). Input: _vm_found.
- name: VMware | the protected VMs, and this inventory says which server is AAP
  ansible.builtin.include_tasks: protected.yml
  vars:
    _vm_prot_refuse: restart, shut down or re-network anything

- name: VMware | never the AAP server or a protected VM
  ansible.builtin.assert:
    that:
      - item.ids | intersect(((groups['aap'] | default([])) + (groups['aap_hosts'] | default([]))) | host_ids(hostvars)) | length == 0
      - item.ids | intersect(_vm_prot.ids) | length == 0
      - not item.name | name_matches(_vm_prot.names)
    fail_msg: >-
      Refused: {{ item.name }} is the AAP server or a protected VM (groups
      {{ _vm_prot.groups | join(', ') }}, or vmware_protected_vms;
      matched by VM name, guest host name or IP address). Nothing was changed.
    quiet: true
  loop: "{{ _vm_found }}"
  loop_control:
    label: "{{ item.name }}"
