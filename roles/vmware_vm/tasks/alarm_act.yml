---
# ACT ANALYSIS of vCenter's alarms (playbooks/vm_alarm_act_analysis.yml). Reads what the alarms
# report reads, numbers the problems - critical and warning alarms, hosts not connected, failed
# logins, VM events to check, other errors and warnings, configuration issues; the most severe
# vm_alarm_act_max_items - and hands them with their evidence to ACT in evidence mode: ACT runs NO
# command, it reads the evidence and answers. ACT runs here, on the AAP side (the execution
# environment), never on the ESXi hosts: only this AAP node must reach the model's URL. Its answer -
# likely cause, evidence, fix and a confidence of 0-100 per problem - is emailed as a table and
# published as artifacts (vm_alarm_act). The job fails when ACT could not run, after the email.
- name: VMware | read
  ansible.builtin.include_tasks: alarms_read.yml

- name: VMware | the problems ACT analyzes, most severe first
  ansible.builtin.set_fact:
    _vm_al_p: "{{ _vm_al_read | vm_alarm_problems(_vm_al_opts) }}"

- name: VMware | nothing to analyze
  ansible.builtin.include_tasks: report.yml
  vars:
    _vm_vcenters: "{{ _vm_al_read.vcenters }}"
    _vm_report_subject: "VMware alarms ACT analysis: nothing to analyze"
    _vm_report_lines:
      - "No triggered alarm, every host connected, and no failed login, VM event to check, error or warning in the last {{ vm_alarm_hours }} h."
      - "ACT was not called."
    _vm_report_doc: >-
      {{ {'title': 'VMware alarms ACT analysis: nothing to analyze', 'status': 'ok',
          'subtitle': ('vCenters ' if _vm_al_read.vcenters | default([]) | vm_vcenters_read | length > 1 else 'vCenter ')
                      ~ _vm_al_read.vcenter ~ ': no triggered alarm, every host connected, and no failed login, VM event to check, '
                      ~ 'error or warning in the last ' ~ vm_alarm_hours ~ ' h.',
          'sections': [{'title': 'Result', 'lines': ['Nothing for ACT to analyze: ACT was not called.']}]} }}
    _vm_report_no_email: "{{ not vm_alarm_act_email_if_none | bool }}"
    _vm_report_no_email_why: "nothing to analyze (vm_alarm_act_email_if_none)."
  when: _vm_al_p.problems | length == 0

- name: VMware | ACT analysis
  when: _vm_al_p.problems | length > 0
  block:
    # vm_alarm_act_batch problems per question: a long answer about many problems is what a gateway or the model's
    # output limit cuts off; each batch is a question of its own, with only its problems' evidence
    - name: VMware | no answer yet
      ansible.builtin.set_fact:
        _vm_al_batches: []

    - name: VMware | ACT analyzes the {{ _vm_al_p.problems | length }} problem(s), {{ vm_alarm_act_batch }} at a time
      ansible.builtin.include_tasks: alarm_act_batch.yml
      loop: "{{ _vm_al_p.problems | batch(vm_alarm_act_batch | int if vm_alarm_act_batch | int > 0 else 1000) | list }}"
      loop_control:
        loop_var: _vm_al_batch
        label: "{{ _vm_al_batch | map(attribute='id') | join(', ') }}"

    - name: VMware | what ACT said, for the report
      ansible.builtin.set_fact:
        _vm_al_ran: "{{ _vm_al_batches | selectattr('ran') | list | length > 0 }}"
        _vm_al_parsed: "{{ _vm_al_batches | act_batches_merge }}"
        _vm_al_reason: "{{ _vm_al_batches | act_batches_reason }}"
        _vm_al_raw: "{{ _vm_al_batches | map(attribute='raw') | select | join('\n\n') }}"
        _ea_model: "{{ (_vm_al_batches | map(attribute='model') | select | list + [''])[0] }}"

    - name: VMware | the analysis
      ansible.builtin.set_fact:
        _vm_al_doc: >-
          {{ _vm_al_p.problems | vm_alarm_act_report(_vm_al_parsed,
               {'vcenter': _vm_al_read.vcenter, 'hours': vm_alarm_hours, 'provider': site_act_provider,
                'model': _ea_model, 'ran': _vm_al_ran | bool, 'reason': _vm_al_reason, 'raw': _vm_al_raw,
                'not_analyzed': _vm_al_p.not_analyzed, 'max_items': vm_alarm_act_max_items}) }}

    - name: VMware | ACT analysis
      ansible.builtin.include_tasks: report.yml
      vars:
        _vm_vcenters: "{{ _vm_al_read.vcenters }}"
        _vm_report_subject: "{{ _vm_al_doc.title }}"
        _vm_report_lines: "{{ (_vm_al_doc | report_text).splitlines() }}"
        _vm_report_doc: "{{ _vm_al_doc }}"

    - name: VMware | ACT's analysis as job artifacts (vm_alarm_act)
      ansible.builtin.set_stats:
        data:
          vm_alarm_act: >-
            {%- set out = [] -%}
            {%- for p in _vm_al_p.problems -%}
            {%-   set _ = out.append(p | combine(_vm_al_parsed.by_id[p.id] | default({}))) -%}
            {%- endfor -%}
            {{ {'ran': _vm_al_ran | bool, 'reason': '' if _vm_al_ran | bool else _vm_al_reason, 'overall': _vm_al_parsed.overall,
                'problems': out, 'not_analyzed': _vm_al_p.not_analyzed | length} }}

    - name: VMware | ACT analyzed the problems
      ansible.builtin.assert:
        that: _vm_al_ran | bool and _vm_al_reason | length == 0
        fail_msg: >-
          {{ ('ACT did not analyze every problem: ' ~ _vm_al_reason ~ ' The others are analyzed in the report (and the email).')
             if _vm_al_ran | bool else
             ('ACT did not analyze the alarms: ' ~ _vm_al_reason ~ ' The alarms are in the report (and the email) without an analysis.') }}
        quiet: true
      when: not ansible_check_mode

- name: VMware | every vCenter was read
  ansible.builtin.include_tasks: vcenters_read.yml
  vars:
    _vm_vcenters: "{{ _vm_al_read.vcenters }}"
