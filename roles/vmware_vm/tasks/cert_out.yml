---
# VMware certificates, the shared report (cert_report.yml, cert_renew.yml): printed, emailed
# (report_email_to), published as artifacts (vmware_certs). Input: _vcert, _vcert_read, _vcert_result;
# _vcert_report_only (the report job: what the renewal would do, no ticket column).
- name: VMware certs | the report
  ansible.builtin.set_fact:
    _vcert_doc: >-
      {{ _vcert | vmware_cert_report(_vcert_result, _vcert_read.not_checked,
                                     _vcert.certs | cert_report_section((_vcert_warn_in | default(vmware_cert_warn_days)) | int, [(_vcert_warn_in | default(vmware_cert_warn_days)) | int * 2, 60] | max),
                                     {'warn_days': (_vcert_warn_in | default(vmware_cert_warn_days)) | int, 'check_mode': ansible_check_mode,
                                      'tickets': cert_csr_tickets | default({}), 'report_only': _vcert_report_only | default(false)}) }}

# 1.64.0: the timeline and the renew list, in the report job (cert_timeline: false = without)
- name: VMware certs | the certificate timeline
  ansible.builtin.set_fact:
    _vcert_timeline: >-
      {{ _vcert.certs | cert_timeline({'days': cert_timeline_days | default(120) | int, 'today': now(utc=true).strftime('%Y-%m-%d'),
                                       'warn': (_vcert_warn_in | default(vmware_cert_warn_days)) | int, 'crit': vmware_cert_crit_days | int,
                                       'notice': [(_vcert_warn_in | default(vmware_cert_warn_days)) | int * 2, 60] | max,
                                       'warn_name': 'vmware_cert_warn_days', 'crit_name': 'vmware_cert_crit_days',
                                       'what': 'vCenter and ESXi', 'renew': 'VMware - certificate renewal (a CSR)',
                                       'renew_words': {'csr': 'VMware - certificate renewal (a CSR)',
                                                       'vmca': 'VMware - certificate renewal (a CSR)' if vmware_cert_vmca_csr | default(false) | bool
                                                               else 'by hand in vCenter (VMCA; VMware - certificate renewal opens the incident)'}}) }}
  when: _vcert_report_only | default(false) | bool and cert_timeline | default(true) | bool

- name: VMware certs | the next {{ cert_timeline_days | default(120) }} days
  ansible.builtin.debug:
    msg: "{{ _vcert_timeline.lines }}"
  when: _vcert_timeline is defined

- name: VMware certs | report
  ansible.builtin.include_tasks: report.yml
  vars:
    _vm_vcenters: "{{ _vcert_read.vcenters }}"
    _vm_report_doc: "{{ _vcert_doc | cert_timeline_doc(_vcert_timeline | default({})) }}"
    _vm_report_web_doc: "{{ _vcert_doc | cert_timeline_doc(_vcert_timeline, true) if _vcert_timeline is defined else {} }}"
    _vm_report_xlsx: >-
      {{ (_vcert_doc | cert_timeline_doc(_vcert_timeline) | report_xlsx_sheets) + [_vcert_timeline.sheet]
         if _vcert_timeline is defined and report_email_xlsx | default(false) | bool else [] }}
    _vm_report_subject: "{{ _vcert_doc.title }}"
    _vm_report_lines: "{{ (_vcert_doc | report_text).splitlines() }}"

- name: VMware certs | the result as job artifacts (vmware_certs)
  ansible.builtin.set_stats:
    data:
      # one expression, so dry_run and warn_days stay a boolean and a number on ansible-core 2.16 too
      vmware_certs: >-
        {{ {'dry_run': ansible_check_mode, 'warn_days': (_vcert_warn_in | default(vmware_cert_warn_days)) | int,
            'due': _vcert_result.certs | map(attribute='host') | zip(_vcert_result.certs | map(attribute='days'),
                   _vcert_result.certs | map(attribute='status')) | map('join', ' | ') | list,
            'not_checked': _vcert_read.not_checked, 'vcenters': _vcert_read.vcenters} }}
