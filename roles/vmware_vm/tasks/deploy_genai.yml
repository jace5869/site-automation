---
# DEPLOY, the GenAI part - a proof of concept with guardrails (vm_deploy_genai: true; deploy.yml
# includes it when the ticket's own 'key: value' lines do not say the name and the template, and no
# proposal matches the ticket text as it is now). NOTHING IS BUILT HERE:
#   1. ACT (GenAI, evidence mode: it runs no command) copies out what the ticket says - the VMs' names,
#      the operating system as written, CPU, memory, disks (site, folder; a vm_deploy_template_catalog key
#      when the ticket names one) - each with the words of the ticket it comes from. It decides and asks
#      nothing: its own questions are only notes in the report.
#   2. Every value is checked against the ticket (vm_deploy_genai_parse): its words must be in the
#      ticket and contain it; anything else is dropped and becomes a question. The template comes from
#      the operating system's words by the job's own rules (the plain words'); a catalog key for another
#      version than the ticket asks is dropped. An OS no template is for is a question - never another one.
#   3. Questions -> a comment to the requester (they see comments, not work notes). Otherwise the
#      proposal -> a work note, "[AAP] GenAI proposal (ticket text sha256:...)", with what the rules
#      would refuse.
#   4. A clean proposal (traced, no questions, within the rules: _vd_g_clean) goes on to the check
#      step: in the workflow, "ready to build" and the approval; without an approval
#      (vm_deploy_genai_approval: false), built in this run. The workflow's build step (or a later
#      run) builds the posted proposal without asking GenAI again, while the ticket text is unchanged.
#   A dry run (Check) asks GenAI only with vm_deploy_genai_in_check: it shows the proposal and where it
#   would go, and writes nothing on the ticket (no proposal, no questions): a real run asks again.
- name: VMware | GenAI reads the ticket - evidence mode, ACT runs no command
  ansible.builtin.include_role:
    name: site_act
    tasks_from: evidence_analysis.yml
    public: true
  vars:
    _ea_items: [{id: P1}]
    _ea_evidence: "{{ _vd_text }}"
    _ea_task: >-
      {{ {'catalog': vm_deploy_template_catalog | default({}, true), 'sites': vm_deploy_sites | list,
          'extra': site_act_extra_instructions | default('')} | vm_deploy_genai_task }}
    _ea_names: []
    _ea_model_timeout: "{{ vm_deploy_genai_model_timeout }}"
    _ea_check_url: true
    _ea_in_check: "{{ vm_deploy_genai_in_check | default(false) | bool }}"

- name: VMware | what GenAI read, checked against the ticket
  ansible.builtin.set_fact:
    _vd_g: >-
      {{ (_ea_raw | default('')) | vm_deploy_genai_parse(_vd_text, {'catalog': vm_deploy_template_catalog | default({}, true),
                                                                     'sites': vm_deploy_sites | list, 'words': _vd_words})
         if _ea_ran | default(false) | bool else {'fields': {}, 'evidence': {}, 'questions': [], 'dropped': [], 'notes': [], 'os': '',
                                                    'error': _ea_reason | default('')} }}

- name: VMware | the proposal against the rules (a preview of what the build run will check)
  ansible.builtin.set_fact:
    _vd_gc: >-
      {{ (_vd_rec | vm_deploy_spec(vm_deploy_defaults, {'fields': _vd_g.fields, 'header': 'this run'}, _vd_words, _vd_parent)) | vm_deploy_check(_vd_rec, {
           'templates': vm_deploy_templates, 'clusters': vm_deploy_clusters, 'datastores': vm_deploy_datastores,
           'folders': vm_deploy_folders, 'max_cpu': vm_deploy_max_cpu | int, 'max_memory_gb': vm_deploy_max_memory_gb | float,
           'name_regex': vm_deploy_name_regex, 'assignment_group': _vd_grp.groups, 'assignment_group_setting': _vd_grp.setting,
           'sites': vm_deploy_sites, 'site_words': vm_deploy_plain_sites | default({}, true), 'site_required': vm_deploy_site_required | bool, 'pxe_templates': vm_deploy_pxe_templates,
           'name_rules': vm_deploy_name_rules,
           'template_aliases': vm_deploy_template_aliases, 'template_specs': vm_deploy_template_specs,
           'max_disks': vm_deploy_max_disks | int, 'max_disk_gb': vm_deploy_max_disk_gb | float,
           'max_total_disk_gb': vm_deploy_max_total_disk_gb | float, 'parent': _vd_parent,
           'datastore_rules': vm_deploy_datastore_rules | default([], true), 'datastore_balance': vm_deploy_datastore_balance | bool,
           'ready': vm_deploy_ready_by_table | default({}, true), 'table': _vd_table}) }}

- name: VMware | does the request go on? (questions, or a refusal, stop it)
  ansible.builtin.set_fact:
    _vd_g_ask: "{{ _ea_ran | default(false) | bool and not _vd_g.error and _vd_g.questions | length > 0 }}"
    _vd_g_clean: >-
      {{ _ea_ran | default(false) | bool and not _vd_g.error and _vd_g.questions | length == 0 and _vd_gc.problems | length == 0 }}

- name: VMware | what GenAI proposes
  ansible.builtin.debug:
    msg: >-
      {{ ['GenAI ' ~ ('did not run: ' ~ _vd_g.error if _vd_g.error else 'read ticket ' ~ _vd_rec.number ~ ' (' ~ _vd_digest ~ '):')]
         + (_vd_g.fields | vm_deploy_spec_text)
         + (['os (as the ticket writes it): ' ~ _vd_g.os] if _vd_g.os | default('') else [])
         + (_vd_g.dropped | map('regex_replace', '^', 'DROPPED: ') | list)
         + (_vd_g.questions | map('regex_replace', '^', 'QUESTION: ') | list)
         + (_vd_g.notes | default([]) | map('regex_replace', '^', 'GENAI NOTE (not sent to the requester): ') | list)
         + (_vd_gc.problems | map('regex_replace', '^', 'THE BUILD WOULD REFUSE: ') | list)
         + (['WHAT GENAI ANSWERED (the job could not read it): ' ~ (_ea_raw | default('') | truncate(2000))]
            if _vd_g.error and _ea_ran | default(false) | bool else []) }}

- name: VMware | questions to the requester (a comment - requesters see comments, not work notes) - the note
  ansible.builtin.set_fact:
    _vd_b_questions:
      comments: >-
        {{ (['[AAP] To build this VM we need a few details. Please add a comment with the answers, one per line - for example "memory_gb: 16":']
            + (_vd_g.questions | map('regex_replace', '^', '- ') | list)) | join(_vd_nl) }}
  vars:
    _vd_nl: "\n"                       # a real newline ('\n' inside {{ }} in a >- block stays a backslash and n)
  when: _vd_g_ask | bool and not ansible_check_mode

- name: VMware | questions to the requester (a comment - requesters see comments, not work notes)
  ansible.builtin.uri:
    url: "{{ _vd_sn_url }}/api/now/table/{{ _vd_table }}/{{ _vd_rec.sys_id }}"
    method: PATCH
    url_username: "{{ _vd_sn_user }}"
    url_password: "{{ lookup('ansible.builtin.env', 'SN_PASSWORD') }}"
    force_basic_auth: true
    headers: {Accept: application/json}
    body_format: json
    body: "{{ _vd_b_questions }}"
    validate_certs: "{{ servicenow_validate_certs | default(true) }}"
    ca_path: "{{ servicenow_ca_path | default(omit, true) }}"
    timeout: "{{ servicenow_timeout | default(30) }}"
    status_code: [200, 400, 401, 403, 404]
  vars:
    _vd_nl: "\n"                       # a real newline ('\n' inside {{ }} in a >- block stays a backslash and n)
  register: _vd_gnote_q
  when: _vd_g_ask | bool and not ansible_check_mode

- name: VMware | questions to the requester (a comment - requesters see comments, not work notes) - the same on the other tickets (vm_deploy_notes_also)
  ansible.builtin.include_tasks: deploy_note_also.yml
  vars:
    _vd_also_bodies: "{{ [_vd_b_questions] }}"
  when: _vd_also | default([]) | length > 0 and (_vd_g_ask | bool and not ansible_check_mode)

- name: VMware | the proposal on the ticket (a work note, read back by the build run) - the note
  ansible.builtin.set_fact:
    _vd_b_proposal:
      work_notes: >-
        {{ (_vd_g | vm_deploy_proposal_note(_vd_digest, _vd_job,
              'Building it now (no approval step: vm_deploy_genai_approval is off).'
              if _vd_phase == '' and not vm_deploy_genai_approval | bool and _vd_gc.problems | length == 0 else ''))
           ~ ((_vd_nl ~ 'The build would refuse it now:' ~ _vd_nl ~ (_vd_gc.problems | map('regex_replace', '^', '- ') | join(_vd_nl)))
              if _vd_gc.problems else '') }}
  vars:
    _vd_nl: "\n"
  when: _ea_ran | default(false) | bool and not _vd_g.error and not _vd_g_ask | bool and not ansible_check_mode

- name: VMware | the proposal on the ticket (a work note, read back by the build run)
  ansible.builtin.uri:
    url: "{{ _vd_sn_url }}/api/now/table/{{ _vd_table }}/{{ _vd_rec.sys_id }}"
    method: PATCH
    url_username: "{{ _vd_sn_user }}"
    url_password: "{{ lookup('ansible.builtin.env', 'SN_PASSWORD') }}"
    force_basic_auth: true
    headers: {Accept: application/json}
    body_format: json
    body: "{{ _vd_b_proposal }}"
    validate_certs: "{{ servicenow_validate_certs | default(true) }}"
    ca_path: "{{ servicenow_ca_path | default(omit, true) }}"
    timeout: "{{ servicenow_timeout | default(30) }}"
    status_code: [200, 400, 401, 403, 404]
  vars:
    _vd_nl: "\n"
  register: _vd_gnote_p
  when: _ea_ran | default(false) | bool and not _vd_g.error and not _vd_g_ask | bool and not ansible_check_mode

- name: VMware | the proposal on the ticket (a work note, read back by the build run) - the same on the other tickets (vm_deploy_notes_also)
  ansible.builtin.include_tasks: deploy_note_also.yml
  vars:
    _vd_also_bodies: "{{ [_vd_b_proposal] }}"
  when: _vd_also | default([]) | length > 0 and (_ea_ran | default(false) | bool and not _vd_g.error and not _vd_g_ask | bool and not ansible_check_mode)

# a clean proposal goes on to the check / build step, which reports; here only what stops
- name: VMware | GenAI proposal report (it stops here)
  ansible.builtin.include_tasks: report.yml
  when: not _vd_g_clean | bool
  vars:
    _vd_written: >-
      {{ (_vd_gnote_q.status | default(0)) == 200 or (_vd_gnote_p.status | default(0)) == 200 }}
    _vm_report_subject: >-
      {{ 'VM deploy ' ~ _vd_rec.number ~ ': '
         ~ ('GenAI would read the ticket (dry run: not asked)' if ansible_check_mode and not _ea_ran | default(false) | bool else
            ('GenAI did not run' if _vd_g.error else
             ('dry run: GenAI read the ticket - questions for the requester (not sent)' if _vd_g_ask | bool and ansible_check_mode else
              ('questions for the requester (nothing built)' if _vd_g_ask | bool else
               ('dry run: GenAI read the ticket - the rules refuse it' if ansible_check_mode else
                'GenAI proposal posted - the rules refuse it (nothing built)'))))) }}
    _vm_report_lines: >-
      {{ [_vm_report_subject | trim] + (_vd_g.fields | vm_deploy_spec_text)
         + (['ERROR: ' ~ _vd_g.error] if _vd_g.error else [])
         + (_vd_g.dropped | map('regex_replace', '^', 'DROPPED: ') | list) + (_vd_g.questions | map('regex_replace', '^', 'QUESTION: ') | list)
         + (_vd_g.notes | default([]) | map('regex_replace', '^', 'GENAI NOTE (not sent to the requester): ') | list)
         + (_vd_gc.problems | map('regex_replace', '^', 'THE BUILD WOULD REFUSE: ') | list)
         + (['WARNING: ServiceNow did not take the note'] if not ansible_check_mode and not _vd_g.error and not _vd_written | bool else [])
         + (['A dry run (Check): nothing was written on the ticket and nothing built - a real run asks GenAI again.']
            if ansible_check_mode and _ea_ran | default(false) | bool else []) }}
    _vm_report_doc: >-
      {%- set rows = [] -%}
      {%- if _vd_g.os | default('') -%}{%- set _ = rows.append(['os (as written)', _vd_g.os, '']) -%}{%- endif -%}
      {%- for f in ['vm_name', 'template', 'cpu', 'memory_gb', 'disks_gb', 'site'] if f in _vd_g.fields -%}
      {%-   set v = _vd_g.fields[f] -%}
      {%-   set _ = rows.append([f, (v | join(', ')) if v is iterable and v is not string else v, _vd_g.evidence[f] | default('')]) -%}
      {%- endfor -%}
      {%- set sections = [{'title': 'What GenAI read (each value with the words of the ticket it comes from)', 'columns': ['Setting', 'Value', 'From the ticket'],
                           'rows': rows, 'text': ('A dry run (Check): nothing was written on the ticket and nothing built - a real run asks GenAI again.'
                                                  if ansible_check_mode else
                                                  'Nothing was built in this run. The next run builds this, as long as the ticket text does not change.')}] -%}
      {%- if _vd_g.questions -%}{%- set _ = sections.append({'title': 'Questions for the requester', 'status': 'warning', 'lines': _vd_g.questions}) -%}{%- endif -%}
      {%- if _vd_g.dropped -%}{%- set _ = sections.append({'title': 'Dropped: not traceable to the ticket, or for another version', 'status': 'warning', 'lines': _vd_g.dropped}) -%}{%- endif -%}
      {%- if _vd_g.notes | default([]) -%}{%- set _ = sections.append({'title': "GenAI's own notes (not sent to the requester)", 'lines': _vd_g.notes}) -%}{%- endif -%}
      {%- if _vd_gc.problems -%}{%- set _ = sections.append({'title': 'The build would refuse it now', 'status': 'warning', 'lines': _vd_gc.problems}) -%}{%- endif -%}
      {%- if _vd_g.error -%}{%- set _ = sections.append({'title': 'GenAI did not run', 'status': 'critical', 'lines': [_vd_g.error]
            + (['What GenAI answered (the job could not read it): ' ~ (_ea_raw | default('') | truncate(2000))] if _ea_ran | default(false) | bool else [])}) -%}{%- endif -%}
      {{ {'title': _vm_report_subject | trim, 'status': 'critical' if _vd_g.error and not ansible_check_mode else ('warning' if _vd_g_ask | bool else 'info'),
          'subtitle': 'Ticket ' ~ _vd_rec.number ~ ' (' ~ _vd_digest ~ ') - ' ~ _vd_job, 'sections': sections} }}

- name: VMware | the proposal as job artifacts (vm_deploy)
  when: not _vd_g_clean | bool
  ansible.builtin.set_stats:
    data:
      vm_deploy: >-
        {{ {'ticket': _vd_rec.number, 'table': _vd_table, 'genai': {'ran': _ea_ran | default(false) | bool, 'digest': _vd_digest,
            'fields': _vd_g.fields, 'evidence': _vd_g.evidence, 'questions': _vd_g.questions, 'dropped': _vd_g.dropped,
            'notes': _vd_g.notes | default([]), 'os': _vd_g.os | default(''),
            'would_refuse': _vd_gc.problems, 'error': _vd_g.error}, 'built': false, 'dry_run': ansible_check_mode} }}

- name: VMware | GenAI read the ticket, and the request can go on (a workflow stops here otherwise)
  ansible.builtin.assert:
    that: _vd_g_clean | bool
    fail_msg: >-
      {{ ('GenAI did not read the ticket: ' ~ _vd_g.error ~ ". Nothing was built; the ticket's own 'key: value' lines still work without GenAI.")
         if _vd_g.error else
         ('Nothing was built: the requester has to answer ' ~ _vd_g.questions | length ~ ' question(s) - they are on the ticket as a comment.')
         if _vd_g.questions else
         ('Nothing was built: the rules refuse the request - ' ~ _vd_gc.problems | join('; ')) }}
    quiet: true
  when: not ansible_check_mode
