---
# VM OUTAGE WATCH (playbooks/vm_outage_watch.yml): is something down or hung right now? Hosts not
# responding, HA agents isolated, datastores not accessible, all paths down / device loss, HA restarts
# and failures, VMs waiting on a question, hung VMs (no heartbeat AND no answer on the network, in every
# check of the run). Read-only: phase 1 restarts nothing, it lists what phase 2 would restart.
# A clean run is one line - no email, no web page. A run that finds a condition of vm_watch_report_on
# reports it (report_email_to, report_web_dest). Always: the artifacts vm_watch, and site_health /
# site_health_targets for the ServiceNow tickets job after it in a workflow (one ticket per condition,
# noted - or resolved - once it clears). Fails on a condition of vm_watch_fail_on, after all that.
# 1.66.0: vm_watch_review (a launch choice) makes the outage review after the watch - the time line of the last
# vm_watch_review_hours, also when nothing is down now; a report that goes out anyway carries the time line too
# (vm_watch_timeline). docs/VM_OUTAGE_WATCH.md
- name: VMware | a vCenter credential is attached
  ansible.builtin.include_tasks: credential.yml

- name: VMware | what is down or hung (the suspects checked {{ vm_watch_confirm_checks }} time(s), {{ vm_watch_confirm_seconds }} s apart)
  site_vmware_watch:
    datacenter: "{{ vmware_datacenter | default(omit, true) }}"
    vcenters: "{{ (vmware_vcenters | replace(',', ' ')).split() if vmware_vcenters is string else vmware_vcenters }}"
    validate_certs: "{{ vmware_validate_certs | bool }}"
    window_minutes: "{{ vm_watch_window_minutes | float }}"
    min_up_minutes: "{{ vm_watch_min_up_minutes | float }}"
    skip_vms: "{{ vm_watch_skip_vms | name_list }}"
    skip_folders: "{{ vm_watch_skip_folders | name_list }}"
    probe: "{{ vm_watch_probe | bool }}"
    probe_port: "{{ vm_watch_probe_port | string }}"
    traffic: "{{ vm_watch_traffic | bool }}"
    traffic_packets: "{{ vm_watch_traffic_packets | int }}"
    probe_timeout: "{{ vm_watch_probe_timeout | float }}"
    max_suspects: "{{ vm_watch_max_suspects | int }}"
    confirm_checks: "{{ vm_watch_confirm_checks | int }}"
    confirm_seconds: "{{ vm_watch_confirm_seconds | float }}"
    now: "{{ _vm_now | default(omit) }}"
  register: _vm_w
  check_mode: false                      # read-only: a dry run (Check) reads and reports the same

- name: VMware | the protected VMs (the same list as a restart's)
  ansible.builtin.include_tasks: protected.yml

# one dict expression: on ansible-core 2.16 the values of a YAML dict would arrive as strings
- name: VMware | what was found, and what phase 2 would restart (nothing is restarted)
  ansible.builtin.set_fact:
    _vm_w_cond: "{{ _vm_w | vm_watch_conditions({'one_signal_severity': vm_watch_one_signal_severity}) }}"
    _vm_w_opts: >-
      {{ {'protected_ids': _vm_prot.ids,
          'protected_names': _vm_prot.names + (vm_watch_protect | name_list),
          'aap_known': _vm_prot.aap_known,
          'max_actions': vm_watch_max_actions | int} }}

- name: VMware | is single sign-on down now (vm_watch_sso)
  when: vm_watch_sso | bool and vm_sso | bool
  block:
    - name: VMware | single sign-on and OCSP - read
      ansible.builtin.include_tasks: sso_read.yml
      vars:
        _vm_sso_crl: false               # the CRL (tens of MB) is the health report's, not every watch run's

    - name: VMware | single sign-on and OCSP - what is down now
      ansible.builtin.set_fact:
        _vm_w_cond: "{{ _vm_w_cond + (_vm_sso | vcenter_sso_conditions(_vm_sso_opts)) }}"

- name: VMware | phase 2's decision (made, not carried out)
  ansible.builtin.set_fact:
    _vm_w_actions: "{{ _vm_w_cond | vm_watch_actions(_vm_w_opts) }}"
    _vm_w_report_it: "{{ _vm_w_cond | selectattr('severity', 'in', vm_watch_report_on | name_list) | list | length > 0 }}"

- name: VMware | {{ _vm_w | vm_watch_clean_line(_vm_w_cond) if _vm_w_cond | length == 0 else 'below the report threshold (vm_watch_report_on)' }}
  ansible.builtin.debug:
    msg: >-
      {{ [_vm_w | vm_watch_clean_line(_vm_w_cond)]
         + (_vm_w_cond | map(attribute='severity') | map('upper') | zip(_vm_w_cond | map(attribute='summary')) | map('join', ' ') | list)
         + ((_vm_w | vm_watch_not_judged) | map(attribute='name') | zip((_vm_w | vm_watch_not_judged) | map(attribute='why'))
            | map('join', ' - not judged: ') | list) }}
  when: not _vm_w_report_it | bool

# 1.66.0, the outage review's time line: what vCenter and ServiceNow recorded, in order. Read only when a report is
# made anyway (vm_watch_timeline) or a review is asked for (vm_watch_review): a clean run stays one read and one line.
# Read-only (vCenter's events; ServiceNow GET only, and only with its credential attached). A read that fails never
# stops the watch: the report then goes out without the time line.
- name: VMware | the outage review's window (vm_watch_review_hours, vm_watch_review_from, vm_watch_review_to)
  ansible.builtin.set_fact:
    _vm_w_review: "{{ vm_watch_review | bool }}"
    _vm_w_tl: {}
    _vm_w_win: >-
      {{ (_vm_now | default(now().timestamp())) | outage_window(vm_watch_review_hours,
           vm_watch_review_from if vm_watch_review | bool else '', vm_watch_review_to if vm_watch_review | bool else '',
           report_time_zone | default('', true) | string) }}

- name: VMware | the outage review's window is a stretch of time
  ansible.builtin.assert:
    that: _vm_w_win.error == ''
    fail_msg: "{{ _vm_w_win.error }}. Write the times as 2026-11-12 01:00, in report_time_zone."
    quiet: true
  when: _vm_w_review | bool

- name: VMware | the outage time line (vm_watch_review, vm_watch_timeline)
  when: _vm_w_review | bool or (_vm_w_report_it | bool and vm_watch_timeline | bool)
  block:
    - name: VMware | vCenter's events of the window
      site_vmware_outage_events:
        datacenter: "{{ vmware_datacenter | default(omit, true) }}"
        vcenters: "{{ (vmware_vcenters | replace(',', ' ')).split() if vmware_vcenters is string else vmware_vcenters }}"
        validate_certs: "{{ vmware_validate_certs | bool }}"
        begin: "{{ _vm_w_win.begin | float }}"
        end: "{{ _vm_w_win.end | float }}"
        event_types: "{{ vm_watch_review_event_types | name_list }}"
        max_events: "{{ vm_watch_review_max_events | int }}"
      register: _vm_w_ev
      check_mode: false                  # read-only: a dry run (Check) reads and reports the same

    - name: VMware | the tickets of the window (ServiceNow, GET only; skipped without the ServiceNow API credential)
      site_outage_tickets:
        table: "{{ servicenow_table | default('incident', true) }}"
        prefix: "{{ servicenow_correlation_prefix | default('site-health', true) }}"
        numbers: "{{ vm_watch_review_tickets | name_list }}"
        begin: "{{ _vm_w_win.begin | float }}"
        end: "{{ _vm_w_win.end | float }}"
        validate_certs: "{{ servicenow_validate_certs | default(true) | bool }}"
        ca_path: "{{ servicenow_ca_path | default(omit, true) }}"
        timeout: "{{ servicenow_timeout | default(30) | int }}"
      register: _vm_w_tk
      check_mode: false                  # GET only
      when: lookup('ansible.builtin.env', 'SN_HOST') | trim | length > 0

    # one dict expression: on ansible-core 2.16 the values of a YAML dict would arrive as strings
    - name: VMware | the time line
      ansible.builtin.set_fact:
        _vm_w_tl: >-
          {{ _vm_w_ev.events | outage_timeline(_vm_w_tk.tickets | default([]),
               {'begin': _vm_w_win.begin, 'end': _vm_w_win.end, 'fixed': vm_watch_review_from | string | trim | length > 0,
                'time_zone': report_time_zone | default('', true) | string,
                'low_seconds': vm_watch_review_low_seconds | float,
                'tickets_asked': _vm_w_tk.asked | default(false), 'tickets_error': _vm_w_tk.error | default(''),
                'notes_error': _vm_w_tk.notes_error | default(''), 'capped': _vm_w_ev.capped,
                'report_on': vm_watch_report_on | name_list,
                'min_severity': servicenow_min_severity | default('warning', true)}) }}
  rescue:
    - name: VMware | the time line was not made (the watch goes on without it)
      ansible.builtin.debug:
        msg: "The outage time line was not made: {{ ansible_failed_result.msg | default('the read failed') }}"

- name: VMware | the outage report
  when: _vm_w_report_it | bool or _vm_w_review | bool
  block:
    - name: VMware | the report
      ansible.builtin.set_fact:
        _vm_w_doc: "{{ _vm_w | vm_watch_report(_vm_w_cond, _vm_w_actions, {'time_zone': report_time_zone | default('', true) | string}) }}"

    - name: VMware | outage report
      ansible.builtin.include_tasks: report.yml
      vars:
        _vm_vcenters: "{{ _vm_w.vcenters }}"
        _vm_report_subject: "{{ _vm_w_tl.title if _vm_w_review | bool and _vm_w_tl else _vm_w_doc.title }}"
        _vm_report_lines: "{{ ((_vm_w_tl.lines + ['']) if _vm_w_tl else []) + (_vm_w_doc | report_text).splitlines() }}"
        _vm_report_doc: "{{ _vm_w_doc | outage_timeline_doc(_vm_w_tl, false, _vm_w_review | bool) }}"
        _vm_report_web_doc: "{{ _vm_w_doc | outage_timeline_doc(_vm_w_tl, true, _vm_w_review | bool) if _vm_w_tl else {} }}"
        _vm_report_xlsx: >-
          {{ (_vm_w_doc | outage_timeline_doc(_vm_w_tl, false, _vm_w_review | bool) | report_xlsx_sheets) + [_vm_w_tl.sheet]
             if _vm_w_tl and report_email_xlsx | default(false) | bool else [] }}

- name: VMware | the review's numbers as a job artifact (vm_outage_review)
  ansible.builtin.set_stats:
    data:
      vm_outage_review: "{{ _vm_w_tl.numbers | combine({'window': _vm_w_tl.window, 'title': _vm_w_tl.title}) }}"
  when: _vm_w_tl | length > 0

# always (clean or not): the tickets job after this one in a workflow opens, updates and clears the tickets
- name: VMware | the result as job artifacts (vm_watch; site_health for the ServiceNow tickets job)
  ansible.builtin.set_stats:
    data:
      vm_watch: "{{ _vm_w | vm_watch_artifact(_vm_w_cond, _vm_w_actions) }}"
      site_health: "{{ _vm_w | vm_watch_health(_vm_w_cond, {'job': awx_job_id | default('')}) }}"
      site_health_targets: []

- name: VMware | every vCenter was read
  ansible.builtin.include_tasks: vcenters_read.yml
  vars:
    _vm_vcenters: "{{ _vm_w.vcenters }}"

- name: VMware | nothing down or hung (vm_watch_fail_on)
  ansible.builtin.assert:
    that: _vm_w_cond | selectattr('severity', 'in', vm_watch_fail_on | name_list) | list | length == 0
    fail_msg: >-
      {{ _vm_w_cond | selectattr('severity', 'in', vm_watch_fail_on | name_list) | list | length }} condition(s) at
      {{ vm_watch_fail_on | name_list | join(' / ') }}:
      {{ _vm_w_cond | selectattr('severity', 'in', vm_watch_fail_on | name_list) | map(attribute='summary') | join('; ') }}.
      Nothing was restarted (watch only). The report is above.
    quiet: true
