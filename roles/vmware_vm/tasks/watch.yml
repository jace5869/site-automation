---
# VM OUTAGE WATCH (playbooks/vm_outage_watch.yml): is something down or hung right now? Hosts not
# responding, HA agents isolated, datastores not accessible, all paths down / device loss, HA restarts
# and failures, VMs waiting on a question, hung VMs (no heartbeat AND no answer on the network, in every
# check of the run). Read-only: phase 1 restarts nothing, it lists what phase 2 would restart.
# A clean run is one line - no email, no web page. A run that finds a condition of vm_watch_report_on
# reports it (report_email_to, report_web_dest). Always: the artifacts vm_watch, and site_health /
# site_health_targets for the ServiceNow tickets job after it in a workflow (one ticket per condition,
# noted - or resolved - once it clears). Fails on a condition of vm_watch_fail_on, after all that.
# 1.66.0: vm_watch_review (a launch choice) makes the outage review after the watch - the time line of the last
# vm_watch_review_hours, also when nothing is down now; a report that goes out anyway carries the time line too
# (vm_watch_timeline). docs/VM_OUTAGE_WATCH.md
- name: VMware | a vCenter credential is attached
  ansible.builtin.include_tasks: credential.yml

- name: VMware | what is down or hung (the suspects checked {{ vm_watch_confirm_checks }} time(s), {{ vm_watch_confirm_seconds }} s apart)
  site_vmware_watch:
    datacenter: "{{ vmware_datacenter | default(omit, true) }}"
    vcenters: "{{ (vmware_vcenters | replace(',', ' ')).split() if vmware_vcenters is string else vmware_vcenters }}"
    validate_certs: "{{ vmware_validate_certs | bool }}"
    window_minutes: "{{ vm_watch_window_minutes | float }}"
    min_up_minutes: "{{ vm_watch_min_up_minutes | float }}"
    skip_vms: "{{ (vm_watch_skip_vms | name_list) + (site_exclude_hosts | default([], true) | site_exclude_patterns) }}"
    skip_folders: "{{ vm_watch_skip_folders | name_list }}"
    probe: "{{ vm_watch_probe | bool }}"
    probe_port: "{{ vm_watch_probe_port | string }}"
    traffic: "{{ vm_watch_traffic | bool }}"
    traffic_packets: "{{ vm_watch_traffic_packets | int }}"
    probe_timeout: "{{ vm_watch_probe_timeout | float }}"
    max_suspects: "{{ vm_watch_max_suspects | int }}"
    confirm_checks: "{{ vm_watch_confirm_checks | int }}"
    confirm_seconds: "{{ vm_watch_confirm_seconds | float }}"
    now: "{{ _vm_now | default(omit) }}"
  register: _vm_w
  no_log: "{{ vm_watch_review | bool }}"
  check_mode: false                      # read-only: a dry run (Check) reads and reports the same

- name: VMware | redact a copy of the watch read for the review (the conditions and their ticket ids come from the read itself)
  ansible.builtin.set_fact:
    _vm_w_red: "{{ _vm_w | outage_redact }}"
  vars:
    _vm_w_review: "{{ vm_watch_review | bool }}"   # before the mail decision, protect the requested review
  when: _vm_w_review | bool

- name: VMware | the protected VMs (the same list as a restart's)
  ansible.builtin.include_tasks: protected.yml

# one dict expression: on ansible-core 2.16 the values of a YAML dict would arrive as strings
- name: VMware | what was found, and what phase 2 would restart (nothing is restarted)
  ansible.builtin.set_fact:
    _vm_w_cond: >-
      {{ _vm_w | vm_watch_conditions({'one_signal_severity': vm_watch_one_signal_severity,
           'protected_ids': _vm_prot.ids, 'protected_names': _vm_prot.names + (vm_watch_protect | name_list)}) }}
    _vm_w_opts: >-
      {{ {'protected_ids': _vm_prot.ids,
          'protected_names': _vm_prot.names + (vm_watch_protect | name_list),
          'aap_known': _vm_prot.aap_known,
          'max_actions': vm_watch_max_actions | int} }}

- name: VMware | is single sign-on down now (vm_watch_sso)
  when: vm_watch_sso | bool and vm_sso | bool
  block:
    - name: VMware | single sign-on and OCSP - read
      ansible.builtin.include_tasks: sso_read.yml
      vars:
        _vm_sso_crl: false               # the CRL (tens of MB) is the health report's, not every watch run's

    - name: VMware | single sign-on and OCSP - what is down now
      ansible.builtin.set_fact:
        _vm_w_cond: "{{ _vm_w_cond + (_vm_sso | vcenter_sso_conditions(_vm_sso_opts)) }}"

- name: VMware | phase 2's decision (made, not carried out)
  ansible.builtin.set_fact:
    _vm_w_actions: "{{ _vm_w_cond | vm_watch_actions(_vm_w_opts) }}"
    _vm_w_report_it: "{{ _vm_w_cond | selectattr('severity', 'in', vm_watch_report_on | name_list) | list | length > 0 }}"

- name: VMware | {{ _vm_w | vm_watch_clean_line(_vm_w_cond) if _vm_w_cond | length == 0 else 'below the report threshold (vm_watch_report_on)' }}
  ansible.builtin.debug:
    msg: >-
      {{ [_vm_w | vm_watch_clean_line(_vm_w_cond)]
         + (_vm_w_cond | map(attribute='severity') | map('upper') | zip(_vm_w_cond | map(attribute='summary')) | map('join', ' ') | list)
         + ((_vm_w | vm_watch_not_judged) | map(attribute='name') | zip((_vm_w | vm_watch_not_judged) | map(attribute='why'))
            | map('join', ' - not judged: ') | list) }}
  when: not _vm_w_report_it | bool

# 1.112.5: the email only when something changed since the last one (vm_watch_email_on_change); a review on a schedule at most
# once per vm_watch_email_every_hours. _vm_w_mail.review is the review this run makes (watch_email.yml)
- name: VMware | the watch's email - only when something changed (vm_watch_email_on_change)
  ansible.builtin.include_tasks: watch_email.yml

# 1.66.0, the outage review's time line: what vCenter and ServiceNow recorded, in order. Read only when a report is
# made anyway (vm_watch_timeline) or a review is asked for (vm_watch_review): a clean run stays one read and one line.
# Read-only (vCenter's events; ServiceNow GET only, and only with its credential attached). A read that fails never
# stops the watch: the report then goes out without the time line.
- name: VMware | the outage review's window (vm_watch_review_hours, vm_watch_review_from, vm_watch_review_to)
  ansible.builtin.set_fact:
    _vm_w_review: "{{ _vm_w_mail.review | bool }}"
    _vm_w_tl: {}
    _vm_w_win: >-
      {{ (_vm_now | default(now().timestamp())) | outage_window(vm_watch_review_hours,
           vm_watch_review_from if _vm_w_mail.review | bool else '', vm_watch_review_to if _vm_w_mail.review | bool else '',
           report_time_zone | default('', true) | string) }}

- name: VMware | the outage review's window is a stretch of time
  ansible.builtin.assert:
    that: _vm_w_win.error == ''
    fail_msg: "{{ _vm_w_win.error }}. Write the times as 2026-11-12 01:00, in report_time_zone."
    quiet: true
  when: _vm_w_review | bool

- name: VMware | the outage time line (vm_watch_review, vm_watch_timeline)
  when: _vm_w_review | bool or (_vm_w_report_it | bool and vm_watch_timeline | bool)
  block:
    - name: VMware | the watch conditions recorded in the review window
      when: _vm_w_review | bool
      block:
        - name: VMware | this template's vm_watch artifacts
          ansible.builtin.include_role:
            name: site_email
            tasks_from: history_artifacts.yml
            apply:
              no_log: true
          vars:
            _hist_artifacts: [vm_watch]
            _hist_window: "{{ _vm_w_win }}"
            _hist_always: true

        - name: VMware | the watch inventory and recorded roots for this review
          ansible.builtin.set_fact:
            _vm_w_review_opts: >-
              {{ {'hosts': _vm_w_red.hosts, 'datastores': _vm_w_red.datastores, 'read_at': _vm_w_red.read_at,
                  'questions': _vm_w_red.questions | default([]),
                  'watch_runs': _site_hist_runs, 'history_why': _site_hist_why, 'review_object': vm_watch_review_object,
                  'vcenters': _vm_w_red.vcenters, 'noise': vm_watch_review_noise | bool,
                  'noise_alarms': vm_watch_review_noise_alarms | name_list, 'appendix_max': outage_aar_appendix_max | int,
                  'correlation_prefix': servicenow_correlation_prefix | default('site-health', true),
                  'outage_escalate_storage': outage_escalate_storage, 'outage_escalate_network': outage_escalate_network,
                  'outage_escalate_vmware': outage_escalate_vmware, 'outage_escalate_backup': outage_escalate_backup} }}
          no_log: true

    - name: VMware | vCenter's events of the window
      site_vmware_outage_events:
        datacenter: "{{ vmware_datacenter | default(omit, true) }}"
        vcenters: "{{ (vmware_vcenters | replace(',', ' ')).split() if vmware_vcenters is string else vmware_vcenters }}"
        validate_certs: "{{ vmware_validate_certs | bool }}"
        begin: "{{ _vm_w_win.begin | float }}"
        end: "{{ _vm_w_win.end | float }}"
        review: "{{ true if _vm_w_review | bool else omit }}"
        event_types: "{{ vm_watch_review_event_types | name_list }}"
        max_events: "{{ vm_watch_review_max_events | int }}"
        lookback_hours: "{{ vm_watch_review_lookback_hours | float }}"
      no_log: "{{ _vm_w_review | bool }}"
      register: _vm_w_ev
      check_mode: false                  # read-only: a dry run (Check) reads and reports the same

    - name: VMware | the tickets of the window (ServiceNow, GET only; skipped without the ServiceNow API credential)
      site_outage_tickets:
        review: "{{ true if _vm_w_review | bool else omit }}"
        table: "{{ servicenow_table | default('incident', true) }}"
        prefix: "{{ servicenow_correlation_prefix | default('site-health', true) }}"
        numbers: "{{ vm_watch_review_tickets | name_list }}"
        begin: "{{ _vm_w_win.begin | float }}"
        end: "{{ _vm_w_win.end | float }}"
        validate_certs: "{{ servicenow_validate_certs | default(true) | bool }}"
        ca_path: "{{ servicenow_ca_path | default(omit, true) }}"
        timeout: "{{ servicenow_timeout | default(30) | int }}"
      no_log: "{{ _vm_w_review | bool }}"
      register: _vm_w_tk
      check_mode: false                  # GET only
      when: lookup('ansible.builtin.env', 'SN_HOST') | trim | length > 0

    # one dict expression: on ansible-core 2.16 the values of a YAML dict would arrive as strings
    - name: VMware | the time line
      ansible.builtin.set_fact:
        _vm_w_tl: >-
          {{ _vm_w_ev.events | outage_timeline(_vm_w_tk.tickets | default([]),
               {'begin': _vm_w_win.begin, 'end': _vm_w_win.end, 'fixed': _vm_w_review | bool and vm_watch_review_from | string | trim | length > 0,
                'time_zone': report_time_zone | default('', true) | string,
                'low_seconds': vm_watch_review_low_seconds | float,
                'min_seconds': vm_watch_review_min_seconds | float, 'skip_blips': vm_watch_review_skip_blips | bool,
                'job': awx_job_id | default('') | string, 'review': _vm_w_review | bool,
                'triggers': _vm_w_cond | default([]),
                'tickets_asked': _vm_w_tk.asked | default(false), 'tickets_error': _vm_w_tk.error | default(''),
                'notes_error': _vm_w_tk.notes_error | default(''), 'capped': _vm_w_ev.capped, 'instance': _vm_w_tk.instance | default(''),
                'table': servicenow_table | default('incident', true) | string,
                'report_on': vm_watch_report_on | name_list,
                'min_severity': servicenow_min_severity | default('warning', true)} | combine(_vm_w_review_opts if _vm_w_review | bool else {})) }}
  rescue:
    - name: VMware | the time line was not made (the watch goes on without it)
      ansible.builtin.debug:
        msg: >-
          The outage time line was not made: {{ (ansible_failed_result.msg | default('the read failed') | outage_redact)
             if _vm_w_review | bool else ansible_failed_result.msg | default('the read failed') }}

# 1.104.0, ACT on the outage review (vm_outage_act): ACT's possible causes and fixes, as cards (outage_act.yml). A review
# only (vm_watch_review), never on the watch's own runs.
- name: VMware | ACT on the outage review (vm_outage_act)
  ansible.builtin.include_tasks: outage_act.yml
  when: >-
    _vm_w_review | bool and vm_outage_act | bool and _vm_w_tl | default({}) | length > 0
    and not _vm_w_tl.skip | default(false) | bool and (_vm_w_tl.act_in.events | default([]) | length) > 0

# 1.79.12: vm_watch_review_skip_blips - a trigger that was only usage alarms that cleared within vm_watch_review_min_seconds sends nothing
- name: VMware | only a short usage blip (vm_watch_review_skip_blips) - no report is sent
  ansible.builtin.debug:
    msg: "{{ _vm_w_tl.title }} - not sent (vm_watch_review_skip_blips)."
  when: _vm_w_tl | default({}) | length > 0 and _vm_w_tl.skip | default(false) | bool

# 1.112.0, the AAR draft of a review: the review's facts in the after action report's layout (roles/incident_docs,
# review_draft.yml) - "Download AAR (Word)" on the page, attached to the email; the same draft in the job artifact for the
# AAR job (incident_review). It never stops the watch: not made, the page says why. A skipped blip has none (Neon P1: the
# AAR job's latest never takes a blip). Its temporary folder is deleted whatever happens after (always).
- name: VMware | the review's AAR draft and the outage report
  block:
    - name: VMware | no AAR draft yet
      ansible.builtin.set_fact:
        _vm_w_aar: {}
        _vm_w_aar_file: {}
        _vm_w_aar_error: ""

    # Each optional attachment can fail independently of the report.
    - name: VMware | the full event list of the review
      when: _vm_w_review | bool and _vm_w_tl.events_file | default('') | length > 0 and not _vm_w_tl.skip | bool
      block:
        - name: VMware | a temporary folder for the review files
          ansible.builtin.tempfile:
            state: directory
            suffix: .csv
          register: _vm_w_csv_dir
          check_mode: false

        - name: VMware | write the full event list
          ansible.builtin.copy:
            content: "{{ _vm_w_tl.sheet | outage_events_csv }}"
            dest: "{{ _vm_w_csv_dir.path }}/{{ _vm_w_tl.events_file }}"
            mode: "0600"
          check_mode: false
          diff: false
          no_log: true

        - name: VMware | the CSV attachment
          ansible.builtin.set_fact:
            _vm_w_csv_file:
              path: "{{ _vm_w_csv_dir.path }}/{{ _vm_w_tl.events_file }}"
              filename: "{{ _vm_w_tl.events_file }}"
              desc: CSV - every event of this outage review, in time order
      rescue:
        - name: VMware | the review goes on without the CSV
          ansible.builtin.debug:
            msg: The full event CSV could not be written.

    - name: VMware | the AAR draft of the review
      when: _vm_w_review | bool and _vm_w_tl | default({}) | length > 0 and not _vm_w_tl.skip | default(false) | bool
      block:
        - name: VMware | the AAR draft's facts (vm_outage_review.aar)
          ansible.builtin.set_fact:
            _vm_w_aar: >-
              {{ (_vm_w_tl.draft | default({})) | incident_review_draft(_vm_w_tl.act | default(none),
                   {'csv_file': _vm_w_csv_file.filename | default(''), 'job': awx_job_id | default('') | string, 'made': now(utc=true, fmt='%Y-%m-%d %H:%M UTC')}) }}

        - name: VMware | a temporary folder for the Word files
          ansible.builtin.tempfile:
            state: directory
            suffix: .aar
          register: _vm_w_aar_dir
          check_mode: false
          when: _vm_w_aar | length > 0 and vm_watch_review_docx | bool

        - name: VMware | write the AAR draft (the AAR job's look)
          ansible.builtin.include_role:
            name: incident_docs
            tasks_from: review_draft.yml
          vars:
            _rd_draft: "{{ _vm_w_aar }}"
            _rd_dir: "{{ _vm_w_aar_dir.path }}"
          when: _vm_w_aar | length > 0 and vm_watch_review_docx | bool

        - name: "VMware | the AAR draft - {{ _rd_file.filename | default('not made') }}"
          ansible.builtin.set_fact:
            _vm_w_noc_file: "{{ _rd_noc_file | default({}) }}"
            _vm_w_noc_error: "{{ _rd_noc_error | default('') }}"
            _vm_w_aar_file: "{{ _rd_file | default({}) }}"
            _vm_w_aar_error: "{{ _rd_error | default('') }}"
          when: _vm_w_aar | length > 0 and vm_watch_review_docx | bool
      rescue:
        - name: VMware | the AAR draft was not made (the review goes on without it)
          ansible.builtin.set_fact:
            _vm_w_aar_error: "{{ ansible_failed_result.msg | default('it could not be written') | string | truncate(200) }}"

    - name: VMware | the outage report
      when: (_vm_w_report_it | bool or _vm_w_review | bool or _vm_w_mail.kind == 'recovered') and not (_vm_w_tl | default({}) | length > 0 and _vm_w_tl.skip | default(false) | bool)
      block:
        - name: VMware | the report
          ansible.builtin.set_fact:
            # 1.112.5: the email says what changed since the last one (a section on top); the recovered email is titled so
            _vm_w_doc: >-
              {%- set d = _vm_w | vm_watch_report(_vm_w_cond, _vm_w_actions, {'time_zone': report_time_zone | default('', true) | string}) -%}
              {%- set d = d | combine({'title': 'Recovered - ' ~ d.title})
                          if _vm_w_mail.kind == 'recovered' else d -%}
              {{ d | combine({'sections': [{'title': 'Since the last email', 'status': 'info', 'top': true, 'lines': _vm_w_mail.changed}]
                                          + d.sections | default([])}) if _vm_w_mail.send and _vm_w_mail.changed else d }}
            # 1.112.5 (Codex review): the email state is kept as sent only when this email has somewhere to go
            _vm_w_mail_out: >-
              {{ _vm_w_mail.send | bool and (report_email_to | default([]) | length > 0 or report_email_also | default([]) | length > 0) }}
            _vm_w_aar_info: >-
              {{ {'file': _vm_w_aar_file.filename | default(''), 'error': _vm_w_aar_error, 'job': awx_job_id | default('') | string,
                  'csv_file': _vm_w_csv_file.filename | default(''), 'noc_file': _vm_w_noc_file.filename | default(''), 'noc_error': _vm_w_noc_error | default(''),
                  'asked': _vm_w_aar | length > 0 and vm_watch_review_docx | bool, 'draft': _vm_w_aar | length > 0,
                  'review': _vm_w_review | bool} }}

        - name: VMware | outage report
          ansible.builtin.include_tasks: report.yml
          vars:
            _vm_vcenters: "{{ _vm_w.vcenters }}"
            _vm_report_subject: "{{ _vm_w_tl.title if _vm_w_review | bool and _vm_w_tl else _vm_w_doc.title }}"
            _vm_report_lines: "{{ ((_vm_w_tl.lines + ['']) if _vm_w_tl else []) + (_vm_w_doc | report_text).splitlines() }}"
            _vm_report_doc: "{{ _vm_w_doc | outage_timeline_doc(_vm_w_tl, false, _vm_w_review | bool) | outage_review_aar(_vm_w_aar_info, false) }}"
            _vm_report_web_doc: >-
              {{ _vm_w_doc | outage_timeline_doc(_vm_w_tl, true, _vm_w_review | bool) | outage_review_aar(_vm_w_aar_info, true) if _vm_w_tl else {} }}
            _vm_report_attachments: >-
              {{ ([_vm_w_aar_file | combine({'desc': 'Word document - the after action report (AAR) draft, filled from this outage review: '
                                                    ~ 'check it and finish it before you send it'})] if _vm_w_review | bool and _vm_w_aar_file.path | default('') else [])
                 + ([_vm_w_noc_file | combine({'desc': 'Word document - Hand this to the NOC: one page, what is down now, what went down and '
                                                      ~ 'what it affected, and what each pattern usually means'})]
                    if _vm_w_review | bool and _vm_w_noc_file.path | default('') else [])
                 + ([_vm_w_csv_file] if _vm_w_review | bool and _vm_w_csv_file.path | default('') else []) }}
            _vm_report_xlsx_desc: >-
              Excel workbook - this outage review's tables, a sheet each, and the whole time line (sheet Timeline: every event in
              time order, with its source, host, level and message)
            # 1.112.5: no email when nothing changed since the last (vm_watch_email_on_change); the web page is updated as always
            _vm_report_no_email: "{{ not _vm_w_mail.send | bool }}"
            _vm_report_no_email_why: "{{ _vm_w_mail.why }}"
            _report_xlsx_optional: "{{ _vm_w_review | bool }}"
            _vm_report_workbook_stem: "{{ _vm_w_tl.workbook_stem | default('') }}"
            _vm_report_xlsx: >-
              {{ _vm_w_tl.sheets if _vm_w_tl and _vm_w_review | bool and report_email_xlsx | default(false) | bool else
                 (_vm_w_doc | outage_timeline_doc(_vm_w_tl, false, _vm_w_review | bool) | report_xlsx_sheets) + [_vm_w_tl.sheet]
                 if _vm_w_tl and report_email_xlsx | default(false) | bool else [] }}

  always:
    - name: VMware | the AAR draft's temporary folder, deleted
      ansible.builtin.file:
        path: "{{ _vm_w_aar_dir.path }}"
        state: absent
      check_mode: false
      failed_when: false
      when: _vm_w_aar_dir.path is defined

    - name: VMware | the CSV temporary folder, deleted
      ansible.builtin.file:
        path: "{{ _vm_w_csv_dir.path }}"
        state: absent
      check_mode: false
      failed_when: false
      when: _vm_w_review | bool and _vm_w_csv_dir.path is defined

# 1.112.0: a review also keeps its AAR draft (aar) - the AAR job reads it back by this job's number (incident_review)
- name: VMware | the review's numbers as a job artifact (vm_outage_review)
  ansible.builtin.set_stats:
    data:
      vm_outage_review: >-
        {{ _vm_w_tl.numbers | combine({'window': _vm_w_tl.window, 'title': _vm_w_tl.title, 'review': _vm_w_review | bool},
                                      {'aar': _vm_w_aar} if _vm_w_aar | default({}) | length > 0 else {}) }}
  when: _vm_w_tl | length > 0

# always (clean or not): the tickets job after this one in a workflow opens, updates and clears the tickets
- name: VMware | the result as job artifacts (vm_watch; site_health for the ServiceNow tickets job)
  ansible.builtin.set_stats:
    data:
      vm_watch: "{{ _vm_w | vm_watch_artifact(_vm_w_cond, _vm_w_actions) }}"
      site_health: "{{ _vm_w | vm_watch_health(_vm_w_cond, {'job': awx_job_id | default('')}) }}"
      site_health_targets: []

# 1.112.5: every run keeps the watch's email state (the last email, its conditions) - the next run reads it back from AAP.
# Never in a dry run (Check): a Check run sends nothing, so it must not look like an email to the real runs after it.
- name: VMware | the watch's email state as a job artifact (vm_watch_email_state)
  ansible.builtin.set_stats:
    data:
      vm_watch_email_state: "{{ _vm_w_mail_keep }}"
  vars:
    # an email that did not go out (no recipient, a review that was only a blip): the last state, as it was
    _vm_w_mail_keep: "{{ _vm_w_mail.state if _vm_w_mail_out | default(false) | bool or not _vm_w_mail.send | bool else _vm_w_mail.carry }}"
  when: _vm_w_mail_keep is not none and not ansible_check_mode

- name: VMware | every vCenter was read
  ansible.builtin.include_tasks: vcenters_read.yml
  vars:
    _vm_vcenters: "{{ _vm_w.vcenters }}"

- name: VMware | nothing down or hung (vm_watch_fail_on)
  ansible.builtin.assert:
    that: _vm_w_cond | selectattr('severity', 'in', vm_watch_fail_on | name_list) | list | length == 0
    fail_msg: >-
      {{ _vm_w_cond | selectattr('severity', 'in', vm_watch_fail_on | name_list) | list | length }} condition(s) at
