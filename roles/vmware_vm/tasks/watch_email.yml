---
# 1.112.5, the VM outage watch's email only when something changes (vm_watch_email_on_change): a run emails when the
# conditions of vm_watch_report_on changed since the last email - a new one, a worse severity, one cleared -, again every
# vm_watch_email_every_hours while they last (a reminder; 0 = none), and once when all have cleared (recovered). A review
# (vm_watch_review) always emails; on a schedule it is made at most once per vm_watch_email_every_hours. The web page and
# the tickets keep updating every run. The last email: this template's newest run's job artifact vm_watch_email_state,
# read from AAP with the "Red Hat Ansible Automation Platform" credential (as the report history). Read only (also in a
# dry run, Check).
# 1.118.8, at most one email per vm_watch_email_min_minutes (30): a change inside that time is held, and the first run
# after it sends one email with all of it. AAP not readable: the state is kept in the report database (the "Report
# database" credential, table vm_watch_email_state). Neither: only a critical condition is emailed, by a run in the first
# 15 minutes of each 30-minute slot, and the job output says what to attach.
# Output: _vm_w_mail (vm_watch_email_floor, plugins/filter/vmware_watch_email_filters.py, on vm_watch_email_decision).
- name: VMware | the watch's last email, from AAP (vm_watch_email_state)
  ansible.builtin.include_role:
    name: site_email
    tasks_from: history_artifacts.yml
    apply:
      no_log: "{{ vm_watch_review | bool }}"
  vars:
    _hist_artifacts: [vm_watch_email_state]
    _hist_runs: 15                       # the newest run that kept the state: runs that stopped early (or a Check) keep none
    _hist_always: true                   # read also with report_history: false (that is the strip of past runs only)
  when: vm_watch_email_on_change | bool or vm_watch_email_min_minutes | default(30) | float > 0

# 1.118.8: AAP could not be read - the state from the report database (written every run below, so it is current)
- name: VMware | the report database for the watch's email state (vm_watch_email_db)
  ansible.builtin.set_fact:
    _vm_w_mail_dbh: >-
      {{ lookup('ansible.builtin.env', 'REPORT_DB_HOST') | trim
         if vm_watch_email_db | default(true) | bool
            and (vm_watch_email_on_change | bool or vm_watch_email_min_minutes | default(30) | float > 0) else '' }}

- name: VMware | the watch's last email, from the report database (AAP not readable)
  site_vm_watch_email_db:
    host: "{{ _vm_w_mail_dbh }}"
    port: "{{ lookup('ansible.builtin.env', 'REPORT_DB_PORT') | default('3309', true) | int }}"
    database: "{{ lookup('ansible.builtin.env', 'REPORT_DB_NAME') | default('site_reports', true) | trim }}"
    user: "{{ lookup('ansible.builtin.env', 'REPORT_DB_USER') | trim }}"
    password: "{{ lookup('ansible.builtin.env', 'REPORT_DB_PASSWORD') }}"
    tls: "{{ lookup('ansible.builtin.env', 'REPORT_DB_TLS') | default('false', true) | bool }}"
    ca_file: "{{ lookup('ansible.builtin.env', 'REPORT_DB_CA_FILE') | trim }}"
    mode: read
    create: "{{ not ansible_check_mode }}"   # a dry run (Check) makes no table
    template: "{{ (awx_job_template_id | default(tower_job_template_id | default(0))) | int }}"
  register: _vm_w_mail_db
  check_mode: false                      # read only; it makes the table when it is not there, never in a dry run (create)
  no_log: "{{ vm_watch_review | bool }}"
  when: _vm_w_mail_dbh | length > 0 and _site_hist_why | default('') | length > 0

# one dict expression: on ansible-core 2.16 the values of a YAML dict would arrive as strings
# one dict expression: on ansible-core 2.16 the values of a YAML dict would arrive as strings
- name: VMware | does this run email (vm_watch_email_on_change, vm_watch_email_every_hours)
  no_log: "{{ vm_watch_review | bool }}"
  ansible.builtin.set_fact:
    _vm_w_mail: >-
      {{ _vm_w_cond | vm_watch_email_floor(_site_hist_runs | default([]),
           {'now': (_vm_now | default(now().timestamp())) | float, 'on_change': vm_watch_email_on_change | bool,
            'every_hours': vm_watch_email_every_hours | float, 'report_on': vm_watch_report_on | name_list,
            'review': vm_watch_review | bool,
            'scheduled': (awx_job_launch_type | default('')) == 'scheduled' or (awx_schedule_id | default('') | string | length > 0)
                         or (awx_parent_job_schedule_id | default('') | string | length > 0),
            'why': _site_hist_why | default('') if vm_watch_email_on_change | bool or vm_watch_email_min_minutes | default(30) | float > 0 else '',
            'unread': (_vm_w.vcenters | default([]) | selectattr('error') | list | length > 0)
                      or (_vm_w.vcenters | default([]) | selectattr('incomplete', 'defined') | list | length > 0)
                      or (_vm_w.suspects | default([]) | selectattr('verdict', 'equalto', 'busy') | list | length > 0),
            'time_zone': report_time_zone | default('', true) | string,
            'min_minutes': vm_watch_email_min_minutes | default(30) | float,
            'read_at': _vm_w.read_at | default('') | string,
            'db': {'ok': _vm_w_mail_db.ok | default(false) | bool, 'state': _vm_w_mail_db.state | default(none),
                   'error': _vm_w_mail_db.error | default('') | string},
            'db_why': '' if _vm_w_mail_db.ok | default(false) | bool else
                      (_vm_w_mail_db.error | default('') | string) if _vm_w_mail_db.error | default('') | string | length > 0 else
                      'vm_watch_email_db is false' if not vm_watch_email_db | default(true) | bool else
                      'no Report database credential'}) }}

- name: VMware | the watch's email
  ansible.builtin.debug:
    msg: "{{ _vm_w_mail.lines | outage_redact if vm_watch_review | bool else _vm_w_mail.lines }}"
  when: _vm_w_mail.lines | length > 0

# 1.118.8: the state also in the report database, every run while the credential is attached - so it is current when AAP
# cannot be read. As watch.yml keeps the job artifact: the state as sent when the email has somewhere to go (or none was
# due), the last state as it was otherwise. Never in a dry run (Check).
- name: VMware | the watch's email state in the report database (vm_watch_email_db)
  site_vm_watch_email_db:
    host: "{{ _vm_w_mail_dbh }}"
    port: "{{ lookup('ansible.builtin.env', 'REPORT_DB_PORT') | default('3309', true) | int }}"
    database: "{{ lookup('ansible.builtin.env', 'REPORT_DB_NAME') | default('site_reports', true) | trim }}"
    user: "{{ lookup('ansible.builtin.env', 'REPORT_DB_USER') | trim }}"
    password: "{{ lookup('ansible.builtin.env', 'REPORT_DB_PASSWORD') }}"
    tls: "{{ lookup('ansible.builtin.env', 'REPORT_DB_TLS') | default('false', true) | bool }}"
    ca_file: "{{ lookup('ansible.builtin.env', 'REPORT_DB_CA_FILE') | trim }}"
    mode: write
    template: "{{ (awx_job_template_id | default(tower_job_template_id | default(0))) | int }}"
    job: "{{ (awx_job_id | default(tower_job_id | default(0))) | int }}"
    state: "{{ _vm_w_mail_dbkeep }}"
  vars:
    _vm_w_mail_dbkeep: >-
      {{ _vm_w_mail.state if not _vm_w_mail.send | bool
         or report_email_to | default([]) | length > 0 or report_email_also | default([]) | length > 0 else _vm_w_mail.carry }}
  no_log: "{{ vm_watch_review | bool }}"
  when: _vm_w_mail_dbh | length > 0 and _vm_w_mail_dbkeep is not none and not ansible_check_mode
