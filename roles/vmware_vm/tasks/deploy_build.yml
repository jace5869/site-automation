---
# DEPLOY, the build part (deploy.yml includes it): the request checked against the rules, the
# "Deploying" note, the build, the result on the ticket, the report. Input from deploy.yml: _vd_rec,
# _vd_table, _vd_sn_url, _vd_sn_user, _vd_job, _vd_prop (+ _vd_prop_ok: a GenAI proposal for the
# ticket text as it is now), _vd_plan_only (the workflow's propose step, or a GenAI proposal waiting
# for a person: check everything, find where it would go, write that on the ticket - build nothing).

- name: VMware | the VM the ticket asks for, checked against the rules
  ansible.builtin.set_fact:
    _vd_dry: "{{ ansible_check_mode or _vd_plan_only | default(false) | bool }}"
    _vd_parsed: "{{ _vd_rec | vm_deploy_spec(vm_deploy_defaults, _vd_prop if _vd_prop_ok | bool else none, _vd_words, _vd_parent) }}"
    _vd: >-
      {{ (_vd_rec | vm_deploy_spec(vm_deploy_defaults, _vd_prop if _vd_prop_ok | bool else none, _vd_words, _vd_parent)) | vm_deploy_check(_vd_rec, {
           'templates': vm_deploy_templates, 'clusters': vm_deploy_clusters, 'datastores': vm_deploy_datastores,
           'folders': vm_deploy_folders, 'max_cpu': vm_deploy_max_cpu | int, 'max_memory_gb': vm_deploy_max_memory_gb | float,
           'name_regex': vm_deploy_name_regex, 'assignment_group': _vd_grp.groups, 'assignment_group_setting': _vd_grp.setting,
           'sites': vm_deploy_sites, 'site_words': vm_deploy_plain_sites | default({}, true), 'site_required': vm_deploy_site_required | bool, 'pxe_templates': vm_deploy_pxe_templates,
           'name_rules': vm_deploy_name_rules,
           'template_aliases': vm_deploy_template_aliases, 'template_specs': vm_deploy_template_specs,
           'max_disks': vm_deploy_max_disks | int, 'max_disk_gb': vm_deploy_max_disk_gb | float,
           'max_total_disk_gb': vm_deploy_max_total_disk_gb | float, 'parent': _vd_parent,
           'datastore_rules': vm_deploy_datastore_rules | default([], true), 'datastore_balance': vm_deploy_datastore_balance | bool,
           'ready': vm_deploy_ready_by_table | default({}, true), 'table': _vd_table, 'max_vms': vm_deploy_max_vms | int}) }}
    # the VMs an earlier run built for this ticket (its own notes): left as they are when the job runs again
    _vd_built: "{{ _vd_rec | vm_deploy_built }}"

- name: VMware | one VM, or several (one per name)
  ansible.builtin.set_fact:
    _vd_multi: "{{ _vd.vms | length > 1 }}"

- name: VMware | the request, and where each value came from
  ansible.builtin.debug:
    msg: >-
      {{ ['Ticket ' ~ _vd_rec.number ~ ' (' ~ _vd_table ~ ', ' ~ _vd_rec.state | default('?') ~ ', '
          ~ (_vd_rec.assignment_group | default('', true) or 'no group') ~ '): ' ~ _vd_rec.short_description | default('')]
         + (['Parent: ' ~ _vd_parent.note] if _vd_parent.note | default('') else [])
         + (_vd.spec | vm_deploy_spec_text(_vd.sources))
         + (_vd.problems | map('regex_replace', '^', 'REFUSED: ') | list) }}

- name: VMware | refused - say why on the ticket - the note
  ansible.builtin.set_fact:
    _vd_b_refused: >-
      {%- set items = _vd.problems | map('regex_replace', '^', '- ') | list -%}
      {{ {'comments': (['[AAP] We cannot build this VM yet (' ~ _vd_job ~ '):'] + items
                       + ['Please answer with a comment on this ticket.']) | join(_vd_nl)}
         if vm_deploy_plain_words | bool else
         {'work_notes': (['[AAP] VM not deployed (' ~ _vd_job ~ '):'] + items
                         + ["To fix it: add a comment with the corrected values (e.g. 'memory_gb: 32') and run the job again."]) | join(_vd_nl)} }}
  vars:
    _vd_nl: "\n"
  when: _vd.problems | length > 0 and not ansible_check_mode

- name: VMware | refused - say why on the ticket
  ansible.builtin.uri:
    url: "{{ _vd_sn_url }}/api/now/table/{{ _vd_table }}/{{ _vd_rec.sys_id }}"
    method: PATCH
    url_username: "{{ _vd_sn_user }}"
    url_password: "{{ lookup('ansible.builtin.env', 'SN_PASSWORD') }}"
    force_basic_auth: true
    headers: {Accept: application/json}
    body_format: json
    # with plain words, the questions are for the requester: a comment (requesters see comments, not work notes)
    # one problem per line, under a header line
    body: "{{ _vd_b_refused }}"
    validate_certs: "{{ servicenow_validate_certs | default(true) }}"
    ca_path: "{{ servicenow_ca_path | default(omit, true) }}"
    timeout: "{{ servicenow_timeout | default(30) }}"
  vars:
    _vd_nl: "\n"
  failed_when: false
  when: _vd.problems | length > 0 and not ansible_check_mode

- name: VMware | refused - say why on the ticket - the same on the other tickets (vm_deploy_notes_also)
  ansible.builtin.include_tasks: deploy_note_also.yml
  vars:
    _vd_also_bodies: "{{ [_vd_b_refused] }}"
  when: _vd_also | default([]) | length > 0 and (_vd.problems | length > 0 and not ansible_check_mode)

- name: VMware | the request passes the rules
  ansible.builtin.assert:
    that: _vd.problems | length == 0
    fail_msg: "Not deployed: {{ _vd.problems | join('; ') }}"
    quiet: true

# several VMs: every one checked in vCenter first, read-only (its name, template, cluster, datastore,
# folder, customization) - one refused = none is built. Each is placed again at its build (after the
# ones before it). Run again, it also finds what an earlier run did: VMs built, a VM started.
- name: VMware | every VM checked in vCenter before the first is built
  ansible.builtin.set_fact:
    _vd_pre_res: []
    _vd_ds_planned: {}

- name: VMware | every VM checked in vCenter before the first is built - one by one
  ansible.builtin.include_tasks: deploy_build_one.yml
  vars:
    _vd_pre: true
  loop: "{{ _vd.vms }}"
  loop_control:
    loop_var: _vd_i
    index_var: _vd_n
    label: "{{ _vd_i.spec.vm_name }}"
  when: _vd_multi | bool and not _vd_dry | bool

- name: VMware | what the check in vCenter found
  ansible.builtin.set_fact:
    _vd_pre_bad: "{{ _vd_pre_res | selectattr('failed', 'defined') | selectattr('failed') | list }}"
    _vd_pre_built: "{{ _vd_pre_res | rejectattr('failed', 'true') | selectattr('vm.existing', 'defined') | selectattr('vm.existing')
                       | map(attribute='_vd_i.spec.vm_name') | list }}"
    _vd_pre_resumed: "{{ _vd_pre_res | rejectattr('failed', 'true') | selectattr('vm.resumed', 'defined') | selectattr('vm.resumed')
                         | map(attribute='_vd_i.spec.vm_name') | list }}"

- name: VMware | a VM vCenter refuses - none is built - the note
  ansible.builtin.set_fact:
    _vd_b_prebad:
      work_notes: >-
        {{ (['[AAP] Nothing was built (' ~ _vd_job ~ '): every VM is checked in vCenter before the first is built, and '
             ~ _vd_pre_bad | length ~ ' of ' ~ _vd.vms | length ~ ' cannot be:']
            + (_vd_pre_bad | map(attribute='_vd_i.spec.vm_name') | zip(_vd_pre_bad | map(attribute='msg', default='unknown error'))
               | map('join', ': ') | map('regex_replace', '^', '- ') | list)
            + ['To fix it: fix what it says (or the ticket) and run the job again.']) | join(_vd_nl) }}
  vars:
    _vd_nl: "\n"
  when: _vd_pre_bad | length > 0

- name: VMware | a VM vCenter refuses - none is built - say so on the ticket
  ansible.builtin.uri:
    url: "{{ _vd_sn_url }}/api/now/table/{{ _vd_table }}/{{ _vd_rec.sys_id }}"
    method: PATCH
    url_username: "{{ _vd_sn_user }}"
    url_password: "{{ lookup('ansible.builtin.env', 'SN_PASSWORD') }}"
    force_basic_auth: true
    headers: {Accept: application/json}
    body_format: json
    body: "{{ _vd_b_prebad }}"
    validate_certs: "{{ servicenow_validate_certs | default(true) }}"
    ca_path: "{{ servicenow_ca_path | default(omit, true) }}"
    timeout: "{{ servicenow_timeout | default(30) }}"
  failed_when: false
  when: _vd_pre_bad | length > 0

- name: VMware | a VM vCenter refuses - none is built - the same on the other tickets (vm_deploy_notes_also)
  ansible.builtin.include_tasks: deploy_note_also.yml
  vars:
    _vd_also_bodies: "{{ [_vd_b_prebad] }}"
  when: _vd_also | default([]) | length > 0 and _vd_pre_bad | length > 0

- name: VMware | every VM can be built
  ansible.builtin.assert:
    that: _vd_pre_bad | length == 0
    fail_msg: >-
      Nothing was built: {{ _vd_pre_bad | map(attribute='_vd_i.spec.vm_name') | zip(_vd_pre_bad | map(attribute='msg', default='?'))
      | map('join', ': ') | join('; ') }} (the ticket says so too)
    quiet: true

- name: VMware | the ticket records what is being built, before anything is built - the note
  ansible.builtin.set_fact:
    _vd_b_deploying:
      work_notes: >-
        {%- set left = _vd.names | reject('in', _vd_pre_built + _vd_pre_resumed) | list -%}
        {{ ([('[AAP] Deploying ' ~ _vd.vms | length ~ ' VMs, one after the other (' if _vd_multi | bool else '[AAP] Deploying this VM (')
             ~ _vd_job ~ '):'] + (_vd.spec | vm_deploy_spec_text)
            + ((['Picking up where an earlier run for this ticket stopped:']
                + (_vd_pre_built | map('regex_replace', '$', ': built already - left as it is') | map('regex_replace', '^', '- ') | list)
                + (_vd_pre_resumed | map('regex_replace', '$', ': started, not finished - finished in place') | map('regex_replace', '^', '- ') | list)
                + (left | map('regex_replace', '$', ': to build') | map('regex_replace', '^', '- ') | list))
               if (_vd_pre_built + _vd_pre_resumed) | length > 0 else [])) | join(_vd_nl) }}
  vars:
    _vd_nl: "\n"
  when: not ansible_check_mode and not _vd_plan_only | bool

- name: VMware | the ticket records what is being built, before anything is built
  ansible.builtin.uri:
    url: "{{ _vd_sn_url }}/api/now/table/{{ _vd_table }}/{{ _vd_rec.sys_id }}"
    method: PATCH
    url_username: "{{ _vd_sn_user }}"
    url_password: "{{ lookup('ansible.builtin.env', 'SN_PASSWORD') }}"
    force_basic_auth: true
    headers: {Accept: application/json}
    body_format: json
    body: "{{ _vd_b_deploying }}"
    validate_certs: "{{ servicenow_validate_certs | default(true) }}"
    ca_path: "{{ servicenow_ca_path | default(omit, true) }}"
    timeout: "{{ servicenow_timeout | default(30) }}"
    status_code: [200, 401, 403, 404]
  vars:
    _vd_nl: "\n"
  register: _vd_note1
  when: not ansible_check_mode and not _vd_plan_only | bool

- name: VMware | the ticket records what is being built, before anything is built - the same on the other tickets (vm_deploy_notes_also)
  ansible.builtin.include_tasks: deploy_note_also.yml
  vars:
    _vd_also_bodies: "{{ [_vd_b_deploying] }}"
  when: _vd_also | default([]) | length > 0 and (not ansible_check_mode and not _vd_plan_only | bool)

- name: VMware | the ticket took the note (no VM without a record on its ticket)
  ansible.builtin.assert:
    that: _vd_note1.status == 200
    fail_msg: >-
      Nothing was built: ServiceNow refused the work note (HTTP {{ _vd_note1.status }}) - the ServiceNow API account needs to
      update {{ _vd_table }} tickets. {{ _vd_note1.json.error.message | default('') }}
    quiet: true
  when: not ansible_check_mode and not _vd_plan_only | bool

# one VM per name, one after the other: each placed with the ones before it already there, and its
# result written on the ticket at once (deploy_build_one.yml). A VM that fails does not stop the next;
# the ticket is closed only when every one is built. Run again, the job picks up where it stopped.
- name: VMware | deploy the VMs, one after the other
  ansible.builtin.set_fact:
    _vd_res: []
    _vd_note_status: []
    _vd_ds_planned: {}

- name: VMware | deploy {{ _vd.spec.vm_name }}
  ansible.builtin.include_tasks: deploy_build_one.yml
  vars:
    _vd_pre: false
  loop: "{{ _vd.vms }}"
  loop_control:
    loop_var: _vd_i
    index_var: _vd_n
    label: "{{ _vd_i.spec.vm_name }}"

- name: VMware | each VM's result
  ansible.builtin.set_fact:
    _vd_vm: "{{ _vd_res[0] }}"   # one VM: its result, as before
    _vd_bad: "{{ _vd_res | selectattr('failed', 'defined') | selectattr('failed') | list }}"
    _vd_all_ok: "{{ _vd_res | selectattr('failed', 'defined') | selectattr('failed') | list | length == 0 }}"
    # built, but something did not finish (no IP in time, no customization result ...): the module's issues
    _vd_issues: "{{ _vd_res | map(attribute='issues', default=[]) | flatten }}"

# what closes the ticket when the VM is up: its table's entry in vm_deploy_done_fields_by_table (e.g.
# sc_task - never the change it belongs to), else vm_deploy_done_fields; {} = it stays open. Built with
# issues: vm_deploy_done_fields_issues_by_table's entry over it (e.g. close_code: successful_issues)
- name: VMware | what closes the ticket (vm_deploy_done_fields, vm_deploy_done_fields_by_table)
  ansible.builtin.set_fact:
    _vd_done: >-
      {%- set base = ((vm_deploy_done_fields_by_table | default({}, true))[_vd_table]
                      if _vd_table in (vm_deploy_done_fields_by_table | default({}, true)) else vm_deploy_done_fields) | default({}, true) -%}
      {%- set extra = (vm_deploy_done_fields_issues_by_table | default({}, true))[_vd_table] | default({}, true)
                      if _vd_issues | length > 0 and base | length > 0 else {} -%}
      {{ base | combine(extra)
         if not ansible_check_mode and not _vd_plan_only | bool and _vd_all_ok | bool
            and (vm_deploy_done_fields_pxe | default(true) | bool or not _vd.spec.pxe | default(false) | bool) else {} }}

# several VMs, not all built: what was and what was not, in one note - the ticket stays open
- name: VMware | several VMs, not all built - say so on the ticket - the note
  ansible.builtin.set_fact:
    _vd_b_partial: >-
      {%- set lines = ['[AAP] ' ~ (_vd_res | length - _vd_bad | length) ~ ' of ' ~ _vd_res | length ~ ' VMs built (' ~ _vd_job
                       ~ '); this ticket stays open:'] -%}
      {%- for r in _vd_res -%}
      {%-   set _ = lines.append('- ' ~ r._vd_i.spec.vm_name ~ ((': NOT deployed - ' ~ r.msg | default('unknown error'))
                                                               if r.failed | default(false) else ': built')) -%}
      {%- endfor -%}
      {%- set _ = lines.append('To fix it: fix what the NOT deployed note says and run the job again - it picks up where it stopped: the '
                               ~ 'VMs built are left as they are, a VM started is finished, the others are built.') -%}
      {{ {'work_notes': lines | join(_vd_nl)} }}
  vars:
    _vd_nl: "\n"
  when: _vd_multi | bool and not _vd_all_ok | bool and not ansible_check_mode and not _vd_plan_only | bool

- name: VMware | several VMs, not all built - say so on the ticket
  ansible.builtin.uri:
    url: "{{ _vd_sn_url }}/api/now/table/{{ _vd_table }}/{{ _vd_rec.sys_id }}"
    method: PATCH
    url_username: "{{ _vd_sn_user }}"
    url_password: "{{ lookup('ansible.builtin.env', 'SN_PASSWORD') }}"
    force_basic_auth: true
    headers: {Accept: application/json}
    body_format: json
    body: "{{ _vd_b_partial }}"
    validate_certs: "{{ servicenow_validate_certs | default(true) }}"
    ca_path: "{{ servicenow_ca_path | default(omit, true) }}"
    timeout: "{{ servicenow_timeout | default(30) }}"
    status_code: [200, 400, 401, 403, 404]
  vars:
    _vd_nl: "\n"
  failed_when: false
  when: _vd_multi | bool and not _vd_all_ok | bool and not ansible_check_mode and not _vd_plan_only | bool

- name: VMware | several VMs, not all built - say so on the ticket - the same on the other tickets (vm_deploy_notes_also)
  ansible.builtin.include_tasks: deploy_note_also.yml
  vars:
    _vd_also_bodies: "{{ [_vd_b_partial] }}"
  when: _vd_also | default([]) | length > 0 and (_vd_multi | bool and not _vd_all_ok | bool and not ansible_check_mode and not _vd_plan_only | bool)

- name: VMware | the result notes ServiceNow did not take
  ansible.builtin.set_fact:
    _vd_note_bad: "{{ _vd_note_status | reject('equalto', 200) | list }}"

# on its own, after the note: a close ServiceNow refuses (a mandatory field, a business rule) cannot
# take the note with it. The fields asked come back: HTTP 200 alone is not proof it closed.
- name: VMware | close the ticket
  ansible.builtin.uri:
    url: >-
      {{ _vd_sn_url }}/api/now/table/{{ _vd_table }}/{{ _vd_rec.sys_id }}?sysparm_exclude_reference_link=true&sysparm_fields={{
      _vd_done.keys() | list | join(',') | urlencode }}
    method: PATCH
    url_username: "{{ _vd_sn_user }}"
    url_password: "{{ lookup('ansible.builtin.env', 'SN_PASSWORD') }}"
    force_basic_auth: true
    headers: {Accept: application/json}
    body_format: json
    body: "{{ _vd_done }}"
    validate_certs: "{{ servicenow_validate_certs | default(true) }}"
    ca_path: "{{ servicenow_ca_path | default(omit, true) }}"
    timeout: "{{ servicenow_timeout | default(30) }}"
    status_code: [200, 400, 401, 403, 404]
  register: _vd_close
  when: _vd_done | length > 0

- name: VMware | did it close?
  ansible.builtin.set_fact:
    _vd_closed: "{{ (_vd_close | vm_deploy_close_result(_vd_done)) if _vd_done | length > 0 else {} }}"

- name: VMware | not closed - say so on the ticket - the note
  ansible.builtin.set_fact:
    _vd_b_notclosed:
      work_notes: >-
        {{ ['[AAP] The ' ~ ('VMs are' if _vd_multi | bool else 'VM is') ~ ' built, but this ticket could not be closed (' ~ _vd_job ~ '):',
            '- ' ~ _vd_closed.why,
            'Close it by hand. (What the job sets to close it: vm_deploy_done_fields_by_table on the deploy template.)'] | join(_vd_nl) }}
  vars:
    _vd_nl: "\n"
  when: _vd_closed | length > 0 and not _vd_closed.ok | bool

- name: VMware | not closed - say so on the ticket
  ansible.builtin.uri:
    url: "{{ _vd_sn_url }}/api/now/table/{{ _vd_table }}/{{ _vd_rec.sys_id }}"
    method: PATCH
    url_username: "{{ _vd_sn_user }}"
    url_password: "{{ lookup('ansible.builtin.env', 'SN_PASSWORD') }}"
    force_basic_auth: true
    headers: {Accept: application/json}
    body_format: json
    body: "{{ _vd_b_notclosed }}"
    validate_certs: "{{ servicenow_validate_certs | default(true) }}"
    ca_path: "{{ servicenow_ca_path | default(omit, true) }}"
    timeout: "{{ servicenow_timeout | default(30) }}"
    status_code: [200, 400, 401, 403, 404]
  vars:
    _vd_nl: "\n"
  failed_when: false
  when: _vd_closed | length > 0 and not _vd_closed.ok | bool

- name: VMware | not closed - say so on the ticket - the same on the other tickets (vm_deploy_notes_also)
  ansible.builtin.include_tasks: deploy_note_also.yml
  vars:
    _vd_also_bodies: "{{ [_vd_b_notclosed] }}"
  when: _vd_also | default([]) | length > 0 and (_vd_closed | length > 0 and not _vd_closed.ok | bool)

# launched with a change (e.g. from a web front end): its task gets the notes (vm_deploy_notes_also: tasks)
# and, with vm_deploy_close_tasks, is closed the way a change task is (vm_deploy_done_fields_by_table) -
# never the change itself unless the table's own entry says so
- name: VMware | what closes the change's tasks (vm_deploy_close_tasks)
  ansible.builtin.set_fact:
    _vd_tclose: >-
      {{ _vd_also | default([]) | selectattr('table', 'equalto', 'change_task') | list
         if vm_deploy_close_tasks | default(false) | bool and _vd_table == 'change_request' else [] }}
    _vd_tdone: >-
      {%- set base = (vm_deploy_done_fields_by_table | default({}, true))['change_task'] | default({}, true) -%}
      {%- set extra = (vm_deploy_done_fields_issues_by_table | default({}, true))['change_task'] | default({}, true)
                      if _vd_issues | length > 0 and base | length > 0 else {} -%}
      {{ base | combine(extra)
         if not ansible_check_mode and not _vd_plan_only | bool and _vd_all_ok | bool
            and (vm_deploy_done_fields_pxe | default(true) | bool or not _vd.spec.pxe | default(false) | bool) else {} }}

- name: VMware | close the change's tasks ({{ _vd_tclose | map(attribute='number') | join(', ') }})
  ansible.builtin.uri:
    url: >-
      {{ _vd_sn_url }}/api/now/table/change_task/{{ _vd_t.sys_id }}?sysparm_exclude_reference_link=true&sysparm_fields={{
      _vd_tdone.keys() | list | join(',') | urlencode }}
    method: PATCH
    url_username: "{{ _vd_sn_user }}"
    url_password: "{{ lookup('ansible.builtin.env', 'SN_PASSWORD') }}"
    force_basic_auth: true
    headers: {Accept: application/json}
    body_format: json
    body: "{{ _vd_tdone }}"
    validate_certs: "{{ servicenow_validate_certs | default(true) }}"
    ca_path: "{{ servicenow_ca_path | default(omit, true) }}"
    timeout: "{{ servicenow_timeout | default(30) }}"
    status_code: [200, 400, 401, 403, 404]
  loop: "{{ _vd_tclose }}"
  loop_control:
    loop_var: _vd_t
    label: "{{ _vd_t.number }}"
  register: _vd_tclose_res
  failed_when: false
  when: _vd_tclose | length > 0 and _vd_tdone | length > 0

- name: VMware | did the change's tasks close?
  ansible.builtin.set_fact:
    _vd_tclosed: >-
      {%- set out = [] -%}
      {%- for r in _vd_tclose_res.results | default([]) if r._vd_t is defined and not r.skipped | default(false) -%}
      {%-   set _ = out.append(dict(r | vm_deploy_close_result(_vd_tdone), number=r._vd_t.number, sys_id=r._vd_t.sys_id)) -%}
      {%- endfor -%}
      {{ out }}
    _vd_tlines: >-
      {{ (['WARNING: vm_deploy_close_tasks is on, but vm_deploy_done_fields_by_table has no change_task entry: the tasks of the change are left open']
            if _vd_tclose | length > 0 and not ansible_check_mode and not _vd_plan_only | bool and _vd_all_ok | bool
               and ((vm_deploy_done_fields_by_table | default({}, true))['change_task'] | default({}, true)) | length == 0 else []) }}

- name: VMware | what the report says about the change's tasks
  ansible.builtin.set_fact:
    _vd_tlines: >-
      {{ _vd_tlines
         + (_vd_tclosed | selectattr('ok') | map(attribute='number') | map('regex_replace', '^', 'Task ')
            | map('regex_replace', '$', ' closed: ' ~ (_vd_tdone | dictsort | map('join', ' = ') | join(', '))) | list)
         + (_vd_tclosed | rejectattr('ok') | map(attribute='number') | zip(_vd_tclosed | rejectattr('ok') | map(attribute='why'))
            | map('join', ' was NOT closed: ') | map('regex_replace', '^', 'WARNING: task ') | list) }}

- name: VMware | a task not closed - say so on it
  ansible.builtin.uri:
    url: "{{ _vd_sn_url }}/api/now/table/change_task/{{ _vd_t.sys_id }}"
    method: PATCH
    url_username: "{{ _vd_sn_user }}"
    url_password: "{{ lookup('ansible.builtin.env', 'SN_PASSWORD') }}"
    force_basic_auth: true
    headers: {Accept: application/json}
    body_format: json
    body:
      work_notes: >-
        {{ ['[AAP] The ' ~ ('VMs are' if _vd_multi | bool else 'VM is') ~ ' built (change ' ~ _vd_rec.number ~ '), but this task could not be closed ('
            ~ _vd_job ~ '):', '- ' ~ _vd_t.why,
            'Close it by hand. (What the job sets to close it: vm_deploy_done_fields_by_table, change_task, on the deploy template.)'] | join(_vd_nl) }}
    validate_certs: "{{ servicenow_validate_certs | default(true) }}"
    ca_path: "{{ servicenow_ca_path | default(omit, true) }}"
    timeout: "{{ servicenow_timeout | default(30) }}"
    status_code: [200, 400, 401, 403, 404]
  vars:
    _vd_nl: "\n"
  loop: "{{ _vd_tclosed | rejectattr('ok') | list }}"
  loop_control:
    loop_var: _vd_t
    label: "{{ _vd_t.number }}"
  failed_when: false

- name: VMware | deploy report
  ansible.builtin.include_tasks: report.yml
  when: not _vd_multi | bool
  vars:
    _vd_how: "{{ 'dry run' if ansible_check_mode else 'waiting for the approval' }}"
    _vd_v: "{{ _vd_vm.vm | default({}) }}"
    _vd_ok: "{{ not _vd_vm.failed | default(false) }}"
    _vm_report_subject: >-
      {{ 'VM deploy ' ~ _vd_rec.number ~ ': ' ~ _vd.spec.vm_name ~ ' '
         ~ (('ready to build in ' ~ _vd_v.cluster | default('?') ~ ' - ' ~ _vd_how) if _vd_dry | bool and _vd_ok | bool
            else ('NOT deployable: ' ~ _vd_vm.msg | default('?') | truncate(120)) if _vd_dry | bool
            else (('deployed' ~ ((' - installs its OS, MAC ' ~ _vd_v.mac | default('?')) if _vd.spec.pxe | default(false)
                                 else ((' - ' ~ _vd_v.ip) if _vd_v.ip | default('') else ', no IP yet'))) if _vd_ok | bool else 'NOT deployed')) }}
    _vm_report_lines: >-
      {{ [_vm_report_subject | trim]
         + (['IP address: ' ~ (_vd_v.ip | default('', true) or 'none yet'), 'MAC address: ' ~ _vd_v.mac | default('-'),
             'Customization: ' ~ _vd_v.customization | default('-'),
             'Placed: vCenter ' ~ _vd_v.vcenter | default('?') ~ ', cluster ' ~ _vd_v.cluster | default('?') ~ ', datastore '
             ~ _vd_v.datastore | default('?') ~ ', folder ' ~ _vd_v.folder | default('?')] if _vd_v else [])
         + (_vd.spec | vm_deploy_spec_text(_vd.sources))
         + ([] if _vd_ok | bool else ['ERROR: ' ~ _vd_vm.msg | default('')])
         + (_vd_vm.notes | default([]) | map('regex_replace', '^', 'NOTE: ') | list)
         + (['WARNING: the result could not be written on the ticket (HTTP ' ~ _vd_note_bad | first ~ ')']
            if not ansible_check_mode and _vd_note_bad | length > 0 else [])
         + (['Ticket closed: ' ~ _vd_done | dictsort | map('join', ' = ') | join(', ')] if _vd_closed.ok | default(false) else [])
         + (['WARNING: the ticket was NOT closed: ' ~ _vd_closed.why] if _vd_closed and not _vd_closed.ok | default(true) else [])
         + _vd_tlines | default([]) }}
    _vm_report_doc: >-
      {%- set sp = _vd.sources -%}
      {%- set req = [] -%}
      {%- for line in _vd.spec | vm_deploy_spec_text -%}
      {%-   set k = line.split(':', 1)[0] -%}
      {%-   set _ = req.append([k, line.split(':', 1)[1] | trim, sp[k] | default('')]) -%}
      {%- endfor -%}
      {%- set res = [['VM', _vd_v.name | default(_vd.spec.vm_name)], ['IP address', _vd_v.ip | default('', true) or ('-' if ansible_check_mode else 'none yet')],
                     ['MAC address', _vd_v.mac | default('-', true)], ['Site', _vd.spec.site | default('-')],
                     ['Customization', _vd_v.customization | default('-')], ['vCenter', _vd_v.vcenter | default('')],
                     ['Datacenter', _vd_v.datacenter | default('')], ['Cluster', _vd_v.cluster | default('')], ['Host', _vd_v.host | default('-')],
                     ['Datastore', _vd_v.datastore | default('')], ['Folder', _vd_v.folder | default('')],
                     ['Size', _vd_v.cpu | default('?') ~ ' vCPU, ' ~ _vd_v.memory_gb | default('?') ~ ' GB'],
                     ['Disks (GB)', _vd_v.disks_gb | default([]) | join(', ')], ['Power', _vd_v.power | default('-')]] -%}
      {%- set sections = [{'title': 'Result', 'status': ('info' if _vd_dry | bool and _vd_ok | bool else ('ok' if _vd_ok | bool else 'critical')),
                           'columns': ['', ''], 'rows': res,
                           'text': ('A dry run (Check): nothing was built and nothing was written on the ticket.' if ansible_check_mode
                                    else 'Checked: nothing is built yet. Approve the workflow to build it (where it would go: above).'
                                    if _vd_plan_only | bool and _vd_ok | bool
                                    else ('' if _vd_ok | bool else _vd_vm.msg | default('')))},
                          {'title': 'The request (from ticket ' ~ _vd_rec.number ~ ')', 'columns': ['Setting', 'Value', 'From'], 'rows': req,
                           'text': _vd_rec.short_description | default('')}] -%}
      {%- if _vd_vm.notes | default([]) -%}
      {%-   set _ = sections.append({'title': 'Notes', 'status': 'warning', 'lines': _vd_vm.notes}) -%}
      {%- endif -%}
      {%- if _vd_closed -%}
      {%-   set _ = sections.append({'title': 'The ticket', 'status': 'ok' if _vd_closed.ok else 'warning',
                                     'lines': ['Closed: ' ~ _vd_done | dictsort | map('join', ' = ') | join(', ')] if _vd_closed.ok
                                              else ['NOT closed - close it by hand: ' ~ _vd_closed.why]}) -%}
      {%- endif -%}
      {{ {'title': _vm_report_subject | trim,
          'status': 'info' if _vd_dry | bool and _vd_ok | bool else ('critical' if not _vd_ok | bool
                    else ('warning' if _vd_vm.notes | default([]) or (_vd_closed and not _vd_closed.ok | default(true)) else 'ok')),
          'subtitle': 'Ticket ' ~ _vd_rec.number ~ ' - ' ~ _vd_job,
          'summary': [{'label': 'VM', 'value': _vd.spec.vm_name},
                      {'label': 'IP address', 'value': _vd_v.ip | default('', true) or '-', 'status': 'ok' if _vd_v.ip | default('') else ''},
                      {'label': 'Customization', 'value': (_vd_v.customization | default('-')).split(' ')[0],
                       'status': 'ok' if _vd_v.customization | default('') == 'succeeded' else
                                 ('critical' if (_vd_v.customization | default('')).startswith('FAILED') else '')}],
          'sections': sections} }}

- name: VMware | deploy report - several VMs
  ansible.builtin.include_tasks: report.yml
  when: _vd_multi | bool
  vars:
    _vd_how: "{{ 'dry run' if ansible_check_mode else 'waiting for the approval' }}"
    _vd_nok: "{{ _vd_res | length - _vd_bad | length }}"
    _vm_report_subject: >-
      {{ 'VM deploy ' ~ _vd_rec.number ~ ': ' ~ _vd_res | length ~ ' VMs (' ~ _vd.names | join(', ') ~ ') '
         ~ (('ready to build - ' ~ _vd_how) if _vd_dry | bool and _vd_all_ok | bool
            else ('NOT deployable: ' ~ _vd_bad | length ~ ' of ' ~ _vd_res | length) if _vd_dry | bool
            else 'deployed' if _vd_all_ok | bool else (_vd_nok ~ ' of ' ~ _vd_res | length ~ ' deployed - the ticket stays open')) }}
    _vm_report_lines: >-
      {%- set out = [_vm_report_subject | trim] -%}
      {%- for r in _vd_res -%}
      {%-   set v = r.vm | default({}) -%}
      {%-   set _ = out.append(r._vd_i.spec.vm_name ~ ': '
                               ~ (('NOT deployed - ' ~ r.msg | default('?')) if r.failed | default(false)
                                  else ('ready to build' if _vd_dry | bool else ('already built (left as it is)' if v.existing | default(false) else 'deployed'))
                                       ~ (', IP ' ~ v.ip if v.ip | default('') else (', MAC ' ~ v.mac if v.mac | default('') else ''))
                                       ~ ', cluster ' ~ v.cluster | default('?') ~ ', datastore ' ~ v.datastore | default('?')
                                       ~ ', folder ' ~ v.folder | default('?'))) -%}
      {%-   for n in r.notes | default([]) -%}
      {%-     set _ = out.append('NOTE: ' ~ r._vd_i.spec.vm_name ~ ': ' ~ n) -%}
      {%-   endfor -%}
      {%- endfor -%}
      {{ out + (_vd.spec | vm_deploy_spec_text(_vd.sources))
         + (['WARNING: ' ~ _vd_note_bad | length ~ ' result note(s) could not be written on the ticket (HTTP ' ~ _vd_note_bad | first ~ ')']
            if not ansible_check_mode and _vd_note_bad | length > 0 else [])
         + (['Ticket closed: ' ~ _vd_done | dictsort | map('join', ' = ') | join(', ')] if _vd_closed.ok | default(false) else [])
         + (['WARNING: the ticket was NOT closed: ' ~ _vd_closed.why] if _vd_closed and not _vd_closed.ok | default(true) else [])
         + _vd_tlines | default([]) }}
    _vm_report_doc: >-
      {%- set sp = _vd.sources -%}
      {%- set req = [] -%}
      {%- for line in _vd.spec | vm_deploy_spec_text -%}
      {%-   set k = line.split(':', 1)[0] -%}
      {%-   set _ = req.append([k, line.split(':', 1)[1] | trim, sp[k] | default('')]) -%}
      {%- endfor -%}
      {%- set rows, notes = [], [] -%}
      {%- for r in _vd_res -%}
      {%-   set v = r.vm | default({}) -%}
      {%-   set _ = rows.append([r._vd_i.spec.vm_name,
                                 ('NOT deployed: ' ~ r.msg | default('?')) if r.failed | default(false)
                                 else ('ready to build' if _vd_dry | bool else ('already built' if v.existing | default(false) else 'deployed')),
                                 v.ip | default('', true) or v.mac | default('-', true), v.cluster | default('-', true),
                                 v.datastore | default('-', true), v.folder | default('-', true),
                                 v.cpu | default('?') ~ ' vCPU, ' ~ v.memory_gb | default('?') ~ ' GB, disks ' ~ (v.disks_gb | default([]) | join(' + ') or '?')]) -%}
      {%-   for n in r.notes | default([]) -%}
      {%-     set _ = notes.append(r._vd_i.spec.vm_name ~ ': ' ~ n) -%}
      {%-   endfor -%}
      {%- endfor -%}
      {%- set sections = [{'title': 'Result', 'status': ('info' if _vd_dry | bool and _vd_all_ok | bool else ('ok' if _vd_all_ok | bool else 'critical')),
                           'columns': ['VM', 'Result', 'IP / MAC', 'Cluster', 'Datastore', 'Folder', 'Size'], 'rows': rows,
                           'text': ('A dry run (Check): nothing was built and nothing was written on the ticket. Each VM is placed at the build, '
                                    ~ 'after the ones before it: where they go may differ.' if ansible_check_mode
                                    else 'Checked: nothing is built yet. Approve the workflow to build them (where they would go: above).'
                                    if _vd_plan_only | bool and _vd_all_ok | bool
                                    else ('' if _vd_all_ok | bool else 'Run the job again once fixed: the VMs built are left as they are.'))},
                          {'title': 'The request (from ticket ' ~ _vd_rec.number ~ ')', 'columns': ['Setting', 'Value', 'From'], 'rows': req,
                           'text': _vd_rec.short_description | default('')}] -%}
      {%- if notes -%}
      {%-   set _ = sections.append({'title': 'Notes', 'status': 'warning', 'lines': notes}) -%}
      {%- endif -%}
      {%- if _vd_closed -%}
      {%-   set _ = sections.append({'title': 'The ticket', 'status': 'ok' if _vd_closed.ok else 'warning',
                                     'lines': ['Closed: ' ~ _vd_done | dictsort | map('join', ' = ') | join(', ')] if _vd_closed.ok
                                              else ['NOT closed - close it by hand: ' ~ _vd_closed.why]}) -%}
      {%- endif -%}
      {{ {'title': _vm_report_subject | trim,
          'status': 'info' if _vd_dry | bool and _vd_all_ok | bool else ('critical' if not _vd_all_ok | bool
                    else ('warning' if notes or (_vd_closed and not _vd_closed.ok | default(true)) else 'ok')),
          'subtitle': 'Ticket ' ~ _vd_rec.number ~ ' - ' ~ _vd_job,
          'summary': [{'label': 'VMs', 'value': _vd_res | length},
                      {'label': 'Deployed' if not _vd_dry | bool else 'Ready', 'value': _vd_nok ~ ' of ' ~ _vd_res | length,
                       'status': 'ok' if _vd_all_ok | bool else 'critical'}],
          'sections': sections} }}

- name: VMware | the deployment as job artifacts (vm_deploy)
  ansible.builtin.set_stats:
    data:
      vm_deploy: >-
        {%- set vms = [] -%}
        {%- for r in _vd_res -%}
        {%-   set _ = vms.append({'name': r._vd_i.spec.vm_name, 'spec': r._vd_i.spec, 'vm': r.vm | default({}), 'notes': r.notes | default([]),
                                  'ok': not r.failed | default(false), 'error': r.msg | default('') if r.failed | default(false) else '',
                                  'existing': (r.vm | default({})).existing | default(false)}) -%}
        {%- endfor -%}
        {{ {'ticket': _vd_rec.number, 'table': _vd_table, 'spec': _vd.spec, 'sources': _vd.sources,
            'vm': _vd_vm.vm | default({}), 'notes': _vd_vm.notes | default([]), 'ok': _vd_all_ok | bool,
            'error': _vd_bad | map(attribute='msg', default='') | join('; '), 'dry_run': ansible_check_mode,
            'built': not _vd_dry | bool and _vd_all_ok | bool, 'waiting_for_approval': _vd_plan_only | bool,
            'closed': _vd_closed.ok | default(false), 'close_error': _vd_closed.why | default(''), 'parent': _vd_parent.number | default(''),
            'notes_also': _vd_also | default([]) | map(attribute='number') | list,
            'tasks_closed': _vd_tclosed | default([]) | selectattr('ok') | map(attribute='number') | list,
            'tasks_not_closed': _vd_tclosed | default([]) | rejectattr('ok') | map(attribute='number') | list,
            'issues': _vd_issues, 'vms': vms} }}

- name: VMware | the VM was deployed{{ ' - every one' if _vd_multi | bool else '' }}
  ansible.builtin.assert:
    that: _vd_all_ok | bool
    fail_msg: >-
      {{ (_vd_vm.msg | default('the deployment failed')) if not _vd_multi | bool
         else (_vd_bad | length ~ ' of ' ~ _vd_res | length ~ ' VMs not deployed: '
               ~ _vd_bad | map(attribute='_vd_i.spec.vm_name') | zip(_vd_bad | map(attribute='msg', default='?')) | map('join', ': ') | join('; ')) }}
      (the ticket says so too)
    quiet: true
