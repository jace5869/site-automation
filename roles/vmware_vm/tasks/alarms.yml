---
# ALARMS REPORT (read-only): vCenter's triggered alarms on vCenter, the datacenters, clusters and
# hosts (vm_alarm_types), every host's connection state, and the events of the last vm_alarm_hours
# hours - failed logins (grouped), host connection events, VM shutdowns / power-offs / HA restarts,
# other errors and warnings (grouped) - and configuration issues. Coloured by severity. Printed,
# emailed (report_email_to), and published as artifacts (vm_alarms). Green unless vm_alarm_fail.
- name: VMware | read
  ansible.builtin.include_tasks: alarms_read.yml

- name: VMware | the report
  ansible.builtin.set_fact:
    _vm_al_doc: "{{ _vm_al_read | vm_alarm_report(_vm_al_opts) }}"
    _vm_al_groups: "{{ _vm_al_read | vm_alarm_groups(_vm_al_opts) }}"

- name: VMware | alarms report
  ansible.builtin.include_tasks: report.yml
  vars:
    _vm_vcenters: "{{ _vm_al_read.vcenters }}"
    _vm_report_subject: "{{ _vm_al_doc.title }}"
    _vm_report_lines: "{{ (_vm_al_doc | report_text).splitlines() }}"
    _vm_report_doc: "{{ _vm_al_doc }}"

- name: VMware | the alarms as job artifacts (vm_alarms)
  ansible.builtin.set_stats:
    data:
      vm_alarms: >-
        {{ {'vcenter': _vm_al_read.vcenter, 'vcenters': _vm_al_read.vcenters, 'read_at': _vm_al_read.read_at, 'window_hours': _vm_al_read.window_hours,
            'alarms': _vm_al_read.alarms, 'config_issues': _vm_al_read.config_issues,
            'hosts_not_connected': _vm_al_read.hosts | rejectattr('connection', 'equalto', 'connected') | map(attribute='name') | list,
            'failed_logins': _vm_al_groups.logins, 'host_connection': _vm_al_groups.connection,
            'vm_events': _vm_al_groups.vm, 'other_events': _vm_al_groups.other, 'events_capped': _vm_al_read.events_capped} }}

- name: VMware | no critical alarm, every host connected
  ansible.builtin.assert:
    that:
      - _vm_al_read.alarms | selectattr('severity', 'equalto', 'critical') | list | length == 0
      - _vm_al_read.hosts | rejectattr('connection', 'equalto', 'connected') | list | length == 0
    fail_msg: >-
      {{ _vm_al_read.alarms | selectattr('severity', 'equalto', 'critical') | list | length }} critical alarm(s),
      {{ _vm_al_read.hosts | rejectattr('connection', 'equalto', 'connected') | list | length }} host(s) not connected
      (the report is above). vm_alarm_fail: false makes this a report only.
    quiet: true
  when: vm_alarm_fail | bool

- name: VMware | every vCenter was read
  ansible.builtin.include_tasks: vcenters_read.yml
  vars:
    _vm_vcenters: "{{ _vm_al_read.vcenters }}"
