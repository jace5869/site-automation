---
# Every VM job talks to vCenter (never to the ESXi hosts or the VMs): its address and account come
# from a "VMware vCenter" credential on the job template.
- name: VMware | a vCenter credential is attached
  ansible.builtin.assert:
    that: lookup('ansible.builtin.env', 'VMWARE_HOST') | length > 0
    fail_msg: >-
      No vCenter to talk to: attach a credential of type "VMware vCenter" to this job template
      (Templates > the template > Edit > Credentials; it gives the job VMWARE_HOST, VMWARE_USER and
      VMWARE_PASSWORD). No inventory of ESXi hosts is needed. docs/VMWARE.md
    quiet: true
