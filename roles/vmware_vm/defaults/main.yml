---
# VMWARE VMs: jobs that run against vCenter (not on the VMs), with the certified vmware.vmware
# collection. vCenter address and account come from a "VMware vCenter" credential on the job
# template (VMWARE_HOST, VMWARE_USER, VMWARE_PASSWORD). docs/VMWARE.md

# The VMs, by their exact name in vCenter: a list, or (from a survey) one per line. No wildcards.
vm_names: []
vmware_datacenter: ""                    # only needed when the same VM name exists in two datacenters
# Check vCenter's certificate. false only if the execution environment does not trust your CA yet.
vmware_validate_certs: true
# Several vCenters (e.g. Enhanced Linked Mode), one report: the reports and the ESXi security
# settings read the credential's vCenter AND these (names, or name:port), with the same account.
# The same vCenter under two names is read once. docs/VMWARE.md, "Several vCenters".
vmware_vcenters: []                      # e.g. [vc01.yoursite.mil, vc02.yoursite.mil]
vmware_vcenter_fail_unread: false        # true = the job shows failed when a vCenter could not be read (the report lists it in red either way)

# ---- Restart, shut down, VLAN change: never on these ----

# The AAP server is ALWAYS refused (hosts in the groups aap / aap_hosts, matched by VM name, guest
# host name and IP address), and so are the hosts of these groups and these VM names (* and ?
# allowed: DC*). List the AAP VM's name here when it differs from its host name, and vCenter's own
# VM. The snapshot cleanup never deletes their snapshots either.
vmware_protected_groups: [aap, aap_hosts]
vmware_protected_vms: []                 # e.g. [AAP01, VCSA01, DC*]  (* and ? allowed)

# ---- Restart / shut down ----

# guest = ask the operating system (needs VMware Tools running; services stop cleanly)
# hard  = reset / power off, like the button on a physical server (unsaved data is lost)
vm_power_mode: guest
vm_power_timeout: 600                    # shut down: seconds to wait for the VM to be off

# ---- Snapshots (never with memory) ----

# The snapshot's name. Taking one: empty = aap-<date>-<time>. Deleting: the exact name to delete.
vm_snapshot_name: ""
vm_snapshot_description: ""              # the AAP job number and user are added
vm_snapshot_quiesce: false               # true = VMware Tools freezes the file systems first
vm_snapshot_delete_all: false            # delete: true = every snapshot of the VM (vm_snapshot_name empty)

# ---- Notes (the VM's description in vCenter) ----

# The text to write.
vm_notes: ""
vm_notes_mode: append                    # append (a new line, with date and user) | replace | clear

# ---- VLAN: move a network adapter to another port group ----

# Which adapter: 1 = Network adapter 1, 2, ...
vm_nic: 1
vm_portgroup: ""                         # the port group (standard or distributed) to move it to

# ---- Secure boot report ----

# Only the VMs in this vCenter folder ("" = every VM, or the ones in vm_names).
vm_secure_boot_folder: ""
# The job stays green (successful) when it finds VMs to fix: the report and email say what. true =
# mark the job FAILED when a VM is BIOS or has secure boot off, so a workflow's "on failure" path
# can react (open a ticket).
vm_secure_boot_fail: false

# ---- Datastore report ----

# Used space (% of capacity): a datastore at or above these is listed as a warning / critical.
vm_datastore_warn_pct: 85
vm_datastore_crit_pct: 90                # a datastore this % used or more is red (critical); amber from vm_datastore_warn_pct
# The job stays green when datastores are full: the report and email say which. true = mark the
# job FAILED when one is at or above vm_datastore_warn_pct (or inaccessible), for workflows.
vm_datastore_fail: false

# ---- ESXi network check (playbooks/esxi_network_check.yml) ----

# Read-only: vmkping between the hosts of each cluster on these VMkernel services' adapters (full size, don't fragment),
# the adapters' MTUs, the storage latency. The pings run on the hosts through vCenter (esxcli): the vCenter account needs
# Host > CIM > CIM interaction on them (docs/VMWARE.md, "The ESXi network check").
vm_hostnet_services: [vmotion]           # also vsan, management, vSphereProvisioning, faultToleranceLogging...
vm_hostnet_targets: []                   # pinged from every host, e.g. [{name: NFS array, host: 192.0.2.50, interface: vmk2}]
vm_hostnet_hosts: []                     # only these hosts (names, * and ?); [] = every host
vm_hostnet_clusters: []                  # only these clusters
vm_hostnet_exclude: []                   # never these hosts
vm_hostnet_ping: true                    # false = the adapters and the storage latency only, no pings
vm_hostnet_ping_count: 3                 # pings per pair
vm_hostnet_max_pairs: 400                # pings at most per vCenter (16 hosts in one cluster: 240)
vm_hostnet_workers: 4                    # pings at the same time
vm_hostnet_rtt_warn_ms: 5                # a round trip this slow or slower: warning (vMotion within a site is well under 1 ms)
vm_hostnet_rtt_crit_ms: 150              # ... critical (vMotion's own limit)
vm_hostnet_latency: true                 # read the storage latency (the last hour of the hosts' real-time statistics)
vm_hostnet_latency_minutes: 60            # minutes of the hosts' real-time statistics read (at most 60)
vm_hostnet_latency_warn_ms: 20           # a datastore's average read or write latency from this: warning
vm_hostnet_latency_crit_ms: 50           # ... critical
vm_hostnet_raw: false                    # true = the first ping and the first failed one whole, in the job's output: the host's parameters of the command, what was sent, the request, the answer or the fault (the first run, or a host that refuses a parameter)
vm_hostnet_fail: false                   # true = the job shows failed when the report has a warning or worse (for workflows)

# ---- VM inventory report (playbooks/vm_inventory_report.yml) ----

vm_inventory_templates: false            # true = templates counted and listed as VMs (false: left out, their number in the subtitle)
vm_inventory_by_folder: true             # a table per vCenter and folder; false = one table of every VM (vCenter and folder columns)
vm_inventory_max_rows: 2000              # VMs listed in the email and the page at most (2000: about 2.5 MB of email; the workbook always has every VM)
vm_inventory_xlsx: true                  # attach every VM as an Excel workbook (.xlsx) to the email

# ---- VMware version report (playbooks/vmware_version_report.yml) ----

vm_versions_max_rows: 2000               # ESXi hosts listed in the email and the page at most (the workbook always has every host)
vm_versions_xlsx: true                   # attach every vCenter and ESXi host as an Excel workbook (.xlsx) to the email

# ---- VM right-sizing report (playbooks/vm_rightsizing_report.yml) ----
# vCenter's own statistics only (statistics level 1, vCenter's default, is enough). Suggestions only: nothing is changed.
vm_rightsize_days: 30                    # days of history (at most 30: what vCenter keeps of 2-hour averages)
vm_rightsize_year: true                  # also each VM's busiest day of the last year (daily averages): month-end and yearly peaks
vm_rightsize_min_days: 7                 # fewer days of statistics than this = 'Not enough history' (no suggestion)
vm_rightsize_clusters: []                # only the VMs of these clusters (names; * and ? allowed); [] = every VM
vm_rightsize_vms: []                     # only these VMs (names; * and ? allowed)
vm_rightsize_exclude: []                 # never these VMs (names; * and ? allowed)
vm_rightsize_cpu_target_pct: 70          # vCPUs suggested so that the 95th percentile of CPU use would be about this
vm_rightsize_cpu_high_pct: 85            # CPU at this or more 95% of the time = too small
vm_rightsize_ready_warn_pct: 5           # CPU ready (waiting for a physical CPU, per vCPU) at this or more is said
vm_rightsize_min_vcpus: 2                # never fewer vCPUs than this
vm_rightsize_min_vcpus_windows: 2        # ... for Windows
vm_rightsize_cpu_max_cut_pct: 50         # never suggest more than this % fewer vCPUs at once
vm_rightsize_mem_headroom_pct: 100       # memory suggested = active memory plus this % (active memory understates real need)
vm_rightsize_mem_high_pct: 90            # active memory at this % or more of what the VM has = too small
vm_rightsize_min_mem_gb: 2               # never less memory than this (GB)
vm_rightsize_min_mem_gb_windows: 4       # ... for Windows
vm_rightsize_mem_max_cut_pct: 50         # never suggest more than this % less memory at once
vm_rightsize_min_change_pct: 25          # a smaller memory size is suggested only when it is this % (and 2 GB) smaller or more
vm_rightsize_taken_mb: 100               # memory ballooned or swapped by the host at this many MB or more (its peak) is said
vm_rightsize_disk_warn_pct: 90           # a guest disk this % used or more (VMware Tools' numbers) is listed
vm_rightsize_max_rows: 500               # rows per table in the email and the page (the workbook always has every VM)
vm_rightsize_xlsx: true                  # attach every VM with every number as an Excel workbook (.xlsx) to the email
vm_rightsize_batch: 10                   # VMs per statistics query (vCenter refuses large ones: vpxd.stats.maxQueryMetrics)
vm_rightsize_workers: 4                  # statistics queries at a time
# GenAI (ACT) reviews the suggestions: needs an "ACT model key" credential (docs/VMWARE.md, "ACT analysis")
vm_rightsize_act: false
vm_rightsize_act_max_items: 40           # suggestions ACT reviews: too small first, then too big (the most freed first)
vm_rightsize_act_batch: "{{ site_act_batch | default(5) }}"   # suggestions per question to ACT (0 = all in one)
vm_rightsize_act_model_timeout: "{{ site_act_model_timeout | default(600) }}"   # seconds the model may take for its answer
vm_rightsize_act_check_url: true         # first check that the AAP node can reach the model's URL

# ---- Snapshot report and cleanup ----

# Snapshots at least this many days old: listed apart by the report, deleted by the cleanup.
vm_snapshot_max_age_days: 5
# Never deleted by the cleanup (the report lists them, with the reason):
# - a snapshot whose name or description matches this
vm_snapshot_keep_regex: '(?i)keep|do.?not.?delete'
# - a snapshot of these VMs: names, * and ? allowed (e.g. [DC*, VCSA01, AAP01]). The VMs in
#   vmware_protected_vms and the AAP server are never cleaned up either.
vm_snapshot_cleanup_exclude_vms: []
# - a snapshot of a VM in these vCenter datacenters: names, * and ? allowed, any case (e.g. [DRSITE])
vm_snapshot_cleanup_exclude_datacenters: []
# - a snapshot of a VM running in these clusters: names, * and ? allowed, any case (e.g.
#   [SQL*, MGMT*]). A VM on a host that is in no cluster is not matched.
vm_snapshot_cleanup_exclude_clusters: []
# - with words here, a snapshot whose name contains none of them: only a name with one is deleted
#   (any case; Patch also matches Patching and Patches - and dispatch). E.g. [Patching, Patches, Patch]:
#   only the patching snapshots. [] = any name. Set it in all.yml, so the report lists the same.
vm_snapshot_cleanup_name_words: []
# - a snapshot bigger than this many GB (1024 = 1 TB), or whose size cannot be read: merging a
#   very big snapshot can take hours and slow the VM - do those by hand, at a quiet time.
vm_snapshot_cleanup_max_size_gb: 1024
# The cleanup on its own (not after a workflow approval) deletes only when this is true - e.g. a
# survey question "Delete them?". false = it lists what it would delete, and deletes nothing.
vm_snapshot_cleanup_confirm: false
# Refuse to delete more than this many snapshots in one run (a typo in the age would otherwise
# delete them all). Raise it on purpose for a big cleanup.
vm_snapshot_cleanup_max: 50
vm_snapshot_delete_timeout: 1800         # seconds to wait for one deletion (vCenter merges it into the disk)
# The cleanup's email (report_email_to): true = only when it deleted something (or a deletion failed).
vm_snapshot_cleanup_email_only_if_deleted: false

# ---- Pick lists: what to restart, which snapshots to delete - picked at launch, from a survey ----

# vm_pick_refresh.yml (on a schedule) writes what may be done right now as the choices of one multiple-choice
# question in the survey of these templates: job templates or workflow job templates, by name (or
# {template: name or ID, kind: job or workflow} when a job template and a workflow share the name). In a
# workflow only the workflow's own survey is asked: name the workflow. [] = that list is not refreshed.
# The AAP user of its "Red Hat Ansible Automation Platform" credential needs the Admin role on each.
vm_pick_snapshot_templates: []           # e.g. ["VM - delete picked snapshots (workflow)"]
vm_pick_snapshot_question: vm_snapshot_picks   # the question's Answer variable name
vm_pick_reboot_templates: []             # e.g. ["VM - restart picked VMs (workflow)"]
vm_pick_reboot_question: vm_reboot_picks       # the question's Answer variable name
vm_pick_max_choices: 200                 # a list never has more choices than this (the rest is counted in the job's output)
# The snapshots offered: only those the snapshot cleanup could delete (the same holds - a name that says
# keep, the excluded VMs, datacenters and clusters, the protected VMs and the AAP server, bigger than
# vm_snapshot_cleanup_max_size_gb; not the name words), at least this many days old. 0 = any age.
vm_pick_snapshot_min_age_days: 0
# The VMs offered for a restart: powered on, never the AAP server or a protected VM (vmware_protected_*),
# among these (names, * and ?, any case; [] = every VM) ...
vm_pick_reboot_vms: []
vm_pick_reboot_clusters: []              # e.g. [PROD-*]
vm_pick_reboot_folders: []               # folder paths as vCenter shows them, e.g. ["/DC1/vm/Linux*"]
vm_pick_reboot_exclude_vms: []           # ... and never these (e.g. [SQL*, DC*])
# true = only the VMs that look hung: VMware Tools installed, but no heartbeat (red) or Tools not running,
# powered on for vm_pick_hung_min_minutes at least (a VM still starting has neither yet). Restart those with
# vm_power_mode: hard - a guest restart needs VMware Tools running.
vm_pick_reboot_only_hung: false
vm_pick_hung_min_minutes: 15             # minutes powered on before a VM without a heartbeat counts as hung
vm_pick_aap_ca_path: ""                  # a CA file for AAP's own HTTPS certificate ("" = what the execution environment trusts)
# The survey's answers (the picked choices: a list, or text one per line).
vm_snapshot_picks: []                    # the snapshots to delete
vm_reboot_picks: []                      # the VMs to restart
# vm_snapshot_delete_picked.yml / vm_reboot_picked.yml on their own (not a workflow): true = do it now.
# false = list exactly what would be done (the plan), and do nothing. Inside a workflow it is never used:
# the first step plans, the step after the approval does exactly the plan.
vm_pick_confirm: false
vm_pick_max: 20                          # refuse to restart, or delete, more than this many in one run

# ---- Alarms report and its ACT analysis ----

# Whose triggered alarms and configuration issues: vcenter, datacenter, cluster, host. Add vm,
# datastore or network for theirs too (VM alarms can be many).
vm_alarm_types: [vcenter, datacenter, cluster, host]
# The events of the last this-many hours: every error and warning, failed logins, host connection
# events and VM shutdowns / power-offs / resets / HA restarts. 0 = alarms and host state only.
vm_alarm_hours: 24
vm_alarm_max_events: 5000                # read at most this many events (the newest)
vm_alarm_max_alarm_changes: 2000         # read at most this many alarm status changes (the newest; 0 = no "Alarms that fired")
vm_alarm_max_rows: 200                   # rows per table in the report (the artifacts have them all)
# This many failed logins of one user from one place, or more, is critical (fewer: a warning).
vm_alarm_login_critical: 10
# The event types read whatever their category (vCenter's event type names). Add to these lists
# rather than replacing them; [] = none of that kind.
vm_alarm_login_event_types: [BadUsernameSessionEvent, com.vmware.sso.LoginFailure, esx.audit.account.locked,
                             esx.audit.account.loginfailures]
# Events about a host losing (or failing to get back) its connection to vCenter: the Host connection table.
vm_alarm_connection_event_types: [HostConnectionLostEvent, HostNotRespondingEvent, HostDisconnectedEvent,
                                  HostReconnectionFailedEvent, HostShutdownEvent, HostCnxFailedEvent,
                                  HostCnxFailedAccountFailedEvent, HostCnxFailedNetworkErrorEvent,
                                  HostCnxFailedNoConnectionEvent, HostCnxFailedTimeoutEvent,
                                  HostCnxFailedBadUsernameEvent, HostCnxFailedNoAccessEvent]
# Events about a VM stopping, restarting or failing over (guest shutdown, power off, HA restart): the VM events table.
vm_alarm_vm_event_types: [VmGuestShutdownEvent, VmGuestRebootEvent, VmPoweredOffEvent, VmResettingEvent,
                          VmFailoverFailed, VmDasBeingResetEvent, VmDasBeingResetWithScreenshotEvent,
                          VmRestartedOnAlternateHostEvent, com.vmware.vc.ha.VmRestartedByHAEvent,
                          VmFailedToPowerOnEvent, VmDisconnectedEvent]
# The job stays green when it finds alarms: the report and email say what. true = mark the job
# FAILED when there is a critical alarm or a host is not connected, for workflows.
vm_alarm_fail: false

# ACT analysis (playbooks/vm_alarm_act_analysis.yml). ACT runs on the AAP side (the execution
# environment), never on the ESXi hosts; the model provider, model, URL, proxy and CA are the
# site_act_* settings (roles/site_act/defaults/main.yml), the key an "ACT model key" credential.

vm_alarm_act_max_items: 40               # analyze at most this many problems, the most severe first
vm_alarm_act_batch: "{{ site_act_batch | default(5) }}"   # problems per question to ACT: a long answer about many problems is what a gateway or proxy cuts off (0 = all in one question)
vm_alarm_act_config_issues: true         # configuration issues too (false = alarms and events only)
vm_alarm_act_email_if_none: false        # true = email even when there is nothing to analyze
vm_alarm_act_check_url: true             # first check that the AAP node can reach the model's URL
# Seconds the model may take for its answer (ACT's GENAI_TIMEOUT, 90 by default, is too short for
# a long analysis): site_act_model_timeout (600) unless set here. A GENAI_TIMEOUT in site_act_env wins.
vm_alarm_act_model_timeout: "{{ site_act_model_timeout | default(600) }}"

# ---- Health report (playbooks/vm_health_report.yml): every datacenter, cluster and host ----

# A cluster of 2 or more hosts without vSphere HA is a warning (false = HA off is on purpose).
vm_health_require_ha: true
# A cluster of 2 or more hosts without DRS is a warning (false where DRS is off on purpose or not
# licensed, e.g. vSphere Standard).
vm_health_require_drs: true
# CPU and memory used, in percent of a host (or of a cluster's hosts running VMs):
vm_health_cpu_warn_pct: 85               # CPU used: a warning from this percent
vm_health_cpu_crit_pct: 95               # CPU used: critical from this percent
vm_health_mem_warn_pct: 90               # memory used: a warning from this percent
vm_health_mem_crit_pct: 95               # memory used: critical from this percent
vm_health_sensors: true                  # read the hosts' hardware sensors (false = skip them)
# Each connected host's clock against vCenter's, and its NTP setting: a host writes its own logs (hostd, vmkernel)
# by its clock, vCenter its events by its own - off clocks are why a disconnection's time in a host's log does not
# match vCenter's. No NTP server set, or the NTP service stopped, is a warning. vCenter's clock against the AAP job's too.
vm_health_clock: true                    # read them (false = skip: one call per host)
vm_health_clock_warn_seconds: 60         # a host's clock this many seconds off vCenter's (ahead or behind) -> warning
vm_health_clock_crit_seconds: 300        # -> critical (Active Directory logins fail from 5 minutes off)
vm_health_max_rows: 500                  # rows per table in the report (the artifacts have them all)
# The job stays green when it finds problems: the report and email say what. true = mark the job
# FAILED when there is a critical problem (a host not connected, an HA agent isolated ...), for workflows.
vm_health_fail: false
# Network drops and errors in the health report: packets dropped and network errors of every ESXi host (by physical NIC)
# and powered-on VM (by virtual NIC), from vCenter's statistics. The past day needs vCenter's 5-minute statistics at
# level 2 (the default is 1); at level 1 the last hour is read, and the report says so. docs/VMWARE.md
vm_net_drops: true                       # read them (false = the report has no network section)
vm_net_drops_vms: true                   # the powered-on VMs too (false = the hosts only: quicker where there are thousands of VMs)
vm_net_drops_hours: 24                   # hours to read when vCenter keeps the past day (at most 24: what the 5-minute interval keeps)
vm_net_drops_warn_per_hour: 100          # dropped packets an hour (received + sent) of one host or VM from this many -> warning
vm_net_errors_warn_per_hour: 10          # network errors an hour (received + sent) of one host or VM from this many -> warning

# ---- VM outage watch (playbooks/vm_outage_watch.yml), every 5 to 15 minutes ----
# Quiet when nothing is down: one line, no email. Watch only (phase 1): it restarts nothing; it lists the
# hung VMs a later phase would restart, so false alarms can be counted first. docs/VM_OUTAGE_WATCH.md

# The HA and storage events of the last this many minutes (set it to the schedule's interval).
vm_watch_window_minutes: 15
# A VM powered on for less than this is not judged (a VM still starting has no heartbeat yet).
vm_watch_min_up_minutes: 15
# A VM is hung only when it has no guest heartbeat AND does not answer on the network, in every check:
# a suspect is checked this many times in one run (1 = once), vm_watch_confirm_seconds apart.
vm_watch_confirm_checks: 2
vm_watch_confirm_seconds: 120            # seconds between those checks
# The network probe, from the AAP node, of the suspects only: ping, and a TCP connect to this port too
# (e.g. 22 or 3389; 0 = ping only). A refused connection counts as an answer (the guest is alive).
vm_watch_probe: true                     # false = no probe: no VM is then called hung (one signal only)
vm_watch_probe_port: 0                   # TCP port also tried (0 = ping only)
vm_watch_probe_timeout: 3                # seconds per address
vm_watch_max_suspects: 50                # probe and confirm at most this many suspects in one run
# A VM with no heartbeat that answers on the network (or cannot be probed): VMware Tools died, not
# the guest. warning = in the tickets (servicenow_min_severity warning); info = the job's output only.
vm_watch_one_signal_severity: warning
vm_watch_skip_vms: []                    # VMs never judged: names, * and ? allowed (e.g. [LAB-*])
vm_watch_skip_folders: []                # VM folders never judged, as vCenter shows them (e.g. ["/DC1/vm/Lab*"])
# Phase 2 (not built yet) would restart the hung VMs - never these (names, * and ?), never the AAP
# server or the VMs of vmware_protected_vms / vmware_protected_groups: their hung state is a ticket only.
vm_watch_protect: []                     # e.g. [DC*, SQL*, VCSA*]
vm_watch_max_actions: 5                  # more hung VMs at once than this = something bigger: none would be restarted past it
# The job shows FAILED (a workflow's "On failure" path) when it finds a condition of these severities.
vm_watch_fail_on: [critical]
# The report is emailed (report_email_to) and published (report_web_dest) only when it finds a condition
# of these severities; a clean run is one line in the job output.
vm_watch_report_on: [critical]
vm_watch_sso: true                       # the watch also asks: is single sign-on down now (vm_sso_*, below)? false = not asked

# ---- Single sign-on and OCSP (vCenter 8.0): the health report (playbooks/vm_health_report.yml) and the watch ----
# vCenter's SSO services, the STS signing certificate (health report only), the identity providers, a login by a test
# domain account (the "vCenter SSO test account" credential), and the OCSP responders smart card logins depend on.
vm_sso: true                             # read single sign-on in the health report (and in the watch, with vm_watch_sso); false = never
vm_sso_services: [sts, lookupsvc, trustmanagement, vmdird, vmafdd]  # SSO services that must be started (as vCenter's and the appliance's service lists name them; one not listed is skipped)
vm_sso_sts_warn_days: 60                 # the STS signing certificate expires within this many days -> warning
vm_sso_sts_crit_days: 14                 # ... within this many -> critical (expired: critical)
vm_sso_test_user: ""                     # the test domain account; empty = the "vCenter SSO test account" credential's (VMWARE_SSO_TEST_USER); none = no login test
# The OCSP responders. Simplest: site_ocsp_certs (below) - a certificate the responder knows, its OCSP address and its
# issuer read from the certificate itself. vm_sso_ocsp, when set, is used instead: [{url: http://ocsp.example.mil}] asks
# only that it answers; with cert (a PEM file from playbooks/, e.g. files/ocsp/test-user.pem - not a secret) a real OCSP
# request: the answer must be successful, the certificate good and the answer not stale. A url or issuer left out is read
# from the certificate (its Authority Information Access: the OCSP address, and the issuer's download address).
vm_sso_ocsp: []                          # e.g. [{cert: files/ocsp/test-user.pem}] or [{url: "http://ocsp.example.mil", cert: files/ocsp/test-user.pem, issuer: files/ocsp/issuing-ca.pem}]
site_ocsp_certs: []                      # certificates the OCSP responders know (PEM files from playbooks/), for vm_sso_ocsp and net_perf_ocsp when those are empty, e.g. [files/ocsp/test-user.pem]
vm_sso_ocsp_severity: critical           # an OCSP responder that fails: critical (smart card logins fail) or warning
# The CRL of each certificate above (its CRL Distribution Point, or crl_url in a vm_sso_ocsp entry; crl: false skips one),
# in the health report only - from the AAP node: downloaded, issued and signed by the CA, not past its next update, not
# listing the test certificate. vCenter falls back to the CRL when OCSP does not answer, or uses it alone when set so.
vm_sso_crl: true                         # false = no CRL check
vm_sso_crl_severity: warning             # a CRL that fails: warning (OCSP still answers smart card logins) or critical
vm_sso_crl_timeout: 120                  # seconds for one CRL download (DoD CRLs are tens of MB)
vm_sso_crl_max_mb: 200                   # a CRL larger than this is not read
vm_sso_timeout: 30                       # seconds per request

# ---- VMs created report (playbooks/vm_created_report.yml), e.g. every Friday at noon ----

# The window: the VMs created in the last this many days, up to the moment the job runs (7 = the
# past week; run weekly, each VM is in exactly one report). VMs created and deleted since are listed
# too, as long as vCenter keeps their events (often 30 days).
vm_created_days: 7

# ---- ESXi security settings (playbooks/esxi_security.yml), e.g. every night ----

# Which hosts: names (* and ? allowed; the short name matches too). [] = every host of vCenter
# (or of vmware_datacenter).
esxi_security_hosts: []
esxi_security_clusters: []               # only the hosts of these clusters (names, wildcards); [] = all
# Never these hosts (names, wildcards). E.g. a host you opened SSH on for a support case: the
# nightly run would otherwise close it again.
esxi_security_exclude_hosts: []
# The SSH service (TSM-SSH): disabled = stopped, and set to start manually; enabled = started, and
# set to start with the host; "" = leave it as it is.
esxi_security_ssh: disabled
# The ESXi Shell service (TSM), the host's local shell: the same choices.
esxi_security_shell: disabled
# Advanced settings, name: value; {} = none. The defaults (seconds):
#   UserVars.ESXiShellTimeOut             SSH and the ESXi Shell stop by themselves this long after
#                                         someone starts them (0 = never)
#   UserVars.ESXiShellInteractiveTimeOut  an idle SSH or ESXi Shell session is logged out
# Others often set: UserVars.DcuiTimeOut (an idle DCUI session), UserVars.HostClientSessionTimeout
# (an idle Host Client session).
esxi_security_settings:
  UserVars.ESXiShellTimeOut: 600
  UserVars.ESXiShellInteractiveTimeOut: 600
# Lockdown mode: normal = the host is managed only through vCenter (the DCUI still works);
# disabled; "" = leave it as it is. strict is refused, and a host already strict is left alone.
esxi_security_lockdown: normal
# Accounts that must keep logging in to the hosts directly under lockdown (a vulnerability scanner,
# a monitoring tool): host-local accounts, or Active Directory accounts with their own permission on
# the host (not vsphere.local, not an AD group). Added before lockdown is turned on; never removed.
esxi_security_lockdown_exception_users: []
# The email (report_email_to): true = only when a host was changed or failed; false = every run.
esxi_security_email_only_if_changed: true

# ---- VMware certificate renewal (playbooks/vmware_cert_renew.yml), e.g. every week ----

# A certificate of vCenter (its Machine SSL certificate, the one its web pages show) or of an ESXi host
# that expires within this many days (or has expired) is due: a ServiceNow incident, and a CSR made
# where its key stays - vCenter, or the host - attached to the incident with what to do next.
# To try the job on certificates that are years from expiring, raise it for one run (e.g. 3650: every
# certificate is due) with vmware_cert_only naming one host, and vmware_cert_make_csr: false first.
# Each incident says the number used. Afterwards, a run with the real number notes those incidents
# as cleared (with servicenow_resolve_cleared: true, resolves them).
vmware_cert_warn_days: 30
vmware_cert_crit_days: 7                 # within this many days (or expired) the incident is critical, else warning
vmware_cert_esxi: true                   # the ESXi hosts' certificates too; false = vCenter's only
# Only these vCenters and hosts: names, any case, * and ? allowed, the short name matches too - e.g. one
# host to try the job on. [] = every vCenter of the job and every host connected to it.
vmware_cert_only: []
# false = the incidents only, no CSR. A CSR is made once per certificate: the incident is its record,
# and a second CSR would replace the key that waits on vCenter or the host for the issued certificate.
vmware_cert_make_csr: true
# A certificate signed by vCenter's own CA (VMCA - how vCenter gives ESXi hosts their certificates unless
# told otherwise) is renewed in vCenter (its Renew button): its incident says so, and no CSR is made.
# true = a CSR for those too, to replace them with certificates of your PKI.
vmware_cert_vmca_csr: false
# Issuers taken as VMCA besides VMCA's own root (CN=CA with DC=..., or OU=VMware Engineering): any case,
# * and ? allowed, e.g. ['*O=vc01.yoursite.mil*'].
vmware_cert_vmca_issuers: []
# vCenter's CSR: its subject and names are the current certificate's. vCenter's API wants an
# organization, organization unit, locality, state and country - one the certificate does not have
# goes empty. Set any of them here (the PKI sets the subject by its own rules anyway), e.g.
#   vmware_cert_csr_fields: {organization: U.S. Government, organization_unit: DoD, country: US, key_size: 3072}
# (key_size: vCenter's default is 3072 bits). An ESXi host makes its CSR with its own name.
vmware_cert_csr_fields: {}
# Without the ServiceNow API credential no CSR is made (nothing would record it: the next run would make
# another one). true = make them anyway, and print them in the job output.
vmware_cert_csr_without_servicenow: false

# ---- VMware trust store report (playbooks/vmware_trust_report.yml) ----
# vCenter's trusted roots and each ESXi host's trusted CAs; false = vCenter only (the ESXi hosts left out)
vmware_trust_esxi: true

# ---- vSphere capacity planning (playbooks/vm_capacity_report.yml) ----

vm_capacity_clusters: []                 # only these clusters (names; * and ? allowed); [] = every cluster
# The history: vCenter's own daily statistics (cluster CPU and memory, datastore space), kept a year
# at statistics level 1. Read this many days; the growth is a straight line over the last
# vm_capacity_trend_days, with at least vm_capacity_min_samples daily values.
vm_capacity_history_days: 120
# The growth (straight line) is fitted on this many most recent days. Growth comes in jumps (VMs are
# deployed in batches): over 30 days one build-out becomes the rate and the runway reads days when
# it is months; 90 days averages the batches out. 30 reacts faster to a real change of rate.
vm_capacity_trend_days: 90
vm_capacity_min_samples: 7               # fewer daily values than this in those days = 'not enough history' (no trend)
vm_capacity_events_days: 30              # VMs added and removed (vCenter keeps events 30 days by default)
# Plan for this many failed hosts per cluster (N+1); a larger HA admission control failover level wins.
vm_capacity_failover_hosts: 1
vm_capacity_mem_target_pct: 80           # memory used at most this %, with those hosts failed
vm_capacity_cpu_target_pct: 80           # CPU used at most this %, with those hosts failed
vm_capacity_vcpu_per_core_max: 4         # vCPUs per physical core (amber from here, red from 1.5 times it)
# Hosts recommended per cluster (of its average host size) to keep memory and CPU at their targets
# with those hosts failed: now, and at the current growth within this many months.
vm_capacity_horizon_months: 12
vm_capacity_storage_warn_pct: 85         # datastore used %: amber
vm_capacity_storage_crit_pct: 90         # red, and the target of the storage runway
vm_capacity_runway_warn_days: 90         # a runway shorter than this is amber
vm_capacity_runway_crit_days: 30         # and red
vm_capacity_include_local_datastores: false   # a host's own (not shared) datastores count too
vm_capacity_max_rows: 100                # rows per table (problems first); the artifacts have all
# The job stays green: the report says what is short. true = mark it FAILED when a cluster or
# datastore is critical (for workflows).
vm_capacity_fail: false
# GenAI: ACT reads the numbers and makes its own estimate, shown next to the job's (math vs GenAI).
# Needs an "ACT model key" credential on the template; the same site_act_* settings as the alarms
# analysis. ACT runs on the AAP side and runs no command.
vm_capacity_act: false
vm_capacity_act_max_items: 30            # items ACT estimates: everything overall, then clusters and datastores, problems first
vm_capacity_act_batch: "{{ site_act_batch | default(5) }}"   # items per question to ACT (each question has the whole evidence; 0 = all in one)
vm_capacity_act_model_timeout: "{{ site_act_model_timeout | default(600) }}"   # seconds the model may take for its answer
vm_capacity_act_check_url: true          # first check that the AAP node can reach the model's URL

# ---- Deploy a VM from a ServiceNow ticket (playbooks/vm_deploy_from_ticket.yml) ----
# The ticket (survey answer): INC..., TASK..., SCTASK..., RITM..., CHG... - or your instance's own
# prefixes (INCN..., CHGN...): the job asks ServiceNow which table a ticket is in. The ticket says what to build in
# 'key: value' lines - in its description, or in a comment / work note (a newer one overrides):
#   vm_name: app01   template: rhel9-gold   cpu: 4   memory_gb: 16   (cluster, datastore, folder,
#   datacenter, vcenter, domain, customization_spec, notes: optional). docs/VM_DEPLOY_GUIDE.md
vm_deploy_ticket: ""
vm_deploy_ticket_table: ""               # leave it empty (the job finds each ticket's table); a table of your own, e.g. u_vm_request: for numbers whose prefix the job does not know (CTASK stays change_task)
# Your instance's own number prefixes and their tables, e.g. {INCN: incident, CHGN: change_request}.
# Rarely needed: for a prefix it does not know, the job asks ServiceNow's task table (and takes INCN
# as INC, CHGN as CHG when it may not read that table). A table as people say it is understood:
# change / change request -> change_request, change task -> change_task, catalog task -> sc_task.
vm_deploy_ticket_prefixes: {}
# The request may also be on the ticket's parent - e.g. a task (SCTASK, CTASK) whose change holds the
# requirements: the parent's 'key: value' lines (and, with vm_deploy_plain_words, its plain words) are read
# too, under the ticket's own (what the ticket says wins). A parent that cannot be read, is closed, or is
# not ready (vm_deploy_ready_by_table) stops the build. Only a parent in one of these tables is read
# ([] = never read a parent):
vm_deploy_parent_tables: [change_request]
# The ticket's fields that point to its parent - the first one set is used: a change task's
# change_request, any ticket's parent (or your instance's own field, e.g. u_change):
vm_deploy_parent_fields: [change_request, parent]
# The parent's fields with the request, in this order (a later one wins), e.g. [description,
# implementation_plan]; comments and work_notes may be listed too (oldest first). GenAI reads them as well.
vm_deploy_parent_text_fields: [description]
# What wins, from the least to the most: the parent (the change), the ticket's short description and
# description, its work notes, its comments (each oldest first) - a 'key: value' line and plain words
# alike: the later one wins, however each is written. So the change task wins over its change, and a
# comment wins over a work note. true = the parent's text wins over the ticket's short description and
# description instead (a change task that repeats the request, maybe wrongly); its work notes and
# comments still win over the parent.
vm_deploy_parent_wins: false
# Every note and comment this job writes on the ticket goes on these too (closing never does: only the
# ticket itself is closed): parent = the change a task belongs to (when it was read); tasks = when the
# job is launched with a change, its open change tasks assigned to vm_deploy_assignment_group (and
# matching vm_deploy_notes_tasks_query). e.g. [parent, tasks]: the change and its task both get them,
# whichever the job is launched with. A note ServiceNow refuses there is a warning, not a failure.
vm_deploy_notes_also: []
# An extra ServiceNow query for the change's tasks that get the notes, e.g. "short_descriptionLIKEto deploy" ("" = the group's)
vm_deploy_notes_tasks_query: ""
vm_deploy_notes_tasks_limit: 50          # the change's tasks that get the notes (and are closed), at most - more is a warning
# Launched with a change: also close its tasks found that way (with vm_deploy_done_fields_by_table's
# change_task entry, when every VM is built) - the change itself is not closed by this. They get the notes too.
vm_deploy_close_tasks: false
# Before anything is built, a ticket of these tables - the ticket itself, or the parent it belongs to (a
# change task's change) - must have these fields: one value or a list (any of them), written as the
# ticket's form shows them (upper / lower case ignored). Checked by the dry run, the propose step AND
# right before the build: a change sent back while the approval waited is not built. Your instance's
# labels, e.g. {change_request: {approval: Approved, state: [Implement, Scheduled]}}; {} = no check.
vm_deploy_ready_by_table:
  change_request: {approval: Approved, state: Implement}
# What a ticket may ask for (names; * and ? allowed). Templates MUST be listed: nothing else is
# deployed. The others: [] = any.
vm_deploy_templates: []                  # e.g. [rhel9-gold, win2022-gold]
vm_deploy_clusters: []                   # clusters (and standalone hosts) a ticket may use; also the candidates of automatic placement
vm_deploy_datastores: []                 # datastores (or datastore clusters) a ticket may use; also the candidates of automatic placement
vm_deploy_folders: []                    # VM folders a ticket may use (paths below the datacenter's VM folder, e.g. Linux/*)
vm_deploy_max_cpu: 16                    # the most vCPUs a ticket may ask for
vm_deploy_max_memory_gb: 128             # the most memory a ticket may ask for, in GB
# A ticket may ask for several VMs ("2 VMs named web01 and web02", "vm_name: web01, web02", or
# "Hostnames:" and one name per line): one VM each, the same size - or each its own, from a line of its own
# - built one after the other, the ticket closed when all are built. More names than this: refused, nothing
# built (the limits above are per VM).
vm_deploy_max_vms: 10
# The VM names allowed (a regular expression); e.g. '^[a-z0-9-]{1,15}$' for Windows-safe names.
vm_deploy_name_regex: '^[A-Za-z0-9][A-Za-z0-9-]{0,62}$'
# Only tickets assigned to this group (its name as ServiceNow shows it), or to one of a list of
# groups (["Group A", "Group B"]); "" = any group (the pickup needs one).
vm_deploy_assignment_group: ""
# The same for the ticket the job is launched with, by its table - in place of vm_deploy_assignment_group
# for that table; "" = any group. e.g. {change_request: ""}: launched with a change, the change may be
# assigned to any group (it must still be approved: vm_deploy_ready_by_table); its tasks that get the
# notes (vm_deploy_notes_also, vm_deploy_close_tasks) are still those of vm_deploy_assignment_group.
vm_deploy_assignment_group_by_table: {}
# What a ticket does not say: e.g. {cluster: PROD-CL01, datastore: DS-CLUSTER-01, folder: Linux/New}.
# Not set = the template's own cluster, datastore and folder; its CPU and memory.
vm_deploy_defaults: {}
# Sites: a ticket's 'site: A' line (or its Location field, or with plain words a site's name or its words
# in vm_deploy_plain_sites - each VM by its own line) picks the placement - over vm_deploy_defaults and the
# name rules; a cluster / datastore / folder the ticket names itself still wins. A site in another vCenter:
# its vcenter (in vmware_vcenters, the same account) - and the template there under the same name.
#   vm_deploy_sites:
#     SiteA: {cluster: A-PROD-CL01, datastore: A-DSC01, folder: Servers/New}
#     SiteB: {cluster: B-PROD-CL01, datastore: B-DSC01, folder: Servers/New, vcenter: vc02.yoursite.mil}
vm_deploy_sites: {}
vm_deploy_site_required: true            # with sites set up: a ticket must say its site (false = vm_deploy_defaults); a name rule counts too
# Name rules: the VM's name picks where it goes - the first rule whose 'match' fits the name (* and ?,
# upper / lower case alike) fills in what the ticket does not say: a cluster (and datastores,
# folder ...) or a site. The ticket's own lines, and a site the ticket names, still win. A name used at
# several sites: 'sites' - the ticket must say which (its Location), never a guess; its placement is in
# vm_deploy_sites. A rule's placement is never used for a VM its site puts in another vCenter.
#   vm_deploy_name_rules:
#     - {match: "*AB01*", cluster: CLUSTER-ONE}                   # every name with AB01 in it
#     - {match: "*CD02*", cluster: CLUSTER-TWO, folder: Servers/New}
#     - {match: "*EF03*", site: SiteB}                            # or a site from vm_deploy_sites
#     - {match: "*GH04*", sites: [SiteA, SiteB]}                  # at either site: the ticket says which
vm_deploy_name_rules: []                 # [{match: "*AB01*", cluster: ...}, ...] - see above
# Templates with no operating system yet, that install it themselves: they boot from the network (PXE,
# e.g. an MECM task sequence) or from their CD / ISO (e.g. a kickstart). No guest customization, no
# waiting for an IP address; the MAC address and the computer name go on the ticket. e.g. [win2022-pxe]
vm_deploy_pxe_templates: []
# Give a VM from one of those empty templates the ticket's name and number as VM settings its installer
# can read: guestinfo.hostname and guestinfo.ticket (a kickstart with VMware Tools in the installer:
# vmtoolsd --cmd "info-get guestinfo.hostname"). Needs the vCenter privilege Change configuration >
# Advanced configuration; without it the VM is still built (a note says so). false = none.
vm_deploy_guestinfo: true
# Short names for long template names - for the ticket's 'template:' line and GenAI's catalog (whose
# keys may be these short names): {short name: the template's name in vCenter}, e.g.
#   {win2022: "Windows 2022 Standard Template - Site 1", rhel9: "RHEL 9 Server Template"}
# A ticket may also write a template's own name in other case or spacing: it is matched to the
# spelling in vm_deploy_templates.
vm_deploy_template_aliases: {}
# The customization specification (vCenter > Policies and Profiles) for each template, when the
# ticket, its site and the name rules name none: {template name or pattern: spec}. A Windows template
# that is not network-boot needs one (Sysprep: administrator password, domain or workgroup), e.g.
#   {"Windows 2022*": Win2022-Sysprep-Domain}. Linux templates need none (the job's own DHCP one).
vm_deploy_template_specs: {}
vm_deploy_max_disks: 5                   # disks a ticket may ask for, disk 1 included (disks_gb: 100, 200 = disk 1 grown to 100 GB, one 200 GB disk added)
vm_deploy_max_disk_gb: 2048              # the biggest disk a ticket may ask for, in GB
vm_deploy_max_total_disk_gb: 4096        # all its disks together, in GB
# Automatic placement - when the ticket, its site and vm_deploy_defaults name no cluster / datastore:
# the job chooses among a site's 'clusters' / 'datastores' lists (e.g. SiteA: {clusters: [A-PROD-*]}),
# else among vm_deploy_clusters / vm_deploy_datastores; with neither, the template's own.
vm_deploy_mem_target_pct: 80             # a cluster fits when its memory, this VM included and a host down, stays under this %
vm_deploy_failover_hosts: 1              # hosts to plan as failed when choosing a cluster
vm_deploy_datastore_max_used_pct: 85     # a datastore fits when it stays under this % with the VM at its full size
# Datastores by the VM's name: the first rule whose match fits the name (* and ?, any case) gives the
# datastores it goes on - automatic placement chooses among them on its cluster, the least used first,
# over a site's or vm_deploy_defaults' datastore (one the ticket names must be one of them). A VM no
# rule matches never goes on a datastore a rule names: they are kept for those VMs. e.g. SQL servers:
#   - {match: ["*SQL*", "*DBSE*", "*DBV*"], datastores: ["*SQL*"]}
vm_deploy_datastore_rules: []
# true = a VM whose ticket, site, name rule and vm_deploy_defaults name no datastore (and no
# vm_deploy_datastores) goes on the least used shared datastore of its cluster - the location's - the VMs
# of one ticket spread out (each counts the ones before it); false = the template's own datastore.
vm_deploy_datastore_balance: false
# Run again for the same ticket (a job that stopped: failed, cancelled, timed out), pick up where it
# stopped: each VM carries its ticket in its notes from the clone on - one it built is left as it is,
# one it started and did not finish (cloned, not yet powered on) is finished where it is; the work
# notes say which. false = a VM with the name is refused, as any other.
vm_deploy_resume: true
vm_deploy_domain: localdomain            # the DNS domain Linux customization sets (a ticket's domain: wins)
vm_deploy_customize: true                # guest customization: host name = vm_name, every adapter on DHCP
vm_deploy_power_on: true                 # power the new VM on (false = leave it off, e.g. to check it first)
vm_deploy_wait_customization: 900        # seconds to wait for vCenter's customization result
vm_deploy_wait_ip: 600                   # seconds to wait for an IPv4 address (DHCP, through VMware Tools)
# Fields set on the ticket when the VM is up, e.g. to resolve an incident:
#   {state: "6", close_code: "Solution provided", close_notes: "VM deployed"}   (your instance's values)
vm_deploy_done_fields: {}
# The same for one table (the ticket's table: incident, sc_task, change_task ...), in place of
# vm_deploy_done_fields for it - e.g. close the task, never the change it belongs to:
#   {sc_task: {state: "3", close_notes: "VM deployed by AAP"}}   (3 = Closed Complete; your instance's values)
# Sent on its own, after the result note: when ServiceNow refuses it (a mandatory field, a business rule)
# the note stays, and the job says so on the ticket and in its report (it stays green: the VM is built).
vm_deploy_done_fields_by_table: {}
# Over those fields when every VM is built but something did not finish: no IPv4 address in time, no
# customization result, the guest's host name not applied, no network at power on, guestinfo not set -
# e.g. {change_task: {close_code: successful_issues}} (your instance's values; {} = closed the same way).
# What happened is on the ticket's work notes.
vm_deploy_done_fields_issues_by_table: {}
# Also for a VM from a network-boot template (vm_deploy_pxe_templates), which is powered on and still
# installing its OS from MECM when the job ends. false = that ticket stays open for whoever checks the install.
vm_deploy_done_fields_pxe: true
# ---- The server's service, picked at launch: words in the VM's notes, an AAP inventory and group ----
# What the new server is for, picked by whoever launches the deploy: a survey question (multiple choice,
# NOT required - the scheduled pickup starts the workflow without it), e.g. sql or dc. Every VM of the
# ticket gets it. "" = none. Its words go in each VM's notes in vCenter; with an inventory in
# vm_deploy_services, each VM built joins that AAP inventory and group.
vm_deploy_service: ""
# The services the survey offers: each one's AAP inventory and group, and the words for the VM's notes
# (note: left out = "Service: <its name>."). {} = any service is only written in the notes.
#   vm_deploy_services:
#     sql:  {inventory: Windows servers, group: win_sql, note: SQL Server}
#     dc:   {inventory: Windows servers, group: win_dc, note: Domain controller}
#     web:  {inventory: Linux servers, group: web}
#     test: {note: Test server - delete after 30 days}                       # the notes only
# A service with an inventory needs a "Red Hat Ansible Automation Platform" credential on the deploy
# template, whose AAP user has the Admin role on that inventory. The inventory and the group must
# exist - the job never creates them, it refuses (before anything is built) and says what to create.
# A service that is not listed is refused the same way: the survey's choices must be these names.
vm_deploy_services: {}
# The name a VM gets in the inventory: write it the way your inventory already names servers, or the
# same server shows up twice in AAP. {name} = the VM's name, e.g. "{name}.yoursite.mil". A service's
# own name: wins (e.g. {inventory: Windows servers, name: "{name}.corp.yoursite.mil"}).
vm_deploy_inventory_name: "{name}"
vm_deploy_inventory_lowercase: true      # the inventory name in lower case (APP01 -> app01); false = as the ticket writes it
vm_deploy_aap_ca_path: ""                # a CA file for AAP's own HTTPS certificate ("" = vm_deploy_poll_aap_ca_path, else what the execution environment trusts)
# ---- A request in plain words, without GenAI (off by default) ----
# true = also read the ticket's own words, by the rules below, so a requester can write "a Red Hat 9
# server named ab01web05, medium" instead of 'key: value' lines. Never a guess: two different answers
# in the text are a question to the requester (a comment). 'key: value' lines still work and win;
# with vm_deploy_genai also on, GenAI is asked when the words leave the name or template - or a question - open.
vm_deploy_plain_words: false
# The words for each template (any case; "windows 2022" also matches "Windows Server 2022", "server 2025"
# also "a new 2025 VM"). An allowed template's own name and its short names (vm_deploy_template_aliases)
# count too. An OS no template is for (Server 2025, only a 2022 template) is a question - never another
# version; to build it from a template whose name says another (an empty MECM shell): {"server 2025": <it>}. e.g.
#   {"rhel 9": rhel9-gold, "red hat 9": rhel9-gold, "windows 2022": WIN2022-TEMPLATE}
vm_deploy_plain_templates: {}
# Size words and what they mean, e.g. {small: {cpu: 2, memory_gb: 8}, medium: {cpu: 4, memory_gb: 16},
# large: {cpu: 8, memory_gb: 32}}. "4 vCPU" and "16 GB RAM" in the ticket are read too, and win in the same text.
vm_deploy_plain_sizes: {}
# The words for each site (vm_deploy_sites), as people write the place - any case, the spaces optional
# ("Site Two" is also "SiteTwo"). A site's own name counts too. A change that lists its servers one per
# line ('new VM / ab01web05 / ... Location: Site Two') puts each VM at the site its own line names; the
# CPU, memory and disks on each line are that VM's too. e.g. {"site two": SiteB, "north campus": SiteA}
vm_deploy_plain_sites: {}

# ---- GenAI reads a request written in plain words (a proof of concept, off by default) ----
# When the ticket's own 'key: value' lines do not give vm_name and template: ACT (GenAI, evidence mode,
# no commands) copies out what the ticket says - the names, the operating system as written, CPU, memory,
# disks - each with the ticket's words it comes from. It decides and asks nothing (its own questions are
# notes in the report): the job finds the template from the OS words by its own rules, and asks the
# requester (a comment) only what it needs and cannot read. That run builds NOTHING: it posts the proposal on the ticket. The
# next run builds that proposal (GenAI is not asked again), while the ticket text is unchanged; the
# ticket's own lines still win. Needs the ACT model key credential on the template. docs/VM_DEPLOY_GUIDE.md
vm_deploy_genai: false
# A dry run (Check) asks GenAI too (true): it shows GenAI's proposal and where the VM would go, and writes
# nothing on the ticket - no proposal note, no questions to the requester. false = Check only says GenAI would be asked.
vm_deploy_genai_in_check: false
# Optional: templates GenAI may name by key, each with a plain description (the key: the template's exact
# name). Not needed when the templates' names say their OS: the job finds the template from the OS the
# ticket names. A key for another version than the ticket asks for is dropped. e.g.
#   {win2022-pxe: "Windows Server 2022 (installed over the network by MECM)", rhel9-gold: "Red Hat Enterprise Linux 9"}
vm_deploy_template_catalog: {}
# true: a GenAI proposal waits for a person - the workflow's approval (or a second run) - before it is
# built. false: one run reads, checks and builds, when every value is traced to the ticket and within
# the rules (questions or a refusal still stop it).
vm_deploy_genai_approval: true
# Which step this run is: "" = one job does it all; propose = the workflow's first step (read, ask
# GenAI if needed, check, write where it would go on the ticket - build nothing); build = the step
# after the approval (build what the ticket and its proposal say - never ask GenAI).
vm_deploy_phase: ""
vm_deploy_genai_model_timeout: "{{ site_act_model_timeout | default(600) }}"   # seconds the model may take for its answer
# ---- Pick up VM request tickets on a schedule (playbooks/vm_deploy_poll.yml) ----
# Every run (an AAP schedule, e.g. every 15 minutes) asks ServiceNow for NEW VM requests - active,
# assigned to vm_deploy_assignment_group (required), marked by vm_deploy_poll_prefix and/or
# vm_deploy_poll_query - and starts the deploy workflow once per ticket, after writing
# "[AAP] Picked up ..." on it. A ticket with any note of AAP's on it is never picked up again.
# Nothing is built by this job: the workflow reads, checks, asks for the approval and builds.
# Needs the "ServiceNow API" credential and a "Red Hat Ansible Automation Platform" credential (an
# AAP user that may only start that workflow). docs/VM_DEPLOY_GUIDE.md, "The scheduled pickup"
vm_deploy_poll_enabled: true             # false = the job runs, picks up nothing and says so (the off switch)
vm_deploy_poll_tables: [incident]        # the ServiceNow tables to look in: incident, sc_task, task ...
vm_deploy_poll_prefix: "VM request"      # a VM request's short description starts with this ("" = mark them by vm_deploy_poll_query)
# An extra ServiceNow encoded query, ANDed with the rest, e.g. "category=vm_request" or
# "cmdb_ci.name=VM Request" ("" = none). ^NQ (a second query) is refused.
vm_deploy_poll_query: ""
vm_deploy_poll_states: ["1"]             # the ticket states to pick up (state values: "1" = New)
vm_deploy_poll_max: 3                    # the most tickets started per run; the rest wait for the next run
vm_deploy_poll_scan: 100                 # the most tickets read per table and run, oldest first (tickets AAP already has count too)
vm_deploy_poll_workflow: "VM - deploy from ServiceNow ticket (workflow)"   # the workflow job template started per ticket
vm_deploy_poll_dry_run: false            # true = only list what it would pick up: no note, no workflow (Check does the same)
# Fields set on the ticket together with the "Picked up" note, e.g. {state: "2"} (In Progress) - so the
# ticket leaves the states picked up as well ({} = only the note).
vm_deploy_poll_claim_fields: {}
vm_deploy_poll_aap_ca_path: ""           # a CA file for AAP's own HTTPS certificate ("" = what the execution environment trusts)
