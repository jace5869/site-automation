---
# VMWARE VMs: jobs that run against vCenter (not on the VMs), with the certified vmware.vmware
# collection. vCenter address and account come from a "VMware vCenter" credential on the job
# template (VMWARE_HOST, VMWARE_USER, VMWARE_PASSWORD). docs/VMWARE.md

# The VMs, by their exact name in vCenter: a list, or (from a survey) one per line. No wildcards.
vm_names: []
vmware_datacenter: ""                    # only needed when the same VM name exists in two datacenters
# Check vCenter's certificate. false only if the execution environment does not trust your CA yet.
vmware_validate_certs: true

# ---- Restart, shut down, VLAN change: never on these ----

# The AAP server is ALWAYS refused (hosts in the groups aap / aap_hosts, matched by VM name, guest
# host name and IP address), and so are the hosts of these groups and these VM names (* and ?
# allowed: DC*). List the AAP VM's name here when it differs from its host name, and vCenter's own
# VM. The snapshot cleanup never deletes their snapshots either.
vmware_protected_groups: [aap, aap_hosts]
vmware_protected_vms: []                 # e.g. [AAP01, VCSA01, DC*]  (* and ? allowed)

# ---- Restart / shut down ----

# guest = ask the operating system (needs VMware Tools running; services stop cleanly)
# hard  = reset / power off, like the button on a physical server (unsaved data is lost)
vm_power_mode: guest
vm_power_timeout: 600                    # shut down: seconds to wait for the VM to be off

# ---- Snapshots (never with memory) ----

# The snapshot's name. Taking one: empty = aap-<date>-<time>. Deleting: the exact name to delete.
vm_snapshot_name: ""
vm_snapshot_description: ""              # the AAP job number and user are added
vm_snapshot_quiesce: false               # true = VMware Tools freezes the file systems first
vm_snapshot_delete_all: false            # delete: true = every snapshot of the VM (vm_snapshot_name empty)

# ---- Notes (the VM's description in vCenter) ----

# The text to write.
vm_notes: ""
vm_notes_mode: append                    # append (a new line, with date and user) | replace | clear

# ---- VLAN: move a network adapter to another port group ----

# Which adapter: 1 = Network adapter 1, 2, ...
vm_nic: 1
vm_portgroup: ""                         # the port group (standard or distributed) to move it to

# ---- Secure boot report ----

# Only the VMs in this vCenter folder ("" = every VM, or the ones in vm_names).
vm_secure_boot_folder: ""
# The job stays green (successful) when it finds VMs to fix: the report and email say what. true =
# mark the job FAILED when a VM is BIOS or has secure boot off, so a workflow's "on failure" path
# can react (open a ticket).
vm_secure_boot_fail: false

# ---- Datastore report ----

# Used space (% of capacity): a datastore at or above these is listed as a warning / critical.
vm_datastore_warn_pct: 85
vm_datastore_crit_pct: 90
# The job stays green when datastores are full: the report and email say which. true = mark the
# job FAILED when one is at or above vm_datastore_warn_pct (or inaccessible), for workflows.
vm_datastore_fail: false

# ---- Snapshot report and cleanup ----

# Snapshots at least this many days old: listed apart by the report, deleted by the cleanup.
vm_snapshot_max_age_days: 3
# Never deleted by the cleanup (the report lists them, with the reason):
# - a snapshot whose name or description matches this
vm_snapshot_keep_regex: '(?i)keep|do.?not.?delete'
# - a snapshot of these VMs: names, * and ? allowed (e.g. [DC*, VCSA01, AAP01]). The VMs in
#   vmware_protected_vms and the AAP server are never cleaned up either.
vm_snapshot_cleanup_exclude_vms: []
# - a snapshot bigger than this many GB (1024 = 1 TB), or whose size cannot be read: merging a
#   very big snapshot can take hours and slow the VM - do those by hand, at a quiet time.
vm_snapshot_cleanup_max_size_gb: 1024
# The cleanup on its own (not after a workflow approval) deletes only when this is true - e.g. a
# survey question "Delete them?". false = it lists what it would delete, and deletes nothing.
vm_snapshot_cleanup_confirm: false
# Refuse to delete more than this many snapshots in one run (a typo in the age would otherwise
# delete them all). Raise it on purpose for a big cleanup.
vm_snapshot_cleanup_max: 50
vm_snapshot_delete_timeout: 1800         # seconds to wait for one deletion (vCenter merges it into the disk)
# The cleanup's email (report_email_to): true = only when it deleted something (or a deletion failed).
vm_snapshot_cleanup_email_only_if_deleted: false

# ---- Alarms report and its ACT analysis ----

# Whose triggered alarms and configuration issues: vcenter, datacenter, cluster, host. Add vm,
# datastore or network for theirs too (VM alarms can be many).
vm_alarm_types: [vcenter, datacenter, cluster, host]
# The events of the last this-many hours: every error and warning, failed logins, host connection
# events and VM shutdowns / power-offs / resets / HA restarts. 0 = alarms and host state only.
vm_alarm_hours: 24
vm_alarm_max_events: 5000                # read at most this many events (the newest)
vm_alarm_max_rows: 200                   # rows per table in the report (the artifacts have them all)
# This many failed logins of one user from one place, or more, is critical (fewer: a warning).
vm_alarm_login_critical: 10
# The event types read whatever their category (vCenter's event type names). Add to these lists
# rather than replacing them; [] = none of that kind.
vm_alarm_login_event_types: [BadUsernameSessionEvent, com.vmware.sso.LoginFailure, esx.audit.account.locked,
                             esx.audit.account.loginfailures]
vm_alarm_connection_event_types: [HostConnectionLostEvent, HostNotRespondingEvent, HostDisconnectedEvent,
                                  HostReconnectionFailedEvent, HostShutdownEvent, HostCnxFailedEvent,
                                  HostCnxFailedAccountFailedEvent, HostCnxFailedNetworkErrorEvent,
                                  HostCnxFailedNoConnectionEvent, HostCnxFailedTimeoutEvent,
                                  HostCnxFailedBadUsernameEvent, HostCnxFailedNoAccessEvent]
vm_alarm_vm_event_types: [VmGuestShutdownEvent, VmGuestRebootEvent, VmPoweredOffEvent, VmResettingEvent,
                          VmFailoverFailed, VmDasBeingResetEvent, VmDasBeingResetWithScreenshotEvent,
                          VmRestartedOnAlternateHostEvent, com.vmware.vc.ha.VmRestartedByHAEvent,
                          VmFailedToPowerOnEvent, VmDisconnectedEvent]
# The job stays green when it finds alarms: the report and email say what. true = mark the job
# FAILED when there is a critical alarm or a host is not connected, for workflows.
vm_alarm_fail: false

# ACT analysis (playbooks/vm_alarm_act_analysis.yml). ACT runs on the AAP side (the execution
# environment), never on the ESXi hosts; the model provider, model, URL, proxy and CA are the
# site_act_* settings (roles/site_act/defaults/main.yml), the key an "ACT model key" credential.

vm_alarm_act_max_items: 40               # analyze at most this many problems, the most severe first
vm_alarm_act_config_issues: true         # configuration issues too (false = alarms and events only)
vm_alarm_act_email_if_none: false        # true = email even when there is nothing to analyze
vm_alarm_act_check_url: true             # first check that the AAP node can reach the model's URL
