---
# VMWARE VMs: jobs that run against vCenter (not on the VMs), with the certified vmware.vmware
# collection. vCenter address and account come from a "VMware vCenter" credential on the job
# template (VMWARE_HOST, VMWARE_USER, VMWARE_PASSWORD). docs/VMWARE.md

# The VMs, by their exact name in vCenter: a list, or (from a survey) one per line. No wildcards.
vm_names: []
vmware_datacenter: ""                    # only needed when the same VM name exists in two datacenters
# Check vCenter's certificate. false only if the execution environment does not trust your CA yet.
vmware_validate_certs: true
# Several vCenters (e.g. Enhanced Linked Mode), one report: the reports and the ESXi security
# settings read the credential's vCenter AND these (names, or name:port), with the same account.
# The same vCenter under two names is read once. docs/VMWARE.md, "Several vCenters".
vmware_vcenters: []                      # e.g. [vc01.yoursite.mil, vc02.yoursite.mil]
vmware_vcenter_fail_unread: false        # true = the job shows failed when a vCenter could not be read (the report lists it in red either way)

# ---- Restart, shut down, VLAN change: never on these ----

# The AAP server is ALWAYS refused (hosts in the groups aap / aap_hosts, matched by VM name, guest
# host name and IP address), and so are the hosts of these groups and these VM names (* and ?
# allowed: DC*). List the AAP VM's name here when it differs from its host name, and vCenter's own
# VM. The snapshot cleanup never deletes their snapshots either.
vmware_protected_groups: [aap, aap_hosts]
vmware_protected_vms: []                 # e.g. [AAP01, VCSA01, DC*]  (* and ? allowed)

# ---- Restart / shut down ----

# guest = ask the operating system (needs VMware Tools running; services stop cleanly)
# hard  = reset / power off, like the button on a physical server (unsaved data is lost)
vm_power_mode: guest
vm_power_timeout: 600                    # shut down: seconds to wait for the VM to be off

# ---- Snapshots (never with memory) ----

# The snapshot's name. Taking one: empty = aap-<date>-<time>. Deleting: the exact name to delete.
vm_snapshot_name: ""
vm_snapshot_description: ""              # the AAP job number and user are added
vm_snapshot_quiesce: false               # true = VMware Tools freezes the file systems first
vm_snapshot_delete_all: false            # delete: true = every snapshot of the VM (vm_snapshot_name empty)

# ---- Notes (the VM's description in vCenter) ----

# The text to write.
vm_notes: ""
vm_notes_mode: append                    # append (a new line, with date and user) | replace | clear

# ---- VLAN: move a network adapter to another port group ----

# Which adapter: 1 = Network adapter 1, 2, ...
vm_nic: 1
vm_portgroup: ""                         # the port group (standard or distributed) to move it to

# ---- Secure boot report ----

# Only the VMs in this vCenter folder ("" = every VM, or the ones in vm_names).
vm_secure_boot_folder: ""
# The job stays green (successful) when it finds VMs to fix: the report and email say what. true =
# mark the job FAILED when a VM is BIOS or has secure boot off, so a workflow's "on failure" path
# can react (open a ticket).
vm_secure_boot_fail: false

# ---- Datastore report ----

# Used space (% of capacity): a datastore at or above these is listed as a warning / critical.
vm_datastore_warn_pct: 85
vm_datastore_crit_pct: 90                # a datastore this % used or more is red (critical); amber from vm_datastore_warn_pct
# The job stays green when datastores are full: the report and email say which. true = mark the
# job FAILED when one is at or above vm_datastore_warn_pct (or inaccessible), for workflows.
vm_datastore_fail: false

# ---- Snapshot report and cleanup ----

# Snapshots at least this many days old: listed apart by the report, deleted by the cleanup.
vm_snapshot_max_age_days: 3
# Never deleted by the cleanup (the report lists them, with the reason):
# - a snapshot whose name or description matches this
vm_snapshot_keep_regex: '(?i)keep|do.?not.?delete'
# - a snapshot of these VMs: names, * and ? allowed (e.g. [DC*, VCSA01, AAP01]). The VMs in
#   vmware_protected_vms and the AAP server are never cleaned up either.
vm_snapshot_cleanup_exclude_vms: []
# - a snapshot bigger than this many GB (1024 = 1 TB), or whose size cannot be read: merging a
#   very big snapshot can take hours and slow the VM - do those by hand, at a quiet time.
vm_snapshot_cleanup_max_size_gb: 1024
# The cleanup on its own (not after a workflow approval) deletes only when this is true - e.g. a
# survey question "Delete them?". false = it lists what it would delete, and deletes nothing.
vm_snapshot_cleanup_confirm: false
# Refuse to delete more than this many snapshots in one run (a typo in the age would otherwise
# delete them all). Raise it on purpose for a big cleanup.
vm_snapshot_cleanup_max: 50
vm_snapshot_delete_timeout: 1800         # seconds to wait for one deletion (vCenter merges it into the disk)
# The cleanup's email (report_email_to): true = only when it deleted something (or a deletion failed).
vm_snapshot_cleanup_email_only_if_deleted: false

# ---- Alarms report and its ACT analysis ----

# Whose triggered alarms and configuration issues: vcenter, datacenter, cluster, host. Add vm,
# datastore or network for theirs too (VM alarms can be many).
vm_alarm_types: [vcenter, datacenter, cluster, host]
# The events of the last this-many hours: every error and warning, failed logins, host connection
# events and VM shutdowns / power-offs / resets / HA restarts. 0 = alarms and host state only.
vm_alarm_hours: 24
vm_alarm_max_events: 5000                # read at most this many events (the newest)
vm_alarm_max_alarm_changes: 2000         # read at most this many alarm status changes (the newest; 0 = no "Alarms that fired")
vm_alarm_max_rows: 200                   # rows per table in the report (the artifacts have them all)
# This many failed logins of one user from one place, or more, is critical (fewer: a warning).
vm_alarm_login_critical: 10
# The event types read whatever their category (vCenter's event type names). Add to these lists
# rather than replacing them; [] = none of that kind.
vm_alarm_login_event_types: [BadUsernameSessionEvent, com.vmware.sso.LoginFailure, esx.audit.account.locked,
                             esx.audit.account.loginfailures]
# Events about a host losing (or failing to get back) its connection to vCenter: the Host connection table.
vm_alarm_connection_event_types: [HostConnectionLostEvent, HostNotRespondingEvent, HostDisconnectedEvent,
                                  HostReconnectionFailedEvent, HostShutdownEvent, HostCnxFailedEvent,
                                  HostCnxFailedAccountFailedEvent, HostCnxFailedNetworkErrorEvent,
                                  HostCnxFailedNoConnectionEvent, HostCnxFailedTimeoutEvent,
                                  HostCnxFailedBadUsernameEvent, HostCnxFailedNoAccessEvent]
# Events about a VM stopping, restarting or failing over (guest shutdown, power off, HA restart): the VM events table.
vm_alarm_vm_event_types: [VmGuestShutdownEvent, VmGuestRebootEvent, VmPoweredOffEvent, VmResettingEvent,
                          VmFailoverFailed, VmDasBeingResetEvent, VmDasBeingResetWithScreenshotEvent,
                          VmRestartedOnAlternateHostEvent, com.vmware.vc.ha.VmRestartedByHAEvent,
                          VmFailedToPowerOnEvent, VmDisconnectedEvent]
# The job stays green when it finds alarms: the report and email say what. true = mark the job
# FAILED when there is a critical alarm or a host is not connected, for workflows.
vm_alarm_fail: false

# ACT analysis (playbooks/vm_alarm_act_analysis.yml). ACT runs on the AAP side (the execution
# environment), never on the ESXi hosts; the model provider, model, URL, proxy and CA are the
# site_act_* settings (roles/site_act/defaults/main.yml), the key an "ACT model key" credential.

vm_alarm_act_max_items: 40               # analyze at most this many problems, the most severe first
vm_alarm_act_config_issues: true         # configuration issues too (false = alarms and events only)
vm_alarm_act_email_if_none: false        # true = email even when there is nothing to analyze
vm_alarm_act_check_url: true             # first check that the AAP node can reach the model's URL
# Seconds the model may take for its answer (ACT's GENAI_TIMEOUT, 90 by default, is too short for
# a long analysis): site_act_model_timeout (600) unless set here. A GENAI_TIMEOUT in site_act_env wins.
vm_alarm_act_model_timeout: "{{ site_act_model_timeout | default(600) }}"

# ---- Health report (playbooks/vm_health_report.yml): every datacenter, cluster and host ----

# A cluster of 2 or more hosts without vSphere HA is a warning (false = HA off is on purpose).
vm_health_require_ha: true
# A cluster of 2 or more hosts without DRS is a warning (false where DRS is off on purpose or not
# licensed, e.g. vSphere Standard).
vm_health_require_drs: true
# CPU and memory used, in percent of a host (or of a cluster's hosts running VMs):
vm_health_cpu_warn_pct: 85               # CPU used: a warning from this percent
vm_health_cpu_crit_pct: 95               # CPU used: critical from this percent
vm_health_mem_warn_pct: 90               # memory used: a warning from this percent
vm_health_mem_crit_pct: 95               # memory used: critical from this percent
vm_health_sensors: true                  # read the hosts' hardware sensors (false = skip them)
vm_health_max_rows: 500                  # rows per table in the report (the artifacts have them all)
# The job stays green when it finds problems: the report and email say what. true = mark the job
# FAILED when there is a critical problem (a host not connected, an HA agent isolated ...), for workflows.
vm_health_fail: false

# ---- VMs created report (playbooks/vm_created_report.yml), e.g. every Friday at noon ----

# The window: the VMs created in the last this many days, up to the moment the job runs (7 = the
# past week; run weekly, each VM is in exactly one report). VMs created and deleted since are listed
# too, as long as vCenter keeps their events (often 30 days).
vm_created_days: 7

# ---- ESXi security settings (playbooks/esxi_security.yml), e.g. every night ----

# Which hosts: names (* and ? allowed; the short name matches too). [] = every host of vCenter
# (or of vmware_datacenter).
esxi_security_hosts: []
esxi_security_clusters: []               # only the hosts of these clusters (names, wildcards); [] = all
# Never these hosts (names, wildcards). E.g. a host you opened SSH on for a support case: the
# nightly run would otherwise close it again.
esxi_security_exclude_hosts: []
# The SSH service (TSM-SSH): disabled = stopped, and set to start manually; enabled = started, and
# set to start with the host; "" = leave it as it is.
esxi_security_ssh: disabled
# The ESXi Shell service (TSM), the host's local shell: the same choices.
esxi_security_shell: disabled
# Advanced settings, name: value; {} = none. The defaults (seconds):
#   UserVars.ESXiShellTimeOut             SSH and the ESXi Shell stop by themselves this long after
#                                         someone starts them (0 = never)
#   UserVars.ESXiShellInteractiveTimeOut  an idle SSH or ESXi Shell session is logged out
# Others often set: UserVars.DcuiTimeOut (an idle DCUI session), UserVars.HostClientSessionTimeout
# (an idle Host Client session).
esxi_security_settings:
  UserVars.ESXiShellTimeOut: 600
  UserVars.ESXiShellInteractiveTimeOut: 600
# Lockdown mode: normal = the host is managed only through vCenter (the DCUI still works);
# disabled; "" = leave it as it is. strict is refused, and a host already strict is left alone.
esxi_security_lockdown: normal
# Accounts that must keep logging in to the hosts directly under lockdown (a vulnerability scanner,
# a monitoring tool): host-local accounts, or Active Directory accounts with their own permission on
# the host (not vsphere.local, not an AD group). Added before lockdown is turned on; never removed.
esxi_security_lockdown_exception_users: []
# The email (report_email_to): true = only when a host was changed or failed; false = every run.
esxi_security_email_only_if_changed: true

# ---- vSphere capacity planning (playbooks/vm_capacity_report.yml) ----

vm_capacity_clusters: []                 # only these clusters (names; * and ? allowed); [] = every cluster
# The history: vCenter's own daily statistics (cluster CPU and memory, datastore space), kept a year
# at statistics level 1. Read this many days; the growth is a straight line over the last
# vm_capacity_trend_days, with at least vm_capacity_min_samples daily values.
vm_capacity_history_days: 90
vm_capacity_trend_days: 30               # the growth (straight line) is fitted on this many most recent days
vm_capacity_min_samples: 7               # fewer daily values than this in those days = 'not enough history' (no trend)
vm_capacity_events_days: 30              # VMs added and removed (vCenter keeps events 30 days by default)
# Plan for this many failed hosts per cluster (N+1); a larger HA admission control failover level wins.
vm_capacity_failover_hosts: 1
vm_capacity_mem_target_pct: 80           # memory used at most this %, with those hosts failed
vm_capacity_cpu_target_pct: 80           # CPU used at most this %, with those hosts failed
vm_capacity_vcpu_per_core_max: 4         # vCPUs per physical core (amber from here, red from 1.5 times it)
# Hosts recommended per cluster (of its average host size) to keep memory and CPU at their targets
# with those hosts failed: now, and at the current growth within this many months.
vm_capacity_horizon_months: 12
vm_capacity_storage_warn_pct: 85         # datastore used %: amber
vm_capacity_storage_crit_pct: 90         # red, and the target of the storage runway
vm_capacity_runway_warn_days: 90         # a runway shorter than this is amber
vm_capacity_runway_crit_days: 30         # and red
vm_capacity_include_local_datastores: false   # a host's own (not shared) datastores count too
vm_capacity_max_rows: 100                # rows per table (problems first); the artifacts have all
# The job stays green: the report says what is short. true = mark it FAILED when a cluster or
# datastore is critical (for workflows).
vm_capacity_fail: false
# GenAI: ACT reads the numbers and makes its own estimate, shown next to the job's (math vs GenAI).
# Needs an "ACT model key" credential on the template; the same site_act_* settings as the alarms
# analysis. ACT runs on the AAP side and runs no command.
vm_capacity_act: false
vm_capacity_act_max_items: 30            # items ACT estimates: everything overall, then clusters and datastores, problems first
vm_capacity_act_model_timeout: "{{ site_act_model_timeout | default(600) }}"   # seconds the model may take for its answer
vm_capacity_act_check_url: true          # first check that the AAP node can reach the model's URL

# ---- Deploy a VM from a ServiceNow ticket (playbooks/vm_deploy_from_ticket.yml) ----
# The ticket (survey answer): INC..., TASK..., SCTASK..., RITM..., CHG... - or your instance's own
# prefixes (INCN..., CHGN...): the job asks ServiceNow which table a ticket is in. The ticket says what to build in
# 'key: value' lines - in its description, or in a comment / work note (a newer one overrides):
#   vm_name: app01   template: rhel9-gold   cpu: 4   memory_gb: 16   (cluster, datastore, folder,
#   datacenter, vcenter, domain, customization_spec, notes: optional). docs/VMWARE.md
vm_deploy_ticket: ""
vm_deploy_ticket_table: ""               # leave it empty (the job finds each ticket's table); for a table of your own, e.g. u_vm_request - it applies to EVERY ticket
# Your instance's own number prefixes and their tables, e.g. {INCN: incident, CHGN: change_request}.
# Rarely needed: for a prefix it does not know, the job asks ServiceNow's task table (and takes INCN
# as INC, CHGN as CHG when it may not read that table). A table as people say it is understood:
# change / change request -> change_request, change task -> change_task, catalog task -> sc_task.
vm_deploy_ticket_prefixes: {}
# The request may also be on the ticket's parent - e.g. a task (SCTASK, CTASK) whose change holds the
# requirements: the parent's 'key: value' lines (and, with vm_deploy_plain_words, its plain words) are read
# too, under the ticket's own (what the ticket says wins). A parent that cannot be read, is closed, or is
# not ready (vm_deploy_ready_by_table) stops the build. Only a parent in one of these tables is read
# ([] = never read a parent):
vm_deploy_parent_tables: [change_request]
# The ticket's fields that point to its parent - the first one set is used: a change task's
# change_request, any ticket's parent (or your instance's own field, e.g. u_change):
vm_deploy_parent_fields: [change_request, parent]
# The parent's fields with the request, in this order (a later one wins), e.g. [description,
# implementation_plan]; comments and work_notes may be listed too (oldest first). GenAI reads them as well.
vm_deploy_parent_text_fields: [description]
# Before anything is built, a ticket of these tables - the ticket itself, or the parent it belongs to (a
# change task's change) - must have these fields: one value or a list (any of them), written as the
# ticket's form shows them (upper / lower case ignored). Checked by the dry run, the propose step AND
# right before the build: a change sent back while the approval waited is not built. Your instance's
# labels, e.g. {change_request: {approval: Approved, state: [Implement, Scheduled]}}; {} = no check.
vm_deploy_ready_by_table:
  change_request: {approval: Approved, state: Implement}
# What a ticket may ask for (names; * and ? allowed). Templates MUST be listed: nothing else is
# deployed. The others: [] = any.
vm_deploy_templates: []                  # e.g. [rhel9-gold, win2022-gold]
vm_deploy_clusters: []                   # clusters (and standalone hosts) a ticket may use; also the candidates of automatic placement
vm_deploy_datastores: []                 # datastores (or datastore clusters) a ticket may use; also the candidates of automatic placement
vm_deploy_folders: []                    # VM folders a ticket may use (paths below the datacenter's VM folder, e.g. Linux/*)
vm_deploy_max_cpu: 16                    # the most vCPUs a ticket may ask for
vm_deploy_max_memory_gb: 128             # the most memory a ticket may ask for, in GB
# A ticket may ask for several VMs of the same size ("2 VMs named web01 and web02", "vm_name: web01,
# web02", or "Hostnames:" and one name per line): one VM each, built one after the other, the ticket
# closed when all are built. More names than this: refused, nothing built (the limits above are per VM).
vm_deploy_max_vms: 10
# The VM names allowed (a regular expression); e.g. '^[a-z0-9-]{1,15}$' for Windows-safe names.
vm_deploy_name_regex: '^[A-Za-z0-9][A-Za-z0-9-]{0,62}$'
# Only tickets assigned to this group (its name as ServiceNow shows it), or to one of a list of
# groups (["Group A", "Group B"]); "" = any group (the pickup needs one).
vm_deploy_assignment_group: ""
# What a ticket does not say: e.g. {cluster: PROD-CL01, datastore: DS-CLUSTER-01, folder: Linux/New}.
# Not set = the template's own cluster, datastore and folder; its CPU and memory.
vm_deploy_defaults: {}
# Sites: a ticket's 'site: A' line (or its Location field, when it is one of these names) picks the
# placement - over vm_deploy_defaults; a cluster / datastore / folder the ticket names itself still wins.
#   vm_deploy_sites:
#     SiteA: {cluster: A-PROD-CL01, datastore: A-DSC01, folder: Servers/New}
#     SiteB: {cluster: B-PROD-CL01, datastore: B-DSC01, folder: Servers/New, vcenter: vc02.yoursite.mil}
vm_deploy_sites: {}
vm_deploy_site_required: true            # with sites set up: a ticket must say its site (false = vm_deploy_defaults); a name rule counts too
# Name rules: the VM's name picks where it goes - the first rule whose 'match' fits the name (* and ?,
# upper / lower case alike) fills in what the ticket does not say: a cluster (and datastores,
# folder ...) or a site. The ticket's own lines, and a site the ticket names, still win.
#   vm_deploy_name_rules:
#     - {match: "*AB01*", cluster: CLUSTER-ONE}                   # every name with AB01 in it
#     - {match: "*CD02*", cluster: CLUSTER-TWO, folder: Servers/New}
#     - {match: "*EF03*", site: SiteB}                            # or a site from vm_deploy_sites
vm_deploy_name_rules: []                 # [{match: "*AB01*", cluster: ...}, ...] - see above
# Templates with no operating system yet, that install it themselves: they boot from the network (PXE,
# e.g. an MECM task sequence) or from their CD / ISO (e.g. a kickstart). No guest customization, no
# waiting for an IP address; the MAC address and the computer name go on the ticket. e.g. [win2022-pxe]
vm_deploy_pxe_templates: []
# Give a VM from one of those empty templates the ticket's name and number as VM settings its installer
# can read: guestinfo.hostname and guestinfo.ticket (a kickstart with VMware Tools in the installer:
# vmtoolsd --cmd "info-get guestinfo.hostname"). Needs the vCenter privilege Change configuration >
# Advanced configuration; without it the VM is still built (a note says so). false = none.
vm_deploy_guestinfo: true
# Short names for long template names - for the ticket's 'template:' line and GenAI's catalog (whose
# keys may be these short names): {short name: the template's name in vCenter}, e.g.
#   {win2022: "Windows 2022 Standard Template - Site 1", rhel9: "RHEL 9 Server Template"}
# A ticket may also write a template's own name in other case or spacing: it is matched to the
# spelling in vm_deploy_templates.
vm_deploy_template_aliases: {}
# The customization specification (vCenter > Policies and Profiles) for each template, when the
# ticket, its site and the name rules name none: {template name or pattern: spec}. A Windows template
# that is not network-boot needs one (Sysprep: administrator password, domain or workgroup), e.g.
#   {"Windows 2022*": Win2022-Sysprep-Domain}. Linux templates need none (the job's own DHCP one).
vm_deploy_template_specs: {}
vm_deploy_max_disks: 4                   # disks a ticket may ask for (disks_gb: 100, 200 = disk 1 grown to 100 GB, one 200 GB disk added)
vm_deploy_max_disk_gb: 2048              # the biggest disk a ticket may ask for, in GB
vm_deploy_max_total_disk_gb: 4096        # all its disks together, in GB
# Automatic placement - when the ticket, its site and vm_deploy_defaults name no cluster / datastore:
# the job chooses among a site's 'clusters' / 'datastores' lists (e.g. SiteA: {clusters: [A-PROD-*]}),
# else among vm_deploy_clusters / vm_deploy_datastores; with neither, the template's own.
vm_deploy_mem_target_pct: 80             # a cluster fits when its memory, this VM included and a host down, stays under this %
vm_deploy_failover_hosts: 1              # hosts to plan as failed when choosing a cluster
vm_deploy_datastore_max_used_pct: 85     # a datastore fits when it stays under this % with the VM at its full size
vm_deploy_domain: localdomain            # the DNS domain Linux customization sets (a ticket's domain: wins)
vm_deploy_customize: true                # guest customization: host name = vm_name, every adapter on DHCP
vm_deploy_power_on: true                 # power the new VM on (false = leave it off, e.g. to check it first)
vm_deploy_wait_customization: 900        # seconds to wait for vCenter's customization result
vm_deploy_wait_ip: 600                   # seconds to wait for an IPv4 address (DHCP, through VMware Tools)
# Fields set on the ticket when the VM is up, e.g. to resolve an incident:
#   {state: "6", close_code: "Solution provided", close_notes: "VM deployed"}   (your instance's values)
vm_deploy_done_fields: {}
# The same for one table (the ticket's table: incident, sc_task, change_task ...), in place of
# vm_deploy_done_fields for it - e.g. close the task, never the change it belongs to:
#   {sc_task: {state: "3", close_notes: "VM deployed by AAP"}}   (3 = Closed Complete; your instance's values)
# Sent on its own, after the result note: when ServiceNow refuses it (a mandatory field, a business rule)
# the note stays, and the job says so on the ticket and in its report (it stays green: the VM is built).
vm_deploy_done_fields_by_table: {}
# Over those fields when every VM is built but something did not finish: no IPv4 address in time, no
# customization result, the guest's host name not applied, no network at power on, guestinfo not set -
# e.g. {change_task: {close_code: successful_issues}} (your instance's values; {} = closed the same way).
# What happened is on the ticket's work notes.
vm_deploy_done_fields_issues_by_table: {}
# Also for a VM from a network-boot template (vm_deploy_pxe_templates), which is powered on and still
# installing its OS from MECM when the job ends. false = that ticket stays open for whoever checks the install.
vm_deploy_done_fields_pxe: true
# ---- A request in plain words, without GenAI (off by default) ----
# true = also read the ticket's own words, by the rules below, so a requester can write "a Red Hat 9
# server named ab01web05, medium" instead of 'key: value' lines. Never a guess: two different answers
# in the text are a question to the requester (a comment). 'key: value' lines still work and win;
# with vm_deploy_genai also on, GenAI is asked when the words leave the name or template - or a question - open.
vm_deploy_plain_words: false
# The words for each template (any case; "windows 2022" also matches "Windows Server 2022"). An
# allowed template's own name and its short names (vm_deploy_template_aliases) count too. e.g.
#   {"rhel 9": rhel9-gold, "red hat 9": rhel9-gold, "windows 2022": WIN2022-TEMPLATE}
vm_deploy_plain_templates: {}
# Size words and what they mean, e.g. {small: {cpu: 2, memory_gb: 8}, medium: {cpu: 4, memory_gb: 16},
# large: {cpu: 8, memory_gb: 32}}. "4 vCPU" and "16 GB RAM" in the ticket are read too, and win in the same text.
vm_deploy_plain_sizes: {}

# ---- GenAI reads a request written in plain words (a proof of concept, off by default) ----
# When the ticket's own 'key: value' lines do not give vm_name and template: ACT (GenAI, evidence mode,
# no commands) reads the ticket and proposes the VM - each value with the ticket's words it comes from,
# or a question to the requester. That run builds NOTHING: it posts the proposal on the ticket. The
# next run builds that proposal (GenAI is not asked again), while the ticket text is unchanged; the
# ticket's own lines still win. Needs the ACT model key credential on the template. docs/VMWARE.md
vm_deploy_genai: false
# The templates GenAI may choose from, each with a plain description it can match the request to:
#   {win2022-pxe: "Windows Server 2022 (installed over the network by MECM)", rhel9-gold: "Red Hat Enterprise Linux 9"}
vm_deploy_template_catalog: {}
# true: a GenAI proposal waits for a person - the workflow's approval (or a second run) - before it is
# built. false: one run reads, checks and builds, when every value is traced to the ticket and within
# the rules (questions or a refusal still stop it).
vm_deploy_genai_approval: true
# Which step this run is: "" = one job does it all; propose = the workflow's first step (read, ask
# GenAI if needed, check, write where it would go on the ticket - build nothing); build = the step
# after the approval (build what the ticket and its proposal say - never ask GenAI).
vm_deploy_phase: ""
vm_deploy_genai_model_timeout: "{{ site_act_model_timeout | default(600) }}"   # seconds the model may take for its answer
# ---- Pick up VM request tickets on a schedule (playbooks/vm_deploy_poll.yml) ----
# Every run (an AAP schedule, e.g. every 15 minutes) asks ServiceNow for NEW VM requests - active,
# assigned to vm_deploy_assignment_group (required), marked by vm_deploy_poll_prefix and/or
# vm_deploy_poll_query - and starts the deploy workflow once per ticket, after writing
# "[AAP] Picked up ..." on it. A ticket with any note of AAP's on it is never picked up again.
# Nothing is built by this job: the workflow reads, checks, asks for the approval and builds.
# Needs the "ServiceNow API" credential and a "Red Hat Ansible Automation Platform" credential (an
# AAP user that may only start that workflow). docs/VMWARE.md, "Pick up tickets automatically"
vm_deploy_poll_enabled: true             # false = the job runs, picks up nothing and says so (the off switch)
vm_deploy_poll_tables: [incident]        # the ServiceNow tables to look in: incident, sc_task, task ...
vm_deploy_poll_prefix: "VM request"      # a VM request's short description starts with this ("" = mark them by vm_deploy_poll_query)
# An extra ServiceNow encoded query, ANDed with the rest, e.g. "category=vm_request" or
# "cmdb_ci.name=VM Request" ("" = none). ^NQ (a second query) is refused.
vm_deploy_poll_query: ""
vm_deploy_poll_states: ["1"]             # the ticket states to pick up (state values: "1" = New)
vm_deploy_poll_max: 3                    # the most tickets started per run; the rest wait for the next run
vm_deploy_poll_scan: 100                 # the most tickets read per table and run, oldest first (tickets AAP already has count too)
vm_deploy_poll_workflow: "VM - deploy from ServiceNow ticket (workflow)"   # the workflow job template started per ticket
vm_deploy_poll_dry_run: false            # true = only list what it would pick up: no note, no workflow (Check does the same)
# Fields set on the ticket together with the "Picked up" note, e.g. {state: "2"} (In Progress) - so the
# ticket leaves the states picked up as well ({} = only the note).
vm_deploy_poll_claim_fields: {}
vm_deploy_poll_aap_ca_path: ""           # a CA file for AAP's own HTTPS certificate ("" = what the execution environment trusts)
