---
# NETAPP ONTAP HARDWARE INVENTORY (playbooks/ontap_hardware_report.yml). Read-only: the collector sends GET requests only
# (roles/ontap_report/library/site_ontap_collect.py; what it reads: _ontap_hw_queries in roles/ontap_report/vars/main.yml).
# Every cluster's controllers (model, serial number, system ID, ONTAP, CPUs, memory, firmware, service processor / BMC,
# NVRAM battery, Flash Cache), shelves (model, serial, modules and their firmware), disks (vendor, model, firmware, size)
# and ports - the models in use with their ONTAP and firmware versions. The report (plugins/filter/ontap_hardware_filters.py)
# is printed, emailed (report_email_to) with all of it as an Excel workbook (ontap_hardware_xlsx), on the report website,
# and published as artifacts (ontap_hardware). Amber when a controller is not up; red when a cluster could not be read.
- name: NetApp | read the clusters' hardware (GET requests only)
  site_ontap_collect:
    clusters: "{{ (ontap_clusters | replace(',', ' ')).split() if ontap_clusters is string else ontap_clusters }}"
    queries: "{{ _ontap_hw_queries }}"
    validate_certs: "{{ ontap_validate_certs | bool }}"
    ca_path: "{{ ontap_ca_path | default(omit, true) }}"
    timeout: "{{ ontap_timeout | int }}"
    tls_legacy: "{{ ontap_tls_legacy | bool }}"
  register: _ontap_hw_read
  check_mode: false                     # it only reads: a dry run (Check) shows the real report

- name: NetApp | the report
  ansible.builtin.set_fact:
    _ontap_doc: "{{ _ontap_hw_read | ontap_hardware_doc({'max_rows': ontap_hardware_max_rows | int}) }}"
    _ontap_xlsx: "{{ _ontap_hw_read | ontap_hardware_xlsx if ontap_hardware_xlsx | bool else [] }}"

- name: NetApp | the models (one line each) and what could not be read
  ansible.builtin.debug:
    msg: "{{ _ontap_hw_read | ontap_hardware_lines }}"

- name: NetApp | report
  ansible.builtin.include_tasks: report.yml

- name: NetApp | the models and counts as job artifacts (ontap_hardware)
  ansible.builtin.set_stats:
    data:
      ontap_hardware: >-
        {{ {'models': _ontap_hw_read | ontap_hardware_models,
            'counts': _ontap_doc.summary | items2dict(key_name='label', value_name='value'),
            'clusters': _ontap_hw_read.clusters | map(attribute='address') | list,
            'not_read': _ontap_hw_read.clusters | rejectattr('reachable') | map(attribute='address') | list,
            'read_at': _ontap_hw_read.read_at} }}

- name: NetApp | every cluster was read
  ansible.builtin.assert:
    that: _ontap_hw_read.clusters | rejectattr('reachable') | list | length == 0
    fail_msg: >-
      Not read: {{ _ontap_hw_read.clusters | rejectattr('reachable') | map(attribute='address') | join(', ') }} (the report
      above says why, and covers the others). ontap_hardware_fail: false (the default) keeps the job green.
    quiet: true
  when: ontap_hardware_fail | bool
