---
# The site portal's NetApp page (/portal/netapp, docs/NETAPP.md "The live page"): this run of NetApp - refresh volume list
# in the report database (site_ontap_live_db: ontap_live_run, ontap_live_volume, ontap_live_aggr, ontap_live_point,
# ontap_live_part). Only with the "Report database" credential (REPORT_DB_HOST) and ontap_live_db; without it nothing here
# runs. The health parts (ontap_live_health) and the performance sample (ontap_live_perf) are GET only. Never fails the
# job: a cluster or a database that cannot be read is one warning.
- name: NetApp | the health parts for the portal's NetApp page (GET only)
  site_ontap_collect:
    clusters: "{{ (ontap_clusters | replace(',', ' ')).split() if ontap_clusters is string else ontap_clusters }}"
    queries: >-
      {{ (_ontap_live_health_queries if ontap_live_health | bool else [])
         + (_ontap_live_perf_queries if ontap_live_perf | bool else []) }}
    validate_certs: "{{ ontap_validate_certs | bool }}"
    ca_path: "{{ ontap_ca_path | default(omit, true) }}"
    timeout: "{{ ontap_timeout | int }}"
    tls_legacy: "{{ ontap_tls_legacy | bool }}"
  register: _ol_live_read
  check_mode: false                     # it only reads
  failed_when: false                    # a part not read is said on the page, never the job's result
  when: ontap_live_health | bool or ontap_live_perf | bool

# one dict expression each: on ansible-core 2.16 the values of a YAML dict would arrive as strings
- name: NetApp | this run for the page
  ansible.builtin.set_fact:
    _ol_live_opts: >-
      {{ {'volume_warn_pct': ontap_volume_warn_pct | float, 'volume_crit_pct': ontap_volume_crit_pct | float,
          'aggr_warn_pct': ontap_aggr_warn_pct | float, 'aggr_crit_pct': ontap_aggr_crit_pct | float,
          'aggr_max_pct': ontap_expand_aggr_max_pct | float, 'days_warn': ontap_live_days_warn | float,
          'days_crit': ontap_live_days_crit | float, 'list_days': ontap_live_list_days | float,
          'min_points': 3, 'min_hours': ontap_live_growth_min_hours | float, 'growth_days': ontap_live_growth_days | float,
          'min_gb': ontap_volume_min_gb | float, 'lag_warn_hours': ontap_snapmirror_lag_warn_hours | float,
          'lag_crit_hours': ontap_snapmirror_lag_crit_hours | float, 'min_spares': ontap_min_spares | int,
          'ems_hours': ontap_ems_hours | float, 'ems_ignore': ontap_ems_ignore | default([], true),
          'ems_ignore_ldap': ontap_ems_ignore_ldap | string, 'lat_warn_ms': ontap_perf_latency_warn_ms | float,
          'lat_crit_ms': ontap_perf_latency_crit_ms | float, 'perf_top': ontap_live_perf_top | int,
          'health': ontap_live_health | bool, 'perf': ontap_live_perf | bool,
          'vmware': lookup('ansible.builtin.env', 'VMWARE_HOST') | trim | length > 0, 'vc_error': _ol_vc_error} }}

- name: NetApp | keep this run for the portal's NetApp page (ontap_live_db)
  site_ontap_live_db:
    host: "{{ lookup('ansible.builtin.env', 'REPORT_DB_HOST') | trim }}"
    port: "{{ lookup('ansible.builtin.env', 'REPORT_DB_PORT') | default('3309', true) | int }}"
    database: "{{ lookup('ansible.builtin.env', 'REPORT_DB_NAME') | default('site_reports', true) | trim }}"
    user: "{{ lookup('ansible.builtin.env', 'REPORT_DB_USER') | trim }}"
    password: "{{ lookup('ansible.builtin.env', 'REPORT_DB_PASSWORD') }}"
    tls: "{{ lookup('ansible.builtin.env', 'REPORT_DB_TLS') | default('false', true) | bool }}"
    ca_file: "{{ lookup('ansible.builtin.env', 'REPORT_DB_CA_FILE') | trim }}"
    connect_timeout: "{{ ontap_live_db_timeout | int }}"
    create: "{{ ontap_live_db_create | bool }}"
    read_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    job: "{{ (awx_job_id | default(tower_job_id | default(0))) | int }}"
    template_id: "{{ (awx_job_template_id | default(tower_job_template_id | default(0))) | int }}"
    run: >-
      {{ {'list': _ol_list, 'choices': _ol_choices.choices, 'found': _ol_found,
          'collected': _ol_live_read if _ol_live_read is defined and _ol_live_read is not skipped else {},
          'health': ontap_live_health | bool, 'perf': ontap_live_perf | bool, 'opts': _ol_live_opts} | ontap_live_payload }}
    expand_template: >-
      {%- set t = (ontap_expand_templates | first) if ontap_expand_templates is not string else ontap_expand_templates -%}
      {{ (t.template if t is mapping else t) | string }}
    expand_question: "{{ ontap_expand_question }}"
    opts: "{{ _ol_live_opts }}"
    keep_days: "{{ ontap_live_db_keep_days | int }}"
    keep_hours: "{{ ontap_live_db_keep_hours | int }}"
  register: _ol_live_db
  failed_when: false                     # never the job's result: the module says why (a warning)

- name: NetApp | the report database
  ansible.builtin.debug:
    msg: >-
      {{ ('Check: the report database answered; nothing written.' if ansible_check_mode else
          'This list is kept in the report database (run %s: %s volume rows, %s aggregates, %s with a growth rate%s) - the portal’s NetApp page reads it.'
          | format(_ol_live_db.run_id, _ol_live_db.volumes, _ol_live_db.aggrs, _ol_live_db.rated,
                   (', ' ~ (_ol_live_db.parts | join(', '))) if _ol_live_db.parts | default([]) | length > 0 else ''))
         if _ol_live_db.ok | default(false)
         else 'Not kept in the report database: ' ~ (_ol_live_db.error | default(_ol_live_db.msg | default('the module stopped'), true)) }}
