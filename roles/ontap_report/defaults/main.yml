---
# NetApp ONTAP health report (playbooks/ontap_health_report.yml). Read-only: GET requests to each
# cluster's REST API, with the account of a "NetApp ONTAP" credential (docs/NETAPP.md).

# The clusters' management addresses (names or IPs), e.g. [cluster1.yoursite.mil, cluster2.yoursite.mil].
# The credential's account must exist on each of them.
ontap_clusters: []
# Check the clusters' HTTPS certificates. ONTAP's own certificate is often self-signed: then put
# its CA in ontap_ca_path (a file in the project, e.g. "{{ playbook_dir }}/files/ca/ontap-ca.pem"),
# or set false.
ontap_validate_certs: true
ontap_ca_path: ""                        # the CA file (PEM) the clusters' certificates are checked with; empty = the execution environment's own trust
ontap_timeout: 30                        # seconds for one request (no answer: asked once more)
ontap_tls_legacy: false                  # true = connect to older ONTAP whose TLS the execution environment refuses (UNSAFE_LEGACY_RENEGOTIATION_DISABLED, KEY_TOO_SMALL, SHA-1)

# Thresholds (used %, hours, days, seconds): at or above "warn" = amber, at or above "crit" = red.
ontap_volume_warn_pct: 85
ontap_volume_crit_pct: 90                # volume used % -> red
ontap_volume_min_gb: 50                  # volumes smaller than this (GB) are left out of the Volumes table - full (root volumes and other small ones run full by design) or not online; 0 = every volume
ontap_aggr_warn_pct: 85                  # aggregate used % -> amber
ontap_aggr_crit_pct: 90                  # aggregate used % -> red
ontap_inode_warn_pct: 85                 # inodes used % of a volume -> amber
ontap_inode_crit_pct: 90                 # inodes used % -> red
ontap_snapmirror_lag_warn_hours: 24      # last good transfer longer ago than this
ontap_snapmirror_lag_crit_hours: 48      # last good transfer longer ago than this -> red
ontap_snapshot_reserve_warn_pct: 100     # snapshots using this much of their reserve (100 = they spill into the volume)
ontap_snapshot_reserve_crit_pct: 150     # snapshots using this much of their reserve -> red
ontap_cert_warn_days: 60                 # certificates expiring within this many days
ontap_cert_crit_days: 14                 # certificates expiring within this many days (or expired) -> red
ontap_time_drift_warn_seconds: 60        # a node's clock against the AAP server's
ontap_time_drift_crit_seconds: 300       # a node's clock this far off -> red
ontap_port_errors_warn: 1                # receive errors (CRC and other bad frames) since the node booted
ontap_port_errors_crit: 10000            # receive errors on a port since boot -> red
ontap_min_spares: 1                      # fewer spare disks than this on a node = amber (0 = red)
ontap_ems_hours: 24                      # the error events of the last this-many hours
ontap_ems_max: 500                       # read at most this many events per cluster
ontap_ems_ignore_ldap: auto              # leave out events whose name has "ldap" in it: auto = on a cluster where no SVM has an LDAP client configured; true = always; false = never
ontap_ems_ignore: []                     # event names to leave out (regular expressions, any case), e.g. ['^secd\.ldap\.', 'callhome\.battery\.low']

ontap_report_max_rows: 50                # rows per table (problems first); the job's artifacts have all
ontap_snapshot_top: 25                   # the snapshot space table: the volumes whose snapshots use the most
# The job stays green when it finds problems: the report and email say what. true = mark it
# FAILED when there is a critical finding or a cluster could not be read, for workflows.
ontap_report_fail: false

# ---- NetApp ONTAP hardware inventory (playbooks/ontap_hardware_report.yml) ----
ontap_hardware_max_rows: 2000            # controllers, shelves and disk models listed in the email and the page at most (the workbook always has all)
ontap_hardware_xlsx: true                # attach every controller, shelf, shelf module, disk and port as an Excel workbook (.xlsx) to the email
ontap_hardware_fail: false               # true = mark the job FAILED when a cluster could not be read (the report still goes out), for workflows

# ---- NetApp ONTAP capacity trends (playbooks/ontap_capacity_trends.yml) ---- each run adds one point; run it daily
ontap_capacity_days: 30                  # the window: the trend lines, rates and days-to-full come from the runs of the last this-many days
ontap_volume_again_days: 7               # "back again": a volume over ontap_volume_warn_pct now that was over it within this many days, and below it in between
ontap_volume_fast_days: 30               # "filling fast": a volume that reaches ontap_volume_crit_pct within this many days at its rate
ontap_capacity_top: 5                    # the fastest growing volumes listed (whatever their used %)
ontap_capacity_runs_max: 400             # read at most this many earlier runs (from AAP's job history, and from the report database)
ontap_capacity_db: true                  # keep the points in the report database too, when the job template has a "Report database" credential (a longer history than AAP keeps its jobs); no credential = not used
ontap_capacity_db_create: true           # make the table ontap_capacity_point on the first run; false = an admin makes it (docs/REPORT_DATABASE.md)
ontap_capacity_db_timeout: 10            # seconds to wait for the report database's connection
ontap_capacity_db_keep_days: 800         # delete the database's points older than this many days (0 = never)
ontap_capacity_fail: false               # true = mark the job FAILED when a cluster could not be read (the report still goes out), for workflows
