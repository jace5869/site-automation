---
# What the report reads from each cluster: REST paths and fields, checked against NetApp's ONTAP
# REST API reference for ONTAP 9.10 to 9.16 (docs.netapp.com/us-en/ontap-restapi). A field an
# older ONTAP does not know makes ONTAP refuse the request (HTTP 400): the collector then asks again
# with ignore_unknown_fields (9.11+), then with fallback_fields, and marks that part "reduced detail".
# /api/private/cli/ is ONTAP's CLI read through REST (show commands; the "readonly" role may run them).
_ontap_queries:
  - key: cluster
    path: /api/cluster
    fields: [name, version.full, uuid, location, timezone.name]
    fallback_fields: [name, version.full]
  - key: nodes
    path: /api/cluster/nodes
    fields: [name, state, uptime, date, version.full, model, serial_number, membership, ha.enabled, ha.partners.name,
             ha.takeover.state, ha.giveback.state, controller.frus, controller.failed_fan.count,
             controller.failed_fan.message.message, controller.failed_power_supply.count,
             controller.failed_power_supply.message.message, controller.over_temperature, service_processor.state,
             nvram.battery_state]
    fallback_fields: [name, state, uptime, version.full, model]
  - key: subsystems
    path: /api/private/cli/system/health/subsystem
    fields: [subsystem, health, outstanding-alert-count]
    fallback_fields: [subsystem, health]
  - key: alerts
    path: /api/private/cli/system/health/alert
    fields: [node, monitor, alert-id, alerting-resource, subsystem, indication-time, perceived-severity, probable-cause,
             possible-effect, corrective-actions]
    fallback_fields: [node, alert-id, perceived-severity, probable-cause]
  - key: failover
    path: /api/private/cli/storage/failover
    fields: [node, partner-name, possible, state-description]
  - key: ems
    path: /api/support/ems/events
    fields: [time, message.name, message.severity, log_message, node.name]
    query: {message.severity: "emergency|alert|error", time: ">={{ (now(utc=true).timestamp() - (ontap_ems_hours | float) * 3600) | int }}"}
    fallback_query: {message.severity: "emergency|alert|error"}
    max: "{{ ontap_ems_max | int }}"
  - key: disks
    path: /api/storage/disks
    fields: [name, state, container_type, node.name, home_node.name, model, serial_number, bay, shelf.uid, type, class]
    max: 50000
  - key: shelves
    path: /api/storage/shelves
    fields: [name, id, uid, model, serial_number, state, frus, fans, temperature_sensors, errors]
    fallback_fields: [name, id, uid, model, state, frus]
  - key: aggregates
    path: /api/storage/aggregates
    fields: [name, node.name, home_node.name, state, space.block_storage.size, space.block_storage.available,
             space.block_storage.used, block_storage.primary.raid_type, block_storage.primary.disk_count]
  - key: volumes
    path: /api/storage/volumes
    fields: [name, svm.name, aggregates.name, state, type, style, space.size, space.available, space.used,
             space.percent_used, space.snapshot.used, space.snapshot.reserve_percent, space.snapshot.reserve_size,
             space.snapshot.space_used_percent, files.maximum, files.used, snapshot_count, is_svm_root]
    fallback_fields: [name, svm.name, aggregates.name, state, type, style, space.size, space.available, space.used,
                      space.percent_used, space.snapshot.used, space.snapshot.reserve_percent, space.snapshot.reserve_size,
                      space.snapshot.space_used_percent, files.maximum, files.used, is_svm_root]   # no snapshot_count (9.10+)
    query: {is_constituent: "false"}
    max: 50000
  - key: luns
    path: /api/storage/luns
    fields: [name, svm.name, location.volume.name, status.state, status.mapped, space.size, space.used, os_type]
    max: 50000
  - key: lifs
    path: /api/network/ip/interfaces
    fields: [name, svm.name, scope, state, enabled, location.is_home, location.home_node.name, location.home_port.name,
             location.node.name, location.port.name, ip.address, services]
  - key: fc_lifs
    path: /api/network/fc/interfaces
    fields: [name, svm.name, state, enabled, location.is_home, location.home_node.name, location.home_port.name,
             location.node.name, location.port.name]
  - key: ports
    path: /api/network/ethernet/ports
    fields: [name, node.name, state, enabled, speed, type, broadcast_domain.name, statistics.device.receive_raw.errors,
             statistics.device.receive_raw.discards, statistics.device.transmit_raw.errors,
             statistics.device.link_down_count_raw]
    fallback_fields: [name, node.name, state, enabled, speed, type, broadcast_domain.name]
  - key: nic_counters
    path: /api/cluster/counter/tables/nic_common/rows
    fields: [id, properties, counters]
    fallback_fields: [id, counters]
    max: 5000
  - key: fc_ports
    path: /api/network/fc/ports
    fields: [name, node.name, state, enabled, physical_protocol, speed.configured, speed.maximum, fabric.connected]
  - key: snapmirror_cli
    path: /api/private/cli/snapmirror
    fields: [source-path, destination-path, type, state, status, healthy, unhealthy-reason, lag-time,
             last-transfer-end-timestamp, progress-last-updated, total-progress, last-transfer-error, policy]
    fallback_fields: [source-path, destination-path, state, status, healthy, lag-time]
    max: 20000
  - key: snapmirror
    path: /api/snapmirror/relationships
    fields: [source.path, destination.path, state, healthy, unhealthy_reason.message, lag_time, transfer.state,
             transfer.bytes_transferred, transfer.end_time, policy.name, policy.type]
    max: 20000
  - key: cluster_peers
    path: /api/cluster/peers
    fields: [name, status.state, authentication.state]
  - key: svm_peers
    path: /api/svm/peers
    fields: [svm.name, peer.svm.name, peer.cluster.name, state]
  - key: svms
    path: /api/svm/svms
    fields: [name, state, subtype]
  - key: cifs
    path: /api/protocols/cifs/services
    fields: [svm.name, name, enabled, ad_domain.fqdn]
  - key: cifs_domains
    path: /api/protocols/cifs/domains
    fields: [svm.name, discovered_servers]
  - key: certificates
    path: /api/security/certificates
    fields: [name, common_name, svm.name, type, expiry_time, scope]
  - key: ntp
    path: /api/cluster/ntp/servers
    fields: [server, version, authentication_enabled]
