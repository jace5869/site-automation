---
# ACT's analysis of this host (fapolicyd_act): evidence only - ACT runs nothing on the host. It gets the job's own
# reading (the blocks grouped, the change proposed for each, what is for a person, what keeps fapolicyd down) and
# fapolicyd's settings, rules and audit log, and explains them, with the ACT fapolicyd prompt (vendor/act).

- name: Fapolicyd | ACT provider, model and URL (site_act_provider, site_act_models, as every ACT job)
  ansible.builtin.include_role:
    name: site_act
    tasks_from: env.yml

# read here: inside act_triage, role_path is act_triage's
- name: Fapolicyd | ACT's instructions for fapolicyd (vendor/act's fapolicyd prompt, and this job's permissive step)
  ansible.builtin.set_fact:
    _fa_act_prompt: >-
      {{ lookup('ansible.builtin.file', role_path ~ '/../../vendor/act/ansible/playbooks/templates/fapolicyd_prompt.j2') }}
      This job starts a stopped fapolicyd in permissive mode on purpose, for a short time, to learn what it would block
      before it enforces (its report shows a permissive host in red): describe that state as it is, do not propose it.
    _fa_act_skip: "{{ '' if _site_act_key_ok | bool else 'ACT did not run: the template has no ' ~ _site_act_key_hint }}"

- name: Fapolicyd | ACT skipped - no key
  ansible.builtin.debug:
    msg: "{{ _fa_act_skip }}"
  when: _fa_act_skip | length > 0

- name: Fapolicyd | ACT's analysis (evidence only)
  when: _fa_act_skip | length == 0
  ansible.builtin.include_role:
    name: act_triage
  vars:
    act_triage_mode: evidence
    act_triage_always: true
    act_triage_builtin_checks: false
    act_triage_allow: []
    act_triage_findings_extra: "{{ _fr | fapolicyd_act_findings(_ff | default({})) }}"
    act_triage_evidence_commands:
      - "rpm -q fapolicyd"
      - "grep -Ev '^[[:space:]]*(#|$)' {{ (fapolicyd_dir ~ '/fapolicyd.conf') | quote }}"
      - "fapolicyd-cli --list"
      - "ls -l {{ (fapolicyd_dir ~ '/rules.d/') | quote }} {{ (fapolicyd_dir ~ '/trust.d/') | quote }} 2>&1"
      - "ausearch -m FANOTIFY -ts {{ fapolicyd_since }} -i 2>&1 | tail -n 400"
    act_triage_evidence_text: "{{ _fr | fapolicyd_act_evidence(_ff | default({})) }}"
    act_triage_extra_instructions: "{{ _fa_act_prompt }}"
    # the provider and model of site_act; ACT only reads here, so a plain answer (no action tools, schema or "{")
    act_triage_env: "{{ _site_act_env_all | combine(_site_act_plain_env) | combine(site_act_env | default({})) }}"
    act_triage_fail_in_role: false
    act_triage_write_report: false

- name: Fapolicyd | ACT ran on this host (its analysis goes in the report)
  ansible.builtin.set_fact:
    _fa_act_ran: true
  when: _fa_act_skip | length == 0
