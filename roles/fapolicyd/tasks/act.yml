---
# ACT's analysis of this host (fapolicyd_act): evidence only - ACT runs nothing on the host. It gets the job's own
# reading (the blocks grouped, the change proposed for each, what is for a person, what keeps fapolicyd down) and
# fapolicyd's settings, rules and audit log, and explains them, with the ACT fapolicyd prompt (vendor/act).

- name: Fapolicyd | ACT provider, model and URL (site_act_provider, site_act_models, as every ACT job)
  ansible.builtin.include_role:
    name: site_act
    tasks_from: env.yml

# read here: inside act_triage, role_path is act_triage's
- name: Fapolicyd | ACT's instructions for fapolicyd (vendor/act's fapolicyd prompt, and this job's permissive step)
  ansible.builtin.set_fact:
    _fa_act_prompt: >-
      {{ lookup('ansible.builtin.file', role_path ~ '/../../vendor/act/ansible/playbooks/templates/fapolicyd_prompt.j2') }}
      This job starts a stopped fapolicyd in permissive mode on purpose, for a short time, to learn what it would block
      before it enforces (its report shows a permissive host in red): describe that state as it is, do not propose it.
    _fa_act_skip: >-
      {{ 'ACT is off (site_act_enabled false).' if _site_act_off | bool
         else '' if _site_act_key_ok | bool else 'ACT did not run: the template has no ' ~ _site_act_key_hint }}

- name: Fapolicyd | ACT skipped - off, or no key
  ansible.builtin.debug:
    msg: "{{ _fa_act_skip }}"
  when: _fa_act_skip | length > 0

# 1.136.0: hosts with the same denials (site_act_group), asked once: ACT reads the first of them, the others take its
# analysis, said in their report. Compared: fapolicyd's state and each block (what was blocked, by which program, how) -
# not how often, and without numbers, times, addresses and the host's own names - and the findings ACT is given (a trust file
# that cannot be read, a trust database too small ...: Codex P2), so a host never takes another's fix.
- name: Fapolicyd | this host's denials as one signature
  ansible.builtin.set_fact:
    _site_act_sig: >-
      {%- set ls = ['fapolicyd ' ~ (_fr.active | default('')) ~ (' permissive' if _fr.permissive | default(false) else '')] -%}
      {%- for g in (_fr.blocks | default([]))[:20] -%}
      {%-   set _ = ls.append((g.kind | default('')) ~ ' ' ~ (g.exe | default('')) ~ ' -> ' ~ (g.path | default('')) ~ ' ('
                              ~ (g.perm | default('')) ~ ')') -%}
      {%- endfor -%}
      {%- set ls = ls + (_fr | fapolicyd_act_findings(_ff | default({})) | map('string') | map('regex_replace', ' x[0-9]+$', '') | list)
                      + ((_ff | default({})).fixes | default([]) | map('string') | list) -%}
      {{ (ls | site_text_set([inventory_hostname, inventory_hostname_short, ansible_host | default('')]))
         if _fa_act_skip | length == 0 and site_act_group | default(true) | bool else '' }}

- name: Fapolicyd | the hosts with the same denials
  ansible.builtin.set_fact:
    _fa_act_group: "{{ hostvars | site_act_group(ansible_play_batch, inventory_hostname, '_site_act_sig') }}"     # this batch's hosts (serial)

- name: Fapolicyd | ACT's analysis (evidence only)
  when: _fa_act_skip | length == 0 and _fa_act_group.lead == inventory_hostname
  ansible.builtin.include_role:
    name: act_triage
    apply:
      throttle: "{{ site_act_concurrency | default(3) | int }}"   # at most this many hosts run ACT at once, as the other ACT jobs
  vars:
    act_triage_mode: evidence
    act_triage_always: true
    act_triage_builtin_checks: false
    act_triage_allow: []
    act_triage_findings_extra: "{{ _fr | fapolicyd_act_findings(_ff | default({})) }}"
    act_triage_evidence_commands:
      - "rpm -q fapolicyd"
      - "grep -Ev '^[[:space:]]*(#|$)' {{ (fapolicyd_dir ~ '/fapolicyd.conf') | quote }}"
      - "fapolicyd-cli --list"
      - "ls -l {{ (fapolicyd_dir ~ '/rules.d/') | quote }} {{ (fapolicyd_dir ~ '/trust.d/') | quote }} 2>&1"
      - "ausearch -m FANOTIFY -ts {{ fapolicyd_since }} -i 2>&1 | tail -n 400"
    act_triage_evidence_text: "{{ _fr | fapolicyd_act_evidence(_ff | default({})) }}"
    act_triage_extra_instructions: "{{ _fa_act_prompt }}"
    # the provider and model of site_act; ACT only reads here, so a plain answer (no action tools, schema or "{")
    act_triage_env: "{{ _site_act_env_all | combine(_site_act_plain_env) | combine(site_act_env | default({})) }}"
    act_triage_fail_in_role: false
    act_triage_write_report: false

- name: Fapolicyd | the analysis of {{ _fa_act_group.lead }} - the same denials
  ansible.builtin.set_fact:
    act_triage_result: >-
      {{ hostvars[_fa_act_group.lead].act_triage_result
         | default({'status': 'error', 'summary': '', 'stop_reason': 'ACT did not run here: ' ~ _fa_act_group.lead
                    ~ ' has the same denials, and its analysis was not there.', 'commands': [], 'denied': []}) }}
  when: _fa_act_skip | length == 0 and _fa_act_group.lead != inventory_hostname

- name: Fapolicyd | the hosts with the same denials, said in the analysis
  ansible.builtin.set_fact:
    act_triage_result: >-
      {{ act_triage_result | combine({'summary': (_fa_act_group.same | site_act_same_note(_fa_act_group.lead))
                                                 | replace('findings', 'denials') ~ _nl ~ (act_triage_result.summary | default('')),
                                      'same_hosts': _fa_act_group.same, 'read_on': _fa_act_group.lead}) }}
  vars:
    _nl: "\n"                          # a line break (in a >- block, '\n' would stay two characters)
  when: >-
    _fa_act_skip | length == 0 and _fa_act_group.same | length > 1 and act_triage_result is defined
    and act_triage_result.status | default('') != 'error'

- name: Fapolicyd | this pass's signature is spent (a later pass groups on its own denials)
  ansible.builtin.set_fact:
    _site_act_sig: ""

- name: Fapolicyd | ACT ran on this host (its analysis goes in the report)
  ansible.builtin.set_fact:
    _fa_act_ran: true
  when: _fa_act_skip | length == 0
