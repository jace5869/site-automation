---
# Find the podman containers on this host. Read-only: nothing here changes the host, so it runs in
# Check mode (a dry run) too. Sets two facts:
#
# site_podman:      {enabled, installed, version, now (the host's clock, seconds since 1970),
#                    rootless (the setting), userns (user.max_user_namespaces; -1 = not read),
#                    userns_off (rootless podman cannot run here: user namespaces are off),
#                    userns_users (users whose podman said "user namespaces are not enabled"),
#                    users: the users whose containers were read
#                    [{name, uid, home, linger}], skipped: users that were NOT read
#                    [{user, uid, reason, linger, storage, wants (units that should start at
#                    boot), ignored, userns}], errors: what could not be read
#                    [{owner, what, command, message}]}
# site_containers:  one entry per container (or per container a unit should run but that does
#                   not exist right now), each:
#   owner, uid           root, or the user it belongs to (rootless)
#   run_as               '' for root; 'runuser -u USER -- env XDG_RUNTIME_DIR=/run/user/UID ' for a
#                        user: put it in front of podman / systemctl --user to run them as the owner
#   key                  OWNER/NAME (root and a user can each have a container called nginx)
#   name, id, image      id is '' for a container that does not exist (see state missing)
#   state, running       podman's state (running, exited, created, paused ...) or missing
#   exit_code, exited_at exited_at: when it last stopped, seconds since 1970 (0 = never)
#   oom_killed, health   health: '' (no healthcheck), healthy, unhealthy or starting
#   restart_policy, restart_count
#   unit, unit_scope     the systemd unit that runs it ('' = plain podman); system or user
#   unit_load, unit_active, unit_sub, unit_result, unit_file_state, unit_restarts   (systemctl show)
#   how                  how the unit was found: label (PODMAN_SYSTEMD_UNIT), quadlet, unit-file
#                        (a unit file that runs podman), unit-name (NAME.service / container-NAME.service)
#   quadlet_file         its Quadlet .container file, if any
#   should_run, why      should it be running, and why (see below)
#   ignored              matches podman_discover_ignore
# should_run: a unit runs it and the unit starts at boot (the Quadlet file has an [Install] section,
# or the unit is enabled), or its restart policy is always / unless-stopped. Anything else that is
# stopped - e.g. exited with code 0, no unit, no restart policy - was stopped on purpose.
#
# How: one script finds podman and the users to look at; then, per owner (root, then each user
# AS that user), `podman ps -a --format json`, ONE `podman container inspect` of all containers,
# the Quadlet files and unit files that run podman, and ONE `systemctl show` of those units.
# The output is parsed on the controller (plugins/filter/site_filters.py, podman_discovery).
# With user.max_user_namespaces = 0 (a STIG setting) no user can run podman at all: the users are not
# tried (each try would only fail with "user namespaces are not enabled"), only root's containers are
# read, and only a user named in podman_discover_users is reported (as not read, naming the setting).
# A user's podman ps that fails with "user namespaces are not enabled" is taken the same way.

- name: Podman | discovery is off (podman_discover_enabled)
  ansible.builtin.set_fact:
    site_podman: {enabled: false, installed: false, version: '', now: 0, rootless: false, users: [], skipped: [], errors: []}
    site_containers: []
  when: not (podman_discover_enabled | bool)

- name: Podman | installed? which users run containers?
  when: podman_discover_enabled | bool
  block:
    - name: Podman | installed? which users run containers?
      ansible.builtin.shell:
        cmd: |
          cd /
          pd=$(command -v {{ _pd_podman | default('podman') | quote }} 2>/dev/null)
          if [ -z "$pd" ]; then echo "podman none"; exit 0; fi
          echo "podman $pd"
          echo "version $(timeout {{ podman_discover_timeout | int }} podman --version 2>/dev/null | awk '{print $NF}')"
          now={{ _pd_now | default('') | string | quote }}
          echo "now ${now:-$(date +%s)}"
          echo "userns $(cat {{ _pd_userns_file | default('/proc/sys/user/max_user_namespaces') | quote }} 2>/dev/null | tr -d '[:space:]')"
          {% if podman_discover_rootless | bool %}
          subuid={{ _pd_subuid_file | default('/etc/subuid') | quote }}
          linger={{ _pd_linger_dir | default('/var/lib/systemd/linger') | quote }}
          rund={{ _pd_run_user_dir | default('/run/user') | quote }}
          usersd={{ _pd_users_quadlet_dir | default('/etc/containers/systemd/users') | quote }}
          extra={{ (podman_discover_users | map('string') | join(' ')) | quote }}
          pw() { getent passwd "$1" | head -n 1; }
          conmon=" $(ps -eo uid=,comm= 2>/dev/null | awk '$2 == "conmon" && $1 != 0 { print $1 }' | sort -u | tr '\n' ' ')"
          seen=" "
          for who in $( { printf '%s\n' $conmon $extra; ls -1 "$linger" 2>/dev/null;
                          sed -n 's/^\([^#:][^:]*\):.*/\1/p' "$subuid" 2>/dev/null; } | sort -u ); do
            line=$(pw "$who")
            if [ -z "$line" ]; then echo "nouser $who"; continue; fi
            name=$(printf '%s' "$line" | cut -d: -f1)
            uid=$(printf '%s' "$line" | cut -d: -f3)
            home=$(printf '%s' "$line" | cut -d: -f6)
            [ "$uid" = 0 ] && continue
            case "$seen" in *" $name "*) continue ;; esac
            seen="$seen$name "
            l=0; [ -e "$linger/$name" ] && l=1
            r=0; [ -d "$rund/$uid" ] && r=1
            s=0; [ -d "$home/.local/share/containers/storage" ] && s=1
            c=0; case "$conmon" in *" $uid "*) c=1 ;; esac
            x=0; case " $extra " in *" $name "*|*" $uid "*) x=1 ;; esac
            sub=0; grep -q -E "^($name|$uid):" "$subuid" 2>/dev/null && sub=1
            # what should start for them at boot, read here (as root) for users that are not checked:
            # Quadlet files with an [Install] section, and enabled user units
            w=0
            for f in $(find "$home/.config/containers/systemd" "$usersd/$uid" -type f \( -name '*.container' -o -name '*.kube' \) 2>/dev/null) \
                     $(find "$usersd" -maxdepth 1 -type f \( -name '*.container' -o -name '*.kube' \) 2>/dev/null); do
              grep -q '^[[:space:]]*\[Install\]' "$f" 2>/dev/null && w=$((w + 1))
            done
            w=$((w + $(find "$home/.config/systemd/user" -mindepth 2 -maxdepth 2 -path '*.wants/*' -name '*.service' 2>/dev/null | wc -l)))
            echo "user $name $uid linger=$l runtime=$r storage=$s conmon=$c subuid=$sub extra=$x wants=$w home=$home"
          done
          {% endif %}
          exit 0
        executable: /bin/bash
      register: _pd_host
      changed_when: false
      # the script ends with exit 0; anything else (sudo missing, no python ...) is an error, not "no podman"
      failed_when: _pd_host.rc | default(1) != 0 or (_pd_host.stdout_lines | default([]) | length == 0)
      check_mode: false

    - name: Podman | what was found
      ansible.builtin.set_fact:
        _pd_info: >-
          {%- set v = {'podman': '', 'version': '', 'now': 0, 'userns': -1, 'users': [], 'nouser': []} -%}
          {%- for line in _pd_host.stdout_lines | default([]) -%}
          {%-   set w = line.split(' ') -%}
          {%-   if w[0] == 'podman' -%}{%- set _ = v.update({'podman': '' if w[1:2] == ['none'] else w[1:] | join(' ')}) -%}
          {%-   elif w[0] == 'version' -%}{%- set _ = v.update({'version': w[1:] | join(' ')}) -%}
          {%-   elif w[0] == 'now' -%}{%- set _ = v.update({'now': w[1] | default(0) | int}) -%}
          {%-   elif w[0] == 'userns' -%}{%- set _ = v.update({'userns': (w[1] | int) if w[1:2] and w[1] is match('^[0-9]+$') else -1}) -%}
          {%-   elif w[0] == 'nouser' -%}{%- set _ = v.nouser.append(w[1] | default('')) -%}
          {%-   elif w[0] == 'user' and w | length >= 11 -%}
          {%-     set u = {'name': w[1], 'uid': w[2] | int} -%}
          {%-     for kv in w[3:10] -%}{%- set _ = u.update({kv.split('=')[0]: (kv.split('=')[1] | default('0')) | int}) -%}{%- endfor -%}
          {%-     set _ = u.update({'home': (w[10:] | join(' '))[5:]}) -%}
          {%-     set _ = v.users.append(u) -%}
          {%-   endif -%}
          {%- endfor -%}
          {{ v }}

    # user.max_user_namespaces = 0: no user is tried; a user named in podman_discover_users is listed as not read
    - name: Podman | the owners whose containers are read (root, and each user whose /run/user/UID exists)
      ansible.builtin.set_fact:
        _pd_owners: >-
          {%- set out = [{'name': 'root', 'uid': 0, 'home': '/root', 'linger': 0}] if _pd_info.podman else [] -%}
          {%- for u in _pd_info.users | sort(attribute='name') if _pd_info.podman and _pd_info.userns != 0
                and (u.conmon or u.linger or u.extra or (u.subuid and u.storage)) and u.runtime -%}
          {%-   set _ = out.append({'name': u.name, 'uid': u.uid, 'home': u.home, 'linger': u.linger}) -%}
          {%- endfor -%}
          {{ out }}
        _pd_skipped: >-
          {%- set out = [] -%}
          {%- for u in _pd_info.users | sort(attribute='name') if _pd_info.podman and _pd_info.userns != 0
                and (u.conmon or u.linger or u.extra or (u.subuid and u.storage)) and not u.runtime -%}
          {#-   left out when podman_discover_ignore leaves out all of the user's containers ('carol/.*') -#}
          {%-   set ns = namespace(ignored=false) -%}
          {%-   for p in podman_discover_ignore | default([]) if p -%}
          {%-     if (u.name ~ '/-') is search('^(?:' ~ p ~ ')$') -%}{%- set ns.ignored = true -%}{%- endif -%}
          {%-   endfor -%}
          {%-   set _ = out.append({'user': u.name, 'uid': u.uid, 'linger': u.linger, 'storage': u.storage, 'wants': u.wants, 'ignored': ns.ignored,
                                    'reason': 'no /run/user/' ~ u.uid ~ ' (the user is not logged in'
                                              ~ (' and linger is off' if not u.linger else '')
                                              ~ '): not read, because podman would have to create it'}) -%}
          {%- endfor -%}
          {%- for u in _pd_info.users | sort(attribute='name') if _pd_info.podman and _pd_info.userns == 0 and u.extra -%}
          {%-   set _ = out.append({'user': u.name, 'uid': u.uid, 'linger': u.linger, 'storage': u.storage, 'wants': 0, 'ignored': false,
                                    'userns': true, 'reason': _pd_userns_reason}) -%}
          {%- endfor -%}
          {%- for n in _pd_info.nouser if n in (podman_discover_users | map('string') | list) -%}
          {%-   set _ = out.append({'user': n, 'uid': -1, 'linger': 0, 'storage': 0, 'wants': 0, 'ignored': false, 'reason': 'no such user'}) -%}
          {%- endfor -%}
          {{ out }}

    # One script per owner. For a user every command runs AS that user (runuser ... env
    # XDG_RUNTIME_DIR=/run/user/UID), the same form the findings print, which works on RHEL 8 too.
    - name: Podman | containers, Quadlet files and units of each owner
      ansible.builtin.shell:
        cmd: |
          cd /
          unset DBUS_SESSION_BUS_ADDRESS
          set -f                      # a name a user chose is never a pattern
          T="timeout {{ podman_discover_timeout | int }}"
          {% if _pd_owner.name == 'root' %}
          as_owner() { $T "$@"; }
          sysctl() { $T systemctl "$@"; }
          quadlets() {
            for d in {{ podman_discover_quadlet_dirs | map('quote') | join(' ') }}; do
              [ -d "$d" ] && find "$d" -path "$d/users" -prune -o -type f \( -name '*.container' -o -name '*.kube' \) -print 2>/dev/null
            done
          }
          unitfiles() {
            set +f                    # the one place that wants a pattern: the *.service of a unit directory
            for d in {{ podman_discover_unit_dirs | map('quote') | join(' ') }}; do
              [ -d "$d" ] || continue
              grep -l -s -E '^Environment=.*PODMAN_SYSTEMD_UNIT|^ExecStart=.*podman' "$d"/*.service
              # podman-kube@<yaml>.service: the instance is only named where it is enabled (a .wants link)
              find "$d" -mindepth 2 -maxdepth 2 -path '*.wants/podman-kube@*.service' 2>/dev/null
            done
          }
          {% else %}
          as_owner() { $T runuser -u {{ _pd_owner.name | quote }} -- env XDG_RUNTIME_DIR=/run/user/{{ _pd_owner.uid | int }} "$@"; }
          sysctl() { as_owner systemctl --user "$@"; }
          usersd={{ _pd_users_quadlet_dir | default('/etc/containers/systemd/users') | quote }}
          quadlets() {
            as_owner find {{ (_pd_owner.home ~ '/.config/containers/systemd') | quote }} -type f \( -name '*.container' -o -name '*.kube' \) 2>/dev/null
            find "$usersd/{{ _pd_owner.uid | int }}" -type f \( -name '*.container' -o -name '*.kube' \) 2>/dev/null
            find "$usersd" -maxdepth 1 -type f \( -name '*.container' -o -name '*.kube' \) 2>/dev/null
          }
          unitfiles() {
            as_owner find {{ (_pd_owner.home ~ '/.config/systemd/user') | quote }} -maxdepth 1 -type f -name '*.service' 2>/dev/null |
              while read -r f; do as_owner grep -l -s -E '^Environment=.*PODMAN_SYSTEMD_UNIT|^ExecStart=.*podman' "$f"; done
            as_owner find {{ (_pd_owner.home ~ '/.config/systemd/user') | quote }} -mindepth 2 -maxdepth 2 -path '*.wants/podman-kube@*.service' 2>/dev/null
          }
          {% endif %}
          sec() { printf '\n@@@ %s\n' "$*"; }
          # What leaves this host is cut down HERE to the fields discovery reads: `podman ps --format json` carries each container's Command (its
          # arguments: passwords), `podman container inspect` its environment and healthcheck output, systemd's ExecStart the whole command line.
          # The raw output is never printed. The interpreter is the one Ansible uses on this host (or the first of the usual ones).
          PY=""
          for cand in {{ _pd_python | quote }} python3 /usr/libexec/platform-python python; do
            [ -n "$cand" ] && command -v "$cand" >/dev/null 2>&1 && { PY=$(command -v "$cand"); break; }
          done
          if [ -z "$PY" ]; then
            sec ps 127
            echo "no python interpreter on this host to cut the container listing down to what is read (it holds command lines and environment variables, which are not sent)"
            exit 0
          fi
          prog=$(cat <<'PY'
          import json, os, re, shlex, sys
          mode = sys.argv[1]
          data = sys.stdin.read()


          def keep(d, keys):
              return dict((k, d[k]) for k in keys if k in d)


          CUR = {"argv": None}                          # the unit file's own ExecStart, split as systemd splits it (set per unit in "show")


          def file_argv(path):
              """1.79.18: the first ExecStart= of a unit file, split with shell-like quoting - the real argument boundaries, which systemctl
              show's space-joined text loses. None when the file cannot be read or split."""
              try:
                  with open(path, encoding="utf-8", errors="replace") as fh:
                      text = re.sub(r"\\\n", " ", fh.read(1048576))
              except OSError:
                  return None
              for line in text.splitlines():
                  if line.strip().startswith("ExecStart="):
                      val = line.strip()[len("ExecStart="):].lstrip("-@:+!")
                      try:
                          return shlex.split(val)
                      except ValueError:
                          return None
              return None


          def podman_args(ex):
              """-> (podman's path, its arguments, exact): exact when the arguments come from the unit file (their boundaries known)."""
              fa = CUR["argv"]
              if fa and os.path.basename(fa[0]) == "podman":
                  return fa[0], fa[1:], True
              m = re.search(r"argv\[\]=(\S*podman)\s+([^;]*)", ex)
              return (m.group(1), m.group(2).split(), False) if m else ("", [], False)


          # Only words this table knows leave the host, never the token as it was: a global option can hold a proxy URL with a password.
          VERBS = ("run", "create", "start", "restart", "stop", "kill", "rm", "rmi", "ps", "exec", "kube", "play", "pod", "compose", "auto-update", "system",
                   "healthcheck", "image", "images", "volume", "network", "pull", "events", "info", "version", "login", "logout", "untag", "tag", "save", "load",
                   "export", "import", "generate", "cp", "wait", "unshare", "machine", "secret")
          SECOND = {"kube": ("play",), "play": ("kube",), "pod": ("start", "create", "restart", "stop", "rm", "ps")}
          FLAGS = ("-d", "-i", "-t", "-it", "-dit", "-di", "-dt", "--detach", "--rm", "--init", "--replace", "--tty", "--interactive", "--privileged", "--read-only",
                   "--sdnotify", "--no-healthcheck", "--log-driver-none")
          VALUED = ("-e", "--env", "-p", "--publish", "-v", "--volume", "--cidfile", "--network", "--net", "-u", "--user", "-w", "--workdir", "-l", "--label",
                    "--hostname", "-h", "--restart", "-m", "--memory", "--cpus", "--entrypoint", "--pod", "--userns", "--security-opt", "--cap-add", "--cap-drop",
                    "--device", "--log-driver", "--env-file", "--add-host", "--dns", "--secret", "--mount", "--tmpfs", "--pidfile", "--timeout")
          NAME = re.compile(r"^[A-Za-z0-9][A-Za-z0-9_.-]*$")


          def run_name(args):
              """The --name of `podman run/create` - only a podman option, only BEFORE the image (the first argument that is no option or value of
              one). An option this table does not know may or may not take a value: the end of the options is then unknown, and nothing is said."""
              k = 1
              while k < len(args):
                  a = args[k]
                  if a.startswith("--name="):
                      return a[len("--name="):] if NAME.match(a[len("--name="):]) else ""
                  if a == "--name":
                      return args[k + 1] if k + 1 < len(args) and NAME.match(args[k + 1]) else ""
                  if not a.startswith("-"):
                      return ""                                       # the image: the options are over
                  if "=" in a or a in FLAGS:
                      k += 1
                  elif a in VALUED:
                      k += 2
                  else:
                      return ""                                       # unknown: ambiguous
              return ""


          KNOWN = set(os.environ.get("PD_NAMES", "").split())


          def trusted(name, unit_id):
              """1.79.18: a name read from space-joined ExecStart text is kept only when it is a container podman listed, or the unit's own
              name (web.service, container-web.service): the argument boundaries are lost in that text, so a word of an argument's value
              could otherwise pass for a name."""
              base = unit_id.rsplit(".", 1)[0] if unit_id else ""
              return bool(name) and (name in KNOWN or base in (name, "container-" + name))


          def redact(ex, unit_id=""):
              """An ExecStart cut down to what discovery reads of it (the unit's kind and its container's name): no argument, no unknown word."""
              c = re.search(r"argv\[\]=(\S*(?:podman-compose|docker-compose)\b\S*)", ex)
              if c:
                  return "{ path=%s ; argv[]=%s ; }" % (c.group(1), c.group(1))
              path, args, exact = podman_args(ex)
              if not path:
                  return "{ argv[]=podman ; }" if "podman" in ex else ""
              while args and args[0].startswith("-") and "=" in args[0]:       # a global option with its value inline
                  args = args[1:]
              if args[:1] == ["container"]:
                  args = args[1:]
              sub = args[0] if args and args[0] in VERBS else ""
              kept = [sub] if sub else []
              if sub in ("run", "create"):
                  n = run_name(args)
                  if n and (exact or trusted(n, unit_id)):
                      kept += ["--name", n]
              elif sub == "start":
                  if "--all" in args or "-a" in args:
                      kept += ["--all"]
                  else:
                      rest = [a for a in args[1:] if not a.startswith("-") and NAME.match(a) and (exact or trusted(a, unit_id))]
                      kept += rest[-1:]
              elif sub in SECOND and len(args) > 1 and args[1] in SECOND[sub]:
                  kept += [args[1]]
              return "{ path=%s ; argv[]=%s %s ; }" % (path, path, " ".join(kept))


          if mode == "ps":
              rows = json.loads(data) if data.strip() else []
              out = []
              for p in rows if isinstance(rows, list) else []:
                  if not isinstance(p, dict):
                      continue
                  q = keep(p, ("Id", "ID", "Names", "Image", "State", "ExitCode", "ExitedAt", "Status", "IsInfra", "Restarts"))
                  lab = p.get("Labels") if isinstance(p.get("Labels"), dict) else {}
                  q["Labels"] = keep(lab, ("PODMAN_SYSTEMD_UNIT",))
                  out.append(q)
              json.dump(out, sys.stdout)
          elif mode == "inspect":
              rows = json.loads(data)
              out = []
              for c in rows if isinstance(rows, list) else []:
                  if not isinstance(c, dict):
                      continue
                  st = c.get("State") if isinstance(c.get("State"), dict) else {}
                  s2 = keep(st, ("Status", "ExitCode", "OOMKilled"))
                  for h in ("Health", "Healthcheck"):                 # podman 4+: Health; podman 3: Healthcheck - the status only, never its log
                      if isinstance(st.get(h), dict):
                          s2[h] = {"Status": st[h].get("Status")}
                  rp = ((c.get("HostConfig") or {}).get("RestartPolicy") or {})
                  out.append({"Id": c.get("Id"), "ImageName": c.get("ImageName"), "RestartCount": c.get("RestartCount"), "State": s2,
                              "HostConfig": {"RestartPolicy": {"Name": rp.get("Name")}}})
              json.dump(out, sys.stdout)
          elif mode == "show":
              # systemctl show: only the properties discovery reads (never Environment ...); a line that is no property (an error text) passes
              allowed = ("Id", "LoadState", "ActiveState", "SubState", "Result", "UnitFileState", "NRestarts", "WantedBy", "RequiredBy", "UpheldBy", "Type",
                         "InactiveExitTimestampMonotonic", "FragmentPath", "SourcePath")
              # per unit (blocks split by a blank line): its Id first, then its ExecStart cut down with it; a line that is no allowed
              # property (a continuation line of a multi-line argument, an error text) is dropped - the return code says a failure
              for block in re.split(r"\n\s*\n", data):
                  lines = block.splitlines()
                  uid = next((l[3:] for l in lines if l.startswith("Id=")), "")
                  frag = next((l[len("FragmentPath="):] for l in lines if l.startswith("FragmentPath=")), "")
                  CUR["argv"] = file_argv(frag) if frag else None
                  for line in lines:
                      key = line.split("=", 1)[0] if "=" in line else ""
                      if line.startswith("ExecStart="):
                          sys.stdout.write("ExecStart=" + redact(line[len("ExecStart="):], uid) + "\n")
                      elif key in allowed:
                          sys.stdout.write(line + "\n")
                  sys.stdout.write("\n")
          else:
              sys.exit(2)
          PY
          )
          out=$(as_owner podman ps -a --format json 2>/dev/null); rc=$?
          if [ $rc -eq 0 ]; then out=$(printf '%s' "$out" | "$PY" -c "$prog" ps 2>/dev/null); rc=$?; fi
          sec ps $rc
          if [ $rc -ne 0 ]; then
            as_owner podman ps -a --format json 2>&1 >/dev/null | tail -n 5
            exit 0
          fi
          printf '%s\n' "$out"
          unset out
          lst=$(as_owner podman ps -a --no-trunc --format '{% raw %}{{.ID}}|{{.Names}}|{{index .Labels "PODMAN_SYSTEMD_UNIT"}}{% endraw %}' 2>/dev/null)
          sec list $?
          printf '%s\n' "$lst"
          ids=$(printf '%s\n' "$lst" | cut -d'|' -f1 | grep -v '^$')
          if [ -n "$ids" ]; then
            raw=$(as_owner podman container inspect $ids 2>/dev/null); rc=$?
            proj=$(printf '%s' "$raw" | "$PY" -c "$prog" inspect 2>/dev/null)      # the survivors of a partial failure too; the raw buffer is never printed
            unset raw
            sec inspect $rc
            printf '%s\n' "$proj"
            unset proj
          fi
          units=""
          while IFS='|' read -r id name label; do
            [ -n "$id" ] || continue
            if [ -n "$label" ] && [ "$label" != "<no value>" ]; then units="$units $label"
            else units="$units $name.service container-$name.service"; fi
          done <<< "$lst"
          for f in $(quadlets | sort -u); do
            sec quadlet "$f"
            as_owner grep -E '^[[:space:]]*(\[[A-Za-z]+\]|(ContainerName|ServiceName|Image|Yaml|WantedBy|RequiredBy|UpheldBy)[[:space:]]*=)' "$f"
            sn=$(as_owner sed -n 's/^[[:space:]]*ServiceName[[:space:]]*=[[:space:]]*//p' "$f" | tail -n 1 | tr -d '[:space:]')
            b=$(basename "$f"); units="$units ${b%.*}.service ${sn:+${sn%.service}.service}"
          done
          for f in $(unitfiles | sort -u); do
            sec unitfile "$f"
            units="$units $(basename "$f")"
          done
          # a unit name is a systemd name (a label of a container, a file name of a user's Quadlet: nothing that says what to run or an option)
          units=$(printf '%s\n' $units | grep -E '^[A-Za-z0-9_.@:][A-Za-z0-9:_.@-]*$' | sort -u | tr '\n' ' ')
          if [ -n "${units// /}" ]; then
            out=$(sysctl show -p Id,LoadState,ActiveState,SubState,Result,UnitFileState,NRestarts,ExecStart,WantedBy,RequiredBy,UpheldBy,Type,InactiveExitTimestampMonotonic,FragmentPath -- $units 2>&1); rc=$?
            out=$(printf '%s\n' "$out" | PD_NAMES="$(printf '%s\n' "$lst" | cut -d'|' -f2 | tr ',' ' ')" "$PY" -c "$prog" show 2>/dev/null) || { rc=1; out="systemctl show: its output could not be cut down"; }
            sec show $rc
            printf '%s\n' "$out"
          fi
          sec end
          exit 0
        executable: /bin/bash
      loop: "{{ _pd_owners if (podman_discover_rootless | bool) else _pd_owners[:1] }}"
      loop_control:
        loop_var: _pd_owner
        label: "{{ _pd_owner.name }}"
      vars:
        _pd_python: >-
          {{ ansible_python_interpreter if ((ansible_python_interpreter | default('') | string | length) > 0 and not (ansible_python_interpreter | string).startswith('auto'))
             else (ansible_facts.discovered_interpreter_python | default('')) }}
      register: _pd_query
      changed_when: false
      failed_when: false
      check_mode: false
      no_log: true          # the listing and what a container prints are not for the job events (the inspect is cut down on the host as well)

    # a user whose podman said "user namespaces are not enabled" is taken as userns off (no warning),
    # but for a user named in podman_discover_users
    - name: Podman | the containers
      ansible.builtin.set_fact:
        site_containers: "{{ _pd_parsed.containers }}"
        site_podman:
          enabled: true
          installed: "{{ _pd_info.podman | length > 0 }}"
          version: "{{ _pd_info.version }}"
          now: "{{ _pd_info.now | int }}"
          rootless: "{{ podman_discover_rootless | bool }}"
          userns: "{{ _pd_info.userns | int }}"
          userns_off: "{{ _pd_info.podman | length > 0 and (podman_discover_rootless | bool) and (_pd_info.userns == 0 or _pd_parsed.userns_off | length > 0) }}"
          userns_users: "{{ _pd_parsed.userns_off }}"
          users: "{{ (_pd_owners[1:] if (podman_discover_rootless | bool) else []) | rejectattr('name', 'in', _pd_parsed.userns_off) | list }}"
          skipped: >-
            {#- podman said user namespaces are off: a user not read for another reason could not run podman either -#}
            {%- set out = _pd_skipped | list if not _pd_parsed.userns_off
                          else _pd_skipped | selectattr('uid', 'lt', 0) | list -%}
            {%- for u in _pd_owners[1:] if u.name in _pd_parsed.userns_off and u.name in (podman_discover_users | map('string') | list) -%}
            {%-   set _ = out.append({'user': u.name, 'uid': u.uid, 'linger': u.linger, 'storage': 0, 'wants': 0, 'ignored': false,
                                      'userns': true, 'reason': 'its podman says "user namespaces are not enabled" (user.max_user_namespaces,'
                                                                ~ ' a STIG setting): their containers cannot run or be read'}) -%}
            {%- endfor -%}
            {{ out }}
          errors: "{{ _pd_parsed.errors }}"
      vars:
        _pd_parsed: "{{ (_pd_query.results | default([])) | podman_discovery(ignore=podman_discover_ignore) }}"
