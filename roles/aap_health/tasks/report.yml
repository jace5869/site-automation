---
# The results: a self-contained HTML report and the JSON beside it, in aap_health_report_dir on the AAP host (the
# only files this job writes, also in Check mode); the FAIL and WARN lines in the job output; the counts as the job
# artifact aap_health; the email when aap_health_email is true.
- name: AAP health | report
  vars:
    _aaph_dir: "{{ aap_health_report_dir or ((_aaph.home or '/home/' ~ aap_health_user) ~ '/aap-health') }}"
    _aaph_stamp: "{{ '%Y%m%d-%H%M%S' | strftime((_aaph.now | int) or (now().strftime('%s') | int)) }}"
    _aaph_base: "{{ _aaph_dir }}/aap-health_{{ inventory_hostname | regex_replace('[^A-Za-z0-9.-]', '_') }}_{{ _aaph_stamp }}"
    _aaph_counts: "{{ _aaph_rows | aap_health_counts }}"
  block:
    - name: AAP health | report - the FAIL and WARN lines
      ansible.builtin.debug:
        msg: "{{ ['PASS ' ~ _aaph_counts.PASS ~ ', WARN ' ~ _aaph_counts.WARN ~ ', FAIL ' ~ _aaph_counts.FAIL] + (_aaph_rows | aap_health_problems) }}"

    - name: AAP health | report - its folder (as {{ aap_health_user }})
      ansible.builtin.file:
        path: "{{ _aaph_dir }}"
        state: directory
        mode: "0750"
      check_mode: false
      become: "{{ _aaph_become }}"
      become_user: "{{ aap_health_user }}"

    - name: AAP health | report - HTML
      ansible.builtin.template:
        src: report.html.j2
        dest: "{{ _aaph_base }}.html"
        mode: "0640"
      check_mode: false
      become: "{{ _aaph_become }}"
      become_user: "{{ aap_health_user }}"

    - name: AAP health | report - JSON
      ansible.builtin.copy:
        content: "{{ {'host': inventory_hostname, 'generated': _aaph_stamp, 'counts': _aaph_counts, 'results': _aaph_rows} | to_nice_json }}\n"
        dest: "{{ _aaph_base }}.json"
        mode: "0640"
      check_mode: false
      become: "{{ _aaph_become }}"
      become_user: "{{ aap_health_user }}"

    - name: AAP health | report - where it is
      ansible.builtin.set_fact:
        _aaph_report_file: "{{ _aaph_base }}.html"

    - name: AAP health | report - read it back, for the email (sent from the execution environment)
      ansible.builtin.slurp:
        src: "{{ _aaph_base }}.html"
      become: "{{ _aaph_become }}"
      become_user: "{{ aap_health_user }}"
      register: _aaph_html

    - name: AAP health | report - its address
      ansible.builtin.debug:
        msg: "Report: {{ _aaph_base }}.html and .json on {{ inventory_hostname }}"

    - name: AAP health | report - job artifact aap_health (counts and the FAIL / WARN lines)
      ansible.builtin.set_stats:
        data:
          aap_health:
            counts: "{{ _aaph_counts }}"
            problems: "{{ (_aaph_rows | aap_health_problems)[:50] }}"
            report: "{{ _aaph_base }}.html"
  rescue:
    - name: AAP health | report - could not be written
      ansible.builtin.debug:
        msg:
          - "The report could not be written to {{ _aaph_dir }}: {{ ansible_failed_result.msg | default('failed') }}"
          - "Set aap_health_report_dir to a folder {{ aap_health_user }} can write. The results:"
          - "{{ _aaph_rows | aap_health_problems }}"

# The report website (report_web_dest, when aap_health_web) and the email (report_email_to, when aap_health_email; and
# the launch box "Also email the report to"): through site_email, like every report - run in the execution environment
# (delegate_to localhost), as the other reports are: its smbprotocol, pywinrm and mail relay, not the AAP host's. Not
# reached: said so, and the report files are on the AAP host anyway.
- name: AAP health | the report website and the email
  when: >-
    (aap_health_email | bool and report_email_to | default([]) | length > 0) or report_email_also | default([]) | length > 0
    or (aap_health_web | bool and report_web_dest | default('') | string | trim | length > 0)
  block:
    - name: AAP health | the HTML report, for the email's attachment (in the execution environment)
      ansible.builtin.tempfile:
        suffix: .html
      delegate_to: localhost
      check_mode: false
      register: _aaph_attach
      when: _aaph_html.content is defined

    - name: AAP health | the HTML report, written there
      ansible.builtin.copy:
        content: "{{ _aaph_html.content | b64decode }}"
        dest: "{{ _aaph_attach.path }}"
        mode: "0600"
      delegate_to: localhost
      check_mode: false
      when: _aaph_attach.path is defined

    - name: AAP health | the report website and the email (site_email, in the execution environment)
      ansible.builtin.include_role:
        name: site_email
        apply:
          tags: [always]
          delegate_to: localhost
      vars:
        _aaph_counts: "{{ _aaph_rows | aap_health_counts }}"
        _report_web_skip: "{{ not aap_health_web | bool }}"
        _report_email_skip: "{{ not aap_health_email | bool and report_email_also | default([]) | length == 0 }}"
        _report_attachments: "{{ [{'path': _aaph_attach.path, 'filename': _aaph_report_file | basename}] if _aaph_attach.path is defined else [] }}"
        _report:
          title: "AAP health check: {{ _aaph_counts.FAIL }} FAIL, {{ _aaph_counts.WARN }} WARN - {{ inventory_hostname }}"
          subtitle: "read-only checks of the AAP host; nothing was changed"
          status: "{{ 'critical' if _aaph_counts.FAIL else 'warning' if _aaph_counts.WARN else 'ok' }}"
          # "Not checked" only when a check could not run here
          summary: >-
            {{ [{'label': 'FAIL', 'value': _aaph_counts.FAIL, 'status': 'critical' if _aaph_counts.FAIL else 'ok'},
                {'label': 'WARN', 'value': _aaph_counts.WARN, 'status': 'warning' if _aaph_counts.WARN else 'ok'},
                {'label': 'PASS', 'value': _aaph_counts.PASS}]
               + ([{'label': 'Not checked', 'value': _aaph_counts.SKIP}] if _aaph_counts.SKIP else []) }}
          # FAIL and WARN first, then every area's table (one line per check), each FAIL or WARN list under its area
          sections: "{{ _aaph_rows | aap_health_email_sections(_aaph_areas, aap_health_top | int) }}"
          footer: "{{ inventory_hostname }}{{ ' - the full report (sortable) is attached' if _aaph_report_file | default('') else '' }}"
  rescue:
    - name: AAP health | not on the report website / not emailed
      ansible.builtin.debug:
        msg: >-
          The report did not reach the report website or the email: {{ ansible_failed_result.msg | default('failed') | string | truncate(300) }}.
          They are sent from the execution environment (on the command line: this host) - it needs what the other reports
          need (smbprotocol for a share, the mail relay in reach) and the run started in this repository's folder (its
          ansible.cfg). The report files are on the AAP host either way.
  always:
    - name: AAP health | the HTML report's copy in the execution environment removed
      ansible.builtin.file:
        path: "{{ _aaph_attach.path }}"
        state: absent
      delegate_to: localhost
      check_mode: false
      when: _aaph_attach.path is defined
