---
# STIG (drift): scans the Linux host against the DISA STIG with OpenSCAP - the SCAP Security Guide's STIG profile
# for its RHEL version (RHEL 9: V2R9, RHEL 10: V1R2 in scap-security-guide 0.1.82) - or with Evaluate-STIG
# (check_stig_scanner), keeps each scan's report on the host, and compares the result with the host's checklist in STIG Manager (read-only: this check never writes
# to STIG Manager) and with the host's earlier scans. A rule STIG Manager has as Not a Finding that fails now, and
# passed in an earlier scan, is drift; one that has failed in every scan is listed as "the scan and the checklist
# disagree"; a rule that passed in an earlier scan and fails now is new. playbooks/stig_drift_report.yml runs it; the
# health check runs it only when asked by name (health_checks: [stig] - in no shortcut: a scan takes minutes).
# docs/STIG_DRIFT.md.

# ---- The scan, on the host --------------------------------------------------------------------------------------
check_stig_scanner: openscap             # openscap: oscap and the SCAP Security Guide (below); evaluate_stig: Evaluate-STIG, already on the host (the settings after these) - closer to checklists Evaluate-STIG filled. Changing it starts the host's history again (each scanner checks rules its own way)
check_stig_install: false                # true: install openscap-scanner and scap-security-guide when missing (dnf, from the host's own repositories); false: a host without them is listed as not scanned
check_stig_oscap: ""                     # the oscap program; empty = found in PATH (/usr/bin/oscap)
check_stig_profile: stig                 # the profile: stig, stig_gui (a host with a desktop), or a full profile id (xccdf_...)
check_stig_content_dir: /usr/share/xml/scap/ssg/content  # where scap-security-guide puts its datastreams (ssg-rhel<major>-ds.xml)
check_stig_datastream: ""                # another datastream on the host instead (e.g. a DISA SCAP benchmark, with check_stig_profile its profile id); empty = the SCAP Security Guide's for the host's RHEL version
check_stig_datastream_src: ""            # a datastream on the AAP side (in your repository, from playbooks/: files/stig/ssg-rhel9-ds.xml) copied to the host first - newer content than the host's repositories have; empty = none
check_stig_tailoring: ""                 # a tailoring file on the host (your site's changes to the profile, made with SCAP Workbench); empty = none
check_stig_tailoring_src: ""             # or a tailoring file on the AAP side (from playbooks/), copied to the host first; empty = none
check_stig_timeout: 1800                 # seconds the scan may take (OpenSCAP: one to five minutes; Evaluate-STIG: more)

# ---- Evaluate-STIG (check_stig_scanner: evaluate_stig) ------------------------------------------------------------
# Evaluate-STIG runs on the host as root with --Output CKLB into a folder of its own (deleted after), and the job reads
# the checklist of the host's RHEL STIG (check_stig_stigman_benchmarks: RHEL_9_STIG ...): Not a Finding = pass, Open =
# fail, Not Applicable, Not Reviewed = by hand. Its CKLB is kept in check_stig_dir (STIG Manager imports it). It needs
# PowerShell 7 (pwsh) on the host. The job never installs or updates Evaluate-STIG.
check_stig_evaluate: ""                  # Evaluate-STIG on the host: its folder, e.g. /opt/Evaluate-STIG - Evaluate-STIG_Bash.sh found there or in Src/Evaluate-STIG (its options start with --), else Evaluate-STIG.ps1 (run with pwsh) - or the script's own path
check_stig_evaluate_select: {}           # --SelectSTIG for each RHEL version, e.g. {"8": RHEL8, "9": RHEL9}: only the RHEL STIG is scanned (faster); its short name as your Evaluate-STIG lists it. {} = every STIG that applies to the host (the RHEL one is read); 1.79.4: also the answer keys job's STIGComments Name
check_stig_evaluate_args: []             # more arguments for Evaluate-STIG, e.g. ["--ScanType", "Classified", "--AnswerKey", "SITE"] (Evaluate-STIG.ps1: -ScanType ...); --Output and --OutputPath are the job's
# Evaluate-STIG's answer files (docs/STIG_DRIFT.md, "Answer files from a Windows share"): copied to each host before
# it runs, into a folder of this run (removed after it) that Evaluate-STIG is given - nothing kept on the host. From a
# Windows file share, read over SMB from the AAP side (no mount; the "Windows file share" credential): e.g.
# '\\fileserver.yourdomain.mil\stig\AnswerFiles'; or a folder on the AAP side (in your repository, from playbooks/:
# files/stig/answers). Not read (the share down, a wrong password): Evaluate-STIG is not run - each host is listed as
# not scanned, rather than scanned without its answers (which would mark Open what they answer, as drift).
check_stig_evaluate_answers: ""          # where your answer files are; "" = none copied: Evaluate-STIG uses its own (its AnswerFiles folder)
check_stig_evaluate_answers_arg: --AFPath   # Evaluate-STIG's option for their folder (the job checks the script has it; .ps1: -AFPath)
check_stig_evaluate_answers_patterns: ["*.xml"]   # the files taken (any case); sub-folders are not read
check_stig_evaluate_answers_user: ""     # the share's account (user@YOURDOMAIN.MIL); empty = the "Windows file share" credential's
check_stig_evaluate_answers_password: "" # its password (vault it); empty = the credential's
check_stig_evaluate_answers_auth: negotiate   # negotiate (Kerberos - FIPS too: user@YOURDOMAIN.MIL, the server's full name - else NTLM), ntlm, or kerberos (a ticket already in the job)
check_stig_evaluate_answers_encrypt: false    # true = encrypt (SMB 3) even when the share does not require it
check_stig_evaluate_answers_port: 445    # the share's port
check_stig_evaluate_answers_max_files: 500    # more files than this in the folder: not read (a wrong folder)
check_stig_evaluate_answers_max_mb: 20   # a file larger than this: not read
check_stig_evaluate_read: ""             # read the newest checklist (.cklb or .ckl) Evaluate-STIG already wrote under this folder on the host - its own schedule - instead of running it, e.g. /opt/STIG_Compliance ; empty = run it
check_stig_evaluate_output: CKLB        # Evaluate-STIG's --Output: CKLB, or CKL (the older XML checklist) if your version writes CKLB it then rejects itself
check_stig_evaluate_rejected: true       # a checklist Evaluate-STIG's own schema check rejects (it moves it to its Bad_CKL folder and names it - a check of its that failed can do that): true = read it from there anyway, said in the report with the checks that failed; false = the host is not scanned
check_stig_pwsh: ""                      # PowerShell 7 for Evaluate-STIG.ps1; empty = pwsh found in PATH

# ---- Kept on the host ----------------------------------------------------------------------------------------
check_stig_dir: /var/lib/site-automation/stig  # each scan's HTML report, results (gzip) and summary (JSON), and latest-report.html / latest-summary.json; root-only. A dry run keeps nothing
check_stig_keep: 10                      # how many scans are kept on the host (the oldest are deleted); the last one is what the next scan is compared with
check_stig_keep_report: true             # keep oscap's HTML report of each scan (about 4 MB)
check_stig_keep_results: true            # keep the XCCDF results of each scan (gzip, about 1 MB): what STIG Manager or eMASS can import

# ---- STIG Manager (read-only) ---------------------------------------------------------------------------------
# The job logs in as a Keycloak client with the client credentials grant - your autostig client, or another one -
# from the "STIG Manager API" credential (STIGMAN_TOKEN_URL, STIGMAN_CLIENT_ID, STIGMAN_CLIENT_SECRET), or from the
# check_stig_stigman_token_url / _client_id / _client_secret settings (keep the secret in a vault). The client needs
# the scope stig-manager:collection:read and a grant (Restricted is enough) in the collections to read.
check_stig_stigman_api: ""               # STIG Manager's API, e.g. https://stigman.example.mil/api ; empty = not compared with STIG Manager (only with the host's earlier scans)
check_stig_stigman_token_url: ""         # Keycloak's token endpoint (https://keycloak.example.mil/realms/stigman/protocol/openid-connect/token); empty = the credential's
check_stig_stigman_client_id: ""         # the client, e.g. autostig; empty = the credential's
check_stig_stigman_client_secret: ""     # its secret (vault it); empty = the credential's
check_stig_stigman_scope: ""             # scopes to ask for, e.g. "stig-manager:collection:read"; empty = the client's default scopes
check_stig_stigman_validate_certs: true  # check the HTTPS certificates of STIG Manager and Keycloak
check_stig_stigman_ca_path: ""           # a CA bundle on the AAP side to check them with (the DoD roots); empty = the execution environment's
check_stig_stigman_timeout: 60           # seconds per request

# Finding each host's asset. Set the collection per group or per host (group_vars, host_vars, or the inventory's
# variables in AAP): the asset is looked for only there. Empty = every collection the client can read; a host
# whose name matches assets in two collections is listed and not compared until its collection is set.
check_stig_stigman_collection: ""        # the collection this host's asset is in, e.g. "RHEL Servers"
check_stig_stigman_collections: []       # with no collection set: search only these collections ([] = every one the client can read)
# 1.79.7: with no collection set, a search leaves these collections out (* and ?, any case): archive, baseline, watcher
# and scan-tool copies of the same assets, which made a host "2 assets match". A host's own
# check_stig_stigman_collection is still used even when listed here. [] = search them all.
check_stig_stigman_collections_exclude: ["Archive*", "Base*", "Watcher*", "Eval-STIG*", "SCA*", "* SCA*", "*_SCA*"]
check_stig_stigman_asset: ""             # this host's asset name in STIG Manager; empty = the inventory name, then its short name (web01 for web01.example.mil); the asset's FQDN field matches too
check_stig_stigman_benchmarks: {"8": RHEL_8_STIG, "9": RHEL_9_STIG, "10": RHEL_10_STIG}  # the STIG Manager benchmark (STIG) for each RHEL version
check_stig_stigman_statuses: [saved, submitted, accepted]  # the reviews that count as the checklist (a rejected review does not); [accepted] = only what was accepted
check_stig_stigman_missing_severity: warning  # a host not found in STIG Manager (or its collection not readable): warning; critical; or none = listed in the report only

# ---- Findings ------------------------------------------------------------------------------------------------
check_stig_severity: {high: critical, medium: warning, low: warning}  # the finding for a drifted or new fail, by the rule's CAT (high = CAT I)
check_stig_disagree_severity: none       # a rule STIG Manager has as Not a Finding that has failed in every scan of the host (never passed, so nothing moved that the job saw): none = listed in the report only; low = a Low finding (listed, never fails the job); warning or critical = a finding
check_stig_ignore_rules: []              # rules OpenSCAP is known to get wrong at your site: never a finding, listed in the report as left out. SV-257985, V-257985, RHEL-09-255045 or the SCAP rule's name (sshd_disable_root_login); per group or host too
check_stig_list_max: 200                 # at most this many rows in the report's tables of rules left out and of fails STIG Manager has no review for
check_stig_rule_texts_timeout: 120       # 1.73.0b: seconds for all the texts' reads from STIG Manager together; the first read that fails (no answer, HTTP 5xx, 401/403) stops them - the report is made without the texts not read and says so in one line
check_stig_rule_texts: true              # 1.73.0: each rule the report lists with DISA's check text and fix text - from STIG Manager (one read per STIG revision; the client's scope stig-manager:stig:read) or Evaluate-STIG's checklist. On the website a rule's row opens to them, and Copy copies a text's command lines only; the email has each rule once, the first part of each text; the workbook has them in full. false = none (tasks/texts.yml)

# ---- The STIG recheck (playbooks/stig_recheck.yml, win_stig_recheck.yml) ----------------------------------------
check_stig_recheck: [open, not_reviewed]  # what STIG Manager has for a rule that the recheck checks again: open (a review of Open that counts), not_reviewed (no review that counts, or Not Reviewed); the rest is left to the STIG drift report
check_stig_recheck_rules: []             # only these rules (V-257985, SV-257985...) of those check_stig_recheck picks; [] = all of them. The site portal's "fix one rule" (workflow 47) rechecks its rule alone
check_stig_recheck_carry_forward: false   # true = a rule DISA changed since the scan's STIG (held back otherwise) gets the earlier revision's Not a Finding / Not Applicable written to STIG Manager's revision when that review counts (check_stig_stigman_statuses) and the scan agrees; the comment says it was carried forward. For until Evaluate-STIG has STIG Manager's revision
# Workflow 37 - STIG Manager updated, with an approval (docs/STIG_DRIFT.md, "Updating STIG Manager, with an approval"):
# the recheck's check lists the reviews to write and hands them to the approval step; playbooks/stigman_update.yml
# writes them after it. This job itself never writes to STIG Manager.
check_stig_update_workflow: false         # true on workflow 37's check only: the reviews to write in the report, handed on (set_stats stigman_update_plan), the job fails on purpose (NEEDS APPROVAL)
check_stig_update: [fixed, now_na, answered]  # what is written once approved: fixed (Open, passes now: Not a Finding), now_na (Open, Not Applicable now), answered (Not Reviewed: as the scan says - a fail is Open)
# 1.69.1: still open (Open in STIG Manager, the scan still fails it) written again in the same approval: Open, this scan's detail
# and today's date in the comment, with check_stig_update_status - the review shows when it was last checked (Refreshed in the
# plan). And listed, never written: a review the recheck wrote Open that a person set to Not a Finding / Not Applicable
# since, while the scan still says Open. false = as before 1.69.1 (still open: nothing written)
check_stig_update_refresh: true
check_stig_update_overwrite_accepted: true    # 1.69.1: true = an Accepted review is written like the others, with check_stig_update_status (as before 1.69.1); false = listed as Protected, never written. The site portal's STIG actions (workflows 46-48) follow it
# 1.69.1: a review whose detail or comment says one of these is never written by site-automation - the STIG recheck's
# update (workflow 37, the site portal's 46-48) and the checklist import (workflow 40) - and listed as Protected, with the
# word. Whole words or phrases, any case: RA is not RAID, grant or ORACLE; POA&M also POA & M; a word longer than two
# letters also with an s (POA&Ms). [] = none. Checked again just before each write.
stigman_protect_words: [RA, Risk Acceptance, POAM, POA&M]
check_stig_update_status: submitted       # the reviews' status as written: saved, submitted, or accepted (the collection must allow it, and the client's grant)
check_stig_update_skip_attachments: true     # a review with attachments in STIG Manager (evidence a person attached) is left out of the plan and never written; false = written like the others
check_stig_update_detail_max: 8000        # at most this many characters of what the scan found, as each review's detail
# A Linux host with no asset in STIG Manager (0.72.0): with check_stig_stigman_collection set, workflow 37's check scans
# it in full and plans its asset (named check_stig_stigman_asset, else the short name; the FQDN the inventory name) with
# its RHEL STIG, and the scan's answers as its reviews; created only after the approval. Its client needs Manage.
check_stig_update_create_assets: false    # true = create the missing assets (behind the approval); false = listed as not found
# 1.83.0, where a new asset goes (the STIG full scan and the STIG drift scan; workflow 40's router, site_ckl_import): a
# host's own check_stig_stigman_collection first, then the first of these that fits. A route has a collection and any of:
# match (its inventory name or check_stig_stigman_asset), stigs (1.103.0: the STIG it was scanned with, its id or title),
# roles, tech_areas (the checklist's), os (rhel or windows) - * and ?, any case (a [ is a [); a list, or text with commas or
# one per line; each key given must fit, and a key with no value stops the job (1.103.1). The first route
# that fits ANY of a host's STIGs takes the whole host (one collection per asset): put the specific STIG rules first. No
# route and no collection: listed (no collection for a new asset), never guessed. Your collections' names go in your
# all.yml, e.g.
#   - {match: "*DC*", stigs: ["*Active_Directory*"], collection: "<Directory servers>"}
#   - {stigs: ["*Cisco*", "*Palo_Alto*"], collection: "<Networks>"}
#   - {os: windows, collection: "<Platforms>"}
check_stig_stigman_collection_routes: []
# 1.83.0, the STIG drift scan's check (its template sets it): a host with no asset is scanned in full and planned as a
# new asset by the checklist import's planner (the routes above), Linux and Windows alike - not the recheck's own
# Linux-only create (check_stig_stigman_collection needed). With check_stig_update_workflow and _create_assets.
check_stig_update_new_by_import: false
# 1.83.0, the artifact a workflow's check hands its plan on as. The STIG workflows' Windows checks (their templates set
# it) use stigman_update_plan_windows: the Linux and the Windows check run side by side, each with its own gate, and
# STIG Manager - update writes both after the one approval.
check_stig_update_plan_var: stigman_update_plan

# ---- STIG answer keys (1.75.0; 1.76.0: many hosts, the automatic pick; playbooks/stig_answer_keys.yml) - Linux, Evaluate-STIG with pwsh -----
answer_keys_rules: []                    # the rules to draft an answer key for: V- or SV- ids (V-257777, SV-257900; from a survey: a text, a comma or space between; RHEL 8, 9 and 10 ids mixed - each host takes those of its STIG), at most answer_keys_max_rules; [] = picked from STIG Manager (its Open and Not Reviewed rules for each host - needs check_stig_stigman_api)
answer_keys_pick: not_reviewed           # 1.76.0, the automatic pick: not_reviewed (the default: where Evaluate-STIG cannot decide, a key pays off), open or both - a rule Evaluate-STIG checks itself and finds Open stays Open with a key, unless the site's values differ
answer_keys_cat: [1, 2, 3]               # 1.76.0, the automatic pick: the CATs to take (1 = CAT I ...); never a rule Not a Finding or Not Applicable, never a review with RA / POA&M words (stigman_protect_words) or attachments
answer_keys_max_rules: 150               # 1.76.0: at most this many rules per STIG (CAT I first; the report says how many were left out), and in answer_keys_rules
answer_keys_max_hosts: 50                # 1.76.0: at most this many hosts a run (more: the job stops and says so) - one host per STIG release is enough for the blocks
answer_keys_skip_answered: null          # 1.76.0: leave out the rules your answer files (check_stig_evaluate_answers, read-only) already have an AnswerKey of this Name for - listed as "already in your answer file"; null = yes when check_stig_evaluate_answers is set; 1.79.4: read for the STIGComments Names whenever it is set
answer_keys_name: ""                     # the AnswerKey's Name in the blocks; empty = the --AnswerKey of check_stig_evaluate_args, else DEFAULT
answer_keys_values: {}                   # the site's own values a rule needs, e.g. {min_release: '9.4', world_writable_owners: [root, sys, bin, appuser]} (from a survey: a text, YAML or name: value lines; a list as names with a comma or space between) - each block says which it used; a rule that needs one not given is "Not drafted" with the line to add (docs/STIG_ANSWER_KEYS.md, Site values)
answer_keys_act: true                    # a rule no fixed pattern fits: ACT drafts its ValidationCode on the AAP side (evidence mode: it runs no command, nothing on the trial host), marked "drafted by ACT - read it before you use it"; false = written by hand
answer_keys_trial: false                 # 1.76.4: try each draft once on the host, in a read-only sandbox (systemd-run; docs/STIG_ANSWER_KEYS.md, The trial) - off by default until the sandbox is hardened further: false = the read-only check only, nothing else runs on the host, and each block is offered marked "not tried" (read it, try it on a test host first); true = tried as in 1.76.1
answer_keys_trial_timeout: 60            # seconds each ValidationCode may run in its trial on the host
answer_keys_cross_check: true            # 1.77.0, the cross-check: for each block, Evaluate-STIG, STIG Manager (a person's review after the last scan), the code in the trial and ACT on its own side by side - Agree, Need a look or Too little to compare; never changes a block. ACT gets DISA's check text and the host's read-only evidence (DISA's commands on the read-only list, else the code's own; run once on the trial host and where a person reviewed the rule), never the code; false = no cross-check
answer_keys_cross_check_act_max: 50      # 1.77.0: at most this many ACT calls a run for the cross-check (hosts with the same evidence share one); past it the rule says "not asked (the cap, answer_keys_cross_check_act_max)"
answer_keys_evidence: web                # 1.77.0: a host's text in the reports of both answer keys jobs (what the trial or the code read, Evaluate-STIG's comment, the cross-check's evidence) - web: on the report website, redacted, at most 20 lines and 2000 characters a rule; never in the email or its workbook (statuses, counts and rule ids only); none: nowhere but the AAP job's output (admin-only), and the cross-check asks ACT nothing
# ---- STIG answer keys - try my answer file (1.77.0, playbooks/stig_answer_keys_try.yml): your answer files on test hosts -----
answer_keys_try_hosts: 10                # at most this many test hosts in one run (target and the Limit); Evaluate-STIG runs twice on each, with and without your answer files (check_stig_evaluate_answers)
