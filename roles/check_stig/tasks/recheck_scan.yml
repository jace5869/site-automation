---
# The STIG recheck's scan (tasks/recheck.yml), and the STIG full scan's (tasks/full_scan.yml, 1.83.0): the answer files
# staged, Evaluate-STIG (or oscap) run - with _stig_scan_vulns only those rules, [] every rule - their folders removed.
# Input: _stig_scan_on (bool), _stig_scan_vulns, _stig_scan_copy_to ('' or a folder the job made: the checklist copied
# there, in a dry run too). Output: _stig_scan (site_stig_scan's result).
- name: STIG | OpenSCAP's packages and content (check_stig_install, check_stig_datastream_src, check_stig_tailoring_src)
  ansible.builtin.include_tasks: content.yml
  when: _stig_scan_on | bool and _stig_scan_content | default(true) | bool   # the full scan: Evaluate-STIG, no SCAP content

- name: STIG | answer files from your share for Evaluate-STIG (check_stig_evaluate_answers)
  ansible.builtin.set_fact:
    _stig_af_on: >-
      {{ check_stig_scanner | string == 'evaluate_stig' and check_stig_evaluate_answers | length > 0
         and not check_stig_evaluate_read | default('') | length > 0 and _stig_scan_on | bool }}

- name: STIG | answer files - used in this run?
  ansible.builtin.debug:
    msg: >-
      {{ check_stig_scanner | stig_answers_why(check_stig_evaluate_answers, check_stig_evaluate_read | default(''),
                                               ansible_play_hosts | map('extract', hostvars)
                                               | map(attribute='_stig_recheck_vulns', default=['every rule']) | select | list) }}
  run_once: true

# 1.77.0c: the answer files are staged inside the block, so a copy that fails part way (a full disk) still has its
# folders removed by the always below (as Try my answer file does)
- name: STIG | answer files staged, the scan, then the answer files' folders removed
  block:
    - name: STIG | answer files - read, and copied to each host for this run
      ansible.builtin.include_tasks: answers.yml
      when: _stig_af_on | bool

    - name: STIG recheck | check those rules again on the host (only those - the scan's history is left alone)
      site_stig_scan:
        dir: "{{ check_stig_dir }}"
        save: "{{ not ansible_check_mode and _stig_scan_save | default(true) | bool }}"   # a dry run (and the full scan) keeps nothing
        oscap: "{{ check_stig_oscap }}"
        content_dir: "{{ check_stig_content_dir }}"
        datastream: "{{ (check_stig_dir ~ '/content/' ~ (check_stig_datastream_src | basename)) if check_stig_datastream_src else check_stig_datastream }}"
        profile: "{{ check_stig_profile }}"
        tailoring: "{{ (check_stig_dir ~ '/content/' ~ (check_stig_tailoring_src | basename)) if check_stig_tailoring_src else check_stig_tailoring }}"
        timeout: "{{ check_stig_timeout | int }}"
        scanner: "{{ check_stig_scanner }}"
        evaluate: "{{ check_stig_evaluate }}"
        evaluate_select: "{{ check_stig_evaluate_select }}"
        evaluate_args: "{{ check_stig_evaluate_args }}"
        evaluate_read: "{{ check_stig_evaluate_read }}"
        evaluate_output: "{{ check_stig_evaluate_output }}"
        evaluate_rejected: "{{ check_stig_evaluate_rejected | bool }}"
        pwsh: "{{ check_stig_pwsh }}"
        benchmarks: "{{ check_stig_stigman_benchmarks }}"
        answers: "{{ _stig_af_host.path | default('') if _stig_af_on | bool else '' }}"
        answers_arg: "{{ check_stig_evaluate_answers_arg }}"
        answers_error: "{{ _stig_af.error | default('') if _stig_af_on | bool else '' }}"
        answers_source: "{{ check_stig_evaluate_answers }}"
        answers_count: "{{ _stig_af.files | default([]) | length }}"
        vulns: "{{ _stig_scan_vulns }}"        # [] = every rule (a new asset, the full scan)
        copy_to: "{{ _stig_scan_copy_to | default('') }}"   # 1.83.0: the full scan takes the checklist to the AAP side
        history: false
      register: _stig_scan
      check_mode: false             # only reads; in a dry run (save: false) nothing is kept on the host
      when: _stig_scan_on | bool
  always:
    - name: STIG | answer files - this run's folders removed
      ansible.builtin.include_tasks: answers_done.yml
      when: _stig_af_on | bool

- name: STIG | answer files - what Evaluate-STIG did with them on this host
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }}: given {{ _stig_scan.answers.count }} answer file(s) from {{ _stig_scan.answers.source }};
      {{ _stig_scan.answers | stig_answers_used(true) }}
  when: _stig_af_on | bool and _stig_scan.answers.used is defined
