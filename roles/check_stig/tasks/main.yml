---
# STIG DRIFT. The scan runs on the host (library/site_stig_scan.py: oscap with the STIG profile, or Evaluate-STIG with
# check_stig_scanner: evaluate_stig - its checklist read; one result per STIG rule; the scan's report, results or
# checklist and summary kept in check_stig_dir on the host). STIG Manager is read once for
# every host, from the AAP side (library/site_stigman_read.py, GET only). Then each host is compared
# (plugins/filter/stig_filters.py):
#   stig:drift          a rule STIG Manager has as Not a Finding (or Not Applicable) fails now, and it passed on the host
#                       in an earlier scan
#   stig:new            a rule that passed in an earlier scan fails now (and STIG Manager does not have it open)
#   stig:disagree       a rule STIG Manager has as Not a Finding has failed in every scan of the host - only with
#                       check_stig_disagree_severity warning or critical; by default the report lists them
#   stig:stigman        the host's asset was not found in STIG Manager, or could not be read (check_stig_stigman_missing_severity)
#   stig:not-scanned    no oscap or no STIG content on the host (no Evaluate-STIG, or no checklist of the host's RHEL
#                       STIG), or the scan failed
# The report (playbooks/stig_drift_report.yml) also lists where the scan and the checklist disagree, what is fixed on
# the host but still Open in STIG Manager, the rules left out (check_stig_ignore_rules), and the fails STIG Manager
# has no review for.

- name: STIG | check_stig_disagree_severity is none, warning or critical
  ansible.builtin.assert:
    that: check_stig_disagree_severity | string in ['none', 'warning', 'critical']
    fail_msg: "check_stig_disagree_severity must be none, warning or critical (it is {{ check_stig_disagree_severity }})"
    quiet: true

- name: STIG | check_stig_scanner is openscap or evaluate_stig
  ansible.builtin.assert:
    that: check_stig_scanner | string in ['openscap', 'evaluate_stig']
    fail_msg: "check_stig_scanner must be openscap or evaluate_stig (it is {{ check_stig_scanner }})"
    quiet: true

- name: STIG | install openscap-scanner and scap-security-guide (check_stig_install)
  ansible.builtin.dnf:
    name: [openscap-scanner, scap-security-guide]
    state: present
  when: check_stig_install | bool and check_stig_scanner == 'openscap'

- name: STIG | the folder for them on the host (root-only)
  ansible.builtin.file:
    path: "{{ check_stig_dir }}/content"
    state: directory
    mode: "0700"
  when: check_stig_datastream_src | length > 0 or check_stig_tailoring_src | length > 0

- name: STIG | the datastream and tailoring file from the AAP side (check_stig_datastream_src, check_stig_tailoring_src)
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ check_stig_dir }}/content/{{ item.src | basename }}"
    mode: "0600"
  loop: >-
    {{ ([{'src': check_stig_datastream_src}] if check_stig_datastream_src else [])
       + ([{'src': check_stig_tailoring_src}] if check_stig_tailoring_src else []) }}
  loop_control:
    label: "{{ item.src }}"

- name: STIG | scan (oscap with the STIG profile, or Evaluate-STIG) and keep the result on the host
  site_stig_scan:
    dir: "{{ check_stig_dir }}"
    keep: "{{ check_stig_keep | int }}"
    save: "{{ not ansible_check_mode }}"   # a dry run scans (it only reads) and keeps nothing
    keep_report: "{{ check_stig_keep_report | bool }}"
    keep_results: "{{ check_stig_keep_results | bool }}"
    oscap: "{{ check_stig_oscap }}"
    content_dir: "{{ check_stig_content_dir }}"
    datastream: "{{ (check_stig_dir ~ '/content/' ~ (check_stig_datastream_src | basename)) if check_stig_datastream_src else check_stig_datastream }}"
    profile: "{{ check_stig_profile }}"
    tailoring: "{{ (check_stig_dir ~ '/content/' ~ (check_stig_tailoring_src | basename)) if check_stig_tailoring_src else check_stig_tailoring }}"
    timeout: "{{ check_stig_timeout | int }}"
    scanner: "{{ check_stig_scanner }}"
    evaluate: "{{ check_stig_evaluate }}"
    evaluate_select: "{{ check_stig_evaluate_select }}"
    evaluate_args: "{{ check_stig_evaluate_args }}"
    evaluate_read: "{{ check_stig_evaluate_read }}"
    evaluate_output: "{{ check_stig_evaluate_output }}"
    evaluate_rejected: "{{ check_stig_evaluate_rejected | bool }}"
    pwsh: "{{ check_stig_pwsh }}"
    benchmarks: "{{ check_stig_stigman_benchmarks }}"
  register: _stig_scan
  check_mode: false             # the scan only reads; in a dry run (save: false) nothing is kept on the host

- name: STIG | read every host's checklist from STIG Manager (read-only, once, from the AAP side)
  ansible.builtin.import_tasks: stigman.yml
  vars:
    _stig_sm_entries: >-
      {%- set out = [] -%}
      {%- for h in ansible_play_hosts if hostvars[h]._stig_scan is defined and hostvars[h]._stig_scan.scanned | default(false) -%}
      {%-   set hv = hostvars[h] -%}
      {%-   set names = [hv.check_stig_stigman_asset] if hv.check_stig_stigman_asset | default('') else [h, h.split('.')[0]] -%}
      {%-   set _ = out.append({'host': h, 'names': names | unique | list, 'collection': hv.check_stig_stigman_collection | default(''),
                                'benchmark': check_stig_stigman_benchmarks[hv._stig_scan.major | string] | default('')}) -%}
      {%- endfor -%}
      {{ out }}

- name: STIG | compare (STIG Manager, the earlier scans) and the findings
  ansible.builtin.set_fact:
    check_stig_result: >-
      {{ _stig_scan | stig_compare(_sm_host, inventory_hostname, check_stig_severity, check_stig_stigman_statuses,
                                   check_stig_stigman_api | length > 0, check_stig_stigman_missing_severity,
                                   check_stig_ignore_rules, check_stig_disagree_severity | string, check_stig_scanner) }}
  vars:
    _sm_host: >-
      {{ (_stig_sm.hosts | default({}))[inventory_hostname]
         | default({'status': 'error', 'why': _stig_sm.error} if _stig_sm.error | default('') else {}) }}

- name: STIG | add them to this host's findings
  ansible.builtin.set_fact:
    site_findings: "{{ site_findings | default([]) + check_stig_result.findings }}"

- name: STIG | what was found
  ansible.builtin.debug:
    msg: "{{ check_stig_result | stig_lines }}"
