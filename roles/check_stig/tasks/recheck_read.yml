---
# The STIG recheck, first step (Linux: tasks/recheck.yml; Windows: roles/win_check_stig/tasks/recheck.yml): what to check
# again is read from STIG Manager (read-only, once, from the AAP side) - each host's rules it has Open or Not Reviewed
# (check_stig_recheck) - into _stig_recheck_vulns (V-257985 ...). Linux: the host's RHEL STIG; Windows
# (_stig_recheck_windows): every STIG of the server's asset and of its web site and database assets. A Linux host with no
# asset (workflow 37's check, check_stig_update_create_assets, its collection set): every rule of its STIG, scanned in
# full (_stig_recheck_new) - the asset and its reviews written once approved.
- name: STIG recheck | STIG Manager is set (what to check again is read from it)
  ansible.builtin.assert:
    that: check_stig_stigman_api | length > 0
    fail_msg: >-
      The STIG recheck reads what to check from STIG Manager: set check_stig_stigman_api and the "STIG Manager API"
      credential, as for the STIG drift report (docs/STIG_DRIFT.md)
    quiet: true

- name: STIG recheck | check_stig_recheck is open and / or not_reviewed
  ansible.builtin.assert:
    that:
      - check_stig_recheck | length > 0
      - check_stig_recheck | difference(['open', 'not_reviewed']) | length == 0
    fail_msg: "check_stig_recheck must list open, not_reviewed or both (it is {{ check_stig_recheck }})"
    quiet: true

- name: STIG recheck | the host's RHEL version (its STIG in STIG Manager)
  ansible.builtin.setup:
    gather_subset: [min]
    filter: [ansible_distribution_major_version]
  when: not _stig_recheck_windows | default(false) and ansible_distribution_major_version is not defined

- name: STIG recheck | read what each host has Open or Not Reviewed in STIG Manager (read-only, once, from the AAP side)
  ansible.builtin.import_tasks: stigman.yml
  vars:
    _stig_sm_entries: >-
      {%- set out = [] -%}
      {%- for h in ansible_play_hosts -%}
      {%-   set hv = hostvars[h] -%}
      {%-   set names = [hv.check_stig_stigman_asset] if hv.check_stig_stigman_asset | default('') else [h, h.split('.')[0]] -%}
      {%-   set e = {'host': h, 'names': names | unique | list, 'collection': hv.check_stig_stigman_collection | default('')} -%}
      {%-   if _stig_recheck_windows | default(false) -%}
      {%-     set _ = out.append(e | combine({'every': true})) -%}
      {%-   else -%}
      {%-     set _ = out.append(e | combine({'rules': true,
                'benchmark': check_stig_stigman_benchmarks[hv.ansible_distribution_major_version | default('') | string] | default('')})) -%}
      {#-     1.68.0 (Codex P1): never with check_stig_recheck_rules ("fix one rule", workflow 47): a host whose asset is gone is
              not made one, nor scanned in full for it, on that rule's approval #}
      {#-     1.83.0: not with check_stig_update_new_by_import (the STIG drift scan) - a host with no asset is scanned in full
              and planned by the checklist import's planner instead (tasks/full_scan.yml, full_plan.yml: the routes) #}
      {%-     if hv.check_stig_update_workflow | default(false) | bool and hv.check_stig_update_create_assets | default(false) | bool
               and hv.check_stig_stigman_collection | default('') and not hv.check_stig_update_new_by_import | default(false) | bool
               and not hv.check_stig_recheck_rules | default([]) -%}
      {%-       set _ = out[-1].update({'create': {'name': hv.check_stig_stigman_asset | default('') or h.split('.')[0],
                                                   'fqdn': h if '.' in h else ''}}) -%}
      {%-     endif -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ out }}

# check_stig_recheck_rules (the site portal's "fix one rule", workflow 47): the scanner's rules AND what is compared and
# planned are that rule alone - STIG Manager's answer is cut to it (stig_only_sm), so a scan that read more (Evaluate-STIG
# without -SelectVuln, a full scan, a full checklist already there) never plans another rule's review (1.68.0, Codex P1)
- name: STIG recheck | the rules to check again on this host
  ansible.builtin.set_fact:
    # 1.69.1 (check_stig_update_refresh): and the rules a person set to Not a Finding / Not Applicable since our Open - read, never written
    _stig_recheck_vulns: >-
      {{ _sm_host | stig_recheck_vulns(check_stig_stigman_statuses, check_stig_recheck + (['person'] if check_stig_update_refresh | default(true) | bool else []))
         | stig_only_rules(check_stig_recheck_rules) }}
    _stig_recheck_sm: "{{ _sm_host }}"
    _stig_recheck_new: "{{ _sm_host.create is defined }}"
    # 1.83.0 (the STIG drift scan): no asset - scanned in full and planned as a new one by the checklist import's planner
    _stig_new_by_import: >-
      {{ check_stig_update_workflow | default(false) | bool and check_stig_update_create_assets | default(false) | bool
         and check_stig_update_new_by_import | default(false) | bool and not check_stig_recheck_rules | default([])
         and _sm_host.status | default('') == 'not_found' }}
  vars:
    _sm_host: >-
      {{ (_stig_sm.hosts | default({}))[inventory_hostname]
         | default({'status': 'error', 'why': _stig_sm.error} if _stig_sm.error | default('') else {})
         | stig_only_sm(check_stig_recheck_rules | default([])) }}

- name: STIG recheck | what will be checked again
  ansible.builtin.debug:
    msg: >-
      {{ (_stig_recheck_vulns | length) ~ ' rules Open or Not Reviewed in STIG Manager: ' ~ (_stig_recheck_vulns[:20] | join(', '))
         ~ (' and ' ~ (_stig_recheck_vulns | length - 20) ~ ' more' if _stig_recheck_vulns | length > 20 else '')
         if _stig_recheck_vulns and not _stig_recheck_new else
         ('no asset in STIG Manager - ' ~ _stig_recheck_sm.create.name ~ ' to create in ' ~ _stig_recheck_sm.create.collection
          ~ ' once approved, with ' ~ _stig_recheck_sm.create.benchmark ~ ' ' ~ _stig_recheck_sm.create.revision
          ~ ': every rule checked (a full scan)') if _stig_recheck_new else 'nothing to check again: ' ~ (_stig_recheck_sm.why | default('') or 'no rule Open or Not Reviewed') }}
