---
# STIG ANSWER KEYS (1.75.0; 1.76.0: many hosts, the automatic pick), playbooks/stig_answer_keys.yml - this file runs on
# EACH host (in parallel, the forks): for the rules a person picks (answer_keys_rules), or - none given - the rules STIG
# Manager has Open or Not Reviewed for the host (answer_keys_pick, answer_keys_cat, answer_keys_max_rules), Evaluate-STIG's
# own result for those rules alone. Nothing is written anywhere: STIG Manager is read with GET only, Evaluate-STIG runs
# for the picked rules alone with no answer files and none of check_stig_evaluate_args (its own output folder removed
# after), nothing goes to the share. A host that cannot be reached or fails is listed - the others go on.
#   1. the rules: asked, or picked from STIG Manager (its reviews of the host's asset, GET)
#   2. Evaluate-STIG's own result for them on the host (ExpectedStatus): only Open or Not Reviewed get a key
#   3. _ak_h: what this host gave - its STIG and release, each rule's result - for answer_keys_group.yml (the AAP side)
- name: Answer keys | answer_keys_evidence is web or none
  ansible.builtin.assert:
    that: answer_keys_evidence | default('web') in ['web', 'none']
    fail_msg: "answer_keys_evidence is web (the host's text on the report website, capped; never in the email) or none (only in the AAP job's output), not {{ answer_keys_evidence }}."
    quiet: true
  run_once: true

- name: Answer keys | at most answer_keys_max_hosts hosts
  ansible.builtin.assert:
    that: ansible_play_hosts_all | length <= answer_keys_max_hosts | int
    fail_msg: >-
      STIG answer keys run on {{ ansible_play_hosts_all | length }} hosts - at most {{ answer_keys_max_hosts }}
      (answer_keys_max_hosts): narrow target or the Limit (one host per STIG release is enough for the blocks).
    quiet: true
  run_once: true

- name: Answer keys | the rules asked (none - picked from STIG Manager)
  ansible.builtin.set_fact:
    _ak_rules: "{{ answer_keys_rules | stig_answer_rules(true, answer_keys_max_rules) }}"
    _ak_key: >-
      {%- set a = check_stig_evaluate_args if check_stig_evaluate_args is not string else check_stig_evaluate_args.split() -%}
      {%- set n = namespace(k='') -%}
      {%- for x in a -%}{%- if loop.index0 > 0 and a[loop.index0 - 1] | lower in ['--answerkey', '-answerkey'] -%}{%- set n.k = x -%}{%- endif -%}{%- endfor -%}
      {{ answer_keys_name | default('', true) | string | trim or n.k or 'DEFAULT' }}

- name: Answer keys | the rules asked are right
  ansible.builtin.assert:
    that: _ak_rules.error | length == 0
    fail_msg: "{{ _ak_rules.error }}"
    quiet: true
  run_once: true

- name: Answer keys | no rule asked - the automatic pick needs STIG Manager
  ansible.builtin.assert:
    that: not (_ak_rules.auto | default(false)) or check_stig_stigman_api | length > 0
    fail_msg: >-
      No rule asked and no STIG Manager to pick them from: list the rules (answer_keys_rules) or set
      check_stig_stigman_api - the automatic pick takes the rules STIG Manager has Open or Not Reviewed for each host.
    quiet: true
  run_once: true

# 1.105.0: each host's kind as a host fact (a play variable is not in hostvars)
- name: Answer keys | is this a Windows host
  ansible.builtin.set_fact:
    _ak_is_win: "{{ _ak_windows | default(false) | bool }}"

- name: Answer keys | Evaluate-STIG is the scanner on the Linux hosts, with PowerShell 7 (a Windows host finds its own)
  ansible.builtin.assert:
    # the first Linux host of the run (as before: the first host's setting); Windows hosts find Evaluate-STIG themselves
    that: >-
      (_ak_linux_first | length == 0) or hostvars[_ak_linux_first[0]].check_stig_evaluate | default('') | length > 0
    fail_msg: "STIG answer keys need Evaluate-STIG on the hosts: set check_stig_evaluate (its folder) - docs/STIG_DRIFT.md, Evaluate-STIG."
    quiet: true
  vars:
    _ak_linux_first: "{{ ansible_play_hosts_all | reject('in', _ak_win_hosts) | list }}"
    _ak_win_hosts: >-
      {%- set o = [] -%}
      {%- for h in ansible_play_hosts_all -%}{%- if hostvars[h]._ak_is_win | default(false) | bool -%}{%- set _ = o.append(h) -%}{%- endif -%}{%- endfor -%}
      {{ o }}
  run_once: true

- name: Answer keys | reach the host (its release; a host not reached is listed, the others go on)
  ansible.builtin.setup:
    gather_subset: [min]
  register: _ak_reach
  ignore_errors: true
  # 1.77.0h: a connection's failure text is shown only as the task below redacts it
  no_log: true
  when: not (_ak_windows | default(false) | bool)

# 1.105.0: a Windows host - which Windows Server it is (read only: win_os.ps1)
- name: Answer keys | reach the Windows host (which Windows Server it is)
  ansible.builtin.script: "{{ role_path }}/../win_check_stig/files/win_os.ps1"
  register: _ak_wreach            # its own name: a skipped task still registers, and would overwrite the Linux reach's answer
  ignore_errors: true
  check_mode: false               # only reads
  changed_when: false
  no_log: true
  when: _ak_windows | default(false) | bool

# the answer of the reach that ran for this host (the other registered a skip)
- name: Answer keys | what the reach said
  ansible.builtin.set_fact:
    _ak_rch: "{{ _ak_wreach if _ak_windows | default(false) | bool else _ak_reach }}"
  no_log: true

- name: Answer keys | which Windows Server (a Windows that is not 2019, 2022 or 2025 gets no keys)
  ansible.builtin.set_fact:
    _ak_win: "{{ _ak_wreach.stdout_lines | default([]) | stig_answer_win_os(check_stig_stigman_benchmarks_windows) }}"
  when: (_ak_windows | default(false) | bool) and not (_ak_wreach.unreachable | default(false) or _ak_wreach.failed | default(false))

- name: Answer keys | not reached
  ansible.builtin.set_fact:
    _ak_h:
      host: "{{ inventory_hostname }}"
      ok: false
      why: "{{ 'not reached' if _ak_rch.unreachable | default(false) else 'it failed' }}: {{ (_ak_rch.msg | default('no answer') | string | site_redact)[:240] }}"
      why_mail: "{{ 'not reached' if _ak_rch.unreachable | default(false) else 'it failed' }} (the job's output has why)"
  when: _ak_rch.unreachable | default(false) or _ak_rch.failed | default(false)

- name: Answer keys | a Windows that is no Windows Server 2019, 2022 or 2025
  ansible.builtin.set_fact:
    _ak_h:
      host: "{{ inventory_hostname }}"
      ok: false
      why: "{{ _ak_win.why }}"
      why_mail: "{{ _ak_win.why_mail }}"
  when: (_ak_windows | default(false) | bool) and _ak_win is defined and not _ak_win.ok

- name: Answer keys | this host
  when: not (_ak_rch.unreachable | default(false) or _ak_rch.failed | default(false)) and _ak_h is not defined
  block:
    - name: Answer keys | the host's STIG (check_stig_stigman_benchmarks by its release; a Windows host by its year)
      ansible.builtin.set_fact:
        _ak_major: >-
          {{ _ak_win.year if _ak_windows | default(false) | bool else ansible_facts.distribution_major_version | default('') | string }}
        _ak_bench0: >-
          {{ _ak_win.bench if _ak_windows | default(false) | bool
             else check_stig_stigman_benchmarks[ansible_facts.distribution_major_version | default('') | string] | default('') }}

    - name: Answer keys | the host's STIG Manager reviews (GET only, from the AAP side)
      site_stigman_read:
        api: "{{ check_stig_stigman_api }}"
        token_url: "{{ check_stig_stigman_token_url or lookup('ansible.builtin.env', 'STIGMAN_TOKEN_URL') }}"
        client_id: "{{ check_stig_stigman_client_id or lookup('ansible.builtin.env', 'STIGMAN_CLIENT_ID') }}"
        client_secret: "{{ check_stig_stigman_client_secret or lookup('ansible.builtin.env', 'STIGMAN_CLIENT_SECRET') }}"
        scope: "{{ check_stig_stigman_scope }}"
        collections: "{{ check_stig_stigman_collections }}"
        collections_exclude: "{{ check_stig_stigman_collections_exclude }}"
        validate_certs: "{{ check_stig_stigman_validate_certs | bool }}"
        ca_path: "{{ check_stig_stigman_ca_path }}"
        timeout: "{{ check_stig_stigman_timeout | int }}"
        protect_words: "{{ stigman_protect_words | default(omit) }}"
        hosts:
          - host: "{{ inventory_hostname }}"
            names: "{{ ([check_stig_stigman_asset] if check_stig_stigman_asset | default('') else [inventory_hostname, inventory_hostname.split('.')[0]]) | unique | list }}"
            collection: "{{ check_stig_stigman_collection | default('') }}"
            benchmark: "{{ _ak_bench0 }}"
            rules: "{{ _ak_rules.auto | default(false) }}"       # 1.76.0: the automatic pick needs the STIG's rules
      register: _ak_sm
      delegate_to: localhost
      become: false
      check_mode: false               # only reads
      vars:
        ansible_connection: local
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
      when: check_stig_stigman_api | length > 0 and _ak_bench0 | length > 0

    - name: Answer keys | the rules for this host (asked, or picked from STIG Manager)
      ansible.builtin.set_fact:
        _ak_auto: "{{ _smh_now | stig_answer_auto(answer_keys_pick, answer_keys_cat, 0) if _ak_rules.auto | default(false) else {} }}"
        _ak_smh: "{{ _smh_now }}"
      vars:
        _smh_now: "{{ (_ak_sm.hosts | default({}))[inventory_hostname] | default({'status': 'not read', 'why': _ak_sm.error | default('no STIG Manager benchmark for this release (check_stig_stigman_benchmarks)')}) }}"

    - name: Answer keys | the rules for this host - the list
      ansible.builtin.set_fact:
        _ak_list: "{{ _ak_auto.rules | default([]) if _ak_rules.auto | default(false) else _ak_rules.rules }}"

    # 1.105.0: the rules a person NAMED on a Windows host keep the protections of the automatic pick: a review with RA / POA&M words (stigman_protect_words)
    # or with attachments is never drafted (an unreadable attachment check counts as protected)
    - name: Answer keys | a Windows host - the named rules without the reviews a person protected
      ansible.builtin.set_fact:
        _ak_wp: "{{ _ak_list | stig_answer_win_protect(_ak_smh) }}"
      when: _ak_windows | default(false) | bool and not _ak_rules.auto | default(false)

    - name: Answer keys | a Windows host - the named rules that are left
      ansible.builtin.set_fact:
        _ak_list: "{{ _ak_wp.rules }}"
      when: _ak_wp is defined

    # a review a person attached evidence to is never picked (as the STIG recheck; GET only, one read per review)
    - name: Answer keys | the picked reviews with attachments in STIG Manager (read-only) - never picked
      site_stigman_attachments:
        api: "{{ check_stig_stigman_api }}"
        token_url: "{{ check_stig_stigman_token_url or lookup('ansible.builtin.env', 'STIGMAN_TOKEN_URL') }}"
        client_id: "{{ check_stig_stigman_client_id or lookup('ansible.builtin.env', 'STIGMAN_CLIENT_ID') }}"
        client_secret: "{{ check_stig_stigman_client_secret or lookup('ansible.builtin.env', 'STIGMAN_CLIENT_SECRET') }}"
        scope: "{{ check_stig_stigman_scope }}"
        validate_certs: "{{ check_stig_stigman_validate_certs | bool }}"
        ca_path: "{{ check_stig_stigman_ca_path }}"
        timeout: "{{ check_stig_stigman_timeout | int }}"
        items: "{{ _ak_smh | stig_answer_att_items(_ak_list) }}"
      register: _ak_att
      delegate_to: localhost
      become: false
      check_mode: false               # only reads
      vars:
        ansible_connection: local
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
      when: (_ak_rules.auto | default(false) or _ak_is_win | bool) and (_ak_smh | stig_answer_att_items(_ak_list)) | length > 0

    - name: Answer keys | the automatic pick without them
      ansible.builtin.set_fact:
        _ak_att_split: "{{ _ak_list | stig_answer_drop_att(_ak_smh, _ak_att) }}"
      when: _ak_att is not skipped and _ak_att is defined

    - name: Answer keys | the rules for this host - without the ones with attachments
      ansible.builtin.set_fact:
        _ak_list: "{{ _ak_att_split.rules }}"
      when: _ak_att_split is defined

      # 1.76.0b: the STIG's key (benchmark|revision) for the cap over the union of its hosts
    - name: Answer keys | this host's STIG and revision (the cap's key)
      ansible.builtin.set_fact:
        _ak_capkey: "{{ _ak_bench0 }}|{{ _ak_smh.revision | default('') }}"
  rescue:
    - name: Answer keys | this host failed - listed, the others go on
      ansible.builtin.set_fact:
        _ak_h: {host: "{{ inventory_hostname }}", ok: false, why: "{{ (ansible_failed_result.msg | default('it failed') | string | site_redact)[:300] }}",
                why_mail: "reading its STIG and its reviews failed (the job's output has why)"}

# 1.76.0b (Codex): the automatic pick's cap over the UNION of each STIG's hosts - every eligible rule once, CAT I first
# then by rule, at most answer_keys_max_rules; the rest counted (once, for every host: run_once - no condition here, so
# it never takes a skipped host's view)
- name: Answer keys | the automatic pick's cap - over every host of each STIG together
  ansible.builtin.set_fact:
    _ak_cap: >-
      {%- set e = [] -%}
      {%- for h in ansible_play_hosts_all -%}
      {%-   if hostvars[h]._ak_capkey is defined and hostvars[h]._ak_h is not defined -%}
      {%-     set _ = e.append({'key': hostvars[h]._ak_capkey, 'rules': hostvars[h]._ak_list | default([])}) -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ e | stig_answer_cap(answer_keys_max_rules) if _ak_rules.auto | default(false) else {} }}
  run_once: true

- name: Answer keys | this host - Evaluate-STIG for its rules
  when: _ak_capkey is defined and _ak_h is not defined
  block:
    - name: Answer keys | the rules for this host - within the cap (the automatic pick)
      ansible.builtin.set_fact:
        _ak_list: "{{ _ak_list | selectattr('sv', 'in', _ak_cap[_ak_capkey].allowed) | list }}"
        _ak_left: "{{ _ak_cap[_ak_capkey].left_out }}"
      when: _ak_rules.auto | default(false) and _ak_capkey in _ak_cap

    # Evaluate-STIG's own result for these rules only - no answer files, none of check_stig_evaluate_args (an -Output to
    # STIG Manager or a share there would write), a checklist of its own read and removed, nothing kept (save: false)
    - name: Answer keys | Evaluate-STIG's own result for these rules on the host (nothing kept, nothing sent)
      when: _ak_list | length > 0 and not (_ak_windows | default(false) | bool)
      site_stig_scan:
        dir: "{{ check_stig_dir }}"
        save: false
        keep_report: false
        keep_results: false
        timeout: "{{ check_stig_timeout | int }}"
        scanner: evaluate_stig
        evaluate: "{{ check_stig_evaluate }}"
        evaluate_select: "{{ check_stig_evaluate_select }}"
        evaluate_args: []
        evaluate_read: ""
        evaluate_output: CKLB
        evaluate_rejected: "{{ check_stig_evaluate_rejected | bool }}"
        pwsh: "{{ check_stig_pwsh }}"
        benchmarks: "{{ check_stig_stigman_benchmarks }}"
        vulns: "{{ _ak_list | map(attribute='v') | list }}"
        selected_only: true             # 1.75.0b: the picked rules or nothing - never a full scan
        history: false
      register: _ak_scan
      check_mode: false               # only reads; keeps nothing (save: false)

    # 1.105.0: a Windows host - the same Evaluate-STIG run path as the Windows STIG recheck (win_stig.ps1: -SelectVuln for the picked
    # rules, as SYSTEM in a one-time scheduled task that is deleted after, its own output folder removed), nothing kept (save: false,
    # history: false), DISA's check text for the Not Reviewed rules too (texts: true)
    - name: Answer keys | Evaluate-STIG's own result for these rules on the Windows host (nothing kept, nothing sent)
      when: _ak_list | length > 0 and (_ak_windows | default(false) | bool)
      ansible.builtin.script: "{{ role_path }}/../win_check_stig/files/win_stig.ps1"
      environment:
        # the Windows STIG drift report's settings (win_check_stig_*; their defaults here: that role is not loaded in this job)
        SITE_CHECK_CONFIG: >-
          {{ {'evaluate': win_check_stig_evaluate | default(''), 'read': '', 'select': win_check_stig_evaluate_select | default([]),
              'exclude': win_check_stig_evaluate_exclude | default([]), 'args': [],
              'output': 'CKLB', 'rejected': win_check_stig_evaluate_rejected | default(true) | bool,
              'run_as': win_check_stig_run_as | default('task'), 'powershell': win_check_stig_powershell | default(''),
              'timeout': win_check_stig_timeout | default(3600) | int,
              'dir': win_check_stig_dir | default('C:\\ProgramData\\site-automation\\stig'), 'keep': 0, 'save': false,
              'search': win_check_stig_search | default([]), 'search_depth': win_check_stig_search_depth | default(4) | int,
              'vulns': _ak_list | map(attribute='v') | list, 'history': false, 'texts': true,
              'selected_only': true} | to_json }}
      register: _ak_win_out
      changed_when: false
      failed_when: false
      check_mode: false               # Evaluate-STIG only reads; save: false keeps nothing on the server
      no_log: true

    - name: Answer keys | the Windows scan's result, in the shape the Linux scan gives
      when: _ak_list | length > 0 and (_ak_windows | default(false) | bool)
      ansible.builtin.set_fact:
        _ak_scan: >-
          {{ _ak_win_stig | stig_answer_win_scan(_ak_bench0, _ak_win_err) }}
      vars:
        _ak_win_line: "{{ _ak_win_out.stdout_lines | default([]) | select('match', '^###SITE-JSON### ') | list | last | default('') }}"
        _ak_win_stig: "{{ ((_ak_win_line[16:] | from_json).facts | default({})) if _ak_win_line | length > 0 else {} }}"
        _ak_win_err: >-
          {{ '' if _ak_win_line | length > 0 else
             ('the scan script gave no result (exit code ' ~ _ak_win_out.rc | default('?') ~ ')') }}

    - name: Answer keys | what this host gave (its STIG, release, each rule's result) - for the AAP side
      ansible.builtin.set_fact:
        _ak_h:
          host: "{{ inventory_hostname }}"
          ok: "{{ (_ak_list | length == 0 and _ak_smh.status | default('') == 'found') or _ak_scan.scanned | default(false) }}"
          why: >-
            {{ (_ak_scan.why | default('Evaluate-STIG did not run'))
               if _ak_list | length > 0 and not _ak_scan.scanned | default(false)
               else ('no rule to pick - ' ~ (_ak_auto.why | default('') or 'STIG Manager has none Open or Not Reviewed for it (answer_keys_pick, answer_keys_cat)'))
               if _ak_list | length == 0 and _ak_smh.status | default('') != 'found' else '' }}
          bench: "{{ _ak_bench0 or _ak_scan.benchmark | default('') }}"
          rev: "{{ _ak_smh.revision | default('', true) or _ak_scan.stig_version | default('') }}"
          major: "{{ _ak_major }}"
          auto: "{{ _ak_rules.auto | default(false) }}"
          left_out: "{{ _ak_left | default(0) }}"
          protected: "{{ (_ak_auto.protected | default([])) + (_ak_wp.dropped | default([])) }}"
          run_as: "{{ (win_check_stig_run_as | default('task')) if _ak_windows | default(false) | bool else '' }}"
          win: "{{ _ak_windows | default(false) | bool }}"
          attached: "{{ _ak_att_split.dropped | default([]) }}"
          sm: "{{ _ak_smh.status | default('') }}"
          picks: >-
            {{ _ak_list | stig_answer_pick(_ak_scan['items'] | default([]), _ak_smh if check_stig_stigman_api | length > 0 else {},
                                           '' if _ak_scan.scanned | default(false) else _ak_scan.why | default('it did not run'))
               if _ak_list | length > 0 else [] }}
  rescue:
    - name: Answer keys | this host failed - listed, the others go on
      ansible.builtin.set_fact:
        _ak_h: {host: "{{ inventory_hostname }}", ok: false, why: "{{ (ansible_failed_result.msg | default('it failed') | string | site_redact)[:300] }}",
                why_mail: "Evaluate-STIG for its rules failed (the job's output has why)"}
