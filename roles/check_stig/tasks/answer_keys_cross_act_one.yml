---
# STIG answer keys - the cross-check (1.77.0): ACT on its own for one rule and evidence (_akx_ask), on the AAP side,
# evidence mode. It gets DISA's check text and what the host returned for the read-only commands - never the code.
- name: Answer keys cross-check | ACT on {{ _akx_ask.v }} ({{ _akx_ask.label }}) - DISA's check text and the evidence, never the code
  ansible.builtin.include_role:
    name: site_act
    tasks_from: evidence_analysis.yml
    # 1.77.0i (Codex P1): ACT's own tasks print its raw answer (act_triage's outcome) - hidden here; the answer is kept
    # redacted below
    apply:
      no_log: true
  vars:
    _ea_items: [{id: "{{ _akx_ask.v }}"}]
    _ea_evidence: "{{ 'Read-only evidence for ' ~ _akx_ask.v ~ ' (' ~ _akx_ask.from ~ ' commands):\n' ~ _akx_ask.evidence }}"
    _ea_task: "{{ _akx_ask.task }}"
    _ea_names: "{{ _akx_ask.hosts }}"

- name: Answer keys cross-check | ACT's answer on {{ _akx_ask.v }}
  ansible.builtin.set_fact:
    _akx_answers: >-
      {{ _akx_answers | combine({_akx_ask.id: (_ea_raw | default('') | string | site_redact) if _ea_ran | default(false) | bool
                                 else 'unsure\nACT did not answer: ' ~ (_ea_reason | default('') | string | site_redact | truncate(200))}) }}
