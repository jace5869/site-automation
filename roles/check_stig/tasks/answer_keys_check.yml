---
# STIG ANSWER KEYS (1.75.0; 1.76.0: one host per STIG), after the AAP side grouped the hosts (answer_keys_group.yml) and
# ACT drafted (answer_keys_act.yml): one draft per rule per STIG (the patterns', ACT's), then on ONE host of each STIG -
# the first that worked - the read-only check of each draft and its trial (1.76.0, in the sandbox). See answer_keys.yml.
- name: Answer keys | ACT's drafts (from the AAP side; none asked, none)
  ansible.builtin.set_fact:
    _ak_act: "{{ _ak_act | default({}) }}"

- name: Answer keys | every draft - one per rule per STIG
  ansible.builtin.set_fact:
    _ak_m: >-
      {%- set gs = [] -%}
      {%- for g in _ak_m.groups -%}
      {%-   set _ = gs.append(g | combine({'drafts': g.picks | stig_answer_drafts(answer_keys_values, answer_keys_act | bool, _ak_act | stig_answer_act_of(g))})) -%}
      {%- endfor -%}
      {{ _ak_m | combine({'groups': gs}) }}
  run_once: true

# 1.76.0b (Codex): a trial host that fails (or cannot be reached any more) never fails the job - its STIG's blocks are
# "not tried: the trial host failed (why)", the other STIGs and the report go on
- name: Answer keys | the read-only check and the trial - on the first host of each STIG
  when: inventory_hostname in _ak_reps | default([])
  block:
    # 1.76.4 (Codex): this host's own setting (an inventory group may differ), for the report
    - name: Answer keys | the trial on this host? (answer_keys_trial)
      ansible.builtin.set_fact:
        _ak_trial_on: "{{ answer_keys_trial | bool }}"

    - name: Answer keys | the read-only check and one trial of each draft - on the first host of each STIG (and what its Evaluate-STIG is)
      site_stig_answer_host:
        evaluate: "{{ check_stig_evaluate }}"
        pwsh: "{{ check_stig_pwsh }}"
        codes: "{{ (_ak_m.groups | selectattr('rep', 'eq', inventory_hostname) | first).drafts | stig_answer_codes }}"
        trial: "{{ answer_keys_trial | bool }}"   # 1.76.4: off by default - the read-only check only, the blocks marked not tried
        timeout: "{{ answer_keys_trial_timeout | int }}"
        sandbox: "{{ _ak_sandbox | default('') }}"   # systemd-run (the tests give another path); no read-only sandbox: no trial
      register: _ak_hc
      check_mode: false               # only reads (its own folder, removed)
      # 1.77.0h: its raw result stays out of the job's output - a failure's text (a connection's, a traceback's) is shown
      # only as the rescue below redacts it
      no_log: true

    - name: Answer keys | the trial host could not be reached any more - its STIG not tried
      ansible.builtin.set_fact:
        _ak_hc: {failed_host: "{{ ('not reached: ' ~ (_ak_hc.msg | default('no answer') | string | site_redact))[:300] }}"}
      when: _ak_hc.unreachable | default(false)
  rescue:
    - name: Answer keys | the trial host failed - its STIG not tried, the others go on
      ansible.builtin.set_fact:
        _ak_hc: {failed_host: "{{ (ansible_failed_result.msg | default('it failed') | string | site_redact)[:300] }}"}
