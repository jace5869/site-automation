---
# STIG ANSWER KEYS - THE CROSS-CHECK (1.77.0), on the AAP side, once (playbooks/stig_answer_keys.yml: run_once, delegated
# to localhost): ACT on its own - for each ask of _akx_asks (answer_keys_cross.yml), DISA's check text and the host's
# read-only evidence, never the code, its result or Evaluate-STIG's status; ACT runs no command (evidence mode). Then the
# four sources side by side, rule by rule (_akx_doc), for answer_keys_report.yml.
- name: Answer keys cross-check | no ACT answer yet
  ansible.builtin.set_fact:
    _akx_answers: {}

# 1.136.0: every rule and evidence in ONE ask (evidence_many.yml): one check of the way to the model, ACT copied once,
# site_act_concurrency at a time. Each gets DISA's check text and what the host returned for the read-only commands -
# never the code. ACT masks that rule's hosts.
- name: Answer keys cross-check | ACT on its own - each rule and evidence, in one ask (it reads the evidence, runs no command)
  ansible.builtin.include_role:
    name: site_act
    tasks_from: evidence_many.yml
    # 1.77.0i (Codex P1): no_log - ACT's answer never shows in the job's output (site_act_ask prints nothing either);
    # the answer is kept redacted below
    apply:
      no_log: true
  vars:
    _em_questions: >-
      {%- set out = [] -%}
      {%- for x in _akx_asks.asks | default([]) -%}
      {%-   set _ = out.append({'key': x.id, 'items': [{'id': x.v}],
                               'evidence': 'Read-only evidence for ' ~ x.v ~ ' (' ~ x.from ~ ' commands):' ~ _nl ~ x.evidence,
                               'task': x.task, 'names': x.hosts}) -%}
      {%- endfor -%}
      {{ out }}
    _nl: "\n"                          # a line break (in a >- block, '\n' would stay two characters)
    _em_tiers: "{{ answer_keys_act_tiers | default(true) }}"   # 1.137.0: model tiers (site_act_worker_model)
    _em_tier_form: verdict             # an "unsure" first line (no NF, Open or NA) goes to the smart model
  when: _akx_asks.asks | default([]) | length > 0

- name: Answer keys cross-check | ACT's answers, rule by rule
  ansible.builtin.set_fact:
    _akx_tiers_note: "{{ _em_tiers_note | default('') }}"    # 1.137.0: which model answered (site_act_worker_model)
    _akx_answers: >-
      {%- set out = {} -%}
      {%- for x in _akx_asks.asks | default([]) -%}
      {%-   set a = (_em_answers | default({})).get(x.id) or {'ran': false, 'raw': '', 'reason': ''} -%}
      {%-   set _ = out.update({x.id: (a.raw | default('') | string | site_redact) if a.ran | bool
                                else 'unsure' ~ _nl ~ 'ACT did not answer: ' ~ (a.reason | default('') | string | site_redact | truncate(200))}) -%}
      {%- endfor -%}
      {{ out }}
  vars:
    _nl: "\n"                          # the reader takes the first line as the verdict, the second as why
  when: _akx_asks.asks | default([]) | length > 0

- name: Answer keys cross-check | the four sources side by side, rule by rule
  ansible.builtin.set_fact:
    _akx_doc: >-
      {{ _ak_groups | stig_answer_cross_join(_akx_info, _akx_reads, _akx_asks, _akx_answers, _akx_now)
         | stig_answer_cross_rules
         | stig_answer_cross_report(answer_keys_cross_check_act_max | int, _akx_reads | stig_answer_cross_ran,
                                    answer_keys_evidence | default('web')) }}

- name: Answer keys cross-check | what it found
  ansible.builtin.debug:
    msg: "{{ _akx_doc.lines }}"
