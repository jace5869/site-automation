---
# CERTS. One read-only script prints one line per certificate:
#   CERT|<where>|<subject>|<expiry as seconds since 1970>
#   ERR|<where>|<what went wrong>
# It reads only the CERTIFICATE blocks of each file (never a private key) with openssl, asks
# each TLS endpoint for its certificate with `openssl s_client`, and lists keystores with keytool.
# With check_certs_discover_ports / _keystores (the certificate report turns them on) it also finds
# the listening ports that answer TLS, and the Java keystores on the host:
#   SKIP|<where>|<why it was not checked>   (listed in the report, not a finding)
# A found file's placeholder certificate (check_certs_placeholder_subject: postfix's) is a SKIP line too,
# and so is a found file with more certificates than check_certs_discover_max_per_file (a bundle).
# With check_certs_discover_trust (the report turns it on): the host's trust store (update-ca-trust):
#   TRUST|<where>|<subject>|<expiry>   (listed in the report: never a finding, never a CSR)
# A binary (DER) certificate file is read too:  DER|<where>  (the hint then says -inform DER)
# After each CERT / TRUST line, what else the certificate says (the inventory, the export):
#   META|<issuer>|<serial>|<sha1>|<sha256>|<key>|<signature algorithm>|<CA: 1 or 0>|<signs certificates: 1 or 0>|<names (SANs), comma separated>

- name: Certs | find and read certificates
  ansible.builtin.shell: |
    set -u
    # keystore passwords arrive on stdin, one line each (never on a command line or in `environment:`,
    # which Ansible puts on the sudo / sh command line: visible in ps and in the sudo log)
    {% for k in check_certs_keystores if k.password_env | default('') %}
    IFS= read -r {{ k.password_env }}; export {{ k.password_env }}
    {% endfor %}
    export LC_ALL=C
    echo "NOW|$(date +%s)"
    tmp=$(mktemp -d); trap 'rm -rf "$tmp"' EXIT
    placeholder={{ check_certs_placeholder_subject | quote }}
    # $1 = a PEM file with one certificate: its META line
    meta() {
      { openssl x509 -noout -issuer -serial -fingerprint -sha1 -nameopt RFC2253 -in "$1" 2>/dev/null
        openssl x509 -noout -fingerprint -sha256 -text -in "$1" 2>/dev/null; } | awk '
        /^issuer=/ {is = substr($0, 8); gsub(/[|]/, " ", is)}
        /^serial=/ {se = substr($0, 8)}
        tolower($0) ~ /^sha1 fingerprint=/ {s1 = substr($0, 18); gsub(/:/, "", s1)}
        tolower($0) ~ /^sha256 fingerprint=/ {s2 = substr($0, 20); gsub(/:/, "", s2)}
        /Signature Algorithm:/ && sa == "" {sa = $0; sub(/.*Signature Algorithm: */, "", sa)}
        /Public Key Algorithm:/ {ka = $0; sub(/.*Public Key Algorithm: */, "", ka)}
        /Public-Key: \(/ {kb = $0; sub(/.*\(/, "", kb); sub(/ bit.*/, "", kb)}
        /ASN1 OID:/ && cv == "" {cv = $NF}
        /NIST CURVE:/ {cv = $NF}
        want == "bc" {ca = ($0 ~ /CA:TRUE/) ? 1 : 0; want = ""}
        want == "ku" {ks = ($0 ~ /Certificate Sign/) ? 1 : 0; want = ""}
        /X509v3 Key Usage/ {want = "ku"}
        want == "san" {sn = $0; gsub(/^ +| +$/, "", sn); gsub(/IP Address:/, "IP:", sn); gsub(/[|]/, " ", sn); want = ""}
        /X509v3 Basic Constraints/ {want = "bc"}
        /X509v3 Subject Alternative Name/ {want = "san"}
        END {
          k = (ka ~ /rsa/) ? "RSA " kb : ((ka ~ /ec/) ? "EC " (cv != "" ? cv : kb) : ka)
          print "META|" is "|" se "|" s1 "|" s2 "|" k "|" sa "|" (ca == "" ? 0 : ca) "|" (ks == "" ? 0 : ks) "|" sn
        }'
    }
    # $1 = file, $2 = max certificates (0 = no limit), $3 = 1: found by the search (not listed),
    # $4 = CERT, or TRUST for the trust store (listed in the report: no finding, no CSR)
    one_file() {
      local f=$1 max=$2 disc=${3:-0} kind=${4:-CERT} rd=$1 n c end subj
      [ -r "$f" ] || { echo "ERR|$f|not readable"; return; }
      n=$(grep -c 'BEGIN CERTIFICATE' "$f" 2>/dev/null)
      if [ "${n:-0}" -eq 0 ]; then
        # binary (DER): one certificate, read with -inform DER (OpenSSL 1.1.1 on RHEL 8 does not guess it)
        rd="$tmp"/der.pem
        openssl x509 -inform DER -in "$f" -out "$rd" 2>/dev/null || return
        n=1; echo "DER|$f"
      fi
      if [ "$max" -gt 0 ] && [ "$n" -gt "$max" ]; then
        [ "$disc" = 1 ] && echo "SKIP|$f|a bundle of $n certificates (more than check_certs_discover_max_per_file, $max): not checked - list it in check_certs_files to check each certificate in it"
        return
      fi
      rm -f "$tmp"/c.*
      awk -v d="$tmp" '/-----BEGIN CERTIFICATE-----/ {k++; w=1} w {print > (d "/c." k)} /-----END CERTIFICATE-----/ {w=0}' "$rd"
      for c in "$tmp"/c.*; do
        end=$(openssl x509 -noout -enddate -in "$c" 2>/dev/null | cut -d= -f2-)
        subj=$(openssl x509 -noout -subject -nameopt RFC2253 -in "$c" 2>/dev/null | sed 's/^subject=//; s/|/ /g')
        if [ -z "$end" ]; then echo "ERR|$f|a certificate block openssl cannot read"
        elif [ "$disc" = 1 ] && [ -n "$placeholder" ] && grep -qE -- "$placeholder" <<< "$subj"; then
          echo "SKIP|$f|a placeholder certificate a package made at install (postfix makes one, for a year; its subject matches check_certs_placeholder_subject): not checked - a real certificate put in its place is"
        else echo "$kind|$f|$subj|$(date -d "$end" +%s)"; meta "$c"; fi
      done
    }
    explicit=""
    {% for p in check_certs_files %}
    found=0
    while IFS= read -r f; do found=1; explicit="$explicit$f"$'\n'; one_file "$f" 0; done < <(compgen -G {{ p | quote }})
    [ $found = 1 ] || echo "ERR|{{ p }}|no such file"
    {% endfor %}
    {% if check_certs_discover | bool %}
    find {{ (check_certs_discover_dirs + check_certs_discover_extra_dirs | default([], true)) | map('quote') | join(' ') }} -maxdepth 2 -type f \
      \( -iname '*.crt' -o -iname '*.pem' -o -iname '*.cer' -o -iname '*.der' \) 2>/dev/null |
      grep -vE {{ check_certs_discover_exclude | quote }} | sort -u |
      while IFS= read -r f; do
        grep -qxF "$f" <<< "$explicit" && continue
        one_file "$f" {{ check_certs_discover_max_per_file | int }} 1
      done
    {% endif %}
    {% if check_certs_discover_trust | bool %}
    # the trust store: every file, whatever its name (update-ca-trust reads them all) - listed, never a finding or a CSR
    find {{ check_certs_trust_dirs | map('quote') | join(' ') }} -maxdepth 1 -type f 2>/dev/null | sort -u |
      while IFS= read -r f; do
        grep -qxF "$f" <<< "$explicit" && continue
        one_file "$f" {{ check_certs_discover_max_per_file | int }} 1 TRUST
      done
    {% endif %}
    {% for e in check_certs_endpoints %}
    pem=$(timeout 10 openssl s_client -connect {{ (e.host ~ ':' ~ e.port) | quote }} -servername {{ (e.servername | default(e.host)) | quote }} </dev/null 2>/dev/null | openssl x509 2>/dev/null)
    if [ -n "$pem" ]; then
      end=$(echo "$pem" | openssl x509 -noout -enddate | cut -d= -f2-)
      subj=$(echo "$pem" | openssl x509 -noout -subject -nameopt RFC2253 | sed 's/^subject=//; s/|/ /g')
      echo "CERT|{{ e.name | default(e.host) }} (https://{{ e.host }}:{{ e.port }})|$subj|$(date -d "$end" +%s)"
      echo "$pem" > "$tmp"/ep.pem; meta "$tmp"/ep.pem
    else
      echo "ERR|{{ e.name | default(e.host) }} (https://{{ e.host }}:{{ e.port }})|no certificate: not answering, or not TLS"
    fi
    {% endfor %}
    {% if check_certs_discover_ports | bool %}
    # listening TCP ports that answer TLS (not the ports in check_certs_discover_ports_skip - ssh, dns,
    # plain databases ... - nor the ones already in check_certs_endpoints), each probed once on the
    # address it is bound to, at most check_certs_discover_ports_max of them
    fqdn=$(hostname -f 2>/dev/null || hostname)
    skip=" {{ (check_certs_discover_ports_skip + (check_certs_endpoints | map(attribute='port') | list)) | join(' ') }} "
    ss -Htlnp 2>/dev/null | awk '{print $4 "\t" $6}' | sort -t$'\t' -k1,1 -u | {
      seen=" "; n=0
      while IFS=$'\t' read -r local procs; do
        port=${local##*:}; addr=${local%:*}
        case "$skip$seen" in *" $port "*) continue ;; esac
        addr=$(printf '%s' "$addr" | sed 's/%[^]]*//')        # 127.0.0.53%lo -> 127.0.0.53
        case "$addr" in "*"|0.0.0.0) addr=127.0.0.1 ;; "[::]"|"::") addr="[::1]" ;; "[fe80:"*) continue ;; esac
        [ "$n" -lt {{ check_certs_discover_ports_max | int }} ] || { echo "SKIP|TLS ports|more than {{ check_certs_discover_ports_max | int }} listening ports: the rest not probed (check_certs_discover_ports_max)"; break; }
        n=$((n + 1)); seen="$seen$port "
        proc=$(printf '%s' "$procs" | sed -n 's/.*users:(("\([^"]*\)".*/\1/p')
        pem=$(timeout {{ check_certs_probe_timeout | int }} openssl s_client -connect "$addr:$port" -servername "$fqdn" </dev/null 2>/dev/null | openssl x509 2>/dev/null)
        [ -n "$pem" ] || continue                                 # not TLS: nothing to report
        end=$(echo "$pem" | openssl x509 -noout -enddate | cut -d= -f2-)
        subj=$(echo "$pem" | openssl x509 -noout -subject -nameopt RFC2253 | sed 's/^subject=//; s/|/ /g')
        echo "CERT|TLS port $port${proc:+, $proc} (https://$addr:$port)|$subj|$(date -d "$end" +%s)"
        echo "$pem" > "$tmp"/ep.pem; meta "$tmp"/ep.pem
      done
    }
    {% endif %}
    # keytool -list -v: one line per certificate - alias|owner|until|issuer|serial|sha1|sha256|key|signature|CA|signs|names
    ksawk='function flush() { if (o != "") print a "|" o "|" u "|" is "|" se "|" s1 "|" s2 "|" k "|" sa "|" ca "|" ks "|" sn
                              o = ""; u = ""; is = ""; se = ""; s1 = ""; s2 = ""; k = ""; sa = ""; ca = 0; ks = 0; sn = ""; want = "" }
      /^Alias name:/ {flush(); a = substr($0, 13)}
      /^Owner:/ {flush(); o = substr($0, 8); gsub(/[|]/, " ", o)}
      /^Issuer:/ {is = substr($0, 9); gsub(/[|]/, " ", is)}
      /^Serial number:/ {se = toupper(substr($0, 16))}
      /until: / && u == "" {u = $0; sub(/.*until: /, "", u)}
      /^[ \t]*SHA1: / && s1 == "" {s1 = $NF; gsub(/:/, "", s1)}
      /^[ \t]*SHA256: / && s2 == "" {s2 = $NF; gsub(/:/, "", s2)}
      /^Signature algorithm name:/ {sa = $NF}
      /^Subject Public Key Algorithm:/ {k = $0; sub(/.*Algorithm: */, "", k); n = k; sub(/-bit.*/, "", n)
        if (k ~ /RSA/) k = "RSA " n; else if (k ~ /EC/) {c = k; if (sub(/.*[(]/, "", c) && sub(/[)].*/, "", c)) k = "EC " c; else k = "EC " n}}
      /^BasicConstraints:/ {want = "bc"}
      want == "bc" && /CA:/ {ca = ($0 ~ /CA:true/) ? 1 : 0; want = ""}
      /^KeyUsage/ {want = "ku"}
      want == "ku" && /Key_CertSign/ {ks = 1}
      want == "ku" && /^]/ {want = ""}
      /^SubjectAlternativeName/ {want = "san"; next}
      want == "san" && /^]/ {want = ""}
      want == "san" && /(DNSName|IPAddress|RFC822Name|URIName): / {v = $0; sub(/^ */, "", v); sub(/DNSName: /, "DNS:", v); sub(/IPAddress: /, "IP:", v)
        sub(/RFC822Name: /, "email:", v); sub(/URIName: /, "URI:", v); sn = sn (sn == "" ? "" : ", ") v}
      END {flush()}'
    {% if check_certs_discover_keystores | bool %}
    # Java keystores: files in check_certs_discover_keystore_dirs, and the ones running Java programs
    # name (-Djavax.net.ssl.keyStore=...). Never a guessed password: one that needs a password is
    # listed as not checked (give it in check_certs_keystores with password_env)
    kt=$(command -v keytool 2>/dev/null || true)
    if [ -z "$kt" ]; then
      for e in /proc/[0-9]*/exe; do b=$(readlink "$e" 2>/dev/null) || continue
        case "$b" in */bin/java) [ -x "${b%/java}/keytool" ] && { kt="${b%/java}/keytool"; break; } ;; esac
      done
    fi
    explicitks=" {{ check_certs_keystores | map(attribute='path') | join(' ') }} "
    {
      timeout 120 find {{ check_certs_discover_keystore_dirs | map('quote') | join(' ') }} -maxdepth {{ check_certs_discover_keystore_depth | int }} -type f \
        \( -iname '*.jks' -o -iname '*.keystore' -o -iname '*.p12' -o -iname '*.pfx' \) 2>/dev/null
      for c in /proc/[0-9]*/cmdline; do tr '\0' '\n' < "$c" 2>/dev/null | sed -n 's/^-Djavax\.net\.ssl\.keyStore=//p'; done
    } | grep -vE {{ check_certs_discover_keystore_exclude | quote }} | sort -u | head -n {{ check_certs_discover_keystore_max | int }} |
    while IFS= read -r ks; do
      [ -r "$ks" ] || continue
      case "$explicitks" in *" $ks "*) continue ;; esac
      listed=""
      if [ -n "$kt" ]; then
        listed=$(timeout 30 "$kt" -list -v -keystore "$ks" </dev/null 2>/dev/null |
          awk "$ksawk")
      fi
      if [ -n "$listed" ]; then
        while IFS='|' read -r alias owner until is se s1 s2 k sa ca kcs sn; do
          echo "CERT|$ks (alias $alias)|$owner|$(date -d "$until" +%s 2>/dev/null || echo 0)"
          echo "META|$is|$se|$s1|$s2|$k|$sa|$ca|$kcs|$sn"
        done <<< "$listed"
        continue
      fi
      case "$ks" in *.p12|*.P12|*.pfx|*.PFX)
        rm -f "$tmp"/p12.pem
        if openssl pkcs12 -in "$ks" -nokeys -passin pass: -out "$tmp"/p12.pem 2>/dev/null \
           || openssl pkcs12 -legacy -in "$ks" -nokeys -passin pass: -out "$tmp"/p12.pem 2>/dev/null; then
          one_file "$tmp"/p12.pem 0 | sed "s#|$tmp/p12.pem|#|$ks|#"
          continue
        fi ;;
      esac
      if [ -z "$kt" ] && case "$ks" in *.jks|*.keystore) true ;; *) false ;; esac; then
        echo "SKIP|$ks|a Java keystore, and no keytool on this host to read it"
      else
        echo "SKIP|$ks|needs its password: add it to check_certs_keystores with password_env (an AAP credential)"
      fi
    done
    {% endif %}
    {% for k in check_certs_keystores %}
    if [ -r {{ k.path | quote }} ]; then
      timeout 30 keytool -list -v -keystore {{ k.path | quote }} {{ ('-storepass:env ' ~ k.password_env) if k.password_env | default('') else '' }} </dev/null 2>/dev/null |
        awk "$ksawk" |
        while IFS='|' read -r alias owner until is se s1 s2 k sa ca kcs sn; do
          echo "CERT|{{ k.path }} (alias $alias)|$owner|$(date -d "$until" +%s 2>/dev/null || echo 0)"
          echo "META|$is|$se|$s1|$s2|$k|$sa|$ca|$kcs|$sn"
        done
    else
      echo "ERR|{{ k.path }}|keystore not readable"
    fi
    {% endfor %}
    exit 0
  args:
    executable: /bin/bash
    stdin: "{{ _certs_pw_lines if _certs_pw_set else omit }}"
  vars:
    _certs_pw_set: "{{ check_certs_keystores | selectattr('password_env', 'defined') | map(attribute='password_env') | select | list | length > 0 }}"
    _certs_pw_lines: |-
      {% for k in check_certs_keystores if k.password_env | default('') %}
      {{ lookup('ansible.builtin.env', k.password_env) }}
      {% endfor %}
  no_log: "{{ _certs_pw_set }}"   # stdin carries keystore passwords (the registered result is still used below)
  register: _certs
  changed_when: false
  check_mode: false

- name: Certs | every certificate found, with days left
  ansible.builtin.set_fact:
    check_certs_inventory: >-
      {%- set now = (_certs.stdout_lines | select('match', '^NOW[|]') | first | default('NOW|0')).split('|')[1] | int -%}
      {%- set out = [] -%}
      {%- set lines = _certs.stdout_lines -%}
      {%- for i in range(lines | length) if lines[i].startswith('CERT|') or lines[i].startswith('TRUST|') -%}
      {%-   set c = lines[i].split('|', 3) -%}
      {%-   set exp = c[3] | int -%}
      {%-   set trust = c[0] == 'TRUST' -%}
      {%-   set where = c[1] ~ (' (trust store)' if trust else '') -%}
      {#-   the META line right after it: issuer|serial|sha1|sha256|key|signature|CA|signs certificates|names -#}
      {%-   set m = (lines[i + 1] if i + 1 < lines | length and lines[i + 1].startswith('META|') else 'META|||||||0|0|').split('|', 9) -%}
      {%-   set self_signed = m[1] != '' and m[1] == c[2] -%}
      {%-   set is_ca = m[7] == '1' -%}
      {#-   root: a self-signed CA that signs certificates, or one in the trust store - not a server's own
              self-signed certificate that openssl req -x509 marks CA:TRUE -#}
      {%-   set is_root = is_ca and self_signed and (m[8] == '1' or trust) -%}
      {%-   set _ = out.append({'host': inventory_hostname, 'where': where, 'subject': c[2],
                                'expires': '%Y-%m-%d' | strftime(exp) if exp > 0 else '?', 'end': exp,
                                'days': (((exp - now) / 86400) | round(0, 'floor') | int) if exp > 0 else -99999,
                                'trust': trust, 'der': ('DER|' ~ c[1]) in lines,
                                'id': 'cert:' ~ where ~ ':' ~ c[2] | truncate(80, true, ''),
                                'issuer': m[1], 'serial': m[2] | upper, 'sha1': m[3] | upper, 'sha256': m[4] | upper,
                                'key': m[5], 'sig_alg': m[6], 'ca': is_ca, 'self_signed': self_signed,
                                'sans': m[9].split(', ') | map('trim') | select | list,
                                'tier': '' if m[1] == '' else ('root' if is_root else ('self-signed' if self_signed
                                        else ('intermediate' if is_ca else 'ca-signed')))}) -%}
      {%- endfor -%}
      {{ out | sort(attribute='days') }}

- name: Certs | what could not be checked (a keystore that needs a password ...) - listed, not a finding
  ansible.builtin.set_fact:
    check_certs_skipped: >-
      {%- set out = [] -%}
      {%- for line in _certs.stdout_lines if line.startswith('SKIP|') -%}
      {%-   set c = line.split('|', 2) -%}
      {%-   set _ = out.append({'host': inventory_hostname, 'where': c[1], 'reason': c[2]}) -%}
      {%- endfor -%}
      {{ out }}

- name: Certs | renewed by hand on this host? (cert_renew_skip_hosts / cert_renew_skip_groups - reported, never a CSR)
  ansible.builtin.set_fact:
    check_certs_by_hand: >-
      {{ ((['named in cert_renew_skip_hosts (' ~ _hand_hit | join(', ') ~ ')'] if _hand_hit else [])
         + (['in group ' ~ _hand_in | join(', ') ~ ' (cert_renew_skip_groups)'] if _hand_in else [])) | join(' and ') }}
  vars:
    # a list, or one string as a survey gives it: 'idm01, aap*'
    _hand_hosts: "{{ (cert_renew_skip_hosts | replace(',', ' ')).split() if cert_renew_skip_hosts is string else cert_renew_skip_hosts | default([], true) }}"
    _hand_groups: "{{ (cert_renew_skip_groups | replace(',', ' ')).split() if cert_renew_skip_groups is string else cert_renew_skip_groups | default([], true) }}"
    _hand_hit: >-
      {%- set out = [] -%}
      {%- for p in _hand_hosts if inventory_hostname | name_matches([p]) or inventory_hostname_short | name_matches([p]) -%}
      {%-   set _ = out.append(p) -%}
      {%- endfor -%}
      {{ out }}
    _hand_in: "{{ group_names | intersect(_hand_groups) }}"

- name: Certs | findings
  ansible.builtin.set_fact:
    _certs_findings: >-
      {%- macro _certs_hint(w, der) -%}
      {%-   if ' (https://' in w -%}
      {%-     set hp = w.split(' (https://')[1][:-1] -%}
      {{-     'echo | timeout 10 openssl s_client -connect ' ~ (hp | quote) ~ ' 2>/dev/null | openssl x509 -noout -subject -issuer -dates' -}}
      {%-   elif ' (alias ' in w -%}
      {{-     'keytool -list -v -keystore ' ~ (w.split(' (alias ')[0] | quote) ~ ' </dev/null 2>/dev/null | grep -E "Alias name|Owner|until"' -}}
      {%-   else -%}
      {{-     'openssl x509 ' ~ ('-inform DER ' if der else '') ~ '-noout -subject -issuer -dates -in ' ~ (w | quote) -}}
      {%-   endif -%}
      {%- endmacro -%}
      {%- set f = [] -%}
      {%- for c in check_certs_inventory if c.days <= check_certs_warn_days | int and not c.trust | default(false) -%}
      {%-   set when = ('EXPIRED ' ~ (c.days | abs) ~ ' days ago' if c.days < 0 else 'expires in ' ~ c.days ~ ' days') ~ ' (' ~ c.expires ~ ')' -%}
      {%-   set _ = f.append({'check': 'certs', 'id': c.id,
                              'severity': 'critical' if c.days <= check_certs_crit_days | int else 'warning',
                              'summary': 'certificate ' ~ c.subject ~ ' in ' ~ c.where ~ ' ' ~ when,
                              'hint': _certs_hint(c.where, c.der | default(false)),
                              'note': ('Renewed by hand: this host is ' ~ check_certs_by_hand ~ ' - the certificate renewal job makes'
                                       ~ ' no CSR for it. Renew it the way its product says.') if check_certs_by_hand else ''}) -%}
      {%- endfor -%}
      {%- for line in _certs.stdout_lines if line.startswith('ERR|') -%}
      {%-   set c = line.split('|', 2) -%}
      {%-   set _ = f.append({'check': 'certs', 'id': 'cert-unreadable:' ~ c[1], 'severity': 'warning',
                              'summary': 'could not check the certificate in ' ~ c[1] ~ ': ' ~ c[2], 'hint': ''}) -%}
      {%- endfor -%}
      {{ f }}

- name: Certs | add them to this host's findings
  ansible.builtin.set_fact:
    site_findings: "{{ site_findings | default([]) + _certs_findings }}"

- name: Certs | what was found
  ansible.builtin.debug:
    msg: >-
      {%- set out = [] -%}
      {%- for c in check_certs_inventory -%}
      {%-   set _ = out.append(c.days ~ ' days  ' ~ c.expires ~ '  ' ~ c.subject | truncate(60) ~ '  (' ~ c.where ~ ')') -%}
      {%- endfor -%}
      {{ out or ['no certificates found'] }}
