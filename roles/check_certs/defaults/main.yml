---
# CERTS: certificates that expire soon - as files on the host, inside Java keystores, and as
# served by TLS endpoints (what a browser or client actually sees).

check_certs_warn_days: 30                # a certificate expiring within this many days -> warning (and amber in the certificate report)
check_certs_notice_days: 60                # the certificate report colours these blue (an early heads-up; not a finding)
check_certs_crit_days: 14                # within this many days (or expired) -> critical

# Certificate files (PEM) to check. Globs work. Every certificate in a file is checked (a chain
# file with an expiring intermediate is a problem too).
check_certs_files: []                    # e.g. [/etc/stigman/*.crt, /etc/pki/tls/certs/server.crt]

# Also look for certificates in the usual places. Files with many certificates are CA bundles
# (hundreds of roots, noisy) and are skipped unless listed in check_certs_files.
# Text (PEM) and binary (DER) certificates are both read; the names in any case (.crt, .CRT, .Pem ...).
check_certs_discover: true
check_certs_discover_dirs: [/etc/pki/tls/certs, /etc/pki/nginx, /etc/nginx, /etc/httpd/conf.d, /etc/stigman, /etc/stigman/nginx/tls]  # the folders searched (two levels deep) for *.crt, *.pem, *.cer, *.der (/etc/stigman/nginx/tls: STIG Manager's nginx certificate, three levels down)
check_certs_discover_extra_dirs: []      # more folders searched the same way, added to the ones above (no need to repeat them), e.g. [/home, /root, /opt/app/certs]
check_certs_discover_exclude: 'ca-bundle|ca-certificates|/localhost\.crt$'  # regular expression: found files whose path matches are skipped
check_certs_discover_max_per_file: 10    # a found file with more certificates than this is a CA bundle: listed as not checked (list it in check_certs_files to check each)
# Regular expression on the subject of a package's placeholder certificate: postfix's
# /etc/pki/tls/certs/postfix.pem (O=SomeOrganization), self-signed for a year at install and never renewed.
# A found one is listed as not checked (no finding, no ticket) and none gets a CSR. A real certificate put
# in its place is checked; so is a file listed in check_certs_files.
check_certs_placeholder_subject: '(^|,)O=SomeOrganization(,|$)'

# TLS endpoints, checked FROM this host, e.g. the site's own web server:
#   check_certs_endpoints:
#     - {name: STIG Manager, host: 127.0.0.1, port: 443, servername: stigman.example.mil}
check_certs_endpoints: []

# Java keystores (Tomcat, the ServiceNow MID Server ...). A JKS keystore lists without a
# password; a PKCS12 one needs it - give the NAME of an environment variable that holds it
# (set by an AAP credential), never the password itself:
#   check_certs_keystores:
#     - {path: /opt/servicenow/mid/agent/security/agent_keystore, password_env: KEYSTORE_PASSWORD}
check_certs_keystores: []

# ---- Finding them by themselves (the certificate report turns both on; the health check does not) ----
# Listening TCP ports that answer TLS: each probed once, on the address it listens on, with
# `openssl s_client` (check_certs_probe_timeout seconds each, at most check_certs_discover_ports_max
# ports). Not these ports: plain-text services that would only log a stray connection.
check_certs_discover_ports: false
check_certs_discover_ports_skip: [22, 25, 53, 80, 110, 111, 123, 143, 323, 389, 631, 2049, 3306, 5355, 5432, 6379, 11211, 20048]  # ports never probed (plain-text services: ssh, smtp, dns, http, ldap, databases ...)
check_certs_discover_ports_max: 25       # probe at most this many listening ports (the rest are listed as not probed)
check_certs_probe_timeout: 3             # seconds for each port probe
# Java keystores (*.jks, *.keystore, *.p12, *.pfx) in these folders, and the ones running Java programs
# use (-Djavax.net.ssl.keyStore=...). A keystore that needs a password is listed as not checked: no
# password is ever guessed - give it in check_certs_keystores (password_env). The JDK's own trust
# stores (cacerts) are skipped.
check_certs_discover_keystores: false
check_certs_discover_keystore_dirs: [/etc, /opt, /srv, /usr/share/tomcat, /var/lib/tomcat, /var/lib/pki]  # the folders searched for keystores
check_certs_discover_keystore_depth: 5   # how many folder levels deep the search goes
check_certs_discover_keystore_exclude: '/(cacerts|jssecacerts)$|/jre/lib/security/|/lib/security/'  # regular expression: keystore paths skipped (the JDK's trust stores)
check_certs_discover_keystore_max: 40    # read at most this many found keystores per host

# The host's trust store: the CA certificates it trusts, put in by update-ca-trust (the DoD roots ...). Every
# file in these folders, whatever its name. The certificate report lists them with their dates - never a
# finding, a ticket or a CSR: a CA renews its own certificate (put its new one in the folder and run
# update-ca-trust), and a certificate there is not this host's own. The report turns this on.
check_certs_discover_trust: false
check_certs_trust_dirs: [/etc/pki/ca-trust/source/anchors]  # the folders read (not the folders below them)

# ---- Leaving hosts out (the certificate report and the renewal; not the health check) ----
# Hosts whose certificates something else renews - Satellite and its Capsules (satellite-installer,
# never by hand), appliances - are left out of the certificate report and never get a CSR: listed as
# not checked, no ticket. Name them, or put them in a group. Both take a list or one string with
# commas ('sat01*, cap01.example.mil'), so a survey answer works too.
cert_skip_hosts: []                      # host names as in the AAP inventory, any case, * and ? wildcards; a short name matches the full one, e.g. [sat01, '*capsule*']
cert_skip_groups: [sat]                  # AAP inventory groups, e.g. [sat] (the health check still watches the Satellite web UI: group_vars/sat.yml)

# ---- Renewal: a new key and CSR for each certificate that expires soon (playbooks/cert_renew_csr.yml) ----
# The certificates the report flags (within check_certs_warn_days - 30 days or less - or expired) get a
# new key and a CSR with the same subject and names (subjectAltName), on the host; the CSR is attached
# to the certificate's ServiceNow incident (a new one if none is open, whatever servicenow_min_severity says).
# A certificate file, one served on a port (read from the port) and one in a keystore (its entry with a
# key) all get one; the ticket says where to install it. Never: CA certificates (a chain), self-signed ones
# (unless cert_renew_self_signed), placeholders (check_certs_placeholder_subject), the trust store
# (check_certs_trust_dirs, /etc/pki/ca-trust/: certificates this host trusts, not its own).
cert_renew_dir: /etc/pki/tls/renew       # the new keys (0600) and CSRs, on the host (the folder is made 0700); the key never leaves the host
# Hosts whose certificates are renewed by hand (IdM, AAP ...): in the certificate report and its tickets as
# usual - each ticket says it is renewed by hand - but the renewal makes no CSR for them (listed, with why).
# The same forms as cert_skip_hosts / cert_skip_groups (which leave a host out of the report too).
cert_renew_skip_hosts: []                # e.g. [idm01, 'aap*'], or 'idm01, aap*'
cert_renew_skip_groups: []               # e.g. [idm]
cert_renew_key_bits: 2048                # RSA key size, at least 2048 (a bigger old key keeps its size; an EC certificate gets a new key on the same curve)
cert_renew_digest: sha256                # the CSR's signature: sha256, sha384 or sha512
cert_renew_max: 10                       # at most this many NEW CSRs per host in one run (the rest come the next run)
cert_renew_only: ''                      # regular expression: only certificates whose place matches - a file's path, a keystore's path, 'TLS port 8443, ...' (empty = every one), e.g. '^/etc/pki/tls/certs/'
cert_renew_issuer: ''                    # regular expression: only certificates whose issuer matches (empty = any CA), e.g. 'O=U\.S\. Government'
# Certificates something else renews - never a CSR from here. The path (Satellite, Capsule, Puppet,
# subscription-manager on every registered host) and the issuer (Satellite's own CA, Puppet's CA).
# Check the report's Where column for your hosts' paths and add yours.
cert_renew_exclude: '/(katello|foreman|foreman-proxy|candlepin|pulp|puppet|puppetlabs|rhsm|qpid)/|/etc/pki/(consumer|entitlement|product|product-default)/|/root/ssl-build/'
cert_renew_exclude_issuer: 'O=Katello|Puppet CA'   # regular expression on the issuer: Satellite's own CA (O=Katello), Puppet's CA - never a CSR from here
# Self-signed certificates (made on the host by an application or a person, not by a PKI) are reported
# and get a ticket, but no CSR - unless this is true: then the PKI is asked for a real certificate in
# their place (a STIG wants PKI certificates). Never a CA's own certificate (a root: it signs
# certificates), never one only for localhost, never a package's placeholder (postfix's:
# check_certs_placeholder_subject). cert_renew_issuer does not apply to them.
cert_renew_self_signed: false
# What to do with the issued certificate when something else deploys the file (a copy by hand would be
# overwritten): the start of the file's path -> the next step written on the ticket instead of
# "install it in place of the file". Add your own.
cert_renew_install_notes:
  /etc/stigman/: >-
    STIG Manager: put the issued certificate (with its chain) and the new key in the AAP credential
    "TLS certificate", then run STIG Manager - deploy (it restarts only nginx). A file copied by hand
    is overwritten by the next deploy.
# The CSR's attachment on the ticket: <common name>-<8 characters of the CSR's SHA-256>.<ext> (a new CSR, a new name).
# An instance that refuses .csr attachments (its allowed extensions, or "Invalid file type: text/plain"): txt
# names every CSR .txt from the start. Refused, it is tried again as .txt (cert_renew_attach_retry_txt); refused
# again, the CSR goes in the ticket's work note and the job fails, to be seen.
cert_renew_attach_ext: csr
cert_renew_attach_type: text/plain       # the attachment's Content-Type (a CSR is Base64 text)
cert_renew_attach_retry_txt: true        # a refused attachment is tried again as <name>.txt (text/plain); false: straight to the work note
