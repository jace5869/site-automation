---
# With ad_lockout_check_sources (playbooks/ad_lockout.yml, on the AAP side): the source computers that
# are hosts of this inventory join the in-memory group adl_sources, each with the accounts to look for
# (adl_source_users), for the next play (sources.yml). Input: _adl (build.yml).
- name: Lockout | the source computers to look on
  ansible.builtin.add_host:
    name: "{{ item.key }}"
    groups: adl_sources
    adl_source_users: "{{ item.value }}"
  loop: "{{ _adl.check | dict2items }}"
  loop_control:
    label: "{{ item.key }}: {{ item.value | map(attribute='sam') | join(', ') }}"
  changed_when: false

# a Limit applies to the next play too: a source computer outside it is skipped there without a word
- name: Lockout | source computers outside the job's Limit are not looked on
  ansible.builtin.debug:
    msg: >-
      Not looked on - outside the job's Limit ({{ ansible_limit }}): {{ _adl_outside | join(', ') }}. Leave the Limit
      empty to look on them (target picks the DCs), or add them to it.
  vars:
    _adl_outside: "{{ _adl.check.keys() | list | difference(query('ansible.builtin.inventory_hostnames', ansible_limit | default('all', true))) }}"
  when: ansible_limit | default('', true) | length > 0 and _adl_outside | length > 0

- name: Lockout | looked on
  ansible.builtin.debug:
    msg: >-
      {{ ('Looking on ' ~ _adl.check.keys() | join(', ') ~ ' for what runs as the account.') if _adl.check
         else 'No source computer is a host of this inventory: nothing to look on (the report says how to check them by hand).' }}
