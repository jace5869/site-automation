---
# Before anything is read (playbooks/ad_lockout.yml, first play, run once): the accounts asked for
# (ad_lockout_user) are names, and an unlock names its account. Output: _adl_names.
- name: Lockout | the accounts asked for (ad_lockout_user)
  ansible.builtin.set_fact:
    _adl_in: "{{ ad_lockout_user | default('', true) | ad_lockout_names(ad_lockout_max_users | int) }}"
  run_once: true

- name: Lockout | each one is an account name
  ansible.builtin.assert:
    that: _adl_in.problems | length == 0
    fail_msg: "Nothing was read: {{ _adl_in.problems | join('; ') }}."
    quiet: true
  run_once: true

- name: Lockout | an unlock names its account
  ansible.builtin.assert:
    that: not (ad_lockout_unlock | bool) or _adl_in.names | length > 0
    fail_msg: >-
      ad_lockout_unlock unlocks only an account asked for by name: set ad_lockout_user (e.g. CORP\jdoe).
      Nothing was read or unlocked.
    quiet: true
  run_once: true

- name: Lockout | what is looked at
  ansible.builtin.set_fact:
    _adl_names: "{{ _adl_in.names }}"
  run_once: true

- name: Lockout | looking for
  ansible.builtin.debug:
    msg: >-
      {{ ('The account(s) ' ~ _adl_names | join(', ') if _adl_names else 'Every account locked out now')
         ~ ', in the Security logs of the last ' ~ ad_lockout_hours ~ ' h'
         ~ ('; then UNLOCK it if it is locked out' ~ (' (dry run: only says so)' if ansible_check_mode else '') if ad_lockout_unlock | bool else '')
         ~ ('; then look on the source computers of this inventory' if ad_lockout_check_sources | bool else '') ~ '.' }}
  run_once: true
