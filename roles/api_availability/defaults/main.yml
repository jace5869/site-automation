---
# AVAILABILITY CHECKS (playbooks/stigman_availability.yml, playbooks/servicenow_availability.yml): every 5 to 15 minutes,
# each address of the service asked a few times, read-only. A clean run is one line - no email. The job FAILS when the
# service is down (availability_fail_on), for a workflow's notification or ServiceNow ticket step; its own runs in AAP
# then give the availability over a day, a week and a month. docs/AVAILABILITY.md

availability_attempts: 3                 # times each address is asked in one run
availability_pause_seconds: 2            # seconds between two tries of one address
availability_timeout: 10                 # seconds a try may take; no answer by then = a bad try
availability_slow_ms: 3000               # an answer slower than this (median of the tries), in milliseconds -> warning
# One node (one server behind the service's address) that does not answer while the address still does: warning, or
# critical to fail the job for it too. Every node down with no service address set: critical.
availability_node_down: warning
# The job shows FAILED (a workflow's "On failure" path) when a run finds a condition of these severities.
availability_fail_on: [critical]
# The report is emailed (report_email_to) and published (report_web_dest) only when a run finds a condition of these
# severities - [critical, warning] also for slow, flaky or one node down; a clean run is one line in the job output.
availability_report_on: [critical]
availability_report_recovery: true       # also a report when the service answers again after a failed run ("UP again")
# The availability over these periods (hours), from this template's own runs in AAP: a run that ended well = up, a
# failed one = down. Needs a "Red Hat Ansible Automation Platform" credential on the template (Organization Auditor);
# without one the check still runs, without the percentages.
availability_history: true
availability_history_hours: [24, 168, 720]   # the periods: a day, a week, a month
