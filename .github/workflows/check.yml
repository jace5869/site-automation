name: Checks

on:
  push:
  pull_request:

jobs:
  ansible:
    name: Ansible syntax + shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ansible-core
        run: pip install ansible-core
      - name: Syntax-check every playbook (site + vendored ACT)
        run: |
          set -e
          for pb in playbooks/*.yml vendor/act/ansible/playbooks/*.yml; do
            echo "== $pb"
            ANSIBLE_ROLES_PATH=roles:vendor/act/ansible/roles ansible-playbook --syntax-check "$pb"
          done
      - name: Syntax-check with the oldest ansible-core we support (2.16, as in older AAP EEs)
        run: |
          set -e
          python -m venv /tmp/ac216 && /tmp/ac216/bin/pip -q install 'ansible-core==2.16.*'
          for pb in playbooks/*.yml; do
            ANSIBLE_ROLES_PATH=roles:vendor/act/ansible/roles /tmp/ac216/bin/ansible-playbook --syntax-check "$pb"
          done
      - name: Filter plugins (unit tests)
        run: python tests/test_filters.py
      - name: Credential types and inventory are valid YAML
        run: |
          python - <<'PY'
          import glob, yaml
          for f in glob.glob('aap/credential_types/*.yml') + glob.glob('inventories/example/**/*.yml', recursive=True):
              yaml.safe_load(open(f)); print('ok', f)
          PY
      - name: Shell scripts parse
        run: for f in scripts/*.sh; do bash -n "$f"; done
      - name: No private keys or obvious secrets committed
        run: |
          if git grep -nE -e '-----BEGIN [A-Z ]*PRIVATE KEY-----[A-Za-z0-9+/=]' -e 'AKIA[0-9A-Z]{16}' -- . ':!vendor'; then
            echo "secret-looking content found"; exit 1; fi

  windows-update-script:
    name: update-from-release.ps1 on Windows (PowerShell 5.1 and 7)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Windows PowerShell 5.1
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/test_update_from_release.ps1
      - name: PowerShell 7
        shell: pwsh
        run: pwsh -NoProfile -File tests/test_update_from_release.ps1
