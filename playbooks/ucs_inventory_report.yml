---
# CISCO UCS INVENTORY. Read-only (XML API queries to each UCS Manager domain over HTTPS; the session logged out after):
# every domain's fabric interconnects (model, serial, role, firmware), chassis and IO modules, blades and rack servers
# (model, serial, service profile, CPUs, memory, BIOS, CIMC, adapters and their firmware, storage controllers), power
# supplies, every running firmware and UCS Manager's critical and major faults - the server models in use with their
# BIOS and CIMC versions. Emailed (report_email_to) with all of it as an Excel workbook (ucs_inventory_xlsx), and on the
# report website (report_web_dest).
# Runs on the AAP side: attach a "Cisco UCS Manager" credential, set ucs_domains; no Limit. docs/UCS.md
#   ansible-playbook playbooks/ucs_inventory_report.yml -e '{"ucs_domains": ["ucs01.example.mil"]}'
- name: Cisco UCS inventory
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Cisco UCS inventory
      ansible.builtin.include_role:
        name: ucs_report
