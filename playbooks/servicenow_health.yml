---
# SERVICENOW HEALTH - does the instance answer its API (and how fast), and are its MID Servers well?
# Read-only. Every MID Server problem is in this one job and its one report:
#   - what the instance says (on the controller): each MID Server Up and validated, its heartbeat recent,
#     the versions alike, the expected ones there (servicenow_mid_expected), its output queue moving
#     (ecc_queue), its open MID Server Issues (ecc_agent_issue)
#   - what the MID Server HOSTS say (Windows, over WinRM): the hosts of the group servicenow_mid_hosts
#     (servicenow_mid_hosts_group) of the job's inventory - each MID service running and starting by
#     itself, its agent log written lately, SEVERE lines, JVM restarts, the drive's free space, config.xml
#     pointing at this instance. No such group: the instance's view only.
#
# Credentials: "ServiceNow API" - the account needs read on incident, ecc_agent, ecc_queue and
# ecc_agent_issue (e.g. itil + mid_server); with MID hosts, also the Windows inventory's Machine
# (Windows) credential. docs/SERVICENOW_SETUP.md, "MID Servers".
#   ansible-playbook -i inventories/example-windows playbooks/servicenow_health.yml
- name: ServiceNow health - the MID Server hosts (Windows)
  hosts: "{{ servicenow_mid_hosts_group | default('servicenow_mid_hosts') }}"
  gather_facts: false
  tasks:
    - name: Read each MID Server host (read-only)
      ansible.builtin.include_role:
        name: servicenow
        tasks_from: mid_host.yml
      when: servicenow_check_mid_hosts | default(true) | bool

- name: ServiceNow health
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Check the instance and its MID Servers (and what their hosts said)
      ansible.builtin.include_role:
        name: servicenow
        tasks_from: health.yml

    - name: Report (fails when something is wrong)
      ansible.builtin.include_role:
        name: site_findings
        tasks_from: report.yml
      vars:
        site_syslog: false
        site_report_name: servicenow         # the name its findings (and tickets) carry
