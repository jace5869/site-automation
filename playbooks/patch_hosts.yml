---
# PATCH - install updates, reboot when they need it, and prove each host came back healthy.
# NO AUTOMATIC RESTARTS unless automatic_restarts is true (template Variables or survey): without it
# the updates are installed and the job says which hosts still need a reboot.
#
# Meant for the "Patch with checks" workflow:
#   [Health check: pre] -> [Approval] -> [THIS] -> [Health check: post] -> [ServiceNow tickets]
#
# - One host at a time (patch_serial), and the rollout STOPS at the first host that fails.
# - Every service that was running before the update must be running after it.
# - Hosts in no_patch, and always the AAP hosts (aap, aap_hosts), are skipped: never patched, never
#   rebooted by a job. Add more groups with patch_never_patch_groups / patch_never_reboot_groups.
# - Refuses to patch the machine the job runs from.
# - Hosts on the VMware protected lists (vmware_protected_groups, vmware_protected_vms, vm_snapshot_cleanup_exclude_vms)
#   are skipped too; patch_protected_with_snapshot patches them, each right after its own snapshot.
# - Check mode (a dry run) lists what would be updated and changes nothing: run it that way first.
# - patch_snapshot: true = a VMware snapshot of each VM (named patching) right before it is patched; every host's
#   VM is found first, before any host is patched. Attach a "VMware vCenter" credential too. docs/RUNBOOKS.md
#
#   ansible-playbook playbooks/patch_hosts.yml --check -l web01.example.mil
#   ansible-playbook playbooks/patch_hosts.yml -l web01.example.mil -e patch_security_only=true
#   ansible-playbook playbooks/patch_hosts.yml -l web01.example.mil -e automatic_restarts=true
#   ansible-playbook playbooks/patch_hosts.yml -l rhel9_all -e patch_serial=10 -e patch_snapshot=true
- name: Target check (stops with a clear message when target matches no host)
  hosts: all
  gather_facts: false
  tasks:
    - name: The target leaves at least one host to run on
      ansible.builtin.include_role:
        name: site_findings
        tasks_from: target_check.yml
      vars:
        _target_pattern: "{{ target | default('patch_hosts') }}"

- name: Patch hosts - each host's VM, for the snapshot before patching (patch_snapshot)
  # once, before any host is patched: a host whose VM is not found stops the job here (on the AAP side: run_once,
  # delegated to localhost; a Limit of hosts needs no localhost)
  hosts: "{{ target | default('patch_hosts') }}"
  gather_facts: false
  tasks:
    - name: Linux hosts only
      ansible.builtin.include_role:
        name: site_findings
        tasks_from: os_guard.yml
      when: patch_snapshot | default(false) | bool

    - name: Each host's VM in vCenter, and the old snapshots in the way
      ansible.builtin.include_role:
        name: patch
        tasks_from: snapshot_vms.yml
        apply:
          delegate_to: localhost
          run_once: true
          become: false
      vars:
        ansible_connection: local
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
      when: patch_snapshot | default(false) | bool

- name: Patch hosts
  hosts: "{{ target | default('patch_hosts') }}"
  become: true
  gather_facts: false
  serial: "{{ patch_serial | default(1) }}"
  max_fail_percentage: 0
  pre_tasks:
    - name: Linux hosts only (this playbook never touches a Windows server)
      ansible.builtin.include_role:
        name: site_findings
        tasks_from: os_guard.yml

    - name: Notice about settings files that override AAP's Variables box
      ansible.builtin.include_role:
        name: site_findings
        tasks_from: settings_notice.yml
  roles:
    - role: patch
