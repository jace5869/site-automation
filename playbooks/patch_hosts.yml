---
# PATCH - install updates, reboot when they need it, and prove each host came back healthy.
# NO AUTOMATIC RESTARTS unless automatic_restarts is true (template Variables or survey): without it
# the updates are installed and the job says which hosts still need a reboot.
#
# Meant for the "Patch with checks" workflow:
#   [Health check: pre] -> [Approval] -> [THIS] -> [Health check: post] -> [ServiceNow tickets]
#
# - One host at a time (patch_serial), and the rollout STOPS at the first host that fails.
# - A host that cannot be reached at the start is listed (NOT REACHED) and left out, and the job goes on with the
#   others (patch_skip_unreachable; false = it fails and stops the rollout). A host lost later still fails it.
# - RHEL 8 and later are patched with dnf, RHEL 7 and its clones with yum; a host with neither is listed (NO DNF OR YUM)
#   and left out (patch_skip_unsupported).
# - Every service that was running before the update must be running after it.
# - Hosts in no_patch, and always the AAP hosts (aap, aap_hosts), are skipped: never patched, never
#   rebooted by a job. Add more groups with patch_never_patch_groups / patch_never_reboot_groups.
# - Refuses to patch the machine the job runs from.
# - Hosts on the VMware protected lists (vmware_protected_groups, vmware_protected_vms, vm_snapshot_cleanup_exclude_vms)
#   are skipped too; patch_protected_with_snapshot patches them, each right after its own snapshot.
# - Check mode (a dry run) lists what would be updated and changes nothing: run it that way first.
# - Each host is asked first which updates it has (dnf / yum check-update, read-only, the same filters as the update):
#   one with none is listed (UP TO DATE - nothing to patch) and left out - no snapshot, not patched (patch_update_check).
# - patch_snapshot: true = a VMware snapshot of each VM (named patching) right before it is patched; every host's
#   VM is found first, before any host is patched. Attach a "VMware vCenter" credential too. A run again within
#   patch_snapshot_reuse_hours (24) keeps the snapshot the first run took instead of a second one. docs/RUNBOOKS.md
# - The last lines: each host with its updates and its snapshot.
#
#   ansible-playbook playbooks/patch_hosts.yml --check -l web01.example.mil
#   ansible-playbook playbooks/patch_hosts.yml -l web01.example.mil -e patch_security_only=true
#   ansible-playbook playbooks/patch_hosts.yml -l web01.example.mil -e automatic_restarts=true
#   ansible-playbook playbooks/patch_hosts.yml -l rhel9_all -e patch_serial=10 -e patch_snapshot=true
- name: Target check (stops with a clear message when target matches no host)
  hosts: all
  gather_facts: false
  tasks:
    - name: The target leaves at least one host to run on
      ansible.builtin.include_role:
        name: site_findings
        tasks_from: target_check.yml
      vars:
        _target_pattern: "{{ target | default('patch_hosts') }}"

- name: Patch hosts - which hosts answer (patch_skip_unreachable)
  # once, before any host is patched: a host that cannot be reached (switched off, a firewall, ssh refused) is listed
  # as NOT REACHED and left out of the run - not patched, no snapshot, the job not failed for it. The hosts never
  # patched here (patch_never_patch_groups, AAP) are not contacted. No host reached at all fails the job (the machine
  # credential?). patch_skip_unreachable: false = every host goes on, and one not reached fails and stops the rollout.
  hosts: "{{ target | default('patch_hosts') }}"
  gather_facts: false
  tasks:
    - name: Linux hosts only
      ansible.builtin.include_role:
        name: site_findings
        tasks_from: os_guard.yml

    - name: Not contacted yet
      ansible.builtin.set_fact:
        site_host_unreached: ""

    - name: A host that cannot be reached is listed and left out - the job is not failed for it
      ansible.builtin.include_role:
        name: site_findings
        tasks_from: reach.yml
      when:
        - patch_skip_unreachable | default(true) | bool
        - group_names | intersect((patch_never_patch_groups | default(['no_patch', 'aap', 'aap_hosts', 'sat', 'netapp', 'netapp_console_hosts'])) + ['aap', 'aap_hosts']) | length == 0

    # a host with neither dnf nor yum (not a RHEL-like Linux) is not one this job patches: listed as NO DNF OR YUM and
    # left out, the job not failed for it (patch_skip_unsupported; false = it fails at the update). RHEL 7 and its clones
    # are patched with yum. A host the facts cannot be read from goes on and fails where it always did.
    - name: Its package manager (patch_skip_unsupported)
      ansible.builtin.setup:
        gather_subset: ['!all', '!min', 'pkg_mgr', 'distribution']
      ignore_unreachable: true
      failed_when: false
      check_mode: false
      register: _patch_pkg
      when:
        - patch_skip_unsupported | default(true) | bool
        - site_host_unreached | length == 0
        - group_names | intersect((patch_never_patch_groups | default(['no_patch', 'aap', 'aap_hosts', 'sat', 'netapp', 'netapp_console_hosts'])) + ['aap', 'aap_hosts']) | length == 0

    # ansible-core 2.16 says yum on RHEL 7; later ones say unknown there (as roles/patch decides)
    - name: A host with neither dnf nor yum is listed and left out - the job is not failed for it
      ansible.builtin.set_fact:
        patch_unsupported: >-
          {{ _f.ansible_distribution | default('?') }} {{ _f.ansible_distribution_version | default('') }}, {{ _f.ansible_pkg_mgr }}
      vars:
        _f: "{{ _patch_pkg.ansible_facts | default({}) }}"
      when:
        - _f.ansible_pkg_mgr | default('dnf') not in ['dnf', 'dnf5', 'yum']
        - not (_f.ansible_os_family | default('') == 'RedHat' and _f.ansible_distribution_major_version | default('0') | int < 8)

    - name: Neither dnf nor yum - the job goes on without it
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}: NO DNF OR YUM - {{ patch_unsupported }}. This job patches RHEL and its clones (dnf,
          or yum on 7); left out of this run, the job is not failed for it. Patch it another way, or put it in no_patch.
      when: patch_unsupported is defined

    - name: Leave it out
      ansible.builtin.meta: end_host
      when: patch_unsupported is defined

    # a host that answers but where the job cannot become root (sudo refused, its password wrong or missing), or with too
    # little room in /var: listed as NOT READY and left out, the job not failed for it - nothing was changed on it.
    # Nothing is cleaned up; free the space or fix the account, then run again for it. patch_skip_not_ready: false =
    # it fails in the patch play, as before 0.89.0. A refused become fails the task before the command runs (failed_when
    # does not see it): ignore_errors keeps the host for the "Not ready" step, which lists it.
    - name: Root on it, and room in /var (patch_skip_not_ready)
      ansible.builtin.command: df -P -m /var
      become: true
      ignore_unreachable: true
      ignore_errors: true
      failed_when: false
      changed_when: false
      check_mode: false
      register: _patch_ready
      when:
        - patch_skip_not_ready | default(true) | bool
        - site_host_unreached | length == 0
        - group_names | intersect((patch_never_patch_groups | default(['no_patch', 'aap', 'aap_hosts', 'sat', 'netapp', 'netapp_console_hosts'])) + ['aap', 'aap_hosts']) | length == 0

    # the reason without the login banner: the last line of the output that is not ssh's, else Ansible's own message
    - name: Not ready - root refused, or /var too full
      ansible.builtin.set_fact:
        patch_not_ready: >-
          {%- if _patch_ready.unreachable | default(false) or _patch_ready.failed | default(false) or _patch_ready.rc | default(0) != 0 -%}
          {%-   set lines = ((_patch_ready.module_stderr | default('')) ~ '\n' ~ (_patch_ready.stderr | default(''))
                            ~ '\n' ~ (_patch_ready.module_stdout | default(''))).splitlines()
                            | map('regex_replace', '^\\[[^\\]]*key=[^\\]]*\\][^:]*:', '') | map('trim')
                            | reject('equalto', '') | reject('match', '(?i)^shared connection to ') | list -%}
          {#-   a refused become: the last line sudo printed, else Ansible's first line (a password prompt's echo taken off) -#}
          {%-   set mparts = (_patch_ready.msg | default('') | string).split('>>> Standard Error') -%}
          {%-   set mlines = (mparts[1:] | join('\n')).splitlines() | map('regex_replace', '^\\[[^\\]]*key=[^\\]]*\\][^:]*:', '')
                             | map('trim') | reject('equalto', '') | reject('match', '^>>>') | list -%}
          {%-   set mfirst = mparts[0].splitlines() | map('regex_replace', '^Task failed:\\s*', '') | map('trim')
                             | reject('equalto', '') | first | default('') -%}
          {%-   set m = lines[-1] if lines else (mlines[-1] if mlines else mfirst) -%}
          cannot become root: {{ (m or 'unknown') | regex_replace('[.]$', '') | truncate(200) }}
          {%- else -%}
          {%-   set free = _patch_ready.stdout_lines[-1].split()[3] | int -%}
          {%-   if free < patch_min_free_mb | default(1024) | int -%}only {{ free }} MB free in /var (need {{ patch_min_free_mb | default(1024) }} MB){%- endif -%}
          {%- endif -%}
      when:
        - _patch_ready is not skipped
        - _patch_ready.unreachable | default(false) or _patch_ready.failed | default(false) or _patch_ready.rc | default(0) != 0
          or (_patch_ready.stdout_lines[-1].split()[3] | int) < patch_min_free_mb | default(1024) | int
        # with patch_skip_unreachable: false a host not reached goes on, and fails the job in the patch play
        - not _patch_ready.unreachable | default(false) or patch_skip_unreachable | default(true) | bool

    - name: Not ready - the job goes on without it
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}: NOT READY - {{ patch_not_ready }}. Nothing was changed on it; left out of this run,
          the job is not failed for it. Fix that, then run again for it.
      when: patch_not_ready is defined

    - name: Leave it out (not ready)
      ansible.builtin.meta: end_host
      when: patch_not_ready is defined

    # the updates it has, before any snapshot: dnf check-update (yum on RHEL 7) with the same filters as the update
    # (patch_security_only, patch_exclude, patch_packages) - read-only, in Check mode too. 100 = updates, 0 = none: UP TO
    # DATE, left out (no snapshot, not patched), the job green. Another answer (a repository not reached) does not tell:
    # the host goes on as before 1.1.0, and the update itself says what is wrong.
    - name: The updates it has (patch_update_check)
      ansible.builtin.command:
        argv: >-
          {{ [('yum' if _patch_pkg.ansible_facts.ansible_pkg_mgr | default('dnf') not in ['dnf', 'dnf5'] else 'dnf'), '-q', 'check-update']
             + (['--security'] if patch_security_only | default(false) | bool else [])
             + (patch_exclude | default([]) | map('regex_replace', '^', '--exclude=') | list)
             + ([] if patch_packages | default(['*']) | list == ['*'] else patch_packages | list) }}
      become: true
      ignore_unreachable: true
      failed_when: false
      changed_when: false
      check_mode: false
      register: _patch_check
      when:
        - patch_update_check | default(true) | bool
        - site_host_unreached | length == 0
        - group_names | intersect((patch_never_patch_groups | default(['no_patch', 'aap', 'aap_hosts', 'sat', 'netapp', 'netapp_console_hosts'])) + ['aap', 'aap_hosts']) | length == 0

    - name: How many
      ansible.builtin.set_fact:
        # the package lines only ("name.arch  version  repository"), each name once; not the "Obsoleting Packages" part
        patch_updates: >-
          {{ (_patch_check.stdout | default('')).split('Obsoleting Packages')[0].splitlines() | map('trim')
             | select('match', '^\S+\.\S+\s+\S+\s+\S+$') | map('split') | map('first') | unique | list | length
             if _patch_check.rc | default(-1) == 100 else 0 }}
      when: _patch_check.rc | default(-1) in [0, 100]

    - name: The update check did not answer - the host goes on, the update says why
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}: the update check did not answer (rc {{ _patch_check.rc | default('?') }}:
          {{ ((_patch_check.stderr | default('')).splitlines() | last | default(_patch_check.msg | default('')) | string) | truncate(200) }}) -
          it goes on as if it had updates.
      when: _patch_check is not skipped and _patch_check.rc | default(-1) not in [0, 100]

    - name: Up to date - nothing to patch
      ansible.builtin.set_fact:
        patch_up_to_date: true
      when: _patch_check.rc | default(-1) == 0

    - name: Up to date - the job goes on without it
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}: UP TO DATE - nothing to patch{{ ' (security updates only)' if patch_security_only | default(false) | bool else '' }}.
          No snapshot, not patched; the job is not failed for it.
      when: patch_up_to_date is defined

    - name: Leave it out (up to date)
      ansible.builtin.meta: end_host
      when: patch_up_to_date is defined

    - name: The hosts that go on
      ansible.builtin.group_by:
        key: patch_reached
      changed_when: false

- name: Patch hosts - each host's VM, for the snapshot before patching (patch_snapshot)
  # once, before any host is patched: a host whose VM is not found stops the job here (on the AAP side: run_once,
  # delegated to localhost; a Limit of hosts needs no localhost)
  hosts: "{{ target | default('patch_hosts') }}:&patch_reached"
  gather_facts: false
  tasks:
    - name: Linux hosts only
      ansible.builtin.include_role:
        name: site_findings
        tasks_from: os_guard.yml
      when: patch_snapshot | default(false) | bool

    - name: Each host's VM in vCenter, and the old snapshots in the way
      ansible.builtin.include_role:
        name: patch
        tasks_from: snapshot_vms.yml
        apply:
          delegate_to: localhost
          run_once: true
          become: false
      vars:
        ansible_connection: local
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
      when: patch_snapshot | default(false) | bool

- name: Patch hosts
  hosts: "{{ target | default('patch_hosts') }}:&patch_reached"
  become: true
  gather_facts: false
  serial: "{{ patch_serial | default(1) }}"
  max_fail_percentage: 0
  pre_tasks:
    - name: Linux hosts only (this playbook never touches a Windows server)
      ansible.builtin.include_role:
        name: site_findings
        tasks_from: os_guard.yml

    - name: Notice about settings files that override AAP's Variables box
      ansible.builtin.include_role:
        name: site_findings
        tasks_from: settings_notice.yml
  roles:
    - role: patch

- name: Patch hosts - not reached, so not patched
  hosts: "{{ target | default('patch_hosts') }}"
  gather_facts: false
  tasks:
    # each host: its updates (from the check before the snapshots) and its snapshot (taken, reused, none)
    - name: Patch hosts | each host - its updates and its snapshot
      ansible.builtin.debug:
        msg: "{{ _rows }}"
      vars:
        _rows: >-
          {%- set out = [] -%}
          {%- set w = [ansible_play_hosts_all | map('length') | max | default(4), 4] | max -%}
          {%- set _ = out.append('%-*s  %-22s  %s' | format(w, 'Host', 'Updates', 'Snapshot')) -%}
          {%- for h in ansible_play_hosts_all | sort -%}
          {%-   set v = hostvars[h] -%}
          {%-   set upd = 'up to date' if v.patch_up_to_date is defined else
                          ((v.patch_updates ~ ' pending') if v.patch_updates | default(0) | int > 0 else
                           'not checked' if v.patch_updates is not defined else 'none pending') -%}
          {%-   if v.site_host_unreached | default('') -%}{%- set upd = 'NOT REACHED' -%}
          {%-   elif v.patch_not_ready is defined -%}{%- set upd = 'NOT READY' -%}
          {%-   elif v.patch_unsupported is defined -%}{%- set upd = 'NO DNF OR YUM' -%}{%- endif -%}
          {%-   set snap = 'not needed - up to date' if v.patch_up_to_date is defined else
                           v._patch_snapshot | default('none (patch_snapshot is false)' if not patch_snapshot | default(false) | bool else 'none') -%}
          {%-   set _ = out.append('%-*s  %-22s  %s' | format(w, h, upd, snap)) -%}
          {%- endfor -%}
          {{ out }}
      run_once: true

    - name: Patch hosts | UP TO DATE - nothing to patch (no snapshot, not patched)
      ansible.builtin.debug:
        msg: "{{ _current | length }} host(s) up to date, nothing to patch: {{ _current | join(', ') }}"
      vars:
        _current: >-
          {{ ansible_play_hosts_all | map('extract', hostvars) | selectattr('patch_up_to_date', 'defined')
             | map(attribute='inventory_hostname') | list }}
      run_once: true
      when: _current | length > 0

    - name: Patch hosts | NOT REACHED - not patched (fix the network or firewall, then run again for these)
      ansible.builtin.debug:
        msg: >-
          {{ _unreached | length }} host(s) not reached, not patched:
          {% for h in _unreached %}{{ h }} ({{ hostvars[h].site_host_unreached }}){{ '; ' if not loop.last else '' }}{% endfor %}
      vars:
        _unreached: >-
          {{ ansible_play_hosts_all | map('extract', hostvars) | selectattr('site_host_unreached', 'defined')
             | rejectattr('site_host_unreached', 'equalto', '')
             | map(attribute='inventory_hostname') | list }}
      run_once: true
      when: _unreached | length > 0

    - name: Patch hosts | NOT READY - not patched (root refused or /var too full - fix that, then run again for these)
      ansible.builtin.debug:
        msg: >-
          {{ _not_ready | length }} host(s) not ready, not patched:
          {% for h in _not_ready %}{{ h }} ({{ hostvars[h].patch_not_ready }}){{ '; ' if not loop.last else '' }}{% endfor %}
      vars:
        _not_ready: >-
          {{ ansible_play_hosts_all | map('extract', hostvars) | selectattr('patch_not_ready', 'defined')
             | map(attribute='inventory_hostname') | list }}
      run_once: true
      when: _not_ready | length > 0

    - name: Patch hosts | NO DNF OR YUM - not patched (not a RHEL-like Linux - patch them another way, or put them in no_patch)
      ansible.builtin.debug:
        msg: >-
          {{ _unsupported | length }} host(s) with neither dnf nor yum, not patched:
          {% for h in _unsupported %}{{ h }} ({{ hostvars[h].patch_unsupported }}){{ '; ' if not loop.last else '' }}{% endfor %}
      vars:
        _unsupported: >-
          {{ ansible_play_hosts_all | map('extract', hostvars) | selectattr('patch_unsupported', 'defined')
             | map(attribute='inventory_hostname') | list }}
      run_once: true
      when: _unsupported | length > 0
