---
# PATCH - install updates, reboot when they need it, and prove each host came back healthy.
# NO AUTOMATIC RESTARTS unless automatic_restarts is true (template Variables or survey): without it
# the updates are installed and the job says which hosts still need a reboot.
#
# Meant for the "Patch with checks" workflow:
#   [Health check: pre] -> [Approval] -> [THIS] -> [Health check: post] -> [ServiceNow tickets]
#
# - One host at a time (patch_serial). A host that fails or is lost (a dnf error, no return after its reboot, lost
#   mid-run) is listed as COULD NOT PATCH with its reason and the others go on (patch_continue_on_failure, default true;
#   false = the rollout stops there: the rest of that batch goes no further, no later batch starts).
# - The report (1.74.0): every host - patched, up to date, skipped on purpose, could not patch or needs a look - as the
#   other reports (report_email_to, report_web_dest; the workbook). Then the job fails when a host could not be patched
#   (patch_fail_on_could_not, default true) - after all the others are done and the report is sent. A dry run (Check
#   mode) sends it too, as "DRY RUN - Patch hosts" (its own page), so the approver sees the problem hosts first - and
#   stays green, so the workflow's approval follows it.
# - A host that cannot be reached at the start is listed (NOT REACHED) and left out, and the job goes on with the
#   others (patch_skip_unreachable; false = it goes on to the patch play and is lost there).
# - RHEL 8 and later are patched with dnf, RHEL 7 and its clones with yum; a host with neither is listed (NO DNF OR YUM)
#   and left out (patch_skip_unsupported).
# - Every service that was running before the update must be running after it.
# - Patch by hand (1.74.1): the hosts of patch_by_hand_hosts and patch_by_hand_groups (all.yml) are never patched or
#   rebooted by this job, and get no snapshot. They are only checked, read-only (their updates, a reboot pending), and
#   the report lists them under "Patch by hand". Never a failure. patch_reboot_allowed: false = no host is rebooted.
# - Hosts in no_patch, and always the AAP hosts (aap, aap_hosts), are skipped: never patched, never
#   rebooted by a job. Add more groups with patch_never_patch_groups / patch_never_reboot_groups (they add to these,
#   never replace them).
# - Refuses to patch the machine the job runs from: a local connection, or an address, name or machine-id that is its.
# - Hosts on the VMware protected lists (vmware_protected_groups, vmware_protected_vms, vm_snapshot_cleanup_exclude_vms)
#   are skipped too; patch_protected_with_snapshot patches them, each right after its own snapshot.
# - Check mode (a dry run) lists what would be updated and changes nothing: run it that way first.
# - Each host is asked first which updates it has (dnf / yum check-update, read-only, the same filters as the update):
#   one with none is listed (UP TO DATE - nothing to patch) and left out - no snapshot, not patched (patch_update_check).
# - patch_snapshot: true = a VMware snapshot of each VM (named patching) right before it is patched; every host's
#   VM is found first, before any host is patched. Attach a "VMware vCenter" credential too. A run again within
#   patch_snapshot_reuse_hours (24) keeps the snapshot the first run took instead of a second one. docs/RUNBOOKS.md
# - The last lines: each host with its updates and its snapshot.
#
#   ansible-playbook playbooks/patch_hosts.yml --check -l web01.example.mil
#   ansible-playbook playbooks/patch_hosts.yml -l web01.example.mil -e patch_security_only=true
#   ansible-playbook playbooks/patch_hosts.yml -l web01.example.mil -e automatic_restarts=true
#   ansible-playbook playbooks/patch_hosts.yml -l rhel9_all -e patch_serial=10 -e patch_snapshot=true
- name: Leave out the hosts of site_exclude_hosts (1.67.0)
  ansible.builtin.import_playbook: site_exclude.yml

# 1.107.0: a dry-run template (site_dry_run_only, or a name ending in (dry run)) runs as Check only
- name: Workflow dry run - a dry-run template runs as Check only
  ansible.builtin.import_playbook: workflow_dry_run.yml

- name: Target check (stops with a clear message when target matches no host)
  hosts: "all{{ hostvars['localhost']['site_exclude_not'] | default('') }}"
  gather_facts: false
  tasks:
    - name: The target leaves at least one host to run on
      ansible.builtin.include_role:
        name: site_findings
        tasks_from: target_check.yml
      vars:
        _target_pattern: "{{ target | default('patch_hosts') }}"

- name: Patch hosts - which hosts answer (patch_skip_unreachable)
  # once, before any host is patched: a host that cannot be reached (switched off, a firewall, ssh refused) is listed
  # as NOT REACHED and left out of the run - not patched, no snapshot - and the report lists it (1.74.0: the job fails at
  # its end for it, patch_fail_on_could_not). The hosts never
  # patched here (patch_never_patch_groups, AAP) are not contacted. No host reached at all fails the job (the machine
  # credential?). patch_skip_unreachable: false = every host goes on, and one not reached fails and stops the rollout.
  hosts: "{{ target | default('patch_hosts') }}{{ hostvars['localhost']['site_exclude_not'] | default('') }}"
  gather_facts: false
  vars:
    # 1.70.5: each host's VM is looked up for the snapshot (patch_snapshot), and for the VM-name protection too - a host
    # whose inventory name is not its VM's name is still protected by vmware_protected_vms (patch_protected_vm_lookup)
    _patch_vm_lookup: >-
      {{ patch_snapshot | default(false) | bool
         or (patch_protected_vm_lookup | default(true) | bool
             and ((vmware_protected_vms | default([]) | name_list) + (vm_snapshot_cleanup_exclude_vms | default([]) | name_list)) | length > 0) }}
  tasks:
    # before any host is contacted or patched: the VM-name protection needs vCenter to know each host's VM
    - name: The VMware protected lists need the vCenter credential (patch_protected_vm_lookup)
      ansible.builtin.assert:
        that: lookup('ansible.builtin.env', 'VMWARE_HOST') | length > 0
        fail_msg: >-
          Nothing was patched. {{ 'patch_snapshot is true' if patch_snapshot | default(false) | bool else
          'vmware_protected_vms / vm_snapshot_cleanup_exclude_vms are set' }}: each host's VM must be found in vCenter
          first{{ '' if patch_snapshot | default(false) | bool else ', so a host whose inventory name is not its VM name is still protected' }}:
          attach a credential of type "VMware vCenter" to this job template (Templates > the template > Edit > Credentials).
          {{ '' if patch_snapshot | default(false) | bool else 'Or set patch_protected_vm_lookup: false: then only the inventory names (the host, its short name, vmware_vm_name) are compared with those lists.' }}
        quiet: true
      run_once: true
      when: _patch_vm_lookup | bool

    - name: Linux hosts only
      ansible.builtin.include_role:
        name: site_findings
        tasks_from: os_guard.yml

    # 1.74.1: a host to patch by hand is checked like the others (reached, ready, its updates, a reboot pending - all
    # read-only), whatever patch_skip_* say, then left out before any snapshot or update. Matched as site_exclude_hosts.
    - name: Patch by hand - never patched or rebooted by this job, only checked (patch_by_hand_hosts, patch_by_hand_groups)
      ansible.builtin.set_fact:
        patch_by_hand: true
      when:
        - ([inventory_hostname] | site_exclude_match(patch_by_hand_hosts | default([], true), groups, patch_by_hand_groups | default([], true))) | length > 0
        - group_names | intersect((patch_never_patch_groups | default(['no_patch', 'aap', 'aap_hosts', 'sat', 'netapp', 'netapp_console_hosts'])) + ['no_patch', 'aap', 'aap_hosts']) | length == 0

    - name: Patch by hand - the hosts
      ansible.builtin.debug:
        msg: >-
          {{ _hand | length }} host(s) to patch by hand (patch_by_hand_hosts, patch_by_hand_groups): {{ _hand | join(', ') }}.
          This job only checks them: never patched, never rebooted, no snapshot. The report lists them.
      vars:
        _hand: "{{ ansible_play_hosts | map('extract', hostvars) | selectattr('patch_by_hand', 'defined') | map(attribute='inventory_hostname') | list }}"
      run_once: true
      when: _hand | length > 0

    - name: No reboot by this job (patch_reboot_allowed is false)
      ansible.builtin.debug:
        msg: >-
          patch_reboot_allowed is false: this job reboots no host, whatever automatic_restarts, patch_reboot or the survey
          say. A host that needs a reboot is listed in the report: reboot it by hand.
      run_once: true
      when: not patch_reboot_allowed | default(true) | bool

    - name: Not contacted yet
      ansible.builtin.set_fact:
        site_host_unreached: ""

    - name: A host that cannot be reached is listed and left out - the others go on
      ansible.builtin.include_role:
        name: site_findings
        tasks_from: reach.yml
      vars:
        site_reach_report_all: true            # none reached: the report lists them all, the job fails at its end
        site_reach_never_fail: "{{ patch_by_hand is defined }}"   # 1.74.3: by hand - in the report, never failed
      when:
        - patch_skip_unreachable | default(true) | bool or patch_by_hand is defined
        - group_names | intersect((patch_never_patch_groups | default(['no_patch', 'aap', 'aap_hosts', 'sat', 'netapp', 'netapp_console_hosts'])) + ['no_patch', 'aap', 'aap_hosts']) | length == 0

    # a host with neither dnf nor yum (not a RHEL-like Linux) is not one this job patches: listed as NO DNF OR YUM and
    # left out, the others go on (patch_skip_unsupported; false = it fails at the update). RHEL 7 and its clones
    # are patched with yum. A host the facts cannot be read from goes on and fails where it always did.
    # 1.74.3: a host to patch by hand never fails here - a refused sudo (ansible_become: true in the inventory) fails
    # before the module runs, which failed_when does not see; the next step lists it (not checked - sudo refused)
    - name: Its package manager (patch_skip_unsupported)
      ansible.builtin.setup:
        gather_subset: ['!all', '!min', 'pkg_mgr', 'distribution']
      ignore_unreachable: true
      ignore_errors: "{{ patch_by_hand is defined }}"
      failed_when: false
      check_mode: false
      register: _patch_pkg
      when:
        - patch_skip_unsupported | default(true) | bool or patch_by_hand is defined
        - site_host_unreached | length == 0
        - group_names | intersect((patch_never_patch_groups | default(['no_patch', 'aap', 'aap_hosts', 'sat', 'netapp', 'netapp_console_hosts'])) + ['no_patch', 'aap', 'aap_hosts']) | length == 0

    # ansible-core 2.16 says yum on RHEL 7; later ones say unknown there (as roles/patch decides)
    - name: A host with neither dnf nor yum is listed and left out - the others go on
      ansible.builtin.set_fact:
        patch_unsupported: >-
          {{ _f.ansible_distribution | default('?') }} {{ _f.ansible_distribution_version | default('') }}, {{ _f.ansible_pkg_mgr }}
      vars:
        _f: "{{ _patch_pkg.ansible_facts | default({}) }}"
      when:
        - _f.ansible_pkg_mgr | default('dnf') not in ['dnf', 'dnf5', 'yum']
        - not (_f.ansible_os_family | default('') == 'RedHat' and _f.ansible_distribution_major_version | default('0') | int < 8)

    - name: Neither dnf nor yum - the job goes on without it
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}: NO DNF OR YUM - {{ patch_unsupported }}. This job patches RHEL and its clones (dnf,
          or yum on 7); left out of this run, the others go on - the report lists it. Patch it another way, or put it in no_patch.
      when: patch_unsupported is defined

    - name: Leave it out
      ansible.builtin.meta: end_host
      when: patch_unsupported is defined

    # a host that answers but where the job cannot become root (sudo refused, its password wrong or missing), or with too
    # little room in /var: listed as NOT READY and left out, the others go on - nothing was changed on it.
    # Nothing is cleaned up; free the space or fix the account, then run again for it. patch_skip_not_ready: false =
    # it fails in the patch play, as before 0.89.0. A refused become fails the task before the command runs (failed_when
    # does not see it): ignore_errors keeps the host for the "Not ready" step, which lists it.
    - name: Root on it, and room in /var (patch_skip_not_ready)
      ansible.builtin.command: df -P -m /var
      become: true
      ignore_unreachable: true
      ignore_errors: true
      failed_when: false
      changed_when: false
      check_mode: false
      register: _patch_ready
      when:
        - patch_skip_not_ready | default(true) | bool or patch_by_hand is defined
        - site_host_unreached | length == 0
        - group_names | intersect((patch_never_patch_groups | default(['no_patch', 'aap', 'aap_hosts', 'sat', 'netapp', 'netapp_console_hosts'])) + ['no_patch', 'aap', 'aap_hosts']) | length == 0

    # the reason without the login banner: the last line of the output that is not ssh's, else Ansible's own message
    - name: Not ready - root refused, or /var too full
      ansible.builtin.set_fact:
        patch_not_ready: >-
          {%- if _patch_ready.unreachable | default(false) or _patch_ready.failed | default(false) or _patch_ready.rc | default(0) != 0 -%}
          {%-   set lines = ((_patch_ready.module_stderr | default('')) ~ '\n' ~ (_patch_ready.stderr | default(''))
                            ~ '\n' ~ (_patch_ready.module_stdout | default(''))).splitlines()
                            | map('regex_replace', '^\\[[^\\]]*key=[^\\]]*\\][^:]*:', '') | map('trim')
                            | reject('equalto', '') | reject('match', '(?i)^shared connection to ') | list -%}
          {#-   a refused become: the last line sudo printed, else Ansible's first line (a password prompt's echo taken off) -#}
          {%-   set mparts = (_patch_ready.msg | default('') | string).split('>>> Standard Error') -%}
          {%-   set mlines = (mparts[1:] | join('\n')).splitlines() | map('regex_replace', '^\\[[^\\]]*key=[^\\]]*\\][^:]*:', '')
                             | map('trim') | reject('equalto', '') | reject('match', '^>>>') | list -%}
          {%-   set mfirst = mparts[0].splitlines() | map('regex_replace', '^Task failed:\\s*', '') | map('trim')
                             | reject('equalto', '') | first | default('') -%}
          {%-   set m = lines[-1] if lines else (mlines[-1] if mlines else mfirst) -%}
          cannot become root: {{ (m or 'unknown') | regex_replace('[.]$', '') | truncate(200) }}
          {%- else -%}
          {%-   set free = _patch_ready.stdout_lines[-1].split()[3] | int -%}
          {%-   if free < patch_min_free_mb | default(1024) | int -%}only {{ free }} MB free in /var (need {{ patch_min_free_mb | default(1024) }} MB){%- endif -%}
          {%- endif -%}
      when:
        - _patch_ready is not skipped
        - _patch_ready.unreachable | default(false) or _patch_ready.failed | default(false) or _patch_ready.rc | default(0) != 0
          or (_patch_ready.stdout_lines[-1].split()[3] | int) < patch_min_free_mb | default(1024) | int
        # with patch_skip_unreachable: false a host not reached goes on, and fails the job in the patch play
        - not _patch_ready.unreachable | default(false) or patch_skip_unreachable | default(true) | bool or patch_by_hand is defined

    - name: Not ready - the job goes on without it
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}: NOT READY - {{ patch_not_ready }}. Nothing was changed on it; left out of this run,
          the others go on - the report lists it. Fix that, then run again for it.
      when: patch_not_ready is defined

    - name: Leave it out (not ready)
      ansible.builtin.meta: end_host
      when: patch_not_ready is defined

    # the updates it has, before any snapshot: dnf check-update (yum on RHEL 7) with the same filters as the update
    # (patch_security_only, patch_exclude, patch_packages) - read-only, in Check mode too. 100 = updates, 0 = none: UP TO
    # DATE, left out (no snapshot, not patched), the job green. Another answer (a repository not reached) does not tell:
    # the host goes on as before 1.1.0, and the update itself says what is wrong.
    - name: The updates it has (patch_update_check)
      ansible.builtin.command:
        argv: >-
          {{ [('yum' if _patch_pkg.ansible_facts.ansible_pkg_mgr | default('dnf') not in ['dnf', 'dnf5'] else 'dnf'), '-q', 'check-update']
             + (['--security'] if patch_security_only | default(false) | bool else [])
             + (patch_exclude | default([]) | patch_name_list([]) | map('regex_replace', '^', '--exclude=') | list)
             + ([] if patch_packages | default(['*']) | patch_name_list(['*']) == ['*'] else patch_packages | default(['*']) | patch_name_list(['*'])) }}
      become: true
      ignore_unreachable: true
      failed_when: false
      changed_when: false
      check_mode: false
      register: _patch_check
      when:
        - patch_update_check | default(true) | bool or patch_by_hand is defined
        - site_host_unreached | length == 0
        - group_names | intersect((patch_never_patch_groups | default(['no_patch', 'aap', 'aap_hosts', 'sat', 'netapp', 'netapp_console_hosts'])) + ['no_patch', 'aap', 'aap_hosts']) | length == 0

    - name: How many
      ansible.builtin.set_fact:
        # the package lines only ("name.arch  version  repository"), each name once; not the "Obsoleting Packages" part
        patch_updates: >-
          {{ (_patch_check.stdout | default('')).split('Obsoleting Packages')[0].splitlines() | map('trim')
             | select('match', '^\S+\.\S+\s+\S+\s+\S+$') | map('split') | map('first') | unique | list | length
             if _patch_check.rc | default(-1) == 100 else 0 }}
      when: _patch_check.rc | default(-1) in [0, 100]

    - name: The update check did not answer - the host goes on, the update says why
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}: the update check did not answer (rc {{ _patch_check.rc | default('?') }}:
          {{ ((_patch_check.stderr | default('')).splitlines() | last | default(_patch_check.msg | default('')) | string) | truncate(200) }}) -
          it goes on as if it had updates.
      when: _patch_check is not skipped and _patch_check.rc | default(-1) not in [0, 100]

    # 1.70.5: up to date, but the last run installed updates and left the reboot (automatic_restarts was false) - the run
    # again with automatic_restarts: true must reboot it, not leave it out. needs-restarting -r: 1 = a reboot is needed.
    - name: Up to date - is a reboot still pending (needs-restarting -r)
      ansible.builtin.command: needs-restarting -r
      become: true
      ignore_unreachable: true
      failed_when: false
      changed_when: false
      check_mode: false
      register: _patch_pending
      when: >-
        _patch_check.rc | default(-1) == 0
        or (patch_by_hand is defined and _patch_check is not skipped and not _patch_check.unreachable | default(false))

    - name: Up to date, a reboot pending - it goes on to be rebooted (automatic_restarts)
      ansible.builtin.set_fact:
        patch_reboot_only: true
      when:
        - _patch_check.rc | default(-1) == 0
        - _patch_pending.rc | default(-1) == 1
        - automatic_restarts | default(false) | bool
        - patch_reboot | default('when_needed') != 'never'
        - patch_reboot_allowed | default(true) | bool
        - patch_by_hand is not defined
        - group_names | intersect((patch_never_reboot_groups | default(['aap', 'aap_hosts', 'sat', 'netapp', 'netapp_console_hosts'])) + ['aap', 'aap_hosts']) | length == 0

    - name: Up to date, a reboot pending - the job goes on with it, to reboot it
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}: UP TO DATE, but a REBOOT IS PENDING (needs-restarting -r) - it goes on: no update,
          rebooted (automatic_restarts), its services checked.
      when: patch_reboot_only is defined

    - name: Up to date - nothing to patch
      ansible.builtin.set_fact:
        patch_up_to_date: true
        patch_reboot_pending: "{{ _patch_pending.rc | default(-1) == 1 }}"
      when: _patch_check.rc | default(-1) == 0 and patch_reboot_only is not defined and patch_by_hand is not defined

    - name: Up to date - the job goes on without it
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}: UP TO DATE - nothing to patch{{ ' (security updates only)' if patch_security_only | default(false) | bool else '' }}.
          No snapshot, not patched; the job is not failed for it.{{ (' A REBOOT IS STILL PENDING (needs-restarting -r):'
          ~ (' reboot it by hand (patch_reboot_allowed is false).' if not patch_reboot_allowed | default(true) | bool
             else ' reboot it by hand, or run again with automatic_restarts: true.')) if patch_reboot_pending | bool else '' }}
      when: patch_up_to_date is defined

    - name: Leave it out (up to date)
      ansible.builtin.meta: end_host
      when: patch_up_to_date is defined

    - name: Patch by hand - what it has
      ansible.builtin.set_fact:
        patch_reboot_pending: "{{ _patch_pending.rc == 1 }}"
      when: patch_by_hand is defined and _patch_pending.rc | default(-1) in [0, 1]

    - name: Patch by hand - checked, not patched
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}: PATCH BY HAND - {{ (patch_updates ~ ' update(s) pending') if patch_updates is defined
          else 'its updates not known (the check did not answer)' }}{{ ', a REBOOT IS PENDING' if patch_reboot_pending | default(false) | bool
          else '' }}. Never patched or rebooted by this job, no snapshot: patch this one by hand.
      when: patch_by_hand is defined

    - name: Leave it out (patch by hand)
      ansible.builtin.meta: end_host
      when: patch_by_hand is defined

    - name: The hosts that go on
      ansible.builtin.group_by:
        key: patch_reached
      changed_when: false

- name: Patch hosts - each host's VM, for the snapshot before patching and the VM-name protection
  # once, before any host is patched: a host whose VM is not found stops the job here (on the AAP side: run_once,
  # delegated to localhost; a Limit of hosts needs no localhost). patch_snapshot, or the VMware protected lists by VM
  # name with patch_protected_vm_lookup (1.70.5)
  hosts: "{{ target | default('patch_hosts') }}:&patch_reached{{ hostvars['localhost']['site_exclude_not'] | default('') }}"
  gather_facts: false
  vars:
    _patch_vm_lookup: >-
      {{ patch_snapshot | default(false) | bool
         or (patch_protected_vm_lookup | default(true) | bool
             and ((vmware_protected_vms | default([]) | name_list) + (vm_snapshot_cleanup_exclude_vms | default([]) | name_list)) | length > 0) }}
  tasks:
    - name: Linux hosts only
      ansible.builtin.include_role:
        name: site_findings
        tasks_from: os_guard.yml
      when: _patch_vm_lookup | bool

    - name: Each host's VM in vCenter, and the old snapshots in the way
      ansible.builtin.include_role:
        name: patch
        tasks_from: snapshot_vms.yml
        apply:
          delegate_to: localhost
          run_once: true
          become: false
      vars:
        ansible_connection: local
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
      when: _patch_vm_lookup | bool

    # 1.74.0, patch_continue_on_failure: a host whose VM is not found or not sure, or whose old snapshot is in the way,
    # is COULD NOT PATCH (patch_could_not, set by snapshot_vms.yml) and left out - the others go on
    - name: Its VM is not sure - COULD NOT PATCH, left out
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: COULD NOT PATCH - {{ patch_could_not.reason }}: {{ patch_could_not.detail }}"
      when: patch_could_not is defined

    - name: Leave it out (its VM)
      ansible.builtin.meta: end_host
      when: patch_could_not is defined

- name: Patch hosts
  hosts: "{{ target | default('patch_hosts') }}:&patch_reached{{ hostvars['localhost']['site_exclude_not'] | default('') }}"
  become: true
  gather_facts: false
  serial: "{{ patch_serial | default(1) }}"
  # 1.74.0: roles/patch catches a host that fails or is lost (rescue, ignore_unreachable) and marks it COULD NOT PATCH,
  # so no host fails here and the report always goes out: a failed play - every host of a batch failed or lost - would
  # end the whole job, the report's play too. No any_errors_fatal / max_fail_percentage: any_errors_fatal ends the play
  # even at a host lost that is caught (ansible-core 2.16 and 2.22), and 2.16 does not let a variable set them.
  # patch_continue_on_failure: false - the rollout stops at such a host: each later batch first checks that no host of an
  # earlier one could not be patched or was lost (1.70.5), and is then NOT STARTED; the job fails at its end. A host left
  # out before this play (NOT REACHED, NOT READY - an earlier play) is out from its start: noted once, never a reason to stop.
  pre_tasks:
    - name: The hosts already out when the rollout starts (left out by an earlier play)
      ansible.builtin.set_fact:
        _patch_out_at_start: "{{ ansible_play_hosts_all | difference(ansible_play_hosts) }}"
      delegate_to: localhost
      delegate_facts: true
      run_once: true
      when: hostvars['localhost']._patch_out_at_start is not defined

    # 1.71.1: a host roles/patch ends on purpose (a never-patch group, a protected VM) sets _patch_ended_on_purpose
    # first and is never counted (a Windows host never gets here: the first play leaves it out). With patch_serial
    # over 1, a host that failed or was lost takes the rest of its batch with it (any_errors_fatal); ansible-core does
    # not say which one it was, so the message says both.
    - name: Stop the rollout - a host of an earlier batch failed or was lost (patch_continue_on_failure false)
      ansible.builtin.set_fact:
        patch_not_started: >-
          {{ ('Not patched: ' ~ _patch_lost[0] ~ ' failed or was lost in an earlier batch, so the rollout stops here'
              ~ ' (patch_serial). Look at that host first, then run again for the rest.')
             if _patch_lost | length == 1 else
             ('Not patched: in an earlier batch ' ~ (_patch_lost | sort | join(', ')) ~ ' stopped - one or more of them'
              ~ ' failed or was lost, and the rest of that batch was stopped with it - so the rollout stops here'
              ~ ' (patch_serial). Look at those hosts first, then run again for the rest.') }}
      vars:
        _patch_on_purpose: >-
          {{ ansible_play_hosts_all | map('extract', hostvars) | selectattr('_patch_ended_on_purpose', 'defined')
             | map(attribute='inventory_hostname') | list }}
        # a host roles/patch could not patch (it fails no host: rescue) or that got no further than a batch's start
        _patch_could_nots: >-
          {{ ansible_play_hosts_all | map('extract', hostvars) | selectattr('_patch_could_not', 'defined')
             | map(attribute='inventory_hostname') | list }}
        _patch_lost: >-
          {{ (ansible_play_hosts_all | difference(ansible_play_hosts)
              | difference(hostvars['localhost']._patch_out_at_start | default([])) | difference(_patch_on_purpose))
             | union(_patch_could_nots) }}
      when: not patch_continue_on_failure | default(true) | bool and _patch_lost | length > 0

    - name: Stop the rollout - not started
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: NOT STARTED - {{ patch_not_started }}"
      when: patch_not_started is defined

    - name: Not started (the rollout stopped)
      ansible.builtin.meta: end_host
      when: patch_not_started is defined

    - name: Its VM is not sure - left out (COULD NOT PATCH, the VM step said why)
      ansible.builtin.meta: end_host
      when: patch_could_not is defined

    - name: The rollout reached it
      ansible.builtin.set_fact:
        patch_started: true

    - name: Linux hosts only (this playbook never touches a Windows server)
      ansible.builtin.include_role:
        name: site_findings
        tasks_from: os_guard.yml

    - name: Notice about settings files that override AAP's Variables box
      ansible.builtin.include_role:
        name: site_findings
        tasks_from: settings_notice.yml
  roles:
    - role: patch

- name: Patch hosts - the report, and the job's end
  hosts: "{{ target | default('patch_hosts') }}{{ hostvars['localhost']['site_exclude_not'] | default('') }}"
  gather_facts: false
  tasks:
    # each host: its updates (from the check before the snapshots) and its snapshot (taken, reused, none)
    - name: Patch hosts | each host - its updates and its snapshot
      ansible.builtin.debug:
        msg: "{{ _rows }}"
      vars:
        _rows: >-
          {%- set out = [] -%}
          {%- set w = [ansible_play_hosts_all | map('length') | max | default(4), 4] | max -%}
          {%- set _ = out.append('%-*s  %-22s  %s' | format(w, 'Host', 'Updates', 'Snapshot')) -%}
          {%- for h in ansible_play_hosts_all | sort -%}
          {%-   set v = hostvars[h] -%}
          {%-   set upd = ('up to date, REBOOT PENDING' if v.patch_reboot_pending | default(false) | bool else 'up to date') if v.patch_up_to_date is defined else
                          'up to date, reboot only' if v.patch_reboot_only is defined else
                          ((v.patch_updates ~ ' pending') if v.patch_updates | default(0) | int > 0 else
                           'not checked' if v.patch_updates is not defined else 'none pending') -%}
          {%-   if v.patch_by_hand is defined -%}{%- set upd = 'BY HAND, ' ~ (('not reached' if v.site_host_unreached | default('') else
                                                                     (v.patch_updates ~ ' pending') if v.patch_updates is defined else 'not checked')) -%}
          {%-   elif v.site_host_unreached | default('') -%}{%- set upd = 'NOT REACHED' -%}
          {%-   elif v.patch_not_ready is defined -%}{%- set upd = 'NOT READY' -%}
          {%-   elif v.patch_unsupported is defined -%}{%- set upd = 'NO DNF OR YUM' -%}{%- endif -%}
          {%-   set snap = 'not needed - up to date' if v.patch_up_to_date is defined else
                           v._patch_snapshot | default('none (patch_snapshot is false)' if not patch_snapshot | default(false) | bool else 'none') -%}
          {%-   set _ = out.append('%-*s  %-22s  %s' | format(w, h, upd, snap)) -%}
          {%- endfor -%}
          {{ out }}
      run_once: true

    - name: Patch hosts | UP TO DATE - nothing to patch (no snapshot, not patched)
      ansible.builtin.debug:
        msg: "{{ _current | length }} host(s) up to date, nothing to patch: {{ _current | join(', ') }}"
      vars:
        _current: >-
          {{ ansible_play_hosts_all | map('extract', hostvars) | selectattr('patch_up_to_date', 'defined')
             | map(attribute='inventory_hostname') | list }}
      run_once: true
      when: _current | length > 0

    - name: Patch hosts | NOT REACHED - not patched (fix the network or firewall, then run again for these)
      ansible.builtin.debug:
        msg: >-
          {{ _unreached | length }} host(s) not reached, not patched:
          {% for h in _unreached %}{{ h }} ({{ hostvars[h].site_host_unreached }}){{ '; ' if not loop.last else '' }}{% endfor %}
      vars:
        _unreached: >-
          {{ ansible_play_hosts_all | map('extract', hostvars) | rejectattr('patch_by_hand', 'defined') | selectattr('site_host_unreached', 'defined')
             | rejectattr('site_host_unreached', 'equalto', '')
             | map(attribute='inventory_hostname') | list }}
      run_once: true
      when: _unreached | length > 0

    - name: Patch hosts | NOT READY - not patched (root refused or /var too full - fix that, then run again for these)
      ansible.builtin.debug:
        msg: >-
          {{ _not_ready | length }} host(s) not ready, not patched:
          {% for h in _not_ready %}{{ h }} ({{ hostvars[h].patch_not_ready }}){{ '; ' if not loop.last else '' }}{% endfor %}
      vars:
        _not_ready: >-
          {{ ansible_play_hosts_all | map('extract', hostvars) | rejectattr('patch_by_hand', 'defined') | selectattr('patch_not_ready', 'defined')
             | map(attribute='inventory_hostname') | list }}
      run_once: true
      when: _not_ready | length > 0

    - name: Patch hosts | NO DNF OR YUM - not patched (not a RHEL-like Linux - patch them another way, or put them in no_patch)
      ansible.builtin.debug:
        msg: >-
          {{ _unsupported | length }} host(s) with neither dnf nor yum, not patched:
          {% for h in _unsupported %}{{ h }} ({{ hostvars[h].patch_unsupported }}){{ '; ' if not loop.last else '' }}{% endfor %}
      vars:
        _unsupported: >-
          {{ ansible_play_hosts_all | map('extract', hostvars) | rejectattr('patch_by_hand', 'defined') | selectattr('patch_unsupported', 'defined')
             | map(attribute='inventory_hostname') | list }}
      run_once: true
      when: _unsupported | length > 0

    - name: Patch hosts | PATCH BY HAND - never patched or rebooted by this job (patch_by_hand_hosts, patch_by_hand_groups)
      ansible.builtin.debug:
        msg: >-
          {{ _hand | length }} host(s) to patch by hand:
          {% for h in _hand %}{{ h }} ({{ 'not reached - check by hand' if hostvars[h].site_host_unreached | default('')
          else 'not checked - sudo refused' if hostvars[h].patch_not_ready | default('') is match('cannot become root')
          else (hostvars[h].patch_updates ~ ' update(s) pending') if hostvars[h].patch_updates is defined else 'updates not known' }}{{
          ', reboot pending' if hostvars[h].patch_reboot_pending | default(false) | bool else '' }}){{ '; ' if not loop.last else '' }}{% endfor %}
      vars:
        _hand: >-
          {{ ansible_play_hosts_all | map('extract', hostvars) | selectattr('patch_by_hand', 'defined')
             | map(attribute='inventory_hostname') | list }}
      run_once: true
      when: _hand | length > 0

    # 1.74.0: every host, as the other reports: the email, the website, the workbook. Once, from the AAP side, never
    # touching a host. A dry run sends it too, under its own name, so the approver sees the hosts that could not be patched.
    - name: Patch hosts | the report
      ansible.builtin.set_fact:
        _patch_report: >-
          {{ hostvars | patch_host_facts(ansible_play_hosts_all) | patch_report({
               'dry': ansible_check_mode, 'serial': patch_serial | default(1),
               'continue_on_failure': patch_continue_on_failure | default(true) | bool,
               'fail_on_could_not': patch_fail_on_could_not | default(true) | bool,
               'snapshot': patch_snapshot | default(false) | bool, 'security_only': patch_security_only | default(false) | bool,
               'automatic_restarts': automatic_restarts | default(false) | bool,
               'reboot_allowed': patch_reboot_allowed | default(true) | bool,
               'stopped': ansible_play_hosts_all | map('extract', hostvars) | map(attribute='patch_not_started', default='')
                          | select | first | default('')}) }}
      delegate_to: localhost
      delegate_facts: true
      run_once: true

    - name: "Patch hosts | {{ hostvars['localhost']._patch_report.title }}"
      ansible.builtin.debug:
        msg: "{{ (hostvars['localhost']._patch_report | report_text).splitlines() }}"
      run_once: true

    - name: Patch hosts | email the report, publish it (report_email_to, report_web_dest) - a dry run too
      ansible.builtin.include_role:
        name: site_email
        apply:
          delegate_to: localhost
          run_once: true
          become: false
          check_mode: false
      vars:
        ansible_connection: local
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
        _report: "{{ hostvars['localhost']._patch_report }}"
        _report_xlsx: "{{ hostvars['localhost']._patch_report | report_xlsx_sheets }}"
        _report_check_live: true
        # a dry run: its own line on the index and workbook name, and its own folder (dry-run/, whatever report_web_page
        # and report_web_latest say) - never the real run's latest page, JSON, index line or history
        _report_name: >-
          {{ ((awx_job_template_name | default(tower_job_template_name | default('Patch hosts'))) ~ ' - dry run')
             if ansible_check_mode else '' }}
        _report_web_folder: "{{ 'dry-run' if ansible_check_mode else '' }}"
      when: >-
        report_email_to | default([]) | length > 0 or report_email_also | default([]) | length > 0
        or report_web_dest | default('') | length > 0

    - name: Patch hosts | no report sent (report_email_to and report_web_dest are not set)
      ansible.builtin.debug:
        msg: "No report sent: set report_email_to (the template's Variables) or report_web_dest (docs/EMAIL_REPORTS.md)."
      run_once: true
      when: >-
        report_email_to | default([]) | length == 0 and report_email_also | default([]) | length == 0
        and report_web_dest | default('') | length == 0

    # the job's end: failed when a host could not be patched or needs a look - after every other host and the report
    - name: Patch hosts | the job fails - hosts could not be patched or need a look (patch_fail_on_could_not)
      ansible.builtin.fail:
        msg: >-
          {{ _bad | length }} host(s) could not be patched or need a look:
          {{ _bad | join(', ') }}. The report says why and what to do; the other hosts were patched.
          {{ (' ' ~ _stopped) if _stopped else '' }}{{ (" No host could be reached: look first at the template's machine credential"
          ~ " (user, password or key, expired?) and at the network from AAP to the hosts.") if _none_reached else '' }}
          patch_fail_on_could_not: false keeps the job green.
      vars:
        _bad: "{{ hostvars['localhost']._patch_report.needs_look }}"
        _none_reached: >-
          {{ ansible_play_hosts_all | map('extract', hostvars) | map(attribute='site_host_unreached', default='') | select | list | length
             == ansible_play_hosts_all | length }}
        _stopped: >-
          {{ ansible_play_hosts_all | map('extract', hostvars) | map(attribute='patch_not_started', default='') | select | first | default('') }}
      delegate_to: localhost
      run_once: true
      # a dry run stays green: the workflow's approval follows it only on success, and its report is for the approver
      when: patch_fail_on_could_not | default(true) | bool and _bad | length > 0 and not ansible_check_mode
