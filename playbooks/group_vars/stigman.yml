# YOUR SETTINGS FOR THE STIG MANAGER HOSTS (AAP group stigman).
# Service watch and STIG Manager deploy run on this group by themselves (no target needed).
# Service watch finds the containers that should be running by itself (root's and each user's).
# This list is watched in any case, first and in this order (dependencies first), and a container
# in it that is missing is reported. A container name (sudo podman ps -a) or a service name
# without .service: how each one is run (systemd unit or plain podman) is found by itself. Add
# `unit: NAME.service` under one only if the job output shows the wrong unit, and `user: NAME`
# for a container of a user (rootless podman).
# These are the containers STIG Manager deploy (roles/stigman_stack) makes; Keycloak is your own, elsewhere. A STIG
# Manager you set up yourself: its container names instead (sudo podman ps -a), e.g. a Keycloak container of its own.
watch_containers:
  - name: stigman-mysql
  - name: stigman-api
  - name: stigman-nginx
check_certs_endpoints:                   # the certificate browsers see
  - {name: STIG Manager, host: 127.0.0.1, port: 443}
# check_certs_files: [/etc/CHANGE-ME/*.crt]   # also check the certificate files, if you like
