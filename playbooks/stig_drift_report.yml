---
# STIG DRIFT REPORT - on a schedule (weekly, or after patching). Each Linux host is scanned against the DISA STIG
# with OpenSCAP (the SCAP Security Guide's STIG profile for its RHEL version), the scan's report is kept on the
# host (check_stig_dir), and the result is compared with the host's checklist in STIG Manager - read-only, this
# job never writes to it - and with the host's earlier scans:
#   drifted     a rule STIG Manager has as Not a Finding (or Not Applicable) fails now,
#               and it passed in an earlier scan                                         -> a finding
#   new         a rule that passed in an earlier scan fails now                          -> a finding
#   disagree    a rule STIG Manager has as Not a Finding has failed in every scan        -> report only (check_stig_disagree_severity)
#   fixed       a rule STIG Manager still has Open passes now (update the checklist)     -> report only
#   left out    rules OpenSCAP gets wrong at your site (check_stig_ignore_rules)         -> report only
# Fails the hosts with drift (a workflow can open tickets). Linux only. docs/STIG_DRIFT.md.
#
#   ansible-playbook playbooks/stig_drift_report.yml -e target=rhel_servers
#   ansible-playbook playbooks/stig_drift_report.yml -e check_stig_stigman_api=https://stigman.example.mil/api
#   ansible-playbook playbooks/stig_drift_report.yml --check      # scans and compares, keeps nothing on the hosts
- name: STIG drift report
  hosts: "{{ target | default('all') }}"
  become: true
  gather_facts: false
  vars:
    site_report_title: STIG drift report
  pre_tasks:
    - name: Linux hosts only (VMware has its own STIG tooling)
      ansible.builtin.include_role:
        name: site_findings
        tasks_from: os_guard.yml

    - name: A host that cannot be reached is listed and left out - the job is not failed for it (site_unreachable_fails)
      ansible.builtin.include_role:
        name: site_findings
        tasks_from: reach.yml
  tasks:
    - name: Start
      ansible.builtin.include_role:
        name: site_findings
        tasks_from: start.yml

    - name: Scan, read STIG Manager, compare
      ansible.builtin.include_role:
        name: site_findings
        tasks_from: run_check.yml
      vars:
        _site_check: stig

    - name: Every host
      ansible.builtin.debug:
        msg: >-
          {%- set out = [] -%}
          {%- for h in ansible_play_hosts | sort if hostvars[h].check_stig_result is defined -%}
          {%-   for line in hostvars[h].check_stig_result | stig_lines -%}{%- set _ = out.append(line) -%}{%- endfor -%}
          {%- endfor -%}
          {{ out }}
      run_once: true

    - name: The tables for the report email
      ansible.builtin.set_fact:
        site_report_sections: >-
          {{ ansible_play_hosts | map('extract', hostvars) | selectattr('check_stig_result', 'defined')
             | map(attribute='check_stig_result') | list | stig_report_sections(check_stig_list_max | default(200) | int) }}
      run_once: true

  post_tasks:
    - name: Report (fails the hosts with drift or new fails)
      ansible.builtin.include_role:
        name: site_findings
        tasks_from: report.yml
