---
# STIG ANSWER KEYS (1.75.0; 1.76.0: many hosts, the automatic pick): an Evaluate-STIG <AnswerKey> block per rule, ready to
# copy into YOUR answer file under the rule's <Vuln ID>: ExpectedStatus (Evaluate-STIG's own result), a ValidationCode
# that only reads, the status and comment for true and false. Linux, Evaluate-STIG with pwsh, on the hosts of target (a
# group, many hosts) or the Limit, grouped by STIG (RHEL 8, 9, 10 and their releases): ONE block per rule per STIG. The
# rules: answer_keys_rules - or none, then the rules STIG Manager has Open or Not Reviewed for each host
# (answer_keys_pick, answer_keys_cat, answer_keys_max_rules). Each code is made from DISA's check text by a fixed pattern
# - or drafted by ACT (answer_keys_act), marked so - then checked read-only (PowerShell's parser) and tried once on one
# host per STIG (in a sandbox). Nothing is written anywhere: STIG Manager is read with GET only; Evaluate-STIG runs for
# those rules alone, with no answer files, none of check_stig_evaluate_args, its own output removed; nothing goes to the
# share. 1.77.0: the cross-check (answer_keys_cross_check) puts four sources side by side for each block - Evaluate-STIG,
# STIG Manager, the code in the trial, ACT on its own (DISA's commands read on the host, never the code).
# docs/STIG_ANSWER_KEYS.md.
#
#   ansible-playbook playbooks/stig_answer_keys.yml -e target=rhel_servers \
#     -e '{"answer_keys_rules": ["V-257777", "V-230221"], "answer_keys_values": {"min_release": ["8.10", "9.4"]}}'
#   ansible-playbook playbooks/stig_answer_keys.yml -e target=rhel_servers -e answer_keys_pick=open -e '{"answer_keys_cat": [1]}'
- name: Leave out the hosts of site_exclude_hosts (1.67.0)
  ansible.builtin.import_playbook: site_exclude.yml

# 1.76.0: target (a host or a group), else the Limit - one host or many; neither is a clear stop (1.75.1's message)
- name: Target or Limit
  hosts: "all,localhost{{ hostvars['localhost']['site_exclude_not'] | default('') }}"
  gather_facts: false
  tasks:
    - name: Target | one is set
      ansible.builtin.assert:
        that: ((target | default('', true) | string | trim) ~ (ansible_limit | default('') | string | trim)) | length > 0
        fail_msg: >-
          No target: set target to the Linux host or group to make answer keys for, or give the job a Limit
          (one host or many).
        quiet: true
      run_once: true
      delegate_to: localhost

- name: Target check (stops with a clear message when target matches no host)
  hosts: "all{{ hostvars['localhost']['site_exclude_not'] | default('') }}"
  gather_facts: false
  tasks:
    - name: The target leaves at least one host to run on
      ansible.builtin.include_role:
        name: site_findings
        tasks_from: target_check.yml
      vars:
        # 1.76.0: target, else the Limit (a group, many hosts)
        _target_pattern: "{{ target | default('', true) or ansible_limit | default('') }}"

- name: STIG answer keys
  # 1.76.0: many hosts (target - a group - or the Limit), in parallel; a host not reached or failing is listed, never
  # fails the job while one worked
  hosts: "{{ target | default('', true) or ansible_limit | default('no-target-given') }}{{ hostvars['localhost']['site_exclude_not'] | default('') }}"
  gather_facts: false
  become: true
  ignore_unreachable: true
  vars:
    site_report_title: STIG answer keys
  pre_tasks:
    - name: Linux hosts only (Evaluate-STIG with pwsh)
      ansible.builtin.include_role:
        name: site_findings
        tasks_from: os_guard.yml
  tasks:
    # each host: the rules (asked, or STIG Manager's Open and Not Reviewed), Evaluate-STIG's own result for them alone
    - name: The answer keys - each host - the rules, Evaluate-STIG for the picked rules only, STIG Manager read
      ansible.builtin.include_role:
        name: check_stig
        tasks_from: answer_keys.yml

    # on the AAP side, once: the hosts grouped by STIG, the check texts, the rules already in the answer files left out
    - name: The answer keys - the hosts grouped by STIG, on the AAP side
      ansible.builtin.include_role:
        name: check_stig
        tasks_from: answer_keys_group.yml
        apply:
          delegate_to: localhost
          run_once: true
          become: false
      vars:
        ansible_connection: local
        ansible_python_interpreter: "{{ ansible_playbook_python }}"

    # on the AAP side, once (run_once, delegated to localhost - a Limit of the hosts needs no localhost): ACT reads
    # DISA's text and answers, in evidence mode - it runs no command, here or on any host; once per rule
    - name: The answer keys - ACT drafts the rules no fixed pattern fits (answer_keys_act), on the AAP side
      ansible.builtin.include_role:
        name: check_stig
        tasks_from: answer_keys_act.yml
        apply:
          delegate_to: localhost
          run_once: true
          become: false
      vars:
        ansible_connection: local
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
      when: _ak_for_act | default([]) | length > 0

    - name: The answer keys - the read-only check and one trial of each draft, on one host per STIG
      ansible.builtin.include_role:
        name: check_stig
        tasks_from: answer_keys_check.yml

    # 1.77.0 (answer_keys_cross_check): the cross-check - the read-only evidence on the trial host and where a person
    # reviewed the rule after the scan (DISA's commands, else the code's; the fixed grammar, never a shell), then ACT on
    # its own on the AAP side (never the code); it never changes a block
    - name: The answer keys - the cross-check's read-only evidence (answer_keys_cross_check)
      ansible.builtin.include_role:
        name: check_stig
        tasks_from: answer_keys_cross.yml
      when: answer_keys_cross_check | default(true) | bool

    - name: The answer keys - the cross-check - ACT on its own, the sources side by side, on the AAP side
      ansible.builtin.include_role:
        name: check_stig
        tasks_from: answer_keys_cross_act.yml
        apply:
          delegate_to: localhost
          run_once: true
          become: false
      vars:
        ansible_connection: local
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
      when: answer_keys_cross_check | default(true) | bool

    - name: The answer keys - the report, grouped by STIG, on the AAP side
      ansible.builtin.include_role:
        name: check_stig
        tasks_from: answer_keys_report.yml
        apply:
          delegate_to: localhost
          run_once: true
          become: false
      vars:
        ansible_connection: local
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
