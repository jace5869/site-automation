---
# fapolicyd rules: what fapolicyd blocked on each host - or, permissive, would block - and the change that lets each
# through (a trust entry pinned to the file's size and hash for a host file, an allow rule for a container's file); the
# rules files' clean-up (a repeated rule, a wildcard that matches nothing, a rule for an RPM-owned file, a rule that
# opens too much, a file that sorts after the stock deny rules); permissive mode on or off. ONE report of every host:
# emailed (report_email_to) and on the report website.
#   target                     the hosts (default: all) - or a Limit of hosts
#   fapolicyd_rules_since      ausearch -ts: recent (10 min), today (the default), yesterday, this-week, boot
#   fapolicyd_rules_approved   the approved lines, as the report gives them ([] = read only, the default)
# After the change, the rules are loaded, the trust reloaded or fapolicyd restarted, and checked in the same go on the
# host: running before and not after - or a program no longer starts - every file put back. A clean-up that blocks
# more is made only while fapolicyd is permissive. Run it in Check first. Each change is to a security control: route it
# through your security approval (the ISSO). docs/RUNBOOKS.md, "fapolicyd rules".
# THE WORKFLOW (docs/WORKFLOWS_AND_SCHEDULES.md, 36), two templates of this playbook:
#   [fapolicyd rules - check] --Run on fail--> [Approval] --Run on success--> [fapolicyd rules - approved]
# The check (fapolicyd_rules_workflow: true) hands each host's changes on (set_stats fapolicyd_rules_workflow_plan) and
# fails on purpose - NEEDS APPROVAL; nothing to approve, it stays green. The approved job makes each host's.
- name: Fapolicyd rules - the blocks, the changes
  hosts: "{{ target | default('all') }}"
  gather_facts: false
  become: true
  pre_tasks:
    - name: A host that cannot be reached is listed and left out - the job is not failed for it (site_unreachable_fails)
      ansible.builtin.include_role:
        name: site_findings
        tasks_from: reach.yml
  roles:
    - fapolicyd_rules

# on the hosts, once on the AAP side (run_once, delegated to localhost): a Limit of hosts needs no localhost
- name: Fapolicyd rules - the report
  hosts: "{{ target | default('all') }}"
  gather_facts: false
  tasks:
    - name: Fapolicyd rules | email the report, publish it (report_email_to, report_web_dest)
      ansible.builtin.include_role:
        name: site_email
        apply:
          delegate_to: localhost
          run_once: true
          become: false
      vars:
        ansible_connection: local
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
        _report: >-
          {{ ansible_play_hosts_all | map('extract', hostvars) | list
             | fapolicyd_rules_job_report(ansible_play_hosts_all, fapolicyd_rules_since | default('today'),
                                      site_report_title | default(''), ansible_check_mode) }}
      when: report_email_to | default([]) | length > 0 or report_email_also | default([]) | length > 0 or report_web_dest | default('') | length > 0

- name: Fapolicyd rules - after the report
  hosts: "{{ target | default('all') }}"
  gather_facts: false
  tasks:
    - name: Fapolicyd rules | no email
      ansible.builtin.debug:
        msg: "No email: report_email_to is not set (docs/EMAIL_REPORTS.md)."
      run_once: true
      when: report_email_to | default([]) | length == 0 and report_email_also | default([]) | length == 0

    - name: Fapolicyd rules | not changed on this host (after the report)
      ansible.builtin.fail:
        msg: >-
          {{ _fr_apply.state }}: {{ _fr_apply.error }}{{ (' - ' ~ (_fr_why | map(attribute='line') | zip(_fr_why | map(attribute='why'))
          | map('join', ': ') | join('; '))) if _fr_why else '' }}
      vars:
        _fr_why: "{{ (_fr_apply.bad | default([])) + (_fr_apply.refused | default([])) }}"
      when: _fr_apply is defined and _fr_apply.state in ['failed', 'refused', 'rolled back']

    - name: Fapolicyd rules | the host could not be read
      ansible.builtin.fail:
        msg: "{{ _fr.error }}"
      when: _fr is defined and (_fr.state == 'not read' or _fr.error | default('') | length > 0)

    # the workflow's check: each host's changes to the approval step and the approved job, then NEEDS APPROVAL
    - name: Fapolicyd rules | the workflow - each host's changes for the approval
      ansible.builtin.set_fact:
        _fr_workflow: "{{ ansible_play_hosts_all | map('extract', hostvars) | list | fapolicyd_rules_job_workflow(ansible_play_hosts_all) }}"
      run_once: true
      when: fapolicyd_rules_workflow | default(false) | bool

    - name: Fapolicyd rules | the workflow - held back for a person
      ansible.builtin.debug:
        msg: "{{ _fr_workflow.held | map('join', ': ') | list }}"
      run_once: true
      when: fapolicyd_rules_workflow | default(false) | bool and _fr_workflow.held | length > 0

    - name: Fapolicyd rules | the workflow - hand the plan to the approval step and the approved job (set_stats)
      ansible.builtin.set_stats:
        data:
          fapolicyd_rules_workflow_plan: "{{ _fr_workflow.plan }}"
        per_host: false
        aggregate: false
      run_once: true
      when: fapolicyd_rules_workflow | default(false) | bool and _fr_workflow.count | int > 0

    - name: Fapolicyd rules | NEEDS APPROVAL
      ansible.builtin.fail:
        msg: >-
          NEEDS APPROVAL - {{ _fr_workflow.count }} change(s) on {{ _fr_workflow.plan | length }} host(s), in the report
          ("Changes to approve"). Approve the workflow's step to make them; deny it to make none.
          {{ _fr_workflow.plan | dict2items | map(attribute='key') | zip(_fr_workflow.plan | dict2items | map(attribute='value') | map('join', ' | '))
             | map('join', ': ') | join(' || ') }}
      run_once: true
      when: fapolicyd_rules_workflow | default(false) | bool and _fr_workflow.count | int > 0
