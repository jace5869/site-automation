---
# HEALTH CHECK - read-only checks on Linux hosts.
#
# What it does, per host:
#   1. runs the checks you pick (a list of names, or the shortcuts daily / weekly / all)
#   2. prints what is wrong in plain words, with a command to look further
#   3. FAILS the host if something is wrong (so an AAP workflow can open a ticket, ask ACT ...)
# It changes nothing on the host (the only write is the small disk-history file), and every
# check also works in Check mode (a dry run).
#
#   ansible-playbook playbooks/health_check.yml                          # the daily set, every host
#   ansible-playbook playbooks/health_check.yml -e target=snowdb01.example.mil -e health_checks=mariadb
#   ansible-playbook playbooks/health_check.yml -e '{"health_checks": ["disk", "services"]}'
#
# The checks (roles/check_<name>):
#   disk         space + inodes of local filesystems, days-until-full forecast
#   mounts       fstab vs mounted, filesystems gone read-only, hung (stale) NFS mounts
#   services     failed systemd units, required services running and enabled, restart loops
#   performance  load, memory, swap, I/O wait, CPU steal, OOM kills, zombie processes
#   time         clock synchronized (chrony), offset
#   network      default route, DNS names resolve, TCP ports reachable (LDAP, SIEM, ...)
#   logging      journal kept on disk, remote log server reachable, rsyslog queue, error rate
#   selinux      enforcing, config matches, custom permissive domains, AVC denials, booleans
#   fapolicyd    running, enforcing, config/trust database OK, denials
#   auditd       running, rules loaded, events lost, audit log space, remote forwarding; how much is
#                audited (by account, rule and program; a scanner's account can be left out), how far
#                back the logs reach, records dropped on the way to the SIEM, rules that hide an account
#   accounts     extra UID 0, empty passwords, inactive accounts, NOPASSWD sudo, expiring passwords
#   certs        certificate files, keystores and TLS endpoints that expire soon
#   trust        trust stores that still hold a compromised or dropped CA (the system bundles, p11-kit, Java
#                cacerts, Python certifi, Node, podman containers, an application's own files) and software
#                with its own trust logic (Go programs, Node, NSS) below the fixed version. docs/TRUST_STORES.md
#   patching     pending (security) updates, reboot needed, days since the last update
#   sso          can domain users still log in: sssd (or winbind) running, each domain online, the host's keytab
#                still gets a ticket, the AD join valid (adcli testjoin), test users resolve, how often sssd went
#                offline. Hosts joined to no domain are skipped. docs/RUNBOOKS.md
#   mariadb      database health and performance (slow queries, lock waits, open transactions ...),
#                MariaDB AND MySQL, on the host or in podman containers - only on
#                hosts in mariadb_hosts / mysql_hosts / database_hosts (or the groups mariadb, mysql),
#                or that name a container. "mysql" and "database" are other names for the same
#                check. Only the database? Run playbooks/database_health.yml. docs/MARIADB.md
#   containers   podman containers, root's and every user's (rootless), found by themselves (podman ps -a,
#                Quadlet .container / .kube files, systemd units that run podman, pods, compose): down,
#                unhealthy, crashed, restart loops, OOM kills, users without linger. Hosts without
#                podman are skipped. docs/RUNBOOKS.md
#   stig         the STIG drift scan: OpenSCAP's STIG profile, compared with STIG Manager (read-only) and the
#                host's last scan. In no shortcut (a scan takes minutes): ask for it by name, or use its own
#                template, playbooks/stig_drift_report.yml. docs/STIG_DRIFT.md
#
# Shortcuts: daily = disk mounts services performance time network logging mariadb containers sso
#            weekly = selinux fapolicyd auditd accounts certs trust patching
#            all = both
#
# Add ACT (optional, later): -e use_act=true. ACT (GenAI) then looks at each host that has
# findings, gives the root cause, and proposes fixes for approval. See docs/ADDING_ACT.md.
- name: Health check
  hosts: "{{ target | default('all') }}"
  become: true
  gather_facts: false
  vars:
    health_checks: [daily]
    _health_alias: {mysql: mariadb, database: mariadb}
    _health_sets:
      daily: [disk, mounts, services, performance, time, network, logging, mariadb, containers, sso]
      weekly: [selinux, fapolicyd, auditd, accounts, certs, trust, patching]
      all: [disk, mounts, services, performance, time, network, logging, mariadb, containers, sso,
            selinux, fapolicyd, auditd, accounts, certs, trust, patching]
    _health_by_name: [stig]     # known, but in no shortcut: asked for by name only
    # A survey's multiple-choice answer can arrive as a list or as lines of text, a text answer or an extra
    # variable as "disk, services": accept all of them.
    _health_asked: >-
      {{ (health_checks | regex_replace('[,;]', ' ') | split if health_checks is string else health_checks)
         | map('trim') | select | list }}
    _health_run: >-
      {%- set out = [] -%}
      {%- for c in _health_asked -%}
      {%-   for x in _health_sets[c] | default([_health_alias[c] | default(c)]) if x not in out -%}{%- set _ = out.append(x) -%}{%- endfor -%}
      {%- endfor -%}
      {{ out }}
  pre_tasks:
    - name: Linux hosts only (Windows servers have their own templates, playbooks/win_*.yml)
      ansible.builtin.include_role:
        name: site_findings
        tasks_from: os_guard.yml

    - name: A host that cannot be reached is listed and left out - the job is not failed for it (site_unreachable_fails)
      ansible.builtin.include_role:
        name: site_findings
        tasks_from: reach.yml

    - name: Only known checks
      ansible.builtin.assert:
        that: _health_run | difference(_health_sets.all + _health_by_name) | length == 0
        fail_msg: >-
          Unknown check(s): {{ _health_run | difference(_health_sets.all + _health_by_name) | join(', ') }}.
          Known: {{ (_health_sets.all + _health_by_name) | join(', ') }} (or mysql / database for the mariadb check; daily, weekly, all).
        quiet: true
      run_once: true

    - name: Start
      ansible.builtin.include_role:
        name: site_findings
        tasks_from: start.yml

  tasks:
    - name: Run the checks
      ansible.builtin.include_role:
        name: site_findings
        tasks_from: run_check.yml
      loop: "{{ _health_run }}"
      loop_control:
        loop_var: _site_check

    # One outage, one finding. A container that is down is reported by the containers check
    # (containers:down / :unhealthy / :crashed / :restarting, with how to start it), so a second
    # ticket for the same outage is left out and named in that finding:
    #   - mariadb:down of a database container (the Database health job, database_health.yml,
    #     still reports it), and
    #   - the services check's unit-failed / unit-down / unit-flapping of root's unit that runs it.
    # Only when the checks ran here together.
    - name: One outage, one finding (a container that is down is reported by the containers check)
      ansible.builtin.set_fact:
        site_findings: >-
          {%- set ids = site_findings | map(attribute='id') | list -%}
          {%- set drop = {} -%}
          {%- for d in site_mariadb_down | default([]) -%}
          {%-   for k in ['containers:down:', 'containers:unhealthy:'] if (k ~ d.owner ~ '/' ~ d.container) in ids -%}
          {%-     set _ = drop.update({d.id: [k ~ d.owner ~ '/' ~ d.container, 'it is a MariaDB/MySQL database container, so the database is down too']}) -%}
          {%-   endfor -%}
          {%- endfor -%}
          {%- for c in site_containers | default([]) if c.owner == 'root' and c.unit and 'services' in site_checks_run -%}
          {%-   for k in ['down', 'unhealthy', 'crashed'] if ('containers:' ~ k ~ ':' ~ c.key) in ids -%}
          {%-     for s in ['unit-failed:', 'unit-down:'] if (s ~ c.unit) in ids and (s ~ c.unit) not in drop -%}
          {%-       set _ = drop.update({s ~ c.unit: ['containers:' ~ k ~ ':' ~ c.key, 'the services check sees its systemd unit ' ~ c.unit ~ ' fail too']}) -%}
          {%-     endfor -%}
          {%-   endfor -%}
          {%-   if ('containers:restarting:' ~ c.key) in ids and ('unit-flapping:' ~ c.unit) in ids -%}
          {%-     set _ = drop.update({'unit-flapping:' ~ c.unit: ['containers:restarting:' ~ c.key, 'the services check sees its systemd unit ' ~ c.unit ~ ' restart too']}) -%}
          {%-   endif -%}
          {%- endfor -%}
          {%- set out = [] -%}
          {%- for f in site_findings if f.id not in drop -%}
          {%-   set notes = [] -%}
          {%-   for why in drop.values() | selectattr(0, 'equalto', f.id) | map(attribute=1) | unique -%}
          {%-     set dup = drop | dict2items | selectattr('value.0', 'equalto', f.id) | selectattr('value.1', 'equalto', why) | map(attribute='key') | list -%}
          {%-     set _ = notes.append(' - ' ~ why ~ ' (' ~ (dup | join(', ')) ~ ' is not reported separately)') -%}
          {%-   endfor -%}
          {%-   set _ = out.append(f | combine({'summary': f.summary ~ (notes | join(''))}) if notes else f) -%}
          {%- endfor -%}
          {{ out }}
      when:
        - "'containers' in site_checks_run"
        - site_mariadb_down | default([]) | length > 0 or 'services' in site_checks_run

    - name: ACT looks at the findings (only with use_act=true)
      ansible.builtin.include_role:
        name: site_act
      when: use_act | default(false) | bool and site_findings | length > 0

  post_tasks:
    - name: Report (and fail the hosts that have findings)
      ansible.builtin.include_role:
        name: site_findings
        tasks_from: report.yml
