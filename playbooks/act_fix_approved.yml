---
# APPLY THE APPROVED FIX - the step AFTER a person approved in an AAP workflow.
#
#   Health check / Troubleshoot (use_act=true, site_act_level=diagnose)
#     -> fails with NEEDS APPROVAL -> Approval step (a person reads ACT's proposal and approves)
#     -> THIS job
#
# AAP hands this job the first job's results: `act_triage` (the fixes ACT proposed, per host)
# and `site_health` (the findings and which checks found them). For each host, the playbook runs
# EXACTLY the approved commands itself, in order, and stops at the first one that fails - no
# model and no key involved, so nothing can be reworded between approval and fix. Then the same
# checks run again and the job fails if the problem is still there.
#
# DRY RUN: run this job as Check (Job type "Check", e.g. on the workflow's node): it shows what
# it would run for each host and changes nothing. A rehearsal of the whole approve-and-fix path.
#
# It refuses to run on its own: outside the workflow there is nothing approved to apply.
# Do not tick "Prompt on launch" for Variables on its job template.
- name: Apply the fixes a person approved
  hosts: "{{ target | default('all') }}"
  become: true
  gather_facts: false
  vars:
    _approved: "{{ ((act_triage | default({})).get(inventory_hostname) or {}).get('proposed_commands', []) }}"
    _checks_before: "{{ ((site_health | default({})).get(inventory_hostname) or {}).get('checks', []) }}"
    # AAP (aap, aap_hosts) is always diagnose-only, whatever the settings say (same list as roles/site_act/vars/main.yml).
    # This play does not load roles/site_act/defaults: the fallback IS that default (tests/test_protection.py checks it).
    _no_apply: "{{ ((site_act_diagnose_only_groups | default(['aap', 'aap_hosts', 'sat', 'idm', 'netapp', 'netapp_console_hosts'])) + ['aap', 'aap_hosts']) | unique }}"
    _apply_log: /var/log/site-automation-fix.log
  pre_tasks:
    - name: Linux hosts only (Windows servers have their own templates, playbooks/win_*.yml)
      ansible.builtin.include_role:
        name: site_findings
        tasks_from: os_guard.yml

    - name: The first job's results reached this job
      ansible.builtin.assert:
        that: act_triage is defined and act_triage is mapping
        fail_msg: >-
          Nothing to apply: no ACT results reached this job. Run it only inside the workflow, after
          the approval step, behind a check job that ran with use_act=true and site_act_level=diagnose.
        quiet: true
      run_once: true

    - name: Skip hosts with nothing approved
      ansible.builtin.meta: end_host
      when: _approved | length == 0

    # AAP itself and vendor-managed appliances are diagnose-only: a person applies the fix by
    # hand there (an automated change on the AAP host could stop the job making it).
    - name: Diagnose-only hosts get the fix by hand, not from this job
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} is in {{ group_names | intersect(_no_apply + ['aap', 'aap_hosts']) | join(', ') }} (diagnose only).
          Apply by hand if you agree: {{ _approved | join(' ; ') }}
      when: group_names | intersect(_no_apply + ['aap', 'aap_hosts']) | length > 0

    # ['aap', 'aap_hosts'] written out on purpose: an extra variable can override _no_apply, not a literal.
    - name: Skip diagnose-only hosts
      ansible.builtin.meta: end_host
      when: group_names | intersect(_no_apply + ['aap', 'aap_hosts']) | length > 0

    - name: Refuse approved commands that could destroy the host or restart it (apply-time guard)
      ansible.builtin.include_role:
        name: site_findings
        tasks_from: apply_guard.yml
      vars:
        _guard_cmds: "{{ _approved }}"

    - name: DRY RUN (Check mode) - what would run, nothing is changed
      ansible.builtin.debug:
        msg: "DRY RUN on {{ inventory_hostname }}: approved, and would run: {{ _approved | join(' ; ') }}. Nothing was changed (Check mode)."
      when: ansible_check_mode

    - name: Stop here in a dry run
      ansible.builtin.meta: end_host
      when: ansible_check_mode

  tasks:
    - name: Run exactly the approved fix, in order (stops at the first command that fails)
      ansible.builtin.shell:
        cmd: |
          set -u
          {% for c in _approved %}
          printf '### $ %s\n' {{ c | quote }}
          bash -c {{ c | quote }} 2>&1
          rc=$?
          printf '### exit %s\n' "$rc"
          [ "$rc" -eq 0 ] || exit "$rc"
          {% endfor %}
        executable: /bin/bash
      register: _fix_ran
      changed_when: true          # approved commands were run; the re-check below says whether it worked
      failed_when: false

    # A record on the host itself (who approved is in the AAP job; this says what ran and when).
    - name: Record what ran on the host ({{ _apply_log }})
      ansible.builtin.lineinfile:
        path: "{{ _apply_log }}"
        line: >-
          {{ now(utc=true).strftime('%Y-%m-%dT%H:%M:%SZ') }} aap-job={{ tower_job_id | default('?') }}
          user={{ tower_user_name | default('?') }} rc={{ _fix_ran.rc | default('?') }}
          commands={{ _approved | to_json }}
        create: true
        insertafter: EOF
        mode: '0640'
        owner: root
        group: root
      failed_when: false

    - name: Output of the approved fix (exit code {{ _fix_ran.rc | default('-') }})
      ansible.builtin.debug:
        msg: "{{ _fix_ran.stdout_lines | default([]) + (['A command FAILED: the ones after it did not run.'] if (_fix_ran.rc | default(0) | int) != 0 else []) }}"

    # Verification that does not depend on the model: run the same checks again.
    - name: Start the re-check
      ansible.builtin.include_role:
        name: site_findings
        tasks_from: start.yml
      vars:
        site_health_targets_override: "{{ ansible_play_hosts }}"   # only the hosts that had an approved fix

    - name: Re-run the checks that found the problem
      ansible.builtin.include_role:
        name: site_findings
        tasks_from: run_check.yml
      loop: "{{ _checks_before }}"
      loop_control:
        loop_var: _site_check

  post_tasks:
    - name: Report the re-check (fails if the problem is still there)
      ansible.builtin.include_role:
        name: site_findings
        tasks_from: report.yml
