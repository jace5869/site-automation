---
# SERVICE - RESTART (1.67.0, workflow 50 "Service - restart"; the site portal's "Restart" on a service_down finding of
# the Linux or Windows health check - not service_watch's containers). One finding of an earlier health job - named by a
# reference, never by its text: report_job (that AAP job's id), the host (target, also the Limit) and finding_id
# (service_down:<host>:<service>). The service is read back from that job's site_findings artifact (roles/finding_ref).
# Four templates of this playbook, a Linux and a Windows one of each step (portal_service_os, portal_service_phase):
#   [look]      read only: the service's status and its last 30 log lines (journalctl; the Windows event log)
#   [Approval]
#   [restart]   that one service restarted (never one on portal_restart_never: refused in the look step already), and
#               30 s later its status; the result (portal_result) says Fixed when it runs
# docs/SITE_PORTAL.md, "Disk, services and fapolicyd".
#   ansible-playbook playbooks/service_restart.yml -l web01.example.mil -e target=web01.example.mil \
#     -e report_job=4711 -e finding_id=service_down:web01.example.mil:httpd -e portal_service_phase=look
- name: Leave out the hosts of site_exclude_hosts (1.67.0)
  ansible.builtin.import_playbook: site_exclude.yml

- name: Target check (stops with a clear message when target matches no host)
  hosts: "all{{ hostvars['localhost']['site_exclude_not'] | default('') }}"
  gather_facts: false
  tasks:
    - name: The target leaves at least one host to run on
      ansible.builtin.include_role:
        name: site_findings
        tasks_from: target_check.yml
      vars:
        _target_pattern: "{{ target | default('') }}"

- name: Service - restart
  hosts: "{{ target | default('no-target-given') }}{{ hostvars['localhost']['site_exclude_not'] | default('') }}"     # without target the check above has stopped the job
  gather_facts: false
  become: "{{ portal_service_os | default('linux') != 'windows' }}"
  vars:
    site_os: "{{ portal_service_os | default('linux') }}"
  pre_tasks:
    - name: Linux or Windows hosts only, as this template is for
      ansible.builtin.include_role:
        name: site_findings
        tasks_from: os_guard.yml
  tasks:
    - name: Service | the finding, the service, the step
      ansible.builtin.include_role:
        name: portal_service
