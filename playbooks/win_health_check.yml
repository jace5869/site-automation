---
# WINDOWS HEALTH CHECK - read-only checks on Windows servers, the same way as health_check.yml
# does it on Linux: same findings, same report, same ServiceNow tickets and POA&M, same
# workflows. Each check is a PowerShell script (roles/win_check_<name>/files) run with the
# built-in `script` module over WinRM: no Ansible collection is needed on AAP.
#
# What it does, per server:
#   1. runs the checks you pick (a list of names, or the shortcuts daily / weekly / all)
#   2. prints what is wrong in plain words, with a PowerShell command to look further
#   3. writes one Application event log entry per finding (source site-health)
#   4. FAILS the host if something is wrong (so an AAP workflow can open a ticket)
# It changes nothing on the server, and it also runs in Check mode (a dry run).
#
#   ansible-playbook playbooks/win_health_check.yml -i <windows inventory>
#   ansible-playbook playbooks/win_health_check.yml -e target=web01.example.mil -e health_checks=disk
#
# The checks (roles/win_check_<name>):
#   disk         free space on every local fixed volume
#   services     required services running; automatic services stopped with an error; crash loops
#   performance  CPU, memory, page file (names the busiest processes)
#   time         Windows Time synchronized with a real source, recently, and the offset
#   network      gateway, DNS, names that must resolve, ports that must answer, domain trust
#   eventlog     unexpected shutdowns, crashes, disk errors, Security log cleared, error volume
#   security     antivirus, firewall, SMBv1, RDP NLA, UAC, TLS 1.0/1.1
#   audit        advanced audit policy, event log sizes, log forwarding agents
#   accounts     Guest, local password age / never-expires / inactive, local Administrators
#   certs        certificates in the machine stores (and which are in use), TLS endpoints
#   patching     a restart pending for updates, days since the last update
#
# Shortcuts: daily = disk services performance time network eventlog
#            weekly = security audit accounts certs patching
#            all = both
- name: Windows health check
  hosts: "{{ target | default('all') }}"
  gather_facts: false
  vars:
    site_os: windows
    health_checks: [daily]
    _health_sets:
      daily: [disk, services, performance, time, network, eventlog]
      weekly: [security, audit, accounts, certs, patching]
      all: [disk, services, performance, time, network, eventlog, security, audit, accounts, certs, patching]
    # A survey's multiple-choice answer can arrive as a list or as lines of text: accept both.
    _health_asked: >-
      {{ (health_checks.splitlines() if health_checks is string else health_checks)
         | map('trim') | select | list }}
    _health_run: >-
      {%- set out = [] -%}
      {%- for c in _health_asked -%}
      {%-   for x in _health_sets[c] | default([c]) if x not in out -%}{%- set _ = out.append(x) -%}{%- endfor -%}
      {%- endfor -%}
      {{ out }}
  pre_tasks:
    - name: Windows hosts only
      ansible.builtin.include_role:
        name: site_findings
        tasks_from: os_guard.yml

    - name: Only known checks
      ansible.builtin.assert:
        that: _health_run | difference(_health_sets.all) | length == 0
        fail_msg: >-
          Unknown check(s): {{ _health_run | difference(_health_sets.all) | join(', ') }}.
          Known: {{ _health_sets.all | join(', ') }} (or daily, weekly, all).
        quiet: true
      run_once: true

    - name: Start
      ansible.builtin.include_role:
        name: site_findings
        tasks_from: start.yml

  tasks:
    - name: Run the checks
      ansible.builtin.include_role:
        name: site_findings
        tasks_from: run_check.yml
      loop: "{{ _health_run }}"
      loop_control:
        loop_var: _site_check

  post_tasks:
    - name: Report (fails the hosts that have findings)
      ansible.builtin.include_role:
        name: site_findings
        tasks_from: report.yml
