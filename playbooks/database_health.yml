---
# DATABASE HEALTH - MariaDB / MySQL, on the host or in podman containers. Read-only.
#
# Runs ONLY the database check (roles/check_mariadb) - the same check the Health check runs as part
# of "daily" - so a database team can launch it on its own, on its own schedule, and get its own
# tickets. It finds MariaDB and MySQL by itself (5.7, 8.0, 8.4, MariaDB 10.x / 11.x, Percona):
#   - is it running (systemd unit, or the container and its health)
#   - connections against max_connections, refused connections, queries running too long
#   - replication: MariaDB (SHOW ALL SLAVES STATUS), MySQL (SHOW REPLICA / SLAVE STATUS), lag
#   - Galera / XtraDB Cluster, MySQL Group Replication
#   - restarts nobody planned, errors in its log, the disk under its data directory
# It changes nothing: status queries only, no data is read, the password never appears on a command line.
#
# Which servers: by default the members of the inventory groups mariadb_hosts, mysql_hosts,
# database_hosts, mariadb and mysql. To check a server outside those groups, name it with -e target= (a job's Limit can only
# narrow the hosts down, never add one); every server this playbook runs on is checked (its own database,
# or the containers you name for it).
# Podman containers, rootless containers, the credential and the monitoring account: docs/MARIADB.md.
#
#   ansible-playbook playbooks/database_health.yml                            # the database groups
#   ansible-playbook playbooks/database_health.yml -e target=snowdb01.example.mil
#   ansible-playbook playbooks/database_health.yml --check                    # dry run: it only reads
#
# Findings, ServiceNow tickets and ACT (-e use_act=true) work as for the Health check: each host prints
# HEALTHY or its findings (with a command to look further), the job ends with a "N healthy, M with findings"
# summary, and a host with findings FAILS (so a workflow can open a ticket).
# In AAP: a job template on this playbook with the credentials "MariaDB monitor" (the read-only
# database account) and, for tickets, the workflow of docs/WORKFLOWS_AND_SCHEDULES.md.
- name: Target check (stops with a clear message when target matches no host)
  hosts: all
  gather_facts: false
  tasks:
    - name: The target leaves at least one host to run on
      ansible.builtin.include_role:
        name: site_findings
        tasks_from: target_check.yml
      vars:
        _target_pattern: "{{ target | default('mariadb_hosts,mysql_hosts,database_hosts,mariadb,mysql') }}"

- name: Database health - MariaDB / MySQL (host or podman container)
  hosts: "{{ target | default('mariadb_hosts,mysql_hosts,database_hosts,mariadb,mysql') }}"
  become: true
  gather_facts: false
  vars:
    # Every server this playbook is pointed at is a database server: no group membership needed
    # (an extra var -e check_mariadb_enabled=false still wins).
    check_mariadb_enabled: true
  pre_tasks:
    - name: Linux hosts only (Windows servers have their own templates, playbooks/win_*.yml)
      ansible.builtin.include_role:
        name: site_findings
        tasks_from: os_guard.yml

    - name: Start
      ansible.builtin.include_role:
        name: site_findings
        tasks_from: start.yml

  tasks:
    - name: Run the database check (MariaDB or MySQL, host or containers)
      ansible.builtin.include_role:
        name: site_findings
        tasks_from: run_check.yml
      vars:
        _site_check: mariadb

    - name: ACT looks at the findings (only with use_act=true)
      ansible.builtin.include_role:
        name: site_act
      when: use_act | default(false) | bool and site_findings | length > 0

  post_tasks:
    - name: Report (and fail the hosts that have findings)
      ansible.builtin.include_role:
        name: site_findings
        tasks_from: report.yml
