---
# Deploy / reconcile the STIG Manager stack (MySQL 8.4 + STIG Manager + nginx TLS) on podman.
# Keycloak is external and its realm already exists: this playbook never touches it.
#
# AAP job template credentials: Machine (ssh + sudo), "STIG Manager database", "TLS certificate",
# and optionally "Container registry login (hosts)". Nothing secret goes in variables.
#
#   ansible-playbook playbooks/stigman_deploy.yml -l stigman01.example.mil
- name: Target check (stops with a clear message when target matches no host)
  hosts: all
  gather_facts: false
  tasks:
    - name: The target leaves at least one host to run on
      ansible.builtin.include_role:
        name: site_findings
        tasks_from: target_check.yml
      vars:
        _target_pattern: "{{ target | default('stigman') }}"

- name: STIG Manager stack
  hosts: "{{ target | default('stigman') }}"
  become: true
  gather_facts: true
  gather_subset: [min]
  roles:
    - role: stigman_stack
