---
# STIG RECHECK - after fixing hosts, or before updating STIG Manager: the rules STIG Manager has Open or Not Reviewed
# for each Linux host (check_stig_recheck) checked again on the host - only those rules (Evaluate-STIG with -SelectVuln,
# or oscap with a --rule for each): minutes, not a full scan. STIG Manager is only read - this job never writes to it
# (workflow 37 does, after an approval: check_stig_update_workflow, playbooks/stigman_update.yml):
#   fixed        Open in STIG Manager, the host passes now           -> set the review to Not a Finding
#   now n/a      Open in STIG Manager, Not Applicable now            -> set it to Not Applicable
#   answered     Not Reviewed in STIG Manager, the scan answered it  -> set it (a fail is Open)
#   still open   Open, and the host still fails it                   -> nothing to update
#   by hand      the scan gave no answer (a manual check)            -> a person reviews it
# Report only: no finding for what was found; a host that could not be rechecked is a warning. Nothing is kept with
# the STIG drift report's scans (playbooks/stig_drift_report.yml checks every rule and keeps the history); the
# checklist is kept on the host (check_stig_dir/recheck), STIG Manager can import it. The scanner and STIG Manager
# settings are the drift report's (check_stig_*). Windows servers: playbooks/win_stig_recheck.yml. docs/STIG_DRIFT.md.
#
#   ansible-playbook playbooks/stig_recheck.yml -e target=rhel_servers
#   ansible-playbook playbooks/stig_recheck.yml -e '{"check_stig_recheck": ["open"]}'   # only what STIG Manager has Open
#   ansible-playbook playbooks/stig_recheck.yml --check      # checks and compares, keeps nothing on the hosts
- name: STIG recheck
  hosts: "{{ target | default('all') }}"
  become: true
  gather_facts: false
  vars:
    site_report_title: STIG recheck
    # report only: no finding is raised for what is open, so the job never says HEALTHY - what is open and what to
    # update are its lines above, and the report's title
    site_report_no_findings: REPORT ONLY - what is open and what to update in STIG Manager are listed above
  pre_tasks:
    - name: Linux hosts only (VMware has its own STIG tooling)
      ansible.builtin.include_role:
        name: site_findings
        tasks_from: os_guard.yml

    - name: A host that cannot be reached is listed and left out - the job is not failed for it (site_unreachable_fails)
      ansible.builtin.include_role:
        name: site_findings
        tasks_from: reach.yml
  tasks:
    - name: Start
      ansible.builtin.include_role:
        name: site_findings
        tasks_from: start.yml

    - name: Read STIG Manager, check those rules again, compare
      ansible.builtin.include_role:
        name: site_findings
        tasks_from: run_check.yml
      vars:
        _site_check: stig
        _site_check_tasks: recheck

    - name: Every host
      ansible.builtin.debug:
        msg: >-
          {%- set out = [] -%}
          {%- for h in ansible_play_hosts | sort if hostvars[h].check_stig_results is defined -%}
          {%-   for c in hostvars[h].check_stig_results -%}
          {%-     for line in c | stig_recheck_lines -%}{%- set _ = out.append(line) -%}{%- endfor -%}
          {%-   endfor -%}
          {%- endfor -%}
          {{ out }}
      run_once: true

    - name: The tables for the report email
      ansible.builtin.set_fact:
        site_report_sections: >-
          {{ ansible_play_hosts | map('extract', hostvars) | selectattr('check_stig_results', 'defined')
             | map(attribute='check_stig_results') | flatten(levels=1) | stig_recheck_sections(check_stig_list_max | default(200) | int) }}
      run_once: true

    # workflow 37's check (check_stig_update_workflow: true): the reviews to write, in the report, handed to the approval
    # step and the job after it (playbooks/stigman_update.yml) - nothing is written here
    - name: STIG Manager - the reviews to write once approved (check_stig_update_workflow)
      ansible.builtin.set_fact:
        _stig_update_plan: >-
          {{ ansible_play_hosts | map('extract', hostvars) | selectattr('check_stig_results', 'defined')
             | map(attribute='check_stig_results') | flatten(levels=1)
             | stig_update_plan(check_stig_update | default(['fixed', 'now_na', 'answered']), check_stig_update_status | default('submitted'),
                                check_stig_update_detail_max | default(8000) | int, now(utc=true).strftime('%Y-%m-%d')) }}
      run_once: true
      when: check_stig_update_workflow | default(false) | bool

    # a review with attachments in STIG Manager (evidence a person attached) is never handed to the approval
    - name: STIG Manager - leave out the reviews that have attachments (check_stig_update_skip_attachments)
      ansible.builtin.include_role:
        name: check_stig
        tasks_from: update_attachments.yml
      when: >-
        check_stig_update_workflow | default(false) | bool and _stig_update_plan | length > 0
        and check_stig_update_skip_attachments | default(true) | bool and check_stig_stigman_api | default('') | length > 0

    - name: STIG Manager - what Approve writes, at the top of the report
      ansible.builtin.set_fact:
        site_report_sections: "{{ (_stig_update_plan | stig_update_sections(check_stig_list_max | default(200) | int)) + site_report_sections }}"
      run_once: true
      when: check_stig_update_workflow | default(false) | bool

    - name: STIG Manager - the reviews to write
      ansible.builtin.debug:
        msg: "{{ _stig_update_plan | map(attribute='line') | list or 'nothing to write to STIG Manager' }}"
      run_once: true
      when: check_stig_update_workflow | default(false) | bool

    - name: STIG Manager - hand them to the approval step and the job after it (set_stats stigman_update_plan)
      ansible.builtin.set_stats:
        data:
          stigman_update_plan: "{{ _stig_update_plan }}"
        per_host: false
        aggregate: false
      run_once: true
      when: check_stig_update_workflow | default(false) | bool and _stig_update_plan | length > 0

  post_tasks:
    - name: Report (a host that could not be rechecked is a warning)
      ansible.builtin.include_role:
        name: site_findings
        tasks_from: report.yml

    - name: STIG Manager - NEEDS APPROVAL
      ansible.builtin.fail:
        msg: >-
          NEEDS APPROVAL - {{ _stig_update_plan | length }} review(s) of {{ _stig_update_plan | map(attribute='assetId') | unique | list | length }}
          asset(s) to write to STIG Manager, in the report ("Approve writes these reviews to STIG Manager"). Approve the workflow's
          step to write them; deny it to write none. {{ _stig_update_plan | map(attribute='line') | join(' || ') }}
      run_once: true
      when: check_stig_update_workflow | default(false) | bool and _stig_update_plan | length > 0
