---
# STIG RECHECK - after fixing hosts, or before updating STIG Manager: the rules STIG Manager has Open or Not Reviewed
# for each Linux host (check_stig_recheck) checked again on the host - only those rules (Evaluate-STIG with -SelectVuln,
# or oscap with a --rule for each): minutes, not a full scan. STIG Manager is read-only - this job never writes to it:
#   fixed        Open in STIG Manager, the host passes now           -> set the review to Not a Finding
#   now n/a      Open in STIG Manager, Not Applicable now            -> set it to Not Applicable
#   answered     Not Reviewed in STIG Manager, the scan answered it  -> set it (a fail is Open)
#   still open   Open, and the host still fails it                   -> nothing to update
#   by hand      the scan gave no answer (a manual check)            -> a person reviews it
# Report only: no finding for what was found; a host that could not be rechecked is a warning. Nothing is kept with
# the STIG drift report's scans (playbooks/stig_drift_report.yml checks every rule and keeps the history); the
# checklist is kept on the host (check_stig_dir/recheck), STIG Manager can import it. The scanner and STIG Manager
# settings are the drift report's (check_stig_*). Windows servers: playbooks/win_stig_recheck.yml. docs/STIG_DRIFT.md.
#
#   ansible-playbook playbooks/stig_recheck.yml -e target=rhel_servers
#   ansible-playbook playbooks/stig_recheck.yml -e '{"check_stig_recheck": ["open"]}'   # only what STIG Manager has Open
#   ansible-playbook playbooks/stig_recheck.yml --check      # checks and compares, keeps nothing on the hosts
- name: STIG recheck
  hosts: "{{ target | default('all') }}"
  become: true
  gather_facts: false
  vars:
    site_report_title: STIG recheck
  pre_tasks:
    - name: Linux hosts only (VMware has its own STIG tooling)
      ansible.builtin.include_role:
        name: site_findings
        tasks_from: os_guard.yml

    - name: A host that cannot be reached is listed and left out - the job is not failed for it (site_unreachable_fails)
      ansible.builtin.include_role:
        name: site_findings
        tasks_from: reach.yml
  tasks:
    - name: Start
      ansible.builtin.include_role:
        name: site_findings
        tasks_from: start.yml

    - name: Read STIG Manager, check those rules again, compare
      ansible.builtin.include_role:
        name: site_findings
        tasks_from: run_check.yml
      vars:
        _site_check: stig
        _site_check_tasks: recheck

    - name: Every host
      ansible.builtin.debug:
        msg: >-
          {%- set out = [] -%}
          {%- for h in ansible_play_hosts | sort if hostvars[h].check_stig_results is defined -%}
          {%-   for c in hostvars[h].check_stig_results -%}
          {%-     for line in c | stig_recheck_lines -%}{%- set _ = out.append(line) -%}{%- endfor -%}
          {%-   endfor -%}
          {%- endfor -%}
          {{ out }}
      run_once: true

    - name: The tables for the report email
      ansible.builtin.set_fact:
        site_report_sections: >-
          {{ ansible_play_hosts | map('extract', hostvars) | selectattr('check_stig_results', 'defined')
             | map(attribute='check_stig_results') | flatten(levels=1) | stig_recheck_sections(check_stig_list_max | default(200) | int) }}
      run_once: true

  post_tasks:
    - name: Report (a host that could not be rechecked is a warning)
      ansible.builtin.include_role:
        name: site_findings
        tasks_from: report.yml
