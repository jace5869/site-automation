---
# AAP - SET UP CREDENTIALS. Renames AAP credentials (aap_credential_renames) and attaches them to job templates
# (aap_credential_attach) or takes them off (aap_credential_detach), through AAP's API. Never deletes a credential and
# never reads a secret: only names, ids and types. Everything is checked first - a name that matches nothing or more than
# one credential, or a rename onto a name that is there, and nothing is changed. A template that has a credential of the
# same type already keeps it unless aap_credential_replace_same_type: true. Run it with Check first: it then only reads,
# and says what it would do. docs/SETUP_AAP.md, "Rename and attach credentials".
# Runs on the AAP side: attach a "Red Hat Ansible Automation Platform" credential (its user: Admin on the organization);
# no Limit.
#   ansible-playbook playbooks/aap_credentials_setup.yml --check -e '{"aap_credential_renames": {"Old": "New"}}'
- name: AAP - set up credentials
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Rename, attach and take off credentials
      ansible.builtin.include_role:
        name: aap_credentials
