---
# WINDOWS - LOCAL GROUP MEMBERS (1.122.0). Who is in the privileged local groups of each Windows server (Administrators,
# Remote Desktop Users, Remote Management Users, Backup Operators - win_local_groups), found by their well-known SID so a
# German or French Windows counts too. READ ONLY: nothing on a server changes, also in Check mode. The report: Unusual
# members (an enabled local account in Administrators; a member on few of the servers - win_local_groups_usual), By
# server, By member (who is in which group where), Not read; the page filters by group and member; the workbook
# (report_email_xlsx) has every row with a Group column. docs/WINDOWS.md "Local group members".
#
#   ansible-playbook playbooks/win_local_groups.yml -l 'SRV-APP*'
- name: Leave out the hosts of site_exclude_hosts (1.67.0)
  ansible.builtin.import_playbook: site_exclude.yml

- name: Windows - local group members
  hosts: "{{ target | default('all') }}{{ hostvars['localhost']['site_exclude_not'] | default('') }}"
  gather_facts: false
  vars:
    site_os: windows
    site_report_title: Windows - local group members
  pre_tasks:
    - name: Windows hosts only
      ansible.builtin.include_role:
        name: site_findings
        tasks_from: os_guard.yml

    - name: A host that cannot be reached is listed (Not read) and left out - the job is not failed for it
      ansible.builtin.include_role:
        name: site_findings
        tasks_from: reach.yml
  tasks:
    - name: Read the members of the local groups (read only)
      ansible.builtin.include_role:
        name: win_local_groups

  post_tasks:
    - name: Every server's groups, as one model
      ansible.builtin.set_fact:
        _wlg_model: >-
          {{ _wlg_hosts | win_local_groups_model(win_local_groups_usual | default('off')) }}
      vars:
        # every host that got past the OS check: read, not reached, or failed before its read
        _wlg_hosts: >-
          {%- set out = [] -%}
          {%- for h in ansible_play_hosts_all if hostvars[h].site_host_unreached is defined -%}
          {%-   set _ = out.append({'host': h, 'result': hostvars[h].win_local_groups_result | default({}),
                                    'unreached': hostvars[h].site_host_unreached | default(''),
                                    'inv_groups': hostvars[h].group_names | default([])}) -%}
          {%- endfor -%}
          {{ out }}
      run_once: true

    - name: This server's findings (an enabled local account in Administrators, a group not read)
      ansible.builtin.set_fact:
        site_findings: "{{ _wlg_model | win_local_groups_findings(inventory_hostname) }}"

    - name: Unusual members and the servers not read
      ansible.builtin.debug:
        msg: >-
          {%- set out = [] -%}
          {%- for p in _wlg_model.pairs.values() if p.unusual or p.local_admin -%}
          {%-   set _ = out.append(('WARNING ' if p.local_admin else 'unusual ') ~ p.member.name ~ ' in ' ~ p.label ~ ' on '
                                   ~ (p.hosts | length) ~ ' of ' ~ p.of ~ ': ' ~ (p.hosts | sort | join(', '))) -%}
          {%- endfor -%}
          {%- for u in _wlg_model.unread -%}
          {%-   set _ = out.append('NOT READ ' ~ u.host ~ ': ' ~ u.why) -%}
          {%- endfor -%}
          {{ out or ['Nothing unusual: ' ~ (_wlg_model.read | length) ~ ' server(s) read.'] }}
      run_once: true

    # 1.122.0: the complete inventory - every member of every group read on every server, one row each, nothing left out -
    # as CSV and JSON files (attached to the email, beside the page on the report website) and the job artifact
    - name: The inventory files (CSV, JSON), in the execution environment
      ansible.builtin.tempfile:
        state: directory
        suffix: .wlg
      delegate_to: localhost
      check_mode: false
      run_once: true
      register: _wlg_dir

    - name: The inventory files, written there
      ansible.builtin.copy:
        content: "{{ item.content }}"
        dest: "{{ _wlg_dir.path }}/{{ item.name }}"
        mode: "0600"
      loop:
        - {name: local-groups.csv, content: "{{ _wlg_model | win_local_groups_csv }}"}
        - {name: local-groups.json, content: "{{ _wlg_model | win_local_groups_json }}"}
        # the list to build the approved list from (every member, each with # in front: the person decides)
        - {name: approved-list.yml, content: "{{ _wlg_model | win_local_groups_approved_yaml(now(utc=true).strftime('%Y-%m-%d')) }}"}
      loop_control:
        label: "{{ item.name }}"
      delegate_to: localhost
      check_mode: false
      run_once: true

    # with win_local_groups_approved: the checks to run elsewhere - an Evaluate-STIG answer file per STIG
    # (win_local_groups_stig_rules) and check-local-admins.ps1. The job itself judges nothing.
    - name: The checks from the approved list (answer files, check-local-admins.ps1)
      ansible.builtin.copy:
        content: "{{ item.content }}"
        dest: "{{ _wlg_dir.path }}/{{ item.name }}"
        mode: "0600"
      loop: "{{ _wlg_checks }}"
      loop_control:
        label: "{{ item.name }}"
      vars:
        _wlg_checks: >-
          {{ _wlg_model | win_local_groups_checks(win_local_groups_approved | default({}), win_local_groups_approved_by | default([]),
                                                  win_local_groups_stig_rules | default([])) }}
      delegate_to: localhost
      check_mode: false
      run_once: true
      register: _wlg_check_files

    - name: Email the report, publish it (report_email_to, report_web_dest) - once, from the AAP side
      ansible.builtin.include_role:
        name: site_email
        apply:
          delegate_to: localhost
          run_once: true
          become: false
      vars:
        ansible_connection: local
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
        _wlg_by_host: >-
          {{ dict(_wlg_model.read | map(attribute='host') | zip(_wlg_model.read | map(attribute='host')
                                                               | map('extract', hostvars) | map(attribute='site_findings', default=[]))) }}
        # the servers not read are the report's own (Not read, its tile), so none is passed as missing
        _report: >-
          {{ (_wlg_by_host | findings_report(site_report_title, [], ['local groups'], _wlg_model | win_local_groups_sections(false)))
             | combine({'footer': _wlg_note}) }}
        _report_web: >-
          {{ (_wlg_by_host | findings_report(site_report_title, [], ['local groups'], _wlg_model | win_local_groups_sections(true, win_local_groups_stig_rules | default([]))))
             | combine({'footer': _wlg_note, 'facets': _wlg_model | win_local_groups_facets}) }}
        _report_xlsx: "{{ (_wlg_model | win_local_groups_sheets) if report_email_xlsx | default(false) | bool else [] }}"
        # the inventory (CSV, JSON), the list to build the approved list from, and the checks made from it (when set)
        _report_attachments: >-
          {%- set out = [] -%}
          {%- for n in ['local-groups.csv', 'local-groups.json', 'approved-list.yml']
                       + (_wlg_check_files.results | default([]) | map(attribute='item') | map(attribute='name') | list) -%}
          {%-   set _ = out.append({'path': _wlg_dir.path ~ '/' ~ n, 'filename': n}) -%}
          {%- endfor -%}
          {{ out }}
        _wlg_note: >-
          Read only: the job read each group's members and changed nothing. A group is found by its well-known SID
          (S-1-5-32-544 is Administrators on any language of Windows), else by its name. A member Windows cannot name is
          listed as an unresolved SID, never left out. Domain groups are not expanded yet: their members are in AD.
      run_once: true
      when: report_email_to | default([]) | length > 0 or report_email_also | default([]) | length > 0 or report_web_dest | default('') | length > 0

    - name: No email
      ansible.builtin.debug:
        msg: "No email: report_email_to is not set (docs/EMAIL_REPORTS.md)."
      run_once: true
      when: report_email_to | default([]) | length == 0 and report_email_also | default([]) | length == 0

    - name: Publish the result for later workflow steps (set_stats win_local_groups)
      ansible.builtin.set_stats:
        data:
          win_local_groups: >-
            {{ {'read': _wlg_model.read | map(attribute='host') | list, 'not_read': _wlg_model.unread,
                'unusual': _wlg_model.pairs.values() | selectattr('unusual') | map(attribute='member.name') | unique | list,
                'local_admins': _wlg_model.pairs.values() | selectattr('local_admin') | map(attribute='member.name') | unique | list,
                'rows': _wlg_model | win_local_groups_rows} }}
        per_host: false
      run_once: true
