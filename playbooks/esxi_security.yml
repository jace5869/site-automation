---
# ESXI SECURITY SETTINGS (vCenter). On every ESXi host (or the ones named): SSH and the ESXi Shell
# off, the shell timeouts at 600 s, lockdown mode normal - changing only what differs, so it is safe to run every
# night (it puts back whatever drifted). Check (a dry run) changes nothing and says what it would.
# The vCenter appliance's own access too, when set (esxi_security_vcsa_*: SSH Login, DCUI, Console CLI, Bash Shell -
# its VAMI's Access page; the credential's account in SystemConfiguration.Administrators).
# Emailed (report_email_to) when a host was changed or failed. Fails when a host could not be set.
# Runs on the AAP side against vCenter: attach a "VMware vCenter" credential; no Limit. docs/VMWARE.md
#   ansible-playbook playbooks/esxi_security.yml
- name: ESXi security settings
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: ESXi security settings
      ansible.builtin.include_role:
        name: vmware_vm
        tasks_from: esxi_security.yml
