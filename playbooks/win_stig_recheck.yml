---
# WINDOWS STIG RECHECK - after fixing servers, or before updating STIG Manager: the rules STIG Manager has Open or Not
# Reviewed for each Windows server (check_stig_recheck) - every STIG of its asset and of its web site and database
# assets (<server>-<site>-<instance>) - checked again by Evaluate-STIG with -SelectVuln: only those rules, minutes, not a
# full scan. STIG Manager is only read - this job never writes to it (workflow 37 does, after an approval):
#   fixed        Open in STIG Manager, the server passes now         -> set the review to Not a Finding
#   now n/a      Open in STIG Manager, Not Applicable now            -> set it to Not Applicable
#   answered     Not Reviewed in STIG Manager, the scan answered it  -> set it (a fail is Open)
#   still open   Open, and the server still fails it                 -> nothing to update
#   by hand      the scan gave no answer (a manual check)            -> a person reviews it
# Report only: no finding for what was found; a server that could not be rechecked is a warning. Nothing is kept with
# the Windows STIG drift report's scans (playbooks/win_stig_drift_report.yml checks every rule and keeps the history);
# each checklist is kept on the server (win_check_stig_dir\recheck), STIG Manager can import it. The Evaluate-STIG and
# STIG Manager settings are the drift report's (win_check_stig_*, check_stig_*). Windows only (WinRM, no collection
# needed). docs/STIG_DRIFT.md.
#
#   ansible-playbook playbooks/win_stig_recheck.yml -i <windows inventory>
#   ansible-playbook playbooks/win_stig_recheck.yml -i <windows inventory> -e '{"check_stig_recheck": ["open"]}'
#   ansible-playbook playbooks/win_stig_recheck.yml -i <windows inventory> --check   # checks and compares, keeps nothing
- name: Leave out the hosts of site_exclude_hosts (1.67.0)
  ansible.builtin.import_playbook: site_exclude.yml

- name: Windows STIG recheck
  hosts: "{{ target | default('all') }}{{ hostvars['localhost']['site_exclude_not'] | default('') }}"
  gather_facts: false
  vars:
    site_os: windows
    site_report_title: Windows STIG recheck
    # report only: no finding is raised for what is open, so the job never says HEALTHY - what is open and what to
    # update are its lines above, and the report's title
    site_report_no_findings: REPORT ONLY - the open findings and STIG Manager's status updates are listed above
  pre_tasks:
    # 1.67.0: launched from the site portal (portal_requested_by): the host it was sent is checked again (in this
    # inventory, the job's Limit) and who asked is in the output and the artifact portal_request. Workflow 45.
    - name: Site portal | check the request again (only when the portal launched this job)
      ansible.builtin.include_role:
        name: portal_request
        apply:
          delegate_to: localhost
          run_once: true
          become: false
      vars:
        ansible_connection: local
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
        portal_request_action: stig_recheck
        portal_request_spec: {target: {kind: hosts}}
        portal_request_limit_from: target
      when: portal_requested_by is defined

    - name: Windows hosts only
      ansible.builtin.include_role:
        name: site_findings
        tasks_from: os_guard.yml

    - name: A host that cannot be reached is listed and left out - the job is not failed for it (site_unreachable_fails)
      ansible.builtin.include_role:
        name: site_findings
        tasks_from: reach.yml
  tasks:
    - name: Start
      ansible.builtin.include_role:
        name: site_findings
        tasks_from: start.yml

    - name: Read STIG Manager, check those rules again, compare
      ansible.builtin.include_role:
        name: site_findings
        tasks_from: run_check.yml
      vars:
        _site_check: stig
        _site_check_tasks: recheck

    - name: Every server, every checklist
      ansible.builtin.debug:
        msg: >-
          {%- set out = [] -%}
          {%- for h in ansible_play_hosts | sort if hostvars[h].check_stig_results is defined -%}
          {%-   for c in hostvars[h].check_stig_results -%}
          {%-     for line in c | stig_recheck_lines -%}{%- set _ = out.append(line) -%}{%- endfor -%}
          {%-   endfor -%}
          {%- endfor -%}
          {{ out }}
      run_once: true

    - name: The tables for the report email
      ansible.builtin.set_fact:
        site_report_sections: >-
          {{ ansible_play_hosts | map('extract', hostvars) | selectattr('check_stig_results', 'defined')
             | map(attribute='check_stig_results') | flatten(levels=1) | stig_recheck_sections(check_stig_list_max | default(200) | int) }}
      run_once: true

    # workflow 37's check (check_stig_update_workflow: true): the reviews to write, in the report, handed to the approval
    # step and the job after it (playbooks/stigman_update.yml) - nothing is written here
    - name: STIG Manager - the reviews to write once approved (check_stig_update_workflow)
      ansible.builtin.set_fact:
        _stig_update_plan: >-
          {{ ansible_play_hosts | map('extract', hostvars) | selectattr('check_stig_results', 'defined')
             | map(attribute='check_stig_results') | flatten(levels=1)
             | stig_update_plan(check_stig_update | default(['fixed', 'now_na', 'answered']), check_stig_update_status | default('submitted'),
                                check_stig_update_detail_max | default(8000) | int, now(utc=true).strftime('%Y-%m-%d'),
                                check_stig_update_refresh | default(true) | bool, check_stig_update_overwrite_accepted | default(true) | bool) }}
        # 1.69.1: the reviews left as they are - RA / POA&M words in the detail or comment (stigman_protect_words), or
        # Accepted with check_stig_update_overwrite_accepted: false
        _stig_protected: >-
          {{ ansible_play_hosts | map('extract', hostvars) | selectattr('check_stig_results', 'defined')
             | map(attribute='check_stig_results') | flatten(levels=1)
             | stig_update_protected(check_stig_update | default(['fixed', 'now_na', 'answered']), check_stig_update_status | default('submitted'),
                                     check_stig_update_detail_max | default(8000) | int, now(utc=true).strftime('%Y-%m-%d'),
                                     check_stig_update_refresh | default(true) | bool, check_stig_update_overwrite_accepted | default(true) | bool) }}
      run_once: true
      when: check_stig_update_workflow | default(false) | bool

    - name: STIG Manager - the reviews left as they are (protected)
      ansible.builtin.debug:
        msg: >-
          {{ _stig_protected | map(attribute='line') | zip(_stig_protected | map(attribute='protected'))
             | map('join', ' - PROTECTED, left as it is: ') | list if _stig_protected else 'no protected review' }}
      run_once: true
      when: check_stig_update_workflow | default(false) | bool

    # a review with attachments in STIG Manager (evidence a person attached) is never handed to the approval
    - name: STIG Manager - leave out the reviews that have attachments (check_stig_update_skip_attachments)
      ansible.builtin.include_role:
        name: check_stig
        tasks_from: update_attachments.yml
      when: >-
        check_stig_update_workflow | default(false) | bool and _stig_update_plan | length > 0
        and check_stig_update_skip_attachments | default(true) | bool and check_stig_stigman_api | default('') | length > 0

    - name: STIG Manager - what Approve writes, at the top of the report
      ansible.builtin.set_fact:
        site_report_sections: >-
          {{ (_stig_update_plan | stig_update_sections(check_stig_list_max | default(200) | int))
             + (_stig_protected | default([]) | stig_update_protected_section(check_stig_list_max | default(200) | int)) + site_report_sections }}
      run_once: true
      when: check_stig_update_workflow | default(false) | bool

    - name: STIG Manager - the reviews to write
      ansible.builtin.debug:
        msg: "{{ _stig_update_plan | map(attribute='line') | list or 'nothing to write to STIG Manager' }}"
      run_once: true
      when: check_stig_update_workflow | default(false) | bool

    - name: STIG Manager - hand them to the approval step and the job after it (set_stats stigman_update_plan)
      ansible.builtin.set_stats:
        data:
          stigman_update_plan: "{{ _stig_update_plan }}"
        per_host: false
        aggregate: false
      run_once: true
      when: check_stig_update_workflow | default(false) | bool and _stig_update_plan | length > 0

    # 1.73.0 (check_stig_rule_texts): each rule the tables above list, with DISA's check text and fix text - from STIG
    # Manager (read-only, once per STIG revision) or Evaluate-STIG's checklist (roles/check_stig/tasks/texts.yml)
    - name: Each listed rule's check text and fix text (check_stig_rule_texts)
      ansible.builtin.include_role:
        name: check_stig
        tasks_from: texts.yml

  post_tasks:
    # 1.67.0: one finding of the site portal's (playbooks/win_stig_finding_recheck.yml, workflow 46): fixed, still there
    # or not checked, for its job page - before the report and NEEDS APPROVAL, which end the host
    - name: Site portal | fixed or still there
      ansible.builtin.include_role:
        name: portal_stig
        tasks_from: result.yml
      when: finding is defined and finding.kind | default('') in ['stig_rule_fail', 'stig_fixed_open', 'stig_no_asset']

    - name: Report (a server that could not be rechecked is a warning)
      ansible.builtin.include_role:
        name: site_findings
        tasks_from: report.yml

    - name: STIG Manager - NEEDS APPROVAL
      ansible.builtin.fail:
        msg: >-
          NEEDS APPROVAL - {{ _stig_update_plan | length }} review(s) of {{ _stig_update_plan | map(attribute='assetId') | unique | list | length }}
          asset(s) to write to STIG Manager{{ (' (' ~ _fresh | length ~ ' refreshed: still Open, a new date)') if _fresh else '' }}, in the report
          ("Approve writes these reviews to STIG Manager"). Approve the workflow's
          step to write them; deny it to write none.{{ (' ' ~ _stig_protected | length ~ ' protected review(s) left as they are (the report: Protected).') if _stig_protected | default([]) else '' }} {{ _stig_update_plan | map(attribute='line') | join(' || ') }}
      run_once: true
      when: check_stig_update_workflow | default(false) | bool and _stig_update_plan | length > 0
      vars:
        _fresh: "{{ _stig_update_plan | selectattr('kind', 'eq', 'refresh') | list }}"
