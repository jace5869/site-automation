---
# VM SNAPSHOT REPORT (vCenter). Read-only: every snapshot of every VM - name, taken, age, size,
# folder - oldest first; the ones vm_snapshot_max_age_days (3) or older listed apart. Emailed
# (report_email_to). In the snapshot cleanup workflow: step 1.
# Runs on the AAP side against vCenter: attach a "VMware vCenter" credential; no Limit. docs/VMWARE.md
#   ansible-playbook playbooks/vm_snapshot_report.yml
- name: VM snapshot report
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: VM snapshot report
      ansible.builtin.include_role:
        name: vmware_vm
        tasks_from: snapshot_report.yml
