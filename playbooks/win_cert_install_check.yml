---
# WINDOWS CERTIFICATE INSTALL - THE CHECK (job 1 of the Windows certificate install workflow). With
# cert_renew_servicenow: catalog the Windows renewal ordered each CSR from the PKI's catalog item, and the PKI puts
# the issued certificate on that request. This job, on a schedule: the renewals waiting on each server (the
# pending request certreq -new left, its key in the machine key store), each one's request, and the certificate
# there whose public key is the CSR's - then, on the server, what installing it would do: certreq -accept -machine
# (with its key, in Personal), and each binding of the old certificate moved to it - https in HTTP.sys (IIS,
# WSUS ...), Remote Desktop, the WinRM HTTPS listener - or why a person installs it (SQL Server uses it, AAP
# connects through that WinRM listener ...). Reads only, here and in ServiceNow.
#
# Something to install: the plan goes to the approval and the install job (set_stats cert_install_plan) and this
# job FAILS on purpose - "NEEDS APPROVAL" - so the workflow takes its "Run on fail" path:
#
#   [Windows certificate install - check] --Run on fail--> [Approval] --Run on success--> [Windows certificate install - approved]
#
# Credentials: Machine (Windows, an administrator) and ServiceNow API. docs/CERT_INSTALL.md
#   ansible-playbook playbooks/win_cert_install_check.yml -i <windows inventory>
- name: Windows certificate install - the renewals waiting on each server
  hosts: "{{ target | default('all') }}"
  gather_facts: false
  vars:
    site_os: windows
  pre_tasks:
    - name: Windows hosts only
      ansible.builtin.include_role:
        name: site_findings
        tasks_from: os_guard.yml

    - name: A host that cannot be reached is listed and left out - the job is not failed for it (site_unreachable_fails)
      ansible.builtin.include_role:
        name: site_findings
        tasks_from: reach.yml
  tasks:
    - name: The renewals waiting for their certificate
      ansible.builtin.include_role:
        name: win_check_certs
        tasks_from: install_pending.yml

- name: Windows certificate install - the issued certificates, from the requests
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Each CSR's request, and the certificate the PKI put there
      ansible.builtin.include_role:
        name: servicenow
        tasks_from: cert_issued.yml

- name: Windows certificate install - what installing each would do
  hosts: "{{ target | default('all') }}"
  gather_facts: false
  vars:
    site_os: windows
  tasks:
    - name: The plan for each issued certificate
      ansible.builtin.include_role:
        name: win_check_certs
        tasks_from: install_plan.yml
      when: cert_install_pending is defined

- name: Windows certificate install - the plan, for the approval
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: What is ready to install, and the approval
      ansible.builtin.include_role:
        name: servicenow
        tasks_from: cert_install_plan.yml
