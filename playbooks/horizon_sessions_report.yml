---
# HORIZON SESSIONS REPORT. Read-only: old Horizon Clients, pending sessions, sessions on broken desktops, long sessions,
# users with two or more desktop sessions, the protocols and client versions in use.
# Runs on the AAP side: attach the "Horizon API" credential; no inventory needed. docs/HORIZON.md
#   ansible-playbook playbooks/horizon_sessions_report.yml
- name: Horizon sessions report
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Horizon sessions report
      ansible.builtin.include_role:
        name: horizon
        tasks_from: sessions.yml
