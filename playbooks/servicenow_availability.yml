---
# SERVICENOW - AVAILABILITY, every 5 to 15 minutes. Read-only: the instance's REST API (one record of servicenow_table,
# with the "ServiceNow API" credential) and its login page, each asked a few times and timed (roles/api_availability).
# Quiet when up: one line, no email. Fails when ServiceNow is down (availability_fail_on), for a workflow's notification
# step; with the "Red Hat Ansible Automation Platform" credential its own past runs give the availability over a day, a
# week and a month. The MID Servers and the rest: servicenow_health.yml. docs/AVAILABILITY.md
#   ansible-playbook playbooks/servicenow_availability.yml
- name: ServiceNow availability
  # on the AAP side: localhost - or, when the job's Limit leaves localhost out, the Limit's first host standing in
  # for it (connection local: nothing runs on it). A Limit of hosts needs no localhost.
  hosts: >-
    {{ 'localhost' if ansible_limit | default('', true) | length == 0
       or 'localhost' in query('ansible.builtin.inventory_hostnames', ansible_limit)
       else query('ansible.builtin.inventory_hostnames', ansible_limit) | first | default('localhost') }}
  gather_facts: false
  become: false
  vars:
    ansible_connection: local
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  tasks:
    - name: Ask ServiceNow
      ansible.builtin.include_role:
        name: servicenow
        tasks_from: availability.yml
      vars:
        site_report_title: ServiceNow availability
