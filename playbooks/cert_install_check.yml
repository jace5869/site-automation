---
# CERTIFICATE INSTALL - THE CHECK (job 1 of the certificate install workflow). With cert_renew_servicenow: catalog
# the renewal ordered each CSR from the PKI's catalog item, and the PKI puts the issued certificate on that
# request. This job, on a schedule: the renewals waiting on each Linux host (their key and CSR in cert_renew_dir),
# each one's request, and the certificate there whose public key is the CSR's - then, on the host, what installing
# it would do: the files it replaces (the certificate, its chain, the old key), the service it reloads, the port
# that must then serve it - or why a person installs it (a keystore, a service that needs a restart, the file
# replaced since ...). Reads only, here and in ServiceNow.
#
# Something to install: the plan goes to the approval and the install job (set_stats cert_install_plan) and this
# job FAILS on purpose - "NEEDS APPROVAL" - so the workflow takes its "Run on fail" path:
#
#   [Certificate install - check] --Run on fail--> [Approval] --Run on success--> [Certificate install - approved]
#
# Credentials: Machine (sudo) and ServiceNow API (the account that orders the certificates). docs/CERT_INSTALL.md
#   ansible-playbook playbooks/cert_install_check.yml
- name: Certificate install - the renewals waiting on each host
  hosts: "{{ target | default('all') }}"
  become: true
  gather_facts: false
  pre_tasks:
    - name: Linux hosts only
      ansible.builtin.include_role:
        name: site_findings
        tasks_from: os_guard.yml

    - name: Not the hosts in cert_skip_hosts or cert_skip_groups (Satellite renews its own certificates)
      ansible.builtin.include_role:
        name: check_certs
        tasks_from: skip.yml

    - name: A host that cannot be reached is listed and left out - the job is not failed for it (site_unreachable_fails)
      ansible.builtin.include_role:
        name: site_findings
        tasks_from: reach.yml
  tasks:
    - name: The renewals waiting for their certificate
      ansible.builtin.include_role:
        name: check_certs
        tasks_from: install_pending.yml

- name: Certificate install - the issued certificates, from the requests
  # on the hosts, once on the AAP side (run_once, delegated to localhost): a Limit of hosts needs no localhost
  hosts: "{{ target | default('all') }}"
  gather_facts: false
  tasks:
    - name: Each CSR's request, and the certificate the PKI put there
      ansible.builtin.include_role:
        name: servicenow
        tasks_from: cert_issued.yml
        apply:
          delegate_to: localhost
          run_once: true
          become: false
      vars:
        ansible_connection: local
        ansible_python_interpreter: "{{ ansible_playbook_python }}"

- name: Certificate install - what installing each would do
  hosts: "{{ target | default('all') }}"
  become: true
  gather_facts: false
  tasks:
    - name: The plan for each issued certificate
      ansible.builtin.include_role:
        name: check_certs
        tasks_from: install_plan.yml
      when: cert_install_pending is defined

- name: Certificate install - the plan, for the approval
  # on the hosts, once on the AAP side (run_once, delegated to localhost): a Limit of hosts needs no localhost
  hosts: "{{ target | default('all') }}"
  gather_facts: false
  tasks:
    - name: What is ready to install, and the approval
      ansible.builtin.include_role:
        name: servicenow
        tasks_from: cert_install_plan.yml
        apply:
          delegate_to: localhost
          run_once: true
          become: false
      vars:
        ansible_connection: local
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
