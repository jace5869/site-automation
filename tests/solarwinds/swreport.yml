---
# 1.97.0: site_findings' report step with SolarWinds (_swr_mode: health or troubleshoot, -e swr_mode=...) on hosts that
# have fixed findings, the report website written (report_web_dest). run_swreport_test.sh checks the job's lines and the
# page's sections. The hosts connect locally; the SolarWinds read runs once, on the controller.
- name: Report step with SolarWinds
  hosts: servers
  gather_facts: false
  vars:
    _swr_mode: "{{ swr_mode | default('health') }}"
  tasks:
    - name: The findings, as the check roles leave them
      ansible.builtin.set_fact:
        site_findings: "{{ fs[inventory_hostname] | default([]) }}"
        site_checks_run: [disk, services]
        site_act_result: {}

    - name: Report
      ansible.builtin.include_role:
        name: site_findings
        tasks_from: report.yml
      vars:
        site_syslog: false
        site_fail_on: []
        site_report_title: "{{ 'Troubleshoot web01' if _swr_mode == 'troubleshoot' else 'Health check' }}"
