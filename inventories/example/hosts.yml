# EXAMPLE inventory - placeholders only. Copy this folder to inventories/site/ in your work Git,
# put in your real host names, and point an AAP inventory source at it (docs/SETUP_AAP.md,
# step 4). Secrets never go here: see docs/SECRETS.md.
#
# A group is just a name for a set of hosts. Playbooks and settings (group_vars/<group>.yml)
# use them:
#   rhel_all          every Linux host - the health checks run here by default
#   mariadb_hosts     hosts whose MariaDB the mariadb check looks at
#   patch_hosts       hosts patch_hosts.yml may patch
#   no_patch          never patched by automation (skipped even when targeted)
#   aap_hosts         AAP itself: checked, never auto-fixed, never patched or rebooted by a job
all:
  children:
    rhel_all:
      children:
        stigman_hosts:
          hosts:
            stigman01.example.mil:
        servicenow_db_hosts:          # ServiceNow MariaDB (rootful podman)
          hosts:
            snowdb01.example.mil:
        servicenow_mid_hosts:         # ServiceNow MID Server(s)
          hosts:
            mid01.example.mil:
        netapp_console_hosts:         # NetApp Console (rootful podman, vendor-managed containers)
          hosts:
            netapp01.example.mil:
        aap_hosts:                    # AAP itself (rootless podman): diagnose only, never auto-fixed
          hosts:
            aap01.example.mil:
              podman_user: aap        # the account AAP was installed under

    # MariaDB health checks run on these hosts
    mariadb_hosts:
      children:
        servicenow_db_hosts:

    # patch_hosts.yml may patch these (one at a time)
    patch_hosts:
      children:
        stigman_hosts:
        servicenow_mid_hosts:

    # Never patched by automation: vendor-managed appliances, and AAP itself (patch it by hand in
    # a maintenance window - package scripts can restart services under the running job).
    # patch_hosts.yml skips these even if a job targets them.
    no_patch:
      children:
        netapp_console_hosts:
        aap_hosts:
