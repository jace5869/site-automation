# AAP itself. Checked like every host. Built in, whatever any setting says: ACT never fixes anything
# here, and patch_hosts.yml never patches or reboots it (roles/patch/vars, roles/site_act/vars).
check_disk_overrides:
  /var: {warn: 80, crit: 90}                    # AAP's job output and container images live here
check_certs_endpoints:
  - {name: AAP web UI, host: 127.0.0.1, port: 443, servername: aap01.example.mil}
