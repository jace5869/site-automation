# EXAMPLE Windows inventory - placeholders only. In AAP you make a separate inventory (e.g.
# "Windows servers"); this file only shows what goes where. See docs/WINDOWS.md.
#
# The connection settings (the `vars` of `all` below) go in that inventory's Variables box.
# Secrets never go here: the account and password come from an AAP Machine credential.
all:
  vars:
    ansible_connection: winrm
    ansible_port: 5986
    ansible_winrm_scheme: https
    ansible_winrm_transport: ntlm                  # or kerberos (needs Kerberos in the execution environment)
    ansible_winrm_server_cert_validation: validate # the hosts' WinRM certificates are checked against this CA file (docs/WINDOWS.md, step 4):
    # ansible_winrm_ca_trust_path: /etc/pki/ca-trust/source/anchors/site-ca.pem
    # ignore (no check) is for a short lab test only
  children:
    win_dc:                                        # domain controllers
      hosts:
        dc01.example.mil:
    win_web:                                       # IIS web servers
      hosts:
        web01.example.mil:
      vars:
        win_check_services_required_extra: [W3SVC, WAS]
    win_app:
      hosts:
        app01.example.mil:
    servicenow_mid_hosts:                          # ServiceNow MID Servers: checked by playbooks/servicenow_health.yml
      hosts:
        mid01.example.mil:
      vars:
        log_analysis_profiles: [mid_server]        # playbooks/log_analysis.yml reads their agent and wrapper logs
        # servicenow_mid_service_match: "snc_mid*"  # the services' names, if yours are named otherwise
    win_patch_hosts:                               # the servers playbooks/win_patch.yml may patch
      children:
        win_web:
        win_app:
