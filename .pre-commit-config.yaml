# Optional but recommended: block commits that contain secrets.
#   pip install pre-commit && pre-commit install
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: check-public
        name: only placeholder host names and documentation IP addresses
        entry: python3 tests/check_public.py
        language: system
        pass_filenames: false
