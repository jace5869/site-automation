[defaults]
# Site roles first, then the ACT roles vendored from an ACT-Linux release (scripts/update-act.sh).
roles_path = roles:vendor/act/ansible/roles
inventory = inventories/example/hosts.yml
interpreter_python = auto_silent
# Small filters that ship with this repo (plugins/filter/), e.g. reading the POA&M CSV.
filter_plugins = plugins/filter
# Code the modules share (plugins/module_utils/), e.g. AAP's own API (site_aap.py).
module_utils = plugins/module_utils
# Never let a secret reach the terminal/job output through diff or argument display.
display_args_to_stdout = False
retry_files_enabled = False

[diff]
always = False
